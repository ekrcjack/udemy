></ruby>います。","rj":"Ie ni neko ga sanbiki imasu.","say":"家に猫が3匹います。"},{"en":"We bought three umbrellas.","jp":"<ruby>傘<rt>かさ</rt></ruby>を3<ruby>本<rt>ぼん</rt></ruby><ruby>買<rt>か</rt></ruby>いました。","rj":"Kasa o sanbon kaimashita.","say":"傘を3本買いました。"},{"en":"There are as many as three cats in our house!","jp":"<ruby>家<rt>いえ</rt></ruby>に<ruby>猫<rt>ねこ</rt></ruby>が3<ruby>匹<rt>びき</rt></ruby>もいます。","rj":"Ie ni neko ga sanbiki mo imasu.","say":"家に猫が3匹もいます。"},{"en":"We bought as many as three umbrellas.","jp":"<ruby>傘<rt>かさ</rt></ruby>を3<ruby>本<rt>ぼん</rt></ruby>も<ruby>買<rt>か</rt></ruby>いました。","rj":"Kasa o sanbon mo kaimashita.","say":"傘を3本も買いました。"},{"en":"There are only three cats in our house!","jp":"<ruby>家<rt>いえ</rt></ruby>に<ruby>猫<rt>ねこ</rt></ruby>が3<ruby>匹<rt>びき</rt></ruby>しかいません。","rj":"Ie ni neko ga sanbiki shika imasen.","say":"家に猫が3匹しかいません。"},{"en":"We bought only three umbrellas.","jp":"<ruby>傘<rt>かさ</rt></ruby>を3<ruby>本<rt>ぼん</rt></ruby>しか<ruby>買<rt>か</rt></ruby>いませんでした。","rj":"Kasa o sanbon shika kaimasen deshita.","say":"傘を3本しか買いませんでした。"},{"en":"I only have two dogs.","jp":"<ruby>犬<rt>いぬ</rt></ruby>が2<ruby>匹<rt>にひき</rt></ruby>しかいません。","rj":"Inu ga nihiki shika imasen.","say":"犬が2匹しかいません。"},{"en":"I ate as many as 5 onigiris.","jp":"おにぎりを5<ruby>個<rt>ごこ</rt></ruby>も<ruby>食<rt>た</rt></ruby>べました。","rj":"Onigiri o goko mo tabemashita.","say":"おにぎりを5個も食べました。"},{"en":"Do you only have 1 car?","jp":"<ruby>車<rt>くるま</rt></ruby>が1<ruby>台<rt>いちだい</rt></ruby>しかありませんか？","rj":"Kuruma ga ichidai shika arimasen ka?","say":"車が1台しかありませんか？"}]},{"num":202,"title":"Volitional form","vocab":[{"t":"結婚する（けっこんする）","m":"kekkon suru 意思：結婚 (to marry)","say":"結婚する（けっこんする）"},{"t":"手伝う（てつだう）","m":"tetsudau 意思：幫忙 (to help)","say":"手伝う（てつだう）"},{"t":"カレー（かれー）","m":"kare- 意思：咖哩 (curry)","say":"カレー（かれー）"},{"t":"予約する（よやくする）","m":"yoyaku suru 意思：預約 (to make a reservation)","say":"予約する（よやくする）"},{"t":"招待する（しょうたいする）","m":"shoutai suru 意思：邀請 (to invite)","say":"招待する（しょうたいする）"}],"grammar":["<b>意向形是什麼？跟「ましょう」有什麼關係？</b><br><br>意向形是「ましょう」的常體（更口語、較不正式）版本，用來向熟識的朋友提議計畫，相當於中文的「…吧！」。","<b>動詞要怎麼變成意向形？</b><br><br>Ru-verb（一段動詞）：去掉語尾「る」，加上「よう」（食べる→食べよう）。U-verb（五段動詞）：去掉語尾う段音，改為お段音＋う（行く→行こう）。不規則動詞：くる→こよう、する→しよう。","<b>「意向形＋か」是什麼意思？</b><br><br>用來表示提議或詢問對方意願（「要不要一起…？」）。例如：手伝（てつだ）おうか？（要不要我幫你？）","<b>「意向形＋と思っています」與「意向形＋と思います」有什麼差別？</b><br><br>と思っています 表示這個決定是之前就已經做好的（比較像「我打算…」）；と思います 表示這個決定是說話當下才臨時決定的（比較像「我想我會…」）。"],"example":[{"en":"Let's go eat somewhere tonight!","jp":"<ruby>今夜<rt>こんや</rt></ruby>どこかに<ruby>食<rt>た</rt></ruby>べに<ruby>行<rt>い</rt></ruby>こう。","rj":"Kon'ya dokoka ni tabe ni ikou.","say":"今夜どこかに食べに行こう。"},{"en":"Let's get married!","jp":"<ruby>結婚<rt>けっこん</rt></ruby>しよう。","rj":"Kekkon shiyou.","say":"結婚しよう。"},{"en":"May I help you?","jp":"<ruby>手伝<rt>てつだ</rt></ruby>おうか？","rj":"Tetsudaou ka?","say":"手伝おうか？"},{"en":"Shall we watch this film?","jp":"この<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ようか。","rj":"Kono eiga o miyou ka.","say":"この映画を見ようか。"},{"en":"When shall we meet again?","jp":"<ruby>今度<rt>こんど</rt></ruby>いつ<ruby>会<rt>あ</rt></ruby>おうか？","rj":"Kondo itsu aou ka?","say":"今度いつ会おうか？"},{"en":"I've decided to study Japanese everyday.","jp":"<ruby>毎日<rt>まいにち</rt></ruby><ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しようと<ruby>思<rt>おも</rt></ruby>っています。","rj":"Mainichi nihongo o benkyou shiyou to omotte imasu.","say":"毎日日本語を勉強しようと思っています。"},{"en":"I've decided to have curry for dinner.","jp":"<ruby>夜<rt>よる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>にカレーを<ruby>食<rt>た</rt></ruby>べようと<ruby>思<rt>おも</rt></ruby>っています。","rj":"Yorugohan ni kare- o tabeyou to omotte imasu.","say":"夜ご飯にカレーを食べようと思っています。"},{"en":"I will buy a kanji dictionary.","jp":"<ruby>漢字<rt>かんじ</rt></ruby>の<ruby>辞書<rt>じしょ</rt></ruby>を<ruby>買<rt>か</rt></ruby>おうと<ruby>思<rt>おも</rt></ruby>います。","rj":"Kanji no jisho o kaou to omoimasu.","say":"漢字の辞書を買おうと思います。"},{"en":"Let's eat at the restaurant tonight.","jp":"<ruby>今夜<rt>こんや</rt></ruby>レストランで<ruby>食<rt>た</rt></ruby>べよう。","rj":"Kon'ya resutoran de tabeyou.","say":"今夜レストランで食べよう。"},{"en":"Sounds good! Let's make a reservation, shall we?","jp":"いいね！<ruby>予約<rt>よやく</rt></ruby>しようか？","rj":"Ii ne! Yoyaku shiyou ka?","say":"いいね！予約しようか？"},{"en":"Yes, Let's invite Michiko, too.","jp":"はい。みちこも<ruby>招待<rt>しょうたい</rt></ruby>しよう。","rj":"Hai. Michiko mo shoutai shiyou.","say":"はい。みちこも招待しよう。"},{"en":"Sure, How shall we go (there)?","jp":"もちろん、どうやって<ruby>行<rt>い</rt></ruby>こうか？","rj":"Mochiron, dou yatte ikou ka?","say":"もちろん、どうやって行こうか？"},{"en":"I was thinking going there by taxi.","jp":"タクシーで<ruby>行<rt>い</rt></ruby>こうと<ruby>思<rt>おも</rt></ruby>います。","rj":"Takushii de ikou to omoimasu.","say":"タクシーで行こうと思います。"},{"en":"Okay, I think I will go by taxi too, then!","jp":"それなら、<ruby>私<rt>わたし</rt></ruby>もタクシーで<ruby>行<rt>い</rt></ruby>こうと<ruby>思<rt>おも</rt></ruby>います。","rj":"Sorenara, watashi mo takushi- de ikou to omoimasu.","say":"それなら、私もタクシーで行こうと思います。"}]},{"num":203,"title":"〜ておく","vocab":[{"t":"ストーブ（すとーぶ）","m":"suto-bu 意思：暖爐 (heater)","say":"ストーブ（すとーぶ）"},{"t":"つける（つける）","m":"tsukeru 意思：打開（開關） (to turn on)","say":"つける（つける）"},{"t":"ホテル（ほてる）","m":"hoteru 意思：飯店 (hotel)","say":"ホテル（ほてる）"},{"t":"北海道（ほっかいどう）","m":"hokkaidou 意思：北海道 (Hokkaido)","say":"北海道（ほっかいどう）"},{"t":"確認する（かくにんする）","m":"kakunin suru 意思：確認 (to check)","say":"確認する（かくにんする）"},{"t":"電車（でんしゃ）","m":"densha 意思：電車 (train)","say":"電車（でんしゃ）"},{"t":"デート（でーと）","m":"de-to 意思：約會 (date)","say":"デート（でーと）"},{"t":"見つける（みつける）","m":"mitsukeru 意思：找到 (to find, look for)","say":"見つける（みつける）"}],"grammar":["<b>動詞て形＋おく 是什麼意思？</b><br><br>表示「為了某個目的而事先做準備」的動作，相當於中文「事先做好…」。おく 依 u-verb（五段動詞）規則變化。","<b>〜ておく 的長體、常體時態變化是什麼？</b><br><br>長體：〜ておきます／〜ておきません／〜ておきました／〜ておきませんでした。常體：〜ておく／〜ておかない／〜ておいた／〜ておかなかった。"],"example":[{"en":"Since there will be an exam tomorrow, I will study (for it) tonight.","jp":"<ruby>明日<rt>あした</rt></ruby><ruby>試験<rt>しけん</rt></ruby>があるので、<ruby>今晩<rt>こんばん</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>しておきます。","rj":"Ashita shiken ga aru node, konban benkyou shite okimasu.","say":"明日試験があるので、今晩勉強しておきます。"},{"en":"I turned the heater on, because it was going to get colder.","jp":"<ruby>寒<rt>さむ</rt></ruby>くなるから、ストーブをつけておきました。","rj":"Samuku naru kara, suto-bu o tsukete okimashita.","say":"寒くなるから、ストーブをつけておきました。"},{"en":"I must make a hotel reservation in advance.","jp":"ホテルを<ruby>予約<rt>よやく</rt></ruby>しておかなくちゃいけません。","rj":"Hoteru o yoyaku shite okanakuchaikemasen.","say":"ホテルを予約しておかなくちゃいけません。"},{"en":"Because I will go to Hokkaido next week, I will book a hotel.","jp":"<ruby>来週<rt>らいしゅう</rt></ruby><ruby>北海道<rt>ほっかいどう</rt></ruby>に<ruby>行<rt>い</rt></ruby>くので、ホテルを<ruby>予約<rt>よやく</rt></ruby>しておきます。","rj":"Raishuu Hokkaidou ni iku node, hoteru o yoyaku shite okimasu.","say":"来週北海道に行くので、ホテルを予約しておきます。"},{"en":"Because I will go to Tokyo by train, I will check the time of the train.","jp":"<ruby>電車<rt>でんしゃ</rt></ruby>で<ruby>東京<rt>とうきょう</rt></ruby>に<ruby>行<rt>い</rt></ruby>くので、<ruby>電車<rt>でんしゃ</rt></ruby>の<ruby>時間<rt>じかん</rt></ruby>を<ruby>確認<rt>かくにん</rt></ruby>しておきます。","rj":"Densha de Toukyou ni iku node, densha no jikan o kakunin shite okimasu.","say":"電車で東京に行くので、電車の時間を確認しておきます。"},{"en":"Because I had a date, I looked for a nice restaurant.","jp":"デートがあったので、いいレストランを<ruby>見<rt>み</rt></ruby>つけておきました。","rj":"Deeto ga atta node, ii resutoran o mitsukete okimashita.","say":"デートがあったので、いいレストランを見つけておきました。"}]},{"num":204,"title":"Using Sentences to Qualify Nouns","vocab":[{"t":"彼氏（かれし）","m":"kareshi 意思：男朋友 (boyfriend)","say":"彼氏（かれし）"},{"t":"彼女（かのじょ）","m":"kanojo 意思：女朋友 (girlfriend)","say":"彼女（かのじょ）"},{"t":"感動する（かんどうする）","m":"kandou suru 意思：感動 (to be impressed, moved)","say":"感動する（かんどうする）"},{"t":"撮る（とる）","m":"toru 意思：拍（照） (to take (a photo))","say":"撮る（とる）"},{"t":"借りる（かりる）","m":"kariru 意思：借（入） (to borrow)","say":"借りる（かりる）"},{"t":"住む（すむ）","m":"sumu 意思：居住 (to live)","say":"住む（すむ）"},{"t":"観る（みる）","m":"miru 意思：觀看 (to watch)","say":"観る（みる）"},{"t":"テレビ番組（てれびばんぐみ）","m":"terebi bangumi 意思：電視節目 (TV show)","say":"テレビ番組（てれびばんぐみ）"}],"grammar":["<b>日文要怎麼用一整個句子來修飾名詞（像英文的關係子句）？</b><br><br>如同い形容詞可以修飾名詞，日文也可以用[句子（常體）]＋名詞 的形式，把一整句話當作形容詞修飾名詞，相當於中文的「…的」或英文的關係子句（that／which／who）。例如：昨日（きのう）買（か）った　本（ほん）（昨天買的書）。","<b>修飾句中的主語，為什麼用「が」而不用「は」？</b><br><br>[Subject が＋動詞（常體）]＋名詞。這是固定規則：修飾句中的主語一律用「が」，不用「は」。「修飾句＋名詞」整體視為一個大名詞片語，可以放在句子中任何名詞能出現的位置（當主語、受詞、補語等）。"],"example":[{"en":"This is a book that my girlfriend gave me on my birthday last year.","jp":"これは<ruby>去年<rt>きょねん</rt></ruby>の<ruby>誕生日<rt>たんじょうび</rt></ruby>に<ruby>彼女<rt>かのじょ</rt></ruby>がくれた<ruby>本<rt>ほん</rt></ruby>です。","rj":"Kore wa kyonen no tanjoubi ni kanojo ga kureta hon desu.","say":"これは去年の誕生日に彼女がくれた本です。"},{"en":"My father gave me a book that Haruki Murakami wrote.","jp":"<ruby>父<rt>ちち</rt></ruby>が<ruby>村上春樹<rt>むらかみはるき</rt></ruby>がかいた<ruby>本<rt>ほん</rt></ruby>をくれました。","rj":"Chichi ga Murakami Haruki ga kaita hon o kuremashita.","say":"父が村上春樹がかいた本をくれました。"},{"en":"The movie I was touched by the most is \"To Live.\"","jp":"<ruby>私<rt>わたし</rt></ruby>が<ruby>一番<rt>いちばん</rt></ruby><ruby>感動<rt>かんどう</rt></ruby>した<ruby>映画<rt>えいが</rt></ruby>は「<ruby>生<rt>い</rt></ruby>きる」です。","rj":"Watashi ga ichiban kandou shita eiga wa \"Ikiru\" desu.","say":"私が一番感動した映画は「生きる」です。"},{"en":"This is a photo I took in Nara.","jp":"これは<ruby>奈良<rt>なら</rt></ruby>で<ruby>撮<rt>と</rt></ruby>った<ruby>写真<rt>しゃしん</rt></ruby>です。","rj":"Kore wa Nara de totta shashin desu.","say":"これは奈良で撮った写真です。"},{"en":"This is the bus that goes to Tokyo.","jp":"これは<ruby>東京<rt>とうきょう</rt></ruby>に<ruby>行<rt>い</rt></ruby>くバスです。","rj":"Kore wa Toukyou ni iku basu desu.","say":"これは東京に行くバスです。"},{"en":"This is the hotel Ken stayed at last year.","jp":"これは<ruby>去年<rt>きょねん</rt></ruby>けんが<ruby>泊<rt>と</rt></ruby>まったホテルです。","rj":"Kore wa kyonen Ken ga tomatta hoteru desu.","say":"これは去年けんが泊まったホテルです。"},{"en":"This is a book I borrowed from a friend.","jp":"これは<ruby>友達<rt>ともだち</rt></ruby>から<ruby>借<rt>か</rt></ruby>りた<ruby>本<rt>ほん</rt></ruby>です。","rj":"Kore wa tomodachi kara karita hon desu.","say":"これは友達から借りた本です。"},{"en":"This is the TV show that I often watch.","jp":"これはよく<ruby>観<rt>み</rt></ruby>るテレビ<ruby>番組<rt>ばんぐみ</rt></ruby>です。","rj":"Kore wa yoku miru terebi bangumi desu.","say":"これはよく観るテレビ番組です。"},{"en":"This is a friend who lives in Osaka.","jp":"これは<ruby>大阪<rt>おおさか</rt></ruby>に<ruby>住<rt>す</rt></ruby>んでいる<ruby>友達<rt>ともだち</rt></ruby>です。","rj":"Kore wa Oosaka ni sunde iru tomodachi desu.","say":"これは大阪に住んでいる友達です。"}]},{"num":206,"title":"〜してあげる","vocab":[{"t":"貸す（かす）","m":"kasu 意思：借出 (to lend)","say":"貸す（かす）"},{"t":"連れて行く（つれていく）","m":"tsurete iku 意思：帶（某人）去 (to take (someone somewhere))","say":"連れて行く（つれていく）"},{"t":"手伝う（てつだう）","m":"tetsudau 意思：幫忙 (to help)","say":"手伝う（てつだう）"},{"t":"奢る（おごる）","m":"ogoru 意思：請客 (to treat (someone))","say":"奢る（おごる）"},{"t":"買い物（かいもの）","m":"kaimono 意思：購物 (shopping)","say":"買い物（かいもの）"},{"t":"宿題（しゅくだい）","m":"shukudai 意思：作業 (homework)","say":"宿題（しゅくだい）"},{"t":"病院（びょういん）","m":"byouin 意思：醫院 (hospital)","say":"病院（びょういん）"},{"t":"教える（おしえる）","m":"oshieru 意思：教 (to teach)","say":"教える（おしえる）"},{"t":"コーヒー（こーひー）","m":"ko-hi- 意思：咖啡 (coffee)","say":"コーヒー（こーひー）"}],"grammar":["<b>動詞て形＋あげる 是什麼意思？</b><br><br>表示「我」為「你／他人」做某事，或「他人」為「他人」做某事，方向是「我」→「你」／「我」→「他人」／「你」→「他人」／「他人」→「他人」。加上 あげる 並不會改變句子的基本意思，而是強調這個動作是應對方要求、或作為一種恩惠而做的。","<b>受益者要用什麼助詞？</b><br><br>受益者所搭配的助詞，依主要動詞原本要求的助詞而定，不會因為加了 あげる 而改變。例如「貸す」搭配「に」：妹（いもうと）に　お金（かね）を　かしてあげました。","<b>為什麼很多時候要避免直接用「てあげる」？</b><br><br>てあげる 帶有「施恩」的語感，若對象是尊長或不熟的人，直接說「〜てあげます」可能顯得自誇、不禮貌，因此許多情境下，單純用普通的動詞句（不加 あげる）反而更自然、更客氣。","<b>如果動詞本身沒有「受益者」的位置，該怎麼辦？</b><br><br>可以用「〜のために」加上「為了…」的語意：(人)のために＋[動詞て形]あげる。例如：ともこのために　買（か）い物（もの）に　行（い）きました。"],"example":[{"en":"I (kindly) lent my sister money (on demand).","jp":"<ruby>妹<rt>いもうと</rt></ruby>にお<ruby>金<rt>かね</rt></ruby>をかしてあげました。","rj":"Imouto ni okane o kashite agemashita.","say":"妹にお金をかしてあげました。"},{"en":"Kyoko (kindly) took Tom to the station (as a favour).","jp":"きょうこはトムを<ruby>駅<rt>えき</rt></ruby>に<ruby>連<rt>つ</rt></ruby>れて<ruby>行<rt>い</rt></ruby>ってあげました。","rj":"Kyouko wa Tomu o eki ni tsurete itte agemashita.","say":"きょうこはトムを駅に連れて行ってあげました。"},{"en":"I went shopping for Tomoko.","jp":"ともこのために<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","rj":"Tomoko no tame ni kaimono ni ikimashita.","say":"ともこのために買い物に行きました。"},{"en":"I (kindly) helped Ken with his homework.","jp":"けんのために<ruby>宿題<rt>しゅくだい</rt></ruby>を<ruby>手伝<rt>てつだ</rt></ruby>ってあげました。","rj":"Ken no tame ni shukudai o tetsudatte agemashita.","say":"けんのために宿題を手伝ってあげました。"},{"en":"I (kindly) took Tomo to the hospital.","jp":"ともを<ruby>病院<rt>びょういん</rt></ruby>に<ruby>連<rt>つ</rt></ruby>れて<ruby>行<rt>い</rt></ruby>ってあげました。","rj":"Tomo o byouin ni tsurete itte agemashita.","say":"ともを病院に連れて行ってあげました。"},{"en":"Takeshi (kindly) taught Japanese to Mary.","jp":"たけしはメアリーに<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてあげました。","rj":"Takeshi wa Meari- ni nihongo o oshiete agemashita.","say":"たけしはメアリーに日本語を教えてあげました。"},{"en":"Did you (kindly) treat Momo a coffee?","jp":"ももにコーヒーをおごってあげましたか？","rj":"Momo ni ko-hi- o ogotte agemashita ka?","say":"ももにコーヒーをおごってあげましたか？"}]},{"num":207,"title":"〜してくれる","vocab":[{"t":"送る（おくる）","m":"okuru 意思：寄送 (to send)","say":"送る（おくる）"},{"t":"クッキー（くっきー）","m":"kukki- 意思：餅乾 (cookies)","say":"クッキー（くっきー）"},{"t":"掃除する（そうじする）","m":"souji suru 意思：打掃 (to clean)","say":"掃除する（そうじする）"},{"t":"説明する（せつめいする）","m":"setsumei suru 意思：說明 (to explain)","say":"説明する（せつめいする）"},{"t":"文法（ぶんぽう）","m":"bunpou 意思：文法 (grammar)","say":"文法（ぶんぽう）"},{"t":"料理する（りょうりする）","m":"ryouri suru 意思：做菜 (to cook)","say":"料理する（りょうりする）"}],"grammar":["<b>動詞て形＋くれる 是什麼意思？</b><br><br>表示「他人（Others／You）為我（I）做某事」，方向為「他人」→「你」→「我」。","<b>為什麼 くれる 句常常省略受益者？</b><br><br>くれる 句中的受益者幾乎都預設是說話者本人，因此文法上通常不需要特別寫出來。","<b>如果需要明確指出受益者，該怎麼做？</b><br><br>作法與 あげる 相同：若主要動詞本身有「對象」的位置，保留該動詞原本要求的助詞（如「連れて行く」要求を：きょうこが私を駅に連れて行ってくれました）；若動詞本身沒有「對象」的位置（如「掃除する」），則用「〜のために」。"],"example":[{"en":"A friend helps me with my homework (for which, I am grateful).","jp":"<ruby>友達<rt>ともだち</rt></ruby>が<ruby>宿題<rt>しゅくだい</rt></ruby>を<ruby>手伝<rt>てつだ</rt></ruby>ってくれます。","rj":"Tomodachi ga shukudai o tetsudatte kuremasu.","say":"友達が宿題を手伝ってくれます。"},{"en":"A relative (kindly) sent me cookies (and I appreciate it).","jp":"<ruby>親戚<rt>しんせき</rt></ruby>がクッキーを<ruby>送<rt>おく</rt></ruby>ってくれました。","rj":"Shinseki ga kukki- o okutte kuremashita.","say":"親戚がクッキーを送ってくれました。"},{"en":"Kyoko (kindly) took me to the station.","jp":"きょうこが<ruby>私<rt>わたし</rt></ruby>を<ruby>駅<rt>えき</rt></ruby>に<ruby>連<rt>つ</rt></ruby>れて<ruby>行<rt>い</rt></ruby>ってくれました。","rj":"Kyouko ga watashi o eki ni tsurete itte kuremashita.","say":"きょうこが私を駅に連れて行ってくれました。"},{"en":"Takeshi (kindly) taught me that Kanji.","jp":"たけしが<ruby>私<rt>わたし</rt></ruby>に<ruby>漢字<rt>かんじ</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれました。","rj":"Takeshi ga watashi ni kanji o oshiete kuremashita.","say":"たけしが私に漢字を教えてくれました。"},{"en":"Ken (kindly) cleaned the room for me.","jp":"けんが<ruby>私<rt>わたし</rt></ruby>のために<ruby>掃除<rt>そうじ</rt></ruby>してくれました。","rj":"Ken ga watashi no tame ni souji shite kuremashita.","say":"けんが私のために掃除してくれました。"},{"en":"My older sister sometimes lends me her car.","jp":"<ruby>姉<rt>あね</rt></ruby>はたまに<ruby>車<rt>くるま</rt></ruby>をかしてくれます。","rj":"Ane wa tamani kuruma o kashite kuremasu.","say":"姉はたまに車をかしてくれます。"},{"en":"Taro kindly explained me the grammar.","jp":"たろうは<ruby>文法<rt>ぶんぽう</rt></ruby>を<ruby>説明<rt>せつめい</rt></ruby>してくれました。","rj":"Tarou wa bunpou o setsumei shite kuremashita.","say":"たろうは文法を説明してくれました。"},{"en":"Mary cooked dinner for us.","jp":"メアリーは<ruby>私<rt>わたし</rt></ruby>たちのために<ruby>夜<rt>よる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>料理<rt>りょうり</rt></ruby>してくれました。","rj":"Meari- wa watashitachi no tame ni yorugohan o ryouri shite kuremashita.","say":"メアリーは私たちのために夜ご飯を料理してくれました。"}]},{"num":208,"title":"〜してもらう","vocab":[{"t":"知らない人（しらないひと）","m":"shiranai hito 意思：陌生人 (stranger)","say":"知らない人（しらないひと）"},{"t":"歌（うた）","m":"uta 意思：歌 (song)","say":"歌（うた）"},{"t":"歌う（うたう）","m":"utau 意思：唱歌 (to sing)","say":"歌う（うたう）"},{"t":"読む（よむ）","m":"yomu 意思：讀、唸 (to read)","say":"読む（よむ）"},{"t":"郵便局（ゆうびんきょく）","m":"yuubinkyoku 意思：郵局 (post office)","say":"郵便局（ゆうびんきょく）"},{"t":"写真（しゃしん）","m":"shashin 意思：照片 (photo)","say":"写真（しゃしん）"}],"grammar":["<b>動詞て形＋もらう 是什麼意思？</b><br><br>表示「我得到／請託／說服某人為我做某事」，也就是「我接受別人的恩惠」。句型：X は　(Person)に　[動詞て形]＋もらう。動作實際執行者用助詞「に」標示。","<b>〜てもらう 跟 〜てくれる 的差別在哪裡？</b><br><br>兩者描述同一件事，但主語不同：もらう 的主語是受益者（我），くれる 的主語是施惠者。例如：私は友達に宿題を手伝ってもらいました。（もらう視角）／友達が宿題を手伝ってくれました。（くれる視角）。","<b>〜てもらう 還有什麼補充用法？</b><br><br>有時 もらう 句只是單純表達「很慶幸有人幫我做了這件事」，即使我方並未主動開口拜託，也可以使用，語感接近「幸虧有人幫我…」。"],"example":[{"en":"I got a friend of mine to help me with my homework.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>友達<rt>ともだち</rt></ruby>に<ruby>宿題<rt>しゅくだい</rt></ruby>を<ruby>手伝<rt>てつだ</rt></ruby>ってもらいました。","rj":"Watashi wa tomodachi ni shukudai o tetsudatte moraimashita.","say":"私は友達に宿題を手伝ってもらいました。"},{"en":"I am glad that a stranger read the kanji for me.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>知<rt>し</rt></ruby>らない<ruby>人<rt>ひと</rt></ruby>に<ruby>漢字<rt>かんじ</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでもらいました。","rj":"Watashi wa shiranai hito ni kanji o yonde moraimashita.","say":"私は知らない人に漢字を読んでもらいました。"},{"en":"I had Ken teach me Japanese.","jp":"<ruby>私<rt>わたし</rt></ruby>はけんに<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてもらいました。","rj":"Watashi wa Ken ni nihongo o oshiete moraimashita.","say":"私はけんに日本語を教えてもらいました。"},{"en":"I will have Mary sing a song.","jp":"<ruby>私<rt>わたし</rt></ruby>はメアリーに<ruby>歌<rt>うた</rt></ruby>を<ruby>歌<rt>うた</rt></ruby>ってもらいます。","rj":"Watashi wa Meari- ni uta o utatte moraimasu.","say":"私はメアリーに歌を歌ってもらいます。"},{"en":"I will have Tomo take me to the post office.","jp":"<ruby>私<rt>わたし</rt></ruby>はともに<ruby>郵便局<rt>ゆうびんきょく</rt></ruby>に<ruby>連<rt>つ</rt></ruby>れて<ruby>行<rt>い</rt></ruby>ってもらいます。","rj":"Watashi wa Tomo ni yuubinkyoku ni tsurete itte moraimasu.","say":"私はともに郵便局に連れて行ってもらいます。"},{"en":"I had Mako take a photo of me.","jp":"<ruby>私<rt>わたし</rt></ruby>はまこに<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>ってもらいました。","rj":"Watashi wa Mako ni shashin o totte moraimashita.","say":"私はまこに写真を撮ってもらいました。"}]},{"num":209,"title":"〜ていただけませんか","vocab":[{"t":"待つ（まつ）","m":"matsu 意思：等待 (to wait)","say":"待つ（まつ）"},{"t":"とる（とる）","m":"toru 意思：拿取 (to pick up)","say":"とる（とる）"},{"t":"起こす（おこす）","m":"okosu 意思：叫醒 (to wake (someone) up)","say":"起こす（おこす）"},{"t":"推薦状（すいせんじょう）","m":"suisenjou 意思：推薦信 (letter of recommendation)","say":"推薦状（すいせんじょう）"},{"t":"翻訳する（ほんやくする）","m":"honyaku suru 意思：翻譯 (to translate)","say":"翻訳する（ほんやくする）"}],"grammar":["<b>日文有哪些常見的請求句型，禮貌程度怎麼排列？</b><br><br>由禮貌到隨性依序是：〜ていただけませんか？（最禮貌）＞〜てくださいませんか？＞〜てもらえませんか？＞〜てくれませんか？（中等）＞〜てもらえない？＞〜てくれない？（最隨性，同輩朋友之間）。","<b>〜ていただけませんか 怎麼用？</b><br><br>[動詞て形]＋いただけませんか？用於向長輩、陌生人請求幫忙，比〜てください更客氣。例如：手伝（てつだ）っていただけませんか？（能否請您幫我一個忙？）","<b>〜てくれない？ 這種最隨性的說法什麼時候用？</b><br><br>[動詞て形]＋くれない？用於同輩朋友之間非常輕鬆隨意的請求。例如：それ　とってくれない？（幫我拿一下那個，好嗎？）"],"example":[{"en":"Would you lend me a hand?","jp":"<ruby>手伝<rt>てつだ</rt></ruby>っていただけませんか？","rj":"Tetsudatte itadakemasen ka?","say":"手伝っていただけませんか？"},{"en":"Will you wait for a second?","jp":"ちょっと<ruby>待<rt>ま</rt></ruby>ってくれませんか？","rj":"Chotto matte kuremasen ka?","say":"ちょっと待ってくれませんか？"},{"en":"Pick that thing up (and pass it to me), will you?","jp":"それとってくれない？","rj":"Sore totte kurenai?","say":"それとってくれない？"},{"en":"Will you lend me money?","jp":"お<ruby>金<rt>かね</rt></ruby>を<ruby>貸<rt>か</rt></ruby>してくれない？","rj":"Okane o kashite kurenai?","say":"お金を貸してくれない？"},{"en":"Would you wake me up at seven o'clock tomorrow?","jp":"<ruby>明日<rt>あした</rt></ruby>7<ruby>時<rt>しちじ</rt></ruby>に<ruby>起<rt>お</rt></ruby>こしてくれませんか？","rj":"Ashita shichiji ni okoshite kuremasen ka?","say":"明日7時に起こしてくれませんか？"},{"en":"Could you write a letter of recommendation?","jp":"<ruby>推薦状<rt>すいせんじょう</rt></ruby>を<ruby>書<rt>か</rt></ruby>いていただけませんか？","rj":"Suisenjou o kaite itadakemasen ka?","say":"推薦状を書いていただけませんか？"},{"en":"Will you teach me Japanese?","jp":"<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれない？","rj":"Nihongo o oshiete kurenai?","say":"日本語を教えてくれない？"},{"en":"Would you speak more slowly?","jp":"もっとゆっくり<ruby>話<rt>はな</rt></ruby>してくれませんか？","rj":"Motto yukkuri hanashite kuremasen ka?","say":"もっとゆっくり話してくれませんか？"},{"en":"Could you translate this into English?","jp":"これを<ruby>英語<rt>えいご</rt></ruby>に<ruby>翻訳<rt>ほんやく</rt></ruby>していただけませんか？","rj":"Kore o eigo ni honyaku shite itadakemasen ka?","say":"これを英語に翻訳していただけませんか？"}]},{"num":210,"title":"〜といい","vocab":[{"t":"アルバイト（あるばいと）","m":"arubaito 意思：打工 (part-time job)","say":"アルバイト（あるばいと）"},{"t":"奨学金（しょうがくきん）","m":"shougakukin 意思：獎學金 (scholarship)","say":"奨学金（しょうがくきん）"},{"t":"プロジェクト（ぷろじぇくと）","m":"purojekuto 意思：專案 (project)","say":"プロジェクト（ぷろじぇくと）"},{"t":"大学（だいがく）","m":"daigaku 意思：大學 (college / university)","say":"大学（だいがく）"},{"t":"乗る（のる）","m":"noru 意思：搭乘 (to ride, board)","say":"乗る（のる）"}],"grammar":["<b>〜といい 是什麼意思？</b><br><br>用「現在式常體＋といい」表達「希望發生某件好事」。","<b>為別人祈願跟為自己祈願，用法有什麼差異？</b><br><br>為別人祈願用「〜といいですね」（[現在式常體]＋といいですね），不是自己的事；為自己祈願用「〜といいんですが」（[現在式常體]＋といいんですが），語氣較委婉、謙虛。","<b>為什麼有時候動詞必須改成可能形才能用 といい？</b><br><br>といい 只能用在「自己無法掌控、只能期望」的事情上；如果是自己主動能做到的動作，必須把動詞改成可能形，才能用這個句型，否則語意會變成「希望自己親自去做這個動作」而顯得奇怪。例如不能說「大学に行くといいんですが」，要說「大学に行けるといいんですが」（希望自己能考上大學）。"],"example":[{"en":"I hope there is a good part-time job (for you).","jp":"いいアルバイトがあるといいですね。","rj":"Ii arubaito ga aru to ii desu ne.","say":"いいアルバイトがあるといいですね。"},{"en":"I hope it does not rain.","jp":"<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らないといいですね。","rj":"Ame ga furanai to ii desu ne.","say":"雨が降らないといいですね。"},{"en":"I am hoping that the exam is easy.","jp":"<ruby>試験<rt>しけん</rt></ruby>が<ruby>簡単<rt>かんたん</rt></ruby>だといいんですが。","rj":"Shiken ga kantan da to iin desu ga.","say":"試験が簡単だといいんですが。"},{"en":"I hope I can catch the eight o'clock train.","jp":"8<ruby>時<rt>じ</rt></ruby>の<ruby>電車<rt>でんしゃ</rt></ruby>に<ruby>乗<rt>の</rt></ruby>れるといいんですが。","rj":"Hachiji no densha ni noreru to iin desu ga.","say":"8時の電車に乗れるといいんですが。"},{"en":"I am hoping to go to college (= hoping I can go).","jp":"<ruby>大学<rt>だいがく</rt></ruby>に<ruby>行<rt>い</rt></ruby>けるといいんですが。","rj":"Daigaku ni ikeru to iin desu ga.","say":"大学に行けるといいんですが。"},{"en":"I hope you (Sue) will come.","jp":"すーが<ruby>来<rt>き</rt></ruby>てくれるといいんですが。","rj":"Suu ga kite kureru to iin desu ga.","say":"すーが来てくれるといいんですが。"},{"en":"I hope I can receive a scholarship.","jp":"<ruby>奨学金<rt>しょうがくきん</rt></ruby>がもらえるといいんですが。","rj":"Shougakukin ga moraeru to iin desu ga.","say":"奨学金がもらえるといいんですが。"},{"en":"I hope Sachi comes to your birthday party.","jp":"さちが<ruby>誕生日<rt>たんじょうび</rt></ruby>パーティーにくるといいですね。","rj":"Sachi ga tanjoubi paatii ni kuru to ii desu ne.","say":"さちが誕生日パーティーにくるといいですね。"},{"en":"I hope you can receive a good project.","jp":"いいプロジェクトがもらえるといいですね。","rj":"Ii purojekuto ga moraeru to ii desu ne.","say":"いいプロジェクトがもらえるといいですね。"},{"en":"I hope I can go to China next year.","jp":"<ruby>来年<rt>らいねん</rt></ruby><ruby>中国<rt>ちゅうごく</rt></ruby>に<ruby>行<rt>い</rt></ruby>けるといいんですが。","rj":"Rainen Chuugoku ni ikeru to iin desu ga.","say":"来年中国に行けるといいんですが。"}]},{"num":211,"title":"〜時（とき）1","vocab":[{"t":"チベット（ちべっと）","m":"chibetto 意思：西藏 (Tibet)","say":"チベット（ちべっと）"},{"t":"ビザ（びざ）","m":"biza 意思：簽證 (visa)","say":"ビザ（びざ）"},{"t":"とる（とる）","m":"toru 意思：取得 (to get, obtain)","say":"とる（とる）"},{"t":"出かける（でかける）","m":"dekakeru 意思：出門 (to go out)","say":"出かける（でかける）"},{"t":"鍵をかける（かぎをかける）","m":"kagi o kakeru 意思：上鎖 (to lock)","say":"鍵をかける（かぎをかける）"},{"t":"コンタクト（こんたくと）","m":"kontakuto 意思：隱形眼鏡 (contact lens)","say":"コンタクト（こんたくと）"},{"t":"さびしい（さびしい）","m":"sabishii 意思：寂寞的 (lonely)","say":"さびしい（さびしい）"},{"t":"電話がある（でんわがある）","m":"denwa ga aru 意思：有電話（來電） (a phone call comes)","say":"電話がある（でんわがある）"},{"t":"元気な（げんきな）","m":"genki na 意思：有活力的 (energetic)","say":"元気な（げんきな）"},{"t":"病気（びょうき）","m":"byouki 意思：生病 (sick)","say":"病気（びょうき）"},{"t":"頭が痛くなる（あたまがいたくなる）","m":"atama ga itaku naru 意思：頭痛起來 (to get a headache)","say":"頭が痛くなる（あたまがいたくなる）"},{"t":"走る（はしる）","m":"hashiru 意思：跑步 (to run)","say":"走る（はしる）"}],"grammar":["<b>「〜時（とき）」是什麼意思？</b><br><br>用「時（とき）」表示「當…的時候」，描述事情發生的時間點。句型：(句子A)とき、(句子B)。句子A是時間點的參考，句子B是主要事件。","<b>句子A要用現在式還是過去式，判斷原則是什麼？</b><br><br>句子A一律使用常體（短形），但選哪個時態，取決於「事件A與事件B的相對時間關係」，而不是整句話實際發生在過去還是未來。判斷方法是：站在「事件B發生的那個時間點」，想像自己會如何描述事件A。","<b>句子A用「現在式常體」的情況有哪些？</b><br><br>① A在B之後發生（尚未發生）；② A在B之後發生（即使整句都已過去，A相對B仍是「之後」）；③ A描述的狀態在B發生當下成立；④ A是進行中的動作、B發生在A進行過程中（此時動詞用「〜ている」形）。","<b>句子A用「過去式常體」的情況是什麼？</b><br><br>當A早於B發生（A已經完成，B才發生）時，句子A要用過去式常體。例如：出（で）かけるとき、ドアに鍵（かぎ）をかけました。（出門的時候，把門鎖上了——鎖門發生在出門這個動作準備完成之後）","<b>な形容詞、名詞接「とき」時要怎麼變化？</b><br><br>な形容詞語尾用「な」（辭書形，不用だ）：元気（げんき）なとき。名詞則加「の」：犬（いぬ）が病気（びょうき）のとき。"],"example":[{"en":"I will get the visa issued when I go to Tibet.","jp":"チベットに<ruby>行<rt>い</rt></ruby>くとき、ビザをとります。","rj":"Chibetto ni iku toki, biza o torimasu.","say":"チベットに行くとき、ビザをとります。"},{"en":"I had the visa issued when I was going to go to Tibet.","jp":"チベットに<ruby>行<rt>い</rt></ruby>くとき、ビザをとりました。","rj":"Chibetto ni iku toki, biza o torimashita.","say":"チベットに行くとき、ビザをとりました。"},{"en":"I take out the contact lenses when I go to sleep.","jp":"<ruby>寝<rt>ね</rt></ruby>るとき、コンタクトをとります。","rj":"Neru toki, kontakuto o torimasu.","say":"寝るとき、コンタクトをとります。"},{"en":"I locked the door when I went out.","jp":"<ruby>出<rt>で</rt></ruby>かけるとき、ドアに<ruby>鍵<rt>かぎ</rt></ruby>をかけました。","rj":"Dekakeru toki, doa ni kagi o kakemashita.","say":"出かけるとき、ドアに鍵をかけました。"},{"en":"I call up friends when I am lonely.","jp":"さびしいとき、<ruby>友達<rt>ともだち</rt></ruby>に<ruby>電話<rt>でんわ</rt></ruby>します。","rj":"Sabishii toki, tomodachi ni denwa shimasu.","say":"さびしいとき、友達に電話します。"},{"en":"A phone call came when I was watching TV.","jp":"テレビをみているとき、<ruby>電話<rt>でんわ</rt></ruby>がありました。","rj":"Terebi o mite iru toki, denwa ga arimashita.","say":"テレビをみているとき、電話がありました。"},{"en":"I get a headache when it is cold.","jp":"<ruby>寒<rt>さむ</rt></ruby>いとき、<ruby>頭<rt>あたま</rt></ruby>が<ruby>痛<rt>いた</rt></ruby>くなります。","rj":"Samui toki, atama ga itaku narimasu.","say":"寒いとき、頭が痛くなります。"},{"en":"I jog in the park when I feel energetic.","jp":"<ruby>元気<rt>げんき</rt></ruby>なとき、<ruby>公園<rt>こうえん</rt></ruby>を<ruby>走<rt>はし</rt></ruby>ります。","rj":"Genki na toki, kouen o hashirimasu.","say":"元気なとき、公園を走ります。"},{"en":"I took the dog to a vet when it was sick.","jp":"<ruby>犬<rt>いぬ</rt></ruby>が<ruby>病気<rt>びょうき</rt></ruby>のとき、<ruby>病院<rt>びょういん</rt></ruby>に<ruby>連<rt>つ</rt></ruby>れて<ruby>行<rt>い</rt></ruby>きました。","rj":"Inu ga byouki no toki, byouin ni tsurete ikimashita.","say":"犬が病気のとき、病院に連れて行きました。"}]},{"num":212,"title":"〜時（とき）2","vocab":[{"t":"ウーロン茶（うーろんちゃ）","m":"u-roncha 意思：烏龍茶 (oolong tea)","say":"ウーロン茶（うーろんちゃ）"},{"t":"疲れる（つかれる）","m":"tsukareru 意思：疲累 (to get tired)","say":"疲れる（つかれる）"},{"t":"お風呂に入る（おふろにはいる）","m":"ofuro ni hairu 意思：泡澡 (to take a bath)","say":"お風呂に入る（おふろにはいる）"}],"grammar":["<b>句子A用「過去式常體」的情況，關鍵判斷原則是什麼？</b><br><br>站在事件B發生的時間點，回頭看事件A——若A在當時已經「發生過」，句子A就用過去式常體。這裡的「過去」指的是A相對於B的先後順序，而不是這兩件事實際上是否已經對說話者而言成為過去。","<b>即使整句話是描述未來的計畫，為什麼句子A有時仍要用過去式？</b><br><br>因為判斷關鍵是A、B的先後順序，而非整句時態。只要A會先於B完成，A就要用過去式常體。例如：中国（ちゅうごく）に行（い）ったとき、ウーロン茶（ちゃ）を買（か）います。（雖然整句是未來式，但「去中國」會先於「買茶」完成，所以行く用過去式「行った」）"],"example":[{"en":"I will buy oolong tea when I go to China.","jp":"<ruby>中国<rt>ちゅうごく</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったとき、ウーロン<ruby>茶<rt>ちゃ</rt></ruby>を<ruby>買<rt>か</rt></ruby>います。","rj":"Chuugoku ni itta toki, u-roncha o kaimasu.","say":"中国に行ったとき、ウーロン茶を買います。"},{"en":"I bought oolong tea when I went to China.","jp":"<ruby>中国<rt>ちゅうごく</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったとき、ウーロン<ruby>茶<rt>ちゃ</rt></ruby>を<ruby>買<rt>か</rt></ruby>いました。","rj":"Chuugoku ni itta toki, u-roncha o kaimashita.","say":"中国に行ったとき、ウーロン茶を買いました。"},{"en":"I take a long bath when I get tired.","jp":"<ruby>疲<rt>つか</rt></ruby>れたとき、ゆっくりお<ruby>風呂<rt>ふろ</rt></ruby>に<ruby>入<rt>はい</rt></ruby>ります。","rj":"Tsukareta toki, yukkuri ofuro ni hairimasu.","say":"疲れたとき、ゆっくりお風呂に入ります。"}]},{"num":213,"title":"時Practice","vocab":[{"t":"案内する（あんないする）","m":"annai suru 意思：帶路、導覽 (to show around)","say":"案内する（あんないする）"},{"t":"寝坊する（ねぼうする）","m":"nebou suru 意思：睡過頭 (to oversleep)","say":"寝坊する（ねぼうする）"},{"t":"暇な（ひまな）","m":"hima na 意思：空閒的 (free, bored)","say":"暇な（ひまな）"},{"t":"学生（がくせい）","m":"gakusei 意思：學生 (student)","say":"学生（がくせい）"},{"t":"野球（やきゅう）","m":"yakyuu 意思：棒球 (baseball)","say":"野球（やきゅう）"},{"t":"好きな（すきな）","m":"suki na 意思：喜歡的 (to like)","say":"好きな（すきな）"},{"t":"歯を磨く（はをみがく）","m":"ha o migaku 意思：刷牙 (to brush teeth)","say":"歯を磨く（はをみがく）"},{"t":"箸（はし）","m":"hashi 意思：筷子 (chopsticks)","say":"箸（はし）"},{"t":"スパゲッティ（すぱげってぃ）","m":"supagetti 意思：義大利麵 (spaghetti)","say":"スパゲッティ（すぱげってぃ）"},{"t":"失くす（なくす）","m":"nakusu 意思：弄丟 (to lose)","say":"失くす（なくす）"},{"t":"警察署（けいさつしょ）","m":"keisatsusho 意思：警察局 (police station)","say":"警察署（けいさつしょ）"},{"t":"退屈な（たいくつな）","m":"taikutsu na 意思：無聊的 (bored)","say":"退屈な（たいくつな）"},{"t":"〜歳（〜さい）","m":"~sai 意思：…歲 (…years old)","say":"〜歳（〜さい）"},{"t":"なる（なる）","m":"naru 意思：變成 (to become)","say":"なる（なる）"}],"grammar":["<b>複習「〜とき」時態選擇的判斷口訣是什麼？</b><br><br>A晚於／同時於B → A用現在式；A早於B（A先完成，B才發生）→ A用過去式。這個原則同時適用於動詞、い形容詞、な形容詞（用「な」）與名詞（用「の」）。"],"example":[{"en":"When my friend comes to my town, I'll show them around.","jp":"<ruby>友達<rt>ともだち</rt></ruby>が<ruby>町<rt>まち</rt></ruby>に<ruby>来<rt>き</rt></ruby>たとき、<ruby>案内<rt>あんない</rt></ruby>します。","rj":"Tomodachi ga machi ni kita toki, annai shimasu.","say":"友達が町に来たとき、案内します。"},{"en":"When my friend comes to my house, I clean my room.","jp":"<ruby>友達<rt>ともだち</rt></ruby>がうちに<ruby>来<rt>き</rt></ruby>たとき、<ruby>部屋<rt>へや</rt></ruby>を<ruby>掃除<rt>そうじ</rt></ruby>します。","rj":"Tomodachi ga uchi ni kita toki, heya o souji shimasu.","say":"友達がうちに来たとき、部屋を掃除します。"},{"en":"When I oversleep, I take a taxi.","jp":"<ruby>寝坊<rt>ねぼう</rt></ruby>したとき、タクシーに<ruby>乗<rt>の</rt></ruby>ります。","rj":"Nebou shita toki, takushi- ni norimasu.","say":"寝坊したとき、タクシーに乗ります。"},{"en":"When I am bored, I watch TV.","jp":"<ruby>暇<rt>ひま</rt></ruby>なとき、テレビをみます。","rj":"Hima na toki, terebi o mimasu.","say":"暇なとき、テレビをみます。"},{"en":"When I was a student, I liked baseball.","jp":"<ruby>学生<rt>がくせい</rt></ruby>のとき、<ruby>野球<rt>やきゅう</rt></ruby>が<ruby>好<rt>す</rt></ruby>きでした。","rj":"Gakusei no toki, yakyuu ga suki deshita.","say":"学生のとき、野球が好きでした。"},{"en":"I brushed my teeth when I went to bed.","jp":"<ruby>寝<rt>ね</rt></ruby>るとき、<ruby>歯<rt>は</rt></ruby>を<ruby>磨<rt>みが</rt></ruby>きました。","rj":"Neru toki, ha o migakimashita.","say":"寝るとき、歯を磨きました。"},{"en":"I ride a bus when I go to school.","jp":"<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>くとき、バスにのります。","rj":"Gakkou ni iku toki, basu ni norimasu.","say":"学校に行くとき、バスにのります。"},{"en":"Takeshi used chopsticks when he ate spaghetti.","jp":"たけしはスパゲッティを<ruby>食<rt>た</rt></ruby>べるとき、<ruby>箸<rt>はし</rt></ruby>を<ruby>使<rt>つか</rt></ruby>いました。","rj":"Takeshi wa supagetti o taberu toki, hashi o tsukaimashita.","say":"たけしはスパゲッティを食べるとき、箸を使いました。"},{"en":"I went to the police station when I lost my bag.","jp":"かばんを<ruby>失<rt>な</rt></ruby>くしたとき、<ruby>警察署<rt>けいさつしょ</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","rj":"Kaban o nakushita toki, keisatsusho ni ikimashita.","say":"かばんを失くしたとき、警察署に行きました。"},{"en":"What do you do when you are bored?","jp":"<ruby>退屈<rt>たいくつ</rt></ruby>なとき、<ruby>何<rt>なに</rt></ruby>をしますか？","rj":"Taikutsu na toki, nani o shimasu ka?","say":"退屈なとき、何をしますか？"},{"en":"What do you want to do when you turn 20 years old?","jp":"20<ruby>歳<rt>はたち</rt></ruby>になったとき、<ruby>何<rt>なに</rt></ruby>をしたいですか？","rj":"Hatachi ni natta toki, nani o shitai desu ka?","say":"20歳になったとき、何をしたいですか？"}]},{"num":214,"title":"〜てすみませんでした","vocab":[{"t":"汚い言葉（きたないことば）","m":"kitanai kotoba 意思：髒話 (foul language)","say":"汚い言葉（きたないことば）"},{"t":"約束（やくそく）","m":"yakusoku 意思：約定 (promise)","say":"約束（やくそく）"},{"t":"忘れる（わすれる）","m":"wasureru 意思：忘記 (to forget)","say":"忘れる（わすれる）"},{"t":"電話する（でんわする）","m":"denwa suru 意思：打電話 (to call (someone))","say":"電話する（でんわする）"},{"t":"出席する（しゅっせきする）","m":"shusseki suru 意思：出席 (to attend)","say":"出席する（しゅっせきする）"},{"t":"聞く（きく）","m":"kiku 意思：聽 (to listen)","say":"聞く（きく）"},{"t":"夜遅く（よるおそく）","m":"yoru osoku 意思：深夜 (late at night)","say":"夜遅く（よるおそく）"},{"t":"ミーティング（みーてぃんぐ）","m":"mi-tingu 意思：會議 (meeting)","say":"ミーティング（みーてぃんぐ）"},{"t":"イベント（いべんと）","m":"ibento 意思：活動 (event)","say":"イベント（いべんと）"}],"grammar":["<b>要怎麼用動詞て形道歉，表示「做了…」很抱歉？</b><br><br>句型：[動詞て形]＋すみませんでした。相當於英文「I am sorry for [doing something]」。例如：汚（きたな）い言葉（ことば）を使（つか）って、すみませんでした。（很抱歉說了髒話。）","<b>要怎麼為「沒有做…」道歉？</b><br><br>用否定て形：先把動詞變成常體否定「〜ない」，再把最後的「い」改成「くて」。句型：[動詞否定て形]＋すみませんでした。例如：宿題（しゅくだい）をもってこなくて、すみませんでした。","<b>すみませんでした 可以怎麼換成比較輕鬆的說法？</b><br><br>可依對象換成較輕鬆的「ごめん」（對朋友）或「ごめんなさい」（普通禮貌，稍隨性於すみませんでした）。"],"example":[{"en":"I am sorry for using foul language.","jp":"<ruby>汚<rt>きたな</rt></ruby>い<ruby>言葉<rt>ことば</rt></ruby>を<ruby>使<rt>つか</rt></ruby>って、すみませんでした。","rj":"Kitanai kotoba o tsukatte, sumimasen deshita.","say":"汚い言葉を使って、すみませんでした。"},{"en":"I'm sorry for forgetting about the date.","jp":"デートの<ruby>約束<rt>やくそく</rt></ruby>を<ruby>忘<rt>わす</rt></ruby>れて、ごめん。","rj":"Deeto no yakusoku o wasurete, gomen.","say":"デートの約束を忘れて、ごめん。"},{"en":"I am sorry for not bringing in the homework.","jp":"<ruby>宿題<rt>しゅくだい</rt></ruby>をもってこなくて、すみませんでした。","rj":"Shukudai o motte konakute, sumimasen deshita.","say":"宿題をもってこなくて、すみませんでした。"},{"en":"Sorry that I did not tell you earlier.","jp":"もっと<ruby>早<rt>はや</rt></ruby>く<ruby>言<rt>い</rt></ruby>わなくて、ごめん。","rj":"Motto hayaku iwanakute, gomen.","say":"もっと早く言わなくて、ごめん。"},{"en":"I am sorry for not listening to the lecture.","jp":"<ruby>話<rt>はなし</rt></ruby>を<ruby>聞<rt>き</rt></ruby>かなくてごめんなさい。","rj":"Hanashi o kikanakute gomen nasai.","say":"話を聞かなくてごめんなさい。"},{"en":"I am sorry to call you late at night.","jp":"<ruby>夜遅<rt>よるおそ</rt></ruby>くに<ruby>電話<rt>でんわ</rt></ruby>してごめんなさい。","rj":"Yoruosoku ni denwa shite gomen nasai.","say":"夜遅くに電話してごめんなさい。"},{"en":"I am sorry for not attending the meeting.","jp":"ミーティングに<ruby>出席<rt>しゅっせき</rt></ruby>しなくてすみませんでした。","rj":"Mi-tingu ni shusseki shinakute sumimasen deshita.","say":"ミーティングに出席しなくてすみませんでした。"},{"en":"I am sorry for not being able to go to the event.","jp":"イベントに<ruby>行<rt>い</rt></ruby>けなくてごめんなさい。","rj":"Ibento ni ikenakute gomen nasai.","say":"イベントに行けなくてごめんなさい。"}]},{"num":217,"title":"〜そうです","vocab":[{"t":"新聞（しんぶん）","m":"shinbun 意思：報紙 (newspaper)","say":"新聞（しんぶん）"},{"t":"天気予報（てんきよほう）","m":"tenkiyohou 意思：天氣預報 (weather forecast)","say":"天気予報（てんきよほう）"},{"t":"離婚する（りこんする）","m":"rikon suru 意思：離婚 (to get divorced)","say":"離婚する（りこんする）"},{"t":"混む（こむ）","m":"komu 意思：擁擠 (to be crowded)","say":"混む（こむ）"},{"t":"映画館（えいがかん）","m":"eigakan 意思：電影院 (movie theater)","say":"映画館（えいがかん）"}],"grammar":["<b>傳聞そうです 是什麼意思？跟樣態そうです有什麼不同？</b><br><br>そうです 有兩種意思：樣態（先前學過）表示「看起來…」，接在形容詞語幹之後；傳聞（本單元）表示「聽說…（轉述訊息）」，接在句子常體（短形）之後。","<b>各詞性要怎麼接傳聞そうです？</b><br><br>動詞、い形容詞：直接接常體句尾。な形容詞、名詞＋です：現在肯定要把「だ」保留（元気だそうです、学生だそうです），其餘時態、否定則正常接常體。そうです 本身不隨時態變化，沒有そうじゃありません、そうでした這種變化。","<b>〜によると 是什麼意思？</b><br><br>用來指明消息來源，句型：(消息來源)によると、(常體句子)そうです。例如：天気予報（てんきよほう）によると、明日（あした）雨（あめ)が降（ふ）るそうです。（根據天氣預報，明天會下雨。）"],"example":[{"en":"I have heard that their Japanese class is fun.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>授業<rt>じゅぎょう</rt></ruby>は<ruby>楽<rt>たの</rt></ruby>しいそうです。","rj":"Nihongo no jugyou wa tanoshii sou desu.","say":"日本語の授業は楽しいそうです。"},{"en":"I have heard that their teacher is very kind.","jp":"<ruby>先生<rt>せんせい</rt></ruby>はとても<ruby>親切<rt>しんせつ</rt></ruby>だそうです。","rj":"Sensei wa totemo shinsetsu da sou desu.","say":"先生はとても親切だそうです。"},{"en":"I have heard that they did not have a class today.","jp":"<ruby>今日<rt>きょう</rt></ruby>は<ruby>授業<rt>じゅぎょう</rt></ruby>がなかったそうです。","rj":"Kyou wa jugyou ga nakatta sou desu.","say":"今日は授業がなかったそうです。"},{"en":"I heard that Ken speaks Japanese.","jp":"けんは<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>すそうです。","rj":"Ken wa nihongo o hanasu sou desu.","say":"けんは日本語を話すそうです。"},{"en":"I heard that Ken is a student.","jp":"けんは<ruby>学生<rt>がくせい</rt></ruby>だそうです。","rj":"Ken wa gakusei da sou desu.","say":"けんは学生だそうです。"},{"en":"According to the weather forecast, it will rain tomorrow.","jp":"<ruby>天気予報<rt>てんきよほう</rt></ruby>によると、<ruby>明日<rt>あした</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>るそうです。","rj":"Tenkiyohou ni yoru to, ashita ame ga furu sou desu.","say":"天気予報によると、明日雨が降るそうです。"},{"en":"I heard that Miki will get a divorce.","jp":"みきは<ruby>離婚<rt>りこん</rt></ruby>するそうです。","rj":"Miki wa rikon suru sou desu.","say":"みきは離婚するそうです。"},{"en":"I heard that Miki got a divorce.","jp":"みきは<ruby>離婚<rt>りこん</rt></ruby>したそうです。","rj":"Miki wa rikon shita sou desu.","say":"みきは離婚したそうです。"},{"en":"I heard that it won't rain tomorrow.","jp":"<ruby>明日<rt>あした</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らないそうです。","rj":"Ashita ame ga furanai sou desu.","say":"明日雨が降らないそうです。"},{"en":"I heard that it did not rain yesterday.","jp":"<ruby>昨日<rt>きのう</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らなかったそうです。","rj":"Kinou ame ga furanakatta sou desu.","say":"昨日雨が降らなかったそうです。"},{"en":"I heard that the movie theater was not crowded.","jp":"<ruby>映画館<rt>えいがかん</rt></ruby>は<ruby>混<rt>こ</rt></ruby>んでいなかったそうです。","rj":"Eigakan wa konde inakatta sou desu.","say":"映画館は混んでいなかったそうです。"}]},{"num":218,"title":"〜って","vocab":[{"t":"忙しい（いそがしい）","m":"isogashii 意思：忙碌的 (busy)","say":"忙しい（いそがしい）"},{"t":"試験（しけん）","m":"shiken 意思：考試 (exam)","say":"試験（しけん）"},{"t":"昨晩（さくばん）","m":"sakuban 意思：昨晚 (last night)","say":"昨晩（さくばん）"},{"t":"すし（すし）","m":"sushi 意思：壽司 (sushi)","say":"すし（すし）"},{"t":"何と言う（なんという）","m":"nan to iu 意思：說什麼 (to say what)","say":"何と言う（なんという）"},{"t":"会議（かいぎ）","m":"kaigi 意思：會議 (meeting)","say":"会議（かいぎ）"}],"grammar":["<b>〜って 是什麼？</b><br><br>って 是引用助詞「と」的口語（隨性）版本，常用來取代そうです，表示「聽說…、他說…」，接續方式與と言っていました／そうです相同——都接在常體（短形）之後。","<b>〜って 有什麼特殊音變規則？</b><br><br>當って前一個字是「ん」時，って會變成「て」（尾音同化）。例如：何（なん）＋って→何（なん）て。"],"example":[{"en":"(Mary said/says) she is busy today.","jp":"メアリーは<ruby>今日<rt>きょう</rt></ruby>は<ruby>忙<rt>いそが</rt></ruby>しいって。","rj":"Meari- wa kyou wa isogashii tte.","say":"メアリーは今日は忙しいって。"},{"en":"(Mary said/says) she has an exam tomorrow.","jp":"メアリーは<ruby>明日<rt>あした</rt></ruby><ruby>試験<rt>しけん</rt></ruby>があるって。","rj":"Meari- wa ashita shiken ga aru tte.","say":"メアリーは明日試験があるって。"},{"en":"Tomo said he ate sushi last night.","jp":"ともは<ruby>昨晩<rt>さくばん</rt></ruby>すしを<ruby>食<rt>た</rt></ruby>べたって<ruby>言<rt>い</rt></ruby>ってた。","rj":"Tomo wa sakuban sushi o tabeta tte itteta.","say":"ともは昨晩すしを食べたって言ってた。"},{"en":"What did Akira say?","jp":"あきらは<ruby>何<rt>なん</rt></ruby>て<ruby>言<rt>い</rt></ruby>ってた？","rj":"Akira wa nante itteta?","say":"あきらは何て言ってた？"},{"en":"Tom said he needs to study tonight.","jp":"トムは<ruby>今晩<rt>こんばん</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>しなくちゃいけないって。","rj":"Tomu wa konban benkyou shinakuchaikenai tte.","say":"トムは今晩勉強しなくちゃいけないって。"},{"en":"Mary said her birthday is tomorrow.","jp":"メアリーの<ruby>誕生日<rt>たんじょうび</rt></ruby>は<ruby>明日<rt>あした</rt></ruby>だって。","rj":"Meari- no tanjoubi wa ashita da tte.","say":"メアリーの誕生日は明日だって。"},{"en":"Kai said he won't attend the meeting.","jp":"かいは<ruby>会議<rt>かいぎ</rt></ruby>に<ruby>出席<rt>しゅっせき</rt></ruby>しないって。","rj":"Kai wa kaigi ni shusseki shinai tte.","say":"かいは会議に出席しないって。"},{"en":"Machi said she won't come to Japan.","jp":"まちは<ruby>日本<rt>にほん</rt></ruby>にこないって。","rj":"Machi wa nihon ni konai tte.","say":"まちは日本にこないって。"}]},{"num":219,"title":"〜たら 1 - If A, then B","vocab":[{"t":"散歩（さんぽ）","m":"sanpo 意思：散步 (walk)","say":"散歩（さんぽ）"},{"t":"言葉（ことば）","m":"kotoba 意思：語詞 (word)","say":"言葉（ことば）"},{"t":"弁護士（べんごし）","m":"bengoshi 意思：律師 (lawyer)","say":"弁護士（べんごし）"},{"t":"寝坊する（ねぼうする）","m":"nebou suru 意思：睡過頭 (to oversleep)","say":"寝坊する（ねぼうする）"},{"t":"成績（せいせき）","m":"seiseki 意思：成績 (grades)","say":"成績（せいせき）"},{"t":"出かける（でかける）","m":"dekakeru 意思：出門 (to go out)","say":"出かける（でかける）"},{"t":"バーベキュー（ばーべきゅー）","m":"ba-bekyu- 意思：烤肉 (barbecue)","say":"バーベキュー（ばーべきゅー）"},{"t":"起こす（おこす）","m":"okosu 意思：叫醒 (to wake (someone) up)","say":"起こす（おこす）"},{"t":"悲しい（かなしい）","m":"kanashii 意思：悲傷的 (sad)","say":"悲しい（かなしい）"}],"grammar":["<b>「〜たら」是什麼意思？怎麼接？</b><br><br>たら 是表示條件的假定語氣之一，たら 開頭的「た」來自各詞性過去式常體肯定的字尾。句型：[A：過去式常體]＋ら[B]，相當於英文「If A, then B.」。","<b>〜たら 有哪幾種用法？</b><br><br>三種主要用法：①基本用法「如果A，就B」；②用來安排未來事件的先後順序；③表達純粹假設（未必真的會發生）的條件與其可能結果。"],"example":[{"en":"I will buy Kimono if and when I go to Japan.","jp":"<ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったら、<ruby>着物<rt>きもの</rt></ruby>を<ruby>買<rt>か</rt></ruby>います。","rj":"Nihon ni ittara, kimono o kaimasu.","say":"日本に行ったら、着物を買います。"},{"en":"We will go for a walk, if the weather is fine.","jp":"<ruby>天気<rt>てんき</rt></ruby>がよかったら、<ruby>散歩<rt>さんぽ</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。","rj":"Tenki ga yokattara, sanpo ni ikimasu.","say":"天気がよかったら、散歩に行きます。"},{"en":"I will ask about it, if I see Tom.","jp":"トムに<ruby>会<rt>あ</rt></ruby>ったら、そのことを<ruby>聞<rt>き</rt></ruby>きます。","rj":"Tomu ni attara, sono koto o kikimasu.","say":"トムに会ったら、そのことを聞きます。"},{"en":"If they are a Japanese person, then they will probably know this word.","jp":"<ruby>日本人<rt>にほんじん</rt></ruby>だったら、この<ruby>言葉<rt>ことば</rt></ruby>を<ruby>知<rt>し</rt></ruby>っているでしょう。","rj":"Nihonjin dattara, kono kotoba o shitte iru deshou.","say":"日本人だったら、この言葉を知っているでしょう。"},{"en":"If I was not a teacher, I want to be a lawyer.","jp":"<ruby>先生<rt>せんせい</rt></ruby>じゃなかったら、<ruby>弁護士<rt>べんごし</rt></ruby>になりたいです。","rj":"Sensei ja nakattara, bengoshi ni naritai desu.","say":"先生じゃなかったら、弁護士になりたいです。"},{"en":"Let's have a barbecue, if it does not rain this weekend.","jp":"<ruby>今週末<rt>こんしゅうまつ</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らなかったら、バーベキューをしましょう。","rj":"Konshuumatsu ame ga furanakattara, baabekyuu o shimashou.","say":"今週末雨が降らなかったら、バーベキューをしましょう。"},{"en":"If I oversleep, please wake me up.","jp":"<ruby>寝坊<rt>ねぼう</rt></ruby>したら、<ruby>起<rt>お</rt></ruby>こしてください。","rj":"Nebou shitara, okoshite kudasai.","say":"寝坊したら、起こしてください。"},{"en":"If my grade is not good, I become sad.","jp":"<ruby>成績<rt>せいせき</rt></ruby>がよくなかったら、<ruby>悲<rt>かな</rt></ruby>しくなります。","rj":"Seiseki ga yokunakattara, kanashiku narimasu.","say":"成績がよくなかったら、悲しくなります。"},{"en":"If I am not fine, I will not go out.","jp":"<ruby>元気<rt>げんき</rt></ruby>じゃなかったら、<ruby>出<rt>で</rt></ruby>かけません。","rj":"Genki ja nakattara, dekakemasen.","say":"元気じゃなかったら、出かけません。"}]},{"num":220,"title":"〜たら 2 - Events and Activities in a Temporal Sequence","vocab":[{"t":"掃除（そうじ）","m":"souji 意思：打掃 (cleaning)","say":"掃除（そうじ）"},{"t":"嬉しい（うれしい）","m":"ureshii 意思：高興的 (happy, glad)","say":"嬉しい（うれしい）"},{"t":"両親（りょうしん）","m":"ryoushin 意思：雙親 (parents)","say":"両親（りょうしん）"},{"t":"キャンプする（きゃんぷする）","m":"kyanpu suru 意思：露營 (to camp)","say":"キャンプする（きゃんぷする）"},{"t":"テント（てんと）","m":"tento 意思：帳篷 (tent)","say":"テント（てんと）"},{"t":"終わる（おわる）","m":"owaru 意思：結束 (to finish)","say":"終わる（おわる）"}],"grammar":["<b>用法②「安排未來事件的先後順序」是什麼意思？</b><br><br>當たら子句描述的是幾乎必然會發生的條件時，たら的功能其實只是單純串連兩件未來會依序發生的事——先做Action 1，然後做Action 2，語感接近英文的「when」而非「if」。","<b>為什麼同一個 たら 句子形式，可能同時對應「if」與「when」兩種解讀？</b><br><br>たら子句本身沒有固定屬於「假設」或「時間順序」哪一種——差別不在句子的文法結構，而在於現實世界中，該條件到底有多大機率會發生。若幾乎確定會發生，自然理解為「when」；若不確定是否會發生，則理解為「if」。"],"example":[{"en":"I will call you when I get home tonight.","jp":"<ruby>今晩<rt>こんばん</rt></ruby>、うちに<ruby>帰<rt>かえ</rt></ruby>ったら、<ruby>電話<rt>でんわ</rt></ruby>します。","rj":"Konban, uchi ni kaettara, denwa shimasu.","say":"今晩、うちに帰ったら、電話します。"},{"en":"Let's go out and have some fun once we are done with the homework.","jp":"<ruby>宿題<rt>しゅくだい</rt></ruby>が<ruby>終<rt>お</rt></ruby>わったら、<ruby>遊<rt>あそ</rt></ruby>びに<ruby>行<rt>い</rt></ruby>きましょう。","rj":"Shukudai ga owattara, asobi ni ikimashou.","say":"宿題が終わったら、遊びに行きましょう。"},{"en":"I will read a book (if and) when I finish cleaning the house.","jp":"<ruby>家<rt>いえ</rt></ruby>の<ruby>掃除<rt>そうじ</rt></ruby>が<ruby>終<rt>お</rt></ruby>わったら、<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みます。","rj":"Ie no souji ga owattara, hon o yomimasu.","say":"家の掃除が終わったら、本を読みます。"},{"en":"I will study (if and) after I eat dinner.","jp":"<ruby>夜<rt>よる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べたら、<ruby>勉強<rt>べんきょう</rt></ruby>します。","rj":"Yorugohan o tabetara, benkyou shimasu.","say":"夜ご飯を食べたら、勉強します。"},{"en":"Miyu will be happy (if and) when she sees her parents.","jp":"<ruby>両親<rt>りょうしん</rt></ruby>に<ruby>会<rt>あ</rt></ruby>ったら、みゆは<ruby>嬉<rt>うれ</rt></ruby>しいでしょう。","rj":"Ryoushin ni attara, Miyu wa ureshii deshou.","say":"両親に会ったら、みゆは嬉しいでしょう。"},{"en":"Let's go camping (if and) when I buy a tent!","jp":"テントを<ruby>買<rt>か</rt></ruby>ったら、キャンプしに<ruby>行<rt>い</rt></ruby>きましょう。","rj":"Tento o kattara, kyanpu shi ni ikimashou.","say":"テントを買ったら、キャンプしに行きましょう。"}]},{"num":256,"title":"Causative Sentences 1","vocab":[{"t":"泣く（なく）","m":"naku 意思：哭 (to cry)","say":"泣く（なく）"},{"t":"笑う（わらう）","m":"warau 意思：笑 (to laugh)","say":"笑う（わらう）"},{"t":"座る（すわる）","m":"suwaru 意思：坐 (to sit)","say":"座る（すわる）"},{"t":"部長（ぶちょう）","m":"buchou 意思：部長 (department manager)","say":"部長（ぶちょう）"},{"t":"残業する（ざんぎょうする）","m":"zangyou suru 意思：加班 (to work overtime)","say":"残業する（ざんぎょうする）"},{"t":"生徒（せいと）","m":"seito 意思：學生 (student)","say":"生徒（せいと）"},{"t":"調べる（しらべる）","m":"shiraberu 意思：查、調查 (to look up)","say":"調べる（しらべる）"},{"t":"辞書（じしょ）","m":"jisho 意思：字典 (dictionary)","say":"辞書（じしょ）"},{"t":"出張（しゅっちょう）","m":"shucchou 意思：出差 (business trip)","say":"出張（しゅっちょう）"},{"t":"持っていく（もっていく）","m":"motte iku 意思：帶去 (to bring, take (something))","say":"持っていく（もっていく）"},{"t":"携帯電話（けいたいでんわ）","m":"keitai denwa 意思：手機 (cellphone)","say":"携帯電話（けいたいでんわ）"},{"t":"使う（つかう）","m":"tsukau 意思：使用 (to use)","say":"使う（つかう）"}],"grammar":["<b>使役形是什麼意思？動詞要怎麼變成使役形？</b><br><br>使役形用來描述「誰讓／使某人做某事」（可以是強迫，也可以是允許）。Ru-verb（一段動詞）：去掉語尾「る」，加上「させる」（食べる→食べさせる）。U-verb（五段動詞）：語尾u音改為aseru（行く iku→行かせる ikaseru）。不規則動詞：する→させる、くる→こさせる。","<b>使役句的句型結構是什麼？</b><br><br>[Director]は／が　[Cast]に　[Action（使役形）]。Director（下令者）是決定該做什麼的人，用「は」或「が」標示；Cast（執行者）是實際做出動作的人，通常用「に」標示。","<b>什麼時候 Cast 要用「を」而不是「に」標示？</b><br><br>有兩種情況：①使役動作是「反射性」的行為（如哭、笑），例如：私はその子供を泣かせてしまいました。②被使役化的動詞本身原本就不需要を（如「行く」「座る」這類自動詞），例如：先生は私をトイレに行かせました。若動詞本身已經需要を（如「読む」），Cast就必須用に，不能用を，因為を已經被原本的受詞占用。"],"example":[{"en":"The father made/let his child eat vegetables.","jp":"お<ruby>父<rt>とう</rt></ruby>さんは<ruby>子供<rt>こども</rt></ruby>に<ruby>野菜<rt>やさい</rt></ruby>を<ruby>食<rt>た</rt></ruby>べさせました。","rj":"Otousan wa kodomo ni yasai o tabesasemashita.","say":"お父さんは子供に野菜を食べさせました。"},{"en":"The mother made/let her child read the book.","jp":"お<ruby>母<rt>かあ</rt></ruby>さんは<ruby>子供<rt>こども</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>ませました。","rj":"Okaasan wa kodomo ni hon o yomasemashita.","say":"お母さんは子供に本を読ませました。"},{"en":"I accidentally made the child cry.","jp":"<ruby>私<rt>わたし</rt></ruby>はその<ruby>子供<rt>こども</rt></ruby>を<ruby>泣<rt>な</rt></ruby>かせてしまいました。","rj":"Watashi wa sono kodomo o nakasete shimaimashita.","say":"私はその子供を泣かせてしまいました。"},{"en":"Allen made everyone laugh.","jp":"アレンはみんなを<ruby>笑<rt>わら</rt></ruby>わせました。","rj":"Aren wa minna o warawasemashita.","say":"アレンはみんなを笑わせました。"},{"en":"The teacher made me go to the bathroom.","jp":"<ruby>先生<rt>せんせい</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>をトイレに<ruby>行<rt>い</rt></ruby>かせました。","rj":"Sensei wa watashi o toire ni ikasemashita.","say":"先生は私をトイレに行かせました。"},{"en":"That person made me sit there.","jp":"その<ruby>人<rt>ひと</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>をそこに<ruby>座<rt>すわ</rt></ruby>らせました。","rj":"Sono hito wa watashi o soko ni suwarasemashita.","say":"その人は私をそこに座らせました。"},{"en":"Maki made me read books.","jp":"まきは<ruby>私<rt>わたし</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>ませました。","rj":"Maki wa watashi ni hon o yomasemashita.","say":"まきは私に本を読ませました。"},{"en":"The department manager ordered Ken to work overtime.","jp":"<ruby>部長<rt>ぶちょう</rt></ruby>はけんを<ruby>残業<rt>ざんぎょう</rt></ruby>させました。","rj":"Buchou wa Ken o zangyou sasemashita.","say":"部長はけんを残業させました。"},{"en":"The teacher made the students look the word up in a dictionary.","jp":"<ruby>先生<rt>せんせい</rt></ruby>は<ruby>生徒<rt>せいと</rt></ruby>に<ruby>辞書<rt>じしょ</rt></ruby>で<ruby>言葉<rt>ことば</rt></ruby>を<ruby>調<rt>しら</rt></ruby>べさせました。","rj":"Sensei wa seito ni jisho de kotoba o shirabesasemashita.","say":"先生は生徒に辞書で言葉を調べさせました。"},{"en":"The department manager plans on making Ken go on a business trip.","jp":"<ruby>部長<rt>ぶちょう</rt></ruby>はけんを<ruby>出張<rt>しゅっちょう</rt></ruby>に<ruby>行<rt>い</rt></ruby>かせるつもりです。","rj":"Buchou wa Ken o shucchou ni ikaseru tsumori desu.","say":"部長はけんを出張に行かせるつもりです。"},{"en":"Ken will let Mary bring his phone.","jp":"けんはメアリーに<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>を<ruby>持<rt>も</rt></ruby>っていかせます。","rj":"Ken wa Meari- ni keitaidenwa o motte ikasemasu.","say":"けんはメアリーに携帯電話を持っていかせます。"},{"en":"Will you allow Taka to use your car?","jp":"たかに<ruby>車<rt>くるま</rt></ruby>を<ruby>使<rt>つか</rt></ruby>わせますか？","rj":"Taka ni kuruma o tsukawasemasu ka?","say":"たかに車を使わせますか？"}]},{"num":257,"title":"Causative Sentences 2","vocab":[{"t":"両親（りょうしん）","m":"ryoushin 意思：雙親 (parents)","say":"両親（りょうしん）"},{"t":"飼う（かう）","m":"kau 意思：飼養 (to own (a pet))","say":"飼う（かう）"},{"t":"一人暮らしする（ひとりぐらしする）","m":"hitorigurashi suru 意思：獨自生活 (to live alone)","say":"一人暮らしする（ひとりぐらしする）"},{"t":"弾く（ひく）","m":"hiku 意思：彈奏（樂器） (to play (an instrument))","say":"弾く（ひく）"},{"t":"ギター（ぎたー）","m":"gita- 意思：吉他 (guitar)","say":"ギター（ぎたー）"},{"t":"パソコン（ぱそこん）","m":"pasokon 意思：筆記型電腦 (laptop)","say":"パソコン（ぱそこん）"},{"t":"パスタ（ぱすた）","m":"pasuta 意思：義大利麵 (pasta)","say":"パスタ（ぱすた）"},{"t":"休憩する（きゅうけいする）","m":"kyuukei suru 意思：休息 (to take a break)","say":"休憩する（きゅうけいする）"},{"t":"仕事（しごと）","m":"shigoto 意思：工作 (job)","say":"仕事（しごと）"}],"grammar":["<b>使役形＋てあげる／てもらう／てくれる 是什麼意思？</b><br><br>當使役動詞後面接上てあげる、てくれる、或てもらう，幾乎可以確定這是「allow／let（允許）」的使役，而非「force（強迫）」的使役。句型：[Director]は　[Cast]に　[使役動詞て形]＋あげる／もらう／くれる，Director與Cast的關係、助詞用法分別遵循あげる／もらう／くれる各自原本的規則。","<b>使役形＋てください 是什麼意思？</b><br><br>用於請求對方允許自己做某事，或主動表示願意做某事，相當於英文「Please let me do…」。句型：[使役動詞て形]＋ください。此句型中說話者本身就是Cast，因此常省略「私に」。"],"example":[{"en":"Taka did not allow me to speak in English.","jp":"たかは<ruby>私<rt>わたし</rt></ruby>に<ruby>英語<rt>えいご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>させてくれませんでした。","rj":"Taka wa watashi ni eigo o hanasasete kuremasen deshita.","say":"たかは私に英語を話させてくれませんでした。"},{"en":"I think I will let Kai go to Spain.","jp":"<ruby>私<rt>わたし</rt></ruby>はかいをスペインに<ruby>行<rt>い</rt></ruby>かせてあげるつもりです。","rj":"Watashi wa Kai o Supein ni ikasete ageru tsumori desu.","say":"私はかいをスペインに行かせてあげるつもりです。"},{"en":"Please let me do this job.","jp":"<ruby>私<rt>わたし</rt></ruby>にこの<ruby>仕事<rt>しごと</rt></ruby>をさせてください。","rj":"Watashi ni kono shigoto o sasete kudasai.","say":"私にこの仕事をさせてください。"},{"en":"My parent did not let me keep (own) a dog.","jp":"<ruby>両親<rt>りょうしん</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>に<ruby>犬<rt>いぬ</rt></ruby>を<ruby>飼<rt>か</rt></ruby>わせてくれませんでした。","rj":"Ryoushin wa watashi ni inu o kawasete kuremasen deshita.","say":"両親は私に犬を飼わせてくれませんでした。"},{"en":"My father will not let me live alone.","jp":"お<ruby>父<rt>とう</rt></ruby>さんは<ruby>私<rt>わたし</rt></ruby>に<ruby>一人暮<rt>ひとりぐ</rt></ruby>らしさせてくれません。","rj":"Otousan wa watashi ni hitorigurashi sasete kuremasen.","say":"お父さんは私に一人暮らしさせてくれません。"},{"en":"Ken let me play his guitar yesterday.","jp":"<ruby>昨日<rt>きのう</rt></ruby>けんにギターを<ruby>弾<rt>ひ</rt></ruby>かせてもらいました。","rj":"Kinou Ken ni gita- o hikasete moraimashita.","say":"昨日けんにギターを弾かせてもらいました。"},{"en":"I will let Mia use my laptop.","jp":"みあにパソコンを<ruby>使<rt>つか</rt></ruby>わせてあげます。","rj":"Mia ni pasokon o tsukawasete agemasu.","say":"みあにパソコンを使わせてあげます。"},{"en":"Please let me eat this pasta.","jp":"このパスタを<ruby>食<rt>た</rt></ruby>べさせてください。","rj":"Kono pasuta o tabesasete kudasai.","say":"このパスタを食べさせてください。"},{"en":"Please let me take a break.","jp":"<ruby>休憩<rt>きゅうけい</rt></ruby>させてください。","rj":"Kyuukei sasete kudasai.","say":"休憩させてください。"}]},{"num":258,"title":"Verb Stem + なさい (Command)","vocab":[{"t":"起きる（おきる）","m":"okiru 意思：起床 (to wake up)","say":"起きる（おきる）"},{"t":"にんじん（にんじん）","m":"ninjin 意思：紅蘿蔔 (carrot)","say":"にんじん（にんじん）"},{"t":"シャツ（しゃつ）","m":"shatsu 意思：襯衫 (shirt)","say":"シャツ（しゃつ）"},{"t":"空欄（くうらん）","m":"kuuran 意思：空格 (blank)","say":"空欄（くうらん）"},{"t":"単語（たんご）","m":"tango 意思：單字 (word)","say":"単語（たんご）"},{"t":"入れる（いれる）","m":"ireru 意思：放入 (to put in, fill in)","say":"入れる（いれる）"}],"grammar":["<b>動詞ます形語幹＋なさい 是什麼意思？</b><br><br>表示強烈的命令語氣，相當於英文「Do…（命令）」。句型：[動詞ます形語幹]＋なさい。","<b>使用〜なさい 有什麼限制？</b><br><br>なさい帶有明顯「居高臨下」的語感——說話者自認地位較高、較成熟、對方應該服從。因此只適合父母對子女、老師對學生使用（也常見於考卷答題指示中），不可對長輩、平輩、陌生人使用，否則非常失禮。なさい只有肯定形，沒有對應的否定命令形式；若要表達禁止，需改用「て形＋はいけません」。"],"example":[{"en":"Call home everyday.","jp":"<ruby>毎日<rt>まいにち</rt></ruby>うちに<ruby>電話<rt>でんわ</rt></ruby>しなさい。","rj":"Mainichi uchi ni denwa shinasai.","say":"毎日うちに電話しなさい。"},{"en":"Listen to what the teacher has to say.","jp":"<ruby>先生<rt>せんせい</rt></ruby>の<ruby>言<rt>い</rt></ruby>うことを<ruby>聞<rt>き</rt></ruby>きなさい。","rj":"Sensei no iu koto o kikinasai.","say":"先生の言うことを聞きなさい。"},{"en":"Fill in the blanks with a word.","jp":"<ruby>空欄<rt>くうらん</rt></ruby>に<ruby>単語<rt>たんご</rt></ruby>を<ruby>入<rt>い</rt></ruby>れなさい。","rj":"Kuuran ni tango o irenasai.","say":"空欄に単語を入れなさい。"},{"en":"Wake up.","jp":"<ruby>起<rt>お</rt></ruby>きなさい。","rj":"Okinasai.","say":"起きなさい。"},{"en":"Go to school.","jp":"<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きなさい。","rj":"Gakkou ni ikinasai.","say":"学校に行きなさい。"},{"en":"Eat carrots.","jp":"にんじんを<ruby>食<rt>た</rt></ruby>べなさい。","rj":"Ninjin o tabenasai.","say":"にんじんを食べなさい。"},{"en":"Wear this shirt.","jp":"このシャツを<ruby>着<rt>き</rt></ruby>なさい。","rj":"Kono shatsu o kinasai.","say":"このシャツを着なさい。"},{"en":"Speak in Japanese.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>しなさい。","rj":"Nihongo o hanashinasai.","say":"日本語を話しなさい。"}]},{"num":259,"title":"〜ば (Conditional Statement)","vocab":[{"t":"鍵をかける（かぎをかける）","m":"kagi o kakeru 意思：上鎖 (to lock)","say":"鍵をかける（かぎをかける）"},{"t":"泥棒（どろぼう）","m":"dorobou 意思：小偷 (thief)","say":"泥棒（どろぼう）"},{"t":"入られる（はいられる）","m":"hairareru 意思：被闖入（受身形） (to have (a place) broken into)","say":"入られる（はいられる）"},{"t":"大家さん（おおやさん）","m":"ooyasan 意思：房東 (landlord)","say":"大家さん（おおやさん）"},{"t":"眠たい（ねむたい）","m":"nemutai 意思：想睡的 (sleepy)","say":"眠たい（ねむたい）"},{"t":"タクシー（たくしー）","m":"takushi- 意思：計程車 (taxi)","say":"タクシー（たくしー）"},{"t":"間に合う（まにあう）","m":"maniau 意思：趕得上 (to be on time)","say":"間に合う（まにあう）"},{"t":"前もって（まえもって）","m":"maemotte 意思：事先 (in advance)","say":"前もって（まえもって）"},{"t":"予約する（よやくする）","m":"yoyaku suru 意思：預約 (to make a reservation)","say":"予約する（よやくする）"},{"t":"プロジェクト（ぷろじぇくと）","m":"purojekuto 意思：專案 (project)","say":"プロジェクト（ぷろじぇくと）"},{"t":"完成する（かんせいする）","m":"kansei suru 意思：完成 (to be completed)","say":"完成する（かんせいする）"}],"grammar":["<b>ば形是什麼？各詞性要怎麼變化？</b><br><br>ば是表示假定的句型之一，「A ば B」是「如果A，就會B」。動詞：現在式常體肯定去掉語尾u，改為eba（読む→読めば）。い形容詞：語幹（去い）＋ければ（面白い→面白ければ）。否定形（所有詞性）：現在式常體否定去掉い，改為ければ。","<b>な形容詞、名詞的「肯定」假定，為什麼不用ば形？</b><br><br>な形容詞、名詞的肯定假定不用ば形，改用「なら」或「ならば」：学生なら／ならば、元気なら／ならば。ばAB通常用於「A這個條件能保證B會有好結果」的情境，因此常帶有建議A該怎麼做的語氣。"],"example":[{"en":"If you have a car, you can go to various places.","jp":"<ruby>車<rt>くるま</rt></ruby>があれば、色々(いろいろ)なところに<ruby>行<rt>い</rt></ruby>けます。","rj":"Kuruma ga areba, iroiro na tokoro ni ikemasu.","say":"車があれば、色々なところに行けます。"},{"en":"If you lock the door, you won't have your apartment broken into.","jp":"<ruby>鍵<rt>かぎ</rt></ruby>をかけておけば、<ruby>泥棒<rt>どろぼう</rt></ruby>に<ruby>入<rt>はい</rt></ruby>られません。","rj":"Kagi o kakete okeba, dorobou ni hairaremasen.","say":"鍵をかけておけば、泥棒に入られません。"},{"en":"If you do not tell the landlord, he will never find that out.","jp":"<ruby>大家<rt>おおや</rt></ruby>さんに<ruby>言<rt>い</rt></ruby>わなければ、<ruby>分<rt>わ</rt></ruby>かりませんよ。","rj":"Ooyasan ni iwanakereba, wakarimasen yo.","say":"大家さんに言わなければ、分かりませんよ。"},{"en":"You will be okay if you take this medicine.","jp":"この<ruby>薬<rt>くすり</rt></ruby>を<ruby>飲<rt>の</rt></ruby>めば、<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>です。","rj":"Kono kusuri o nomeba, daijoubu desu.","say":"この薬を飲めば、大丈夫です。"},{"en":"All you have to do is ask the teacher.","jp":"<ruby>先生<rt>せんせい</rt></ruby>に<ruby>聞<rt>き</rt></ruby>けば、いいんです。","rj":"Sensei ni kikeba, iin desu.","say":"先生に聞けば、いいんです。"},{"en":"If you sleep early, you won't be sleepy tomorrow.","jp":"<ruby>早<rt>はや</rt></ruby>く<ruby>寝<rt>ね</rt></ruby>れば、<ruby>明日<rt>あした</rt></ruby><ruby>眠<rt>ねむ</rt></ruby>たくなりません。","rj":"Hayaku nereba, ashita nemutaku narimasen.","say":"早く寝れば、明日眠たくなりません。"},{"en":"If you take a taxi, you will be on time.","jp":"タクシーに<ruby>乗<rt>の</rt></ruby>れば、<ruby>間<rt>ま</rt></ruby>に<ruby>合<rt>あ</rt></ruby>います。","rj":"Takushii ni noreba, maniaimasu.","say":"タクシーに乗れば、間に合います。"},{"en":"If we make a reservation in advance, we will be all right.","jp":"<ruby>前<rt>まえ</rt></ruby>もって<ruby>予約<rt>よやく</rt></ruby>すれば、<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>です。","rj":"Maemotte yoyaku sureba, daijoubu desu.","say":"前もって予約すれば、大丈夫です。"},{"en":"If you work overtime, the project will be completed.","jp":"<ruby>残業<rt>ざんぎょう</rt></ruby>すれば、プロジェクトは<ruby>完成<rt>かんせい</rt></ruby>します。","rj":"Zangyou sureba, purojekuto wa kansei shimasu.","say":"残業すれば、プロジェクトは完成します。"}]},{"num":260,"title":"〜のに (Even though...)","vocab":[{"t":"会社（かいしゃ）","m":"kaisha 意思：公司 (company)","say":"会社（かいしゃ）"},{"t":"給料（きゅうりょう）","m":"kyuuryou 意思：薪水 (salary)","say":"給料（きゅうりょう）"},{"t":"低い（ひくい）","m":"hikui 意思：低的 (low)","say":"低い（ひくい）"},{"t":"電話に出る（でんわにでる）","m":"denwa ni deru 意思：接電話 (to answer the phone)","say":"電話に出る（でんわにでる）"},{"t":"嫌いな（きらいな）","m":"kirai na 意思：討厭的 (to dislike)","say":"嫌いな（きらいな）"},{"t":"相談する（そうだんする）","m":"soudan suru 意思：商量 (to consult)","say":"相談する（そうだんする）"},{"t":"期末試験（きまつしけん）","m":"kimatsu shiken 意思：期末考 (final exam)","say":"期末試験（きまつしけん）"},{"t":"練習する（れんしゅうする）","m":"renshuu suru 意思：練習 (to practice)","say":"練習する（れんしゅうする）"},{"t":"負ける（まける）","m":"makeru 意思：輸 (to lose)","say":"負ける（まける）"},{"t":"勝つ（かつ）","m":"katsu 意思：贏 (to win)","say":"勝つ（かつ）"}],"grammar":["<b>〜のに 是什麼意思？</b><br><br>のに用來連接兩個「在預期之外同時成立」的事實A、B，相當於中文「明明…卻…、儘管…」。句型：[事實A（常體）]＋のに、[出乎意料的事實B]。","<b>な形容詞、名詞接續 のに 時要注意什麼？</b><br><br>若Fact A是な形容詞或名詞＋です，且為現在式肯定，語尾的「だ」要改成「な」（僅限現在肯定，過去式、否定式不變）：親切だ→親切なのに、問題だ→問題なのに。","<b>為什麼 B 子句不能是請求句或提議句？</b><br><br>因為のに連接的是兩個「事實」，所以B子句不能是非事實性質的句子，例如請求（てください）或提議（ましょう）都不可以接在のに後面，這種情境應該改用「けど」（雖然…但是…，語氣較中性、不強調「事實對比」）。"],"example":[{"en":"This company is rich, but its workers' salary is low.","jp":"この<ruby>会社<rt>かいしゃ</rt></ruby>はお<ruby>金<rt>かね</rt></ruby>があるのに、<ruby>給料<rt>きゅうりょう</rt></ruby>は<ruby>低<rt>ひく</rt></ruby>いです。","rj":"Kono kaisha wa okane ga aru noni, kyuuryou wa hikui desu.","say":"この会社はお金があるのに、給料は低いです。"},{"en":"She is home but does not answer the phone.","jp":"<ruby>家<rt>いえ</rt></ruby>にいるのに、<ruby>電話<rt>でんわ</rt></ruby>にでない。","rj":"Ie ni iru noni, denwa ni denai.","say":"家にいるのに、電話にでない。"},{"en":"Ken is nice, but Miki does not like him.","jp":"けんは<ruby>親切<rt>しんせつ</rt></ruby>なのに、みきはけんが<ruby>嫌<rt>きら</rt></ruby>いです。","rj":"Ken wa shinsetsu na noni, Miki wa Ken ga kirai desu.","say":"けんは親切なのに、みきはけんが嫌いです。"},{"en":"It is a big issue, but he does not consult with anybody.","jp":"<ruby>大<rt>おお</rt></ruby>きい<ruby>問題<rt>もんだい</rt></ruby>なのに、あの<ruby>人<rt>ひと</rt></ruby>はだれにも<ruby>相談<rt>そうだん</rt></ruby>しません。","rj":"Ookii mondai na noni, ano hito wa dare ni mo soudan shimasen.","say":"大きい問題なのに、あの人はだれにも相談しません。"},{"en":"This Japanese is a bit difficult, but please read it.","jp":"<ruby>少<rt>すこ</rt></ruby>し<ruby>難<rt>むずか</rt></ruby>しいけど、これを<ruby>読<rt>よ</rt></ruby>んでください。","rj":"Sukoshi muzukashii kedo, kore o yonde kudasai.","say":"少し難しいけど、これを読んでください。"},{"en":"The food does not look very promising, but let's eat here.","jp":"あまり<ruby>美味<rt>おい</rt></ruby>しそうじゃないけど、ここで<ruby>食<rt>た</rt></ruby>べましょう。","rj":"Amari oishisou ja nai kedo, koko de tabemashou.","say":"あまり美味しそうじゃないけど、ここで食べましょう。"},{"en":"Although I have a final exam today, I did not study.","jp":"<ruby>今日<rt>きょう</rt></ruby><ruby>期末試験<rt>きまつしけん</rt></ruby>があるのに、<ruby>勉強<rt>べんきょう</rt></ruby>しませんでした。","rj":"Kyou kimatsushiken ga aru noni, benkyou shimasen deshita.","say":"今日期末試験があるのに、勉強しませんでした。"},{"en":"Although I practiced everyday, we lost.","jp":"<ruby>毎日<rt>まいにち</rt></ruby><ruby>練習<rt>れんしゅう</rt></ruby>したのに、<ruby>負<rt>ま</rt></ruby>けました。","rj":"Mainichi renshuu shita noni, makemashita.","say":"毎日練習したのに、負けました。"},{"en":"Although I did not practice everyday, I won.","jp":"<ruby>毎日<rt>まいにち</rt></ruby><ruby>練習<rt>れんしゅう</rt></ruby>しなかったのに、<ruby>勝<rt>か</rt></ruby>ちました。","rj":"Mainichi renshuu shinakatta noni, kachimashita.","say":"毎日練習しなかったのに、勝ちました。"},{"en":"Although I gave Ken a present, he did not say thank you.","jp":"けんにプレゼントをあげたのに、けんはありがとうと<ruby>言<rt>い</rt></ruby>いませんでした。","rj":"Ken ni purezento o ageta noni, Ken wa arigatou to iimasen deshita.","say":"けんにプレゼントをあげたのに、けんはありがとうと言いませんでした。"}]},{"num":261,"title":"〜のような・〜のように (Like...)","vocab":[{"t":"鎌倉（かまくら）","m":"kamakura 意思：鎌倉（地名） (Kamakura)","say":"鎌倉（かまくら）"},{"t":"魚（さかな）","m":"sakana 意思：魚 (fish)","say":"魚（さかな）"},{"t":"上手な（じょうずな）","m":"jouzu na 意思：擅長的 (good at)","say":"上手な（じょうずな）"},{"t":"泳ぐ（およぐ）","m":"oyogu 意思：游泳 (to swim)","say":"泳ぐ（およぐ）"},{"t":"壊れた（こわれた）","m":"kowareta 意思：壞掉的 (broken)","say":"壊れた（こわれた）"},{"t":"レコード（れこーど）","m":"reko-do 意思：唱片 (vinyl record)","say":"レコード（れこーど）"},{"t":"同じこと（おなじこと）","m":"onaji koto 意思：同樣的事 (the same thing)","say":"同じこと（おなじこと）"},{"t":"墓場（はかば）","m":"hakaba 意思：墓地 (graveyard)","say":"墓場（はかば）"},{"t":"静かな（しずかな）","m":"shizuka na 意思：安靜的 (quiet)","say":"静かな（しずかな）"},{"t":"鳥（とり）","m":"tori 意思：鳥 (bird)","say":"鳥（とり）"},{"t":"有名な（ゆうめいな）","m":"yuumei na 意思：有名的 (famous)","say":"有名な（ゆうめいな）"}],"grammar":["<b>〜のような 跟 〜のように 有什麼差別？</b><br><br>のような修飾後面的名詞：[Noun A]＋のような＋[Noun B]，表示Noun A與Noun B具有相似的外觀或性質，或Noun A是Noun B的一個實例，例如：鎌倉のようなまち（像鎌倉這樣的城鎮）。のように修飾後面的動詞或形容詞：[Noun A]＋のように＋[動詞／形容詞]，用來描述「以與A相同的方式進行某動作」，或「性質與A相當」，例如：魚のように上手に泳げます。"],"example":[{"en":"I like towns like Kamakura.","jp":"<ruby>鎌倉<rt>かまくら</rt></ruby>のようなまちが<ruby>好<rt>す</rt></ruby>きです。","rj":"Kamakura no you na machi ga suki desu.","say":"鎌倉のようなまちが好きです。"},{"en":"I want to be a person like Mary.","jp":"メアリーのような<ruby>人<rt>ひと</rt></ruby>になりたいです。","rj":"Meari- no you na hito ni naritai desu.","say":"メアリーのような人になりたいです。"},{"en":"Mary can swim very well, just like a fish.","jp":"メアリーは<ruby>魚<rt>さかな</rt></ruby>のように<ruby>上手<rt>じょうず</rt></ruby>に<ruby>泳<rt>およ</rt></ruby>げます。","rj":"Meari- wa sakana no you ni jouzu ni oyogemasu.","say":"メアリーは魚のように上手に泳げます。"},{"en":"Ken is strong like Takeshi.","jp":"けんはたけしのように<ruby>強<rt>つよ</rt></ruby>いです。","rj":"Ken wa Takeshi no you ni tsuyoi desu.","say":"けんはたけしのように強いです。"},{"en":"Ken says the same thing over and over again, just like a broken vinyl record.","jp":"けんは<ruby>壊<rt>こわ</rt></ruby>れたレコードのように<ruby>同<rt>おな</rt></ruby>じことを<ruby>言<rt>い</rt></ruby>います。","rj":"Ken wa kowareta reko-do no you ni onaji koto o iimasu.","say":"けんは壊れたレコードのように同じことを言います。"},{"en":"This town is as quiet as a graveyard at night.","jp":"この<ruby>街<rt>まち</rt></ruby>は<ruby>夜<rt>よる</rt></ruby>の<ruby>墓場<rt>はかば</rt></ruby>のように<ruby>静<rt>しず</rt></ruby>かです。","rj":"Kono machi wa yoru no hakaba no you ni shizuka desu.","say":"この街は夜の墓場のように静かです。"},{"en":"I like movies like Titanic.","jp":"タイタニックのような<ruby>映画<rt>えいが</rt></ruby>が<ruby>好<rt>す</rt></ruby>きです。","rj":"Taitanikku no you na eiga ga suki desu.","say":"タイタニックのような映画が好きです。"},{"en":"Maya can sing well like a bird.","jp":"まやは<ruby>鳥<rt>とり</rt></ruby>のように<ruby>上手<rt>じょうず</rt></ruby>に<ruby>歌<rt>うた</rt></ruby>えます。","rj":"Maya wa tori no you ni jouzu ni utaemasu.","say":"まやは鳥のように上手に歌えます。"},{"en":"I don't want to live in a city like Tokyo.","jp":"<ruby>東京<rt>とうきょう</rt></ruby>のような<ruby>街<rt>まち</rt></ruby>に<ruby>住<rt>す</rt></ruby>みたくないです。","rj":"Toukyou no you na machi ni sumitakunai desu.","say":"東京のような街に住みたくないです。"},{"en":"I want to be famous like Taylor Swift.","jp":"テイラー・スイフトのように<ruby>有名<rt>ゆうめい</rt></ruby>になりたいです。","rj":"Teira- Suifuto no you ni yuumei ni naritai desu.","say":"テイラー・スイフトのように有名になりたいです。"}]},{"num":262,"title":"Causative-Passive Sentences","vocab":[{"t":"兄（あに）","m":"ani 意思：哥哥 (older brother)","say":"兄（あに）"},{"t":"肉（にく）","m":"niku 意思：肉 (meat)","say":"肉（にく）"},{"t":"宿題（しゅくだい）","m":"shukudai 意思：作業 (homework)","say":"宿題（しゅくだい）"},{"t":"手伝う（てつだう）","m":"tetsudau 意思：幫忙 (to help)","say":"手伝う（てつだう）"},{"t":"お皿（おさら）","m":"osara 意思：盤子 (dishes/plate)","say":"お皿（おさら）"},{"t":"洗う（あらう）","m":"arau 意思：洗 (to wash)","say":"洗う（あらう）"},{"t":"書く（かく）","m":"kaku 意思：寫 (to write)","say":"書く（かく）"},{"t":"来る（くる）","m":"kuru 意思：來 (to come)","say":"来る（くる）"},{"t":"駅（えき）","m":"eki 意思：車站 (station)","say":"駅（えき）"},{"t":"前（まえ）","m":"mae 意思：前面 (in front of)","say":"前（まえ）"},{"t":"〜間（〜かん）","m":"~kan 意思：…期間 (for (a period))","say":"〜間（〜かん）"},{"t":"パン（ぱん）","m":"pan 意思：麵包 (bread)","say":"パン（ぱん）"}],"grammar":["<b>使役受身形是什麼意思？動詞要怎麼變成使役受身形？</b><br><br>使役受身形是使役形的被動版本，用來表達「被迫、被騷擾、被說服去做原本不想做的事」。Ru-verb：去掉語尾「る」，加上「させられる」。U-verb語尾為す：去掉す，加上させられる。其餘U-verb：語尾u音改為asareru（行く iku→行かされる ikasareru）。不規則動詞：する→させられる、くる→こさせられる。","<b>使役受身句的句型結構，跟使役句有什麼不同？</b><br><br>[Cast]は／が　[Director]に　[Action（使役受身形）]。跟使役形（[Director]は [Cast]に…）相比，Cast與Director的角色（助詞）互換：使役受身的Cast（被強迫的人）現在變成主語，Director（下令者）變成用に標示的對象。"],"example":[{"en":"I was forced to sing by my older brother.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>兄<rt>あに</rt></ruby>に<ruby>歌<rt>うた</rt></ruby>を<ruby>歌<rt>うた</rt></ruby>わされました。","rj":"Watashi wa ani ni uta o utawasaremashita.","say":"私は兄に歌を歌わされました。"},{"en":"I am always made to eat meat by Miki.","jp":"<ruby>私<rt>わたし</rt></ruby>はみきにいつも<ruby>肉<rt>にく</rt></ruby>を<ruby>食<rt>た</rt></ruby>べさせられます。","rj":"Watashi wa Miki ni itsumo niku o tabesaseraremasu.","say":"私はみきにいつも肉を食べさせられます。"},{"en":"Yumi was made to study by her mother.","jp":"ゆみはお<ruby>母<rt>かあ</rt></ruby>さんに<ruby>勉強<rt>べんきょう</rt></ruby>させられました。","rj":"Yumi wa okaasan ni benkyou saseraremashita.","say":"ゆみはお母さんに勉強させられました。"},{"en":"My mother made me wash dishes.","jp":"<ruby>私<rt>わたし</rt></ruby>はお<ruby>母<rt>かあ</rt></ruby>さんにお<ruby>皿<rt>さら</rt></ruby>を<ruby>洗<rt>あら</rt></ruby>わされました。","rj":"Watashi wa okaasan ni osara o arawasaremashita.","say":"私はお母さんにお皿を洗わされました。"},{"en":"Who made you write this?","jp":"あなたは<ruby>誰<rt>だれ</rt></ruby>にこれを<ruby>書<rt>か</rt></ruby>かされましたか？","rj":"Anata wa dare ni kore o kakasaremashita ka?","say":"あなたは誰にこれを書かされましたか？"},{"en":"Tsukasa always makes me come to his house.","jp":"わたしはいつもつかさに<ruby>家<rt>いえ</rt></ruby>に<ruby>来<rt>こ</rt></ruby>させられます。","rj":"Watashi wa itsumo Tsukasa ni ie ni kosaseraremasu.","say":"わたしはいつもつかさに家に来させられます。"},{"en":"Mako made me wait in front of the station for 1 hour.","jp":"わたしはまこに<ruby>駅<rt>えき</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>で1<ruby>時間<rt>いちじかん</rt></ruby><ruby>待<rt>ま</rt></ruby>たされました。","rj":"Watashi wa Mako ni eki no mae de ichijikan matasaremashita.","say":"わたしはまこに駅の前で1時間待たされました。"},{"en":"Satoshi did not make me eat the bread.","jp":"わたしはさとしにパンを<ruby>食<rt>た</rt></ruby>べさせられませんでした。","rj":"Watashi wa Satoshi ni pan o tabesaseraremasen deshita.","say":"わたしはさとしにパンを食べさせられませんでした。"}]},{"num":263,"title":"〜ても","vocab":[{"t":"雨が降る（あめがふる）","m":"ame ga furu 意思：下雨 (to rain)","say":"雨が降る（あめがふる）"},{"t":"暑い（あつい）","m":"atsui 意思：熱的 (hot)","say":"暑い（あつい）"},{"t":"エアコン（えあこん）","m":"eakon 意思：冷氣 (air conditioner)","say":"エアコン（えあこん）"},{"t":"つける（つける）","m":"tsukeru 意思：打開（開關） (to turn on)","say":"つける（つける）"},{"t":"おなかがへる（おなかがへる）","m":"onaka ga heru 意思：肚子餓 (to be hungry)","say":"おなかがへる（おなかがへる）"},{"t":"雨が止む（あめがやむ）","m":"ame ga yamu 意思：雨停 (to stop raining)","say":"雨が止む（あめがやむ）"},{"t":"出かける（でかける）","m":"dekakeru 意思：出門 (to go out)","say":"出かける（でかける）"},{"t":"続ける（つづける）","m":"tsuzukeru 意思：繼續 (to continue)","say":"続ける（つづける）"},{"t":"成績（せいせき）","m":"seiseki 意思：成績 (grade)","say":"成績（せいせき）"},{"t":"悪い（わるい）","m":"warui 意思：差的、壞的 (bad)","say":"悪い（わるい）"},{"t":"約束を守る（やくそくをまもる）","m":"yakusoku o mamoru 意思：遵守約定 (to keep a promise)","say":"約束を守る（やくそくをまもる）"},{"t":"文句を言う（もんくをいう）","m":"monku o iu 意思：抱怨 (to complain)","say":"文句を言う（もんくをいう）"},{"t":"退屈な（たいくつな）","m":"taikutsu na 意思：無聊的 (boring)","say":"退屈な（たいくつな）"}],"grammar":["<b>〜ても 是什麼意思？怎麼接？</b><br><br>ても表示「即使…也…」，由動詞／形容詞的て形加上「も」構成；な形容詞、名詞則是「でも」。句型：[Sentence A（て形＋も）]＋[Sentence B]，相當於英文「[Sentence B] even though [Sentence A]」。ても子句本身沒有固定時態，Sentence B的時態則依句意自由決定。","<b>〜ても 跟 〜たら 有什麼差別？</b><br><br>て形＋も＝「即使…（假設）也會…」（even if）——強調即使A發生，B的結果也不會改變。過去式常體＋ら＝「如果…就…」（if...then）——單純描述條件成立時的結果，並未強調「不受影響」的語氣。例如：雨が降っても、ピクニックに行きます。（就算下雨我還是會去野餐）vs 雨が降ったら、ピクニックに行きません。（如果下雨我就不去野餐了）"],"example":[{"en":"I went to class everyday, even if it rained.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>っていても、<ruby>毎日<rt>まいにち</rt></ruby><ruby>授業<rt>じゅぎょう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","rj":"Watashi wa ame ga futte itemo, mainichi jugyou ni ikimashita.","say":"私は雨が降っていても、毎日授業に行きました。"},{"en":"I will not turn on the air conditioner, even if it is hot.","jp":"<ruby>暑<rt>あつ</rt></ruby>くても、エアコンをつけません。","rj":"Atsukutemo, eakon o tsukemasen.","say":"暑くても、エアコンをつけません。"},{"en":"I can eat the cake, even if I am not hungry.","jp":"おなかがへってなくても、ケーキは<ruby>食<rt>た</rt></ruby>べられます。","rj":"Onaka ga hettenakutemo, keeki wa taberaremasu.","say":"おなかがへってなくても、ケーキは食べられます。"},{"en":"You will be able to understand it, even if you are a child.","jp":"<ruby>子供<rt>こども</rt></ruby>でも、わかります。","rj":"Kodomo demo, wakarimasu.","say":"子供でも、わかります。"},{"en":"I will not go out, even if it stops raining.","jp":"<ruby>雨<rt>あめ</rt></ruby>が<ruby>止<rt>や</rt></ruby>んでも、<ruby>出<rt>で</rt></ruby>かけません。","rj":"Ame ga yandemo, dekakemasen.","say":"雨が止んでも、出かけません。"},{"en":"I will continue the study of Japanese, even if the grade is bad.","jp":"<ruby>成績<rt>せいせき</rt></ruby>が<ruby>悪<rt>わる</rt></ruby>くても、<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>勉強<rt>べんきょう</rt></ruby>を<ruby>続<rt>つづ</rt></ruby>けます。","rj":"Seiseki ga warukutemo, nihongo no benkyou o tsuzukemasu.","say":"成績が悪くても、日本語の勉強を続けます。"},{"en":"My friend says nothing, even if I don't keep a promise.","jp":"<ruby>約束<rt>やくそく</rt></ruby>を<ruby>守<rt>まも</rt></ruby>らなくても、<ruby>友達<rt>ともだち</rt></ruby>は<ruby>何<rt>なに</rt></ruby>も<ruby>言<rt>い</rt></ruby>いません。","rj":"Yakusoku o mamoranakutemo, tomodachi wa nanimo iimasen.","say":"約束を守らなくても、友達は何も言いません。"},{"en":"I don't complain, even if the class is boring.","jp":"<ruby>授業<rt>じゅぎょう</rt></ruby>が<ruby>退屈<rt>たいくつ</rt></ruby>でも、<ruby>文句<rt>もんく</rt></ruby>を<ruby>言<rt>い</rt></ruby>いません。","rj":"Jugyou ga taikutsu demo, monku o iimasen.","say":"授業が退屈でも、文句を言いません。"}]},{"num":264,"title":"〜ことにする","vocab":[{"t":"車（くるま）","m":"kuruma 意思：車 (car)","say":"車（くるま）"},{"t":"文句（もんく）","m":"monku 意思：抱怨 (complaint)","say":"文句（もんく）"},{"t":"夏（なつ）","m":"natsu 意思：夏天 (summer)","say":"夏（なつ）"},{"t":"ベトナム（べとなむ）","m":"betonamu 意思：越南 (Vietnam)","say":"ベトナム（べとなむ）"},{"t":"お酒（おさけ）","m":"osake 意思：酒 (alcohol)","say":"お酒（おさけ）"},{"t":"試験を受ける（しけんをうける）","m":"shiken o ukeru 意思：應考 (to take an examination)","say":"試験を受ける（しけんをうける）"},{"t":"一晩中（ひとばんじゅう）","m":"hitobanjuu 意思：一整晚 (all night)","say":"一晩中（ひとばんじゅう）"},{"t":"起きている（おきている）","m":"okite iru 意思：醒著 (to stay up, to be awake)","say":"起きている（おきている）"},{"t":"〜までに（〜までに）","m":"~made ni 意思：在…之前 (by (a certain time))","say":"〜までに（〜までに）"},{"t":"悪口を言う（わるぐちをいう）","m":"waruguchi o iu 意思：說壞話 (to talk behind someone's back)","say":"悪口を言う（わるぐちをいう）"}],"grammar":["<b>〜ことにする 的基本用法是什麼？</b><br><br>表示「做出了…的決定」，句型：[Activity（現在式常體，肯定或否定）]＋ことにする，常用過去式（ことにしました）表達「已經決定了」。","<b>〜ことにしよう 是什麼意思？</b><br><br>意向形＋ことにしよう，表示「（那就）決定…吧！」，相較於單純的意向形，ことにしよう多了「經過一番猶豫、考慮後才做出這個決定」的語感，常見於「乾脆就這麼決定吧」的情境。","<b>〜ことにしている 是什麼意思？</b><br><br>表示「已經下定決心要做某事，並且持續、規律地執行這個決定」（比單純的習慣更強調「有意識地堅持」），相當於「習慣性地做…」。"],"example":[{"en":"I have decided to buy a car.","jp":"<ruby>車<rt>くるま</rt></ruby>を<ruby>買<rt>か</rt></ruby>うことにしました。","rj":"Kuruma o kau koto ni shimashita.","say":"車を買うことにしました。"},{"en":"I have decided not to make too many complaints.","jp":"あまり<ruby>文句<rt>もんく</rt></ruby>を<ruby>言<rt>い</rt></ruby>わないことにします。","rj":"Amari monku o iwanai koto ni shimasu.","say":"あまり文句を言わないことにします。"},{"en":"Let's go to Vietnam this summer.","jp":"<ruby>夏<rt>なつ</rt></ruby>はベトナムに<ruby>行<rt>い</rt></ruby>くことにしよう。","rj":"Natsu wa Betonamu ni iku koto ni shiyou.","say":"夏はベトナムに行くことにしよう。"},{"en":"Let's not go to Vietnam this summer.","jp":"<ruby>夏<rt>なつ</rt></ruby>はベトナムに<ruby>行<rt>い</rt></ruby>かないことにしよう。","rj":"Natsu wa Betonamu ni ikanai koto ni shiyou.","say":"夏はベトナムに行かないことにしよう。"},{"en":"I make it a rule to go to bed at ten every night.","jp":"<ruby>毎日<rt>まいにち</rt></ruby>10<ruby>時<rt>じ</rt></ruby>に<ruby>寝<rt>ね</rt></ruby>ることにしています。","rj":"Mainichi juuji ni neru koto ni shite imasu.","say":"毎日10時に寝ることにしています。"},{"en":"I have made a decision not to drink (and have followed it).","jp":"お<ruby>酒<rt>さけ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>まないことにしています。","rj":"Osake o nomanai koto ni shite imasu.","say":"お酒を飲まないことにしています。"},{"en":"Maki has decided to take the examination next year.","jp":"まきは<ruby>来年<rt>らいねん</rt></ruby><ruby>試験<rt>しけん</rt></ruby>を<ruby>受<rt>う</rt></ruby>けることにしました。","rj":"Maki wa rainen shiken o ukeru koto ni shimashita.","say":"まきは来年試験を受けることにしました。"},{"en":"John has decided to stay up all night.","jp":"ジョンは<ruby>一晩中<rt>ひとばんじゅう</rt></ruby><ruby>起<rt>お</rt></ruby>きていることにしました。","rj":"Jon wa hitobanjuu okite iru koto ni shimashita.","say":"ジョンは一晩中起きていることにしました。"},{"en":"Maki goes to bed by twelve every night.","jp":"まきは<ruby>毎晩<rt>まいばん</rt></ruby>12<ruby>時<rt>じ</rt></ruby>までに<ruby>寝<rt>ね</rt></ruby>ることにしています。","rj":"Maki wa maiban juuniji made ni neru koto ni shite imasu.","say":"まきは毎晩12時までに寝ることにしています。"},{"en":"Takeshi does not talk behind someone's back.","jp":"たけしは<ruby>悪口<rt>わるぐち</rt></ruby>を<ruby>言<rt>い</rt></ruby>わないことにしています。","rj":"Takeshi wa waruguchi o iwanai koto ni shite imasu.","say":"たけしは悪口を言わないことにしています。"}]},{"num":265,"title":"〜まで","vocab":[{"t":"晴れる（はれる）","m":"hareru 意思：放晴 (to become sunny)","say":"晴れる（はれる）"},{"t":"カフェ（かふぇ）","m":"kafe 意思：咖啡廳 (café)","say":"カフェ（かふぇ）"},{"t":"フランス（ふらんす）","m":"furansu 意思：法國 (France)","say":"フランス（ふらんす）"},{"t":"帰る（かえる）","m":"kaeru 意思：回去 (to go back)","say":"帰る（かえる）"},{"t":"赤ちゃん（あかちゃん）","m":"akachan 意思：嬰兒 (baby)","say":"赤ちゃん（あかちゃん）"},{"t":"貯める（ためる）","m":"tameru 意思：存（錢） (to save (money))","say":"貯める（ためる）"},{"t":"旅行する（りょこうする）","m":"ryokou suru 意思：旅行 (to travel)","say":"旅行する（りょこうする）"},{"t":"終わる（おわる）","m":"owaru 意思：結束 (to finish (intransitive))","say":"終わる（おわる）"},{"t":"ビール（びーる）","m":"bi-ru 意思：啤酒 (beer)","say":"ビール（びーる）"},{"t":"止む（やむ）","m":"yamu 意思：（雨、雪）停止 (to stop (rain/snow))","say":"止む（やむ）"}],"grammar":["<b>「B まで A」是什麼意思？</b><br><br>表示「A這件事會持續發生，直到B發生為止」。句型：[Event B]＋まで、[Event A]，相當於英文「[Event A] continues until [Event B].」。Event B（截止點）以現在式常體肯定結尾（即使整句在描述過去發生的事，B仍固定用現在式），通常是表示「變化」的動詞（如晴れる、なる）。","<b>Event B 的主語跟 Event A 不同時，要注意什麼？</b><br><br>若Event B的主語與Event A的主語不同，Event B的主語要用「が」標示（而不是は）。例如：赤ちゃんが寝るまで、私は歌を歌ってあげます。"],"example":[{"en":"I will wait in the coffee shop until it becomes sunny.","jp":"<ruby>晴<rt>は</rt></ruby>れるまで、カフェで<ruby>待<rt>ま</rt></ruby>ちます。","rj":"Hareru made, kafe de machimasu.","say":"晴れるまで、カフェで待ちます。"},{"en":"I will not go back to France, until I become fluent in Japanese.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>上手<rt>じょうず</rt></ruby>になるまで、フランスに<ruby>帰<rt>かえ</rt></ruby>りません。","rj":"Nihongo ga jouzu ni naru made, Furansu ni kaerimasen.","say":"日本語が上手になるまで、フランスに帰りません。"},{"en":"I will sing a lullaby till the baby falls asleep.","jp":"<ruby>赤<rt>あか</rt></ruby>ちゃんが<ruby>寝<rt>ね</rt></ruby>るまで、<ruby>私<rt>わたし</rt></ruby>は<ruby>歌<rt>うた</rt></ruby>を<ruby>歌<rt>うた</rt></ruby>ってあげます。","rj":"Akachan ga neru made, watashi wa uta o utatte agemasu.","say":"赤ちゃんが寝るまで、私は歌を歌ってあげます。"},{"en":"I will not travel until I save money.","jp":"お<ruby>金<rt>かね</rt></ruby>を<ruby>貯<rt>た</rt></ruby>めるまで、<ruby>旅行<rt>りょこう</rt></ruby>しません。","rj":"Okane o tameru made, ryokou shimasen.","say":"お金を貯めるまで、旅行しません。"},{"en":"Could you wait for me until my homework is finished?","jp":"<ruby>宿題<rt>しゅくだい</rt></ruby>が<ruby>終<rt>お</rt></ruby>わるまで、<ruby>待<rt>ま</rt></ruby>ってくれませんか？","rj":"Shukudai ga owaru made, matte kuremasen ka?","say":"宿題が終わるまで、待ってくれませんか？"},{"en":"You must not drink beer until you become 20 years old.","jp":"20<ruby>歳<rt>はたち</rt></ruby>になるまで、ビールを<ruby>飲<rt>の</rt></ruby>んではいけません。","rj":"Hatachi ni naru made, bi-ru o nonde wa ikemasen.","say":"20歳になるまで、ビールを飲んではいけません。"},{"en":"I had to wait until the rain stopped.","jp":"<ruby>雨<rt>あめ</rt></ruby>が<ruby>止<rt>や</rt></ruby>むまで、<ruby>待<rt>ま</rt></ruby>たなくちゃいけませんでした。","rj":"Ame ga yamu made, matanakuchaikemasen deshita.","say":"雨が止むまで、待たなくちゃいけませんでした。"}]},{"num":266,"title":"〜方（かた）","vocab":[{"t":"漢字（かんじ）","m":"kanji 意思：漢字 (kanji)","say":"漢字（かんじ）"},{"t":"読む（よむ）","m":"yomu 意思：讀 (to read)","say":"読む（よむ）"},{"t":"はし（はし）","m":"hashi 意思：筷子 (chopsticks)","say":"はし（はし）"},{"t":"使う（つかう）","m":"tsukau 意思：使用 (to use)","say":"使う（つかう）"},{"t":"お風呂に入る（おふろにはいる）","m":"ofuro ni hairu 意思：泡澡 (to take a bath)","say":"お風呂に入る（おふろにはいる）"},{"t":"パスタ（ぱすた）","m":"pasuta 意思：義大利麵 (pasta)","say":"パスタ（ぱすた）"},{"t":"メール（めーる）","m":"me-ru 意思：電子郵件 (email)","say":"メール（めーる）"},{"t":"送る（おくる）","m":"okuru 意思：寄送 (to send)","say":"送る（おくる）"},{"t":"予約する（よやくする）","m":"yoyaku suru 意思：預約 (to make a reservation)","say":"予約する（よやくする）"},{"t":"フライト（ふらいと）","m":"furaito 意思：班機 (flight)","say":"フライト（ふらいと）"},{"t":"焼く（やく）","m":"yaku 意思：烘烤 (to bake)","say":"焼く（やく）"},{"t":"泳ぐ（およぐ）","m":"oyogu 意思：游泳 (to swim)","say":"泳ぐ（およぐ）"}],"grammar":["<b>名詞化接尾詞「方（かた）」是什麼意思？動詞要怎麼變化？</b><br><br>方（かた）接在動詞ます形語幹之後，表示「做某事的方法」或「（某人）做某事的樣子」。變化規則：食べる→食べ方、行く→行き方、する→し方、くる→き方。","<b>接上「方」之後，原本搭配動詞的助詞要怎麼變？</b><br><br>重要規則：原本搭配動詞的助詞，接上「方」之後統一改為「の」。例如：漢字を読む→漢字の読み方；家に行く→家の行き方。","<b>複合する動詞（名詞＋する）接「方」時有什麼特別規則？</b><br><br>する之前的名詞，一律用「の」接續「しかた」（而非直接變化該複合詞本身）。例如：勉強する→勉強のしかた、予約する→予約のしかた。"],"example":[{"en":"The way Takeshi eats pasta is interesting.","jp":"たけしのパスタの<ruby>食<rt>た</rt></ruby>べ<ruby>方<rt>かた</rt></ruby>は<ruby>面白<rt>おもしろ</rt></ruby>いです。","rj":"Takeshi no pasuta no tabekata wa omoshiroi desu.","say":"たけしのパスタの食べ方は面白いです。"},{"en":"Can you tell me how to write kanji?","jp":"<ruby>漢字<rt>かんじ</rt></ruby>の<ruby>書<rt>か</rt></ruby>き<ruby>方<rt>かた</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えていただけませんか？","rj":"Kanji no kakikata o oshiete itadakemasen ka?","say":"漢字の書き方を教えていただけませんか？"},{"en":"I don't know how to send emails.","jp":"メールの<ruby>送<rt>おく</rt></ruby>り<ruby>方<rt>かた</rt></ruby>を<ruby>知<rt>し</rt></ruby>りません。","rj":"Meeru no okurikata o shirimasen.","say":"メールの送り方を知りません。"},{"en":"Do you know how to make a flight reservation?","jp":"<ruby>飛行機<rt>ひこうき</rt></ruby>の<ruby>予約<rt>よやく</rt></ruby>のしかたを<ruby>知<rt>し</rt></ruby>っていますか？","rj":"Hikouki no yoyaku no shikata o shitte imasu ka?","say":"飛行機の予約のしかたを知っていますか？"},{"en":"Can you teach me how to bake a delicious cake?","jp":"<ruby>美味<rt>おい</rt></ruby>しいケーキの<ruby>焼<rt>や</rt></ruby>き<ruby>方<rt>かた</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれませんか？","rj":"Oishii keeki no yakikata o oshiete kuremasen ka?","say":"美味しいケーキの焼き方を教えてくれませんか？"},{"en":"Taka did not teach me how to swim.","jp":"たかは<ruby>泳<rt>およ</rt></ruby>ぎ<ruby>方<rt>かた</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれませんでした。","rj":"Taka wa oyogikata o oshiete kuremasen deshita.","say":"たかは泳ぎ方を教えてくれませんでした。"}]}],"practice":[{"num":99,"title":"Writing Practice","vocab":[],"grammar":["<b>「健是日本人，而且是學生。」這一題會用到哪些單字？</b><br><br>- Japanese（日本人）－ 日本人（にほんじん / nihonjin）<br>- Student（學生）－ 学生（がくせい / gakusei）<br>- ＊這是一個肯定句","<b>「這間餐廳便宜又好吃。」這一題會用到哪些單字？</b><br><br>- Restaurant（餐廳）－ レストラン（れすとらん / resutoran）<br>- Cheap（便宜的）－ <ruby>安<rt>やす</rt></ruby>い（やすい / yasui）<br>- Delicious（好吃的）－ <ruby>美味<rt>おい</rt></ruby>しい（おいしい / oishii）<br>- ＊這是一個肯定句","<b>「你的家又乾淨又寬敞。」這一題會用到哪些單字？</b><br><br>- House（家）－ 家（いえ / ie）<br>- Clean（乾淨的）－ <ruby>綺麗<rt>きれい</rt></ruby>な（きれいな / kireina）<br>- Spacious（寬敞的）－ <ruby>広<rt>ひろ</rt></ruby>い（ひろい / hiroi）<br>- ＊這是一個肯定句","<b>「竹志頭腦好，個子又高。」這一題會用到哪些單字？要用什麼句型？</b><br><br>- 「聰明」和「（個子）高」都要套用「（身體部位）が（形容詞）です」這個句型來表達<br>- Head（頭）－ 頭（あたま / atama）<br>- Good（好的）－ <ruby>良<rt>い</rt></ruby>い（いい / ii）<br>- Height／for a person（身高）－ 背（せ / se）<br>- Tall／for height（高的）－ <ruby>高<rt>たか</rt></ruby>い（たかい / takai）","<b>「健人的狗是公的，而且很有活力。」這一題會用到哪些單字？</b><br><br>- Dog（狗）－ 犬（いぬ / inu）<br>- Male（公的）－ オス（おす / osu）<br>- Energetic（有活力的）－ <ruby>元気<rt>げんき</rt></ruby>な（げんきな / genkina）","<b>「美佳喜歡動物，而且很親切。」這一題會用到哪些單字？</b><br><br>- To like（喜歡）－ <ruby>好<rt>す</rt></ruby>きな（すきな / sukina，な形容詞）<br>- Animals（動物）－ 動物（どうぶつ / doubutsu）<br>- Kind（親切的）－ <ruby>親切<rt>しんせつ</rt></ruby>な（しんせつな / shinsetsuna）","<b>總結：本課的て形（Te-form）肯定形變化規則整理</b><br><br>- い形容詞：去掉字尾「い」，加「くて」。例：<ruby>可愛<rt>かわい</rt></ruby>い → <ruby>可愛<rt>かわい</rt></ruby>くて、<ruby>安<rt>やす</rt></ruby>い → <ruby>安<rt>やす</rt></ruby>くて、<ruby>広<rt>ひろ</rt></ruby>い → <ruby>広<rt>ひろ</rt></ruby>くて、<ruby>高<rt>たか</rt></ruby>い → <ruby>高<rt>たか</rt></ruby>くて<br>- な形容詞：去掉字尾「な」，加「で」。例：<ruby>綺麗<rt>きれい</rt></ruby>な → <ruby>綺麗<rt>きれい</rt></ruby>で、<ruby>元気<rt>げんき</rt></ruby>な → <ruby>元気<rt>げんき</rt></ruby>で、<ruby>好<rt>す</rt></ruby>きな → <ruby>好<rt>す</rt></ruby>きで<br>- 名詞句（名詞＋です）：把「です」改成「で」。例：<ruby>学生<rt>がくせい</rt></ruby>です → <ruby>学生<rt>がくせい</rt></ruby>で、オスです → オスで<br>- 特例：「いい」不能直接去い加くて，要先還原成古語「よい」，再變化成「よくて」<br><br>這些て形肯定形都用來連接兩個子句，形成「Aで／くて、Bです」的並列句型，表示同一主語同時具備兩種性質，或不同主語各自具備某種性質（例如「頭がよくて、背が高いです」）。"],"example":[{"en":"Ken is Japanese and a student","jp":"けんは<ruby>日本人<rt>にほんじん</rt></ruby>で<ruby>学生<rt>がくせい</rt></ruby>です。","rj":"Ken wa nihonjin de gakusei desu.","say":"けんは日本人で学生です。"},{"en":"This restaurant is cheap and delicious.","jp":"このレストランは<ruby>安<rt>やす</rt></ruby>くて<ruby>美味<rt>おい</rt></ruby>しいです。","rj":"Kono resutoran wa yasukute oishiidesu.","say":"このレストランは安くて美味しいです。"},{"en":"Your house is
