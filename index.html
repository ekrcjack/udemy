osed, because today is a Sunday.\"<br><br>今日(きょう)は 日曜日(にちようび) な ので、銀行(ぎんこう)は休(やす)みです。<br>(Kyou wa nichiyoubi na node, ginkou wa yasumidesu.)<br>＝ 因為今天是星期天，所以銀行公休。<br><br>「日曜日」是名詞，現在肯定形接ので時要加「な」，變成「日曜日なので」。","<b>「〜たい」（想要做…）要怎麼接續？它本身要當作哪一種詞類來活用？</b><br><br>「〜たい」接在動詞ます形的語幹後面，表示「想要做…」。  <br>「たい」本身要當作い形容詞來活用（例如過去肯定短形是「〜たかった」）。","<b>「一起做…吧」（邀約他人一起做某事）的句型怎麼接？</b><br><br>動詞ます形的語幹＋ましょう，表示「一起做…吧」。","<b>「去做…」（為了某個目的而前往）的句型怎麼接？</b><br><br>動詞ます形的語幹＋に行く，表示「去做…」。","<b>請將「因為明天是小健的生日，我們去買蛋糕吧。」翻譯成日文，並說明ので前面的名詞要怎麼變化。</b><br><br>英文原題：\"Let's go buy a cake because tomorrow is Ken's birthday.\"<br><br>明日(あした)は けん の 誕生日(たんじょうび) な ので、ケーキを買(か)いに行(い)きましょう。<br>(Ashita wa Ken no tanjoubi na node, ke-ki o kai ni ikimashou.)<br>＝ 因為明天是小健的生日，我們去買蛋糕吧。<br><br>「誕生日」是名詞，現在肯定形接ので時要加「な」，變成「誕生日なので」；句尾用「買いに行きましょう」表示「去買…吧」的邀約句型。","<b>總結：「〜ので」一般版（動詞、い形容詞）的句型公式是什麼？</b><br><br>(理由)ので、(狀況)。<br><br>理由部分直接用動詞或い形容詞的短形（普通形），接ので即可，不需要加任何多餘的字。","<b>總結：當理由句尾是な形容詞或名詞的現在肯定形時，句型公式該怎麼調整？整體來說ので跟から的語氣差異是什麼？</b><br><br>當理由句尾是な形容詞（語幹）或名詞的現在肯定形時，要在中間加上「な」：  <br>(理由：な形容詞語幹／名詞) な ので、(狀況)。<br><br>整體來說，「ので」在語意上跟「から」完全相同，都表示「因為…」；但語氣上，「ので」聽起來比「から」更正式、更委婉客氣。","<b>「〜ので」是什麼意思？跟「〜から」相比，語意和語氣上有什麼不同？</b><br><br>「〜ので」用來表示「因為（原因），所以（結果／狀況）」，也就是為句子後半部描述的狀況說明理由。  <br>在語意上，「ので」跟「から」完全相同；但在語氣上，「ので」聽起來比「から」稍微更正式、更委婉客氣。","<b>親切な（しんせつな / shinsetsuna）</b><br><br>Kind（親切）","<b>勉強する（べんきょうする / benkyousuru）</b><br><br>To study（讀書、學習）"],"example":[{"en":"My Japanese has improved, because I always speak Japanese.","jp":"いつも<ruby>日本語<rt>にほんご</rt></ruby>で<ruby>話<rt>はな</rt></ruby>すので、<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>上手<rt>じょうず</rt></ruby>になりました。","rj":"Itsumo nihongo de hanasu node, nihongo ga jouzu ni narimashita.","say":"いつも日本語で話すので、日本語が上手になりました。"},{"en":"I did not sleep last night, because I had a lot of homework.","jp":"<ruby>宿題<rt>しゅくだい</rt></ruby>がたくさんあったので、きのうの<ruby>夜<rt>よる</rt></ruby><ruby>寝<rt>ね</rt></ruby>ませんでした。","rj":"Shukudai ga takusan atta node, kinou no yoru nemasendeshita.","say":"宿題がたくさんあったので、きのうの夜寝ませんでした。"},{"en":"I do not like that person, because he is mean.","jp":"<ruby>彼<rt>かれ</rt></ruby>はいじわるなので、きらいです。","rj":"Kare wa ijiwaru na node, kiraidesu.","say":"彼はいじわるなので、きらいです。"},{"en":"Banks are closed, because today is a Sunday.","jp":"<ruby>今日<rt>きょう</rt></ruby>は<ruby>日曜日<rt>にちようび</rt></ruby>なので、<ruby>銀行<rt>ぎんこう</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みです。","rj":"Kyou wa nichiyoubi na node, ginkou wa yasumidesu.","say":"今日は日曜日なので、銀行は休みです。"},{"en":"I will buy this bag because this is cheap.","jp":"このカバンは<ruby>安<rt>やす</rt></ruby>いので、<ruby>買<rt>か</rt></ruby>います。","rj":"Kono kaban wa yasui node, kaimasu.","say":"このカバンは安いので、買います。"},{"en":"She is very popular because she is very kind.","jp":"<ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>親切<rt>しんせつ</rt></ruby>なので、とても<ruby>人気<rt>にんき</rt></ruby>です。","rj":"Kanojo wa shinsetsu na node, totemo ninkidesu.","say":"彼女は親切なので、とても人気です。"},{"en":"I came to Japan because I wanted to study Japanese.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>したかったので、<ruby>日本<rt>にほん</rt></ruby>に<ruby>来<rt>き</rt></ruby>ました。","rj":"Nihongo o benkyoushitakatta node, nihon ni kimashita.","say":"日本語を勉強したかったので、日本に来ました。"},{"en":"I did not go to school because I was sick.","jp":"<ruby>病気<rt>びょうき</rt></ruby>だったので、<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きませんでした。","rj":"Byoukidatta node, gakkou ni ikimasendeshita.","say":"病気だったので、学校に行きませんでした。"},{"en":"Let's go buy a cake because tomorrow is Ken's birthday.","jp":"<ruby>明日<rt>あした</rt></ruby>はけんの<ruby>誕生日<rt>たんじょうび</rt></ruby>なので、ケーキを<ruby>買<rt>か</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きましょう。","rj":"Ashita wa Ken no tanjoubi na node, ke-ki o kai ni ikimashou.","say":"明日はけんの誕生日なので、ケーキを買いに行きましょう。"}]},{"num":146,"title":"Comparison 1 - A is more (property) than B","vocab":[],"grammar":["<b>「の」作為代名詞的用法是什麼？什麼時候可以使用？</b><br><br>當名詞出現在形容詞（或另一個名詞）後面，而且雙方都清楚在指同一個東西時，可以用代名詞「の」(no，意思接近「…的、…的東西」)取代該名詞，藉此避免重複。","<b>總結：「の」代名詞的規則整理</b><br><br>い-adjective + noun ⇒ い-adjective + の<br>な-adjective + noun ⇒ な-adjective + の<br><br>Noun1 の Noun2 ⇒ Noun1 の＿＿＿<br><br>當名詞前面已經有形容詞、或另一個以「の」連接的名詞、且雙方都清楚所指對象時，就可以用「の」代替該名詞本身、省略不說，藉此避免重複；這個「の」的用法，正是本課比較句「Aのほうが Bより〜」中，用來代替被省略的比較對象名詞的關鍵。<br><br>---","<b>如果有人問：「これはスーのバッグですか？」（這是Sue的包包嗎？），要回答「不是，那是Mary的。」日文該怎麼說？</b><br><br>いいえ、それ　は　メアリー　の　です。  <br>(Iie, sore wa Mary no desu.)<br><br>「メアリーの」＝名詞「メアリー」＋の，代替「メアリーのバッグ」（Mary的包包），省略了重複的名詞「バッグ」。","<b>「我喜歡綠色的洋裝，但我也喜歡黃色的。」這一題會用到哪些單字？</b><br><br>- Green（綠色） - 緑（みどり / midori）<br>- Dress（洋裝） - ドレス（どれす / doresu）<br>- To like（喜歡） - <ruby>好<rt>す</rt></ruby>きな（すきな / sukina，な形容詞）<br>- Yellow（黄色） - 黄色（きいろ / kiiro）<br>- Too（也／都） - 用助詞「も」表示","<b>「紐約的房租比日本的（房租）貴。」這一題會用到哪些單字？</b><br><br>- Rent（房租） - 家賃（やちん / yachin）<br>- New York（紐約） - ニューヨーク（にゅーよーく / nyu-yo-ku）<br>- Expensive（貴的／高的） - <ruby>高<rt>たか</rt></ruby>い（たかい / takai）<br>- ＊這是一個比較句","<b>「因為這本字典舊了，我要買新的。」這一題會用到哪些單字？</b><br><br>- Because（因為） - 〜から（kara）<br>- Dictionary（字典） - 辞書（じしょ / jisho）<br>- Old（舊的） - <ruby>古<rt>ふる</rt></ruby>い（ふるい / furui）<br>- To buy（買） - <ruby>買<rt>か</rt></ruby>う（かう / kau）<br>- New（新的） - <ruby>新<rt>あたら</rt></ruby>しい（あたらしい / atarashii）","<b>「我的筆電比你的（筆電）慢。」這一題會用到哪些單字？</b><br><br>- My（我的） - <ruby>私<rt>わたし</rt></ruby>の（わたしの / watashi no）<br>- Laptop（筆電） - パソコン（ぱそこん / pasokon）<br>- Slow（慢的） - <ruby>遅<rt>おそ</rt></ruby>い（おそい / osoi）<br>- Your（你的） - あなたの（anatano）<br>- ＊這是一個比較句"],"example":[{"en":"I have a black sweater.","jp":"<ruby>黒<rt>くろ</rt></ruby>いセーターを<ruby>持<rt>も</rt></ruby>っています。","rj":"Kuroise-ta- o motteimasu.","say":"黒いセーターを持っています。"},{"en":"I have a red one, too.","jp":"<ruby>赤<rt>あか</rt></ruby>いのも<ruby>持<rt>も</rt></ruby>っています。","rj":"Akai no mo motteimasu.","say":"赤いのも持っています。"},{"en":"I went to buy a dictionary.","jp":"<ruby>安<rt>やす</rt></ruby>い<ruby>辞書<rt>じしょ</rt></ruby>を<ruby>買<rt>か</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きました。","rj":"Yasui jisho o kai ni ikimashita.","say":"安い辞書を買いに行きました。"},{"en":"But there were no good ones.","jp":"でもいいのがありませんでした。","rj":"Demo ii no ga arimasendeshita.","say":"でもいいのがありませんでした。"},{"en":"American ice cream is more delicious than Japanese one.","jp":"アメリカのアイスクリームのほうが日本のよりおいしいです。","rj":"Amerika no aisukuri-mu no houga nihon no yori oishiidesu.","say":"アメリカのアイスクリームのほうが日本のよりおいしいです。"},{"en":"I like the green dress.","jp":"<ruby>緑<rt>みどり</rt></ruby>のドレスが<ruby>好<rt>す</rt></ruby>きです。","rj":"Midori no doresu ga sukidesu.","say":"緑のドレスが好きです。"},{"en":"But I also like the yellow one too.","jp":"でも、<ruby>黄色<rt>きいろ</rt></ruby>のも<ruby>好<rt>す</rt></ruby>きです。","rj":"Demo, kiiro no mo sukidesu.","say":"でも、黄色のも好きです。"},{"en":"The rent in New York is more expensive than the rent in Japan.","jp":"ニューヨークの<ruby>家賃<rt>やちん</rt></ruby>のほうが、　<ruby>日本<rt>にほん</rt></ruby>のより<ruby>高<rt>たか</rt></ruby>いです。","rj":"Nyu-yo-ku no yachin no houga, nihon no yori takaidesu.","say":"ニューヨークの家賃のほうが、　日本のより高いです。"},{"en":"Because this dictionary is old, I will buy a new one.","jp":"この<ruby>辞書<rt>じしょ</rt></ruby>は<ruby>古<rt>ふる</rt></ruby>いから、　<ruby>新<rt>あたら</rt></ruby>しいのを<ruby>買<rt>か</rt></ruby>います。","rj":"Kono jisho wa furui kara, atarashii no o kaimasu.","say":"この辞書は古いから、　新しいのを買います。"},{"en":"My laptop is slower than yours.","jp":"<ruby>私<rt>わたし</rt></ruby>のパソコンのほうがあなたのより<ruby>遅<rt>おそ</rt></ruby>いです。","rj":"Watashi no pasokon no houga anata no yori osoidesu.","say":"私のパソコンのほうがあなたのより遅いです。"}]},{"num":147,"title":"Comparison 2 - Between A and B, which is more (property)","vocab":[{"t":"どっちのほうが","m":"docchi no houga 意思：哪一個比較～ (which one is more ...)","say":"どっちのほうが"},{"t":"バス","m":"basu 意思：公車 (bus)","say":"バス"},{"t":"電車（でんしゃ）","m":"densha 意思：電車 (train)","say":"電車（でんしゃ）"},{"t":"安い（やすい）","m":"yasui 意思：便宜的 (cheap)","say":"安い（やすい）"},{"t":"ねこ","m":"neko 意思：貓 (cat)","say":"ねこ"},{"t":"いぬ","m":"inu 意思：狗 (dog)","say":"いぬ"},{"t":"可愛い（かわいい）","m":"kawaii 意思：可愛的 (cute)","say":"可愛い（かわいい）"},{"t":"若い（わかい）","m":"wakai 意思：年輕的 (young)","say":"若い（わかい）"},{"t":"背（せ）","m":"se 意思：身高 (height, of a person)","say":"背（せ）"},{"t":"高い（たかい）","m":"takai 意思：高的 (tall, high)","say":"高い（たかい）"},{"t":"サッカー","m":"sakkaa 意思：足球 (soccer)","say":"サッカー"},{"t":"野球（やきゅう）","m":"yakyuu 意思：棒球 (baseball)","say":"野球（やきゅう）"},{"t":"好きな（すきな）","m":"sukina 意思：喜歡的 (to like, favorite)","say":"好きな（すきな）"}],"grammar":["<b>日語形容詞在比較句中會不會像英文一樣產生詞形變化（例如 great → greater）？</b><br><br>日語的形容詞在「非比較句」和「比較句」中的形狀完全相同，不會像英文「great/greater」那樣產生詞形變化。比較的概念是透過在被比較的兩個名詞後面加上助詞來表達的。","<b>「A和B之間，哪一個比較（性質）？」的日文句型怎麼說？</b><br><br>Ａ　と　Ｂ　と　どっちのほうが　(Property)　ですか？<br>(A to B to docchi no hou ga (property) desuka?)<br>中文翻譯：A和B之間，哪一個比較（性質）？<br>說明：Ａ和Ｂ後面都加助詞「と」，中間用「どっちのほうが」（哪一邊比較…）來詢問，最後加上要比較的性質（形容詞）＋ですか。","<b>總結：「Between A and B, which is more (property)?」句型整理</b><br><br>Ａ　と　Ｂ　と　どっちのほうが　(Property)　ですか？<br>(A to B to docchi no hou ga (property) desuka?)<br>日語形容詞在比較句和一般句中形狀不變，比較的意思是靠助詞「と」（連接A、B）和「どっちのほうが」（哪一邊比較…）來表達，並非改變形容詞本身的形態。"],"example":[{"en":"Between A and B, which is more (property)?","jp":"AとBとどっちのほうが（Property）ですか？","rj":"A to B to docchi no hou ga (property) desu ka?","say":"AとBとどっちのほうが（Property）ですか？"},{"en":"Between bus and train, which is cheaper?","jp":"バスと<ruby>電車<rt>でんしゃ</rt></ruby>とどっちのほうが<ruby>安<rt>やす</rt></ruby>いですか？","rj":"Basu to densha to docchi no hou ga yasui desu ka?","say":"バスと電車とどっちのほうが安いですか？"},{"en":"Between cats and dogs, which are cuter?","jp":"ねこといぬとどっちのほうが<ruby>可愛<rt>かわい</rt></ruby>いですか？","rj":"Neko to inu to docchi no hou ga kawaii desu ka?","say":"ねこといぬとどっちのほうが可愛いですか？"},{"en":"Between Tom and Kai, which is younger?","jp":"トムとかいとどっちのほうが<ruby>若<rt>わか</rt></ruby>いですか？","rj":"Tomu to Kai to docchi no hou ga wakai desu ka?","say":"トムとかいとどっちのほうが若いですか？"},{"en":"Between Saki and Rin, who is taller?","jp":"さきとりんとどっちのほうが<ruby>背<rt>せ</rt></ruby>が<ruby>高<rt>たか</rt></ruby>いですか？","rj":"Saki to Rin to docchi no hou ga se ga takai desu ka?","say":"さきとりんとどっちのほうが背が高いですか？"},{"en":"Between soccer and baseball, which do you like better?","jp":"サッカーと<ruby>野球<rt>やきゅう</rt></ruby>とどっちのほうが<ruby>好<rt>す</rt></ruby>きですか？","rj":"Sakkā to yakyū to docchi no hou ga suki desu ka?","say":"サッカーと野球とどっちのほうが好きですか？"}]},{"num":148,"title":"Comparison 3 - A is the most (property) among (category)","vocab":[{"t":"一番（いちばん）","m":"ichiban 意思：最、第一 (the most, number one)","say":"一番（いちばん）"},{"t":"中（なか）","m":"naka 意思：之中、裡面 (among, inside)","say":"中（なか）"},{"t":"クラス","m":"kurasu 意思：班級、課程 (class)","say":"クラス"},{"t":"日本語（にほんご）","m":"nihongo 意思：日語 (Japanese language)","say":"日本語（にほんご）"},{"t":"面白い（おもしろい）","m":"omoshiroi 意思：有趣的 (interesting)","say":"面白い（おもしろい）"},{"t":"動物（どうぶつ）","m":"doubutsu 意思：動物 (animal)","say":"動物（どうぶつ）"},{"t":"ライオン","m":"raion 意思：獅子 (lion)","say":"ライオン"},{"t":"強い（つよい）","m":"tsuyoi 意思：強的 (strong)","say":"強い（つよい）"},{"t":"季節（きせつ）","m":"kisetsu 意思：季節 (season)","say":"季節（きせつ）"},{"t":"夏（なつ）","m":"natsu 意思：夏天 (summer)","say":"夏（なつ）"},{"t":"好きな（すきな）","m":"sukina 意思：喜歡的 (to like, favorite)","say":"好きな（すきな）"},{"t":"果物（くだもの）","m":"kudamono 意思：水果 (fruit)","say":"果物（くだもの）"},{"t":"ドリアン","m":"dorian 意思：榴槤 (durian)","say":"ドリアン"},{"t":"臭い（くさい）","m":"kusai 意思：臭的 (stinky, smelly)","say":"臭い（くさい）"},{"t":"家族（かぞく）","m":"kazoku 意思：家人、家族 (family)","say":"家族（かぞく）"},{"t":"お父さん（おとうさん）","m":"otousan 意思：父親、爸爸 (father)","say":"お父さん（おとうさん）"},{"t":"背（せ）","m":"se 意思：身高、背 (height for a person, back)","say":"背（せ）"},{"t":"高い（たかい）","m":"takai 意思：高的 (tall, high)","say":"高い（たかい）"},{"t":"友達（ともだち）","m":"tomodachi 意思：朋友 (friend)","say":"友達（ともだち）"},{"t":"若い（わかい）","m":"wakai 意思：年輕的 (young)","say":"若い（わかい）"}],"grammar":["<b>日文中「在（類別）之中，A是最（性質）的」這個最高級比較句型要怎麼表達？</b><br><br>這是本課「最高級比較句」的公式，A 代表在該類別中程度最高的主體，(category) 是被比較的範圍，(property) 是形容詞或な形容詞。<br>（Category）のなかで　A　が　いちばん　(property)です。<br>(... no nakade, ga, ichiban, ... desu.)<br>句型結構：「（類別）のなかで」＝在...之中（點出比較範圍）；「Aが」＝標示出比較後程度最高的主體；「いちばん」＝最（放在形容詞或な形容詞前，表示最高程度）；句尾接形容詞（或な形容詞語幹）＋です。","<b>總結：「A 是（類別）之中最（性質）的」最高級比較句型整理</b><br><br>（Category）のなかで　A　が　いちばん　(property)です。<br>(... no nakade, ga, ichiban, ... desu.)<br>日文形容詞沒有像英文 great / greatest 那種詞形變化，最高級比較完全靠句型結構表達：先用「（類別）のなかで」點出比較的範圍，再用「Aが」標示出範圍內程度最高的主體，最後用「いちばん＋形容詞（或な形容詞語幹）です」表示「最...」。若形容詞是な形容詞（如好きな），句尾直接用「好きです」即可，不需保留「な」；若要問問題，只需在です後面加か即可。"],"example":[{"en":"Among classes, Japanese class is the most interesting.","jp":"クラスのなかで<ruby>日本語<rt>にほんご</rt></ruby>のクラスがいちばんおもしろいです。","rj":"Kurasu no naka de nihongo no kurasu ga ichiban omoshiroi desu.","say":"クラスのなかで日本語のクラスがいちばんおもしろいです。"},{"en":"Among animals, lions are the strongest.","jp":"<ruby>動物<rt>どうぶつ</rt></ruby>のなかでライオンがいちばん<ruby>強<rt>つよ</rt></ruby>いです。","rj":"Doubutsu no naka de raion ga ichiban tsuyoi desu.","say":"動物のなかでライオンがいちばん強いです。"},{"en":"Among seasons, I like summer the best.","jp":"<ruby>季節<rt>きせつ</rt></ruby>のなかで<ruby>夏<rt>なつ</rt></ruby>がいちばん<ruby>好<rt>す</rt></ruby>きです。","rj":"Kisetsu no naka de natsu ga ichiban suki desu.","say":"季節のなかで夏がいちばん好きです。"},{"en":"Among fruits, durian is the stinkiest.","jp":"<ruby>果物<rt>くだもの</rt></ruby>のなかでドリアンがいちばん<ruby>臭<rt>くさ</rt></ruby>いです。","rj":"Kudamono no naka de dorian ga ichiban kusai desu.","say":"果物のなかでドリアンがいちばん臭いです。"},{"en":"Among (my) family, (my) father is the tallest.","jp":"<ruby>家族<rt>かぞく</rt></ruby>のなかでお<ruby>父<rt>とう</rt></ruby>さんがいちばん<ruby>背<rt>せ</rt></ruby>が<ruby>高<rt>たか</rt></ruby>いです。","rj":"Kazoku no naka de otousan ga ichiban se ga takai desu.","say":"家族のなかでお父さんがいちばん背が高いです。"},{"en":"Among (your) friends, is Takako the youngest?","jp":"<ruby>友達<rt>ともだち</rt></ruby>のなかでたかこがいちばん<ruby>若<rt>わか</rt></ruby>いですか?","rj":"Tomodachi no naka de Takako ga ichiban wakai desu ka?","say":"友達のなかでたかこがいちばん若いですか?"}]},{"num":149,"title":"Comparison 4 - Among (Category), what is the most (Property)","vocab":[{"t":"どれ","m":"dore 意思：哪一個 (which one)","say":"どれ"},{"t":"いちばん（一番）","m":"ichiban 意思：最、第一 (the most, number one)","say":"いちばん（一番）"},{"t":"何（なに）","m":"nani 意思：什麼 (what)","say":"何（なに）"},{"t":"どこ","m":"doko 意思：哪裡 (where)","say":"どこ"},{"t":"誰（だれ）","m":"dare 意思：誰 (who)","say":"誰（だれ）"},{"t":"いつ","m":"itsu 意思：什麼時候 (when)","say":"いつ"},{"t":"みかん","m":"mikan 意思：橘子 (orange / mandarin)","say":"みかん"},{"t":"りんご","m":"ringo 意思：蘋果 (apple)","say":"りんご"},{"t":"いちご","m":"ichigo 意思：草莓 (strawberry)","say":"いちご"},{"t":"甘い（あまい）","m":"amai 意思：甜的 (sweet)","say":"甘い（あまい）"},{"t":"街（まち）","m":"machi 意思：城市、街道 (city, town)","say":"街（まち）"},{"t":"大きい（おおきい）","m":"ookii 意思：大的 (large, big)","say":"大きい（おおきい）"},{"t":"季節（きせつ）","m":"kisetsu 意思：季節 (season)","say":"季節（きせつ）"},{"t":"好きな（すきな）","m":"sukina 意思：喜歡的 (to like, favorite)","say":"好きな（すきな）"},{"t":"ロサンジェルス","m":"rosanjerusu 意思：洛杉磯 (Los Angeles)","say":"ロサンジェルス"},{"t":"東京（とうきょう）","m":"toukyou 意思：東京 (Tokyo)","say":"東京（とうきょう）"},{"t":"パリ","m":"pari 意思：巴黎 (Paris)","say":"パリ"},{"t":"家族（かぞく）","m":"kazoku 意思：家人、家族 (family)","say":"家族（かぞく）"},{"t":"背（せ）","m":"se 意思：身高 (height, for a person)","say":"背（せ）"},{"t":"高い（たかい）","m":"takai 意思：高的 (tall, high)","say":"高い（たかい）"},{"t":"サッカー","m":"sakkaa 意思：足球 (soccer)","say":"サッカー"},{"t":"テニス","m":"tenisu 意思：網球 (tennis)","say":"テニス"},{"t":"野球（やきゅう）","m":"yakyuu 意思：棒球 (baseball)","say":"野球（やきゅう）"},{"t":"人気な（にんきな）","m":"ninkina 意思：受歡迎的 (popular)","say":"人気な（にんきな）"},{"t":"スポーツ","m":"supootsu 意思：運動 (sports)","say":"スポーツ"}],"grammar":["<b>在日文中，「在（範疇）之中，哪一個最（性質）？」這個句型該怎麼說？</b><br><br>(Category) の なかで　どれ　が　いちばん (property) ですか？<br>(...no nakade, dore ga ichiban ... desuka?)<br>中文意思：在……之中，哪一個最……？<br>當（範疇）底下的品項清單「有」被清楚列出來時（例如題目直接列出幾個具體選項），疑問詞用「どれ」（dore，對應英文 which，哪一個）。如果品項清單「沒有」被列出來（例如只說一個籠統的類別，沒有列出具體項目），則要把「どれ」換成「何」（なに / nani，對應英文 what）。","<b>如果範疇的品項清單沒有列出來（而且項目可能超過3個以上），除了用「何」以外，還可以依問題類型換成哪些疑問詞？</b><br><br>當品項清單沒有提供時，不一定只能用「何」，可以依情境換成對應的疑問詞來取代「どれ」：<br>- 何（なに / nani）－ 什麼（問一般事物）<br>- どこ（どこ / doko）－ 哪裡（問地點）<br>- 誰（だれ / dare）－ 誰（問人物）<br>- いつ（いつ / itsu）－ 什麼時候（問時間）","<b>總結：「在（範疇）之中，哪一個最（性質）？」的問法整理</b><br><br>基本句型：(Category) の なかで　どれ／何（或其他疑問詞）　が　いちばん (property) ですか？<br>- 當（範疇）的品項清單「有」被列出來（例如題目直接給出幾個具體選項）時，疑問詞用「どれ」（which，哪一個）。<br>- 當（範疇）的品項清單「沒有」被列出來、或項目可能超過3個以上時，改用符合問題類型的疑問詞取代「どれ」：<br>- 何（なに）－ 問一般事物（什麼）<br>- どこ（doko）－ 問地點（哪裡）<br>- 誰（だれ）－ 問人物（誰）<br>- いつ（itsu）－ 問時間（什麼時候）"],"example":[{"en":"Among (category), which is the most (property)?","jp":"(Category)のなかでどれがいちばん(property)ですか?","rj":"(Category) no naka de dore ga ichiban (property) desu ka?","say":"(Category)のなかでどれがいちばん(property)ですか?"},{"en":"Among (category), what is the most (property)? (used when the list of items is not provided)","jp":"(Category)のなかで<ruby>何<rt>なに</rt></ruby>がいちばん(property)ですか?","rj":"(Category) no naka de nani ga ichiban (property) desu ka?","say":"(Category)のなかで何がいちばん(property)ですか?"},{"en":"What","jp":"<ruby>何<rt>なに</rt></ruby>","rj":"nani","say":"何"},{"en":"Where","jp":"どこ","rj":"doko","say":"どこ"},{"en":"Who","jp":"<ruby>誰<rt>だれ</rt></ruby>","rj":"dare","say":"誰"},{"en":"When","jp":"いつ","rj":"itsu","say":"いつ"},{"en":"Among orange, apple and strawberry, which is the sweetest?","jp":"みかんとりんごといちごのなかで、どれがいちばん<ruby>甘<rt>あま</rt></ruby>いですか?","rj":"Mikan to ringo to ichigo no naka de, dore ga ichiban amai desu ka?","say":"みかんとりんごといちごのなかで、どれがいちばん甘いですか?"},{"en":"Among cities, where is the largest?","jp":"<ruby>街<rt>まち</rt></ruby>のなかでどこがいちばん<ruby>大<rt>おお</rt></ruby>きいですか?","rj":"Machi no naka de doko ga ichiban ookii desu ka?","say":"街のなかでどこがいちばん大きいですか?"},{"en":"Among seasons, when do you like the best?","jp":"<ruby>季節<rt>きせつ</rt></ruby>のなかでいつがいちばん<ruby>好<rt>す</rt></ruby>きですか?","rj":"Kisetsu no naka de itsu ga ichiban suki desu ka?","say":"季節のなかでいつがいちばん好きですか?"},{"en":"Which city do you like the most, LA, Tokyo or Paris?","jp":"ロサンジェルスと<ruby>東京<rt>とうきょう</rt></ruby>とパリのなかでどれがいちばん<ruby>好<rt>す</rt></ruby>きですか?","rj":"Rosanjerusu to Toukyou to Pari no naka de dore ga ichiban suki desu ka?","say":"ロサンジェルスと東京とパリのなかでどれがいちばん好きですか?"},{"en":"Among (your) family, who is the tallest?","jp":"<ruby>家族<rt>かぞく</rt></ruby>のなかで<ruby>誰<rt>だれ</rt></ruby>がいちばん<ruby>背<rt>せ</rt></ruby>が<ruby>高<rt>たか</rt></ruby>いですか?","rj":"Kazoku no naka de dare ga ichiban se ga takai desu ka?","say":"家族のなかで誰がいちばん背が高いですか?"},{"en":"Which is the most popular, soccer, tennis or baseball?","jp":"サッカーとテニスと<ruby>野球<rt>やきゅう</rt></ruby>のなかでどれがいちばん<ruby>人気<rt>にんき</rt></ruby>ですか?","rj":"Sakkaa to tenisu to yakyuu no naka de dore ga ichiban ninki desu ka?","say":"サッカーとテニスと野球のなかでどれがいちばん人気ですか?"},{"en":"Among sports, what is the most popular?","jp":"スポーツのなかで<ruby>何<rt>なに</rt></ruby>がいちばん<ruby>人気<rt>にんき</rt></ruby>ですか?","rj":"Supootsu no naka de nani ga ichiban ninki desu ka?","say":"スポーツのなかで何がいちばん人気ですか?"}]},{"num":154,"title":"Pronoun の","vocab":[{"t":"黒い（くろい）","m":"kuroi 意思：黑色的 (black)","say":"黒い（くろい）"},{"t":"セーター（せーたー）","m":"sētā 意思：毛衣 (sweater)","say":"セーター（せーたー）"},{"t":"持っています（もっています）","m":"motte imasu 意思：持有、有 (to have/possess)","say":"持っています（もっています）"},{"t":"赤い（あかい）","m":"akai 意思：紅色的 (red)","say":"赤い（あかい）"},{"t":"安い（やすい）","m":"yasui 意思：便宜的 (cheap)","say":"安い（やすい）"},{"t":"辞書（じしょ）","m":"jisho 意思：字典 (dictionary)","say":"辞書（じしょ）"},{"t":"買いに行きました（かいにいきました）","m":"kai ni ikimashita 意思：去買了 (went to buy)","say":"買いに行きました（かいにいきました）"},{"t":"いい","m":"ii 意思：好的 (good)","say":"いい"},{"t":"ありませんでした","m":"arimasen deshita 意思：（過去）沒有、不存在 (there was not / there weren't any)","say":"ありませんでした"},{"t":"でも","m":"demo 意思：但是 (but)","say":"でも"},{"t":"それ","m":"sore 意思：那個 (that)","say":"それ"},{"t":"メアリー","m":"Mearī 意思：瑪麗（人名） (Mary)","say":"メアリー"},{"t":"いいえ","m":"iie 意思：不是、不 (no)","say":"いいえ"},{"t":"アメリカ","m":"Amerika 意思：美國 (America)","say":"アメリカ"},{"t":"アイスクリーム","m":"aisukurīmu 意思：冰淇淋 (ice cream)","say":"アイスクリーム"},{"t":"日本（にほん）","m":"Nihon 意思：日本 (Japan)","say":"日本（にほん）"},{"t":"おいしい","m":"oishii 意思：好吃的 (delicious)","say":"おいしい"},{"t":"緑（みどり）","m":"midori 意思：綠色 (green)","say":"緑（みどり）"},{"t":"ドレス","m":"doresu 意思：洋裝、連身裙 (dress)","say":"ドレス"},{"t":"好きな（すきな）","m":"sukina 意思：喜歡的 (to like，な形容詞)","say":"好きな（すきな）"},{"t":"黄色（きいろ）","m":"kiiro 意思：黃色 (yellow)","say":"黄色（きいろ）"},{"t":"家賃（やちん）","m":"yachin 意思：房租 (rent)","say":"家賃（やちん）"},{"t":"ニューヨーク","m":"Nyū Yōku 意思：紐約 (New York)","say":"ニューヨーク"},{"t":"高い（たかい）","m":"takai 意思：貴的、高的 (expensive/high)","say":"高い（たかい）"},{"t":"から","m":"kara 意思：因為 (because)","say":"から"},{"t":"古い（ふるい）","m":"furui 意思：舊的 (old)","say":"古い（ふるい）"},{"t":"買う（かう）","m":"kau 意思：買 (to buy)","say":"買う（かう）"},{"t":"新しい（あたらしい）","m":"atarashii 意思：新的 (new)","say":"新しい（あたらしい）"},{"t":"私の（わたしの）","m":"watashi no 意思：我的 (my)","say":"私の（わたしの）"},{"t":"パソコン","m":"pasokon 意思：電腦、筆記型電腦 (computer/laptop)","say":"パソコン"},{"t":"遅い（おそい）","m":"osoi 意思：慢的 (slow)","say":"遅い（おそい）"},{"t":"あなたの","m":"anata no 意思：你的 (your)","say":"あなたの"}],"grammar":["<b>の 作為代名詞是什麼意思？什麼時候可以用？</b><br><br>當名詞前面接著一個形容詞，而且說話雙方都清楚在指哪個名詞時，可以用代名詞「の」（no，類似英文的\"one\"）來取代重複的名詞，藉此避免重複。無論是い形容詞還是な形容詞，都可以直接接の來代替名詞：「い形容詞＋名詞」→「い形容詞＋の」；「な形容詞＋名詞」→「な形容詞＋の」。","<b>「名詞1の名詞2」這種所有格用法，要怎麼簡化才能避免重複？</b><br><br>同樣地，當名詞後面接著「の＋另一個名詞」（表示所有關係，例如「名詞1の名詞2」）時，如果已經清楚在指什麼，也可以把重複出現的名詞2省略，只留下「名詞1の」，例如用「メアリーの」來代替「メアリーのかばん（瑪麗的包包）」。"],"example":[{"en":"I have a black sweater. I have a red one, too.","jp":"<ruby>黒<rt>くろ</rt></ruby>いセーターを<ruby>持<rt>も</rt></ruby>っています。<ruby>赤<rt>あか</rt></ruby>いのも<ruby>持<rt>も</rt></ruby>っています。","rj":"Kuroi sētā o motteimasu. Akai no mo motteimasu.","say":"黒いセーターを持っています。赤いのも持っています。"},{"en":"I went to buy a dictionary, but there were no good ones.","jp":"<ruby>安<rt>やす</rt></ruby>い<ruby>辞書<rt>じしょ</rt></ruby>を<ruby>買<rt>か</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きました。でもいいのがありませんでした。","rj":"Yasui jisho o kai ni ikimashita. Demo ii no ga arimasendeshita.","say":"安い辞書を買いに行きました。でもいいのがありませんでした。"},{"en":"(To answer a question of \"Is this Sue's bag?\") No, that is Mary's.","jp":"いいえ、それはメアリーのです。","rj":"Iie, sore wa Mearī no desu.","say":"いいえ、それはメアリーのです。"},{"en":"American ice cream is more delicious than Japanese one.","jp":"アメリカのアイスクリームのほうが<ruby>日本<rt>にほん</rt></ruby>のよりおいしいです。","rj":"Amerika no aisukurīmu no hō ga Nihon no yori oishii desu.","say":"アメリカのアイスクリームのほうが日本のよりおいしいです。"},{"en":"I like the green dress but I also like the yellow one too.","jp":"<ruby>緑<rt>みどり</rt></ruby>のドレスが<ruby>好<rt>す</rt></ruby>きです。でも、<ruby>黄色<rt>きいろ</rt></ruby>のも<ruby>好<rt>す</rt></ruby>きです。","rj":"Midori no doresu ga suki desu. Demo, kiiro no mo suki desu.","say":"緑のドレスが好きです。でも、黄色のも好きです。"},{"en":"The rent in New York is more expensive than the rent in Japan.","jp":"ニューヨークの<ruby>家賃<rt>やちん</rt></ruby>のほうが、<ruby>日本<rt>にほん</rt></ruby>のより<ruby>高<rt>たか</rt></ruby>いです。","rj":"Nyūyōku no yachin no hō ga, Nihon no yori takai desu.","say":"ニューヨークの家賃のほうが、日本のより高いです。"},{"en":"Because this dictionary is old, I will buy a new one.","jp":"この<ruby>辞書<rt>じしょ</rt></ruby>は<ruby>古<rt>ふる</rt></ruby>いから、<ruby>新<rt>あたら</rt></ruby>しいのを<ruby>買<rt>か</rt></ruby>います。","rj":"Kono jisho wa furui kara, atarashii no o kaimasu.","say":"この辞書は古いから、新しいのを買います。"},{"en":"My laptop is slower than yours.","jp":"<ruby>私<rt>わたし</rt></ruby>のパソコンのほうがあなたのより<ruby>遅<rt>おそ</rt></ruby>いです。","rj":"Watashi no pasokon no hō ga anata no yori osoi desu.","say":"私のパソコンのほうがあなたのより遅いです。"}]},{"num":156,"title":"つもりだ","vocab":[{"t":"つもり","m":"tsumori 意思：打算、意圖 (intention, plan)","say":"つもり"},{"t":"日曜日（にちようび）","m":"nichiyoubi 意思：星期日 (Sunday)","say":"日曜日（にちようび）"},{"t":"テニス","m":"tenisu 意思：網球 (tennis)","say":"テニス"},{"t":"する","m":"suru 意思：做 (to do)","say":"する"},{"t":"明日（あした）","m":"ashita 意思：明天 (tomorrow)","say":"明日（あした）"},{"t":"大学（だいがく）","m":"daigaku 意思：大學 (university)","say":"大学（だいがく）"},{"t":"来る（くる）","m":"kuru 意思：來 (to come)","say":"来る（くる）"},{"t":"お寺（おてら）","m":"otera 意思：寺廟 (temple)","say":"お寺（おてら）"},{"t":"見る（みる）","m":"miru 意思：看 (to see, to look at)","say":"見る（みる）"},{"t":"行く（いく）","m":"iku 意思：去 (to go)","say":"行く（いく）"},{"t":"帰る（かえる）","m":"kaeru 意思：回去、回家 (to go back, to return)","say":"帰る（かえる）"},{"t":"家（いえ）","m":"ie 意思：家 (home, house)","say":"家（いえ）"},{"t":"8時（はちじ）","m":"hachiji 意思：八點 (eight o'clock)","say":"8時（はちじ）"},{"t":"勉強する（べんきょうする）","m":"benkyousuru 意思：學習、讀書 (to study, to learn)","say":"勉強する（べんきょうする）"},{"t":"ロシア語（ロシアご）","m":"roshiago 意思：俄語 (Russian language)","say":"ロシア語（ロシアご）"},{"t":"会う（あう）","m":"au 意思：見面 (to meet)","say":"会う（あう）"},{"t":"昨日（きのう）","m":"kinou 意思：昨天 (yesterday)","say":"昨日（きのう）"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"夜ご飯（よるごはん）","m":"yorugohan 意思：晚餐 (dinner)","say":"夜ご飯（よるごはん）"}],"grammar":["<b>「つもりです」是什麼意思？用來表達什麼語氣？</b><br><br>「...つもりです。」表示「我打算做...」（I intend to do...）。這是用來說明一個人「未來打算要做的事」的句型。","<b>「つもりです」要接在什麼形態的動詞後面？</b><br><br>「つもり」要接在**動詞現在式常體（普通形）**後面，用來表達某人未來打算要做的事。也可以用「動詞的否定形＋つもり」來表達「打算不做某事／不打算做某事」。","<b>「つもりです」的正確接續公式是什麼？</b><br><br>「I intended to do.....」的說法是：","<b>動詞（現在式・常體） + つもりです。（tsumoridesu.）</b><br><br>**「つもりです」的現在式與過去式、肯定與否定要怎麼變化？**<br>| | 肯定 | 否定 |<br>|---|---|---|<br>| 現在式 | つもりです。（tsumori desu）| つもりじゃないです。（tsumori janaidesu）|<br>| 過去式 | つもりでした。（tsumori deshita）| つもりじゃなかったです。（tsumori janakattadesu）|<br>中文意思：現在肯定＝「打算要做」；現在否定＝「不打算做」；過去肯定＝「（當時）打算要做」；過去否定＝「（當時）不打算做」。","<b>用「つもりです」造否定句時，要特別注意「不」放在句子的哪個位置——第一種情況是什麼？</b><br><br>第一種情況是整句話「不打算做」，也就是說話者根本沒有這個計畫。這時要用**動詞肯定形＋つもりじゃないです／つもりじゃなかったです**，把「不」放在つもりです本身上，依現在式／過去式變化つもりです。","<b>用「つもりです」造否定句時——第二種情況「打算不做」要怎麼表達？</b><br><br>第二種情況是說話者「有計畫，但計畫的內容是不做某事」，也就是「打算不做」。這時要用**動詞否定形（現在式常體）＋つもりです**，把「不」放在動詞本身上，而つもりです維持肯定形。","<b>總結：「つもりです」怎麼用？</b><br><br>「つもりです」加在動詞現在式常體後面，表示「打算要做」某件未來的事，本身依現在式／過去式、肯定／否定共有四種變化：<br>- 現在肯定：つもりです。（tsumori desu）<br>- 現在否定：つもりじゃないです。（tsumori janaidesu）<br>- 過去肯定：つもりでした。（tsumori deshita）<br>- 過去否定：つもりじゃなかったです。（tsumori janakattadesu）<br>造否定句時要特別分清楚「不」放在哪裡：如果是「整句不打算做」，用**動詞肯定形＋つもりじゃないです／つもりじゃなかったです**；如果是「打算不要做某事」，則用**動詞否定形（現在式常體）＋つもりです／つもりでした**。兩者中文翻譯常常很像，但日文文法結構完全不同，需依句意判斷。"],"example":[{"en":"I intend to do...","jp":"つもりです。","rj":"Tsumori desu.","say":"つもりです。"},{"en":"I do not intend to do... / I am not planning to do...","jp":"つもりじゃないです。","rj":"Tsumori janai desu.","say":"つもりじゃないです。"},{"en":"I intended to do...","jp":"つもりでした。","rj":"Tsumori deshita.","say":"つもりでした。"},{"en":"I did not intend to do...","jp":"つもりじゃなかったです。","rj":"Tsumori janakatta desu.","say":"つもりじゃなかったです。"},{"en":"I intend to play tennis with Takeshi on Sunday.","jp":"<ruby>日曜日<rt>にちようび</rt></ruby>にたけしとテニスをするつもりです。","rj":"Nichiyoubi ni takeshi to tenisu o suru tsumori desu.","say":"日曜日にたけしとテニスをするつもりです。"},{"en":"Ken intends not to come to school tomorrow.","jp":"けんはあした<ruby>大学<rt>だいがく</rt></ruby>にこないつもりです。","rj":"Ken wa ashita daigaku ni konai tsumori desu.","say":"けんはあした大学にこないつもりです。"},{"en":"Ken does not intend to come to school tomorrow.","jp":"けんはあした<ruby>大学<rt>だいがく</rt></ruby>にくるつもりじゃないです。","rj":"Ken wa ashita daigaku ni kuru tsumori janai desu.","say":"けんはあした大学にくるつもりじゃないです。"},{"en":"We were planning to visit a temple.","jp":"お<ruby>寺<rt>てら</rt></ruby>を<ruby>見<rt>み</rt></ruby>にいくつもりでした。","rj":"Otera o mi ni iku tsumori deshita.","say":"お寺を見にいくつもりでした。"},{"en":"I am planning to go home around 8PM.","jp":"8<ruby>時<rt>じ</rt></ruby>に<ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>るつもりです。","rj":"Hachiji ni ie ni kaeru tsumori desu.","say":"8時に家に帰るつもりです。"},{"en":"Takeshi is planning not to learn Russian.","jp":"たけしはロシア<ruby>語<rt>ろしあご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しないつもりです。","rj":"Takeshi wa roshiago o benkyoushinai tsumori desu.","say":"たけしはロシア語を勉強しないつもりです。"},{"en":"I was planning to meet Kana yesterday.","jp":"<ruby>昨日<rt>きのう</rt></ruby>、かなに<ruby>会<rt>あ</rt></ruby>うつもりでした。","rj":"Kinou, kana ni au tsumori deshita.","say":"昨日、かなに会うつもりでした。"},{"en":"Noriko were planning not to eat dinner.","jp":"のりこは<ruby>夜<rt>よる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べないつもりでした。","rj":"Noriko wa yorugohan o tabenai tsumori deshita.","say":"のりこは夜ご飯を食べないつもりでした。"}]},{"num":159,"title":"Adjective + なる","vocab":[{"t":"なる","m":"naru 意思：變成、成為 (to become)","say":"なる"},{"t":"暖かい（あたたかい）","m":"atatakai 意思：溫暖的 (warm)","say":"暖かい（あたたかい）"},{"t":"静かな（しずかな）","m":"shizukana 意思：安靜的 (quiet)","say":"静かな（しずかな）"},{"t":"学生（がくせい）","m":"gakusei 意思：學生 (student)","say":"学生（がくせい）"},{"t":"日本語（にほんご）","m":"nihongo 意思：日語 (Japanese language)","say":"日本語（にほんご）"},{"t":"勉強（べんきょう）","m":"benkyou 意思：學習、讀書 (study)","say":"勉強（べんきょう）"},{"t":"楽しい（たのしい）","m":"tanoshii 意思：快樂的、有趣的 (fun, enjoyable)","say":"楽しい（たのしい）"},{"t":"好きな（すきな）","m":"sukina 意思：喜歡的 (to like, favorite)","say":"好きな（すきな）"},{"t":"明日（あした）","m":"ashita 意思：明天 (tomorrow)","say":"明日（あした）"},{"t":"20歳（にじゅっさい）","m":"nijussai 意思：二十歲 (20 years old)","say":"20歳（にじゅっさい）"},{"t":"前（まえ）","m":"mae 意思：以前、之前 (before)","say":"前（まえ）"},{"t":"より","m":"yori 意思：比⋯⋯ (than)","say":"より"},{"t":"上手な（じょうずな）","m":"jouzuna 意思：擅長的、拿手的 (good at, skillful)","say":"上手な（じょうずな）"},{"t":"部屋（へや）","m":"heya 意思：房間 (room)","say":"部屋（へや）"},{"t":"綺麗な（きれいな）","m":"kireina 意思：漂亮的、乾淨的 (clean, pretty)","say":"綺麗な（きれいな）"},{"t":"何歳（なんさい）","m":"nansai 意思：幾歲 (how old)","say":"何歳（なんさい）"},{"t":"昨日（きのう）","m":"kinou 意思：昨天 (yesterday)","say":"昨日（きのう）"},{"t":"家賃（やちん）","m":"yachin 意思：房租 (rent)","say":"家賃（やちん）"},{"t":"高い（たかい）","m":"takai 意思：貴的、高的 (expensive, high)","say":"高い（たかい）"},{"t":"去年（きょねん）","m":"kyonen 意思：去年 (last year)","say":"去年（きょねん）"},{"t":"よりも","m":"yorimo 意思：比⋯⋯ (than)","say":"よりも"},{"t":"料理する（りょうりする）","m":"ryourisuru 意思：做菜、烹飪 (to cook)","say":"料理する（りょうりする）"}],"grammar":["<b>なる怎麼變化（敬體的現在／過去、肯定／否定）？</b><br><br>なる的意思是「變成」，用來表示某種變化。なる可以接在名詞、い形容詞及な形容詞之後。<br>現在肯定：なります（narimasu）<br>現在否定：なりません（narimasen）<br>過去肯定：なりました（narimashita）<br>過去否定：なりませんでした（narimasendeshita）","<b>い形容詞、な形容詞、名詞接なる時，該怎麼變化？</b><br><br>い形容詞：詞尾い去掉，改成く，再接なる，例如 あたたかい（atatakai，溫暖的）→ あたたかくなる（atatakakunaru，變溫暖）。<br>な形容詞：詞尾な去掉，改成に，再接なる，例如 静か（な）（shizuka na，安靜的）→ 静かになる（shizukaninaru，變安靜）。<br>名詞：直接加に再接なる，例如 学生（gakusei，學生）→ 学生になる（gakuseininaru，變成學生）。<br>い形容詞接なる的變化方式，和它的否定變化（詞尾い→く）是一樣的規則。","<b>把な形容詞、名詞接なる的規則套用到い形容詞上，會犯什麼常見錯誤？</b><br><br>一個常見的錯誤，是把な形容詞、名詞所使用的「に」套用到い形容詞上。<br>✕ あたたかいになる（錯誤）<br>◯ あたたかくなる（正確，變溫暖了）<br>い形容詞接なる時不可以加に，只能把詞尾的い改成く，再接なる。","<b>總結：なる的用法</b><br><br>なる表示「變成」的變化，可以接在名詞、な形容詞、い形容詞之後：<br>- 名詞 + になる：例如 学生になる（がくせいになる，變成學生）。<br>- な形容詞（去な）+ になる：例如 静かになる（しずかになる，變安靜）。<br>- い形容詞（詞尾い→く）+ なる：例如 あたたかくなる（あたたかくなる，變溫暖）。注意い形容詞不可以用に，只能把い改成く。<br>なる的敬體變化：<br>現在肯定 なります（narimasu）、現在否定 なりません（narimasen）<br>過去肯定 なりました（narimashita）、過去否定 なりませんでした（narimasendeshita）<br>なる句子單獨使用時，語意可能在「絕對變化」與「相對變化」之間模糊不清，可以搭配より使用比較句型，明確表示這是「相對變化」。"],"example":[{"en":"becomes / will become","jp":"なります。","rj":"Narimasu.","say":"なります。"},{"en":"does not become / will not become","jp":"なりません。","rj":"Narimasen.","say":"なりません。"},{"en":"became","jp":"なりました。","rj":"Narimashita.","say":"なりました。"},{"en":"did not become","jp":"なりませんでした。","rj":"Narimasendeshita.","say":"なりませんでした。"},{"en":"warm","jp":"あたたかい","rj":"Atatakai.","say":"あたたかい"},{"en":"becomes warm","jp":"あたたかくなる","rj":"Atatakaku naru.","say":"あたたかくなる"},{"en":"quiet","jp":"<ruby>静<rt>しず</rt></ruby>かな","rj":"Shizukana.","say":"静かな"},{"en":"becomes quiet","jp":"<ruby>静<rt>しず</rt></ruby>かになる","rj":"Shizuka ni naru.","say":"静かになる"},{"en":"student","jp":"<ruby>学生<rt>がくせい</rt></ruby>","rj":"Gakusei.","say":"学生"},{"en":"becomes a student","jp":"<ruby>学生<rt>がくせい</rt></ruby>になる","rj":"Gakusei ni naru.","say":"学生になる"},{"en":"Studying the Japanese became fun.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>勉強<rt>べんきょう</rt></ruby>がたのしくなりました。","rj":"Nihongo no benkyou ga tanoshiku narimashita.","say":"日本語の勉強がたのしくなりました。"},{"en":"I came to like studying Japanese.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>勉強<rt>べんきょう</rt></ruby>が<ruby>好<rt>す</rt></ruby>きになりました。","rj":"Nihongo no benkyou ga suki ni narimashita.","say":"日本語の勉強が好きになりました。"},{"en":"Takeshi will be 20 years old tomorrow.","jp":"たけしは<ruby>明日<rt>あした</rt></ruby>20<ruby>歳<rt>さい</rt></ruby>になります。","rj":"Takeshi wa ashita nijussai ni narimasu.","say":"たけしは明日20歳になります。"},{"en":"Mary has become better in Japanese than before.","jp":"メアリーは<ruby>前<rt>まえ</rt></ruby>より<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>上手<rt>じょうず</rt></ruby>になりました。","rj":"Mearii wa mae yori nihongo ga jouzu ni narimashita.","say":"メアリーは前より日本語が上手になりました。"},{"en":"My room became clean.","jp":"<ruby>部屋<rt>へや</rt></ruby>が<ruby>綺麗<rt>きれい</rt></ruby>になりました。","rj":"Heya ga kirei ni narimashita.","say":"部屋が綺麗になりました。"},{"en":"How old did you turn yesterday?","jp":"<ruby>昨日<rt>きのう</rt></ruby>、<ruby>何歳<rt>なんさい</rt></ruby>になりましたか?","rj":"Kinou, nansai ni narimashita ka?","say":"昨日、何歳になりましたか?"},{"en":"The rent got more expensive than last year.","jp":"<ruby>家賃<rt>やちん</rt></ruby>が<ruby>去年<rt>きょねん</rt></ruby>より<ruby>高<rt>たか</rt></ruby>くなりました。","rj":"Yachin ga kyonen yori takaku narimashita.","say":"家賃が去年より高くなりました。"},{"en":"Kaori became better at cooking than before.","jp":"かおりは<ruby>前<rt>まえ</rt></ruby>より<ruby>料理<rt>りょうり</rt></ruby>するのが<ruby>上手<rt>じょうず</rt></ruby>になりました。","rj":"Kaori wa mae yori ryouri suru no ga jouzu ni narimashita.","say":"かおりは前より料理するのが上手になりました。"}]},{"num":164,"title":"I want to do","vocab":[{"t":"パスタ","m":"pasuta 意思：義大利麵 (pasta)","say":"パスタ"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"映画（えいが）","m":"eiga 意思：電影 (movie)","say":"映画（えいが）"},{"t":"観る（みる）","m":"miru 意思：觀看 (to watch)","say":"観る（みる）"},{"t":"セーター","m":"seetaa 意思：毛衣 (sweater)","say":"セーター"},{"t":"買う（かう）","m":"kau 意思：買 (to buy)","say":"買う（かう）"},{"t":"学校（がっこう）","m":"gakkou 意思：學校 (school)","say":"学校（がっこう）"},{"t":"行く（いく）","m":"iku 意思：去 (to go)","say":"行く（いく）"},{"t":"住む（すむ）","m":"sumu 意思：住 (to live)","say":"住む（すむ）"},{"t":"外国（がいこく）","m":"gaikoku 意思：外國 (foreign country / abroad)","say":"外国（がいこく）"},{"t":"乗る（のる）","m":"noru 意思：搭乘 (to ride)","say":"乗る（のる）"},{"t":"電車（でんしゃ）","m":"densha 意思：電車 (train)","say":"電車（でんしゃ）"},{"t":"する","m":"suru 意思：做、進行（運動）(to do / to play (sports))","say":"する"},{"t":"テニス","m":"tenisu 意思：網球 (tennis)","say":"テニス"},{"t":"飲む（のむ）","m":"nomu 意思：喝 (to drink)","say":"飲む（のむ）"},{"t":"コーヒー","m":"koohii 意思：咖啡 (coffee)","say":"コーヒー"},{"t":"〜から","m":"kara 意思：因為〜 (because ~)","say":"〜から"},{"t":"疲れた（つかれた）","m":"tsukareta 意思：累了 (being tired)","say":"疲れた（つかれた）"}],"grammar":["<b>日文要怎麼表達「我想要做…」？</b><br><br>用動詞的「ます形字幹」（也就是加ます之前的形態）再加上「たいです」，就可以表達自己的願望或希望。<br>句型：動詞字幹 ＋ たいです（taidesu）<br>意思：「我想要…（做）」","<b>「たい」的時態變化規則是什麼？</b><br><br>「たい」的變化方式跟い形容詞一樣，依現在／過去、肯定／否定分成四種：<br>- 現在肯定：たいです（taidesu）－ 想要<br>- 現在否定：たくありません（takuarimasen）－ 不想要<br>- 過去肯定：たかったです（takattadesu）－ （之前）想要<br>- 過去否定：たくありませんでした（takuarimasenndeshita）－ （之前）不想要","<b>接上「たい」之後，助詞會有什麼變化？</b><br><br>原本用助詞「を」的動詞，接上「たい」之後，助詞可以維持用「を」，也可以改用「が」，兩種都可以；除了「を」以外的其他助詞（例如に、で等）則維持不變，不會被改成「が」。","<b>總結：「〜たいです」的核心句型與四種時態變化是什麼？</b><br><br>動詞字幹 ＋ たいです，用來表達「我想要做…」的願望，「たい」的變化方式跟い形容詞一樣：<br>- 現在肯定：たいです（taidesu）<br>- 現在否定：たくありません（takuarimasen）<br>- 過去肯定：たかったです（takattadesu）<br>- 過去否定：たくありませんでした（takuarimasenndeshita）<br>另外，原本接「を」的動詞，接上「たい」後助詞可改用「が」（也可以維持用「を」），其餘助詞則不受影響。"],"example":[{"en":"I want to do...","jp":"たいです。","rj":"Tai desu.","say":"たいです。"},{"en":"I do not want to do...","jp":"たくありません。","rj":"Taku arimasen.","say":"たくありません。"},{"en":"I wanted to do...","jp":"たかったです。","rj":"Takatta desu.","say":"たかったです。"},{"en":"I did not want to do...","jp":"たくありませんでした。","rj":"Taku arimasendeshita.","say":"たくありませんでした。"},{"en":"I want to eat pasta.","jp":"パスタを<ruby>食<rt>た</rt></ruby>べたいです。","rj":"Pasuta o tabetai desu.","say":"パスタを食べたいです。"},{"en":"I don't want to go watch a movie.","jp":"<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>たくありません。","rj":"Eiga o mitaku arimasen.","say":"映画を見たくありません。"},{"en":"I wanted to buy a sweater.","jp":"セーターを<ruby>買<rt>か</rt></ruby>いたかったです。","rj":"Seetaa o kaitakatta desu.","say":"セーターを買いたかったです。"},{"en":"I did not want to go to school.","jp":"<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きたくありませんでした。","rj":"Gakkou ni ikitaku arimasendeshita.","say":"学校に行きたくありませんでした。"},{"en":"I want to live abroad.","jp":"<ruby>外国<rt>がいこく</rt></ruby>に<ruby>住<rt>す</rt></ruby>みたいです。","rj":"Gaikoku ni sumitai desu.","say":"外国に住みたいです。"},{"en":"I don't want to ride the train.","jp":"<ruby>電車<rt>でんしゃ</rt></ruby>に<ruby>乗<rt>の</rt></ruby>りたくありません。","rj":"Densha ni noritaku arimasen.","say":"電車に乗りたくありません。"},{"en":"I wanted to play tennis.","jp":"テニスをしたかったです。","rj":"Tenisu o shitakatta desu.","say":"テニスをしたかったです。"},{"en":"I did not want to drink coffee.","jp":"コーヒーを<ruby>飲<rt>の</rt></ruby>みたくありませんでした。","rj":"Koohii o nomitaku arimasendeshita.","say":"コーヒーを飲みたくありませんでした。"},{"en":"Do you want to watch a movie?","jp":"<ruby>映画<rt>えいが</rt></ruby>を<ruby>観<rt>み</rt></ruby>たいですか?","rj":"Eiga o mitai desu ka?","say":"映画を観たいですか?"},{"en":"I don't want to watch a movie because I'm tired.","jp":"<ruby>疲<rt>つか</rt></ruby>れたから<ruby>映画<rt>えいが</rt></ruby>を<ruby>観<rt>み</rt></ruby>たくありません。","rj":"Tsukareta kara eiga o mitaku arimasen.","say":"疲れたから映画を観たくありません。"}]},{"num":165,"title":"Someone said he wants to do","vocab":[{"t":"言う（いう）","m":"iu 意思：說 (to say)","say":"言う（いう）"},{"t":"トイレ","m":"toire 意思：廁所 (bathroom, toilet)","say":"トイレ"},{"t":"行く（いく）","m":"iku 意思：去 (to go)","say":"行く（いく）"},{"t":"先生（せんせい）","m":"sensei 意思：老師 (teacher)","say":"先生（せんせい）"},{"t":"なる","m":"naru 意思：成為、變成 (to become)","say":"なる"},{"t":"寝る（ねる）","m":"neru 意思：睡覺 (to sleep)","say":"寝る（ねる）"},{"t":"住む（すむ）","m":"sumu 意思：住、居住 (to live, to reside)","say":"住む（すむ）"},{"t":"外国（がいこく）","m":"gaikoku 意思：外國、國外 (foreign country, abroad)","say":"外国（がいこく）"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"昼ごはん（ひるごはん）","m":"hirugohan 意思：午餐 (lunch)","say":"昼ごはん（ひるごはん）"}],"grammar":["<b>〜たい的基本用法是什麼？</b><br><br>用動詞ます形前的字幹（stem）+たいです，可以表達自己的願望或希望，意思是「我想要做…」。<br>例如公式：Verb stem + たいです。（taidesu）","<b>〜たい要如何做時態與肯定/否定的變化？</b><br><br>たい的變化方式跟い形容詞一樣：<br>現在肯定：たいです（taidesu）<br>現在否定：たくありません（takuarimasen）<br>過去肯定：たかったです（takattadesu）<br>過去否定：たくありませんでした（takuarimasenndeshita）","<b>當要轉述「別人」說他/她想做某事時，日文該怎麼表達？</b><br><br>たいです句型通常不會直接用來描述「別人」的願望。別人的願望在日文中通常是以「引用（轉述別人說的話）」、「觀察」或「猜測」的方式表達。<br>如果要引用某人說她想做某事，可以用「と言（い）っていました」搭配「たい」。<br>句型（肯定）：某人は…（Verb stem）＋たい＋と言（い）っていました。（〜tai to itteimashita）<br>中文：「某人說他/她想要做…」<br>句型（否定）：某人は…（Verb stem）＋たくない＋と言（い）っていました。（〜takunai to itteimashita）<br>中文：「某人說他/她不想要做…」","<b>總結</b><br><br>たいです句型基本上只用來表達「說話者自己」的願望，不太會直接拿來描述別人的願望。要轉述別人說他/她想（或不想）做某件事時，需要用「引用」的方式，也就是在たい（或たくない）後面加上「と言っていました」：<br>肯定：（動詞字幹）＋たい＋と言（い）っていました（〜tai to itteimashita）＝「某人說他/她想要做…」<br>否定：（動詞字幹）＋たくない＋と言（い）っていました（〜takunai to itteimashita）＝「某人說他/她不想要做…」"],"example":[{"en":"(Someone) said (he/she) wants to do...","jp":"たいと<ruby>言<rt>い</rt></ruby>っていました。","rj":"Tai to itte imashita.","say":"たいと言っていました。"},{"en":"(Someone) said (he/she) does not want to do...","jp":"たくないと<ruby>言<rt>い</rt></ruby>っていました。","rj":"Takunai to itte imashita.","say":"たくないと言っていました。"},{"en":"Mary said she wanted to go to the bathroom.","jp":"メアリーはトイレに<ruby>行<rt>い</rt></ruby>きたいと<ruby>言<rt>い</rt></ruby>っていました。","rj":"Mearii wa toire ni ikitai to itte imashita.","say":"メアリーはトイレに行きたいと言っていました。"},{"en":"Taiki said he wants to be a teacher.","jp":"たいきは<ruby>先生<rt>せんせい</rt></ruby>になりたいと<ruby>言<rt>い</rt></ruby>っていました。","rj":"Taiki wa sensei ni naritai to itte imashita.","say":"たいきは先生になりたいと言っていました。"},{"en":"Sachi said she does not want to sleep.","jp":"さちは<ruby>寝<rt>ね</rt></ruby>たくないと<ruby>言<rt>い</rt></ruby>っていました。","rj":"Sachi wa netakunai to itte imashita.","say":"さちは寝たくないと言っていました。"},{"en":"Takeshi said he wants to live abroad.","jp":"たけしは<ruby>外国<rt>がいこく</rt></ruby>に<ruby>住<rt>す</rt></ruby>みたいと<ruby>言<rt>い</rt></ruby>っていました。","rj":"Takeshi wa gaikoku ni sumitai to itte imashita.","say":"たけしは外国に住みたいと言っていました。"},{"en":"Miki said she does not want to eat lunch.","jp":"みきは<ruby>昼<rt>ひる</rt></ruby>ごはんを<ruby>食<rt>た</rt></ruby>べたくないと<ruby>言<rt>い</rt></ruby>っていました。","rj":"Miki wa hirugohan o tabetakunai to itte imashita.","say":"みきは昼ごはんを食べたくないと言っていました。"}]},{"num":166,"title":"It seems someone wants to do","vocab":[{"t":"飲む（のむ）","m":"nomu 意思：喝 (to drink)","say":"飲む（のむ）"},{"t":"コーヒー","m":"koohii 意思：咖啡 (coffee)","say":"コーヒー"},{"t":"行く（いく）","m":"iku 意思：去 (to go)","say":"行く（いく）"},{"t":"カフェ","m":"kafe 意思：咖啡廳 (cafe)","say":"カフェ"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"ご飯（ごはん）","m":"gohan 意思：飯、餐點 (rice; meal, food)","say":"ご飯（ごはん）"},{"t":"なる","m":"naru 意思：成為、變成 (to become, to be)","say":"なる"},{"t":"先生（せんせい）","m":"sensei 意思：老師 (teacher)","say":"先生（せんせい）"},{"t":"勉強する（べんきょうする）","m":"benkyousuru 意思：學習、讀書 (to study)","say":"勉強する（べんきょうする）"},{"t":"パーティー","m":"paatii 意思：派對、聚會 (party)","say":"パーティー"},{"t":"働く（はたらく）","m":"hataraku 意思：工作 (to work)","say":"働く（はたらく）"}],"grammar":["<b>複習：「〜たい」是用來表達什麼？</b><br><br>用動詞ます形的語幹（也就是「ます」前面的那一部分）＋たいです，可以用來表達「說話者自己」的希望或想做的事，也就是「我想要做…」。<br>句型：動詞語幹＋たいです。（taidesu）","<b>如果要表達「(看起來)某人想要做…」，該怎麼說？</b><br><br>如果要描述你觀察到、覺得「某人（第三人稱）似乎想要做某件事」，不能用「たい」，而必須改用一個特殊動詞「たがっている」來代替「たい」。<br>句型：動詞語幹＋たがっている（tagatteiru）「(看起來)…想要做…」<br>如果原本的動詞需要搭配助詞「を」，衍生出來的「たがっている」句型也會保留這個「を」；這一點和「たい」不同——用「たい」的句子裡，「が」和「を」是可以互換使用的，但「たがっている」只能用「を」。","<b>「たがる」本身要怎麼變化？</b><br><br>「たがる」是一個五段動詞（う動詞），本身（不加いる）的變化如下：<br>| 時態 | 肯定 | 否定 |<br>|---|---|---|<br>| 現在 | たがります（tagarimasu） | たがりません（tagarimasen） |<br>| 過去 | たがりました（tagarimashita） | たがりませんでした（tagarimasendeshita） |","<b>「たがっている」（たがる＋いる）要怎麼變化？</b><br><br>實際會話中最常用的形式是「たがる」加上「いる」變成「たがっている」，其變化如下：<br>| 時態 | 肯定 | 否定 |<br>|---|---|---|<br>| 現在 | たがっています（tagatteimasu） | たがっていません（tagatteimasen） |<br>| 過去 | たがっていました（tagatteimashita） | たがっていませんでした（tagatteimasendeshita） |","<b>總結</b><br><br>- 表達「(說話者自己)想要做某事」時，用「動詞語幹＋たいです」。<br>- 表達「(觀察、感覺到)某人似乎想要做某事」時，不能用「たい」，要改用特殊動詞「たがっている」：動詞語幹＋たがっている（tagatteiru）。<br>- 若原本的動詞需要搭配助詞「を」，「たがっている」句型也會保留這個「を」——這點與「たい」不同，「たい」句中「が」「を」皆可使用。<br>- 「たがっている」的時態變化整理：<br>- 現在肯定：たがっています（tagatteimasu）<br>- 現在否定：たがっていません（tagatteimasen）<br>- 過去肯定：たがっていました（tagatteimashita）<br>- 過去否定：たがっていませんでした（tagatteimasendeshita）"],"example":[{"en":"(It seems someone) wants to do...","jp":"たがっています。","rj":"Tagatte imasu.","say":"たがっています。"},{"en":"(It seems someone) does not want to do...","jp":"たがっていません。","rj":"Tagatte imasen.","say":"たがっていません。"},{"en":"(It seemed someone) wanted to do...","jp":"たがっていました。","rj":"Tagatte imashita.","say":"たがっていました。"},{"en":"(It seemed someone) did not want to do...","jp":"たがっていませんでした。","rj":"Tagatte imasen deshita.","say":"たがっていませんでした。"},{"en":"(It seems) Mary wants to drink coffee.","jp":"メアリーはコーヒーを<ruby>飲<rt>の</rt></ruby>みたがっています。","rj":"Mearii wa koohii o nomitagatte imasu.","say":"メアリーはコーヒーを飲みたがっています。"},{"en":"(It seems) Ken wants to go to the cafe.","jp":"けんはカフェに<ruby>行<rt>い</rt></ruby>きたがっています。","rj":"Ken wa kafe ni ikitagatte imasu.","say":"けんはカフェに行きたがっています。"},{"en":"(It seems) Lisa does not want to eat food.","jp":"りさはご飯を<ruby>食<rt>た</rt></ruby>べたがっていません。","rj":"Risa wa gohan o tabetagatte imasen.","say":"りさはご飯を食べたがっていません。"},{"en":"It seems Karen wants to be a teacher.","jp":"かれんは<ruby>先生<rt>せんせい</rt></ruby>になりたがっています。","rj":"Karen wa sensei ni naritagatte imasu.","say":"かれんは先生になりたがっています。"},{"en":"It seems Mari does not want to study.","jp":"まりは<ruby>勉強<rt>べんきょう</rt></ruby>したがっていません。","rj":"Mari wa benkyou shitagatte imasen.","say":"まりは勉強したがっていません。"},{"en":"It seemed Kai wanted to go to the party.","jp":"かいはパーティーに<ruby>行<rt>い</rt></ruby>きたがっていました。","rj":"Kai wa paatii ni ikitagatte imashita.","say":"かいはパーティーに行きたがっていました。"},{"en":"It seemed Misa did not want to work.","jp":"みさは<ruby>働<rt>はたら</rt></ruby>きたがっていませんでした。","rj":"Misa wa hatarakitagatte imasen deshita.","say":"みさは働きたがっていませんでした。"}]},{"num":170,"title":"〜たり〜たりする","vocab":[{"t":"買い物（かいもの）","m":"kaimono 意思：購物 (shopping)","say":"買い物（かいもの）"},{"t":"韓国料理（かんこくりょうり）","m":"kankoku ryouri 意思：韓國料理 (Korean food)","say":"韓国料理（かんこくりょうり）"},{"t":"読む（よむ）","m":"yomu 意思：讀、閱讀 (to read)","say":"読む（よむ）"},{"t":"料理する（りょうりする）","m":"ryouri suru 意思：做菜、烹飪 (to cook)","say":"料理する（りょうりする）"},{"t":"カフェ","m":"kafe 意思：咖啡廳 (café)","say":"カフェ"},{"t":"勉強する（べんきょうする）","m":"benkyou suru 意思：讀書、學習 (to study)","say":"勉強する（べんきょうする）"},{"t":"テニス","m":"tenisu 意思：網球 (tennis)","say":"テニス"},{"t":"ピザ","m":"piza 意思：披薩 (pizza)","say":"ピザ"},{"t":"話す（はなす）","m":"hanasu 意思：說話、聊天 (to talk)","say":"話す（はなす）"},{"t":"友達（ともだち）","m":"tomodachi 意思：朋友 (friend)","say":"友達（ともだち）"},{"t":"洗濯する（せんたくする）","m":"sentaku suru 意思：洗衣服 (to do laundry)","say":"洗濯する（せんたくする）"},{"t":"観る（みる）","m":"miru 意思：看（電影等） (to watch)","say":"観る（みる）"},{"t":"映画（えいが）","m":"eiga 意思：電影 (movie)","say":"映画（えいが）"},{"t":"行く（いく）","m":"iku 意思：去 (to go)","say":"行く（いく）"},{"t":"買い物に行く（かいものにいく）","m":"kaimono ni iku 意思：去購物 (to go shopping)","say":"買い物に行く（かいものにいく）"},{"t":"タバコを吸う（たばこをすう）","m":"tabako o suu 意思：抽菸 (to smoke)","say":"タバコを吸う（たばこをすう）"},{"t":"飲む（のむ）","m":"nomu 意思：喝 (to drink)","say":"飲む（のむ）"},{"t":"ビール","m":"biiru 意思：啤酒 (beer)","say":"ビール"},{"t":"教室（きょうしつ）","m":"kyoushitsu 意思：教室 (classroom)","say":"教室（きょうしつ）"}],"grammar":["<b>〜たり〜たりする 是什麼意思？</b><br><br>用來列舉幾個具代表性的動作或狀態，暗示「做了A、B等類似的事情」，並非只做這兩件事，還可能有其他未提及的活動，藉此避免用て形連接時給人「只做了這幾件事」的封閉印象。","<b>〜たり〜たりする 怎麼接？</b><br><br>接續方式為「（活動A）過去肯定普通形＋り＋（活動B）過去肯定普通形＋り＋する」，句尾的する（する／した／しない…）負責表示整句的時態。","<b>這個文法可以怎麼延伸使用？</b><br><br>可用於現在式、過去式，也能接「〜たいです」表示願望，或接「〜てはいけません」表示禁止等各種句型延伸。"],"example":[{"en":"I will go shopping and eat Korean food.","jp":"<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>をして、<ruby>韓国料理<rt>かんこくりょうり</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。","rj":"Kaimono o shite, kankoku ryouri o tabemasu.","say":"買い物をして、韓国料理を食べます。"},{"en":"I do things like reading books and cooking.","jp":"<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んだり、<ruby>料理<rt>りょうり</rt></ruby>したりします。","rj":"Hon o yondari, ryouri shitari shimasu.","say":"本を読んだり、料理したりします。"},{"en":"I did things like going to a café and studying.","jp":"カフェに<ruby>行<rt>い</rt></ruby>ったり、<ruby>勉強<rt>べんきょう</rt></ruby>したりしました。","rj":"Kafe ni ittari, benkyou shitari shimashita.","say":"カフェに行ったり、勉強したりしました。"},{"en":"I want to do things like playing tennis and eating pizza.","jp":"テニスをしたり、ピザを<ruby>食<rt>た</rt></ruby>べたりしたいです。","rj":"Tenisu o shitari, piza o tabetari shitai desu.","say":"テニスをしたり、ピザを食べたりしたいです。"},{"en":"On the weekend, I did things like studying and talking with friends.","jp":"<ruby>週末<rt>しゅうまつ</rt></ruby>、<ruby>勉強<rt>べんきょう</rt></ruby>したり、<ruby>友達<rt>ともだち</rt></ruby>と<ruby>話<rt>はな</rt></ruby>したりしました。","rj":"Shuumatsu, benkyou shitari, tomodachi to hanashitari shimashita.","say":"週末、勉強したり、友達と話したりしました。"},{"en":"Tomorrow, I will do things like doing laundry and watching a movie.","jp":"<ruby>明日<rt>あした</rt></ruby>、<ruby>洗濯<rt>せんたく</rt></ruby>したり、<ruby>映画<rt>えいが</rt></ruby>をみたりします。","rj":"Ashita, sentaku shitari, eiga o mitari shimasu.","say":"明日、洗濯したり、映画をみたりします。"},{"en":"I want to do things like going to a café and going shopping.","jp":"カフェに<ruby>行<rt>い</rt></ruby>ったり、<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったりしたいです。","rj":"Kafe ni ittari, kaimono ni ittari shitai desu.","say":"カフェに行ったり、買い物に行ったりしたいです。"},{"en":"You must not do things like smoking or drinking beer in the classroom.","jp":"<ruby>教室<rt>きょうしつ</rt></ruby>で、タバコを<ruby>吸<rt>す</rt></ruby>ったり、ビールを<ruby>飲<rt>の</rt></ruby>んではいけません。","rj":"Kyoushitsu de, tabako o suttari, biiru o nonde wa ikemasen.","say":"教室で、タバコを吸ったり、ビールを飲んではいけません。"}]},{"num":172,"title":"〜ことがある","vocab":[{"t":"ヨーロッパ","m":"yooroppa 意思：歐洲 (Europe)","say":"ヨーロッパ"},{"t":"休む（やすむ）","m":"yasumu 意思：休息、缺席 (to rest/be absent)","say":"休む（やすむ）"},{"t":"遅刻する（ちこくする）","m":"chikoku suru 意思：遲到 (to be late)","say":"遅刻する（ちこくする）"},{"t":"登る（のぼる）","m":"noboru 意思：爬、攀登 (to climb)","say":"登る（のぼる）"},{"t":"授業（じゅぎょう）","m":"jugyou 意思：課程、上課 (class)","say":"授業（じゅぎょう）"},{"t":"富士山（ふじさん）","m":"fujisan 意思：富士山 (Mt. Fuji)","say":"富士山（ふじさん）"},{"t":"住む（すむ）","m":"sumu 意思：居住 (to live)","say":"住む（すむ）"},{"t":"フランス","m":"furansu 意思：法國 (France)","say":"フランス"},{"t":"乗る（のる）","m":"noru 意思：搭乘 (to ride)","say":"乗る（のる）"},{"t":"地下鉄（ちかてつ）","m":"chikatetsu 意思：地下鐵 (subway)","say":"地下鉄（ちかてつ）"},{"t":"教える（おしえる）","m":"oshieru 意思：教（授課） (to teach)","say":"教える（おしえる）"},{"t":"英語（えいご）","m":"eigo 意思：英語 (English)","say":"英語（えいご）"}],"grammar":["<b>〜ことがある 是什麼意思？</b><br><br>接在動詞た形（過去・常體）之後，用來表達「曾經做過某事／有過某種經驗」，中文常譯為「有…過」。這裡的動詞必須是過去肯定的常體（辭書形的た形）。","<b>肯定與否定形怎麼變化？</b><br><br>肯定形是「〜ことがあります」，否定形是「〜ことがありません」（表示「從來沒有…過」），依「ことがある」本身的肯定／否定、時態變化來表示「有／沒有」這個經驗。","<b>使用這個文法時要注意什麼？</b><br><br>這個文法著重在「經驗的有無」，而不是單純描述動作何時發生。"],"example":[{"en":"Have you ever been to Europe?","jp":"ヨーロッパに<ruby>行<rt>い</rt></ruby>ったことがありますか？","rj":"Yooroppa ni itta koto ga arimasu ka?","say":"ヨーロッパに行ったことがありますか？"},{"en":"Yes, I have been there.","jp":"はい、<ruby>行<rt>い</rt></ruby>ったことがあります。","rj":"Hai, itta koto ga arimasu.","say":"はい、行ったことがあります。"},{"en":"No, I have not been there.","jp":"いいえ、<ruby>行<rt>い</rt></ruby>ったことがありません。","rj":"Iie, itta koto ga arimasen.","say":"いいえ、行ったことがありません。"},{"en":"Takeshi has never missed class.","jp":"たけしは<ruby>授業<rt>じゅぎょう</rt></ruby>を<ruby>休<rt>やす</rt></ruby>んだことがありません。","rj":"Takeshi wa jugyou o yasunda koto ga arimasen.","say":"たけしは授業を休んだことがありません。"},{"en":"I have never been late to class.","jp":"<ruby>授業<rt>じゅぎょう</rt></ruby>に<ruby>遅刻<rt>ちこく</rt></ruby>したことがありません。","rj":"Jugyou ni chikoku shita koto ga arimasen.","say":"授業に遅刻したことがありません。"},{"en":"Have you ever climbed Mt. Fuji?","jp":"<ruby>富士山<rt>ふじさん</rt></ruby>に<ruby>登<rt>のぼ</rt></ruby>ったことがありますか？","rj":"Fujisan ni nobotta koto ga arimasu ka?","say":"富士山に登ったことがありますか？"},{"en":"Miko has lived in France before.","jp":"みこはフランスに<ruby>住<rt>す</rt></ruby>んだことがあります。","rj":"Miko wa Furansu ni sunda koto ga arimasu.","say":"みこはフランスに住んだことがあります。"},{"en":"Have you ever ridden the subway in Tokyo?","jp":"<ruby>東京<rt>とうきょう</rt></ruby>で<ruby>地下鉄<rt>ちかてつ</rt></ruby>に<ruby>乗<rt>の</rt></ruby>ったことがありますか？","rj":"Toukyou de chikatetsu ni notta koto ga arimasu ka?","say":"東京で地下鉄に乗ったことがありますか？"},{"en":"I have never taught English before.","jp":"<ruby>英語<rt>えいご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えたことがありません。","rj":"Eigo o oshieta koto ga arimasen.","say":"英語を教えたことがありません。"}]},{"num":176,"title":"んです","vocab":[{"t":"成績（せいせき）","m":"seiseki 意思：成績 (grades)","say":"成績（せいせき）"},{"t":"終わる（おわる）","m":"owaru 意思：結束、完成 (to end/finish)","say":"終わる（おわる）"},{"t":"別れる（わかれる）","m":"wakareru 意思：分手 (to break up)","say":"別れる（わかれる）"},{"t":"風呂に入る（ふろにはいる）","m":"furo ni hairu 意思：洗澡、泡澡 (to take a bath)","say":"風呂に入る（ふろにはいる）"},{"t":"シャワーを浴びる（しゃわーをあびる）","m":"shawaa o abiru 意思：淋浴 (to take a shower)","say":"シャワーを浴びる（しゃわーをあびる）"},{"t":"貰う（もらう）","m":"morau 意思：得到、收到 (to receive)","say":"貰う（もらう）"},{"t":"喉（のど）","m":"nodo 意思：喉嚨 (throat)","say":"喉（のど）"},{"t":"試験（しけん）","m":"shiken 意思：考試 (exam)","say":"試験（しけん）"},{"t":"教科書（きょうかしょ）","m":"kyoukasho 意思：教科書 (textbook)","say":"教科書（きょうかしょ）"},{"t":"誕生日（たんじょうび）","m":"tanjoubi 意思：生日 (birthday)","say":"誕生日（たんじょうび）"}],"grammar":["<b>んです 是什麼意思？和一般的陳述句有什麼不同？</b><br><br>日文中有兩種陳述方式：一種是單純客觀地陳述事實，另一種是「說明語氣」，用來解釋原因、背景或補充說明，這就是「んです」的作用。","<b>んです 怎麼接？</b><br><br>接在句子述語（動詞／い形容詞／な形容詞／名詞）的常體（普通形）之後，述語本身可以是肯定或否定、現在式或過去式，但「んです」本身不隨之變化，通常不會出現否定或過去形。名詞、な形容詞後面接んです時，中間要加「な」（例如：静かなんです、学生なんです）。","<b>んです 還有什麼常見用法？</b><br><br>也常用在疑問句中（常搭配「どうして」為什麼、「どうした」發生什麼事），用來邀請對方做出解釋；回答這類問題時，主語常用「が」而非「は」標示。此外，「んです」還可以用來針對剛才說過的話，補充額外的說明或評論。"],"example":[{"en":"The bus didn't come.","jp":"バスが<ruby>来<rt>き</rt></ruby>ませんでした。","rj":"Basu ga kimasen deshita.","say":"バスが来ませんでした。"},{"en":"(The thing is,) the bus didn't come.","jp":"バスが<ruby>来<rt>こ</rt></ruby>なかったんです。","rj":"Basu ga konakatta ndesu.","say":"バスが来なかったんです。"},{"en":"(It's because) my grades aren't good.","jp":"<ruby>成績<rt>せいせき</rt></ruby>がよくないんです。","rj":"Seiseki ga yokunai ndesu.","say":"成績がよくないんです。"},{"en":"(It's because) the exam is over.","jp":"<ruby>試験<rt>しけん</rt></ruby>が<ruby>終<rt>お</rt></ruby>わったんです。","rj":"Shiken ga owatta ndesu.","say":"試験が終わったんです。"},{"en":"There's a test tomorrow.","jp":"あしたテストがあります。","rj":"Ashita tesuto ga arimasu.","say":"あしたテストがあります。"},{"en":"(The thing is,) there's a test tomorrow.","jp":"あしたテストがあるんです。","rj":"Ashita tesuto ga aru ndesu.","say":"あしたテストがあるんです。"},{"en":"I want to go to the bathroom.","jp":"トイレに<ruby>行<rt>い</rt></ruby>きたいです。","rj":"Toire ni ikitai desu.","say":"トイレに行きたいです。"},{"en":"(Actually,) I want to go to the bathroom.","jp":"トイレに<ruby>行<rt>い</rt></ruby>きたいんです。","rj":"Toire ni ikitai ndesu.","say":"トイレに行きたいんです。"},{"en":"Why did you break up with him?","jp":"どうして<ruby>彼<rt>かれ</rt></ruby>と<ruby>別<rt>わか</rt></ruby>れたんですか？","rj":"Doushite kare to wakareta ndesu ka?","say":"どうして彼と別れたんですか？"},{"en":"(It's because) he never takes a bath.","jp":"ぜんぜんお<ruby>風呂<rt>ふろ</rt></ruby>に<ruby>入<rt>はい</rt></ruby>らないんです。","rj":"Zenzen ofuro ni hairanai ndesu.","say":"ぜんぜんお風呂に入らないんです。"},{"en":"What's wrong?","jp":"どうしたんですか？","rj":"Doushita ndesu ka?","say":"どうしたんですか？"},{"en":"(The reason is,) my cat died.","jp":"<ruby>猫<rt>ねこ</rt></ruby>が<ruby>死<rt>し</rt></ruby>んだんです。","rj":"Neko ga shinda ndesu.","say":"猫が死んだんです。"},{"en":"This is a really great textbook, isn't it.","jp":"とてもいい<ruby>教科書<rt>きょうかしょ</rt></ruby>ですね。","rj":"Totemo ii kyoukasho desu ne.","say":"とてもいい教科書ですね。"},{"en":"(Actually,) my teacher wrote it.","jp":"<ruby>私<rt>わたし</rt></ruby>の<ruby>先生<rt>せんせい</rt></ruby>が<ruby>書<rt>か</rt></ruby>いたんです。","rj":"Watashi no sensei ga kaita ndesu.","say":"私の先生が書いたんです。"},{"en":"I received a present.","jp":"プレゼントをもらいました。","rj":"Purezento o moraimashita.","say":"プレゼントをもらいました。"},{"en":"(Actually,) I received a present.","jp":"プレゼントをもらったんです。","rj":"Purezento o moratta ndesu.","say":"プレゼントをもらったんです。"},{"en":"Tomorrow is a holiday.","jp":"<ruby>明日<rt>あした</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みです。","rj":"Ashita wa yasumi desu.","say":"明日は休みです。"},{"en":"(Actually,) tomorrow is a holiday.","jp":"<ruby>明日<rt>あした</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みなんです。","rj":"Ashita wa yasumi na ndesu.","say":"明日は休みなんです。"},{"en":"Yesterday was my birthday.","jp":"<ruby>昨日<rt>きのう</rt></ruby>は<ruby>誕生日<rt>たんじょうび</rt></ruby>でした。","rj":"Kinou wa tanjoubi deshita.","say":"昨日は誕生日でした。"},{"en":"(Actually,) yesterday was my birthday.","jp":"<ruby>昨日<rt>きのう</rt></ruby>は<ruby>誕生日<rt>たんじょうび</rt></ruby>だったんです。","rj":"Kinou wa tanjoubi datta ndesu.","say":"昨日は誕生日だったんです。"},{"en":"The test wasn't difficult.","jp":"テストが<ruby>難<rt>むずか</rt></ruby>しくありませんでした。","rj":"Tesuto ga muzukashiku arimasen deshita.","say":"テストが難しくありませんでした。"},{"en":"(Actually,) the test wasn't difficult.","jp":"テストが<ruby>難<rt>むずか</rt></ruby>しくなかったんです。","rj":"Tesuto ga muzukashikunakatta ndesu.","say":"テストが難しくなかったんです。"},{"en":"My throat hurts.","jp":"<ruby>喉<rt>のど</rt></ruby>が<ruby>痛<rt>いた</rt></ruby>いです。","rj":"Nodo ga itai desu.","say":"喉が痛いです。"},{"en":"(Actually,) my throat hurts.","jp":"<ruby>喉<rt>のど</rt></ruby>が<ruby>痛<rt>いた</rt></ruby>いんです。","rj":"Nodo ga itai ndesu.","say":"喉が痛いんです。"},{"en":"There's a test tomorrow.","jp":"<ruby>明日<rt>あした</rt></ruby>テストがあります。","rj":"Ashita tesuto ga arimasu.","say":"明日テストがあります。"},{"en":"(Actually,) there's a test tomorrow, so...","jp":"<ruby>明日<rt>あした</rt></ruby>テストがあるんです。","rj":"Ashita tesuto ga aru ndesu.","say":"明日テストがあるんです。"}]},{"num":179,"title":"〜すぎる","vocab":[{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"起きる（おきる）","m":"okiru 意思：起床 (to wake up)","say":"起きる（おきる）"},{"t":"早く（はやく）","m":"hayaku 意思：早、快 (early/quickly)","say":"早く（はやく）"},{"t":"いつも","m":"itsumo 意思：總是、經常 (always)","say":"いつも"},{"t":"高い（たかい）","m":"takai 意思：貴、高 (expensive/tall)","say":"高い（たかい）"},{"t":"小さい（ちいさい）","m":"chiisai 意思：小 (small)","say":"小さい（ちいさい）"},{"t":"シャツ","m":"shatsu 意思：襯衫 (shirt)","say":"シャツ"},{"t":"親切（な）（しんせつ（な））","m":"shinsetsu na 意思：親切（的） (kind)","say":"親切（な）（しんせつ（な））"},{"t":"クッキー","m":"kukkii 意思：餅乾 (cookie)","say":"クッキー"},{"t":"甘い（あまい）","m":"amai 意思：甜 (sweet)","say":"甘い（あまい）"},{"t":"テスト","m":"tesuto 意思：考試 (test)","say":"テスト"},{"t":"難しい（むずかしい）","m":"muzukashii 意思：困難的、難的 (difficult)","say":"難しい（むずかしい）"},{"t":"働く（はたらく）","m":"hataraku 意思：工作 (to work)","say":"働く（はたらく）"},{"t":"先週（せんしゅう）","m":"senshuu 意思：上星期 (last week)","say":"先週（せんしゅう）"},{"t":"テレビ","m":"terebi 意思：電視 (television)","say":"テレビ"},{"t":"毎日（まいにち）","m":"mainichi 意思：每天 (every day)","say":"毎日（まいにち）"},{"t":"学校（がっこう）","m":"gakkou 意思：學校 (school)","say":"学校（がっこう）"},{"t":"寒い（さむい）","m":"samui 意思：冷的 (cold)","say":"寒い（さむい）"}],"grammar":["<b>〜すぎる 是什麼意思？怎麼接？</b><br><br>接在動詞ます形的語幹、或い形容詞／な形容詞去掉語尾（い／な）後的詞幹之後，表示「太…、過度…」的意思，用來表達某動作或狀態程度過頭、超出適當範圍。","<b>すぎる 本身怎麼變化？</b><br><br>すぎる本身是規則的る動詞（第二類動詞），可依一般る動詞的規則變化現在肯定（すぎます）、現在否定（すぎません）、過去肯定（すぎました）、過去否定（すぎませんでした）。","<b>すぎる 常搭配什麼句型使用？</b><br><br>常搭配ので、から等表示原因的接續詞，說明因為程度過度而導致的結果（如「因為太冷了，所以不想去學校」）。"],"example":[{"en":"I ate too much.","jp":"<ruby>食<rt>た</rt></ruby>べすぎました。","rj":"Tabesugimashita.","say":"食べすぎました。"},{"en":"I always wake up too early.","jp":"いつも<ruby>早<rt>はや</rt></ruby>く<ruby>起<rt>お</rt></ruby>きすぎます。","rj":"Itsumo hayaku okisugimasu.","say":"いつも早く起きすぎます。"},{"en":"This book is too expensive.","jp":"この<ruby>本<rt>ほん</rt></ruby>は<ruby>高<rt>たか</rt></ruby>すぎます。","rj":"Kono hon wa takasugimasu.","say":"この本は高すぎます。"},{"en":"This shirt is too small.","jp":"このシャツは<ruby>小<rt>ちい</rt></ruby>さすぎます。","rj":"Kono shatsu wa chiisasugimasu.","say":"このシャツは小さすぎます。"},{"en":"That person is too kind.","jp":"あの<ruby>人<rt>ひと</rt></ruby>は<ruby>親切<rt>しんせつ</rt></ruby>すぎます。","rj":"Ano hito wa shinsetsu sugimasu.","say":"あの人は親切すぎます。"},{"en":"This cookie is too sweet.","jp":"このクッキーは<ruby>甘<rt>あま</rt></ruby>すぎます。","rj":"Kono kukkii wa amasugimasu.","say":"このクッキーは甘すぎます。"},{"en":"The test was too difficult.","jp":"テストは<ruby>難<rt>むずか</rt></ruby>しすぎました。","rj":"Tesuto wa muzukashisugimashita.","say":"テストは難しすぎました。"},{"en":"I worked too much last week.","jp":"<ruby>先週<rt>せんしゅう</rt></ruby>は<ruby>働<rt>はたら</rt></ruby>きすぎました。","rj":"Senshuu wa hatarakisugimashita.","say":"先週は働きすぎました。"},{"en":"I watch too much TV every day.","jp":"<ruby>毎日<rt>まいにち</rt></ruby>テレビを<ruby>観<rt>み</rt></ruby>すぎます。","rj":"Mainichi terebi o misugimasu.","say":"毎日テレビを観すぎます。"},{"en":"It's too cold today, so I don't want to go to school.","jp":"<ruby>今日<rt>きょう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>すぎるので<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きたくありません。","rj":"Kyou wa samusugiru node gakkou ni ikitaku arimasen.","say":"今日は寒すぎるので学校に行きたくありません。"},{"en":"It's too cold today, so I don't want to go to school.","jp":"<ruby>今日<rt>きょう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>すぎるから<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きたくありません。","rj":"Kyou wa samusugiru kara gakkou ni ikitaku arimasen.","say":"今日は寒すぎるから学校に行きたくありません。"}]},{"num":181,"title":"〜ほうがいいです","vocab":[{"t":"休む（やすむ）","m":"yasumu 意思：休息、請假、缺席（翹課） (to rest/skip)","say":"休む（やすむ）"},{"t":"嘘をつく（うそをつく）","m":"uso o tsuku 意思：說謊 (to lie)","say":"嘘をつく（うそをつく）"},{"t":"覚える（おぼえる）","m":"oboeru 意思：記住、背誦 (to memorize)","say":"覚える（おぼえる）"},{"t":"心配する（しんぱいする）","m":"shinpai suru 意思：擔心 (to worry)","say":"心配する（しんぱいする）"},{"t":"野菜（やさい）","m":"yasai 意思：蔬菜 (vegetables)","say":"野菜（やさい）"},{"t":"授業（じゅぎょう）","m":"jugyou 意思：課、上課 (class)","say":"授業（じゅぎょう）"},{"t":"病院（びょういん）","m":"byouin 意思：醫院 (hospital)","say":"病院（びょういん）"},{"t":"漢字（かんじ）","m":"kanji 意思：漢字 (kanji characters)","say":"漢字（かんじ）"},{"t":"手紙（てがみ）","m":"tegami 意思：信 (letter)","say":"手紙（てがみ）"},{"t":"お母さん（おかあさん）","m":"okaasan 意思：媽媽 (mother)","say":"お母さん（おかあさん）"}],"grammar":["<b>〜ほうがいいです 是什麼意思？</b><br><br>是句尾表達建議的句型，意思是「（你）最好做…」，用來給予具體且較強烈的忠告——暗示如果不照著建議去做，可能會有危險或發生問題。","<b>〜ほうがいいです 怎麼接？</b><br><br>當建議的內容是肯定（勸對方去做某事）時，前面接動詞的過去肯定普通形＋ほうがいいです；當建議的內容是否定（勸對方不要做某事）時，則接動詞的現在否定普通形＋ほうがいいです。"],"example":[{"en":"You should eat more vegetables.","jp":"もっと<ruby>野菜<rt>やさい</rt></ruby>を<ruby>食<rt>た</rt></ruby>べたほうがいいです。","rj":"Motto yasai o tabeta hou ga ii desu.","say":"もっと野菜を食べたほうがいいです。"},{"en":"You'd better not skip class.","jp":"<ruby>授業<rt>じゅぎょう</rt></ruby>を<ruby>休<rt>やす</rt></ruby>まないほうがいいです。","rj":"Jugyou o yasumanai hou ga ii desu.","say":"授業を休まないほうがいいです。"},{"en":"You should go to the hospital.","jp":"<ruby>病院<rt>びょういん</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったほうがいいです。","rj":"Byouin ni itta hou ga ii desu.","say":"病院に行ったほうがいいです。"},{"en":"You'd better not lie.","jp":"<ruby>嘘<rt>うそ</rt></ruby>をつかないほうがいいです。","rj":"Uso o tsukanai hou ga ii desu.","say":"嘘をつかないほうがいいです。"},{"en":"You should memorize kanji.","jp":"<ruby>漢字<rt>かんじ</rt></ruby>を<ruby>覚<rt>おぼ</rt></ruby>えたほうがいいです。","rj":"Kanji o oboeta hou ga ii desu.","say":"漢字を覚えたほうがいいです。"},{"en":"You'd better not worry.","jp":"<ruby>心配<rt>しんぱい</rt></ruby>しないほうがいいです。","rj":"Shinpai shinai hou ga ii desu.","say":"心配しないほうがいいです。"},{"en":"You should write a letter to your mother.","jp":"お<ruby>母<rt>かあ</rt></ruby>さんに<ruby>手紙<rt>てがみ</rt></ruby>を<ruby>書<rt>か</rt></ruby>いたほうがいいです。","rj":"Okaasan ni tegami o kaita hou ga ii desu.","say":"お母さんに手紙を書いたほうがいいです。"}]},{"num":184,"title":"〜なくちゃいけません","vocab":[{"t":"辞める（やめる / yameru）","m":"To quit（辭去、辭掉）","say":"辞める"},{"t":"バイト（ばいと / baito）","m":"Part time job（兼職、打工）","say":"バイト"}],"grammar":["<b>為什麼「なくちゃいけません」字面上是雙重否定，卻能表達「必須」的意思？</b><br><br>「なくちゃいけません」字面上接近「不…就不行」、「不能不做…」(you cannot go not doing...)。這種雙重否定的說法，在邏輯上反而變成了肯定的「必須」語氣。","<b>「なくちゃいけません」依動詞種類會怎麼變化？請以食べる、言う、する、くる為例。</b><br><br>食べる（たべる - to eat）→ 食べない (tabenai) → 食べなくちゃいけません (tabenakuchaikemasen)  <br>言う（いう - to say）→ 言わない (iwanai) → 言わなくちゃいけません (iwanakuchaikemasen)  <br>する（to do）→ しない (shinai) → しなくちゃいけません (shinakuchaikemasen)  <br>くる（to come）→ こない (konai) → こなくちゃいけません (konakuchaikemasen)<br><br>注意：くる 是不規則動詞，其ない形要變成「こない」（並非「くない」），所以なくちゃいけません形也要對應改成「こなくちゃいけません」。","<b>「いけません」在文法上屬於什麼形式？這代表它可以怎麼繼續變化？</b><br><br>「いけません」在文法上其實是動詞的「現在否定禮貌長型」（相當於一般動詞的ません形）。因此，「なくちゃいけません」可以比照一般ません形繼續變化：  <br>・改成過去式，表示「（那時）不得不…」：<b>なくちゃいけませんでした</b>  <br>・改成短縮形（常體），用於較隨性的口語，或後面要接んです等文法時：<b>なくちゃいけない</b>","<b>請將「因為明天有考試，我今晚必須讀書。」翻譯成日文。（提示：讀書＝勉強する、今晚＝今夜、考試＝テスト、明天＝明日、因為〜＝〜から，「有考試」要用Xがあります句型）</b><br><br>明日(あした) テスト(てすと) が ある から、<br>今夜(こんや) 勉強(べんきょう)し なくちゃいけません。<br>(Ashita tesuto ga aru kara, konya benkyoushi nakuchaikemasen.)<br>＝ 因為明天有考試，我今晚必須讀書。","<b>請將「因為學校變忙了，我必須辭掉打工。」翻譯成日文。（提示：辭職＝辞める、打工＝バイト、學校＝学校、忙碌＝忙しい，「學校變忙了」要用(形容詞)なる句型）</b><br><br>学校(がっこう) が 忙(いそが)しく なった から、<br>バイト(ばいと) を 辞(や)め なくちゃいけません。<br>(Gakkou ga isogashiku natta kara, baito o yame nakuchaikemasen.)<br>＝ 因為學校變忙了，我必須辭掉打工。","<b>總結：「なくちゃいけません」還可以怎麼變化時態與語氣？</b><br><br>「いけません」文法上其實是動詞的「現在否定禮貌長型」，所以可以比照一般ません形繼續變化：  <br>・過去式（表示「以前不得不」）：なくちゃいけません → <b>なくちゃいけませんでした</b>  <br>・口語短縮形（用於較隨性的對話，或後面要接んです等文法時）：なくちゃいけません → <b>なくちゃいけない</b>","<b>練習する（れんしゅうする / renshuusuru）</b><br><br>To practice（練習）","<b>掃除する（そうじする / soujisuru）</b><br><br>To clean up（打掃、清掃）","<b>「なくちゃいけません」是什麼意思？可以拆解成哪兩部分？</b><br><br>「なくちゃいけません」表示「不得不做某事」、「必須做某事」(it is necessary to do something / \"must\")。  <br>可以拆解成兩部分：  <br>・なくちゃ：大略意思是「如果不做…的話」(if you don&#x27;t do...)  <br>・いけません：大略意思是「不能去」(you cannot go)","<b>要把一個句子改成「なくちゃいけません」（必須…）的說法，具體步驟是什麼？</b><br><br><b>步驟一</b>：先把句子改成該動詞的現在否定短形（ない形）。  <br><b>步驟二</b>：把句尾的「ない」替換成「なくちゃいけません」。","<b>總結：把句子改成「なくちゃいけません」（必須…）的造句步驟是什麼？</b><br><br><b>步驟一</b>：先把句子改成動詞的現在否定短形（ない形）。<br><b>步驟二</b>：把句尾的「ない」換成「なくちゃいけません」。<br><br>例：食（た）べない → 食べなくちゃいけません（不得不吃）"],"example":[{"en":"Because I have a test next week, I must study a lot.","jp":"<ruby>来週<rt>らいしゅう</rt></ruby>テストがあるから、たくさん<ruby>勉強<rt>べんきょう</rt></ruby>しなくちゃいけません。","rj":"Raishuu tesuto ga aru kara, takusan benkyoushi nakuchaikemasen.","say":"来週テストがあるから、たくさん勉強しなくちゃいけません。"},{"en":"I had to get up at six this morning.","jp":"<ruby>今朝<rt>けさ</rt></ruby>6<ruby>時<rt>じ</rt></ruby>に<ruby>起<rt>お</rt></ruby>きなくちゃいけませんでした。","rj":"Kesa rokuji ni oki nakuchaikemasendeshita.","say":"今朝6時に起きなくちゃいけませんでした。"},{"en":"I have to quit my part-time job.","jp":"バイトを<ruby>辞<rt>や</rt></ruby>めなくちゃいけません。","rj":"Gakkou ga isogashiku natta kara, baito o yame nakuchaikemasen.","say":"バイトを辞めなくちゃいけません。"},{"en":"I had to clean the house yesterday.","jp":"<ruby>昨日<rt>きのう</rt></ruby><ruby>家<rt>いえ</rt></ruby>を<ruby>掃除<rt>そうじ</rt></ruby>しなくちゃいけませんでした。","rj":"Kinou ie o soujishinakuchaikemasen deshita.","say":"昨日家を掃除しなくちゃいけませんでした。"},{"en":"I had to cook dinner last night.","jp":"<ruby>昨晩<rt>さくばん</rt></ruby><ruby>夜<rt>よる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>料理<rt>りょうり</rt></ruby>しなくちゃいけませんでした。","rj":"Sakuban yorugo han o ryourishinakuchaikemasen deshita.","say":"昨晩夜ご飯を料理しなくちゃいけませんでした。"}]},{"num":186,"title":"〜でしょう","vocab":[{"t":"雨が降る（あめがふる）","m":"ame ga furu 意思：下雨 (To rain / It rains)","say":"雨が降る（あめがふる）"},{"t":"興味がある（きょうみがある）","m":"kyoumi ga aru 意思：對…感興趣 (To be interested in something)","say":"興味がある（きょうみがある）"},{"t":"分かる（わかる）","m":"wakaru 意思：懂、理解 (To understand)","say":"分かる（わかる）"}],"grammar":["<b>文法：「でしょう」要接在什麼詞形後面？</b><br><br>でしょう 直接接在<b>動詞</b>與<b>い形容詞的普通形（短形）</b>後面，肯定、否定皆可。  <br>でしょう 也可以接在<b>な形容詞的語幹</b>與<b>名詞</b>後面。","<b>文法規則：「〜でしょう」現在式的肯定與否定怎麼接？</b><br><br>| 詞性     | 肯定                   | 否定                                 |<br>| -------- | ---------------------- | ------------------------------------ |<br>| 動詞     | 現在肯定短形＋でしょう | 現在否定短形＋でしょう               |<br>| い形容詞 | 現在肯定短形＋でしょう | 現在否定短形＋でしょう               |<br>| な形容詞 | 語幹＋でしょう         | 現在否定短形（〜じゃない）＋でしょう |<br>| 名詞     | 名詞＋でしょう         | 現在否定短形（〜じゃない）＋でしょう |","<b>文法規則：「〜でしょう」過去式的肯定與否定怎麼接？</b><br><br>不管是動詞、い形容詞、な形容詞還是名詞，過去式一律用：<b>過去式短形＋でしょう</b>（肯定、否定都一樣，直接把對應詞類的過去短形接在でしょう前面即可）。","<b>文法：「〜でしょう」句子可以怎麼變成問句？作用是什麼？</b><br><br>把でしょう句改成「〜でしょうか」，就變成疑問句，用來<b>邀請對方說出自己的意見或猜測</b>（相當於「你覺得…呢？」）。","<b>文法：「でしょう」的普通形（短形）是什麼？用在什麼情境？</b><br><br>でしょう 的短形是「<b>だろう</b>」，可以用來比較委婉、謹慎地表達自己的推測或分析（常搭配「〜と思います」）。","<b>文法：口語中「でしょ」是什麼？什麼時候使用？</b><br><br>在<b>輕鬆、口語的對話</b>中，可以用でしょう（帶疑問語氣，常常唸得比較短，變成「でしょ」）來<b>跟對方確認自己剛才說的理解是否正確</b>，類似中文的「…對吧？」。","<b>練習：請將「Mia will probably not eat lunch.（美亞大概不會吃午餐吧）」譯成日文，並運用動詞現在否定短形＋でしょう的句型。</b><br><br>提示：食（た）べる (taberu) - 吃；お昼（ひる）ご飯（はん) (ohirugohan) - 午餐；用現在否定形。<br><br>みあ は お昼(ひる)ご飯(はん) を 食(た)べない でしょう。<br>(Mia wa ohirugohan o tabenai deshou.)<br>美亞大概不會吃午餐吧。","<b>練習：請將「This cake is probably very expensive.（這個蛋糕大概很貴吧）」譯成日文，並運用い形容詞現在肯定短形＋でしょう的句型。</b><br><br>提示：ケーキ (ke-ki) - 蛋糕；高（たか）い (takai) - 貴；用現在肯定形。<br><br>この ケーキ は とても 高(たか)い でしょう。<br>(Kono ke-ki wa totemo takai deshou.)<br>這個蛋糕大概很貴吧。","<b>練習：請將「That person is probably famous.（那個人大概很有名吧）」譯成日文，並運用な形容詞語幹＋でしょう的句型。</b><br><br>提示：人（ひと） (hito) - 人；有名（ゆうめい）な (yuumeina) - 有名；用現在肯定形。<br><br>あの 人(ひと) は 有名(ゆうめい) でしょう。<br>(Ano hito wa yuumei deshou.)<br>那個人大概很有名吧。<br><br>「有名な」是な形容詞，去掉語尾「な」剩下語幹「有名」再接でしょう。","<b>練習：請將「Taka is probably 25 years old.（小隆大概25歲吧）」譯成日文，並運用名詞＋でしょう的句型。</b><br><br>提示：歳（さい) (sai) - 歲；用現在肯定形。<br><br>たか は 25歳(にじゅうごさい) でしょう。<br>(Taka wa nijuugo sai deshou.)<br>小隆大概25歲吧。<br><br>「25歳」是名詞（數字＋量詞），直接加でしょう。","<b>總結：「〜でしょう」現在式與過去式的完整接續規則整理？</b><br><br>| 詞性     | 現在肯定               | 現在否定               | 過去（肯定／否定） |<br>| -------- | ---------------------- | ---------------------- | ------------------ |<br>| 動詞     | 現在肯定短形＋でしょう | 現在否定短形＋でしょう | 過去短形＋でしょう |<br>| い形容詞 | 現在肯定短形＋でしょう | 現在否定短形＋でしょう | 過去短形＋でしょう |<br>| な形容詞 | 語幹＋でしょう         | 現在否定短形＋でしょう | 過去短形＋でしょう |<br>| 名詞     | 名詞＋でしょう         | 現在否定短形＋でしょう | 過去短形＋でしょう |<br><br>重點回顧：<br><br>- でしょう＝「大概…吧」，用於推測、預測。<br>- 動詞／い形容詞：直接用短形（普通形）接でしょう，肯定否定皆同規則。<br>- な形容詞：肯定用語幹接でしょう，否定則用現在否定短形接でしょう。<br>- 名詞：肯定直接用名詞接でしょう，否定則用現在否定短形（〜じゃない）接でしょう。<br>- 過去式：一律用過去短形接でしょう，各詞性規則相同。<br>- でしょうか：把でしょう變問句，邀請對方表達意見或猜測。<br>- だろう：でしょう的普通形（短形），用於較委婉的推測分析，常搭配と思います。<br>- でしょ：口語中でしょう的縮短唸法，帶疑問語氣，用來跟對方確認理解是否正確。","<b>文法：句尾表現「〜でしょう」是什麼意思？什麼時候使用？</b><br><br>「でしょう」是接在句尾的表現，意思是「大概…吧／可能…吧」，用在<b>做出推測或預測</b>的時候。","<b>注意：</b>でしょう 是直接接在這些詞的後面，<b>不可以</b>多加「な」「の」「だ」，也就是沒有 〜なでしょう、〜のでしょう、〜だでしょう 這種說法。"],"example":[{"en":"It will probably rain tomorrow.","jp":"<ruby>明日<rt>あした</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>るでしょう。","rj":"Ashita ame ga furu deshou.","say":"明日雨が降るでしょう。"},{"en":"It probably will not rain tomorrow.","jp":"<ruby>明日<rt>あした</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らないでしょう。","rj":"Ashita ame ga furanai deshou.","say":"明日雨が降らないでしょう。"},{"en":"Hokkaido is probably cold.","jp":"<ruby>北海道<rt>ほっかいどう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>いでしょう。","rj":"Hokkaido wa samui deshou.","say":"北海道は寒いでしょう。"},{"en":"Hokkaido is probably not cold.","jp":"<ruby>北海道<rt>ほっかいどう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>くないでしょう。","rj":"Hokkaido wa samukunai deshou.","say":"北海道は寒くないでしょう。"},{"en":"Ken probably likes fish.","jp":"けんは<ruby>魚<rt>さかな</rt></ruby>が<ruby>好<rt>す</rt></ruby>きでしょう。","rj":"Ken wa sakana ga suki deshou.","say":"けんは魚が好きでしょう。"},{"en":"Ken probably does not like fish.","jp":"けんは<ruby>魚<rt>さかな</rt></ruby>が<ruby>好<rt>す</rt></ruby>きじゃないでしょう。","rj":"Ken wa sakana ga sukijanai deshou.","say":"けんは魚が好きじゃないでしょう。"},{"en":"Mako is probably a student.","jp":"まこは<ruby>学生<rt>がくせい</rt></ruby>でしょう。","rj":"Mako wa gakusei deshou.","say":"まこは学生でしょう。"},{"en":"Mako is probably not a student.","jp":"まこは<ruby>学生<rt>がくせい</rt></ruby>じゃないでしょう。","rj":"Mako wa gakusei janai deshou.","say":"まこは学生じゃないでしょう。"},{"en":"Which do you think is harder, Japanese or Korean?","jp":"<ruby>日本語<rt>にほんご</rt></ruby>と<ruby>韓国語<rt>かんこくご</rt></ruby>と、 どっちのほうが<ruby>難<rt>むずか</rt></ruby>しいでしょうか？","rj":"Nihongo to kankokugo to, docchi no hou ga muzukashii deshouka?","say":"日本語と韓国語と、 どっちのほうが難しいでしょうか？"},{"en":"I think Takeshi is probably interested.","jp":"たけしは<ruby>興味<rt>きょうみ</rt></ruby>があるだろうと思います。","rj":"Takeshi wa kyoumi ga aru darou to omoimasu.","say":"たけしは興味があるだろうと思います。"},{"en":"John, you understand Chinese, right?","jp":"ジョン、 <ruby>中国語<rt>ちゅうごくご</rt></ruby>が<ruby>分<rt>わ</rt></ruby>かるでしょ？","rj":"Jon, chuugokugo ga wakaru desho?","say":"ジョン、 中国語が分かるでしょ？"},{"en":"練習：請將「Mia will probably not eat lunch.","jp":"みあはお<ruby>昼<rt>ひる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べないでしょう。","rj":"Mia wa ohirugohan o tabenai deshou.","say":"みあはお昼ご飯を食べないでしょう。"},{"en":"練習：請將「This cake is probably very expensive.","jp":"このケーキはとても<ruby>高<rt>たか</rt></ruby>いでしょう。","rj":"Kono ke-ki wa totemo takai deshou.","say":"このケーキはとても高いでしょう。"},{"en":"練習：請將「That person is probably famous.","jp":"あの<ruby>人<rt>ひと</rt></ruby>は<ruby>有名<rt>ゆうめい</rt></ruby>でしょう。","rj":"Ano hito wa yuumei deshou.","say":"あの人は有名でしょう。"},{"en":"練習：請將「Taka is probably 25 years old.","jp":"たかは25<ruby>歳<rt>にじゅうごさい</rt></ruby>でしょう。","rj":"Taka wa nijuugo sai deshou.","say":"たかは25歳でしょう。"}]},{"num":189,"title":"Potential verbs","vocab":[{"t":"出る（でる）","m":"deru 意思：出去、離開 (to come out / to leave)","say":"出る（でる）"},{"t":"泳ぐ（およぐ）","m":"oyogu 意思：游泳 (to swim)","say":"泳ぐ（およぐ）"},{"t":"漢字（かんじ）","m":"kanji 意思：漢字 (kanji, Chinese character)","say":"漢字（かんじ）"},{"t":"野球（やきゅう）","m":"yakyuu 意思：棒球 (baseball)","say":"野球（やきゅう）"},{"t":"山（やま）","m":"yama 意思：山 (mountain)","say":"山（やま）"},{"t":"登る（のぼる）","m":"noboru 意思：爬、攀登 (to climb)","say":"登る（のぼる）"}],"grammar":["<b>可能形（Potential verbs）是什麼意思？</b><br><br>可能形用來表示「某人能夠做某事」、「某人有能力做某事」，或是「某件事是有可能發生／成立的」，中文常翻譯成「能～、會～、可以～」。","<b>各類動詞的可能形怎麼變化？</b><br><br>一段動詞（る動詞）：去掉字尾的「る」，加上「られる」，例如：食べる→食べられる、見る→見られる、教える→教えられる。五段動詞（う動詞）：把字尾去掉（u段音），改加「eru」，例如：行く(iku)→行ける(ikeru)、話す(hanasu)→話せる(hanaseru)、取る(toru)→取れる(toreru)。不規則動詞：する→できる、来る(くる)→来られる(こられる)。","<b>可能形是否有比較簡略、口語的形式？</b><br><br>一段動詞與来る的可能形（～られる／こられる）音節較長，因此另外有一種較短的「ら抜き」形式：把「られる」拿掉中間的「ら」變成「れる」即可，例如出られる→出れる、見られる→見れる、来られる→来れる。這種省略形雖然在口語中越來越普遍，但一般仍被視為較不正式、較不標準的說法。","<b>可能形本身要怎麼再做時態、肯定否定變化？</b><br><br>可能形（無論是～られる還是～eru結尾）本身都屬於一段動詞（る動詞），因此依一般一段動詞的規則繼續變化：現在肯定：常體「－る」／敬體「－ます」；現在否定：常體「－ない」／敬體「－ません」；過去肯定：常體「－た」／敬體「－ました」；過去否定：常體「－なかった」／敬體「－ませんでした」；て形則一律是「－て」。","<b>把動詞改成可能形之後，助詞會不會改變？</b><br><br>原本用「を」的動詞，變成可能形之後，助詞「を」和「が」兩者都可以用，例如：漢字を読みます。→漢字が読めます。（或漢字を読めます。也可以）。但する的可能形「できる」幾乎都只搭配「が」，例如：野球をします。→野球ができます。（「野球をできます」被視為不標準的說法）。除了「を」以外的其他助詞，變成可能形之後維持不變，例如：山に登ります。→山に登れます。，助詞「に」不變。"],"example":[{"en":"I can speak Japanese.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>話<rt>はな</rt></ruby>せます。","rj":"Nihongo ga hanasemasu.","say":"日本語が話せます。"},{"en":"I cannot swim.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>泳<rt>およ</rt></ruby>げません。","rj":"Watashi wa oyogemasen.","say":"私は泳げません。"},{"en":"We could not go to the beach.","jp":"<ruby>海<rt>うみ</rt></ruby>に<ruby>行<rt>い</rt></ruby>けませんでした。","rj":"Umi ni ikemasen deshita.","say":"海に行けませんでした。"},{"en":"I read kanji.","jp":"<ruby>漢字<rt>かんじ</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みます。","rj":"Kanji o yomimasu.","say":"漢字を読みます。"},{"en":"I can read kanji.","jp":"<ruby>漢字<rt>かんじ</rt></ruby>が<ruby>読<rt>よ</rt></ruby>めます。","rj":"Kanji ga yomemasu.","say":"漢字が読めます。"},{"en":"I play baseball.","jp":"<ruby>野球<rt>やきゅう</rt></ruby>をします。","rj":"Yakyuu o shimasu.","say":"野球をします。"},{"en":"I can play baseball.","jp":"<ruby>野球<rt>やきゅう</rt></ruby>ができます。","rj":"Yakyuu ga dekimasu.","say":"野球ができます。"},{"en":"I climb mountains.","jp":"<ruby>山<rt>やま</rt></ruby>に<ruby>登<rt>のぼ</rt></ruby>ります。","rj":"Yama ni noborimasu.","say":"山に登ります。"},{"en":"I can climb mountains.","jp":"<ruby>山<rt>やま</rt></ruby>に<ruby>登<rt>のぼ</rt></ruby>れます。","rj":"Yama ni noboremasu.","say":"山に登れます。"},{"en":"I can speak Chinese.","jp":"<ruby>中国語<rt>ちゅうごくご</rt></ruby>が<ruby>話<rt>はな</rt></ruby>せます。","rj":"Chuugokugo ga hanasemasu.","say":"中国語が話せます。"},{"en":"Takeshi cannot swim.","jp":"たけしは<ruby>泳<rt>およ</rt></ruby>げません。","rj":"Takeshi wa oyogemasen.","say":"たけしは泳げません。"},{"en":"I could not go to school yesterday.","jp":"<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>けませんでした。","rj":"Gakkou ni ikemasen deshita.","say":"学校に行けませんでした。"},{"en":"I could eat breakfast.","jp":"<ruby>朝<rt>あさ</rt></ruby>ごはんを<ruby>食<rt>た</rt></ruby>べられました。","rj":"Asagohan o taberaremashita.","say":"朝ごはんを食べられました。"}]},{"num":190,"title":"The usage of Short form + し","vocab":[{"t":"彼氏（かれし）","m":"kareshi 意思：男朋友 (Boyfriend)","say":"彼氏（かれし）"},{"t":"電話（でんわ）","m":"denwa 意思：電話 (Phone)","say":"電話（でんわ）"},{"t":"素晴らしい（すばらしい）","m":"subarashii 意思：很棒的、了不起的 (Great, wonderful)","say":"素晴らしい（すばらしい）"},{"t":"物価（ぶっか）","m":"bukka 意思：物價 (Prices (of commodities))","say":"物価（ぶっか）"},{"t":"生活（せいかつ）","m":"seikatsu 意思：生活 (Life)","say":"生活（せいかつ）"},{"t":"楽な（らくな）","m":"rakuna 意思：輕鬆自在的 (Easygoing)","say":"楽な（らくな）"},{"t":"約束（やくそく）","m":"yakusoku 意思：約定、承諾 (Promise)","say":"約束（やくそく）"},{"t":"約束を守る（やくそくをまもる）","m":"yakusoku o mamoru 意思：遵守約定 (Keep promises)","say":"約束を守る（やくそくをまもる）"}],"grammar":["<b>常體＋し 是什麼意思？</b><br><br>要說明一件事的原因時，可以用連接詞「から」；但當理由不只一個，而是想同時列舉兩個（或以上）的理由來說明某個情況時，就可以用「し」來取代「から」，語感類似中文的「既...又...，所以...」。","<b>し 怎麼接？</b><br><br>「し」通常接在述語（動詞／い形容詞／な形容詞／名詞）的常體（短形）之後。現在肯定時，な形容詞和名詞後面要加上「だ」才能接し（例如：親切だし、先生だし），但い形容詞不需要加だ，直接以常體形式加し即可（例如：おもしろいし、いいし）。句型結構為：（理由）し、（理由）し、（情況）。","<b>如果句子裡只用了一個し子句，代表什麼意思？</b><br><br>即使只列出一個し子句，也暗示這並不是唯一的理由，說話者只是舉出其中一個理由，還隱含著其他沒有明說的原因。例如：物価（ぶっか）が安（やす）いし、この町（まち）の生活（せいかつ）は楽（らく）です。（這個城市生活很輕鬆自在，其中一個原因是物價便宜。）","<b>し子句一定要放在情況句子的前面嗎？</b><br><br>不一定，有時候し子句也可以放在情況描述之後，用來補充說明理由。例如：まりはいい先生（せんせい）です。教（おし）えるのが上手（じょうず）だし、親切（しんせつ）だし。（麻里是個好老師，她很擅長教學，而且也很親切。）"],"example":[{"en":"Why aren't you coming to the party?","jp":"どうしてパーティーに<ruby>来<rt>こ</rt></ruby>ないんですか？","rj":"Doushite paatii ni konai ndesu ka?","say":"どうしてパーティーに来ないんですか？"},{"en":"I have to study today, because there will be an exam tomorrow.","jp":"<ruby>明日<rt>あした</rt></ruby><ruby>試験<rt>しけん</rt></ruby>があるから、<ruby>今日<rt>きょう</rt></ruby>は<ruby>勉強<rt>べんきょう</rt></ruby>しなくちゃいけないんです。","rj":"Ashita shiken ga aru kara, kyou wa benkyou shinakucha ikenai ndesu.","say":"明日試験があるから、今日は勉強しなくちゃいけないんです。"},{"en":"I really like my Japanese class, because Japanese Language is interesting and our teacher is good.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>はおもしろいし、<ruby>先生<rt>せんせい</rt></ruby>はいいし、<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>授業<rt>じゅぎょう</rt></ruby>が<ruby>大好<rt>だいす</rt></ruby>きです。","rj":"Nihongo wa omoshiroi shi, sensei wa ii shi, nihongo no jugyou ga daisuki desu.","say":"日本語はおもしろいし、先生はいいし、日本語の授業が大好きです。"},{"en":"Yesterday was a great day because I met my family, and I talked with my boyfriend on the phone.","jp":"<ruby>家族<rt>かぞく</rt></ruby>に<ruby>会<rt>あ</rt></ruby>ったし、<ruby>彼氏<rt>かれし</rt></ruby>と<ruby>電話<rt>でんわ</rt></ruby>で<ruby>話<rt>はな</rt></ruby>したし、<ruby>昨日<rt>きのう</rt></ruby>は<ruby>素晴<rt>すば</rt></ruby>らしい<ruby>日<rt>ひ</rt></ruby>でした。","rj":"Kazoku ni atta shi, kareshi to denwa de hanashita shi, kinou wa subarashii hi deshita.","say":"家族に会ったし、彼氏と電話で話したし、昨日は素晴らしい日でした。"},{"en":"Life in this city is an easygoing one. Things are inexpensive, for one thing.","jp":"<ruby>物価<rt>ぶっか</rt></ruby>が<ruby>安<rt>やす</rt></ruby>いし、この<ruby>町<rt>まち</rt></ruby>の<ruby>生活<rt>せいかつ</rt></ruby>は<ruby>楽<rt>らく</rt></ruby>です。","rj":"Bukka ga yasui shi, kono machi no seikatsu wa raku desu.","say":"物価が安いし、この町の生活は楽です。"},{"en":"Mari is a great teacher. She is good at teaching, and she is kind.","jp":"まりはいい<ruby>先生<rt>せんせい</rt></ruby>です。<ruby>教<rt>おし</rt></ruby>えるのが<ruby>上手<rt>じょうず</rt></ruby>だし、<ruby>親切<rt>しんせつ</rt></ruby>だし。","rj":"Mari wa ii sensei desu. Oshieru no ga jouzu da shi, shinsetsu da shi.","say":"まりはいい先生です。教えるのが上手だし、親切だし。"},{"en":"I don't want to wake up because it is cold and I am sleepy.","jp":"<ruby>寒<rt>さむ</rt></ruby>いし、<ruby>眠<rt>ねむ</rt></ruby>たいし、<ruby>起<rt>お</rt></ruby>きたくありません。","rj":"Samui shi, nemutai shi, okitaku arimasen.","say":"寒いし、眠たいし、起きたくありません。"},{"en":"Tom is popular because he is smart and can play the guitar.","jp":"<ruby>頭<rt>あたま</rt></ruby>がいいし、ギターが<ruby>弾<rt>ひ</rt></ruby>けるし、トムは<ruby>人気<rt>にんき</rt></ruby>です。","rj":"Atama ga ii shi, gitaa ga hikeru shi, Tomu wa ninki desu.","say":"頭がいいし、ギターが弾けるし、トムは人気です。"},{"en":"Today is busy because I have a test tomorrow and I have to meet Taka.","jp":"<ruby>明日<rt>あした</rt></ruby>テストがあるし、たかに<ruby>会<rt>あ</rt></ruby>わなくちゃいけないし、<ruby>今日<rt>きょう</rt></ruby>は<ruby>忙<rt>いそが</rt></ruby>しいです。","rj":"Ashita tesuto ga aru shi, Taka ni awanakucha ikenai shi, kyou wa isogashii desu.","say":"明日テストがあるし、たかに会わなくちゃいけないし、今日は忙しいです。"}]},{"num":191,"title":"〜そうです (It looks like 〜)","vocab":[{"t":"退屈な（たいくつな）","m":"taikutsu na 意思：無聊的 (boring)","say":"退屈な（たいくつな）"},{"t":"暖かい（あたたかい）","m":"atatakai 意思：溫暖的 (warm)","say":"暖かい（あたたかい）"},{"t":"甘い（あまい）","m":"amai 意思：甜的 (sweet)","say":"甘い（あまい）"},{"t":"悲しい（かなしい）","m":"kanashii 意思：悲傷的 (sad)","say":"悲しい（かなしい）"}],"grammar":["<b>〜そうです 是什麼意思？</b><br><br>「〜そうです」接在い形容詞或な形容詞的語幹後面，表示「看起來好像…」，是根據我們看到的樣子（視覺印象）所做的推測，而不是已經確認的客觀事實。例如看到蘋果外觀誘人，還沒吃之前可以說「おいしそうです」（看起來很好吃），等真的吃過確認好吃後，才會改用「おいしいです」。","<b>い形容詞／な形容詞接そうです時怎麼變化？有沒有例外？</b><br><br>い形容詞只要去掉語尾的「い」再加上「そう」；な形容詞只要去掉語尾的「な」再加上「そう」。唯一的例外是い形容詞「いい」，不能直接去い加そう，必須先改成「よさ」，變成「よさそう」。「そう」本身當作一個な形容詞使用，接續依な形容詞的規則變化：現在肯定「〜そうです」、過去肯定「〜そうでした」、現在否定「〜そうじゃないです」、過去否定「〜そうじゃなかったです」、て形則是「〜そうで」。","<b>そうです 的否定形怎麼接？需要注意什麼？</b><br><br>要先把該形容詞變成現在否定的常體（普通形，語尾為「ない」），再把「ない」改成「なさ」，然後加上「そう」。例如：難しい→難しくない→難しくなさそう；上手な→上手じゃない→上手じゃなさそう；いい→よくない→よくなさそう。要特別注意不能做成雙重否定，形容詞本身與そうな兩者之中，只能有一個是否定形，另一個必須維持肯定形。","<b>そうな 可以用來修飾名詞嗎？</b><br><br>可以。因為「そう」本身是な形容詞，所以要修飾名詞時直接用「そうな＋名詞」的形式，不需要另外變化。例如「暖かそうなセーターを着ています」（穿著看起來很溫暖的毛衣）。","<b>動詞也可以接そうです嗎？意思和變化要注意什麼？</b><br><br>可以，動詞ます形的語幹（去掉ます）加上そうです，用來表示「眼看就要發生的事」，例如「雨がふりそうです」（看起來快要下雨了）。但這個用法的否定形比較特殊，不是「〜なさそうです」，而是用「〜そうもありません」，例如「雨がふりそうもありません」（看起來不會下雨）。","<b>そうです 的推測一定都是靠外觀嗎？</b><br><br>大部分情況下，そうです確實是根據視覺上的印象所做的猜測，用在我們還沒有確切證據、只能憑外表判斷的時候。但並非所有形容詞都適用——像「きれいな」這種光靠外觀就足以下定論的形容詞，就不需要用そう，直接說「きれいです」（很漂亮）即可，因為看到當下就已經是充分的證據了，沒有「推測」的必要。"],"example":[{"en":"This apple looks delicious.","jp":"このりんごはおいしそうです。","rj":"Kono ringo wa oishisou desu.","say":"このりんごはおいしそうです。"},{"en":"It looks like the weather will be fine tomorrow.","jp":"<ruby>明日<rt>あした</rt></ruby>は<ruby>天気<rt>てんき</rt></ruby>が<ruby>良<rt>よ</rt></ruby>さそうです。","rj":"Ashita wa tenki ga yosasou desu.","say":"明日は天気が良さそうです。"},{"en":"It looked like Mary was fine.","jp":"メアリーは<ruby>元気<rt>げんき</rt></ruby>そうでした。","rj":"Mearii wa genkisou deshita.","say":"メアリーは元気そうでした。"},{"en":"This book does not look difficult.","jp":"この<ruby>本<rt>ほん</rt></ruby>は<ruby>難<rt>むずか</rt></ruby>しくなさそうです。","rj":"Kono hon wa muzukashikunasasou desu.","say":"この本は難しくなさそうです。"},{"en":"It does not look like Tomoko is good at tennis.","jp":"ともこはテニスが<ruby>上手<rt>じょうず</rt></ruby>じゃなさそうです。","rj":"Tomoko wa tenisu ga jouzu janasasou desu.","say":"ともこはテニスが上手じゃなさそうです。"},{"en":"She wears a warm-looking sweater.","jp":"<ruby>暖<rt>あたた</rt></ruby>かそうなセーターを<ruby>着<rt>き</rt></ruby>ています。","rj":"Atatakasouna seetaa o kite imasu.","say":"暖かそうなセーターを着ています。"},{"en":"It looks like it will rain.","jp":"<ruby>雨<rt>あめ</rt></ruby>がふりそうです。","rj":"Ame ga furisou desu.","say":"雨がふりそうです。"},{"en":"It does not look like it will rain.","jp":"<ruby>雨<rt>あめ</rt></ruby>がふりそうもありません。","rj":"Ame ga furisou mo arimasen.","say":"雨がふりそうもありません。"},{"en":"This cake looks sweet.","jp":"このケーキは<ruby>甘<rt>あま</rt></ruby>そうです。","rj":"Kono keeki wa amasou desu.","say":"このケーキは甘そうです。"},{"en":"Takashi looks energetic.","jp":"たけしは<ruby>元気<rt>げんき</rt></ruby>そうです。","rj":"Takeshi wa genkisou desu.","say":"たけしは元気そうです。"},{"en":"This book does not look interesting.","jp":"この<ruby>本<rt>ほん</rt></ruby>は<ruby>面白<rt>おもしろ</rt></ruby>くなさそうです。","rj":"Kono hon wa omoshirokunasasou desu.","say":"この本は面白くなさそうです。"},{"en":"My spanish Language teacher does not look kind.","jp":"<ruby>私<rt>わたし</rt></ruby>のスペイン<ruby>語<rt>ご</rt></ruby>の<ruby>先生<rt>せんせい</rt></ruby>は<ruby>親切<rt>しんせつ</rt></ruby>じゃなさそうです。","rj":"Watashi no supeingo no sensei wa shinsetsu janasasou desu.","say":"私のスペイン語の先生は親切じゃなさそうです。"},{"en":"Miki looked sad.","jp":"みきは<ruby>悲<rt>かな</rt></ruby>しそうでした。","rj":"Miki wa kanashisou deshita.","say":"みきは悲しそうでした。"}]},{"num":192,"title":"〜てみる（To try doing 〜）","vocab":[{"t":"ゲーム（げーむ）","m":"gēmu 意思：遊戲 (Game)","say":"ゲーム（げーむ）"},{"t":"美術館（びじゅつかん）","m":"bijutsukan 意思：美術館 (Museum)","say":"美術館（びじゅつかん）"},{"t":"時間（じかん）","m":"jikan 意思：時間 (Time)","say":"時間（じかん）"}],"grammar":["<b>〜てみる 是什麼意思？</b><br><br>使用動詞的て形加上「みる」，用來表示「嘗試做某件事」或「姑且做做看」的語氣。說話者並不確定這麼做之後會有什麼結果，但還是先做做看，看看效果或反應如何。","<b>〜てみる 怎麼接？要注意什麼？</b><br><br>接續方式是「動詞て形＋みる」。這裡的「みる」來自動詞「見る（みる，看、看看）」，作為補助動詞使用時仍依一段動詞（る動詞）的規則變化：現在肯定「ーてみます」、現在否定「ーてみません」、過去肯定「ーてみました」、過去否定「ーてみませんでした」，て形則是「ーてみて」。"],"example":[{"en":"I did not know the kanji, so I tried asking a J
