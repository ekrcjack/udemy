m:"きよしは背（せ）が高（たか）いですか？ kiyoshi wa se ga takaidesuka?"}],grammar:["<b>文型：</b>(Person)は (Body part)が (Adjective)です。<br><br>例句：  <br>とむは<ruby>髪<rt>かみ</rt></ruby>が<ruby>長<rt>なが</rt></ruby>いです。  <br>Tom wa kami ga nagaidesu.  <br>（Tom has long hair. 直譯：As for Tom, [his] hair is long.）","<b>注意：</b>若只說「とむの髪は長いです」（Tom&#x27;s hair is long）較不自然，正確説法是把身體部位當作主語用「が」表示。此用法不只限於頭髮長度，也適用於描述人的各種身體特徵。","**在「(Body part)が(Adjective)です」句型中，以下慣用搭配是什麼意思？  <br>背が高い／背が低い／頭が良い**<br><br><ruby>背<rt>せ</rt></ruby>が<ruby>高<rt>たか</rt></ruby>い - （身高）高  <br><ruby>背<rt>せ</rt></ruby>が<ruby>低<rt>ひく</rt></ruby>い - （身高）矮  <br><ruby>頭<rt>あたま</rt></ruby>が<ruby>良<rt>い</rt></ruby>い - 聰明、腦筋好<br><br>這些是慣用搭配（idiomatic collocations），字面上是「身高是高的／矮的」「頭腦是好的」，整體用來形容一個人。","<b>使用「(Person)は(Body part)が(Adjective)です」句型時，要注意什麼？</b><br><br>要依句子情況調整形容詞的形態，例如：  <br>・否定：〜くないです（例：小さくないです）  <br>・疑問：〜ですか？  <br>・過去等其他時態也要相應變化。","<b>Mickey Mouse has huge hands.</b><br><br>ミッキーマウスは<ruby>手<rt>て</rt></ruby>が<ruby>大<rt>おお</rt></ruby>きいです。  <br>mikkiimausu wa te ga ookiidesu.","<b>Akane does not have small eyes.</b><br><br>あかねは<ruby>目<rt>め</rt></ruby>が<ruby>小<rt>ちい</rt></ruby>さくないです。  <br>akane wa me ga chiisakunaidesu."],example:[]},{num:135,title:"Qualifying Nouns with Verbs and Adjectives",vocab:[{t:"<ruby>私<rt>わたし</rt></ruby>と <ruby>働<rt>はたら</rt></ruby>く <ruby>人<rt>ひと</rt></ruby>",m:"(watashi to hataraku hito)"},{t:"<ruby>綺麗<rt>きれい</rt></ruby>な <ruby>女<rt>おんな</rt></ruby>の<ruby>子<rt>こ</rt></ruby>",m:"(kireina onnanoko)"},{t:"<ruby>目<rt>め</rt></ruby>が <ruby>大<rt>おお</rt></ruby>きい <ruby>人<rt>ひと</rt></ruby>",m:"(me ga ookii hito)"},{t:"四種類型對照表：",m:"1. 單純形容詞修飾 → おもしろい人（有趣的人） 2. 屬性描述句 → 髪が長い人（長頭髮的人） 3. 動詞短型修飾 → めがねをかけている人（戴眼鏡的人） 4. 關係性な形容詞修飾 → バスケットボールをするのが好きな友達（喜歡打籃球的朋友）"}],grammar:["<b>日文中，動詞的短型（辭書形、ない形、た形等）可以用來做什麼？請舉一個例句說明。</b><br><br>動詞的短型可以像形容詞一樣<b>修飾名詞</b>（放在名詞前面）。<br><br>例句：<b>あそこで<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでいる<ruby>学生<rt>がくせい</rt></ruby></b>はみちこです。  <br>(asoko de hon o yondeiru gakusei wa michiko desu.)  <br>「The student who is reading a book over there is Michiko.」<br><br>「あそこで本を読んでいる」這個句子被用來修飾名詞「<ruby>学生<rt>がくせい</rt></ruby>」。","<b>日文中，名詞修飾（noun qualification）常見的四種類型是什麼？</b><br><br>1. 單純形容詞修飾 (a straightforward adjectival example)<br>2. 描述人物屬性的句子 (a phrase describing a person&#x27;s attribute)<br>3. 動詞短型修飾 (a verb in the short form)<br>4. 關係性な形容詞修飾 (a な-adjective which is relational)","<b>「</b>おもしろい　<ruby>人<rt>ひと</rt></ruby><b>」(omoshiroi hito) 是什麼意思？屬於名詞修飾的哪一種類型？</b><br><br>意思：<b>有趣的人</b> / \"An interesting person\" (直譯：a person who is interesting)<br><br>類型：<b>單純形容詞修飾</b> (a straightforward adjectival example)  <br>おもしろい = Qualifying adjective　　人 = Qualified noun","<b>「</b><ruby>髪<rt>かみ</rt></ruby>が<ruby>長<rt>なが</rt></ruby>い　<ruby>人<rt>ひと</rt></ruby><b>」(kami ga nagai hito) 是什麼意思？屬於名詞修飾的哪一種類型？</b><br><br>意思：<b>有長頭髮的人</b> / \"A person who has long hair\"<br><br>類型：<b>包含描述人物屬性的句子</b> (contains a phrase describing a person&#x27;s attribute)  <br>髪が長い = Qualifying adjective phrase　　人 = Qualified noun<br><br>句型提示：「(身體部位) が (形容詞) です」可用來描述人物特徵。","<b>「</b>めがね を かけている　<ruby>人<rt>ひと</rt></ruby><b>」(megane o kaketeiru hito) 是什麼意思？屬於名詞修飾的哪一種類型？</b><br><br>意思：<b>戴眼鏡的人</b> / \"A person who wears glasses\"<br><br>類型：<b>動詞短型修飾</b> (has a verb in the short form)  <br>めがねをかけている = Qualifying phrase (動詞ている形，短型)　　人 = Qualified noun","<b>「あそこ で <ruby>写真<rt>しゃしん</rt></ruby>を とっている ひと は だれですか？」中文意思是什麼？句子結構如何拆解？</b><br><br>中文：<b>那邊在拍照的人是誰？</b> / \"Who is the person who is taking pictures over there?\"<br><br>結構拆解：  <br>[あそこで写真をとっている]（修飾句：正在那邊拍照）+ [ひと]（被修飾名詞：人）+ [はだれですか？]（是誰呢？）","<b>「<ruby>毎日<rt>まいにち</rt></ruby><ruby>運動<rt>うんどう</rt></ruby>する　<ruby>人<rt>ひと</rt></ruby>は げんきです。」中文意思是什麼？句子結構如何拆解？</b><br><br>中文：<b>每天做運動的人很健康。</b> / \"People who do physical exercises everyday are healthy.\"<br><br>結構拆解：  <br>[毎日運動する]（修飾句，動詞辭書形：每天做運動）+ [人]（被修飾名詞）+ [はげんきです]（很健康）","<b>「たばこ を <ruby>吸<rt>す</rt></ruby>わない　ひと が すきです。」中文意思是什麼？句子結構如何拆解？</b><br><br>中文：<b>我喜歡不吸菸的人。</b> / \"I like people who do not smoke.\"<br><br>結構拆解：  <br>[たばこを吸わない]（修飾句，動詞ない形：不吸菸）+ [ひと]（被修飾名詞）+ [がすきです]（喜歡）","<b>「<ruby>去年<rt>きょねん</rt></ruby><ruby>結婚<rt>けっこん</rt></ruby>した　ともだち から てがみ が きました。」中文意思是什麼？句子結構如何拆解？</b><br><br>中文：<b>去年結婚的朋友寄來了信。</b> / \"A letter came from a friend who got married last year.\"<br><br>結構拆解：  <br>[去年結婚した]（修飾句，動詞た形/過去式：去年結婚了）+ [ともだち]（被修飾名詞：朋友）+ [からてがみがきました]（寄來了信）","<b>「バスケットボール を するのが <ruby>好<rt>す</rt></ruby>きな　<ruby>私<rt>わたし</rt></ruby>の <ruby>友達<rt>ともだち</rt></ruby>」是什麼意思？屬於名詞修飾的哪一種類型？</b><br><br>意思：<b>喜歡打籃球的我的朋友</b> / \"A friend of mine who likes to play basketball.\"<br><br>類型：<b>關係性な形容詞修飾</b> (has a な-adjective which is relational)  <br>バスケットボールをするのが好きな = Qualifying phrase（な形容詞：好きな）　　私の友達 = Qualified noun","**用日文表達：「和我一起工作的人」(A person who I work with)。  <br>提示：人＝<ruby>人<rt>ひと</rt></ruby>、工作＝働く（はたらく）、跟...一起＝〜と、「who I work with」要譯成「(某人)和我一起工作」。**","**用日文表達：「擅長做菜的人」(A person who is good at cooking)。  <br>提示：人＝<ruby>人<rt>ひと</rt></ruby>、擅長...＝〜が<ruby>上手<rt>じょうず</rt></ruby>な、做菜＝<ruby>料理<rt>りょうり</rt></ruby>する。**","<b><ruby>料理<rt>りょうり</rt></ruby>する のが <ruby>上手<rt>じょうず</rt></ruby>な <ruby>人<rt>ひと</rt></ruby></b>  <br>(ryourisuru noga jouzuna hito)","**用日文表達：「漂亮的女孩」(A beautiful girl)。  <br>提示：女孩＝女の<ruby>子<rt>おんなのこ</rt></ruby>、漂亮＝<ruby>綺麗<rt>きれい</rt></ruby>な。**","**用日文表達：「眼睛大的人」(A person who has big eyes)。  <br>提示：人＝<ruby>人<rt>ひと</rt></ruby>、眼睛＝<ruby>目<rt>め</rt></ruby>、大＝大きい（おおきい），需使用「(身體部位)が(形容詞)です」句型並將です變化為適當形式來修飾名詞。**","<b>【總結】日文名詞修飾的核心規則是什麼？四種類型各舉一例，整理成對照表。</b>","<b>核心規則</b>：動詞的短型（辭書形／ない形／た形／ている形）可以像形容詞一樣修飾名詞。"],example:[]}],"short-form":[{num:115,title:"Present tense Short form - Affirmative Conjugation",vocab:[],grammar:["<b>總結：現在式短形肯定變化，Group A 和 Group B 的規則各是什麼？</b><br><br>Group A（動詞、い形容詞）：短形＝辭書形，不需要做任何變化。例如「読む」、「かわいい」。  <br>Group B（な形容詞、名詞+です）：把長形句尾的「です」換成「だ」。例如「静かだ」、「学生だ」。"],example:[{en:null,jp:"<ruby>読<rt>よ</rt></ruby>みます（yomimasu，長形）→ <ruby>読<rt>よ</rt></ruby>む（yomu，短形）－意思：讀、看",zh:"整體對照表如下："},{en:null,jp:"<ruby>読<rt>よ</rt></ruby>む（よむ / yomu）－長形：<ruby>読<rt>よ</rt></ruby>みます（よみます / yomimasu）－意思：讀、看",zh:"例："},{en:null,jp:"<ruby>食<rt>た</rt></ruby>べる（たべる / taberu）－長形：<ruby>食<rt>た</rt></ruby>べます（たべます / tabemasu）－意思：吃",zh:"例："},{en:null,jp:"する（suru）－長形：します（shimasu）－意思：做",zh:"例："},{en:null,jp:"かわいいです（kawaiidesu，長形）→ かわいい（kawaii，短形）－意思：可愛",zh:"例："},{en:null,jp:"<ruby>静<rt>しず</rt></ruby>かです（shizukadesu）→ <ruby>静<rt>しず</rt></ruby>かだ（shizukada）－意思：安靜",zh:"例："},{en:null,jp:"<ruby>学生<rt>がくせい</rt></ruby>です（gakuseidesu）→ <ruby>学生<rt>がくせい</rt></ruby>だ（gakuseida）－意思：（是）學生",zh:"例："},{en:"I eat steaks.",jp:"**（Practice 1）請將「我吃牛排。」的短形句子翻譯成日文，並說明用了什麼文法規則。**",zh:null},{en:"This house is big",jp:"**（Practice 2）請將「這間房子很大。」的短形句子翻譯成日文，並說明用了什麼文法規則。**",zh:null},{en:"The library is quiet",jp:"**（Practice 3）請將「圖書館很安靜。」的短形句子翻譯成日文，並說明用了什麼文法規則。**",zh:null},{en:"I am a student.",jp:"**（Practice 4）請將「我是學生。」的短形句子翻譯成日文，並說明用了什麼文法規則。**",zh:null}]},{num:116,title:"Present tense Short form - Short form Negative Conjugation",vocab:[],grammar:["<b>な形容詞、い形容詞、以及「名詞＋です」的現在式短形否定，共同規則是什麼？（Group C）</b><br><br>規則很簡單：把長形否定句尾的「です」拿掉，就是短形否定，其他部分完全不變。<br><br>い形容詞：かわいい（可愛的）→ 長形：かわいくないです（kawaikunaidesu）→ 短形：かわいくない（kawaikunai，不可愛）  <br>な形容詞：静か（しずか / shizuka，安靜的）→ 長形：静か（しずか）じゃないです（shizukajanaidesu）→ 短形：静か（しずか）じゃない（shizukajanai，不安靜）  <br>名詞＋です：学生（がくせい / gakusei，學生）→ 長形：<ruby>学生<rt>がくせい</rt></ruby>じゃないです（gakuseijanaidesu）→ 短形：<ruby>学生<rt>がくせい</rt></ruby>じゃない（gakuseijanai，不是學生）<br><br>文法說明：無論是い形容詞、な形容詞，還是「名詞＋です」，現在式否定的長形一定以「です」結尾，短形否定只要把這個「です」去掉即可，不需要再做其他變化。","<b>Ru動詞（る動詞）現在式短形否定怎麼變化？以「食べる」為例</b><br><br><ruby>食<rt>た</rt></ruby>べる（taberu，辭書形，吃）→ <ruby>食<rt>た</rt></ruby>べない（tabenai，短形否定，不吃）<br><br>文法說明：「食べる」是Ru動詞，語幹是「食べ」，辭書形在語幹後面加「る」。短形否定的規則是把辭書形字尾的「る」去掉，直接加上「ない」，語幹「食べ」本身不需要再變化。","<b>U動詞（う動詞）現在式短形否定怎麼變化？以「書く」為例</b><br><br><ruby>書<rt>か</rt></ruby>く（kaku，辭書形，寫）→ <ruby>書<rt>か</rt></ruby>かない（kakanai，短形否定，不寫）<br><br>文法說明：「書く」是U動詞，辭書形字尾是「く」（子音k+母音u）。短形否定的規則是把字尾的母音「u」去掉，改成「a」，再加上「ない」，也就是「く（ku）→か（ka）+ない」。","<b>U動詞「待つ」的現在式短形否定怎麼變化？</b><br><br><ruby>待<rt>ま</rt></ruby>つ（matsu，辭書形，等待）→ <ruby>待<rt>ま</rt></ruby>たない（matanai，短形否定，不等）<br><br>文法說明：「待つ」字尾是「つ（tsu）」，同樣是U動詞，把字尾母音「u」去掉改成「a」再加「ない」，即「つ（tsu）→た（ta）+ない」，變成「待たない（matanai）」。","<b>不規則動詞「する」的現在式短形否定是什麼？</b><br><br>する（suru，辭書形，做）→ しない（shinai，短形否定，不做）<br><br>文法說明：「する」是日文兩個不規則動詞之一，不套用Ru動詞或U動詞的規則，短形否定直接死記為「しない」。","<b>不規則動詞「来る」的現在式短形否定是什麼？為什麼要特別注意？</b><br><br><ruby>来<rt>く</rt></ruby>る（kuru，辭書形，來）→ <ruby>来<rt>こ</rt></ruby>ない（konai，短形否定，不來）<br><br>文法說明：「来る」是另一個不規則動詞，短形否定時「来」的讀音會從「く（ku）」變成「こ（ko）」，也就是母音跟著改變（く→こ），這點跟規則變化的Ru動詞、U動詞都不同，需要特別記住。","<b>動詞現在式短形否定還有什麼特殊例外？字尾是「う」的動詞為什麼是「わない」而不是「あない」？</b><br><br><ruby>買<rt>か</rt></ruby>う（kau，辭書形，買）→ <ruby>買<rt>か</rt></ruby>わない（kawanai，短形否定，不買）<br><br>文法說明：依照一般U動詞規則，字尾「う（u）」去掉母音u該加上「あ（a）+ない」，但字尾本身就是假名「う」的動詞例外，是加上「わ（wa）+ない」而不是「あ（a）+ない」，所以是「買わない（kawanai）」，不是「買あない」。","<b>「ある」（表示無生命物存在）的現在式短形否定為什麼特別？</b><br><br>ある（aru，辭書形，有／存在）→ ない（nai，短形否定，沒有）<br><br>文法說明：「ある」字尾是「る」，若照一般U動詞規則變化，短形否定應該是「あらない（aranai）」，但實際上「ある」的否定是不規則的「ない（nai）」，這是需要單獨記住的例外用法。","<b>例外規則</b>：字尾是「う」的動詞，短形否定加「わない」而不是「あない」（例：<ruby>買<rt>か</rt></ruby>う→<ruby>買<rt>か</rt></ruby>わない）；「ある」的短形否定不規則地變成「ない」（不是「あらない」）。"],example:[{en:null,jp:"読む（よむ / yomu，讀，U動詞）→ 長形否定：<ruby>読<rt>よ</rt></ruby>みません（yomimasen）→ 短形否定：<ruby>読<rt>よ</rt></ruby>まない（yomanai，不讀）",zh:null},{en:"This house is not small",jp:"**日文短形否定怎麼說「這間房子不小」？**",zh:"這間房子不小。"},{en:"The library is not quiet.",jp:"**日文短形否定怎麼說「圖書館不安靜」？**",zh:"圖書館不安靜。"},{en:"I am not a student.",jp:"**日文短形否定怎麼說「我不是學生」？**",zh:"我不是學生。"},{en:"I don't eat steaks.",jp:"**日文短形否定怎麼說「我不吃牛排」？**",zh:"我不吃牛排。"},{en:"I don't drink beer.",jp:"**日文短形否定怎麼說「我不喝啤酒」？**",zh:"我不喝啤酒。"},{en:"I don't study tonight.",jp:"**日文短形否定怎麼說「我今晚不唸書」？**",zh:"我今晚不唸書。"},{en:null,jp:"かわいくないです→かわいくない；静か（しずか）じゃないです→静か（しずか）じゃない；<ruby>学生<rt>がくせい</rt></ruby>じゃないです→<ruby>学生<rt>がくせい</rt></ruby>じゃない",zh:null}]},{num:117,title:"Usage of short forms 1 - Quotation",vocab:[],grammar:["常體短形除了本身可以當作句子的結尾之外，還有另外四種特別的用法：(1) 引用「某人説…」、「我覺得…」；(2) 用在朋友間輕鬆的對話中，表示親密感；(3) 用於委婉的否定請求（「請不要…」）；(4) 用於表達喜好或擅長（「我喜歡做…」、「我擅長做…」）。本章只介紹第一種用法：引用。","<b>常體短形要怎麼用來「引用」某人說的話或自己的想法？</b><br><br>引用別人説的話或自己的想法時，要用「以常體短形結尾的子句」加上「と<ruby>言<rt>い</rt></ruby>っていました。」（他/她説過…）或「と<ruby>思<rt>おも</rt></ruby>います。」（我覺得…）。<br><br>～常體短形＋と<ruby>言<rt>い</rt></ruby>っていました。(to itteimashita) → 某人説了…<br>～常體短形＋と<ruby>思<rt>おも</rt></ruby>います。(to omoimasu) → 我覺得…<br><br>文法說明：「と」是引用助詞，相當於英文間接引語中的 that，也相當於直接引語中的引號「\"\"」。無論是引用別人説的話，還是表達自己的想法，前面接的子句一定要用常體短形結尾，不能用敬體（ます/です）結尾。","<b>用「思う」表達否定的想法時，為什麼日文比較常説「～ないと思います」而不是「～と思いません」？</b><br><br>日文中要表達「我覺得不是這樣」時，比起把「思います」本身變成否定形「思いません」，更常見的説法是把前面的常體子句變成否定形，再接肯定的「と思います」，也就是「常體否定形＋と思います」（～ないと思います）比「常體肯定形＋と思いません」（～とおもいません）更自然、更常用。","<b>總結：引用文法的兩個核心句型是什麼？</b><br><br>(1) 引用別人説的話：常體短形＋と<ruby>言<rt>い</rt></ruby>っていました。(Someone said that...)<br>(2) 表達自己的想法：常體短形＋と<ruby>思<rt>おも</rt></ruby>います。(I think that...)<br><br>兩者前面接的子句都必須以常體短形結尾，不能用敬體（です/ます）結尾；要表達否定的想法時，通常把否定放在前面的子句中（～ないと思います），而不是把「思う」本身變成否定形（～と思いません），這樣聽起來比較自然。"],example:[{en:"Mary said that there would be an exam tomorrow.",jp:"**如何用「引用」文法說出「Mary 説明天有考試」？**",zh:null},{en:"Takeshi said that he will watch a movie tonight.",jp:"**如何用「引用」文法說出「Takeshi 説他今晚要看電影」？**",zh:null},{en:"I think Takeshi likes Mary.",jp:"**如何用「引用」文法表達「我覺得 Takeshi 喜歡 Mary」？**",zh:null},{en:"I think Takeshi does not like Mary.",jp:"**如何用「引用」文法表達「我覺得 Takeshi 不喜歡 Mary」？**",zh:null},{en:"I think Mary often cooks.",jp:"**練習1：「我覺得 Mary 常常做菜」的日文怎麼説？**",zh:null},{en:"I think Satoshi is not a student.",jp:"**練習2：「我覺得 Satoshi 不是學生」的日文怎麼説？**",zh:null},{en:"Nana said she will go to Japan.",jp:"**練習3：「Nana 説她要去日本」的日文怎麼説？**",zh:null}]},{num:118,title:"Usage of short forms 2 - Casual conversation",vocab:[{t:"今日（きょう / kyou）",m:"Today（今天）"},{t:"ケーキ（けーき / ke-ki）",m:"Cake（蛋糕）"},{t:"美味しい（おいしい / oishii）",m:"Delicious（好吃、美味）"}],grammar:["<b>文法：常體短形（short forms）總共有哪4種用法？這一課要學哪一種？</b><br><br>常體短形總共有以下四種用法：<br>(1) 用在轉述、引用別人説的話中（例如「我覺得...」「她説...」）<br>(2) 用在朋友間的輕鬆對話中，作為親密感的表現<br>(3) 用在否定的請求中（例如「請不要...」）<br>(4) 用在表達想法時（例如「我喜歡做...」或「我擅長做...」）<br><br>這一課要學的是第 (2) 種用法：朋友之間輕鬆對話時，常體短形的使用方式。","<b>文法：在朋友間輕鬆對話時，為什麼要用常體短形？用敬體（長形）又會給人什麼感覺？</b><br><br>關係親近的兩個人說話時，句尾會使用常體短形，作為表示親密感的方式；相反地，如果使用敬體（長形），則暗示說話者想要「保持一定的距離」。","<b>文法：日常輕鬆對話中使用常體短形時，有哪三個具體規則？</b><br><br>日常對話中使用常體短形時，有以下三個規則：<br>・疑問句不會用疑問助詞「か」結尾，而是單純靠上升語調來表達疑問。<br>・な形容詞、以及「名詞＋です」句型中的「だ」結尾，通常會被省略。<br>・回答用語也不同：用「うん」表示「對/是」，用「ううん」表示「不對/不是」。","<b>勉強する（べんきょうする / benkyousuru）</b><br><br>To study（唸書、學習）","<b>警察官（けいさつかん / keisatsukan）</b><br><br>Police officer（警察）","<b>總結：這一課學到常體短形在朋友間輕鬆對話中的哪些重點？</b><br><br>・疑問句省略「か」，只靠上升語調表示疑問（例如：<ruby>食<rt>た</rt></ruby>べる?／<ruby>勉強<rt>べんきょう</rt></ruby>する?）<br>・な形容詞、以及「名詞＋です」句型中的「だ」結尾通常省略（例如：<ruby>警察官<rt>けいさつかん</rt></ruby>じゃない。）<br>・肯定回答用「うん」，否定回答用「ううん」，取代敬體的「はい」「いいえ」。<br><br>---"],example:[{en:"Do you often eat fish?",jp:"**請比較：「你常常吃魚嗎？」這句話的敬體與常體怎麼說？**",zh:"你常常吃魚嗎？"},{en:"Yes, I do.",jp:"**請比較：回答「常常吃魚」時，敬體與常體怎麼說？**",zh:"是的，我常常吃。"},{en:"No, I don't.",jp:"**請比較：回答「不常吃魚」時，敬體與常體怎麼說？**",zh:"不，我不常吃。"},{en:"Do you study today?",jp:"**請翻譯並說明：「<ruby>今日<rt>きょう</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>する？」這句常體短形問句怎麼用？**",zh:"你今天要唸書嗎？"},{en:"Yes, I do.",jp:"**請翻譯並說明：回答「有，我今天要唸書」的常體短形怎麼說？**",zh:"嗯，我要唸書。"},{en:"No, I don't.",jp:"**請翻譯並說明：回答「沒有，我今天不唸書」的常體短形怎麼說？**",zh:"不，我不唸書。"},{en:"Is your father a police officer?",jp:"**請翻譯並說明：「あなたのお父さんは警察官？」這句常體短形問句怎麼用？**",zh:"你爸爸是警察嗎？"},{en:"Yes, he is a police officer.",jp:"**請翻譯並說明：回答「是的，我爸爸是警察」的常體短形怎麼說？**",zh:"嗯，是警察。"},{en:"No, he is not a police officer.",jp:"**請翻譯並說明：回答「不是，我爸爸不是警察」的常體短形怎麼說？**",zh:"不，不是警察。"},{en:"Is this cake delicious?",jp:"**請翻譯並說明：「このケーキ、美味しい？」這句常體短形問句怎麼用？**",zh:"這個蛋糕好吃嗎？"},{en:"Yes, it is delicious.",jp:"**請翻譯並說明：回答「好吃」的常體短形怎麼說？**",zh:"嗯，好吃。"},{en:"No, it is not delicious.",jp:"**請翻譯並說明：回答「不好吃」的常體短形怎麼說？**",zh:"不，不好吃。"}]},{num:119,title:"Usage of short forms 3 - Please don't do",vocab:[],grammar:["常體短形（short form）常見有4種用法：(1) 用在引述、轉述他人說的話或想法（quoted speech，例如「我覺得…」「她說…」）；(2) 用在輕鬆、隨意的對話中，作為關係親近的象徵；(3) 用來表達「請不要做…」的否定請求；(4) 用來表達想法，例如「我喜歡做…」或「我擅長做…」。本課要學的是第(3)種用法。","<b>文法：想請對方「不要做某件事」時，日文要怎麼表達？</b><br><br>當你想要求對方「不要做某件事」時，可以用動詞常體否定短形（ない形）加上「でください」來表達，句型是「Negative short form（ない形）＋でください」。でください原本是「請…」的禮貌用語，前面接動詞的ない形（否定短形）時，整體就變成「請不要做…」的否定請求。","<b>總結：本課學到的「請不要做…」句型是什麼？</b><br><br>不管動詞是る動詞、う動詞、する動詞還是不規則動詞，只要先把該動詞變成常體否定短形（ない形），再加上「でください」，就能表達「請不要做…」的否定請求：<br><br>Negative short form（ない形）＋でください ＝ 請不要做…"],example:[{en:"Please do not take pictures here.",jp:"**「請不要在這裡拍照」的日文怎麼說？**",zh:"中文翻譯：請不要在這裡拍照。"},{en:"Please do not eat.",jp:"**「請不要吃」的日文怎麼說？**",zh:"中文翻譯：請不要吃。"},{en:"Please do not watch.",jp:"**「請不要看」的日文怎麼說？**",zh:"中文翻譯：請不要看。"},{en:"Please do not run",jp:"**「請不要跑」的日文怎麼說？**",zh:"中文翻譯：請不要跑。"},{en:"Please do not drive",jp:"**「請不要開車」的日文怎麼說？**",zh:"中文翻譯：請不要開車。"},{en:"Please do not come",jp:"**「請不要來」的日文怎麼說？**",zh:"中文翻譯：請不要來。"},{en:"Please do not run in the house.",jp:"**「請不要在家裡跑步」的日文怎麼說？**",zh:"中文翻譯：請不要在家裡跑步。"},{en:"Please do not eat in the library.",jp:"**「請不要在圖書館裡吃東西」的日文怎麼說？**",zh:"中文翻譯：請不要在圖書館裡吃東西。"},{en:"Please do not drive my car.",jp:"**「請不要開我的車」的日文怎麼說？**",zh:"中文翻譯：請不要開我的車。"},{en:"Please do not come to the party.",jp:"**「請不要來派對」的日文怎麼說？**",zh:"中文翻譯：請不要來派對。"}]},{num:120,title:"Usage of short forms 4 - I like doing",vocab:[],grammar:["常体短形（普通形）一共有 4 種常見用法：(1) 表示轉述、引用別人說的話或自己的想法（「我覺得…」「她說…」）；(2) 用在關係親密的朋友之間的輕鬆對話；(3) 用來表達否定的請求（「請不要…」）；(4) 用來表達「我喜歡做…」「我擅長做…」這一類把動作當作名詞來談論的句子。本課只講第 (4) 種用法。","<b>動詞的常体（辞書形）要怎麼變成名詞，放進「〜が好きです」這種句型裡？</b><br><br>短形（常体）常用在「把動詞、形容詞當作名詞使用」的句子構造裡。例如わたしは〜が<ruby>好<rt>す</rt></ruby>きです／<ruby>嫌<rt>きら</rt></ruby>いです，除了可以像「わたしは<ruby>猫<rt>ねこ</rt></ruby>が好きです」一樣直接接名詞，也可以把游泳、喝咖啡、讀日文這一類「動作」放進同一個句型裡，只是動作必須先用動詞辞書形（常体・短形）＋の把它名詞化。完整句型為：<br><br>（人）は［動作：動詞辞書形］のが　<ruby>好<rt>す</rt></ruby>きです。／<ruby>嫌<rt>きら</rt></ruby>いです。／<ruby>上手<rt>じょうず</rt></ruby>です。／<ruby>下手<rt>へた</rt></ruby>です。<br>（(hito) wa [doushi jishokei] noga sukidesu / kiraidesu / jouzudesu / hetadesu.）<br><br>文法說明：のが的の是形式名詞，功能是把前面的動詞辞書形子句（例如「<ruby>泳<rt>およ</rt></ruby>ぐ」「コーヒーを<ruby>飲<rt>の</rt></ruby>む」）整個變成一個名詞子句，のが之後再接好き、嫌い、上手、下手等表示喜好或拿手程度的形容動詞。","<b>為什麼「たけしはえいごをはなしてがへたです」是錯的？のが前面應該接動詞的什麼形？</b><br><br>日文學習者很容易被英文的 -ing 形式和日文〜ている的關聯性誤導，錯把て形放進のが的前面。但のが前面一定要接動詞辞書形（原形／短形），不能用て形。<br><br>✕ たけしはえいごをはなしてがへたです。<br>○ たけしはえいごをはなすのがへたです。<br>（takeshi wa eigo o hanasu noga hetadesu.）<br><br>中譯：武志不擅長說英文。<br><br>文法說明：はなして是て形，只能用在「ている」（正在做）或「て請求」等句型；要把「說英文」這個動作名詞化放進のが前面，必須用辞書形はなす，寫成はなすのが，不能寫成はなしてが。","<b>要形容「自己」拿不拿手，跟形容「別人」拿不拿手，日文用字有什麼不同？</b><br><br>除了好き／嫌い之外，日文形容拿手程度時，還有另一組常用說法，而且依談論對象（自己 vs 別人）用字不同：<br><br>［談論自己時］<br>〜が<ruby>得意<rt>とくい</rt></ruby>です。（對…有自信、擅長…）<br>〜が<ruby>苦手<rt>にがて</rt></ruby>です。（對…沒把握、不擅長…）<br><br>［談論別人時］<br>〜が<ruby>上手<rt>じょうず</rt></ruby>です。（…很會…、擅長…）<br>〜が<ruby>下手<rt>へた</rt></ruby>です。（…不擅長…、…做得不好）<br><br>文法說明：得意／苦手主要用在描述「自己」的拿手與不拿手，語感偏向主觀的自信程度；上手／下手則常用來客觀評價「別人」的技能表現好壞（雖然上手／下手偶爾也可用於自己，但本課的分類原則以此為主）。","<b>總結：常体短形第 4 種用法「〜のが好き／嫌い／上手／下手／得意／苦手です」的整理</b><br><br>（人）は［動作：動詞辞書形］のが　<ruby>好<rt>す</rt></ruby>きです。／<ruby>嫌<rt>きら</rt></ruby>いです。／<ruby>上手<rt>じょうず</rt></ruby>です。／<ruby>下手<rt>へた</rt></ruby>です。<br>（(hito) wa [doushi jishokei] noga sukidesu / kiraidesu / jouzudesu / hetadesu.）<br><br>［談論自己時］〜が<ruby>得意<rt>とくい</rt></ruby>です（擅長、有自信）／〜が<ruby>苦手<rt>にがて</rt></ruby>です（不擅長、沒把握）<br>［談論別人時］〜が<ruby>上手<rt>じょうず</rt></ruby>です（擅長、做得好）／〜が<ruby>下手<rt>へた</rt></ruby>です（不擅長、做得不好）<br><br>文法說明：不管接的是好き／嫌いです還是得意／苦手／上手／下手です，のが前面一律只能用動詞辞書形（常体・短形），絕對不能用て形；談論自己的拿手程度慣用得意／苦手，談論別人則慣用上手／下手，這是這一課最容易混淆、也最需要記住的兩個重點。"],example:[{en:"I like studying Japanese.",jp:"**日本語を勉強するのが好きです。這句話的中文意思是什麼？用了什麼文法？**",zh:"中譯：我喜歡讀（學）日文。"},{en:"I do not like cleaning my room.",jp:"**部屋を掃除するのがきらいです。這句話怎麼用短形表達「不喜歡打掃房間」？**",zh:"中譯：我不喜歡打掃房間。"},{en:"Robert is good at cooking.",jp:"**ロバートは料理するのが上手です。這句話要怎麼理解？**",zh:"中譯：羅伯特很會做菜（擅長做菜）。"},{en:"Takeshi is not good at speaking English.",jp:"**たけしは英語を話すのが下手です。是什麼意思？**",zh:"中譯：武志不擅長說英文。"},{en:"I am good at speaking English.",jp:"**わたしは英語を話すのが得意です。跟上一句用「たけし」的句子，為什麼一個用得意、一個用下手？**",zh:"中譯：我擅長說英文（對說英文很有自信）。"},{en:"Marie is good at cooking Spanish food",jp:"**（Practice 1）マリーはスペイン料理を作るのが上手です。這句練習題要怎麼組出來？**",zh:"中譯：瑪莉很會做西班牙菜。"},{en:"I like playing basketball",jp:"**（Practice 2）バスケットボールをするのが好きです。這句怎麼組出來？**",zh:"中譯：我喜歡打籃球。"},{en:"I am good at(comfortable with) painting pictures.",jp:"**（Practice 3）絵を描くのが得意です。這句在說什麼？**",zh:"中譯：我擅長畫畫（對畫畫很有自信）。"},{en:"My younger sister is bad at dancing.",jp:"**（Practice 4）私の妹は踊るのが下手です。這句怎麼組出來？**",zh:"中譯：我妹妹不擅長跳舞。"},{en:"Misa dislikes studying math.",jp:"**（Practice 5）みさは数学を勉強するのが嫌いです。這句是什麼意思？**",zh:"中譯：美沙討厭讀數學。"},{en:"I am uncomfortable with taking photos",jp:"**（Practice 6）写真を撮るのが苦手です。這句要怎麼組出來？**",zh:"中譯：我不擅長拍照（對拍照沒有自信）。"}]},{num:124,title:"Past tense short forms - Affirmative Conjugation",vocab:[{t:"總結：本課三大類過去式肯定短形規則整理",m:"- Group A（動詞）：把て形中的て/で換成た/だ。例：読んで(yonde) → 読んだ(yonda) - Group B（い形容詞）：把字尾い換成かった。例：かわいい(kawaii) → かわいかった(kawaikatta) - Group C（な形容詞、名詞+です）：把だ換成だった。例：静かだ(shizukada) → 静かだった(shizukadatta) 以上三種規則都只適用於「過去式"}],grammar:["<b>日文的過去式肯定短形（普通形）依詞性可以分成哪三大類？</b><br><br>依照詞性不同，過去式肯定短形（常體）的變化規則可以分成三大類：<br><br>- (A) 動詞：把て形（て/で）換成た/だ。例：<ruby>読<rt>よ</rt></ruby>んで(yonde) → <ruby>読<rt>よ</rt></ruby>んだ(yonda)<br>- (B) い形容詞：把字尾的い換成かった。例：かわい(kawai)い → かわいかった(kawaikatta)<br>- (C) な形容詞、以及「名詞＋です」：把だ換成だった。例：しずかだ(shizukada) → しずかだった(shizukadatta)、<ruby>学生<rt>がくせい</rt></ruby>だ(gakusei da) → <ruby>学生<rt>がくせい</rt></ruby>だった(gakusei datta)","<b>動詞（Group A）的過去式肯定短形怎麼變化？る型動詞、う型動詞、不規則動詞都適用同一個規則嗎？</b><br><br>規則是：把動詞的て形中的て/で，換成た/だ（只有過去式肯定會這樣變化，先把動詞變成て形，再把て/で換成た/だ）。無論是る型動詞（如食べる）、う型動詞（如書く、会う），或是不規則動詞（如来る），只要先變成て形，都適用同一個「て/で→た/だ」規則，不需要另外分開記憶：<br><br>- <ruby>読<rt>よ</rt></ruby>む(yomu，唸/讀) → て形：<ruby>読<rt>よ</rt></ruby>んで(yonde) → 過去式短形：<ruby>読<rt>よ</rt></ruby>んだ(yonda)<br>- <ruby>食<rt>た</rt></ruby>べる(taberu，吃，る型動詞) → て形：<ruby>食<rt>た</rt></ruby>べて(tabete) → 過去式短形：<ruby>食<rt>た</rt></ruby>べた(tabeta)<br>- <ruby>書<rt>か</rt></ruby>く(kaku，寫，う型動詞) → て形：<ruby>書<rt>か</rt></ruby>いて(kaite) → 過去式短形：<ruby>書<rt>か</rt></ruby>いた(kaita)<br>- <ruby>会<rt>あ</rt></ruby>う(au，見面，う型動詞) → て形：<ruby>会<rt>あ</rt></ruby>って(atte) → 過去式短形：<ruby>会<rt>あ</rt></ruby>った(atta)<br>- <ruby>来<rt>く</rt></ruby>る(kuru，來，不規則動詞) → て形：<ruby>来<rt>き</rt></ruby>て(kite) → 過去式短形：<ruby>来<rt>き</rt></ruby>た(kita)","<b>い形容詞（Group B）的過去式肯定短形怎麼變化？</b><br><br>規則是：把い形容詞字尾的い去掉，換成かった。<br><br>- <ruby>可愛<rt>かわい</rt></ruby>い(kawaii，可愛的) → <ruby>可愛<rt>かわい</rt></ruby>かった(kawaikatta)<br>- <ruby>面白<rt>おもしろ</rt></ruby>い(omoshiroi，有趣的) → <ruby>面白<rt>おもしろ</rt></ruby>かった(omoshirokatta)<br>- <ruby>美味<rt>おい</rt></ruby>しい(oishii，好吃的) → <ruby>美味<rt>おい</rt></ruby>しかった(oishikatta)<br>- <ruby>怖<rt>こわ</rt></ruby>い(kowai，可怕的) → <ruby>怖<rt>こわ</rt></ruby>かった(kowakatta)","<b>な形容詞、以及「名詞＋です」（Group C）的過去式肯定短形怎麼變化？</b><br><br>規則是：把現在式短形字尾的だ，換成だった。<br><br>- <ruby>静<rt>しず</rt></ruby>かな(shizukana，安靜的) → 現在式短形：<ruby>静<rt>しず</rt></ruby>かだ(shizukada) → 過去式短形：<ruby>静<rt>しず</rt></ruby>かだった(shizukadatta)<br>- <ruby>綺麗<rt>きれい</rt></ruby>な(kireina，漂亮的/乾淨的) → 現在式短形：<ruby>綺麗<rt>きれい</rt></ruby>だ(kireida) → 過去式短形：<ruby>綺麗<rt>きれい</rt></ruby>だった(kireidatta)<br>- <ruby>学生<rt>がくせい</rt></ruby>です(gakuseidesu，是學生) → 現在式短形：<ruby>学生<rt>がくせい</rt></ruby>だ(gakuseida) → 過去式短形：<ruby>学生<rt>がくせい</rt></ruby>だった(gakuseidatta)<br>- <ruby>日本人<rt>にほんじん</rt></ruby>です(nihonjindesu，是日本人) → 現在式短形：<ruby>日本人<rt>にほんじん</rt></ruby>だ(nihonjinda) → 過去式短形：<ruby>日本人<rt>にほんじん</rt></ruby>だった(nihonjindatta)","<b>過去式肯定短形有哪些不規則（例外）變化，不能套用上面的規則？</b><br><br>有兩個常見的例外，要單獨背下來：<br><br>- <ruby>行<rt>い</rt></ruby>く(iku，去)：雖然是Group A的う型動詞，但過去式短形不是規則變化的「<ruby>行<rt>い</rt></ruby>いた」，<ruby>而是不規則的行<rt>い</rt></ruby>った(itta)。<br>- いい(ii，好的)：雖然是い形容詞，但過去式短形不是規則變化的「いかった」，而是不規則的よかった(yokatta)。"],example:[{en:"What is the past tense short form of ",jp:"**「<ruby>遊<rt>あそ</rt></ruby>ぶ（あそぶ - asobu，玩）」的過去式肯定短形是什麼？**",zh:null},{en:"What is the past tense short form of ",jp:"**「<ruby>暑<rt>あつ</rt></ruby>い（あつい - atsui，熱的）」的過去式肯定短形是什麼？**",zh:null},{en:"What is the past tense short form of ",jp:"**「<ruby>元気<rt>げんき</rt></ruby>な（げんきな - genkina，有精神的/健康的）」的過去式肯定短形是什麼？**",zh:null},{en:"What is the past tense short form of ",jp:"**「<ruby>会社員<rt>かいしゃいん</rt></ruby>です（かいしゃいんです - kaishaindesu，我是上班族）」的過去式肯定短形是什麼？**",zh:null},{en:"Was the movie fun?",jp:"**請翻譯這句話，並說明句型：「<ruby>映画<rt>えいが</rt></ruby>は<ruby>楽<rt>たの</rt></ruby>しかった？」**",zh:null},{en:"Yeah, the movie was fun.",jp:"**接著回答「うん、（<ruby>映画<rt>えいが</rt></ruby>は）<ruby>楽<rt>たの</rt></ruby>しかった。」是什麼意思？**",zh:null},{en:"No, the movie was boring.",jp:"**如果電影不好看，要怎麼用日文回答「ううん、（<ruby>映画<rt>えいが</rt></ruby>は）<ruby>退屈<rt>たいくつ</rt></ruby>だった。」？**",zh:"不，（電影）很無聊。"},{en:"What did you do yesterday?",jp:"**請翻譯這句話，並說明句型：「<ruby>昨日<rt>きのう</rt></ruby><ruby>何<rt>なに</rt></ruby>をした？」**",zh:"你昨天做了什麼？"},{en:"I went to the library.",jp:"**請翻譯這句話，並說明句型：「<ruby>私<rt>わたし</rt></ruby>は<ruby>図書館<rt>としょかん</rt></ruby>に<ruby>行<rt>い</rt></ruby>った。」**",zh:"我去了圖書館。"}]},{num:125,title:"Past tense short forms - Negative Conjugation",vocab:[],grammar:["<b>過去式否定短形（普通体）的變化規則是什麼？動詞、い形容詞、な形容詞、名詞＋です分別怎麼變？</b><br><br>這一課要學「過去式否定短形（常體）」，也就是不加です、更口語、非正式場合使用的過去否定說法。四種詞性的現在否定短形與過去否定短形對照如下：<br><br>| 詞性 | 現在否定短形 | 過去否定短形 |<br>|---|---|---|<br>| 動詞 | 読まない (yomanai) | 読まなかった (yomanakatta) |<br>| い形容詞 | 可愛くない (kawaikunai) | 可愛くなかった (kawaikunakatta) |<br>| な形容詞 | 静かじゃない (shizukajanai) | 静かじゃなかった (shizukajanakatta) |<br>| 名詞＋です | 学生じゃない (gakuseijanai) | 学生じゃなかった (gakuseijanakatta) |<br><br>說明：這四種詞性全部被歸類為「Group B」，共同規則是把現在否定短形字尾的「い」換成「かった」，例如「〜ない → 〜なかった」、「〜くない → 〜くなかった」、「〜じゃない → 〜じゃなかった」。","<b>日文文法「Group B - All Negative」的規則是什麼？</b><br><br>規則：把現在否定短形字尾的「い」換成「かった」（Replace the final い with かった）。<br><br>這個規則同時適用於動詞、い形容詞、な形容詞、名詞＋です這四種詞性的現在否定短形，因為它們的現在否定短形字尾都是「い」（例：読まない、可愛くない、静かじゃない、学生じゃない），只要把這個「い」換成「かった」，就能得到過去否定短形。","<b>動詞「食べる（たべる - taberu，吃）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：食べない（たべない / tabenai）  <br>過去否定短形：食べなかった（たべなかった / tabenakatta）－（過去）沒吃、不吃  <br>說明：「食べる」是Ru-verb，現在否定短形「食べない」字尾是い，屬於Group B規則，把「い」換成「かった」即得過去否定短形「食べなかった」。","<b>動詞「書く（かく - kaku，寫）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：書かない（かかない / kakanai）  <br>過去否定短形：書かなかった（かかなかった / kakanakatta）－（過去）沒寫、不寫  <br>說明：「書く」是U-verb，現在否定短形「書かない」字尾同樣是い，依Group B規則把「い」換成「かった」，得到過去否定短形「書かなかった」。","<b>動詞「会う（あう - au，見面）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：会わない（あわない / awanai）  <br>過去否定短形：会わなかった（あわなかった / awanakatta）－（過去）沒見面、沒有遇到  <br>說明：同樣依Group B規則，把現在否定短形「会わない」字尾的「い」換成「かった」，變成「会わなかった」。","<b>動詞「来る（くる - kuru，來）」是不規則動詞，過去式否定短形怎麼變化？</b><br><br>現在否定短形：来ない（こない / konai）  <br>過去否定短形：来なかった（こなかった / konakatta）－（過去）沒有來  <br>說明：「来る」雖然是不規則動詞（Irregular verb），現在否定短形變成「来ない」之後，過去否定短形的變化規則仍然一樣：把字尾「い」換成「かった」，即「来なかった」。","<b>い形容詞「可愛い（かわいい - kawaii，可愛的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：可愛くない（かわいくない / kawaikunai）  <br>過去否定短形：可愛くなかった（かわいくなかった / kawaikunakatta）－（過去）不可愛  <br>說明：い形容詞的現在否定短形字尾同樣是「い」（〜くない），依Group B規則把「い」換成「かった」，變成「〜くなかった」。","<b>い形容詞「面白い（おもしろい - omoshiroi，有趣的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：面白くない（おもしろくない / omoshirokunai）  <br>過去否定短形：面白くなかった（おもしろくなかった / omoshirokunakatta）－（過去）不有趣、不好笑  <br>說明：規則相同，把「面白くない」字尾的「い」換成「かった」，得到「面白くなかった」。","<b>い形容詞「美味しい（おいしい - oishii，好吃的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：美味しくない（おいしくない / oishikunai）  <br>過去否定短形：美味しくなかった（おいしくなかった / oishikunakatta）－（過去）不好吃  <br>說明：同樣把「美味しくない」字尾的「い」換成「かった」，得到「美味しくなかった」。","<b>い形容詞「怖い（こわい - kowai，可怕的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：怖くない（こわくない / kowakunai）  <br>過去否定短形：怖くなかった（こわくなかった / kowakunakatta）－（過去）不可怕  <br>說明：把「怖くない」字尾的「い」換成「かった」，變成「怖くなかった」。","<b>な形容詞「静かな（しずかな - shizukana，安靜的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：静かじゃない（しずかじゃない / shizukajanai）  <br>過去否定短形：静かじゃなかった（しずかじゃなかった / shizukajanakatta）－（過去）不安靜  <br>說明：な形容詞的現在否定短形字尾也是「い」（〜じゃない），依Group B規則把「い」換成「かった」，變成「〜じゃなかった」。","<b>な形容詞「綺麗な（きれいな - kireina，漂亮的、乾淨的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：綺麗じゃない（きれいじゃない / kireijanai）  <br>過去否定短形：綺麗じゃなかった（きれいじゃなかった / kireijanakatta）－（過去）不漂亮、不乾淨  <br>說明：把「綺麗じゃない」字尾的「い」換成「かった」，得到「綺麗じゃなかった」。","<b>な形容詞「元気な（げんきな - genkina，有精神的、健康的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：元気じゃない（げんきじゃない / genkijanai）  <br>過去否定短形：元気じゃなかった（げんきじゃなかった / genkijanakatta）－（過去）沒精神、不健康  <br>說明：把「元気じゃない」字尾的「い」換成「かった」，得到「元気じゃなかった」。","<b>名詞「学生です（がくせいです - gakuseidesu，是學生）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：学生じゃない（がくせいじゃない / gakuseijanai）  <br>過去否定短形：学生じゃなかった（がくせいじゃなかった / gakuseijanakatta）－（過去）不是學生  <br>說明：名詞＋です的現在否定短形字尾同樣是「い」（〜じゃない），依Group B規則把「い」換成「かった」，變成「〜じゃなかった」。","<b>名詞「日本人です（にほんじんです - nihonjindesu，是日本人）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：日本人じゃない（にほんじんじゃない / nihonjinjanai）  <br>過去否定短形：日本人じゃなかった（にほんじんじゃなかった / nihonjinjanakatta）－（過去）不是日本人  <br>說明：把「日本人じゃない」字尾的「い」換成「かった」，得到「日本人じゃなかった」。","<b>總結：這一課「過去否定短形（Group B）」的核心規則怎麼整理？</b><br><br>規則：把現在否定短形字尾的「い」換成「かった」（Group B - All Negative: Replace the final い with かった）。這個規則統一適用於動詞（〜ない→〜なかった）、い形容詞（〜くない→〜くなかった）、な形容詞（〜じゃない→〜じゃなかった）、名詞＋です（〜じゃない→〜じゃなかった），是本課的核心重點。"],example:[{en:"What is the past tense negative short form of ",jp:"**練習1：「遊ぶ（あそぶ - asobu，玩）」的過去式否定短形怎麼說？**",zh:"中文翻譯：（過去）沒有玩。"},{en:"What is the past tense negative short form of ",jp:"**練習2：「暑い（あつい - atsui，熱的）」的過去式否定短形怎麼說？**",zh:"中文翻譯：（過去）不熱。"},{en:"What is the past tense negative short form of ",jp:"**練習3：「元気な（げんきな - genkina，有精神的）」的過去式否定短形怎麼說？**",zh:"中文翻譯：（過去）沒精神、不健康。"},{en:"What is the past tense negative short form of ",jp:"**練習4：「会社員です（かいしゃいんです - kaishaindesu，是上班族）」的過去式否定短形怎麼說？**",zh:"中文翻譯：（過去）不是上班族。"},{en:"Yeah, the movie was not fun.",jp:"**日文怎麼說「Yeah, the movie was not fun.」？（用過去式否定短形回答）**",zh:"中文翻譯：不，電影不好看（不有趣）。"},{en:"I did not go to the library.",jp:"**日文怎麼說「I did not go to the library.」？（用過去式否定短形回答）**",zh:"中文翻譯：我沒有去圖書館。"}]},{num:126,title:"Past tense short forms - Usage",vocab:[],grammar:["本課接續常體（短形）的討論，說明過去式常體的三種變化規則（Group A/B/C），以及這些過去式常體實際上會在什麼場合被使用（轉述句、日常會話）。","<b>動詞的過去式肯定常體（Group A）怎麼變化？</b><br><br>規則：把て形／で形中的「て／で」換成「た／だ」。<br>＊這個規則只適用於「肯定」動詞──把動詞的「て形」轉換成「過去式肯定常體」。<br>例如「食べて」（て形）→「食べた」（過去式肯定常體），下面的例句會用到這個變化。","<b>い形容詞的過去式肯定、以及所有詞類的過去式否定（Group B）怎麼變化？</b><br><br>規則：把現在式常體字尾的「い」換成「かった」。<br>這一組規則同時涵蓋兩種情況：(1) い形容詞的過去式肯定、(2) 動詞・い形容詞・な形容詞・名詞所有詞類的過去式否定，因為這些常體的現在式字尾都是「〜ない」，只要把最後的「い」換成「かった」（變成「〜なかった」）即可。","<b>な形容詞的過去式肯定、以及「名詞+です」的過去式肯定（Group C）怎麼變化？</b><br><br>規則：把現在式常體中的「だ」換成「だった」。<br>也就是說，な形容詞或名詞句的現在式常體本來是「〜だ」，過去式常體就變成「〜だった」。","<b>總結：三組過去式常體變化規則，以及過去式常體的兩種用法</b><br><br>- Group A（動詞肯定）：て形／で形的「て／で」→「た／だ」（例：食べて→食べた、して→した）<br>- Group B（い形容詞肯定、所有詞類否定）：現在式常體字尾「い」→「かった」（例：〜ない→〜なかった）<br>- Group C（な形容詞肯定、名詞+です肯定）：現在式常體的「だ」→「だった」<br><br>過去式常體的用法和現在式常體一樣，主要出現在：(1) 轉述句／引用句中；(2) 朋友、家人之間的日常口語對話中。此外，轉述句要特別注意「時態保留原則」──引用部分的時態要跟對方原本說話時的時態一致，不會因為外層動詞（如「言っていました」）是過去式，就把引用內容也全部改成過去式。"],example:[{en:"Sue said that she had lunch.",jp:"**「Sue said that she had lunch.」的日文怎麼說？（轉述句中使用過去式常體）**",zh:"中譯：小蘇說她吃過午飯了。"},{en:"I think Tom did it.",jp:"**「I think Tom did it.」的日文怎麼說？（轉述／表達想法時使用過去式常體）**",zh:null},{en:"Have you eaten dinner?",jp:"**「Have you eaten dinner?」在日常會話中怎麼用日文問？**",zh:"中譯：晚飯，吃了嗎？"},{en:"Yeah, I have.",jp:"**「Yeah, I have.」（回答「吃了嗎？」）日文怎麼說？**",zh:"中譯：嗯，吃了。"},{en:"Sue said that she was studying Japanese.",jp:"**轉述句中，如果對方原話用的是現在式，轉述時日文的引用部分應該用現在式還是過去式？（以「Sue said that she was studying Japanese.」為例）**",zh:"中譯：小蘇說她（當時）正在學日文。"}]}],"advanced":[{num:130,title:"Something and Anything",vocab:[{t:"猫",m:"（ねこ - neko） Cat"},{t:"持ってくる",m:"（もってくる - mottekuru） To bring"},{t:"パーティーで 何も 食べませんでした。",m:"pa-ti- de nanimo tabemasendeshita."},{t:"<ruby>家<rt>いえ</rt></ruby>で 何か 食べます。",m:"ie de nanika tabemasu."}],grammar:["<b>日文的「Something」和「Anything」怎麼說？</b><br><br>Something = <b>何か</b>（なにか - nanika）  <br>Anything = <b>何も</b>（なにも - nanimo）","<b>何か／何も 這類字在句子中要如何使用？（跟は、が、を的關係）</b><br><br>這些字用在原本<b>預期會出現は、が、を等助詞</b>的位置。  <br>在這種情況下，它們<b>單獨使用，不需要助詞</b>。","<b>「some」和「any」在肯定句、疑問句、否定句中，日文各是怎麼說？</b><br><br><b>Positive statement</b>（肯定句）: Something → 何か（なにか - nanika）  <br><b>Question</b>（疑問句）: Anything? → 何か（なにか - nanika）  <br><b>Negative statement</b>（否定句）: Not...anything → 何も（なにも - nanimo）＋ Negative","<b><ruby>猫<rt>ねこ</rt></ruby>が <ruby>何<rt>なに</rt></ruby>か <ruby>持<rt>も</rt></ruby>ってきました。</b>  <br>neko ga nanika mottekimashita.<br><br>主語: 猫（貓）／ 助詞: が  <br>目的語: 何か（something，<b>不加助詞</b>）／ 動詞: 持ってきました（帶來-過去式）","<b><ruby>猫<rt>ねこ</rt></ruby>は <ruby>何<rt>なに</rt></ruby>か <ruby>食<rt>た</rt></ruby>べましたか？</b>  <br>neko wa nanika tabemashitaka?<br><br>主語: 猫（貓）／ 助詞: は  <br>目的語: 何か（anything，疑問句，<b>不加助詞</b>）／ 動詞: 食べましたか（吃-過去式疑問）","<b><ruby>猫<rt>ねこ</rt></ruby>は <ruby>何<rt>なに</rt></ruby>も <ruby>食<rt>た</rt></ruby>べませんでした。</b>  <br>neko wa nanimo tabemasendeshita.<br><br>主語: 猫（貓）／ 助詞: は  <br>目的語: 何も（anything，否定句，<b>不加助詞</b>）／ 動詞: 食べませんでした（吃-過去式否定）","**「Did you eat anything at the party?」的日文怎麼說？  <br>提示：食べる=to eat、パーティー=party、疑問句的anything=何か**","<b>パーティーで 何か 食べましたか？</b>  <br>pa-ti- de nanika tabemashitaka?<br><br>**「I did not eat anything at the party.」的日文怎麼說？  <br>提示：食べる=to eat、パーティー=party、否定句的anything=何も**","**「I will eat something at home.」的日文怎麼說？  <br>提示：食べる=to eat、家=home、肯定句的something=何か**","<b>總結：「some」和「any」在肯定句／疑問句／否定句中的日文對照，以及它們的助詞規則？</b><br><br><b>Positive statement</b>: 何か（なにか - nanika） = Something  <br><b>Question</b>: 何か（なにか - nanika） = Anything?  <br><b>Negative statement</b>: 何も（なにも - nanimo）＋ Negative = Not...anything<br><br>規則：<b>何か 和 何も 通常不接助詞</b>（usually not followed by a particle）。"],example:[{en:null,jp:"**翻譯並說明句子結構：「The cat has brought something.」**",zh:null},{en:null,jp:"**翻譯並說明句子結構：「Did the cat eat anything?」**",zh:null},{en:null,jp:"**翻譯並說明句子結構：「The cat did not eat anything.」**",zh:null}]},{num:131,title:"Some and Any for places, person and things",vocab:[{t:"Things（事物）",m:"肯定/疑問：何か（なにか, nanika） 否定：何も（なにも, nanimo）"},{t:"Places（地方）",m:"肯定/疑問：どこか（dokoka） 否定：どこも（dokomo）"},{t:"Person（人）",m:"肯定/疑問：誰か（だれか, dareka） 否定：誰も（だれも, daremo）"},{t:"總表：",m:"Things：何か（肯定/疑問）／何も（否定） Places：どこか（肯定/疑問）／どこも（否定） Person：誰か（肯定/疑問）／誰も（否定） （\\_\\_ 代表 に・へ・で 插入的位置）"}],grammar:["<b>日文中要表達「某事/某物」(something) 和「什麼事都不」(not...anything) 時，是怎麼構成的？</b><br><br>由疑問詞「何」（なに, nani）+ 助詞「か」(ka) 或「も」(mo) 組成：  <br>・「某事/某物」→ 何か（なにか, nanika）  <br>・「什麼都不」→ 何も（なにも, nanimo）<br><br>同樣的規則也適用於地方「どこ」和人「誰」。","<b><ruby>表示地方<rt>どこ</rt></ruby>、人(誰)、事物(何) 的 some/any 用法，在肯定句、疑問句、否定句中分別怎麼說？(不含其他助詞時)</b>","<b>「何か・どこか・誰か・何も・どこも・誰も」這些詞在句中出現時，原本該加的助詞「は、が、を」要怎麼處理？</b><br><br><b>不需要加</b>。這些詞本身就取代了「は、が、を」出現的位置，直接當作主語/受詞使用。","<b>如果句子需要用到「に、へ、で」這些助詞（例如地點、對象），要放在「どこか/誰か/何か」等詞的哪個位置？肯定句/疑問句和否定句的位置一樣嗎？</b><br><br>需要加「に、へ、で」，且肯定句/疑問句與否定句<b>位置不同</b>：  <br>・肯定句、疑問句：放在「か」<b>之後</b>（例：どこ<b>か</b>+<b>へ</b> → どこかへ）  <br>・否定句：放在「も」<b>之前</b>（例：どこ+<b>に</b>+<b>も</b> → どこにも）","<b>「你有去某個地方嗎？」(Did you go somewhere?) 日文怎麼說？</b><br><br>どこかへ行きましたか？  <br>（dokoka e ikimashita ka?）<br><br>＊「へ」是地點助詞，插入在「どこか」的「か」<b>之後</b>。","<b>「不，我沒有去任何地方。」(No, I did not go anywhere.) 日文怎麼說？</b><br><br>いいえ、どこにも行きませんでした。  <br>（iie, doko ni mo ikimasendeshita.）<br><br>＊「に」是地點助詞，插入在「どこ」和「も」<b>之間</b>（も之前）。","<b>「你有見到任何人嗎？」(Did you meet anyone?) 日文怎麼說？</b><br><br><ruby>誰<rt>だれ</rt></ruby>かに<ruby>会<rt>あ</rt></ruby>いましたか？  <br>（dareka ni aimashitaka?）<br><br>＊「に」是對象助詞，插入在「誰か」的「か」<b>之後</b>。  <br>＊固定用法：(某人)にあう＝跟(某人)見面","<b>「不，我沒有見到任何人。」(No, I did not meet anyone.) 日文怎麼說？</b><br><br>いいえ、<ruby>誰<rt>だれ</rt></ruby>にも<ruby>会<rt>あ</rt></ruby>いませんでした。  <br>（iie, dare ni mo aimasendeshita.）<br><br>＊「に」插入在「誰」和「も」之間。","<b>「你做了什麼事嗎？」(Did you do anything?) 日文怎麼說？</b><br><br><ruby>何<rt>なに</rt></ruby>かしましたか？  <br>（nanika shimashitaka?）<br><br>＊此句原本期待的助詞是「を」，所以<b>不需要另外加助詞</b>。","<b>「不，我什麼都沒做。」(No, I did not do anything.) 日文怎麼說？</b><br><br>いいえ、<ruby>何<rt>なに</rt></ruby>もしませんでした。  <br>（iie, nanimo shimasendeshita.）<br><br>＊原本期待的助詞是「を」，所以<b>不需要另外加助詞</b>。","**「你買了什麼東西嗎？」(Did you buy anything?) 日文怎麼說？  <br>（提示：買う - かう - to buy，過去、疑問句）**<br><br><ruby>何<rt>なに</rt></ruby>か<ruby>買<rt>か</rt></ruby>いましたか？  <br>（nanika kaimashitaka?）","**「不，我什麼都沒買。」(No, I did not buy anything.) 日文怎麼說？  <br>（提示：買う - かう - to buy，過去、否定句）**<br><br>いいえ、<ruby>何<rt>なに</rt></ruby>も<ruby>買<rt>か</rt></ruby>いませんでした。  <br>（iie, nanimo kaimasendeshita.）","**「你在活動上有見到什麼人嗎？」(Who did you meet at the event?) 日文怎麼說？  <br>（提示：会う - あう - to meet，過去、疑問句）**<br><br>イベントで<ruby>誰<rt>だれ</rt></ruby>かに<ruby>会<rt>あ</rt></ruby>いましたか？  <br>（ibento de dareka ni aimashitaka?）","**「我沒有見到任何人。」(I did not meet anybody.) 日文怎麼說？  <br>（提示：会う - あう - to meet，過去、否定句）**<br><br><ruby>誰<rt>だれ</rt></ruby>にも<ruby>会<rt>あ</rt></ruby>いませんでした。  <br>（dare ni mo aimasendeshita.）","**「你上週末有去什麼地方嗎？」(Did you go anywhere last weekend?) 日文怎麼說？  <br>（提示：行く - いく - to go，先週末 - せんしゅうまつ - last weekend，過去、疑問句）**<br><br><ruby>先週末<rt>せんしゅうまつ</rt></ruby>どこかに<ruby>行<rt>い</rt></ruby>きましたか？  <br>（senshuumatsu dokoka ni ikimashitaka?）","**「我沒有去任何地方。」(I did not go anywhere.) 日文怎麼說？  <br>（提示：行く - いく - to go，過去、否定句）**<br><br>どこにも<ruby>行<rt>い</rt></ruby>きませんでした。  <br>（dokoni mo ikimasendeshita.）"],example:[]},{num:143,title:"Because 1 〜から",vocab:[{t:"今晩（こんばん / konban）",m:"This evening, Tonight（今晚）"},{t:"タクシー（たくしー / takushi-）",m:"Taxi（計程車）"},{t:"高い（たかい / takai）",m:"Expensive（貴的）"},{t:"遠い（とおい / tooi）",m:"Far away（遙遠）"},{t:"病気（びょうき / byouki）",m:"Sick（生病）"}],grammar:["<b>文法：「〜から」是什麼意思？什麼時候使用？</b><br><br>「から」(kara) 是接在句尾的助詞，意思是「因為」(because)。一個句子以「から」結尾時，用來說明某個情況、提議等背後的原因或理由。","<b>文法：用「から」造句時，有哪兩種語序可以選擇？</b><br><br>兩種語序都可以，意思相同：<br><br>(situation)。(explanation)から。  <br>或  <br>(explanation)から、(situation)。<br><br>也就是說，可以先講「情況/提議」，再另外用一句「原因＋から」補充說明；也可以反過來，先講「原因＋から」，再接「情況/提議」。","<b>造句的具體步驟有哪三步？</b><br><br>Step 1：找出句子裡的「情況/提議」與「原因」分別是什麼。  <br>Step 2：把「情況/提議」與「原因」分別造成完整的句子。  <br>Step 3：依照下面其中一種句子結構組合起來：<br><br>(situation)。(explanation)から。  <br>或  <br>(explanation)から、(situation)。","<b>總結：兩種語序在「句子數量」上有什麼不同？</b><br><br>雖然兩種語序表達的意思相同，但在句子結構上有差別：<br><br>(situation)。(explanation)から。→ 這是<b>兩個句子</b>（情況與原因分別獨立成句，中間用句點隔開）。<br><br>(explanation)から、(situation)。→ 這是<b>一個句子</b>（原因與情況用逗號連接在同一句話裡）。<br><br>造句時只要先找出「情況/提議」與「原因」，分別造出完整句子，再依照上面其中一種結構組合即可。"],example:[{en:"I will study this evening, (Because) we will have an exam tomorrow.",jp:"**請翻譯並說明句型：「<ruby>今晩<rt>こんばん</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>します。<ruby>明日<rt>あした</rt></ruby>テスト（てすと）がありますから。」**",zh:"我今晚會唸書。因為明天有考試。"},{en:"I will study this evening, (Because) we will have an exam tomorrow.",jp:"**請翻譯並說明句型：「<ruby>明日<rt>あした</rt></ruby>テスト（てすと）がありますから、<ruby>今晩<rt>こんばん</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>します。」**",zh:"因為明天有考試，所以我今晚會唸書。"},{en:"Let's go by bus. (Because) taxis are expensive.",jp:"**請翻譯並說明句型：「バス（ばす）に<ruby>乗<rt>の</rt></ruby>りましょう。タクシー（たくしー）は<ruby>高<rt>たか</rt></ruby>いですから。」**",zh:"我們搭巴士吧。因為計程車很貴。"},{en:"Let's go by bus. (Because) taxis are expensive.",jp:"**請翻譯並說明句型：「タクシー（たくしー）は<ruby>高<rt>たか</rt></ruby>いですから、バス（ばす）に<ruby>乗<rt>の</rt></ruby>りましょう。」**",zh:"因為計程車很貴，我們搭巴士吧。"},{en:"May I come to your house? Because my house is far away.",jp:"**請翻譯並說明句型：「あなたの<ruby>家<rt>いえ</rt></ruby>に<ruby>来<rt>き</rt></ruby>てもいいですか？<ruby>私<rt>わたし</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>は<ruby>遠<rt>とお</rt></ruby>いですから。」**",zh:"我可以去你家嗎？因為我家很遠。"},{en:"May I come to your house? Because my house is far away.",jp:"**請翻譯並說明句型：「<ruby>私<rt>わたし</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>は<ruby>遠<rt>とお</rt></ruby>いですから、あなたの<ruby>家<rt>いえ</rt></ruby>に<ruby>来<rt>き</rt></ruby>てもいいですか？」**",zh:"因為我家很遠，我可以去你家嗎？"},{en:"Takeshi did not come to school today because he was sick.",jp:"**請翻譯並說明句型：「たけしは<ruby>学校<rt>がっこう</rt></ruby>に<ruby>来<rt>き</rt></ruby>ませんでした。たけしは<ruby>病気<rt>びょうき</rt></ruby>でしたから。」**",zh:"武志今天沒有來學校。因為他生病了。"},{en:"Takeshi did not come to school today because he was sick.",jp:"**請翻譯並說明句型：「たけしは<ruby>病気<rt>びょうき</rt></ruby>でしたから、たけしは<ruby>学校<rt>がっこう</rt></ruby>に<ruby>来<rt>き</rt></ruby>ませんでした。」**",zh:"因為他生病了，武志今天沒有來學校。"}]},{num:144,title:"Because 2 〜ので",vocab:[{t:"「〜ので」的基本句型公式是什麼？",m:"(理由)ので、(狀況)。 理由的部分要用短形（普通形）來接續。"},{t:"買う（かう / kau）",m:"To buy（買）"},{t:"カバン（かばん / kaban）",m:"Bag（包包）"},{t:"安い（やすい / yasui）",m:"Cheap（便宜）"},{t:"人気な（にんきな / ninkina）",m:"Popular（受歡迎）"},{t:"来る（くる / kuru）",m:"To come（來）"},{t:"行く（いく / iku）",m:"To go（去）"},{t:"学校（がっこう / gakkou）",m:"School（學校）"},{t:"病気な（びょうきな / byoukina）",m:"Sick（生病）"},{t:"「一起做…吧」（邀約他人一起做某事）的句型怎麼接？",m:"動詞ます形的語幹＋ましょう，表示「一起做…吧」。"},{t:"「去做…」（為了某個目的而前往）的句型怎麼接？",m:"動詞ます形的語幹＋に行く，表示「去做…」。"},{t:"ケーキ（けーき / ke-ki）",m:"Cake（蛋糕）"},{t:"明日（あした / ashita）",m:"Tomorrow（明天）"},{t:"誕生日（たんじょうび / tanjoubi）",m:"Birthday（生日）"}],grammar:["<b>「〜ので」是什麼意思？跟「〜から」相比，語意和語氣上有什麼不同？</b><br><br>「〜ので」用來表示「因為（原因），所以（結果／狀況）」，也就是為句子後半部描述的狀況說明理由。  <br>在語意上，「ので」跟「から」完全相同；但在語氣上，「ので」聽起來比「から」稍微更正式、更委婉客氣。","<b>理由部分的句尾要用什麼形式？如果句尾是な形容詞或名詞的現在肯定形，需要特別注意什麼？</b><br><br>理由部分的句尾要用短形（普通形）。  <br>但如果ので前面接的是な形容詞或名詞的現在肯定形，就要在な形容詞（語幹）或名詞和ので之間加上一個「な」。","<b>當理由句尾是な形容詞或名詞的現在肯定形時，「〜ので」的句型公式該怎麼寫？</b><br><br>(理由：な形容詞語幹／名詞) な ので、(狀況)。","<b>親切な（しんせつな / shinsetsuna）</b><br><br>Kind（親切）","<b>「〜たい」（想要做…）要怎麼接續？它本身要當作哪一種詞類來活用？</b><br><br>「〜たい」接在動詞ます形的語幹後面，表示「想要做…」。  <br>「たい」本身要當作い形容詞來活用（例如過去肯定短形是「〜たかった」）。","<b>勉強する（べんきょうする / benkyousuru）</b><br><br>To study（讀書、學習）","<b>總結：「〜ので」一般版（動詞、い形容詞）的句型公式是什麼？</b><br><br>(理由)ので、(狀況)。<br><br>理由部分直接用動詞或い形容詞的短形（普通形），接ので即可，不需要加任何多餘的字。","<b>總結：當理由句尾是な形容詞或名詞的現在肯定形時，句型公式該怎麼調整？整體來說ので跟から的語氣差異是什麼？</b><br><br>當理由句尾是な形容詞（語幹）或名詞的現在肯定形時，要在中間加上「な」：  <br>(理由：な形容詞語幹／名詞) な ので、(狀況)。<br><br>整體來說，「ので」在語意上跟「から」完全相同，都表示「因為…」；但語氣上，「ので」聽起來比「から」更正式、更委婉客氣。"],example:[{en:"My Japanese has improved, because I always speak Japanese.",jp:"**請將「因為我總是用日文說話，所以我的日文變好了。」翻譯成日文，並說明ので前面接的動詞是什麼形式。**",zh:null},{en:"I did not sleep last night, because I had a lot of homework.",jp:"**請將「因為功課很多，我昨天晚上沒睡覺。」翻譯成日文，並說明ので前面用的是哪種時態的短形。**",zh:null},{en:"I do not like that person, because he is mean.",jp:"**請將「因為他很壞心眼，所以我討厭他。」翻譯成日文，並說明な形容詞在這裡要怎麼變化。**",zh:null},{en:"Banks are closed, because today is a Sunday.",jp:"**請將「因為今天是星期天，所以銀行公休。」翻譯成日文，並說明名詞在這裡要怎麼變化。**",zh:null},{en:"I will buy this bag because this is cheap.",jp:"**請將「因為這個包包很便宜，所以我要買。」翻譯成日文。**",zh:null},{en:"She is very popular because she is very kind.",jp:"**請將「因為她很親切，所以她非常受歡迎。」翻譯成日文。**",zh:null},{en:"I came to Japan because I wanted to study Japanese.",jp:"**請將「因為（那時）我想學日文，所以我來了日本。」翻譯成日文，並說明ので前面用的是哪種形式。**",zh:null},{en:"I did not go to school because I was sick.",jp:"**請將「因為（那時）我生病了，所以我沒去學校。」翻譯成日文。**",zh:null},{en:"Let's go buy a cake because tomorrow is Ken's birthday.",jp:"**請將「因為明天是小健的生日，我們去買蛋糕吧。」翻譯成日文，並說明ので前面的名詞要怎麼變化。**",zh:null}]},{num:146,title:"Comparison 1 - A is more (property) than B",vocab:[],grammar:["<b>「の」作為代名詞的用法是什麼？什麼時候可以使用？</b><br><br>當名詞出現在形容詞（或另一個名詞）後面，而且雙方都清楚在指同一個東西時，可以用代名詞「の」(no，意思接近「…的、…的東西」)取代該名詞，藉此避免重複。","<b>如果有人問：「これはスーのバッグですか？」（這是Sue的包包嗎？），要回答「不是，那是Mary的。」日文該怎麼說？</b><br><br>いいえ、それ　は　メアリー　の　です。  <br>(Iie, sore wa Mary no desu.)<br><br>「メアリーの」＝名詞「メアリー」＋の，代替「メアリーのバッグ」（Mary的包包），省略了重複的名詞「バッグ」。","<b>「我喜歡綠色的洋裝，但我也喜歡黃色的。」這一題會用到哪些單字？</b><br><br>- Green（綠色） - 緑（みどり / midori）<br>- Dress（洋裝） - ドレス（どれす / doresu）<br>- To like（喜歡） - <ruby>好<rt>す</rt></ruby>きな（すきな / sukina，な形容詞）<br>- Yellow（黄色） - 黄色（きいろ / kiiro）<br>- Too（也／都） - 用助詞「も」表示","<b>「紐約的房租比日本的（房租）貴。」這一題會用到哪些單字？</b><br><br>- Rent（房租） - 家賃（やちん / yachin）<br>- New York（紐約） - ニューヨーク（にゅーよーく / nyu-yo-ku）<br>- Expensive（貴的／高的） - <ruby>高<rt>たか</rt></ruby>い（たかい / takai）<br>- ＊這是一個比較句","<b>「因為這本字典舊了，我要買新的。」這一題會用到哪些單字？</b><br><br>- Because（因為） - 〜から（kara）<br>- Dictionary（字典） - 辞書（じしょ / jisho）<br>- Old（舊的） - <ruby>古<rt>ふる</rt></ruby>い（ふるい / furui）<br>- To buy（買） - <ruby>買<rt>か</rt></ruby>う（かう / kau）<br>- New（新的） - <ruby>新<rt>あたら</rt></ruby>しい（あたらしい / atarashii）","<b>「我的筆電比你的（筆電）慢。」這一題會用到哪些單字？</b><br><br>- My（我的） - <ruby>私<rt>わたし</rt></ruby>の（わたしの / watashi no）<br>- Laptop（筆電） - パソコン（ぱそこん / pasokon）<br>- Slow（慢的） - <ruby>遅<rt>おそ</rt></ruby>い（おそい / osoi）<br>- Your（你的） - あなたの（anatano）<br>- ＊這是一個比較句"],example:[{en:null,jp:"**い形容詞、な形容詞加名詞時，要如何用「の」簡化？**",zh:null},{en:"Noun1 の＿＿＿",jp:"**當句子中出現「名詞1の名詞2」這種結構、而名詞2重複時，要如何簡化？**",zh:null},{en:"I have a black sweater.",jp:"**請翻譯這句話，並說明句型：「<ruby>黒<rt>くろ</rt></ruby>いセーターを<ruby>持<rt>も</rt></ruby>っています。」**",zh:"我有一件黑色的毛衣。"},{en:"I have a red one, too.",jp:"**接著這句話「<ruby>赤<rt>あか</rt></ruby>いのも<ruby>持<rt>も</rt></ruby>っています。」是什麼意思？其中的「の」代替了什麼？**",zh:"我也有一件紅色的（毛衣）。"},{en:"I went to buy a dictionary.",jp:"**請翻譯這句話，並說明句型：「<ruby>安<rt>やす</rt></ruby>い<ruby>辞書<rt>じしょ</rt></ruby>を<ruby>買<rt>か</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きました。」**",zh:"我去買了便宜的字典。"},{en:"But there were no good ones.",jp:"**這句話的下一句「でもいいのがありませんでした。」是什麼意思？其中的「の」代替了什麼？**",zh:"但是沒有好的（字典）。"},{en:"American ice cream is more delicious than Japanese one.",jp:"**「Aのほうが Bより〜」是什麼句型？請翻譯例句：「アメリカのアイスクリームのほうが日本のよりおいしいです。」**",zh:"美國的冰淇淋比日本的（冰淇淋）好吃。"},{en:"I like the green dress.",jp:"**請用日文翻譯：「我喜歡綠色的洋裝。」**",zh:null},{en:"But I also like the yellow one too.",jp:"**接著要說「但我也喜歡黃色的。」日文怎麼說？其中的「の」代替了什麼？**",zh:null},{en:"The rent in New York is more expensive than the rent in Japan.",jp:"**請用日文翻譯：「紐約的房租比日本的（房租）貴。」**",zh:null},{en:"Because this dictionary is old, I will buy a new one.",jp:"**請用日文翻譯：「因為這本字典舊了，我要買新的。」**",zh:null},{en:"My laptop is slower than yours.",jp:"**請用日文翻譯：「我的筆電比你的（筆電）慢。」**",zh:null},{en:"Noun1 の＿＿＿",jp:"**總結：「の」代名詞的規則整理**",zh:null}]},{num:184,title:"〜なくちゃいけません",vocab:[{t:"辞める（やめる / yameru）",m:"To quit（辭去、辭掉）"},{t:"バイト（ばいと / baito）",m:"Part time job（兼職、打工）"}],grammar:["<b>練習する（れんしゅうする / renshuusuru）</b><br><br>To practice（練習）","<b>掃除する（そうじする / soujisuru）</b><br><br>To clean up（打掃、清掃）","<b>「なくちゃいけません」是什麼意思？可以拆解成哪兩部分？</b><br><br>「なくちゃいけません」表示「不得不做某事」、「必須做某事」(it is necessary to do something / \"must\")。  <br>可以拆解成兩部分：  <br>・なくちゃ：大略意思是「如果不做…的話」(if you don&#x27;t do...)  <br>・いけません：大略意思是「不能去」(you cannot go)","<b>為什麼「なくちゃいけません」字面上是雙重否定，卻能表達「必須」的意思？</b><br><br>「なくちゃいけません」字面上接近「不…就不行」、「不能不做…」(you cannot go not doing...)。這種雙重否定的說法，在邏輯上反而變成了肯定的「必須」語氣。","<b>要把一個句子改成「なくちゃいけません」（必須…）的說法，具體步驟是什麼？</b><br><br><b>步驟一</b>：先把句子改成該動詞的現在否定短形（ない形）。  <br><b>步驟二</b>：把句尾的「ない」替換成「なくちゃいけません」。","<b>「なくちゃいけません」依動詞種類會怎麼變化？請以食べる、言う、する、くる為例。</b><br><br>食べる（たべる - to eat）→ 食べない (tabenai) → 食べなくちゃいけません (tabenakuchaikemasen)  <br>言う（いう - to say）→ 言わない (iwanai) → 言わなくちゃいけません (iwanakuchaikemasen)  <br>する（to do）→ しない (shinai) → しなくちゃいけません (shinakuchaikemasen)  <br>くる（to come）→ こない (konai) → こなくちゃいけません (konakuchaikemasen)<br><br>注意：くる 是不規則動詞，其ない形要變成「こない」（並非「くない」），所以なくちゃいけません形也要對應改成「こなくちゃいけません」。","<b>「いけません」在文法上屬於什麼形式？這代表它可以怎麼繼續變化？</b><br><br>「いけません」在文法上其實是動詞的「現在否定禮貌長型」（相當於一般動詞的ません形）。因此，「なくちゃいけません」可以比照一般ません形繼續變化：  <br>・改成過去式，表示「（那時）不得不…」：<b>なくちゃいけませんでした</b>  <br>・改成短縮形（常體），用於較隨性的口語，或後面要接んです等文法時：<b>なくちゃいけない</b>","<b>總結：「なくちゃいけません」還可以怎麼變化時態與語氣？</b><br><br>「いけません」文法上其實是動詞的「現在否定禮貌長型」，所以可以比照一般ません形繼續變化：  <br>・過去式（表示「以前不得不」）：なくちゃいけません → <b>なくちゃいけませんでした</b>  <br>・口語短縮形（用於較隨性的對話，或後面要接んです等文法時）：なくちゃいけません → <b>なくちゃいけない</b>"],example:[{en:null,jp:"**請將「因為下週有考試，我必須用功讀書。」翻譯成日文。**",zh:null},{en:null,jp:"**請將「我今天早上不得不六點起床。」翻譯成日文。**",zh:null},{en:null,jp:"**請將「（老實說，）我每天都必須練習。」翻譯成日文，並說明句尾用的是哪種形式。**",zh:null},{en:null,jp:"**請將「因為明天有考試，我今晚必須讀書。」翻譯成日文。（提示：讀書＝勉強する、今晚＝今夜、考試＝テスト、明天＝明日、因為〜＝〜から，「有考試」要用Xがあります句型）**",zh:null},{en:null,jp:"**請將「因為學校變忙了，我必須辭掉打工。」翻譯成日文。（提示：辭職＝辞める、打工＝バイト、學校＝学校、忙碌＝忙しい，「學校變忙了」要用(形容詞)なる句型）**",zh:null},{en:null,jp:"**請將「我昨天不得不打掃家裡。」翻譯成日文。（提示：打掃＝掃除する、家＝家、昨天＝昨日，過去式）**",zh:null},{en:null,jp:"**請將「我昨晚不得不煮晚餐。」翻譯成日文。（提示：煮飯＝料理する、晚餐＝夜ご飯、昨晚＝昨晩，過去式）**",zh:null},{en:null,jp:"食べない → 食べなくちゃいけません（不得不吃）",zh:null}]},{num:186,title:"〜でしょう",vocab:[{t:"雨が降る（あめがふる）",m:"ame ga furu 意思：下雨 (To rain / It rains)"},{t:"興味がある（きょうみがある）",m:"kyoumi ga aru 意思：對…感興趣 (To be interested in something)"},{t:"分かる（わかる）",m:"wakaru 意思：懂、理解 (To understand)"}],grammar:["<b>文法：句尾表現「〜でしょう」是什麼意思？什麼時候使用？</b><br><br>「でしょう」是接在句尾的表現，意思是「大概…吧／可能…吧」，用在<b>做出推測或預測</b>的時候。","<b>文法：「でしょう」要接在什麼詞形後面？</b><br><br>でしょう 直接接在<b>動詞</b>與<b>い形容詞的普通形（短形）</b>後面，肯定、否定皆可。  <br>でしょう 也可以接在<b>な形容詞的語幹</b>與<b>名詞</b>後面。","<b>注意：</b>でしょう 是直接接在這些詞的後面，<b>不可以</b>多加「な」「の」「だ」，也就是沒有 〜なでしょう、〜のでしょう、〜だでしょう 這種說法。","<b>文法規則：「〜でしょう」現在式的肯定與否定怎麼接？</b><br><br>| 詞性     | 肯定                   | 否定                                 |<br>| -------- | ---------------------- | ------------------------------------ |<br>| 動詞     | 現在肯定短形＋でしょう | 現在否定短形＋でしょう               |<br>| い形容詞 | 現在肯定短形＋でしょう | 現在否定短形＋でしょう               |<br>| な形容詞 | 語幹＋でしょう         | 現在否定短形（〜じゃない）＋でしょう |<br>| 名詞     | 名詞＋でしょう         | 現在否定短形（〜じゃない）＋でしょう |","<b>文法規則：「〜でしょう」過去式的肯定與否定怎麼接？</b><br><br>不管是動詞、い形容詞、な形容詞還是名詞，過去式一律用：<b>過去式短形＋でしょう</b>（肯定、否定都一樣，直接把對應詞類的過去短形接在でしょう前面即可）。","<b>文法：「〜でしょう」句子可以怎麼變成問句？作用是什麼？</b><br><br>把でしょう句改成「〜でしょうか」，就變成疑問句，用來<b>邀請對方說出自己的意見或猜測</b>（相當於「你覺得…呢？」）。","<b>文法：「でしょう」的普通形（短形）是什麼？用在什麼情境？</b><br><br>でしょう 的短形是「<b>だろう</b>」，可以用來比較委婉、謹慎地表達自己的推測或分析（常搭配「〜と思います」）。","<b>文法：口語中「でしょ」是什麼？什麼時候使用？</b><br><br>在<b>輕鬆、口語的對話</b>中，可以用でしょう（帶疑問語氣，常常唸得比較短，變成「でしょ」）來<b>跟對方確認自己剛才說的理解是否正確</b>，類似中文的「…對吧？」。","<b>總結：「〜でしょう」現在式與過去式的完整接續規則整理？</b><br><br>| 詞性     | 現在肯定               | 現在否定               | 過去（肯定／否定） |<br>| -------- | ---------------------- | ---------------------- | ------------------ |<br>| 動詞     | 現在肯定短形＋でしょう | 現在否定短形＋でしょう | 過去短形＋でしょう |<br>| い形容詞 | 現在肯定短形＋でしょう | 現在否定短形＋でしょう | 過去短形＋でしょう |<br>| な形容詞 | 語幹＋でしょう         | 現在否定短形＋でしょう | 過去短形＋でしょう |<br>| 名詞     | 名詞＋でしょう         | 現在否定短形＋でしょう | 過去短形＋でしょう |<br><br>重點回顧：<br><br>- でしょう＝「大概…吧」，用於推測、預測。<br>- 動詞／い形容詞：直接用短形（普通形）接でしょう，肯定否定皆同規則。<br>- な形容詞：肯定用語幹接でしょう，否定則用現在否定短形接でしょう。<br>- 名詞：肯定直接用名詞接でしょう，否定則用現在否定短形（〜じゃない）接でしょう。<br>- 過去式：一律用過去短形接でしょう，各詞性規則相同。<br>- でしょうか：把でしょう變問句，邀請對方表達意見或猜測。<br>- だろう：でしょう的普通形（短形），用於較委婉的推測分析，常搭配と思います。<br>- でしょ：口語中でしょう的縮短唸法，帶疑問語氣，用來跟對方確認理解是否正確。"],example:[{en:null,jp:"**請翻譯並說明句型：「<ruby>明日<rt>あした</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>るでしょう。」**",zh:"明天大概會下雨吧。"},{en:null,jp:"**請翻譯並說明句型：「<ruby>明日<rt>あした</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らないでしょう。」**",zh:"明天大概不會下雨吧。"},{en:null,jp:"**請翻譯並說明句型：「<ruby>北海道<rt>ほっかいどう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>いでしょう。」**",zh:"北海道大概很冷吧。"},{en:null,jp:"**請翻譯並說明句型：「<ruby>北海道<rt>ほっかいどう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>くないでしょう。」**",zh:"北海道大概不冷吧。"},{en:null,jp:"**請翻譯並說明句型：「けんは<ruby>魚<rt>さかな</rt></ruby>が<ruby>好<rt>す</rt></ruby>きでしょう。」**",zh:"小健大概喜歡魚吧。"},{en:null,jp:"**請翻譯並說明句型：「けんは<ruby>魚<rt>さかな</rt></ruby>が<ruby>好<rt>す</rt></ruby>きじゃないでしょう。」**",zh:"小健大概不喜歡魚吧。"},{en:null,jp:"**請翻譯並說明句型：「まこは<ruby>学生<rt>がくせい</rt></ruby>でしょう。」**",zh:"小真大概是學生吧。"},{en:null,jp:"**請翻譯並說明句型：「まこは<ruby>学生<rt>がくせい</rt></ruby>じゃないでしょう。」**",zh:"小真大概不是學生吧。"},{en:null,jp:"**請翻譯並說明句型：「<ruby>日本語<rt>にほんご</rt></ruby>と<ruby>韓国語<rt>かんこくご</rt></ruby>と、どっちのほうが<ruby>難<rt>むずか</rt></ruby>しいでしょうか？」**",zh:"日文和韓文，你覺得哪一個比較難呢？"},{en:null,jp:"**請翻譯並說明句型：「たけしは<ruby>興味<rt>きょうみ</rt></ruby>があるだろうと思います。」**",zh:"我覺得小武大概對這個有興趣吧。"},{en:null,jp:"**請翻譯並說明句型：「ジョン、<ruby>中国語<rt>ちゅうごくご</rt></ruby>が<ruby>分<rt>わ</rt></ruby>かるでしょ？」**",zh:"約翰，你懂中文，對吧？"},{en:null,jp:"**練習：請將「Mia will probably not eat lunch.（美亞大概不會吃午餐吧）」譯成日文，並運用動詞現在否定短形＋でしょう的句型。**",zh:"美亞大概不會吃午餐吧。"},{en:null,jp:"**練習：請將「This cake is probably very expensive.（這個蛋糕大概很貴吧）」譯成日文，並運用い形容詞現在肯定短形＋でしょう的句型。**",zh:"這個蛋糕大概很貴吧。"},{en:null,jp:"**練習：請將「That person is probably famous.（那個人大概很有名吧）」譯成日文，並運用な形容詞語幹＋でしょう的句型。**",zh:"那個人大概很有名吧。"},{en:null,jp:"**練習：請將「Taka is probably 25 years old.（小隆大概25歲吧）」譯成日文，並運用名詞＋でしょう的句型。**",zh:null}]}],"practice":[{num:99,title:"Writing Practice",vocab:[],grammar:["<b>「健是日本人，而且是學生。」這一題會用到哪些單字？</b><br><br>- Japanese（日本人）－ 日本人（にほんじん / nihonjin）<br>- Student（學生）－ 学生（がくせい / gakusei）<br>- ＊這是一個肯定句","<b>「這間餐廳便宜又好吃。」這一題會用到哪些單字？</b><br><br>- Restaurant（餐廳）－ レストラン（れすとらん / resutoran）<br>- Cheap（便宜的）－ <ruby>安<rt>やす</rt></ruby>い（やすい / yasui）<br>- Delicious（好吃的）－ <ruby>美味<rt>おい</rt></ruby>しい（おいしい / oishii）<br>- ＊這是一個肯定句","<b>「你的家又乾淨又寬敞。」這一題會用到哪些單字？</b><br><br>- House（家）－ 家（いえ / ie）<br>- Clean（乾淨的）－ <ruby>綺麗<rt>きれい</rt></ruby>な（きれいな / kireina）<br>- Spacious（寬敞的）－ <ruby>広<rt>ひろ</rt></ruby>い（ひろい / hiroi）<br>- ＊這是一個肯定句","<b>「竹志頭腦好，個子又高。」這一題會用到哪些單字？要用什麼句型？</b><br><br>- 「聰明」和「（個子）高」都要套用「（身體部位）が（形容詞）です」這個句型來表達<br>- Head（頭）－ 頭（あたま / atama）<br>- Good（好的）－ <ruby>良<rt>い</rt></ruby>い（いい / ii）<br>- Height／for a person（身高）－ 背（せ / se）<br>- Tall／for height（高的）－ <ruby>高<rt>たか</rt></ruby>い（たかい / takai）","<b>「健人的狗是公的，而且很有活力。」這一題會用到哪些單字？</b><br><br>- Dog（狗）－ 犬（いぬ / inu）<br>- Male（公的）－ オス（おす / osu）<br>- Energetic（有活力的）－ <ruby>元気<rt>げんき</rt></ruby>な（げんきな / genkina）","<b>「美佳喜歡動物，而且很親切。」這一題會用到哪些單字？</b><br><br>- To like（喜歡）－ <ruby>好<rt>す</rt></ruby>きな（すきな / sukina，な形容詞）<br>- Animals（動物）－ 動物（どうぶつ / doubutsu）<br>- Kind（親切的）－ <ruby>親切<rt>しんせつ</rt></ruby>な（しんせつな / shinsetsuna）","<b>總結：本課的て形（Te-form）肯定形變化規則整理</b><br><br>- い形容詞：去掉字尾「い」，加「くて」。例：<ruby>可愛<rt>かわい</rt></ruby>い → <ruby>可愛<rt>かわい</rt></ruby>くて、<ruby>安<rt>やす</rt></ruby>い → <ruby>安<rt>やす</rt></ruby>くて、<ruby>広<rt>ひろ</rt></ruby>い → <ruby>広<rt>ひろ</rt></ruby>くて、<ruby>高<rt>たか</rt></ruby>い → <ruby>高<rt>たか</rt></ruby>くて<br>- な形容詞：去掉字尾「な」，加「で」。例：<ruby>綺麗<rt>きれい</rt></ruby>な → <ruby>綺麗<rt>きれい</rt></ruby>で、<ruby>元気<rt>げんき</rt></ruby>な → <ruby>元気<rt>げんき</rt></ruby>で、<ruby>好<rt>す</rt></ruby>きな → <ruby>好<rt>す</rt></ruby>きで<br>- 名詞句（名詞＋です）：把「です」改成「で」。例：<ruby>学生<rt>がくせい</rt></ruby>です → <ruby>学生<rt>がくせい</rt></ruby>で、オスです → オスで<br>- 特例：「いい」不能直接去い加くて，要先還原成古語「よい」，再變化成「よくて」<br><br>這些て形肯定形都用來連接兩個子句，形成「Aで／くて、Bです」的並列句型，表示同一主語同時具備兩種性質，或不同主語各自具備某種性質（例如「頭がよくて、背が高いです」）。"],example:[{en:"What is the ",jp:"**「<ruby>可愛<rt>かわい</rt></ruby>い」（kawaii，可愛的）的て形肯定形（Te-form Affirmative）怎麼寫？**",zh:null},{en:"What is the ",jp:"**「<ruby>綺麗<rt>きれい</rt></ruby>な」（kireina，漂亮的／乾淨的）的て形肯定形（Te-form Affirmative）怎麼寫？**",zh:null},{en:"What is the ",jp:"**「<ruby>学生<rt>がくせい</rt></ruby>です」（gakusei desu，是學生）的て形肯定形（Te-form Affirmative）怎麼寫？**",zh:null},{en:"What is the ",jp:"**「いい」（ii，好的）的て形肯定形（Te-form Affirmative）怎麼寫？**",zh:null},{en:"Ken is Japanese and a student",jp:"**請用日文翻譯：「健是日本人，而且是學生。」**",zh:null},{en:"This restaurant is cheap and delicious.",jp:"**請用日文翻譯：「這間餐廳便宜又好吃。」**",zh:null},{en:"Your house is clean and spacious",jp:"**請用日文翻譯：「你的家又乾淨又寬敞。」**",zh:null},{en:"Takeshi is smart and tall.",jp:"**請用日文翻譯：「竹志頭腦好，個子又高。」**",zh:null},{en:"Kento's dog is a male and energetic.",jp:"**請用日文翻譯：「健人的狗是公的，而且很有活力。」**",zh:null},{en:"Mika likes animals and very kind.",jp:"**請用日文翻譯：「美佳喜歡動物，而且很親切。」**",zh:null}]},{num:107,title:"Writing Practice",vocab:[],grammar:["本單元是寫作練習題，每一題都先給一句英文句子和幾個提示單字（HINT），要求練習寫出對應的日文句子。7 題全部都在練習同一個句型：「動詞ます形（去掉ます）＋に＋行く／来る／帰る」，用來表達「為了做某事而去／來（某地）」，並依句意變化行く・来る的時態（現在/過去）與肯定/否定/疑問形。"],example:[{en:"Mary came to Japan to study Japanese.",jp:"**寫作練習1：如何用日文表達「瑪麗來日本是為了學日文」？**",zh:null},{en:"I will go to Kai's house to borrow a book.",jp:"**寫作練習2：如何用日文表達「我要去凱的家借書」？**",zh:null},{en:"I went to Tokyo to meet my father.",jp:"**寫作練習3：如何用日文表達「我去東京是為了見爸爸」？**",zh:null},{en:"I will not go to school to play basketball.",jp:"**寫作練習4：如何用日文表達「我不會去學校打籃球」？**",zh:null},{en:"Did you come to the library to study?",jp:"**寫作練習5：如何用日文表達「你來圖書館是為了讀書嗎？」**",zh:null},{en:"Kiko did not come to return the book.",jp:"**寫作練習6：如何用日文表達「紀子沒有來還書」？**",zh:null},{en:"Toma will come to my house to cook dinner.",jp:"**寫作練習7：如何用日文表達「登馬會來我家做晚餐」？**",zh:null}]},{num:108,title:"Listening Practice",vocab:[],grammar:[],example:[{en:null,jp:null,zh:null},{en:null,jp:"**たえはご飯を食べに行きましたか？這句話是什麼意思？請從三個英文選項中選出正確答案（Reading Practice 1）**",zh:"英文原題："},{en:null,jp:"**りのは映画を観に行きません。這句話是什麼意思？請從三個英文選項中選出正確答案（Reading Practice 2）**",zh:"英文原題："},{en:null,jp:"**きほはカフェにともに会いにきました。這句話是什麼意思？請從三個英文選項中選出正確答案（Reading Practice 3）**",zh:"英文原題："},{en:null,jp:"**私は図書館に勉強しにきました。這句話是什麼意思？請從三個英文選項中選出正確答案（Listening Practice 1）**",zh:"英文原題："},{en:"Tomoka，此處依照截圖原文保留\"Tomo\"的寫法。）",jp:"**ともかはアメリカに友達に会いに行きます。這句話是什麼意思？請從三個英文選項中選出正確答案（Listening Practice 2）**",zh:"英文原題："},{en:null,jp:"**ゆりは公園に写真を撮りに行きませんでした。這句話是什麼意思？請從三個英文選項中選出正確答案（Listening Practice 3）**",zh:"英文原題："},{en:null,jp:"**としはコーヒーを飲みにきます。這句話是什麼意思？請從三個英文選項中選出正確答案（Listening Practice 4）**",zh:"英文原題："}]}]};
const TABS=[{"key": "num-time", "label": "數字・時間"}, {"key": "basic", "label": "基礎句型"}, {"key": "demo-q", "label": "指示詞・疑問詞"}, {"key": "particle", "label": "助詞"}, {"key": "verb-masu", "label": "動詞ます形・存在文"}, {"key": "te-form", "label": "て形"}, {"key": "adj", "label": "形容詞"}, {"key": "short-form", "label": "常體短形（普通形）"}, {"key": "advanced", "label": "比較・原因・進階句型"}, {"key": "practice", "label": "綜合練習"}];

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function plain(s){return (s||'').replace(/<[^>]+>/g,'')}

function jpVoice(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>v.lang==='ja-JP') || vs.find(v=>v.lang && v.lang.startsWith('ja')) || null;
}
function speak(text){
  if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀');return;}
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(plain(text));
  u.lang = 'ja-JP';
  u.rate = parseFloat(document.getElementById('rate').value) || 0.85;
  const v = jpVoice(); if(v) u.voice = v;
  setTimeout(()=>speechSynthesis.speak(u), 60);
}
if('speechSynthesis' in window){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = function(){};
}

function renderChapter(c){
  let html = '<div class="chapter" data-num="'+c.num+'">';
  html += '<h2 onclick="this.parentElement.classList.toggle(\'closed\')"><span><span class="num">'+c.num+'.</span>'+esc(c.title)+'</span><span class="car">▾</span></h2>';
  html += '<div class="body">';

  html += '<div class="section-label vocab">① 單字</div>';
  if(c.vocab.length){
    html += '<div class="vocab-grid">';
    for(const v of c.vocab){
      html += '<div class="vcard"><span class="term">'+v.t+'</span>'
            + '<button class="sp" onclick="speak('+JSON.stringify(plain(v.t))+')" title="朗讀">🔊</button>'
            + (v.m ? '<div class="meaning">'+esc(v.m)+'</div>' : '')
            + '</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="empty-note">本課沒有獨立單字表</div>';
  }

  html += '<div class="section-label grammar">② 文法</div>';
  if(c.grammar.length){
    for(const g of c.grammar){
      html += '<div class="gcard">'+g+'</div>';
    }
  } else {
    html += '<div class="empty-note">本課沒有額外文法規則說明</div>';
  }

  html += '<div class="section-label example">③ 例句</div>';
  if(c.example.length){
    for(const e of c.example){
      if(!e.jp) continue;
      html += '<div class="ecard">'
            + (e.en ? '<div class="en">"'+esc(e.en)+'"</div>' : '')
            + '<div class="jp">'+e.jp+'</div>'
            + (e.zh ? '<div class="zh">'+esc(e.zh)+'</div>' : '')
            + '<button class="sp" onclick="speak('+JSON.stringify(plain(e.jp))+')">🔊 朗讀例句</button>'
            + '</div>';
    }
  } else {
    html += '<div class="empty-note">本課沒有獨立例句（內容併入文法說明中）</div>';
  }

  html += '</div></div>';
  return html;
}

let currentTab = TABS[0].key;

function renderTab(key){
  currentTab = key;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.key===key));
  const list = DATA[key] || [];
  document.getElementById('content').innerHTML = list.map(renderChapter).join('');
  applySearch();
}

document.getElementById('tabbar').innerHTML = TABS.map(t=>
  '<button class="tab" data-key="'+t.key+'" onclick="renderTab(\''+t.key+'\')">'+esc(t.label)+'</button>'
).join('');

function applySearch(){
  const kw = document.getElementById('q').value.trim();
  document.querySelectorAll('.chapter').forEach(ch=>{
    if(!kw){ ch.classList.remove('hide'); ch.querySelectorAll('.vcard,.gcard,.ecard').forEach(x=>x.classList.remove('hide')); return; }
    let anyMatch = false;
    ch.querySelectorAll('.vcard,.gcard,.ecard').forEach(card=>{
      const match = card.textContent.includes(kw);
      card.classList.toggle('hide', !match);
      if(match) anyMatch = true;
    });
    ch.classList.toggle('hide', !anyMatch);
  });
}
document.getElementById('q').addEventListener('input', applySearch);

renderTab(TABS[0].key);
</script>
