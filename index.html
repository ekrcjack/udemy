nasu 意思：説話 (to talk)","say":"話す（はなす）"},{"t":"元気になる（げんきになる）","m":"genki ni naru 意思：變得有精神、振作起來 (to become energetic)","say":"元気になる（げんきになる）"},{"t":"道（みち）","m":"michi 意思：道路 (road)","say":"道（みち）"},{"t":"時間がかかる（じかんがかかる）","m":"jikan ga kakaru 意思：花時間 (to take time)","say":"時間がかかる（じかんがかかる）"},{"t":"帰る（かえる）","m":"kaeru 意思：回去 (to go home)","say":"帰る（かえる）"},{"t":"寂しくなる（さびしくなる）","m":"sabishiku naru 意思：變得寂寞 (to become lonely)","say":"寂しくなる（さびしくなる）"},{"t":"子供（こども）","m":"kodomo 意思：小孩 (child)","say":"子供（こども）"},{"t":"冬（ふゆ）","m":"fuyu 意思：冬天 (winter)","say":"冬（ふゆ）"},{"t":"秋（あき）","m":"aki 意思：秋天 (autumn)","say":"秋（あき）"},{"t":"赤い（あかい）","m":"akai 意思：紅色的 (red)","say":"赤い（あかい）"},{"t":"手紙（てがみ）","m":"tegami 意思：信 (letter)","say":"手紙（てがみ）"},{"t":"くる","m":"kuru 意思：來 (to come)","say":"くる"},{"t":"悲しい（かなしい）","m":"kanashii 意思：悲傷的 (sad)","say":"悲しい（かなしい）"},{"t":"食べすぎる（たべすぎる）","m":"tabesugiru 意思：吃太多 (to overeat)","say":"食べすぎる（たべすぎる）"},{"t":"病気（びょうき）","m":"byouki 意思：生病 (sick)","say":"病気（びょうき）"},{"t":"春（はる）","m":"haru 意思：春天 (spring)","say":"春（はる）"}],"grammar":["<b>〜と 是什麼意思？怎麼接？</b><br><br>句型為「[子句A]と[子句B]」，其中A必須以現在式常體結尾，意思是「每當A所描述的情況成立時，B就會發生」，表示一種普遍、自然成立的因果關係。","<b>と 前後子句的時態有什麼限制？</b><br><br>と前面的子句永遠是現在式，但後面的子句可以是現在式或過去式；此外B所描述的事情必須發生在A之後，若B其實發生在A之前，就不能用と，而應該改用「とき」。","<b>第二子句要表達「變化」時怎麼說？</b><br><br>通常會用い形容詞語幹＋くなる，或な形容詞語幹＋になる來表示狀態的轉變。"],"example":[{"en":"When I talk with Tomo, I feel energized.","jp":"ともと<ruby>話<rt>はな</rt></ruby>すと、<ruby>元気<rt>げんき</rt></ruby>になります。","rj":"Tomo to hanasu to, genki ni narimasu.","say":"ともと話すと、元気になります。"},{"en":"When the road is congested, it takes more time.","jp":"<ruby>道<rt>みち</rt></ruby>が<ruby>混<rt>こ</rt></ruby>んでいると、<ruby>時間<rt>じかん</rt></ruby>がかかる。","rj":"Michi ga konde iru to, jikan ga kakaru.","say":"道が混んでいると、時間がかかる。"},{"en":"When Mary goes back to America, we get lonely.","jp":"メアリーがアメリカに<ruby>帰<rt>かえ</rt></ruby>ると、<ruby>寂<rt>さび</rt></ruby>しくなります。","rj":"Mearii ga Amerika ni kaeru to, sabishiku narimasu.","say":"メアリーがアメリカに帰ると、寂しくなります。"},{"en":"When I was a child, I would catch a cold whenever winter came.","jp":"<ruby>子供<rt>こども</rt></ruby>の<ruby>時<rt>とき</rt></ruby>、<ruby>冬<rt>ふゆ</rt></ruby>になると<ruby>風邪<rt>かぜ</rt></ruby>をひきました。","rj":"Kodomo no toki, fuyu ni naru to kaze o hikimashita.","say":"子供の時、冬になると風邪をひきました。"},{"en":"Whenever I talk with Kana, we go to a café.","jp":"かなと<ruby>話<rt>はな</rt></ruby>すとカフェに<ruby>行<rt>い</rt></ruby>きます。","rj":"Kana to hanasu to kafe ni ikimasu.","say":"かなと話すとカフェに行きます。"},{"en":"When autumn comes, the trees turn red.","jp":"<ruby>秋<rt>あき</rt></ruby>になると、<ruby>木<rt>き</rt></ruby>が<ruby>赤<rt>あか</rt></ruby>くなります。","rj":"Aki ni naru to, ki ga akaku narimasu.","say":"秋になると、木が赤くなります。"},{"en":"If letters don't arrive, I feel sad.","jp":"<ruby>手紙<rt>てがみ</rt></ruby>がこないと、<ruby>悲<rt>かな</rt></ruby>しくなります。","rj":"Tegami ga konai to, kanashiku narimasu.","say":"手紙がこないと、悲しくなります。"},{"en":"If you eat too much, you'll get sick.","jp":"<ruby>食<rt>た</rt></ruby>べすぎると、<ruby>病気<rt>びょうき</rt></ruby>になります。","rj":"Tabesugiru to, byouki ni narimasu.","say":"食べすぎると、病気になります。"},{"en":"Whenever Ken comes to Japan, we eat sushi.","jp":"けんが<ruby>日本<rt>にほん</rt></ruby>にくると、すしを<ruby>食<rt>た</rt></ruby>べます。","rj":"Ken ga Nihon ni kuru to, sushi o tabemasu.","say":"けんが日本にくると、すしを食べます。"},{"en":"When spring comes, the flowers bloom.","jp":"<ruby>春<rt>はる</rt></ruby>になると、<ruby>花<rt>はな</rt></ruby>が<ruby>咲<rt>さ</rt></ruby>きます。","rj":"Haru ni naru to, hana ga sakimasu.","say":"春になると、花が咲きます。"}]},{"num":230,"title":"〜ながら (While doing...)","vocab":[{"t":"音楽（おんがく）","m":"ongaku 意思：音樂 (music)","say":"音楽（おんがく）"},{"t":"聴く（きく）","m":"kiku 意思：聽 (to listen)","say":"聴く（きく）"},{"t":"勉強する（べんきょうする）","m":"benkyou suru 意思：學習、唸書 (to study)","say":"勉強する（べんきょうする）"},{"t":"歌（うた）","m":"uta 意思：歌 (song)","say":"歌（うた）"},{"t":"歌う（うたう）","m":"utau 意思：唱歌 (to sing)","say":"歌う（うたう）"},{"t":"洗濯する（せんたくする）","m":"sentaku suru 意思：洗衣服 (to do laundry)","say":"洗濯する（せんたくする）"},{"t":"アルバイト","m":"arubaito 意思：打工 (part-time job)","say":"アルバイト"},{"t":"学校（がっこう）","m":"gakkou 意思：學校 (school)","say":"学校（がっこう）"},{"t":"行く（いく）","m":"iku 意思：去 (to go)","say":"行く（いく）"},{"t":"大変（たいへん）","m":"taihen 意思：辛苦、不容易 (tough)","say":"大変（たいへん）"},{"t":"する","m":"suru 意思：做 (to do)","say":"する"},{"t":"宿題（しゅくだい）","m":"shukudai 意思：作業、功課 (homework)","say":"宿題（しゅくだい）"},{"t":"観る（みる）","m":"miru 意思：觀看（電視） (to watch)","say":"観る（みる）"},{"t":"テレビ","m":"terebi 意思：電視 (television)","say":"テレビ"},{"t":"歩く（あるく）","m":"aruku 意思：走路 (to walk)","say":"歩く（あるく）"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"ほうがいいです","m":"hou ga ii desu 意思：…比較好 (had better...)","say":"ほうがいいです"},{"t":"飲む（のむ）","m":"nomu 意思：喝 (to drink)","say":"飲む（のむ）"},{"t":"ワイン","m":"wain 意思：紅酒 (wine)","say":"ワイン"},{"t":"料理する（りょうりする）","m":"ryouri suru 意思：做菜、烹飪 (to cook)","say":"料理する（りょうりする）"},{"t":"好きな（すきな）","m":"sukina 意思：喜歡的 (favorite/likable)","say":"好きな（すきな）"},{"t":"考える（かんがえる）","m":"kangaeru 意思：思考 (to think)","say":"考える（かんがえる）"},{"t":"話す（はなす）","m":"hanasu 意思：說、講 (to speak)","say":"話す（はなす）"},{"t":"難しい（むずかしい）","m":"muzukashii 意思：困難的 (difficult)","say":"難しい（むずかしい）"},{"t":"英語（えいご）","m":"eigo 意思：英語 (English)","say":"英語（えいご）"},{"t":"日本語（にほんご）","m":"nihongo 意思：日語 (Japanese)","say":"日本語（にほんご）"}],"grammar":["<b>〜ながら 是什麼意思？怎麼接？</b><br><br>用來連接兩個動詞，表示「同一個人」同時進行兩個動作，意思是「一邊做…一邊做…」。文型為【動作1（動詞ます形去ます）＋ながら＋動作2】，句子的重點動作是動作2，動作1是伴隨進行的次要動作。","<b>使用 ながら 時要注意什麼？</b><br><br>ながら前後的兩個動作必須是同一個人做的，不能用來描述「某人做某事的同時，另一個人做別的事」。"],"example":[{"en":"I always study Japanese while listening to music.","jp":"いつも<ruby>音楽<rt>おんがく</rt></ruby>を<ruby>聴<rt>き</rt></ruby>きながら<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>します。","rj":"Itsumo ongaku o kikinagara nihongo o benkyou shimasu.","say":"いつも音楽を聴きながら日本語を勉強します。"},{"en":"Takeshi is doing laundry while singing.","jp":"たけしは<ruby>歌<rt>うた</rt></ruby>を<ruby>歌<rt>うた</rt></ruby>いながら<ruby>洗濯<rt>せんたく</rt></ruby>しています。","rj":"Takeshi wa uta o utainagara sentaku shite imasu.","say":"たけしは歌を歌いながら洗濯しています。"},{"en":"Going to school while working a part-time job is tough.","jp":"アルバイトをしながら<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>くのは<ruby>大変<rt>たいへん</rt></ruby>です。","rj":"Arubaito o shinagara gakkou ni iku no wa taihen desu.","say":"アルバイトをしながら学校に行くのは大変です。"},{"en":"I did my homework while watching TV.","jp":"テレビを<ruby>観<rt>み</rt></ruby>ながら<ruby>宿題<rt>しゅくだい</rt></ruby>をしました。","rj":"Terebi o minagara shukudai o shimashita.","say":"テレビを観ながら宿題をしました。"},{"en":"You shouldn't eat while walking.","jp":"<ruby>歩<rt>ある</rt></ruby>きながら<ruby>食<rt>た</rt></ruby>べないほうがいいです。","rj":"Arukinagara tabenai hou ga ii desu.","say":"歩きながら食べないほうがいいです。"},{"en":"I like drinking wine while cooking.","jp":"<ruby>料理<rt>りょうり</rt></ruby>しながら、ワインを<ruby>飲<rt>の</rt></ruby>むのが<ruby>好<rt>す</rt></ruby>きです。","rj":"Ryouri shinagara, wain o nomu no ga suki desu.","say":"料理しながら、ワインを飲むのが好きです。"},{"en":"It's difficult to think in Japanese while speaking English.","jp":"<ruby>英語<rt>えいご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>しながら、<ruby>日本語<rt>にほんご</rt></ruby>で<ruby>考<rt>かんが</rt></ruby>えるのはむずかしいです。","rj":"Eigo o hanashinagara, nihongo de kangaeru no wa muzukashii desu.","say":"英語を話しながら、日本語で考えるのはむずかしいです。"}]},{"num":231,"title":"〜ばよかったです (I shouldn't have done...)","vocab":[{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"読む（よむ）","m":"yomu 意思：讀 (to read)","say":"読む（よむ）"},{"t":"する","m":"suru 意思：做 (to do)","say":"する"},{"t":"買う（かう）","m":"kau 意思：買 (to buy)","say":"買う（かう）"},{"t":"ドレス","m":"doresu 意思：洋裝 (dress)","say":"ドレス"},{"t":"飲む（のむ）","m":"nomu 意思：喝 (to drink)","say":"飲む（のむ）"},{"t":"ビール","m":"biiru 意思：啤酒 (beer)","say":"ビール"},{"t":"カメラ","m":"kamera 意思：相機 (camera)","say":"カメラ"},{"t":"行く（いく）","m":"iku 意思：去 (to go)","say":"行く（いく）"},{"t":"パーティー","m":"paatii 意思：派對 (party)","say":"パーティー"},{"t":"来る（くる）","m":"kuru 意思：來 (to come)","say":"来る（くる）"},{"t":"早く（はやく）","m":"hayaku 意思：早一點、快點 (early/quickly)","say":"早く（はやく）"}],"grammar":["<b>〜ばよかったです 是什麼意思？</b><br><br>用來表達「早知道就該做…」或「早知道就不該做…」的懊悔語氣，用於描述一個自己當初沒有選擇、但事後感到後悔的替代做法。","<b>動詞的ば形怎麼變化？</b><br><br>肯定形是將辭書形字尾的「u」去掉，改成「eba」（例如 食べる→食べれば）；否定形則是將現在否定形（ない形）字尾的「い」去掉，改成「ければ」（例如 食べない→食べなければ）。句型為【ば形肯定】＋よかったです，或【ば形否定】＋よかったです。"],"example":[{"en":"I should have bought the dress.","jp":"ドレスを<ruby>買<rt>か</rt></ruby>えばよかったです。","rj":"Doresu o kaeba yokatta desu.","say":"ドレスを買えばよかったです。"},{"en":"I shouldn't have drunk beer.","jp":"ビールを<ruby>飲<rt>の</rt></ruby>まなければよかったです。","rj":"Biiru o nomanakereba yokatta desu.","say":"ビールを飲まなければよかったです。"},{"en":"I should have bought the camera.","jp":"カメラを<ruby>買<rt>か</rt></ruby>えばよかったです。","rj":"Kamera o kaeba yokatta desu.","say":"カメラを買えばよかったです。"},{"en":"I shouldn't have bought the camera.","jp":"カメラを<ruby>買<rt>か</rt></ruby>わなければよかったです。","rj":"Kamera o kawanakereba yokatta desu.","say":"カメラを買わなければよかったです。"},{"en":"I should have gone to the party.","jp":"パーティーに<ruby>行<rt>い</rt></ruby>けばよかったです。","rj":"Paatii ni ikeba yokatta desu.","say":"パーティーに行けばよかったです。"},{"en":"I shouldn't have gone to the party.","jp":"パーティーに<ruby>行<rt>い</rt></ruby>かなければよかったです。","rj":"Paatii ni ikanakereba yokatta desu.","say":"パーティーに行かなければよかったです。"},{"en":"I should have come earlier.","jp":"<ruby>早<rt>はや</rt></ruby>くくればよかったです。","rj":"Hayaku kureba yokatta desu.","say":"早くくればよかったです。"},{"en":"I shouldn't have come early.","jp":"<ruby>早<rt>はや</rt></ruby>くこなければよかったです。","rj":"Hayaku konakereba yokatta desu.","say":"早くこなければよかったです。"}]},{"num":234,"title":"Honorific Verbs 1","vocab":[{"t":"先生（せんせい）","m":"sensei 意思：老師、教授 (teacher)","say":"先生（せんせい）"},{"t":"学校（がっこう）","m":"gakkou 意思：學校 (school)","say":"学校（がっこう）"},{"t":"料理（りょうり）","m":"ryouri 意思：做菜、料理 (cooking)","say":"料理（りょうり）"},{"t":"心配（しんぱい）","m":"shinpai 意思：擔心 (worry)","say":"心配（しんぱい）"},{"t":"テレビ","m":"terebi 意思：電視 (television)","say":"テレビ"},{"t":"映画（えいが）","m":"eiga 意思：電影 (movie)","say":"映画（えいが）"},{"t":"観る（みる）","m":"miru 意思：看（電影等） (to watch)","say":"観る（みる）"},{"t":"毎朝（まいあさ）","m":"maiasa 意思：每天早上 (every morning)","say":"毎朝（まいあさ）"},{"t":"パン","m":"pan 意思：麵包 (bread)","say":"パン"},{"t":"本（ほん）","m":"hon 意思：書 (book)","say":"本（ほん）"},{"t":"お母さん（おかあさん）","m":"okaasan 意思：母親 (mother)","say":"お母さん（おかあさん）"},{"t":"テニス","m":"tenisu 意思：網球 (tennis)","say":"テニス"}],"grammar":["<b>尊敬語是什麼？可以用在自己身上嗎？</b><br><br>尊敬語是用來描述「你所尊敬的人」所做動作的特殊動詞，藉此表達對該人物的敬意；絕不能用來描述自己的動作。","<b>尊敬語動詞怎麼變化？</b><br><br>大部分尊敬語屬於五段動詞變化規則，但いらっしゃる、おっしゃる、なさる、くださる及〜ていらっしゃる屬於不規則變化：其禮貌形（ます形）是把語尾的る換成います，再依此變化現在肯定／否定、過去肯定／否定。","<b>尊敬語什麼時候使用？常見對照有哪些？</b><br><br>用於描述：(1)社會地位比自己高的人，或(2)不太熟識、需要直接稱呼、表示禮貌的對象所做的動作。常見對照：いる／行く／来る→いらっしゃる、見る→ご覧になる、言う→おっしゃる、する→なさる、食べる／飲む→召し上がる、くれる→くださる、寝る→お休みになる、〜ている→〜ていらっしゃる。"],"example":[{"en":"The teacher is not at school.","jp":"<ruby>先生<rt>せんせい</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>にいらっしゃいません。","rj":"Sensei wa gakkou ni irasshaimasen.","say":"先生は学校にいらっしゃいません。"},{"en":"What will you have?","jp":"<ruby>何<rt>なに</rt></ruby>を<ruby>召<rt>め</rt></ruby>し<ruby>上<rt>あ</rt></ruby>がりますか？","rj":"Nani o meshiagarimasu ka?","say":"何を召し上がりますか？"},{"en":"Miki's mother gave me this book.","jp":"みきのお<ruby>母<rt>かあ</rt></ruby>さんがこの<ruby>本<rt>ほん</rt></ruby>をくださいました。","rj":"Miki no okaasan ga kono hon o kudasaimashita.","say":"みきのお母さんがこの本をくださいました。"},{"en":"I heard the teacher cooks.","jp":"<ruby>先生<rt>せんせい</rt></ruby>は<ruby>料理<rt>りょうり</rt></ruby>なさるそうです。","rj":"Sensei wa ryouri nasaru sou desu.","say":"先生は料理なさるそうです。"},{"en":"Please don't worry.","jp":"<ruby>心配<rt>しんぱい</rt></ruby>なさらないでください。","rj":"Shinpai nasaranaide kudasai.","say":"心配なさらないでください。"},{"en":"The teacher is watching TV.","jp":"<ruby>先生<rt>せんせい</rt></ruby>はテレビをご<ruby>覧<rt>らん</rt></ruby>になっています。","rj":"Sensei wa terebi o goran ni natte imasu.","say":"先生はテレビをご覧になっています。"},{"en":"Ms. Suzuki eats bread every morning.","jp":"すずきさんは<ruby>毎朝<rt>まいあさ</rt></ruby>パンを<ruby>召<rt>め</rt></ruby>し<ruby>上<rt>あ</rt></ruby>がります。","rj":"Suzuki-san wa maiasa pan o meshiagarimasu.","say":"すずきさんは毎朝パンを召し上がります。"},{"en":"Did you watch the movie?","jp":"<ruby>映画<rt>えいが</rt></ruby>をご<ruby>覧<rt>らん</rt></ruby>になりましたか？","rj":"Eiga o goran ni narimashita ka?","say":"映画をご覧になりましたか？"},{"en":"Ms. Sato did not come to school.","jp":"さとうさんは<ruby>学校<rt>がっこう</rt></ruby>にいらっしゃいませんでした。","rj":"Satou-san wa gakkou ni irasshaimasen deshita.","say":"さとうさんは学校にいらっしゃいませんでした。"},{"en":"What did Mr. Kato say?","jp":"かとうさんは<ruby>何<rt>なん</rt></ruby>とおっしゃいましたか？","rj":"Katou-san wa nan to osshaimashita ka?","say":"かとうさんは何とおっしゃいましたか？"},{"en":"The teacher played tennis.","jp":"<ruby>先生<rt>せんせい</rt></ruby>はテニスをなさいました。","rj":"Sensei wa tenisu o nasaimashita.","say":"先生はテニスをなさいました。"}]},{"num":235,"title":"Honorific Verbs 2","vocab":[{"t":"結婚する（けっこんする）","m":"kekkon suru 意思：結婚 (to marry)","say":"結婚する（けっこんする）"},{"t":"～さん","m":"-san 意思：敬稱 ((honorific title))","say":"～さん"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"召し上がる（めしあがる）","m":"meshiagaru 意思：「吃」的尊敬語 (to eat (honorific))","say":"召し上がる（めしあがる）"},{"t":"話す（はなす）","m":"hanasu 意思：說、講 (to speak)","say":"話す（はなす）"},{"t":"待つ（まつ）","m":"matsu 意思：等待 (to wait)","say":"待つ（まつ）"},{"t":"先生（せんせい）","m":"sensei 意思：老師 (teacher)","say":"先生（せんせい）"},{"t":"～の前（まえ）","m":"no mae 意思：～的前面 (in front of)","say":"～の前（まえ）"},{"t":"駅（えき）","m":"eki 意思：車站 (station)","say":"駅（えき）"},{"t":"音楽（おんがく）","m":"ongaku 意思：音樂 (music)","say":"音楽（おんがく）"},{"t":"聞く（きく）","m":"kiku 意思：聽 (to listen)","say":"聞く（きく）"},{"t":"疲れる（つかれる）","m":"tsukareru 意思：疲累 (to get tired)","say":"疲れる（つかれる）"},{"t":"手紙（てがみ）","m":"tegami 意思：信 (letter)","say":"手紙（てがみ）"},{"t":"書く（かく）","m":"kaku 意思：寫 (to write)","say":"書く（かく）"},{"t":"帰る（かえる）","m":"kaeru 意思：回家 (to go home)","say":"帰る（かえる）"},{"t":"読む（よむ）","m":"yomu 意思：讀、閱讀 (to read)","say":"読む（よむ）"},{"t":"使う（つかう）","m":"tsukau 意思：使用 (to use)","say":"使う（つかう）"},{"t":"英語（えいご）","m":"eigo 意思：英文 (English)","say":"英語（えいご）"}],"grammar":["<b>沒有專屬尊敬語動詞的一般動詞，要怎麼改成尊敬語？</b><br><br>有兩種作法。第一種：若句子含有補助動詞「ている」，把「いる」換成「いらっしゃる」，即「[て形]＋いらっしゃる」。第二種：其餘大多數情況，把動詞ます形的語幹前後夾上「お」與「になる」，即「お＋[動詞ます形語幹]＋になる」。"],"example":[{"en":"(Someone) is listening to music.","jp":"<ruby>音楽<rt>おんがく</rt></ruby>を<ruby>聞<rt>き</rt></ruby>いています。","rj":"Ongaku o kiite imasu.","say":"音楽を聞いています。"},{"en":"(Someone) is respectfully listening to music.","jp":"<ruby>音楽<rt>おんがく</rt></ruby>を<ruby>聞<rt>き</rt></ruby>いていらっしゃいます。","rj":"Ongaku o kiite irasshaimasu.","say":"音楽を聞いていらっしゃいます。"},{"en":"(Someone) is tired.","jp":"<ruby>疲<rt>つか</rt></ruby>れています。","rj":"Tsukarete imasu.","say":"疲れています。"},{"en":"(Someone) is tired (respectful).","jp":"<ruby>疲<rt>つか</rt></ruby>れていらっしゃいます。","rj":"Tsukarete irasshaimasu.","say":"疲れていらっしゃいます。"},{"en":"It looks like (someone) is writing a letter.","jp":"<ruby>手紙<rt>てがみ</rt></ruby>を<ruby>書<rt>か</rt></ruby>いているみたいです。","rj":"Tegami o kaite iru mitai desu.","say":"手紙を書いているみたいです。"},{"en":"It looks like (someone) is respectfully writing a letter.","jp":"<ruby>手紙<rt>てがみ</rt></ruby>を<ruby>書<rt>か</rt></ruby>いていらっしゃるみたいです。","rj":"Tegami o kaite irassharu mitai desu.","say":"手紙を書いていらっしゃるみたいです。"},{"en":"(Someone) went home.","jp":"<ruby>帰<rt>かえ</rt></ruby>りました。","rj":"Kaerimashita.","say":"帰りました。"},{"en":"(Someone) respectfully went home.","jp":"お<ruby>帰<rt>かえ</rt></ruby>りになりました。","rj":"Okaeri ni narimashita.","say":"お帰りになりました。"},{"en":"(Someone) will read it.","jp":"<ruby>読<rt>よ</rt></ruby>みます。","rj":"Yomimasu.","say":"読みます。"},{"en":"(Someone) will respectfully read it.","jp":"お<ruby>読<rt>よ</rt></ruby>みになります。","rj":"Oyomi ni narimasu.","say":"お読みになります。"},{"en":"Please use it.","jp":"<ruby>使<rt>つか</rt></ruby>ってください。","rj":"Tsukatte kudasai.","say":"使ってください。"},{"en":"Please use it (respectfully).","jp":"お<ruby>使<rt>つか</rt></ruby>いになってください。","rj":"Otsukai ni natte kudasai.","say":"お使いになってください。"},{"en":"Ms. Suzuki is married.","jp":"すずきさんは<ruby>結婚<rt>けっこん</rt></ruby>していらっしゃいます。","rj":"Suzuki-san wa kekkon shite irasshaimasu.","say":"すずきさんは結婚していらっしゃいます。"},{"en":"Mr. Tanaka is eating sushi.","jp":"たなかさんはすしを<ruby>召<rt>め</rt></ruby>し<ruby>上<rt>あ</rt></ruby>がっています。","rj":"Tanaka-san wa sushi o meshiagatte imasu.","say":"たなかさんはすしを召し上がっています。"},{"en":"Ms. Sasaki speaks English.","jp":"ささきさんは<ruby>英語<rt>えいご</rt></ruby>をお<ruby>話<rt>はな</rt></ruby>しになります。","rj":"Sasaki-san wa eigo o ohanashi ni narimasu.","say":"ささきさんは英語をお話しになります。"},{"en":"The teacher will wait in front of the station.","jp":"<ruby>先生<rt>せんせい</rt></ruby>は<ruby>駅<rt>えき</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>でお<ruby>待<rt>ま</rt></ruby>ちになります。","rj":"Sensei wa eki no mae de omachi ni narimasu.","say":"先生は駅の前でお待ちになります。"},{"en":"The teacher is waiting in front of the station.","jp":"<ruby>先生<rt>せんせい</rt></ruby>は<ruby>駅<rt>えき</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>で<ruby>待<rt>ま</rt></ruby>っていらっしゃいます。","rj":"Sensei wa eki no mae de matte irasshaimasu.","say":"先生は駅の前で待っていらっしゃいます。"}]},{"num":236,"title":"Giving Respectful Advice","vocab":[{"t":"整理券（せいりけん）","m":"seiriken 意思：號碼牌／號碼票 (numbered ticket)","say":"整理券（せいりけん）"},{"t":"説明（せつめい）","m":"setsumei 意思：說明、解說 (explanation)","say":"説明（せつめい）"},{"t":"塩（しお）","m":"shio 意思：鹽 (salt)","say":"塩（しお）"},{"t":"注意する（ちゅういする）","m":"chuui suru 意思：小心、留意 (to be careful)","say":"注意する（ちゅういする）"},{"t":"準備する（じゅんびする）","m":"junbi suru 意思：準備 (to prepare)","say":"準備する（じゅんびする）"},{"t":"名前（なまえ）","m":"namae 意思：名字 (name)","say":"名前（なまえ）"},{"t":"書く（かく）","m":"kaku 意思：寫 (to write)","say":"書く（かく）"},{"t":"観る／見る（みる）","m":"miru 意思：看 (to look/watch)","say":"観る／見る（みる）"},{"t":"お寺（おてら）","m":"otera 意思：寺廟 (temple)","say":"お寺（おてら）"},{"t":"待つ（まつ）","m":"matsu 意思：等待 (to wait)","say":"待つ（まつ）"},{"t":"座る（すわる）","m":"suwaru 意思：坐下 (to sit)","say":"座る（すわる）"},{"t":"着席する（ちゃくせきする）","m":"chakuseki suru 意思：就座、入座 (to take one's seat)","say":"着席する（ちゃくせきする）"}],"grammar":["<b>お＋動詞ます形語幹＋ください 是什麼意思？</b><br><br>意思是「請您～」，用於恭敬地建議或指示對方做某事，常見於公共廣播、店員對客人說話等場合。雖然句尾以「ください」結尾，但本質上是一種禮貌包裝過的「命令」，因此不能用來替自己謀取好處而要求對方做事。","<b>する複合動詞和有特殊敬語動詞的字要怎麼變化？</b><br><br>若動詞是「する」複合動詞，規則改為「ご＋する前的名詞＋ください」（例：ご注意ください）。具有特殊敬語動詞的字（如「見る→ご覧になる」）則用「敬語動詞去掉になる＋ください」的形式（例：ご覧ください）。因為變化不規則性很高，建議以背誦常見固定用法為主。"],"example":[{"en":"Please take a number ticket.","jp":"<ruby>整理券<rt>せいりけん</rt></ruby>をお<ruby>取<rt>と</rt></ruby>りください。","rj":"Seiriken o otori kudasai.","say":"整理券をお取りください。"},{"en":"Please read the instructions.","jp":"<ruby>説明<rt>せつめい</rt></ruby>をお<ruby>読<rt>よ</rt></ruby>みください。","rj":"Setsumei o oyomi kudasai.","say":"説明をお読みください。"},{"en":"Please pass the salt.","jp":"<ruby>塩<rt>しお</rt></ruby>をお<ruby>取<rt>と</rt></ruby>りください。","rj":"Shio o otori kudasai.","say":"塩をお取りください。"},{"en":"Please pass me the salt.","jp":"<ruby>塩<rt>しお</rt></ruby>を<ruby>取<rt>と</rt></ruby>ってください。","rj":"Shio o totte kudasai.","say":"塩を取ってください。"},{"en":"Please be careful.","jp":"ご<ruby>注意<rt>ちゅうい</rt></ruby>ください。","rj":"Gochuui kudasai.","say":"ご注意ください。"},{"en":"Please get ready.","jp":"ご<ruby>準備<rt>じゅんび</rt></ruby>ください。","rj":"Gojunbi kudasai.","say":"ご準備ください。"},{"en":"Please take a look.","jp":"ご<ruby>覧<rt>らん</rt></ruby>ください。","rj":"Goran kudasai.","say":"ご覧ください。"},{"en":"Please get some rest.","jp":"お<ruby>休<rt>やす</rt></ruby>みください。","rj":"Oyasumi kudasai.","say":"お休みください。"},{"en":"Please help yourself.","jp":"お<ruby>召<rt>め</rt></ruby>し<ruby>上<rt>あ</rt></ruby>がりください。","rj":"Omeshiagari kudasai.","say":"お召し上がりください。"},{"en":"Please write down your name.","jp":"<ruby>名前<rt>なまえ</rt></ruby>をお<ruby>書<rt>か</rt></ruby>きください。","rj":"Namae o okaki kudasai.","say":"名前をお書きください。"},{"en":"Please look at that temple.","jp":"あのお<ruby>寺<rt>てら</rt></ruby>をご<ruby>覧<rt>らん</rt></ruby>ください。","rj":"Ano otera o goran kudasai.","say":"あのお寺をご覧ください。"},{"en":"Please wait here.","jp":"ここでお<ruby>待<rt>ま</rt></ruby>ちください。","rj":"Koko de omachi kudasai.","say":"ここでお待ちください。"},{"en":"Please have a seat.","jp":"お<ruby>座<rt>すわ</rt></ruby>りください。","rj":"Osuwari kudasai.","say":"お座りください。"},{"en":"Please take your seats.","jp":"ご<ruby>着席<rt>ちゃくせき</rt></ruby>ください。","rj":"Gochakuseki kudasai.","say":"ご着席ください。"}]},{"num":237,"title":"〜てくれてありがとう","vocab":[{"t":"手伝う（てつだう）","m":"tetsudau 意思：幫忙 (to help)","say":"手伝う（てつだう）"},{"t":"友達（ともだち）","m":"tomodachi 意思：朋友 (friend)","say":"友達（ともだち）"},{"t":"推薦状（すいせんじょう）","m":"suisenjou 意思：推薦信 (recommendation letter)","say":"推薦状（すいせんじょう）"},{"t":"書く（かく）","m":"kaku 意思：寫 (to write)","say":"書く（かく）"},{"t":"紹介する（しょうかいする）","m":"shoukai suru 意思：介紹 (to introduce)","say":"紹介する（しょうかいする）"},{"t":"招待する（しょうたいする）","m":"shoutai suru 意思：邀請 (to invite)","say":"招待する（しょうたいする）"},{"t":"教える（おしえる）","m":"oshieru 意思：教 (to teach)","say":"教える（おしえる）"},{"t":"数学（すうがく）","m":"suugaku 意思：數學 (math)","say":"数学（すうがく）"},{"t":"奢る（おごる）","m":"ogoru 意思：請客 (to treat (someone))","say":"奢る（おごる）"},{"t":"夜ご飯（よるごはん）","m":"yorugohan 意思：晚餐 (dinner)","say":"夜ご飯（よるごはん）"},{"t":"貸す（かす）","m":"kasu 意思：借出 (to lend)","say":"貸す（かす）"},{"t":"お金（かね）","m":"okane 意思：錢 (money)","say":"お金（かね）"},{"t":"お母さん（おかあさん）","m":"okaasan 意思：媽媽 (mother)","say":"お母さん（おかあさん）"}],"grammar":["<b>〜てくれてありがとう 怎麼用？</b><br><br>用「て形＋くれてありがとう」表達「謝謝你做了（某個具體動作）」，用來感謝對方為自己做的事。若要感謝對方「是這樣的一個人／處於某種狀態」，可用「でいる」取代「です」再接「くれてありがとう」。","<b>對長輩或不熟的人要怎麼表達感謝？</b><br><br>當對象需要用敬語對待（不熟或地位較高的人）時，改用「て形＋くださってありがとうございました」表達正式的感謝。"],"example":[{"en":"Thank you for helping me.","jp":"<ruby>手伝<rt>てつだ</rt></ruby>ってくれてありがとう。","rj":"Tetsudatte kurete arigatou.","say":"手伝ってくれてありがとう。"},{"en":"Thank you for being a good friend.","jp":"いい<ruby>友達<rt>ともだち</rt></ruby>でいてくれてありがとう。","rj":"Ii tomodachi de ite kurete arigatou.","say":"いい友達でいてくれてありがとう。"},{"en":"Thank you very much for writing the recommendation letter.","jp":"<ruby>推薦状<rt>すいせんじょう</rt></ruby>を<ruby>書<rt>か</rt></ruby>いてくださってありがとうございました。","rj":"Suisenjou o kaite kudasatte arigatou gozaimashita.","say":"推薦状を書いてくださってありがとうございました。"},{"en":"Thank you for introducing me to your friend.","jp":"<ruby>友達<rt>ともだち</rt></ruby>を<ruby>紹介<rt>しょうかい</rt></ruby>してくれてありがとう。","rj":"Tomodachi o shoukai shite kurete arigatou.","say":"友達を紹介してくれてありがとう。"},{"en":"Thank you for inviting me.","jp":"<ruby>招待<rt>しょうたい</rt></ruby>してくれてありがとう。","rj":"Shoutai shite kurete arigatou.","say":"招待してくれてありがとう。"},{"en":"Thank you for teaching me math.","jp":"<ruby>数学<rt>すうがく</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれてありがとう。","rj":"Suugaku o oshiete kurete arigatou.","say":"数学を教えてくれてありがとう。"},{"en":"Thank you very much for treating me to dinner.","jp":"<ruby>夜<rt>よる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>奢<rt>おご</rt></ruby>ってくださってありがとうございます。","rj":"Yorugohan o ogotte kudasatte arigatou gozaimasu.","say":"夜ご飯を奢ってくださってありがとうございます。"},{"en":"Thank you very much for lending me money.","jp":"お<ruby>金<rt>かね</rt></ruby>を<ruby>貸<rt>か</rt></ruby>してくださってありがとうございます。","rj":"Okane o kashite kudasatte arigatou gozaimasu.","say":"お金を貸してくださってありがとうございます。"},{"en":"Thank you for being a good mother.","jp":"いいお<ruby>母<rt>かあ</rt></ruby>さんでいてくれてありがとう。","rj":"Ii okaasan de ite kurete arigatou.","say":"いいお母さんでいてくれてありがとう。"}]},{"num":238,"title":"〜てよかったです","vocab":[{"t":"勉強する（べんきょうする）","m":"benkyou suru 意思：學習 (to study)","say":"勉強する（べんきょうする）"},{"t":"尊敬語（そんけいご）","m":"sonkeigo 意思：敬語 (honorific language)","say":"尊敬語（そんけいご）"},{"t":"雨が降る（あめがふる）","m":"ame ga furu 意思：下雨 (to rain)","say":"雨が降る（あめがふる）"},{"t":"貯金する（ちょきんする）","m":"chokin suru 意思：存錢 (to save money)","say":"貯金する（ちょきんする）"},{"t":"諦める（あきらめる）","m":"akirameru 意思：放棄 (to give up)","say":"諦める（あきらめる）"}],"grammar":["<b>〜てよかったです 是什麼意思？</b><br><br>用「て形＋よかったです」表達「很高興（某件事）是這樣的結果／狀態」，用來對已發生的事實表示慶幸、放心。","<b>要描述否定情況時怎麼接？</b><br><br>若要描述的內容是否定的情況，前面須接續否定て形「〜なくて」再加「よかったです」。"],"example":[{"en":"I'm glad I studied Japanese.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>してよかったです。","rj":"Nihongo o benkyou shite yokatta desu.","say":"日本語を勉強してよかったです。"},{"en":"I'm glad Mary got better.","jp":"メアリーが<ruby>元気<rt>げんき</rt></ruby>になってよかったです。","rj":"Mearii ga genki ni natte yokatta desu.","say":"メアリーが元気になってよかったです。"},{"en":"I'm glad I didn't go to the party.","jp":"パーティーに<ruby>行<rt>い</rt></ruby>かなくてよかったです。","rj":"Paatii ni ikanakute yokatta desu.","say":"パーティーに行かなくてよかったです。"},{"en":"I'm glad I studied honorific language.","jp":"<ruby>尊敬語<rt>そんけいご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>してよかったです。","rj":"Sonkeigo o benkyou shite yokatta desu.","say":"尊敬語を勉強してよかったです。"},{"en":"I'm glad it didn't rain.","jp":"<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らなくてよかったです。","rj":"Ame ga furanakute yokatta desu.","say":"雨が降らなくてよかったです。"},{"en":"I'm glad I had been saving money.","jp":"<ruby>貯金<rt>ちょきん</rt></ruby>していてよかったです。","rj":"Chokin shite ite yokatta desu.","say":"貯金していてよかったです。"},{"en":"I'm glad I didn't give up.","jp":"<ruby>諦<rt>あきら</rt></ruby>めないでよかったです。","rj":"Akiramenaide yokatta desu.","say":"諦めないでよかったです。"}]},{"num":239,"title":"〜はずです","vocab":[{"t":"勉強する（べんきょうする）","m":"benkyou suru 意思：讀書、學習 (to study)","say":"勉強する（べんきょうする）"},{"t":"今夜（こんや）","m":"kon'ya 意思：今晚 (tonight)","say":"今夜（こんや）"},{"t":"試験（しけん）","m":"shiken 意思：考試 (exam)","say":"試験（しけん）"},{"t":"今日（きょう）","m":"kyou 意思：今天 (today)","say":"今日（きょう）"},{"t":"料理する（りょうりする）","m":"ryouri suru 意思：做菜、烹飪 (to cook)","say":"料理する（りょうりする）"},{"t":"帰る（かえる）","m":"kaeru 意思：回去、回家 (to go home)","say":"帰る（かえる）"},{"t":"家（いえ）","m":"ie 意思：家 (house)","say":"家（いえ）"},{"t":"カナダ","m":"Kanada 意思：加拿大 (Canada)","say":"カナダ"},{"t":"アメリカ","m":"Amerika 意思：美國 (America)","say":"アメリカ"},{"t":"大きい（おおきい）","m":"ookii 意思：大的 (big)","say":"大きい（おおきい）"},{"t":"面白い（おもしろい）","m":"omoshiroi 意思：有趣的 (interesting)","say":"面白い（おもしろい）"},{"t":"元気（げんき）","m":"genki 意思：有精神、健康 (well/healthy)","say":"元気（げんき）"},{"t":"学生（がくせい）","m":"gakusei 意思：學生 (student)","say":"学生（がくせい）"},{"t":"電話（でんわ）","m":"denwa 意思：電話 (phone call)","say":"電話（でんわ）"},{"t":"銀行（ぎんこう）","m":"ginkou 意思：銀行 (bank)","say":"銀行（ぎんこう）"}],"grammar":["<b>〜はずです 是什麼意思？</b><br><br>接在句子的普通形之後，用來表達「應該是…、按理說是…」，也就是說話者根據常理、已知情況或推論，相信某件事是真實或可能的，但並沒有確鑿的證據。它不能用於表達「因為義務、責任而必須做」的意思。","<b>はずです 有哪些時態變化？</b><br><br>可依時態變化：現在肯定／現在否定／過去肯定／過去否定，也可以轉為過去式「はずでした」，表示原本以為理應如此，結果卻並非如此（事與願違）。","<b>形容詞、名詞要怎麼接？</b><br><br>い形容詞辭書形＋はずです、な形容詞＋なはずです、名詞＋の＋はずです。"],"example":[{"en":"The bank should be closed.","jp":"<ruby>銀行<rt>ぎんこう</rt></ruby>はしまっているはずです。","rj":"Ginkou wa shimatte iru hazu desu.","say":"銀行はしまっているはずです。"},{"en":"The bank shouldn't be closed.","jp":"<ruby>銀行<rt>ぎんこう</rt></ruby>はしまっていないはずです。","rj":"Ginkou wa shimatte inai hazu desu.","say":"銀行はしまっていないはずです。"},{"en":"The bank should have been closed.","jp":"<ruby>銀行<rt>ぎんこう</rt></ruby>はしまっていたはずです。","rj":"Ginkou wa shimatte ita hazu desu.","say":"銀行はしまっていたはずです。"},{"en":"The bank shouldn't have been closed.","jp":"<ruby>銀行<rt>ぎんこう</rt></ruby>はしまっていなかったはずです。","rj":"Ginkou wa shimatte inakatta hazu desu.","say":"銀行はしまっていなかったはずです。"},{"en":"I was supposed to get a call, but there was no call.","jp":"<ruby>電話<rt>でんわ</rt></ruby>をもらうはずでしたが、<ruby>電話<rt>でんわ</rt></ruby>がありませんでした。","rj":"Denwa o morau hazu deshita ga, denwa ga arimasen deshita.","say":"電話をもらうはずでしたが、電話がありませんでした。"},{"en":"It should be interesting.","jp":"<ruby>面白<rt>おもしろ</rt></ruby>いはずです。","rj":"Omoshiroi hazu desu.","say":"面白いはずです。"},{"en":"(Someone) should be fine.","jp":"<ruby>元気<rt>げんき</rt></ruby>なはずです。","rj":"Genki na hazu desu.","say":"元気なはずです。"},{"en":"(Someone) should be a student.","jp":"<ruby>学生<rt>がくせい</rt></ruby>のはずです。","rj":"Gakusei no hazu desu.","say":"学生のはずです。"},{"en":"Sue should be studying.","jp":"スーは<ruby>勉強<rt>べんきょう</rt></ruby>するはずです。","rj":"Suu wa benkyou suru hazu desu.","say":"スーは勉強するはずです。"},{"en":"There shouldn't be an exam today.","jp":"<ruby>今日<rt>きょう</rt></ruby><ruby>試験<rt>しけん</rt></ruby>がないはずです。","rj":"Kyou shiken ga nai hazu desu.","say":"今日試験がないはずです。"},{"en":"When I got home, Taka should have been cooking.","jp":"<ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>ったとき、たかは<ruby>料理<rt>りょうり</rt></ruby>していたはずです。","rj":"Ie ni kaetta toki, Taka wa ryouri shite ita hazu desu.","say":"家に帰ったとき、たかは料理していたはずです。"},{"en":"Canada should be bigger than America.","jp":"カナダのほうがアメリカより<ruby>大<rt>おお</rt></ruby>きいはずです。","rj":"Kanada no hou ga Amerika yori ookii hazu desu.","say":"カナダのほうがアメリカより大きいはずです。"}]},{"num":241,"title":"Extra- Modest Expressions","vocab":[{"t":"来年（らいねん）","m":"rainen 意思：明年 (next year)","say":"来年（らいねん）"},{"t":"卒業する（そつぎょうする）","m":"sotsugyou suru 意思：畢業 (to graduate)","say":"卒業する（そつぎょうする）"},{"t":"今年（ことし）","m":"kotoshi 意思：今年 (this year)","say":"今年（ことし）"},{"t":"文化（ぶんか）","m":"bunka 意思：文化 (culture)","say":"文化（ぶんか）"},{"t":"お手洗い（おてあらい）","m":"otearai 意思：洗手間、廁所 (restroom)","say":"お手洗い（おてあらい）"},{"t":"私（わたくし）","m":"watakushi 意思：我（較正式） (I (formal))","say":"私（わたくし）"},{"t":"飲む（のむ）","m":"nomu 意思：喝 (to drink)","say":"飲む（のむ）"},{"t":"お茶（おちゃ）","m":"ocha 意思：茶 (tea)","say":"お茶（おちゃ）"},{"t":"行く（いく）","m":"iku 意思：去 (to go)","say":"行く（いく）"},{"t":"事務所（じむしょ）","m":"jimusho 意思：事務所、辦公室 (office)","say":"事務所（じむしょ）"},{"t":"午前（ごぜん）","m":"gozen 意思：上午 (a.m.)","say":"午前（ごぜん）"},{"t":"妹（いもうと）","m":"imouto 意思：妹妹 (younger sister)","say":"妹（いもうと）"},{"t":"住む（すむ）","m":"sumu 意思：居住 (to live)","say":"住む（すむ）"},{"t":"父（ちち）","m":"chichi 意思：父親（自己的） ((my) father)","say":"父（ちち）"},{"t":"興味（きょうみ）","m":"kyoumi 意思：興趣 (interest)","say":"興味（きょうみ）"},{"t":"母（はは）","m":"haha 意思：母親（自己的） ((my) mother)","say":"母（はは）"},{"t":"医者（いしゃ）","m":"isha 意思：醫生 (doctor)","say":"医者（いしゃ）"},{"t":"電車（でんしゃ）","m":"densha 意思：電車 (train)","say":"電車（でんしゃ）"},{"t":"学校（がっこう）","m":"gakkou 意思：學校 (school)","say":"学校（がっこう）"},{"t":"明日（あした）","m":"ashita 意思：明天 (tomorrow)","say":"明日（あした）"}],"grammar":["<b>丁重語（extra-modest expressions）是什麼？</b><br><br>用來謙虛地描述自己（或自己家人、自己所屬公司）的動作，藉此對聽者表達更高程度的敬意，常搭配較正式的第一人稱「私（わたくし）」，常見於面試自我介紹、公共場所廣播等正式場合。","<b>丁重語為什麼不能用在對方身上？常見對照有哪些？</b><br><br>因為丁重語的效果是把「動作的主體」放低姿態表示謙遜，所以不能用來描述聽話對象或非自己團體的人的動作。常見對照：いる→おります、行く／来る→参ります、言う→申します、する→致します、食べる／飲む→いただきます、ある→ございます、〜ている→〜ております、〜です→〜でございます。"],"example":[{"en":"I will be in Japan next year as well.","jp":"<ruby>私<rt>わたくし</rt></ruby>は<ruby>来年<rt>らいねん</rt></ruby>も<ruby>日本<rt>にほん</rt></ruby>におります。","rj":"Watakushi wa rainen mo Nihon ni orimasu.","say":"私は来年も日本におります。"},{"en":"I graduated from university this past June.","jp":"<ruby>私<rt>わたくし</rt></ruby>は<ruby>今年<rt>ことし</rt></ruby>の6<ruby>月<rt>ろくがつ</rt></ruby>に<ruby>大学<rt>だいがく</rt></ruby>を<ruby>卒業<rt>そつぎょう</rt></ruby>いたしました。","rj":"Watakushi wa kotoshi no rokugatsu ni daigaku o sotsugyou itashimashita.","say":"私は今年の6月に大学を卒業いたしました。"},{"en":"I have been studying Japanese for one year.","jp":"<ruby>私<rt>わたくし</rt></ruby>は1<ruby>年間<rt>いちねんかん</rt></ruby><ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しております。","rj":"Watakushi wa ichinenkan nihongo o benkyou shite orimasu.","say":"私は1年間日本語を勉強しております。"},{"en":"I have an interest in Japanese culture.","jp":"<ruby>私<rt>わたくし</rt></ruby>は<ruby>日本<rt>にほん</rt></ruby>の<ruby>文化<rt>ぶんか</rt></ruby>に<ruby>興味<rt>きょうみ</rt></ruby>がございます。","rj":"Watakushi wa Nihon no bunka ni kyoumi ga gozaimasu.","say":"私は日本の文化に興味がございます。"},{"en":"My mother is a doctor.","jp":"<ruby>私<rt>わたくし</rt></ruby>の<ruby>母<rt>はは</rt></ruby>は<ruby>医者<rt>いしゃ</rt></ruby>でございます。","rj":"Watakushi no haha wa isha de gozaimasu.","say":"私の母は医者でございます。"},{"en":"The train is arriving.","jp":"<ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>参<rt>まい</rt></ruby>ります。","rj":"Densha ga mairimasu.","say":"電車が参ります。"},{"en":"The restroom is on the second floor.","jp":"お<ruby>手洗<rt>てあら</rt></ruby>いは2<ruby>階<rt>にかい</rt></ruby>でございます。","rj":"Otearai wa nikai de gozaimasu.","say":"お手洗いは2階でございます。"},{"en":"Will you be coming to school tomorrow?","jp":"<ruby>明日<rt>あした</rt></ruby><ruby>学校<rt>がっこう</rt></ruby>にいらっしゃいますか？","rj":"Ashita gakkou ni irasshaimasu ka?","say":"明日学校にいらっしゃいますか？"},{"en":"I will have some tea.","jp":"お<ruby>茶<rt>ちゃ</rt></ruby>をいただきます。","rj":"Ocha o itadakimasu.","say":"お茶をいただきます。"},{"en":"I will arrive at the office at 10am.","jp":"<ruby>午前<rt>ごぜん</rt></ruby>10<ruby>時<rt>じ</rt></ruby>に<ruby>事務所<rt>じむしょ</rt></ruby>に<ruby>参<rt>まい</rt></ruby>ります。","rj":"Gozen juuji ni jimusho ni mairimasu.","say":"午前10時に事務所に参ります。"},{"en":"I have a younger sister.","jp":"<ruby>妹<rt>いもうと</rt></ruby>がおります。","rj":"Imouto ga orimasu.","say":"妹がおります。"},{"en":"My father lives in Tokyo.","jp":"<ruby>父<rt>ちち</rt></ruby>は<ruby>東京<rt>とうきょう</rt></ruby>に<ruby>住<rt>す</rt></ruby>んでおります。","rj":"Chichi wa Toukyou ni sunde orimasu.","say":"父は東京に住んでおります。"}]},{"num":242,"title":"Humble Expressions 1","vocab":[{"t":"会う（あう）","m":"au 意思：見面 (to meet)","say":"会う（あう）"},{"t":"貸す（かす）","m":"kasu 意思：借出（借給別人） (to lend)","say":"貸す（かす）"},{"t":"借りる（かりる）","m":"kariru 意思：借入（向別人借） (to borrow)","say":"借りる（かりる）"},{"t":"送る（おくる）","m":"okuru 意思：寄送、寄出 (to send)","say":"送る（おくる）"},{"t":"手紙（てがみ）","m":"tegami 意思：信 (letter)","say":"手紙（てがみ）"},{"t":"返す（かえす）","m":"kaesu 意思：歸還 (to return (something))","say":"返す（かえす）"},{"t":"辞書（じしょ）","m":"jisho 意思：字典 (dictionary)","say":"辞書（じしょ）"},{"t":"紹介する（しょうかいする）","m":"shoukai suru 意思：介紹 (to introduce)","say":"紹介する（しょうかいする）"},{"t":"案内する（あんないする）","m":"annai suru 意思：帶路、導覽 (to guide)","say":"案内する（あんないする）"},{"t":"説明する（せつめいする）","m":"setsumei suru 意思：說明 (to explain)","say":"説明する（せつめいする）"},{"t":"電話する（でんわする）","m":"denwa suru 意思：打電話 (to call)","say":"電話する（でんわする）"}],"grammar":["<b>謙讓語「お＋動詞ます形語幹＋する」怎麼用？</b><br><br>用於「因尊敬對方而為對方做某件事」時，可用此形式表達自己謙卑地做某動作，例如「見面」「借出」「借入」等場合都常這樣使用（並非所有動詞都能套用，建議只使用自己實際聽過的固定用法）。","<b>する複合動詞要怎麼變成謙讓語？</b><br><br>「する複合動詞」（如紹介する、案内する、説明する、電話する）並不套用「お＋語幹＋する」的公式，而是直接在動詞前加上「ご」或「お」前綴，例如「ご紹介する」「ご案内する」「ご説明する」「お電話する」。"],"example":[{"en":"I met with the teacher yesterday.","jp":"<ruby>昨日<rt>きのう</rt></ruby>、<ruby>先生<rt>せんせい</rt></ruby>にお<ruby>会<rt>あ</rt></ruby>いしました。","rj":"Kinou, sensei ni oai shimashita.","say":"昨日、先生にお会いしました。"},{"en":"I plan to lend the teacher a book.","jp":"<ruby>先生<rt>せんせい</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>をお<ruby>貸<rt>か</rt></ruby>しするつもりです。","rj":"Sensei ni hon o okashi suru tsumori desu.","say":"先生に本をお貸しするつもりです。"},{"en":"I borrowed a dictionary from the teacher.","jp":"<ruby>先生<rt>せんせい</rt></ruby>に<ruby>辞書<rt>じしょ</rt></ruby>をお<ruby>借<rt>か</rt></ruby>りしました。","rj":"Sensei ni jisho o okari shimashita.","say":"先生に辞書をお借りしました。"},{"en":"I sent Ms. Suzuki a letter.","jp":"すずきさんに<ruby>手紙<rt>てがみ</rt></ruby>をお<ruby>送<rt>おく</rt></ruby>りしました。","rj":"Suzuki-san ni tegami o ookuri shimashita.","say":"すずきさんに手紙をお送りしました。"},{"en":"I returned the dictionary to Mr. Aoki.","jp":"あおきさんに<ruby>辞書<rt>じしょ</rt></ruby>をお<ruby>返<rt>かえ</rt></ruby>ししました。","rj":"Aoki-san ni jisho o okaeshi shimashita.","say":"あおきさんに辞書をお返ししました。"},{"en":"I will introduce my mother to Ms. Tanaka.","jp":"たなかさんに<ruby>母<rt>はは</rt></ruby>をご<ruby>紹介<rt>しょうかい</rt></ruby>します。","rj":"Tanaka-san ni haha o goshoukai shimasu.","say":"たなかさんに母をご紹介します。"},{"en":"I called Mr. Nishida.","jp":"にしださんにお<ruby>電話<rt>でんわ</rt></ruby>しました。","rj":"Nishida-san ni odenwa shimashita.","say":"にしださんにお電話しました。"}]},{"num":243,"title":"Humble Expressions 2","vocab":[{"t":"もらう","m":"morau 意思：領受、得到 (to receive)","say":"もらう"},{"t":"あげる","m":"ageru 意思：給、贈送 (to give)","say":"あげる"},{"t":"いただく","m":"itadaku 意思：「もらう」的謙讓語 (to receive (humble))","say":"いただく"},{"t":"差し上げる（さしあげる）","m":"sashiageru 意思：「あげる」的謙讓語 (to give (humble))","say":"差し上げる（さしあげる）"},{"t":"見せる（みせる）","m":"miseru 意思：給…看、出示 (to show)","say":"見せる（みせる）"},{"t":"つける","m":"tsukeru 意思：打開（開關） (to turn on)","say":"つける"},{"t":"テレビ","m":"terebi 意思：電視 (television)","say":"テレビ"},{"t":"感謝状（かんしゃじょう）","m":"kanshajou 意思：感謝狀 (certificate of appreciation)","say":"感謝状（かんしゃじょう）"},{"t":"校長先生（こうちょうせんせい）","m":"kouchou sensei 意思：校長 (principal)","say":"校長先生（こうちょうせんせい）"},{"t":"連れて行く（つれていく）","m":"tsurete iku 意思：帶（某人）去 (to take (someone) along)","say":"連れて行く（つれていく）"},{"t":"病院（びょういん）","m":"byouin 意思：醫院 (hospital)","say":"病院（びょういん）"},{"t":"地図（ちず）","m":"chizu 意思：地圖 (map)","say":"地図（ちず）"},{"t":"プレゼント","m":"purezento 意思：禮物 (present)","say":"プレゼント"},{"t":"ケーキ","m":"keeki 意思：蛋糕 (cake)","say":"ケーキ"},{"t":"本（ほん）","m":"hon 意思：書 (book)","say":"本（ほん）"},{"t":"先生（せんせい）","m":"sensei 意思：老師 (teacher)","say":"先生（せんせい）"},{"t":"申す（もうす）","m":"mousu 意思：「言う」的丁重語 (to say (humble))","say":"申す（もうす）"},{"t":"返す（かえす）","m":"kaesu 意思：歸還 (to return)","say":"返す（かえす）"},{"t":"いらっしゃる","m":"irassharu 意思：「来る／いる／行く」的尊敬語 (to be/come/go (honorific))","say":"いらっしゃる"},{"t":"帰る（かえる）","m":"kaeru 意思：回去 (to go home)","say":"帰る（かえる）"}],"grammar":["<b>もらう和あげる的謙讓語是什麼？</b><br><br>もらう的謙讓語是「いただく」，あげる的謙讓語是「差し上げる（さしあげる）」，用於恭敬地敘述「我方領受」或「我方給予」對方（尊長）東西或恩惠。","<b>「て形＋さしあげる」為什麼不建議使用？</b><br><br>很多母語人士認為聽起來像在暗示自己在施恩，較不禮貌，因此建議改用「お＋動詞ます形語幹＋する（します）」的謙讓句型來表達「我為您（謙遜地）做…」。","<b>謙讓語和丁重語有什麼不同？</b><br><br>丁重語是對「聽話者」表示尊敬，謙讓語則是對「話題／情境中出現的另一人」表示尊敬（貶低自己、抬高對方）。"],"example":[{"en":"I received this book from the teacher.","jp":"<ruby>先生<rt>せんせい</rt></ruby>にこの<ruby>本<rt>ほん</rt></ruby>をいただきました。","rj":"Sensei ni kono hon o itadakimashita.","say":"先生にこの本をいただきました。"},{"en":"The teacher was kind enough to teach me kanji.","jp":"<ruby>先生<rt>せんせい</rt></ruby>に<ruby>漢字<rt>かんじ</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えていただきました。","rj":"Sensei ni kanji o oshiete itadakimashita.","say":"先生に漢字を教えていただきました。"},{"en":"I will give the teacher a present.","jp":"<ruby>先生<rt>せんせい</rt></ruby>にプレゼントをさしあげます。","rj":"Sensei ni purezento o sashiagemasu.","say":"先生にプレゼントをさしあげます。"},{"en":"I showed the teacher the map.","jp":"<ruby>先生<rt>せんせい</rt></ruby>に<ruby>地図<rt>ちず</rt></ruby>をお<ruby>見<rt>み</rt></ruby>せしました。","rj":"Sensei ni chizu o omise shimashita.","say":"先生に地図をお見せしました。"},{"en":"Let me turn on the TV for you.","jp":"テレビをおつけしましょう。","rj":"Terebi o otsuke shimashou.","say":"テレビをおつけしましょう。"},{"en":"The teacher arrived.","jp":"<ruby>先生<rt>せんせい</rt></ruby>がいらっしゃいました。","rj":"Sensei ga irasshaimashita.","say":"先生がいらっしゃいました。"},{"en":"My name is Mary.","jp":"<ruby>私<rt>わたし</rt></ruby>はメアリーと<ruby>申<rt>もう</rt></ruby>します。","rj":"Watashi wa Mearii to moushimasu.","say":"私はメアリーと申します。"},{"en":"I returned the book to the teacher.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>先生<rt>せんせい</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>をお<ruby>返<rt>かえ</rt></ruby>ししました。","rj":"Watashi wa sensei ni hon o okaeshi shimashita.","say":"私は先生に本をお返ししました。"},{"en":"I received a certificate of appreciation from the principal.","jp":"<ruby>校長先生<rt>こうちょうせんせい</rt></ruby>に<ruby>感謝状<rt>かんしゃじょう</rt></ruby>をいただきました。","rj":"Kouchou sensei ni kanshajou o itadakimashita.","say":"校長先生に感謝状をいただきました。"},{"en":"Ms. Nonaka was kind enough to take me to the hospital.","jp":"のなかさんに<ruby>病院<rt>びょういん</rt></ruby>に<ruby>連<rt>つ</rt></ruby>れて<ruby>行<rt>い</rt></ruby>っていただきました。","rj":"Nonaka-san ni byouin ni tsurete itte itadakimashita.","say":"のなかさんに病院に連れて行っていただきました。"},{"en":"I will give this cake to Mr. Nakao.","jp":"このケーキをなかおさんに<ruby>差<rt>さ</rt></ruby>し<ruby>上<rt>あ</rt></ruby>げます。","rj":"Kono keeki o Nakao-san ni sashiagemasu.","say":"このケーキをなかおさんに差し上げます。"}]},{"num":244,"title":"〜ないで","vocab":[{"t":"辞書（じしょ）","m":"jisho 意思：字典 (dictionary)","say":"辞書（じしょ）"},{"t":"使う（つかう）","m":"tsukau 意思：使用 (to use)","say":"使う（つかう）"},{"t":"新聞（しんぶん）","m":"shinbun 意思：報紙 (newspaper)","say":"新聞（しんぶん）"},{"t":"読む（よむ）","m":"yomu 意思：讀 (to read)","say":"読む（よむ）"},{"t":"出かける（でかける）","m":"dekakeru 意思：出門 (to go out)","say":"出かける（でかける）"},{"t":"確認する（かくにんする）","m":"kakunin suru 意思：確認 (to check)","say":"確認する（かくにんする）"},{"t":"天気予報（てんきよほう）","m":"tenki yohou 意思：天氣預報 (weather forecast)","say":"天気予報（てんきよほう）"},{"t":"買う（かう）","m":"kau 意思：買 (to buy)","say":"買う（かう）"},{"t":"高い（たかい）","m":"takai 意思：貴的 (expensive)","say":"高い（たかい）"},{"t":"時計（とけい）","m":"tokei 意思：手錶、時鐘 (watch/clock)","say":"時計（とけい）"},{"t":"考える（かんがえる）","m":"kangaeru 意思：思考 (to think)","say":"考える（かんがえる）"},{"t":"本（ほん）","m":"hon 意思：書 (book)","say":"本（ほん）"},{"t":"旅行する（りょこうする）","m":"ryokou suru 意思：旅行 (to travel)","say":"旅行する（りょこうする）"},{"t":"予約する（よやくする）","m":"yoyaku suru 意思：預約 (to reserve)","say":"予約する（よやくする）"},{"t":"ホテル","m":"hoteru 意思：飯店 (hotel)","say":"ホテル"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"クッキー","m":"kukkii 意思：餅乾 (cookie)","say":"クッキー"},{"t":"洗う（あらう）","m":"arau 意思：洗 (to wash)","say":"洗う（あらう）"},{"t":"手（て）","m":"te 意思：手 (hand)","say":"手（て）"}],"grammar":["<b>〜ないで 是什麼意思？怎麼接？</b><br><br>用來表示「沒有做某個動作，就做了另一件事」，也就是「不…而…」的意思。文型是【動詞ない形＋で】。","<b>描述過去的事情時，動詞要用什麼時態？</b><br><br>即使描述的是過去發生的事情，也一律使用現在式的ない形（〜ない），不需改成過去否定形。"],"example":[{"en":"I read the newspaper without using a dictionary.","jp":"<ruby>辞書<rt>じしょ</rt></ruby>を<ruby>使<rt>つか</rt></ruby>わないで<ruby>新聞<rt>しんぶん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みます。","rj":"Jisho o tsukawaide shinbun o yomimasu.","say":"辞書を使わないで新聞を読みます。"},{"en":"I went out without checking the weather forecast.","jp":"<ruby>天気予報<rt>てんきよほう</rt></ruby>を<ruby>確認<rt>かくにん</rt></ruby>しないで、<ruby>出<rt>で</rt></ruby>かけました。","rj":"Tenki yohou o kakunin shinaide, dekakemashita.","say":"天気予報を確認しないで、出かけました。"},{"en":"I bought an expensive watch without thinking.","jp":"<ruby>考<rt>かんが</rt></ruby>えないで、<ruby>高<rt>たか</rt></ruby>い<ruby>時計<rt>とけい</rt></ruby>を<ruby>買<rt>か</rt></ruby>いました。","rj":"Kangaenaide, takai tokei o kaimashita.","say":"考えないで、高い時計を買いました。"},{"en":"Can you read a Japanese book without using a dictionary?","jp":"<ruby>辞書<rt>じしょ</rt></ruby>を<ruby>使<rt>つか</rt></ruby>わないで、<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>めますか？","rj":"Jisho o tsukawaide, nihongo no hon o yomemasu ka?","say":"辞書を使わないで、日本語の本を読めますか？"},{"en":"Have you ever traveled without booking a hotel?","jp":"ホテルを<ruby>予約<rt>よやく</rt></ruby>しないで、<ruby>旅行<rt>りょこう</rt></ruby>したことがありますか？","rj":"Hoteru o yoyaku shinaide, ryokou shita koto ga arimasu ka?","say":"ホテルを予約しないで、旅行したことがありますか？"},{"en":"I ate cookies without washing my hands.","jp":"<ruby>手<rt>て</rt></ruby>を<ruby>洗<rt>あら</rt></ruby>わないで、クッキーを<ruby>食<rt>た</rt></ruby>べました。","rj":"Te o arawaide, kukkii o tabemashita.","say":"手を洗わないで、クッキーを食べました。"}]},{"num":245,"title":"Questions within Larger Sentences","vocab":[{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"住む（すむ）","m":"sumu 意思：住 (to live)","say":"住む（すむ）"},{"t":"行く（いく）","m":"iku 意思：去 (to go)","say":"行く（いく）"},{"t":"学生（がくせい）","m":"gakusei 意思：學生 (student)","say":"学生（がくせい）"},{"t":"上手（じょうず）","m":"jouzu 意思：擅長、厲害 (skillful)","say":"上手（じょうず）"},{"t":"かかる","m":"kakaru 意思：（時間）花費 (to take (time))","say":"かかる"},{"t":"どのくらい","m":"dono kurai 意思：多久、大約多少 (how long/how much)","say":"どのくらい"},{"t":"空港（くうこう）","m":"kuukou 意思：機場 (airport)","say":"空港（くうこう）"},{"t":"知る（しる）","m":"shiru 意思：知道 (to know)","say":"知る（しる）"},{"t":"なる","m":"naru 意思：成為 (to become)","say":"なる"},{"t":"弁護士（べんごし）","m":"bengoshi 意思：律師 (lawyer)","say":"弁護士（べんごし）"},{"t":"どんな","m":"donna 意思：什麼樣的 (what kind of)","say":"どんな"},{"t":"人（ひと）","m":"hito 意思：人 (person)","say":"人（ひと）"},{"t":"隣の部屋（となりのへや）","m":"tonari no heya 意思：隔壁房間 (the next room)","say":"隣の部屋（となりのへや）"},{"t":"趣味（しゅみ）","m":"shumi 意思：興趣、嗜好 (hobby)","say":"趣味（しゅみ）"}],"grammar":["<b>怎麼把一個疑問句包進較長的句子裡？</b><br><br>用來表達「不知道／不記得……」這類意思。若子句中含有疑問詞（如「誰」「何」），句型為「［疑問詞疑問句・短形］＋か＋わかりません／覚えていません」；若子句中不含疑問詞（是非問句），句型則為「［是非問句・短形］＋かどうか＋わかりません／覚えていません」。","<b>子句本身有什麼變化規則？</b><br><br>被包進去的疑問句要用普通形。當子句句尾是な形容詞或名詞的現在肯定短形「だ」時，通常會把「だ」省略。此外，子句內的主詞常用「が」取代原本的「は」。"],"example":[{"en":"I don't remember what he ate yesterday.","jp":"<ruby>昨日<rt>きのう</rt></ruby><ruby>何<rt>なに</rt></ruby>を<ruby>食<rt>た</rt></ruby>べたか<ruby>覚<rt>おぼ</rt></ruby>えていません。","rj":"Kinou nani o tabeta ka oboete imasen.","say":"昨日何を食べたか覚えていません。"},{"en":"Do you know where Mary lives?","jp":"メアリーがどこに<ruby>住<rt>す</rt></ruby>んでいるか<ruby>知<rt>し</rt></ruby>っていますか？","rj":"Mearii ga doko ni sunde iru ka shitte imasu ka?","say":"メアリーがどこに住んでいるか知っていますか？"},{"en":"I don't know whether I'll go to school tomorrow.","jp":"<ruby>明日<rt>あした</rt></ruby><ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>くかどうかわかりません。","rj":"Ashita gakkou ni iku ka dou ka wakarimasen.","say":"明日学校に行くかどうかわかりません。"},{"en":"I don't know who is the best.","jp":"<ruby>誰<rt>だれ</rt></ruby>が<ruby>一番<rt>いちばん</rt></ruby><ruby>上手<rt>じょうず</rt></ruby>かわかりません。","rj":"Dare ga ichiban jouzu ka wakarimasen.","say":"誰が一番上手かわかりません。"},{"en":"I don't know who was the best.","jp":"<ruby>誰<rt>だれ</rt></ruby>が<ruby>一番<rt>いちばん</rt></ruby><ruby>上手<rt>じょうず</rt></ruby>だったかわかりません。","rj":"Dare ga ichiban jouzu datta ka wakarimasen.","say":"誰が一番上手だったかわかりません。"},{"en":"I don't know whether Ken is a student.","jp":"けんが<ruby>学生<rt>がくせい</rt></ruby>かどうかわかりません。","rj":"Ken ga gakusei ka dou ka wakarimasen.","say":"けんが学生かどうかわかりません。"},{"en":"I don't know whether Ken was a student.","jp":"けんが<ruby>学生<rt>がくせい</rt></ruby>だったかどうかわかりません。","rj":"Ken ga gakusei datta ka dou ka wakarimasen.","say":"けんが学生だったかどうかわかりません。"},{"en":"I don't know what Takeshi ate.","jp":"たけしが<ruby>何<rt>なに</rt></ruby>を<ruby>食<rt>た</rt></ruby>べたか<ruby>知<rt>し</rt></ruby>りません。","rj":"Takeshi ga nani o tabeta ka shirimasen.","say":"たけしが何を食べたか知りません。"},{"en":"I don't know how long it takes to get to the airport.","jp":"<ruby>空港<rt>くうこう</rt></ruby>までどのくらいかかるか<ruby>知<rt>し</rt></ruby>りません。","rj":"Kuukou made dono kurai kakaru ka shirimasen.","say":"空港までどのくらいかかるか知りません。"},{"en":"I don't know whether I can become a lawyer.","jp":"<ruby>弁護士<rt>べんごし</rt></ruby>になれるかどうかわかりません。","rj":"Bengoshi ni nareru ka dou ka wakarimasen.","say":"弁護士になれるかどうかわかりません。"},{"en":"Do you know what kind of person lives in the room next door?","jp":"<ruby>隣<rt>となり</rt></ruby>の<ruby>部屋<rt>へや</rt></ruby>にどんな<ruby>人<rt>ひと</rt></ruby>が<ruby>住<rt>す</rt></ruby>んでいるか<ruby>知<rt>し</rt></ruby>っていますか？","rj":"Tonari no heya ni donna hito ga sunde iru ka shitte imasu ka?","say":"隣の部屋にどんな人が住んでいるか知っていますか？"},{"en":"I don't know what kind of person lives in the room next door.","jp":"<ruby>隣<rt>となり</rt></ruby>の<ruby>部屋<rt>へや</rt></ruby>にどんな<ruby>人<rt>ひと</rt></ruby>が<ruby>住<rt>す</rt></ruby>んでいるか<ruby>知<rt>し</rt></ruby>りません。","rj":"Tonari no heya ni donna hito ga sunde iru ka shirimasen.","say":"隣の部屋にどんな人が住んでいるか知りません。"},{"en":"Do you know what Mary's hobby is?","jp":"メアリーの<ruby>趣味<rt>しゅみ</rt></ruby>が<ruby>何<rt>なに</rt></ruby>か<ruby>知<rt>し</rt></ruby>っていますか？","rj":"Mearii no shumi ga nani ka shitte imasu ka?","say":"メアリーの趣味が何か知っていますか？"}]},{"num":246,"title":"name という item","vocab":[{"t":"犬（いぬ）","m":"inu 意思：狗 (dog)","say":"犬（いぬ）"},{"t":"飼う（かう）","m":"kau 意思：飼養 (to keep (a pet))","say":"飼う（かう）"},{"t":"歌（うた）","m":"uta 意思：歌曲 (song)","say":"歌（うた）"},{"t":"歌う（うたう）","m":"utau 意思：唱歌 (to sing)","say":"歌う（うたう）"},{"t":"読む（よむ）","m":"yomu 意思：閱讀 (to read)","say":"読む（よむ）"},{"t":"本（ほん）","m":"hon 意思：書 (book)","say":"本（ほん）"},{"t":"なる","m":"naru 意思：變成、成為 (to become)","say":"なる"},{"t":"友達（ともだち）","m":"tomodachi 意思：朋友 (friend)","say":"友達（ともだち）"},{"t":"人（ひと）","m":"hito 意思：人 (person)","say":"人（ひと）"},{"t":"バイトする（ばいとする）","m":"baito suru 意思：打工 (to work part-time)","say":"バイトする（ばいとする）"},{"t":"レストラン","m":"resutoran 意思：餐廳 (restaurant)","say":"レストラン"},{"t":"弟（おとうと）","m":"otouto 意思：弟弟 (younger brother)","say":"弟（おとうと）"}],"grammar":["<b>〜という 是什麼意思？</b><br><br>當要提到某個具有特定名稱的人或事物，但認為對方（聽者）並不熟悉這個名稱時，可使用此句型，結構為「[名稱]という[事物/人]」，意思是「叫做『名稱』的（事物/人）」，用來為聽者補充說明這個人事物的名稱。"],"example":[{"en":"I used to keep a dog named Pochi.","jp":"ぽちという<ruby>犬<rt>いぬ</rt></ruby>を<ruby>飼<rt>か</rt></ruby>っていました。","rj":"Pochi to iu inu o katte imashita.","say":"ぽちという犬を飼っていました。"},{"en":"I sang a song called \"Hana.\"","jp":"<ruby>花<rt>はな</rt></ruby>という<ruby>歌<rt>うた</rt></ruby>を<ruby>歌<rt>うた</rt></ruby>いました。","rj":"Hana to iu uta o utaimashita.","say":"花という歌を歌いました。"},{"en":"I will read a book called \"Tomodachi.\"","jp":"ともだちという<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みます。","rj":"Tomodachi to iu hon o yomimasu.","say":"ともだちという本を読みます。"},{"en":"I became friends with a person named Tomo.","jp":"ともという<ruby>人<rt>ひと</rt></ruby>と<ruby>友達<rt>ともだち</rt></ruby>になりました。","rj":"Tomo to iu hito to tomodachi ni narimashita.","say":"ともという人と友達になりました。"},{"en":"I worked part-time at a restaurant called Sukiya.","jp":"すきやというレストランでバイトしました。","rj":"Sukiya to iu resutoran de baito shimashita.","say":"すきやというレストランでバイトしました。"},{"en":"Is the person named Daiki your younger brother?","jp":"だいきという<ruby>人<rt>ひと</rt></ruby>はあなたの<ruby>弟<rt>おとうと</rt></ruby>ですか？","rj":"Daiki to iu hito wa anata no otouto desu ka?","say":"だいきという人はあなたの弟ですか？"}]},{"num":247,"title":"〜やすい 〜にくい","vocab":[{"t":"使う（つかう）","m":"tsukau 意思：使用 (to use)","say":"使う（つかう）"},{"t":"読む（よむ）","m":"yomu 意思：閱讀 (to read)","say":"読む（よむ）"},{"t":"座る（すわる）","m":"suwaru 意思：坐 (to sit)","say":"座る（すわる）"},{"t":"難しい（むずかしい）","m":"muzukashii 意思：困難的 (difficult)","say":"難しい（むずかしい）"},{"t":"買う（かう）","m":"kau 意思：買 (to buy)","say":"買う（かう）"},{"t":"雑誌（ざっし）","m":"zasshi 意思：雜誌 (magazine)","say":"雑誌（ざっし）"},{"t":"住む（すむ）","m":"sumu 意思：居住 (to live)","say":"住む（すむ）"},{"t":"物価（ぶっか）","m":"bukka 意思：物價 (prices)","say":"物価（ぶっか）"},{"t":"安い（やすい）","m":"yasui 意思：便宜的 (cheap)","say":"安い（やすい）"},{"t":"国（くに）","m":"kuni 意思：國家 (country)","say":"国（くに）"},{"t":"曲がり角（まがりかど）","m":"magarikado 意思：轉角 (corner)","say":"曲がり角（まがりかど）"},{"t":"狭い（せまい）","m":"semai 意思：狹窄的 (narrow)","say":"狭い（せまい）"},{"t":"曲がる（まがる）","m":"magaru 意思：轉彎 (to turn)","say":"曲がる（まがる）"},{"t":"優しい（やさしい）","m":"yasashii 意思：溫柔的 (gentle)","say":"優しい（やさしい）"},{"t":"親切な（しんせつな）","m":"shinsetsuna 意思：親切的 (kind)","say":"親切な（しんせつな）"},{"t":"話す（はなす）","m":"hanasu 意思：說話 (to speak)","say":"話す（はなす）"},{"t":"文字（もじ）","m":"moji 意思：文字 (characters/letters)","say":"文字（もじ）"},{"t":"小さい（ちいさい）","m":"chiisai 意思：小的 (small)","say":"小さい（ちいさい）"}],"grammar":["<b>〜やすい／〜にくい 是什麼意思？怎麼接？</b><br><br>在動詞ます形的語幹後面加上「やすい」，表達「容易做～」；加上「にくい」則表達「難以做～、不容易做～」。兩者都依い形容詞規則變化，主詞除了人以外，也常常是場所或工具。","<b>やすい／にくい 和「〜のは＋簡単／難しい」有什麼不同？</b><br><br>「やすい／にくい」著重的是「心理上」感受到的容易或困難程度；如果談的是「物理上、客觀成功率上」的難易，則應改用「〜のは＋簡単／難しい」句型。"],"example":[{"en":"This computer is easy to use.","jp":"このパソコンは<ruby>使<rt>つか</rt></ruby>いやすいです。","rj":"Kono pasokon wa tsukaiyasui desu.","say":"このパソコンは使いやすいです。"},{"en":"This book wasn't easy to read.","jp":"この<ruby>本<rt>ほん</rt></ruby>は<ruby>読<rt>よ</rt></ruby>みやすくなかったです。","rj":"Kono hon wa yomiyasukunakatta desu.","say":"この本は読みやすくなかったです。"},{"en":"The fish is hard to eat.","jp":"<ruby>魚<rt>さかな</rt></ruby>は<ruby>食<rt>た</rt></ruby>べにくいです。","rj":"Sakana wa tabenikui desu.","say":"魚は食べにくいです。"},{"en":"This town is very easy to live in.","jp":"この<ruby>町<rt>まち</rt></ruby>はとても<ruby>住<rt>す</rt></ruby>みやすいです。","rj":"Kono machi wa totemo sumiyasui desu.","say":"この町はとても住みやすいです。"},{"en":"This cup is hard to drink from.","jp":"このコップは<ruby>飲<rt>の</rt></ruby>みにくいです。","rj":"Kono koppu wa nominikui desu.","say":"このコップは飲みにくいです。"},{"en":"This chair is uncomfortable to sit on.","jp":"このいすは<ruby>座<rt>すわ</rt></ruby>りにくい。","rj":"Kono isu wa suwarinikui.","say":"このいすは座りにくい。"},{"en":"It's difficult to get a seat on this chair.","jp":"このいすに<ruby>座<rt>すわ</rt></ruby>るのは<ruby>難<rt>むずか</rt></ruby>しい。","rj":"Kono isu ni suwaru no wa muzukashii.","say":"このいすに座るのは難しい。"},{"en":"It's embarrassing to buy this magazine.","jp":"この<ruby>雑誌<rt>ざっし</rt></ruby>は<ruby>買<rt>か</rt></ruby>いにくい。","rj":"Kono zasshi wa kainikui.","say":"この雑誌は買いにくい。"},{"en":"It's difficult to get hold of this magazine.","jp":"この<ruby>雑誌<rt>ざっし</rt></ruby>を<ruby>買<rt>か</rt></ruby>うのは<ruby>難<rt>むずか</rt></ruby>しい。","rj":"Kono zasshi o kau no wa muzukashii.","say":"この雑誌を買うのは難しい。"},{"en":"Since prices are low, this country is easy to live in.","jp":"<ruby>物価<rt>ぶっか</rt></ruby>が<ruby>安<rt>やす</rt></ruby>いから、この<ruby>国<rt>くに</rt></ruby>は<ruby>住<rt>す</rt></ruby>みやすいです。","rj":"Bukka ga yasui kara, kono kuni wa sumiyasui desu.","say":"物価が安いから、この国は住みやすいです。"},{"en":"That corner is narrow, so it's hard to turn there.","jp":"あそこの<ruby>曲<rt>ま</rt></ruby>がり<ruby>角<rt>かど</rt></ruby>は<ruby>狭<rt>せま</rt></ruby>いから、<ruby>曲<rt>ま</rt></ruby>がりにくいです。","rj":"Asoko no magarikado wa semai kara, magarinikui desu.","say":"あそこの曲がり角は狭いから、曲がりにくいです。"},{"en":"Mary is gentle and kind, so she's easy to talk to.","jp":"メアリーは<ruby>優<rt>やさ</rt></ruby>しくて<ruby>親切<rt>しんせつ</rt></ruby>だから、<ruby>話<rt>はな</rt></ruby>しやすいです。","rj":"Mearii wa yasashikute shinsetsu dakara, hanashiyasui desu.","say":"メアリーは優しくて親切だから、話しやすいです。"},{"en":"The letters are small, so this book is hard to read.","jp":"<ruby>文字<rt>もじ</rt></ruby>が<ruby>小<rt>ちい</rt></ruby>さいから、この<ruby>本<rt>ほん</rt></ruby>は<ruby>読<rt>よ</rt></ruby>みにくいです。","rj":"Moji ga chiisai kara, kono hon wa yominikui desu.","say":"文字が小さいから、この本は読みにくいです。"}]},{"num":250,"title":"Passive Sentences 1","vocab":[{"t":"友達（ともだち）","m":"tomodachi 意思：朋友 (friend)","say":"友達（ともだち）"},{"t":"車（くるま）","m":"kuruma 意思：車子 (car)","say":"車（くるま）"},{"t":"使う（つかう）→使われる","m":"tsukau/tsukawareru 意思：使用／被使用 (to use/be used)","say":"使う（つかう）→使われる"},{"t":"食べる（たべる）→食べられる","m":"taberu/taberareru 意思：吃／被吃 (to eat/be eaten)","say":"食べる（たべる）→食べられる"},{"t":"見る（みる）→見られる","m":"miru/miraeru 意思：看／被看 (to see/be seen)","say":"見る（みる）→見られる"},{"t":"着る（きる）→着られる","m":"kiru/kirareru 意思：穿／被穿 (to wear/be worn)","say":"着る（きる）→着られる"},{"t":"行く（いく）→行かれる","m":"iku/ikareru 意思：去／被去 (to go (passive))","say":"行く（いく）→行かれる"},{"t":"読む（よむ）→読まれる","m":"yomu/yomareru 意思：讀／被讀 (to read/be read)","say":"読む（よむ）→読まれる"},{"t":"買う（かう）→買われる","m":"kau/kawareru 意思：買／被買 (to buy/be bought)","say":"買う（かう）→買われる"},{"t":"する→される","m":"suru/sareru 意思：做／被做 (to do/be done)","say":"する→される"},{"t":"来る（くる）→こられる","m":"kuru/korareru 意思：來／被來 (to come (passive))","say":"来る（くる）→こられる"},{"t":"私（わたし）","m":"watashi 意思：我 (I/me)","say":"私（わたし）"},{"t":"タバコを吸う（たばこをすう）→吸われる","m":"tabako o suu/suwareru 意思：抽菸／被抽菸波及 (to smoke/be affected by smoking)","say":"タバコを吸う（たばこをすう）→吸われる"},{"t":"盗む（ぬすむ）→盗まれる","m":"nusumu/nusumareru 意思：偷／被偷 (to steal/be stolen)","say":"盗む（ぬすむ）→盗まれる"},{"t":"パスワード","m":"pasuwaado 意思：密碼 (password)","say":"パスワード"},{"t":"笑う（わらう）→笑われる","m":"warau/warawareru 意思：嘲笑／被嘲笑 (to laugh/be laughed at)","say":"笑う（わらう）→笑われる"},{"t":"苦情を言う（くじょうをいう）→言われる","m":"kujou o iu/iwareru 意思：抱怨／被抱怨 (to complain/be complained to)","say":"苦情を言う（くじょうをいう）→言われる"},{"t":"客さん（きゃくさん）","m":"kyakusan 意思：客人 (customer)","say":"客さん（きゃくさん）"},{"t":"カバン","m":"kaban 意思：包包 (bag)","say":"カバン"},{"t":"泥棒（どろぼう）","m":"dorobou 意思：小偷 (thief)","say":"泥棒（どろぼう）"},{"t":"招待する（しょうたいする）→招待される","m":"shoutai suru/sareru 意思：邀請／被邀請 (to invite/be invited)","say":"招待する（しょうたいする）→招待される"},{"t":"パーティー","m":"paatii 意思：派對 (party)","say":"パーティー"},{"t":"撮る（とる）→撮られる","m":"toru/torareru 意思：拍／被拍（照） (to take/have taken (a photo))","say":"撮る（とる）→撮られる"},{"t":"写真（しゃしん）","m":"shashin 意思：照片 (photo)","say":"写真（しゃしん）"},{"t":"知らない人（しらないひと）","m":"shiranai hito 意思：陌生人 (stranger)","say":"知らない人（しらないひと）"},{"t":"蹴る（ける）→蹴られる","m":"keru/kerareru 意思：踢／被踢 (to kick/be kicked)","say":"蹴る（ける）→蹴られる"}],"grammar":["<b>被動句（受動態）用在什麼情境？</b><br><br>用來表達「當自己因為別人做的事而感到困擾、生氣或難過時」，表達不滿的心情，句型結構是【[受害者]は（或が）[加害者]に[動詞的被動形]】。","<b>被動形怎麼變化？</b><br><br>Ru動詞把語尾る換成られる；U動詞把語尾u換成areru（う結尾的動詞中間加w，變成われる）；不規則動詞する→される、来る→こられる。"],"example":[{"en":"My friend used the car.","jp":"<ruby>友達<rt>ともだち</rt></ruby>が<ruby>車<rt>くるま</rt></ruby>を<ruby>使<rt>つか</rt></ruby>いました。","rj":"Tomodachi ga kuruma o tsukaimashita.","say":"友達が車を使いました。"},{"en":"My car was used by my friend, and I wasn't happy about it.","jp":"<ruby>友達<rt>ともだち</rt></ruby>に<ruby>車<rt>くるま</rt></ruby>を<ruby>使<rt>つか</rt></ruby>われました。","rj":"Tomodachi ni kuruma o tsukawaremashita.","say":"友達に車を使われました。"},{"en":"I was bothered by Masa smoking near me.","jp":"<ruby>私<rt>わたし</rt></ruby>はまさにタバコを<ruby>吸<rt>す</rt></ruby>われました。","rj":"Watashi wa Masa ni tabako o suwaremashita.","say":"私はまさにタバコを吸われました。"},{"en":"I heard Taka's password was stolen by someone.","jp":"たかは<ruby>誰<rt>だれ</rt></ruby>かにパスワードを<ruby>盗<rt>ぬす</rt></ruby>まれたそうです。","rj":"Taka wa dareka ni pasuwaado o nusumareta sou desu.","say":"たかは誰かにパスワードを盗まれたそうです。"},{"en":"Takeshi is often laughed at by Mary.","jp":"たけしはメアリーによく<ruby>笑<rt>わら</rt></ruby>われます。","rj":"Takeshi wa Mearii ni yoku warawaremasu.","say":"たけしはメアリーによく笑われます。"},{"en":"Kai was complained to by a customer.","jp":"かいはお<ruby>客<rt>きゃく</rt></ruby>さんに<ruby>苦情<rt>くじょう</rt></ruby>を<ruby>言<rt>い</rt></ruby>われました。","rj":"Kai wa okyakusan ni kujou o iwaremashita.","say":"かいはお客さんに苦情を言われました。"},{"en":"Maki had her bag stolen by a thief.","jp":"まきは<ruby>泥棒<rt>どろぼう</rt></ruby>にカバンを<ruby>盗<rt>ぬす</rt></ruby>まれました。","rj":"Maki wa dorobou ni kaban o nusumaremashita.","say":"まきは泥棒にカバンを盗まれました。"},{"en":"I wasn't invited to the party by Ken.","jp":"<ruby>私<rt>わたし</rt></ruby>はけんにパーティーに<ruby>招待<rt>しょうたい</rt></ruby>されませんでした。","rj":"Watashi wa Ken ni paatii ni shoutai saremasen deshita.","say":"私はけんにパーティーに招待されませんでした。"},{"en":"Do strangers take your picture without permission?","jp":"あなたは<ruby>知<rt>し</rt></ruby>らない<ruby>人<rt>ひと</rt></ruby>に<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>られますか？","rj":"Anata wa shiranai hito ni shashin o toraremasu ka?","say":"あなたは知らない人に写真を撮られますか？"},{"en":"Have you ever been kicked by Taro?","jp":"たろうに<ruby>蹴<rt>け</rt></ruby>られたことがありますか？","rj":"Tarou ni kerareta koto ga arimasu ka?","say":"たろうに蹴られたことがありますか？"}]},{"num":251,"title":"Passive Sentences 2","vocab":[{"t":"食べる（たべる）→食べられる","m":"taberu/taberareru 意思：吃／被吃 (to eat/be eaten)","say":"食べる（たべる）→食べられる"},{"t":"見る（みる）→見られる","m":"miru/miraeru 意思：看／被看 (to see/be seen)","say":"見る（みる）→見られる"},{"t":"着る（きる）→着られる","m":"kiru/kirareru 意思：穿／被穿 (to wear/be worn)","say":"着る（きる）→着られる"},{"t":"行く（いく）→行かれる","m":"iku/ikareru 意思：去／被去 (to go (passive))","say":"行く（いく）→行かれる"},{"t":"読む（よむ）→読まれる","m":"yomu/yomareru 意思：讀／被讀 (to read/be read)","say":"読む（よむ）→読まれる"},{"t":"買う（かう）→買われる","m":"kau/kawareru 意思：買／被買 (to buy/be bought)","say":"買う（かう）→買われる"},{"t":"する→される","m":"suru/sareru 意思：做／被做 (to do/be done)","say":"する→される"},{"t":"来る（くる）→来られる","m":"kuru/korareru 意思：來／被來 (to come (passive))","say":"来る（くる）→来られる"},{"t":"誘う（さそう）→誘われる","m":"sasou/sasowareru 意思：邀約／被邀約 (to invite out/be invited out)","say":"誘う（さそう）→誘われる"},{"t":"紹介する（しょうかいする）→紹介される","m":"shoukai suru/sareru 意思：介紹／被介紹 (to introduce/be introduced)","say":"紹介する（しょうかいする）→紹介される"},{"t":"呼ぶ（よぶ）→呼ばれる","m":"yobu/yobareru 意思：叫、邀請／被叫、被邀請 (to call/be called)","say":"呼ぶ（よぶ）→呼ばれる"},{"t":"尊敬する（そんけいする）→尊敬される","m":"sonkei suru/sareru 意思：尊敬／被尊敬 (to respect/be respected)","say":"尊敬する（そんけいする）→尊敬される"},{"t":"建てる（たてる）→建てられる","m":"tateru/taterareru 意思：建造／被建造 (to build/be built)","say":"建てる（たてる）→建てられる"},{"t":"降る（ふる）→降られる","m":"furu/furareru 意思：（雨等）下／被淋 (to rain/get caught in rain)","say":"降る（ふる）→降られる"},{"t":"発表する（はっぴょうする）→発表される","m":"happyou suru/sareru 意思：發表／被發表 (to announce/be announced)","say":"発表する（はっぴょうする）→発表される"},{"t":"詳細（しょうさい）","m":"shousai 意思：詳細內容 (details)","say":"詳細（しょうさい）"},{"t":"イベント","m":"ibento 意思：活動 (event)","say":"イベント"},{"t":"世界中（せかいじゅう）","m":"sekaijuu 意思：全世界 (all over the world)","say":"世界中（せかいじゅう）"},{"t":"会議（かいぎ）","m":"kaigi 意思：會議 (meeting)","say":"会議（かいぎ）"},{"t":"名前（なまえ）","m":"namae 意思：名字 (name)","say":"名前（なまえ）"},{"t":"電話する（でんわする）","m":"denwa suru 意思：打電話 (to call)","say":"電話する（でんわする）"},{"t":"公園（こうえん）","m":"kouen 意思：公園 (park)","say":"公園（こうえん）"}],"grammar":["<b>被動句和てもらう有什麼不同？</b><br><br>被動句的結構是「[受害者]は[加害者]に[被動動詞]」，用來表達「某人因他人的行為而蒙受困擾／影響」；てもらう的語感則是正面、主動請人幫忙做有利自己的事，兩者恰好相對照。","<b>被動句一定帶有負面情緒嗎？</b><br><br>也有一類被動句語感中立、不帶負面情緒，多用於書面語中描述非人稱主語的事物（如建築物興建、消息發表等）。由於被動只能加在動詞上，無法用來表達對形容詞狀況的困擾，也不能對已經是否定形的動詞再加被動。"],"example":[{"en":"My diary was read by Aki, and it bothered me.","jp":"<ruby>私<rt>わたし</rt></ruby>はあきに<ruby>日記<rt>にっき</rt></ruby>を<ruby>読<rt>よ</rt></ruby>まれました。","rj":"Watashi wa Aki ni nikki o yomaremashita.","say":"私はあきに日記を読まれました。"},{"en":"I had Aki read my diary for me.","jp":"<ruby>私<rt>わたし</rt></ruby>はあきに<ruby>日記<rt>にっき</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでもらいました。","rj":"Watashi wa Aki ni nikki o yonde moraimashita.","say":"私はあきに日記を読んでもらいました。"},{"en":"I was asked out on a date by that person.","jp":"<ruby>私<rt>わたし</rt></ruby>はその<ruby>人<rt>ひと</rt></ruby>にデートに<ruby>誘<rt>さそ</rt></ruby>われました。","rj":"Watashi wa sono hito ni deeto ni sasowaremashita.","say":"私はその人にデートに誘われました。"},{"en":"I was introduced to someone by my older brother's friend.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>兄<rt>あに</rt></ruby>の<ruby>友達<rt>ともだち</rt></ruby>に<ruby>紹介<rt>しょうかい</rt></ruby>されました。","rj":"Watashi wa ani no tomodachi ni shoukai saremashita.","say":"私は兄の友達に紹介されました。"},{"en":"I wasn't invited to the party by Mako.","jp":"<ruby>私<rt>わたし</rt></ruby>はまこにパーティーに<ruby>呼<rt>よ</rt></ruby>ばれませんでした。","rj":"Watashi wa Mako ni paatii ni yobaremasen deshita.","say":"私はまこにパーティーに呼ばれませんでした。"},{"en":"Ken is respected by everyone.","jp":"けんはみんなに<ruby>尊敬<rt>そんけい</rt></ruby>されています。","rj":"Ken wa minna ni sonkei sarete imasu.","say":"けんはみんなに尊敬されています。"},{"en":"I got caught in the rain.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>に<ruby>降<rt>ふ</rt></ruby>られました。","rj":"Watashi wa ame ni furaremashita.","say":"私は雨に降られました。"},{"en":"This park was built ten years ago.","jp":"この<ruby>公園<rt>こうえん</rt></ruby>は10<ruby>年前<rt>じゅうねんまえ</rt></ruby>に<ruby>建<rt>た</rt></ruby>てられました。","rj":"Kono kouen wa juunen mae ni tateraremashita.","say":"この公園は10年前に建てられました。"},{"en":"The details of the event were not announced.","jp":"イベントの<ruby>詳細<rt>しょうさい</rt></ruby>は<ruby>発表<rt>はっぴょう</rt></ruby>されませんでした。","rj":"Ibento no shousai wa happyou saremasen deshita.","say":"イベントの詳細は発表されませんでした。"},{"en":"Is this book read all over the world?","jp":"この<ruby>本<rt>ほん</rt></ruby>は<ruby>世界中<rt>せかいじゅう</rt></ruby>で<ruby>読<rt>よ</rt></ruby>まれますか？","rj":"Kono hon wa sekaijuu de yomaremasu ka?","say":"この本は世界中で読まれますか？"},{"en":"Do you want to be invited to the meeting?","jp":"<ruby>会議<rt>かいぎ</rt></ruby>に<ruby>招待<rt>しょうたい</rt></ruby>されたいですか？","rj":"Kaigi ni shoutai saretai desu ka?","say":"会議に招待されたいですか？"},{"en":"While I was on the phone with my mother, my name was called.","jp":"お<ruby>母<rt>かあ</rt></ruby>さんに<ruby>電話<rt>でんわ</rt></ruby>しているとき、<ruby>名前<rt>なまえ</rt></ruby>が<ruby>呼<rt>よ</rt></ruby>ばれました。","rj":"Okaasan ni denwa shite iru toki, namae ga yobaremashita.","say":"お母さんに電話しているとき、名前が呼ばれました。"}]},{"num":252,"title":"〜てある","vocab":[{"t":"ストーブ","m":"sutoobu 意思：暖爐、暖氣機 (heater/stove)","say":"ストーブ"},{"t":"予約（よやく）","m":"yoyaku 意思：預約 (reservation)","say":"予約（よやく）"},{"t":"パン","m":"pan 意思：麵包 (bread)","say":"パン"},{"t":"窓（まど）","m":"mado 意思：窗戶 (window)","say":"窓（まど）"},{"t":"閉める（しめる）","m":"shimeru 意思：關（他動詞） (to close)","say":"閉める（しめる）"},{"t":"閉まる（しまる）","m":"shimaru 意思：關閉、關上（自動詞） (to be closed)","say":"閉まる（しまる）"},{"t":"夜ご飯（よるごはん）","m":"yorugohan 意思：晚餐 (dinner)","say":"夜ご飯（よるごはん）"},{"t":"作る（つくる）","m":"tsukuru 意思：製作、做 (to make)","say":"作る（つくる）"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"ヒーター","m":"hiitaa 意思：暖氣機 (heater)","say":"ヒーター"},{"t":"つける","m":"tsukeru 意思：打開（開關） (to turn on)","say":"つける"},{"t":"消す（けす）","m":"kesu 意思：關掉、熄滅 (to turn off)","say":"消す（けす）"},{"t":"電気（でんき）","m":"denki 意思：電燈、電力 (light/electricity)","say":"電気（でんき）"}],"grammar":["<b>〜てある 是什麼意思？</b><br><br>由「動詞て形＋ある」構成，用來描述「某個不具名的人特意造成、並維持至今的狀態」，句型結構為「〔某物〕が〔動詞て形〕あります」。","<b>〜てある 和 〜ておきます 有什麼關係？</b><br><br>「〜ておきました」描述過去為了某個目的所做的準備動作，而該動作的結果若持續到現在，就用「〜てあります」來表達現在的狀態。「てある」幾乎只與他動詞搭配，且通常會把原本用「を」標示的受詞改標為「が」（或「は」）。","<b>〜てある 和 〜ている 有什麼差異？</b><br><br>「ている」搭配自動詞，單純描述現在的狀態，不一定意味著有人為介入；而「てある」搭配他動詞，明確暗示「有人刻意做了這個動作，並讓結果保持至今」。"],"example":[{"en":"Since it's cold, the heater has been left on.","jp":"<ruby>寒<rt>さむ</rt></ruby>いので、ストーブがつけてあります。","rj":"Samui node, sutoobu ga tsukete arimasu.","say":"寒いので、ストーブがつけてあります。"},{"en":"There is a book placed on the table.","jp":"テーブルの<ruby>上<rt>うえ</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>が<ruby>置<rt>お</rt></ruby>いてあります。","rj":"Teeburu no ue ni hon ga oite arimasu.","say":"テーブルの上に本が置いてあります。"},{"en":"The restaurant reservation has been made.","jp":"レストランの<ruby>予約<rt>よやく</rt></ruby>がしてあります。","rj":"Resutoran no yoyaku ga shite arimasu.","say":"レストランの予約がしてあります。"},{"en":"I made a reservation in advance.","jp":"<ruby>予約<rt>よやく</rt></ruby>をしておきました。","rj":"Yoyaku o shite okimashita.","say":"予約をしておきました。"},{"en":"Bread has been bought and is ready.","jp":"パンが<ruby>買<rt>か</rt></ruby>ってあります。","rj":"Pan ga katte arimasu.","say":"パンが買ってあります。"},{"en":"I bought bread in advance.","jp":"パンを<ruby>買<rt>か</rt></ruby>っておきました。","rj":"Pan o katte okimashita.","say":"パンを買っておきました。"},{"en":"The window has been closed and left that way.","jp":"<ruby>窓<rt>まど</rt></ruby>が<ruby>閉<rt>し</rt></ruby>めてあります。","rj":"Mado ga shimete arimasu.","say":"窓が閉めてあります。"},{"en":"The window is closed.","jp":"<ruby>窓<rt>まど</rt></ruby>が<ruby>閉<rt>し</rt></ruby>まっています。","rj":"Mado ga shimatte imasu.","say":"窓が閉まっています。"},{"en":"Dinner has been made. Let's eat!","jp":"<ruby>夜<rt>よる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>が<ruby>作<rt>つく</rt></ruby>ってあります。<ruby>食<rt>た</rt></ruby>べましょう！","rj":"Yorugohan ga tsukutte arimasu. Tabemashou!","say":"夜ご飯が作ってあります。食べましょう！"},{"en":"It's cold, isn't it? Has the heater been turned on?","jp":"<ruby>寒<rt>さむ</rt></ruby>いですね。ヒーターはつけてありますか？","rj":"Samui desu ne. Hiitaa wa tsukete arimasu ka?","say":"寒いですね。ヒーターはつけてありますか？"},{"en":"It looks like the light has been turned off.","jp":"<ruby>電気<rt>でんき</rt></ruby>が<ruby>消<rt>け</rt></ruby>してあるみたいです。","rj":"Denki ga keshite aru mitai desu.","say":"電気が消してあるみたいです。"}]},{"num":253,"title":"〜間に","vocab":[{"t":"間に（あいだに）","m":"aida ni 意思：…的時候、在…期間 (while (a moment during))","say":"間に（あいだに）"},{"t":"間（あいだ）","m":"aida 意思：…的（整段）期間 (the whole time)","say":"間（あいだ）"},{"t":"お風呂に入る（おふろにはいる）","m":"ofuro ni hairu 意思：洗澡 (to take a bath)","say":"お風呂に入る（おふろにはいる）"},{"t":"電話（でんわ）","m":"denwa 意思：電話 (phone call)","say":"電話（でんわ）"},{"t":"地震（じしん）","m":"jishin 意思：地震 (earthquake)","say":"地震（じしん）"},{"t":"寝る（ねる）","m":"neru 意思：睡覺 (to sleep)","say":"寝る（ねる）"},{"t":"母（はは）","m":"haha 意思：家母 ((my) mother)","say":"母（はは）"},{"t":"日本（にほん）","m":"Nihon 意思：日本 (Japan)","say":"日本（にほん）"},{"t":"連れて行く（つれていく）","m":"tsurete iku 意思：帶去 (to take (someone) along)","say":"連れて行く（つれていく）"},{"t":"留守（るす）","m":"rusu 意思：不在家、外出 (being out/away)","say":"留守（るす）"},{"t":"友達（ともだち）","m":"tomodachi 意思：朋友 (friend)","say":"友達（ともだち）"},{"t":"パソコン","m":"pasokon 意思：電腦 (computer)","say":"パソコン"},{"t":"使う（つかう）","m":"tsukau 意思：使用 (to use)","say":"使う（つかう）"},{"t":"待つ（まつ）","m":"matsu 意思：等待 (to wait)","say":"待つ（まつ）"},{"t":"着替える（きがえる）","m":"kigaeru 意思：換衣服 (to change clothes)","say":"着替える（きがえる）"},{"t":"作る（つくる）","m":"tsukuru 意思：做、製作 (to make)","say":"作る（つくる）"},{"t":"コーヒー","m":"koohii 意思：咖啡 (coffee)","say":"コーヒー"},{"t":"くれる","m":"kureru 意思：（別人為我）做…、給我 (to do (for me))","say":"くれる"},{"t":"赤ちゃん（あかちゃん）","m":"akachan 意思：嬰兒 (baby)","say":"赤ちゃん（あかちゃん）"},{"t":"夜ご飯（よるごはん）","m":"yorugohan 意思：晚餐 (dinner)","say":"夜ご飯（よるごはん）"}],"grammar":["<b>A（の）間に B 是什麼意思？</b><br><br>用來表示「當A事件正在進行、持續的期間中，B這個（通常是短暫、瞬間發生的）事件發生了」。A句多半以「〜ている」表示一個持續進行的狀態，即使整句話描述的是過去發生的事，A子句仍要用現在式。","<b>什麼時候用「間」而不用「間に」？</b><br><br>如果B事件是「貫穿整個A事件的全程」而非只是瞬間發生，則要把「間に」改成「間」（不加に），表示涵蓋整個時間範圍，而不是A期間中的某一瞬間。"],"example":[{"en":"While I was taking a bath, there was a phone call.","jp":"お<ruby>風呂<rt>ふろ</rt></ruby>に<ruby>入<rt>はい</rt></ruby>っている<ruby>間<rt>あいだ</rt></ruby>に、<ruby>電話<rt>でんわ</rt></ruby>がありました。","rj":"Ofuro ni haitte iru aida ni, denwa ga arimashita.","say":"お風呂に入っている間に、電話がありました。"},{"en":"While I was sleeping last night, there was an earthquake.","jp":"<ruby>昨夜<rt>さくや</rt></ruby><ruby>寝<rt>ね</rt></ruby>ている<ruby>間<rt>あいだ</rt></ruby>に、<ruby>地震<rt>じしん</rt></ruby>がありました。","rj":"Sakuya nete iru aida ni, jishin ga arimashita.","say":"昨夜寝ている間に、地震がありました。"},{"en":"While my mother is in Japan, I want to take her to Kyoto.","jp":"<ruby>母<rt>はは</rt></ruby>が<ruby>日本<rt>にほん</rt></ruby>にいる<ruby>間<rt>あいだ</rt></ruby>に、<ruby>京都<rt>きょうと</rt></ruby>に<ruby>連<rt>つ</rt></ruby>れて<ruby>行<rt>い</rt></ruby>きたいです。","rj":"Haha ga Nihon ni iru aida ni, Kyouto ni tsurete ikitai desu.","say":"母が日本にいる間に、京都に連れて行きたいです。"},{"en":"While I was out, a friend came over.","jp":"<ruby>留守<rt>るす</rt></ruby>の<ruby>間<rt>あいだ</rt></ruby>に、<ruby>友達<rt>ともだち</rt></ruby>が<ruby>来<rt>き</rt></ruby>ました。","rj":"Rusu no aida ni, tomodachi ga kimashita.","say":"留守の間に、友達が来ました。"},{"en":"The whole time Maki was using the computer, I waited reading a book.","jp":"まきがパソコンを<ruby>使<rt>つか</rt></ruby>っている<ruby>間<rt>あいだ</rt></ruby>、<ruby>私<rt>わたし</rt></ruby>は<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んで<ruby>待<rt>ま</rt></ruby>ちました。","rj":"Maki ga pasokon o tsukatte iru aida, watashi wa hon o yonde machimashita.","say":"まきがパソコンを使っている間、私は本を読んで待ちました。"},{"en":"While I was changing clothes, Taka kindly made coffee for me.","jp":"<ruby>私<rt>わたし</rt></ruby>が<ruby>着替<rt>きが</rt></ruby>えている<ruby>間<rt>あいだ</rt></ruby>に、たかがコーヒーを<ruby>作<rt>つく</rt></ruby>ってくれました。","rj":"Watashi ga kigaete iru aida ni, Taka ga koohii o tsukutte kuremashita.","say":"私が着替えている間に、たかがコーヒーを作ってくれました。"},{"en":"While the baby is sleeping, I will make dinner.","jp":"<ruby>赤<rt>あか</rt></ruby>ちゃんが<ruby>寝<rt>ね</rt></ruby>ている<ruby>間<rt>あいだ</rt></ruby>に、<ruby>夜<rt>よる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>作<rt>つく</rt></ruby>ります。","rj":"Akachan ga nete iru aida ni, yorugohan o tsukurimasu.","say":"赤ちゃんが寝ている間に、夜ご飯を作ります。"},{"en":"While you were taking a bath, there was a call from Ken.","jp":"あなたがお<ruby>風呂<rt>ふろ</rt></ruby>に<ruby>入<rt>はい</rt></ruby>っている<ruby>間<rt>あいだ</rt></ruby>に、けんから<ruby>電話<rt>でんわ</rt></ruby>がありました。","rj":"Anata ga ofuro ni haitte iru aida ni, Ken kara denwa ga arimashita.","say":"あなたがお風呂に入っている間に、けんから電話がありました。"}]},{"num":254,"title":"Adjective +する","vocab":[{"t":"寒い（さむい）","m":"samui 意思：冷 (cold)","say":"寒い（さむい）"},{"t":"上手（じょうず）","m":"jouzu 意思：擅長、厲害 (skillful)","say":"上手（じょうず）"},{"t":"部屋（へや）","m":"heya 意思：房間 (room)","say":"部屋（へや）"},{"t":"綺麗（きれい）","m":"kirei 意思：乾淨、漂亮 (clean/pretty)","say":"綺麗（きれい）"},{"t":"話（はなし）","m":"hanashi 意思：故事、話題 (story)","say":"話（はなし）"},{"t":"面白い（おもしろい）","m":"omoshiroi 意思：有趣 (interesting)","say":"面白い（おもしろい）"},{"t":"髪（かみ）","m":"kami 意思：頭髮 (hair)","say":"髪（かみ）"},{"t":"世界（せかい）","m":"sekai 意思：世界 (world)","say":"世界（せかい）"},{"t":"いい／よい","m":"ii/yoi 意思：好 (good)","say":"いい／よい"},{"t":"静か（しずか）","m":"shizuka 意思：安靜 (quiet)","say":"静か（しずか）"},{"t":"両親（りょうしん）","m":"ryoushin 意思：（雙方）父母 (parents)","say":"両親（りょうしん）"},{"t":"来る（くる）","m":"kuru 意思：來 (to come)","say":"来る（くる）"},{"t":"単語（たんご）","m":"tango 意思：單字 (vocabulary word)","say":"単語（たんご）"},{"t":"覚える（おぼえる）","m":"oboeru 意思：記住、背誦 (to memorize)","say":"覚える（おぼえる）"},{"t":"少ない（すくない）","m":"sukunai 意思：少 (few)","say":"少ない（すくない）"},{"t":"高い（たかい）","m":"takai 意思：貴、高 (expensive/tall)","say":"高い（たかい）"},{"t":"安い（やすい）","m":"yasui 意思：便宜 (cheap)","say":"安い（やすい）"},{"t":"同僚（どうりょう）","m":"douryou 意思：同事 (coworker)","say":"同僚（どうりょう）"},{"t":"汚い（きたない）","m":"kitanai 意思：髒 (dirty)","say":"汚い（きたない）"}],"grammar":["<b>形容詞＋する 是什麼意思？怎麼接？</b><br><br>意思是「使（某對象）變成～（的狀態）」，句型為「[對象]を[形容詞]＋する」。若為い形容詞，需去掉語尾的「い」改成「く」再加上「する」（例：可愛い→可愛くする）；若為な形容詞，則去掉「な」改成「に」再加上「する」（例：元気な→元気にする）。","<b>する 可以怎麼變化？</b><br><br>此句型中的「する」可依需要變化成て形、た形、ます形、意向形等各種時態與語氣，也有慣用用法，如「静かにする（使安靜）」「静かにしてください（請安靜）」。"],"example":[{"en":"I made the room clean.","jp":"<ruby>部屋<rt>へや</rt></ruby>を<ruby>綺麗<rt>きれい</rt></ruby>にしました。","rj":"Heya o kirei ni shimashita.","say":"部屋を綺麗にしました。"},{"en":"Please make the story more interesting.","jp":"<ruby>話<rt>はなし</rt></ruby>をおもしろくしてください。","rj":"Hanashi o omoshiroku shite kudasai.","say":"話をおもしろくしてください。"},{"en":"I want to make my hair like Mary's.","jp":"<ruby>髪<rt>かみ</rt></ruby>をメアリーみたいにしたいです。","rj":"Kami o Mearii mitai ni shitai desu.","say":"髪をメアリーみたいにしたいです。"},{"en":"Let's make the world better.","jp":"<ruby>世界<rt>せかい</rt></ruby>をよくしましょう。","rj":"Sekai o yoku shimashou.","say":"世界をよくしましょう。"},{"en":"To make it quiet.","jp":"<ruby>静<rt>しず</rt></ruby>かにする。","rj":"Shizuka ni suru.","say":"静かにする。"},{"en":"Please be quiet.","jp":"<ruby>静<rt>しず</rt></ruby>かにしてください。","rj":"Shizuka ni shite kudasai.","say":"静かにしてください。"},{"en":"Since my parents are coming, I have to clean the room.","jp":"<ruby>両親<rt>りょうしん</rt></ruby>がくるので、<ruby>部屋<rt>へや</rt></ruby>を<ruby>綺麗<rt>きれい</rt></ruby>にしなくちゃいけません。","rj":"Ryoushin ga kuru node, heya o kirei ni shinakucha ikemasen.","say":"両親がくるので、部屋を綺麗にしなくちゃいけません。"},{"en":"There are so many words to memorize. Please reduce the number.","jp":"<ruby>覚<rt>おぼ</rt></ruby>える<ruby>単語<rt>たんご</rt></ruby>がたくさんあります。<ruby>少<rt>すく</rt></ruby>なくしてください。","rj":"Oboeru tango ga takusan arimasu. Sukunaku shite kudasai.","say":"覚える単語がたくさんあります。少なくしてください。"},{"en":"Two thousand yen is too expensive. Could you make it cheaper?","jp":"2<ruby>千円<rt>にせんえん</rt></ruby>は<ruby>高<rt>たか</rt></ruby>すぎます。<ruby>安<rt>やす</rt></ruby>くしていただけませんか？","rj":"Nisen'en wa takasugimasu. Yasuku shite itadakemasen ka?","say":"2千円は高すぎます。安くしていただけませんか？"},{"en":"My coworker came to my room and made it dirty.","jp":"<ruby>同僚<rt>どうりょう</rt></ruby>が<ruby>部屋<rt>へや</rt></ruby>にきて、<ruby>部屋<rt>へや</rt></ruby>を<ruby>汚<rt>きたな</rt></ruby>くしました。","rj":"Douryou ga heya ni kite, heya o kitanaku shimashita.","say":"同僚が部屋にきて、部屋を汚くしました。"}]},{"num":255,"title":"〜てほしい","vocab":[{"t":"宿題（しゅくだい）","m":"shukudai 意思：作業 (homework)","say":"宿題（しゅくだい）"},{"t":"手伝う（てつだう）","m":"tetsudau 意思：幫忙 (to help)","say":"手伝う（てつだう）"},{"t":"ケーキ","m":"keeki 意思：蛋糕 (cake)","say":"ケーキ"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"たばこ","m":"tabako 意思：香菸 (cigarette)","say":"たばこ"},{"t":"吸う（すう）","m":"suu 意思：抽（菸） (to smoke)","say":"吸う（すう）"},{"t":"歌う（うたう）","m":"utau 意思：唱歌 (to sing)","say":"歌う（うたう）"},{"t":"静かな（しずかな）","m":"shizukana 意思：安靜的 (quiet)","say":"静かな（しずかな）"},{"t":"教える（おしえる）","m":"oshieru 意思：教 (to teach)","say":"教える（おしえる）"},{"t":"日本語（にほんご）","m":"nihongo 意思：日文 (Japanese)","say":"日本語（にほんご）"},{"t":"遅刻する（ちこくする）","m":"chikoku suru 意思：遲到 (to be late)","say":"遅刻する（ちこくする）"},{"t":"誕生日（たんじょうび）","m":"tanjoubi 意思：生日 (birthday)","say":"誕生日（たんじょうび）"},{"t":"パーティー","m":"paatii 意思：派對 (party)","say":"パーティー"},{"t":"来る（くる）","m":"kuru 意思：來 (to come)","say":"来る（くる）"},{"t":"プリン","m":"purin 意思：布丁 (pudding)","say":"プリン"}],"grammar":["<b>〜てほしい 是什麼意思？</b><br><br>用來表達「希望某人做某事」，由動詞的て形加上形容詞「ほしい」組成，希望對象的人以助詞「に」標示。過去式為「〜てほしかったです」，表示「（當時）希望…」。","<b>〜てほしい 的否定形有幾種說法？</b><br><br>有兩種：一是將動詞維持肯定て形、否定ほしい，變成「〜てほしくありません／〜てほしくないです」；二是將動詞改成否定て形（〜ないで）、保留ほしい肯定形，變成「〜ないでほしいです」，兩者意思相同。","<b>「想要」相關的三個說法怎麼分？</b><br><br>①〜たい（我想做…，動詞連用形＋たい）；②ほしい（我想要…，名詞＋が＋ほしい）；③〜てほしい（我希望某人做…，人＋に＋動詞て形＋ほしい）。"],"example":[{"en":"I want Ken to help me with my homework.","jp":"けんに<ruby>宿題<rt>しゅくだい</rt></ruby>を<ruby>手伝<rt>てつだ</rt></ruby>ってほしいです。","rj":"Ken ni shukudai o tetsudatte hoshii desu.","say":"けんに宿題を手伝ってほしいです。"},{"en":"I wanted Sato to eat the cake.","jp":"さとにケーキを<ruby>食<rt>た</rt></ruby>べてほしかったです。","rj":"Sato ni keeki o tabete hoshikatta desu.","say":"さとにケーキを食べてほしかったです。"},{"en":"I don't want Taka to smoke.","jp":"たかにたばこを<ruby>吸<rt>す</rt></ruby>ってほしくありません。","rj":"Taka ni tabako o sutte hoshiku arimasen.","say":"たかにたばこを吸ってほしくありません。"},{"en":"I don't want Taka to smoke.","jp":"たかにたばこを<ruby>吸<rt>す</rt></ruby>わないでほしいです。","rj":"Taka ni tabako o suwanaide hoshii desu.","say":"たかにたばこを吸わないでほしいです。"},{"en":"I don't want Misa to sing.","jp":"みさに<ruby>歌<rt>うた</rt></ruby>ってほしくありません。","rj":"Misa ni utatte hoshiku arimasen.","say":"みさに歌ってほしくありません。"},{"en":"I don't want Misa to sing.","jp":"みさに<ruby>歌<rt>うた</rt></ruby>わないでほしいです。","rj":"Misa ni utawanaide hoshii desu.","say":"みさに歌わないでほしいです。"},{"en":"I want Ken to be quiet.","jp":"けんに<ruby>静<rt>しず</rt></ruby>かにしてほしいです。","rj":"Ken ni shizuka ni shite hoshii desu.","say":"けんに静かにしてほしいです。"},{"en":"I want Takeshi to teach me Japanese.","jp":"たけしに<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてほしいです。","rj":"Takeshi ni nihongo o oshiete hoshii desu.","say":"たけしに日本語を教えてほしいです。"},{"en":"I don't want Mary to be late.","jp":"メアリーに<ruby>遅刻<rt>ちこく</rt></ruby>してほしくないです。","rj":"Mearii ni chikoku shite hoshikunai desu.","say":"メアリーに遅刻してほしくないです。"},{"en":"I don't want Mary to be late.","jp":"メアリーに<ruby>遅刻<rt>ちこく</rt></ruby>しないでほしいです。","rj":"Mearii ni chikoku shinaide hoshii desu.","say":"メアリーに遅刻しないでほしいです。"},{"en":"I had wanted Maki to come to my birthday party.","jp":"まきに<ruby>誕生日<rt>たんじょうび</rt></ruby>パーティーにきてほしかったです。","rj":"Maki ni tanjoubi paatii ni kite hoshikatta desu.","say":"まきに誕生日パーティーにきてほしかったです。"},{"en":"I hadn't wanted Hana to eat the pudding.","jp":"はなにプリンを<ruby>食<rt>た</rt></ruby>べてほしくなかったです。","rj":"Hana ni purin o tabete hoshikunakatta desu.","say":"はなにプリンを食べてほしくなかったです。"},{"en":"I hadn't wanted Hana to eat the pudding.","jp":"はなにプリンを<ruby>食<rt>た</rt></ruby>べないでほしかったです。","rj":"Hana ni purin o tabenaide hoshikatta desu.","say":"はなにプリンを食べないでほしかったです。"}]},{"num":256,"title":"Causative Sentences 1","vocab":[{"t":"泣く（なく）","m":"naku 意思：哭 (to cry)","say":"泣く（なく）"},{"t":"笑う（わらう）","m":"warau 意思：笑 (to laugh)","say":"笑う（わらう）"},{"t":"座る（すわる）","m":"suwaru 意思：坐 (to sit)","say":"座る（すわる）"},{"t":"部長（ぶちょう）","m":"buchou 意思：部長 (department manager)","say":"部長（ぶちょう）"},{"t":"残業する（ざんぎょうする）","m":"zangyou suru 意思：加班 (to work overtime)","say":"残業する（ざんぎょうする）"},{"t":"生徒（せいと）","m":"seito 意思：學生 (student)","say":"生徒（せいと）"},{"t":"調べる（しらべる）","m":"shiraberu 意思：查、調查 (to look up)","say":"調べる（しらべる）"},{"t":"辞書（じしょ）","m":"jisho 意思：字典 (dictionary)","say":"辞書（じしょ）"},{"t":"出張（しゅっちょう）","m":"shucchou 意思：出差 (business trip)","say":"出張（しゅっちょう）"},{"t":"持っていく（もっていく）","m":"motte iku 意思：帶去 (to bring, take (something))","say":"持っていく（もっていく）"},{"t":"携帯電話（けいたいでんわ）","m":"keitai denwa 意思：手機 (cellphone)","say":"携帯電話（けいたいでんわ）"},{"t":"使う（つかう）","m":"tsukau 意思：使用 (to use)","say":"使う（つかう）"}],"grammar":["<b>使役形是什麼意思？動詞要怎麼變成使役形？</b><br><br>使役形用來描述「誰讓／使某人做某事」（可以是強迫，也可以是允許）。Ru-verb（一段動詞）：去掉語尾「る」，加上「させる」（食べる→食べさせる）。U-verb（五段動詞）：語尾u音改為aseru（行く iku→行かせる ikaseru）。不規則動詞：する→させる、くる→こさせる。","<b>使役句的句型結構是什麼？</b><br><br>[Director]は／が　[Cast]に　[Action（使役形）]。Director（下令者）是決定該做什麼的人，用「は」或「が」標示；Cast（執行者）是實際做出動作的人，通常用「に」標示。","<b>什麼時候 Cast 要用「を」而不是「に」標示？</b><br><br>有兩種情況：①使役動作是「反射性」的行為（如哭、笑），例如：私はその子供を泣かせてしまいました。②被使役化的動詞本身原本就不需要を（如「行く」「座る」這類自動詞），例如：先生は私をトイレに行かせました。若動詞本身已經需要を（如「読む」），Cast就必須用に，不能用を，因為を已經被原本的受詞占用。"],"example":[{"en":"The father made/let his child eat vegetables.","jp":"お<ruby>父<rt>とう</rt></ruby>さんは<ruby>子供<rt>こども</rt></ruby>に<ruby>野菜<rt>やさい</rt></ruby>を<ruby>食<rt>た</rt></ruby>べさせました。","rj":"Otousan wa kodomo ni yasai o tabesasemashita.","say":"お父さんは子供に野菜を食べさせました。"},{"en":"The mother made/let her child read the book.","jp":"お<ruby>母<rt>かあ</rt></ruby>さんは<ruby>子供<rt>こども</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>ませました。","rj":"Okaasan wa kodomo ni hon o yomasemashita.","say":"お母さんは子供に本を読ませました。"},{"en":"I accidentally made the child cry.","jp":"<ruby>私<rt>わたし</rt></ruby>はその<ruby>子供<rt>こども</rt></ruby>を<ruby>泣<rt>な</rt></ruby>かせてしまいました。","rj":"Watashi wa sono kodomo o nakasete shimaimashita.","say":"私はその子供を泣かせてしまいました。"},{"en":"Allen made everyone laugh.","jp":"アレンはみんなを<ruby>笑<rt>わら</rt></ruby>わせました。","rj":"Aren wa minna o warawasemashita.","say":"アレンはみんなを笑わせました。"},{"en":"The teacher made me go to the bathroom.","jp":"<ruby>先生<rt>せんせい</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>をトイレに<ruby>行<rt>い</rt></ruby>かせました。","rj":"Sensei wa watashi o toire ni ikasemashita.","say":"先生は私をトイレに行かせました。"},{"en":"That person made me sit there.","jp":"その<ruby>人<rt>ひと</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>をそこに<ruby>座<rt>すわ</rt></ruby>らせました。","rj":"Sono hito wa watashi o soko ni suwarasemashita.","say":"その人は私をそこに座らせました。"},{"en":"Maki made me read books.","jp":"まきは<ruby>私<rt>わたし</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>ませました。","rj":"Maki wa watashi ni hon o yomasemashita.","say":"まきは私に本を読ませました。"},{"en":"The department manager ordered Ken to work overtime.","jp":"<ruby>部長<rt>ぶちょう</rt></ruby>はけんを<ruby>残業<rt>ざんぎょう</rt></ruby>させました。","rj":"Buchou wa Ken o zangyou sasemashita.","say":"部長はけんを残業させました。"},{"en":"The teacher made the students look the word up in a dictionary.","jp":"<ruby>先生<rt>せんせい</rt></ruby>は<ruby>生徒<rt>せいと</rt></ruby>に<ruby>辞書<rt>じしょ</rt></ruby>で<ruby>言葉<rt>ことば</rt></ruby>を<ruby>調<rt>しら</rt></ruby>べさせました。","rj":"Sensei wa seito ni jisho de kotoba o shirabesasemashita.","say":"先生は生徒に辞書で言葉を調べさせました。"},{"en":"The department manager plans on making Ken go on a business trip.","jp":"<ruby>部長<rt>ぶちょう</rt></ruby>はけんを<ruby>出張<rt>しゅっちょう</rt></ruby>に<ruby>行<rt>い</rt></ruby>かせるつもりです。","rj":"Buchou wa Ken o shucchou ni ikaseru tsumori desu.","say":"部長はけんを出張に行かせるつもりです。"},{"en":"Ken will let Mary bring his phone.","jp":"けんはメアリーに<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>を<ruby>持<rt>も</rt></ruby>っていかせます。","rj":"Ken wa Meari- ni keitaidenwa o motte ikasemasu.","say":"けんはメアリーに携帯電話を持っていかせます。"},{"en":"Will you allow Taka to use your car?","jp":"たかに<ruby>車<rt>くるま</rt></ruby>を<ruby>使<rt>つか</rt></ruby>わせますか？","rj":"Taka ni kuruma o tsukawasemasu ka?","say":"たかに車を使わせますか？"}]},{"num":257,"title":"Causative Sentences 2","vocab":[{"t":"両親（りょうしん）","m":"ryoushin 意思：雙親 (parents)","say":"両親（りょうしん）"},{"t":"飼う（かう）","m":"kau 意思：飼養 (to own (a pet))","say":"飼う（かう）"},{"t":"一人暮らしする（ひとりぐらしする）","m":"hitorigurashi suru 意思：獨自生活 (to live alone)","say":"一人暮らしする（ひとりぐらしする）"},{"t":"弾く（ひく）","m":"hiku 意思：彈奏（樂器） (to play (an instrument))","say":"弾く（ひく）"},{"t":"ギター（ぎたー）","m":"gita- 意思：吉他 (guitar)","say":"ギター（ぎたー）"},{"t":"パソコン（ぱそこん）","m":"pasokon 意思：筆記型電腦 (laptop)","say":"パソコン（ぱそこん）"},{"t":"パスタ（ぱすた）","m":"pasuta 意思：義大利麵 (pasta)","say":"パスタ（ぱすた）"},{"t":"休憩する（きゅうけいする）","m":"kyuukei suru 意思：休息 (to take a break)","say":"休憩する（きゅうけいする）"},{"t":"仕事（しごと）","m":"shigoto 意思：工作 (job)","say":"仕事（しごと）"}],"grammar":["<b>使役形＋てあげる／てもらう／てくれる 是什麼意思？</b><br><br>當使役動詞後面接上てあげる、てくれる、或てもらう，幾乎可以確定這是「allow／let（允許）」的使役，而非「force（強迫）」的使役。句型：[Director]は　[Cast]に　[使役動詞て形]＋あげる／もらう／くれる，Director與Cast的關係、助詞用法分別遵循あげる／もらう／くれる各自原本的規則。","<b>使役形＋てください 是什麼意思？</b><br><br>用於請求對方允許自己做某事，或主動表示願意做某事，相當於英文「Please let me do…」。句型：[使役動詞て形]＋ください。此句型中說話者本身就是Cast，因此常省略「私に」。"],"example":[{"en":"Taka did not allow me to speak in English.","jp":"たかは<ruby>私<rt>わたし</rt></ruby>に<ruby>英語<rt>えいご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>させてくれませんでした。","rj":"
