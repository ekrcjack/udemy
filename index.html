<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Hiragino Sans","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:linear-gradient(165deg,#fdf2f6 0%,#f3eefb 55%,#eef4fb 100%);
  color:#2c2438;padding:14px 10px 70px;line-height:1.7}
.wrap{max-width:960px;margin:0 auto}
header{text-align:center;background:#fff;border-radius:18px;padding:22px 16px;
  box-shadow:0 6px 22px rgba(107,76,154,.10);margin-bottom:16px}
h1{font-size:1.6rem;color:#4a2d6b;letter-spacing:.02em}
.sub{color:#8b6ba8;font-size:.9rem;margin-top:6px}
.stat{font-size:.82rem;color:#7a6a90;margin-top:8px}
#q{width:100%;max-width:420px;margin:14px auto 0;display:block;padding:9px 14px;
  border:1.5px solid #ddd0f0;border-radius:999px;font-size:.92rem;outline:none}
#q:focus{border-color:#6b4c9a}
.rate{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:10px;font-size:.8rem;color:#7a6a90}

.tabbar{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 12px;margin-bottom:2px;
  -webkit-overflow-scrolling:touch}
.tabbar::-webkit-scrollbar{height:5px}
.tabbar::-webkit-scrollbar-thumb{background:#d7c8ea;border-radius:4px}
.tab{flex:0 0 auto;background:#fff;color:#6b4c9a;border:1.5px solid #e4d8f5;border-radius:999px;
  padding:8px 15px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.tab.on{background:#6b4c9a;color:#fff;border-color:#6b4c9a}

.chapter{background:#fff;border-radius:16px;padding:16px 16px 8px;margin-bottom:16px;
  box-shadow:0 4px 14px rgba(0,0,0,.055);border-top:5px solid #6b4c9a}
.chapter h2{font-size:1.08rem;color:#4a2d6b;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.chapter h2 .num{color:#a98fd0;font-weight:400;margin-right:6px}
.chapter h2 .car{color:#c3b3dd;font-size:.8rem;transition:transform .15s}
.chapter.closed h2 .car{transform:rotate(-90deg)}
.chapter .body{margin-top:10px}
.chapter.closed .body{display:none}

.section-label{font-size:.82rem;font-weight:700;color:#fff;background:#6b4c9a;
  display:inline-block;padding:3px 11px;border-radius:999px;margin:14px 0 9px}
.section-label.vocab{background:#2e9b57}
.section-label.grammar{background:#2b7bd4}
.section-label.example{background:#c8892f}
.empty-note{font-size:.8rem;color:#b3a9c2;margin:4px 0 10px;font-style:italic}

.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:6px}
.vcard{border:1px solid #e3f0e8;background:#f7fcf9;border-radius:10px;padding:9px 11px;font-size:.88rem}
.vcard .term{font-weight:700;font-size:1.02rem;color:#227244}
.vcard .term ruby{ruby-position:over}
.vcard .term rt{font-size:.55em;color:#5a8f6f}
.vcard .meaning{color:#4b5c52;font-size:.82rem;margin-top:3px}
.vcard .sp{margin-left:4px;cursor:pointer;border:none;background:none;font-size:.85rem}

.gcard{border-left:4px solid #cfe1f7;background:#f6faff;border-radius:8px;
  padding:9px 12px;margin-bottom:8px;font-size:.9rem;color:#2d4560}
.gcard b{color:#1c4f8f}
.gcard ruby{ruby-position:over}
.gcard rt{font-size:.6em;color:#7793b3}
.mdtable{overflow-x:auto;margin:8px 0}
.mdtable table{border-collapse:collapse;width:100%;font-size:.85rem}
.mdtable th,.mdtable td{border:1px solid #d7e3f5;padding:6px 10px;text-align:center;white-space:nowrap}
.mdtable th{background:#eaf1fc;color:#1c4f8f}
.mdtable td:first-child{text-align:left}

.ecard{border:1px solid #f3e6d0;background:#fffaf2;border-radius:10px;padding:10px 13px;margin-bottom:8px}
.ecard .en{color:#a67a2e;font-size:.83rem;font-style:italic}
.ecard .jp{font-size:1.05rem;margin-top:5px;color:#3a2f1a}
.ecard .jp ruby{ruby-position:over}
.ecard .jp rt{font-size:.55em;color:#a67a2e}
.ecard .zh{color:#5c6b7a;font-size:.85rem;margin-top:4px}
.ecard .rj{color:#9a8f7d;font-size:.8rem;margin-top:3px;font-style:italic;letter-spacing:.01em}
.ecard .sp{margin-top:6px;border:none;background:#6b4c9a;color:#fff;border-radius:999px;
  padding:4px 12px;font-size:.78rem;cursor:pointer}
.ecard .sp:hover{background:#573b80}

.hide{display:none !important}
footer{text-align:center;font-size:.78rem;color:#a99bc0;margin-top:20px}
</style>
</head>

xample":[]},{"num":20,"title":"Bigger numbers","vocab":[{"t":"英文和日文計算數字的「基本單位」不同。","m":"兩者各自以什麼作為1個單位來計數？ 英文：以1,000（thousand）為1個單位來計數 ・10,000 = 10 × 1,000 → ten-thousand ・100,000 = 100 × 1,000 → hundred-thousand","say":"英文和日文計算數字的「基本單位」不同。"},{"t":"12,000 的日文讀法是？","m":"いちまん にせん (ichiman nisen) 1（万）= いちまん 2,000 = にせん","say":"いちまん にせん"}],"grammar":["<b>日文</b>：以10,000（万）為1個單位來計數  <br>・10,000 = 1 × 10,000 → <b>いちまん (ichiman)</b>  <br>・100,000 = 10 × 10,000 → <b>じゅうまん (juuman)</b><br><br>**日文的數字每幾位數就會換成新的單位（まん・おく）？  <br>（4位一組的規則）**<br><br>日文是<b>每4位數</b>換一次單位（10、100、1,000 都屬於同一個「せん」群組，從10,000開始才是新的「まん」群組）<br><br><div class=\"mdtable\"><table><tr><th>English</th><th>數字</th><th>日本語</th></tr><tr><td>One</td><td>1</td><td>いち</td></tr><tr><td>Ten</td><td>10</td><td>じゅう</td></tr><tr><td>Hundred</td><td>100</td><td>ひゃく</td></tr><tr><td>Thousand</td><td>1,000</td><td>せん</td></tr><tr><td>Ten thousand</td><td>10,000</td><td>（いち）まん</td></tr><tr><td>Hundred thousand</td><td>100,000</td><td>じゅうまん</td></tr><tr><td>Million</td><td>1,000,000</td><td>ひゃくまん</td></tr><tr><td>Ten Million</td><td>10,000,000</td><td>せんまん</td></tr><tr><td>Hundred Million</td><td>100,000,000</td><td>（いち）おく</td></tr><tr><td>Billion</td><td>1,000,000,000</td><td>じゅうおく</td></tr></table></div>","**英文的數字每幾位數就會換成新的單位（thousand・million・billion）？  <br>（3位一組的規則）**<br><br>英文是<b>每3位數</b>換一次單位（thousand → million → billion），但日文是每4位數換一次（まん → おく），因此英文的逗號位置和日文「まん」的位置會錯開。<br><br><div class=\"mdtable\"><table><tr><th>English</th><th>數字</th><th>日本語</th></tr><tr><td>One</td><td>1</td><td>いち</td></tr><tr><td>Ten</td><td>10</td><td>じゅう</td></tr><tr><td>Hundred</td><td>100</td><td>ひゃく</td></tr><tr><td>Thousand</td><td>1,000</td><td>せん</td></tr><tr><td>Ten thousand</td><td>10,000</td><td>（いち）まん</td></tr><tr><td>Hundred thousand</td><td>100,000</td><td>じゅうまん</td></tr><tr><td>Million</td><td>1,000,000</td><td>ひゃくまん</td></tr><tr><td>Ten Million</td><td>10,000,000</td><td>せんまん</td></tr><tr><td>Hundred Million</td><td>100,000,000</td><td>（いち）おく</td></tr><tr><td>Billion</td><td>1,000,000,000</td><td>じゅうおく</td></tr></table></div>","<b>362,500 的日文讀法是？</b><br><br><b>さんじゅうろくまん にせんごひゃく</b>  <br>(sanjuu rokuman nisen gohyaku)<br><br>36（万）= さんじゅうろくまん  <br>2,500 = にせんごひゃく","<b>6,023,080 的日文讀法是？</b><br><br><b>ろっぴゃくにまん さんぜんはちじゅう</b>  <br>(roppyaku niman sanzen hachijuu)<br><br>602（万）= ろっぴゃくにまん  <br>3,080 = さんぜんはちじゅう"],"example":[]},{"num":23,"title":"Time","vocab":[{"t":"午前","m":"ごぜん（gozen） AM（上午）","say":"午前"},{"t":"午後","m":"ごご（gogo） PM（下午）","say":"午後"},{"t":"正午","m":"しょうご（shougo） Noon（中午12點）","say":"正午"},{"t":"深夜","m":"しんや（shinya） Midnight（午夜12點）","say":"深夜"},{"t":"日文「幾分」的規則是什麼？（分）","m":"依數字結尾分三種讀法： ふん (fun)：結尾2,5,7,9 → にふん、ごふん、ななふん、きゅうふん ぷん (pun)：結尾3,4 → さんぷん、よんぷん っぷん (ppun)：結尾1,6,8,0 → いっぷん、ろっぷん、はっぷん、じゅっぷん","say":"依數字結尾分三種讀法： ふん"},{"t":"【總結】時間讀法規則總覽","m":"時：數字＋時（じ） 分： ・ふん(fun)：2,5,7,9 ・ぷん(pun)：3,4 ・っぷん(ppun)：1,6,8,0 30分也可說 半（はん）","say":"時：數字＋<ruby>時<rt>じ</rt></ruby> 分： ・ふん"},{"t":"午前1時（1AM）怎麼唸？","m":"ごぜんいちじ（gozen ichiji）","say":"ごぜんいちじ"},{"t":"午後1時 / 13時（1PM）怎麼唸？","m":"ごごいちじ（gogo ichiji）／じゅうさんじ（juusanji）","say":"ごごいちじ"},{"t":"午後4時 / 16時（4PM）怎麼唸？","m":"ごごよじ（gogo yoji）／じゅうろくじ（juurokuji）","say":"ごごよじ"},{"t":"深夜12時 / 24時（12AM午夜）怎麼唸？","m":"しんやじゅうにじ（shinya juuniji）／にじゅうよじ（nijuuyoji）","say":"しんやじゅうにじ"},{"t":"正午12時（12PM中午）怎麼唸？","m":"しょうごじゅうにじ（shougo juuniji）","say":"しょうごじゅうにじ"},{"t":"8:34AM 怎麼唸？","m":"午前8時34分 ごぜんはちじさんじゅうよんぷん（gozen hachiji sanjuuyonpun）","say":"午前8時34分 ごぜんはちじさんじゅうよんぷん"},{"t":"12:26PM 怎麼唸？","m":"正午12時26分 しょうごじゅうにじにじゅうろっぷん（shougo juuniji nijuuroppun）","say":"正午12時26分 しょうごじゅうにじにじゅうろっぷん"},{"t":"3:13PM 怎麼唸？","m":"午後3時13分 ごごさんじじゅうさんぷん（gogo sanji juusanpun）","say":"午後3時13分 ごごさんじじゅうさんぷん"},{"t":"7:30PM 怎麼唸？（用分）","m":"午後7時30分 ごごしちじさんじゅっぷん（gogo shichiji sanjuppun）","say":"午後7時30分 ごごしちじさんじゅっぷん"},{"t":"7:30PM 怎麼唸？（用半）","m":"午後7時半 ごごしちじはん（gogo shichiji han）","say":"午後7時半 ごごしちじはん"},{"t":"「現在幾點？」日文怎麼說？","m":"今、何時ですか？ いま、なんじですか？（ima nanji desuka?）","say":null}],"grammar":["<b>12點時，「午前／午後」要怎麼換說？</b><br><br>中午12點 → <b>正午</b>12<ruby>時<rt>しょうごじゅうにじ</rt></ruby>  <br>午夜12點 → <b>深夜</b>12<ruby>時<rt>しんやじゅうにじ</rt></ruby>或 24<ruby>時<rt>にじゅうよじ</rt></ruby>  <br>不用「午前12時／午後12時」","<b>「現在是下午1點40分」日文怎麼說？</b><br><br>今、午後1時40分です。  <br>いま、ごごいちじよんじゅっぷんです。（ima gogo ichiji yonjuppun desu.）"],"example":[]},{"num":55,"title":"Time reference","vocab":[{"t":"毎日","m":"まいにち / mainichi Everyday（每天）","say":"毎日"},{"t":"いつ","m":"itsu When（什麼時候、何時）","say":"いつ"},{"t":"朝","m":"あさ / asa (in the) morning（早上）","say":"朝"},{"t":"夜","m":"よる / yoru (at) night（晚上）","say":"夜"},{"t":"週末","m":"しゅうまつ / shuumatsu Weekend（週末）","say":"週末"},{"t":"平日","m":"へいじつ / heijitsu Weekday（平日）","say":"平日"},{"t":"日文如何問「你什麼時候去圖書館？」","m":"いつ図書館（としょかん）に行きますか？ itsu toshokan ni ikimasu ka? いつ=when　図書館=library　に=方向助詞　行きます=to go　か=疑問助詞 回答範例（對應三種規則）： ・日曜日に行きます。（星期幾 → 必須加に） ・毎日行きます。（規律間隔 → 絕不加に） ・朝行きます。（時段 → 可加可不加に）","say":"いつ<ruby>図書館<rt>としょかん</rt></ruby>に行きますか？ いつ"}],"grammar":["<b>時間參照詞有幾種類型？分別是什麼？</b><br><br>共有 <b>3種類型</b>，依是否需要助詞「に」區分：  <br>(1) <b>ALWAYS</b> require 「に」  <br>(2) <b>NEVER</b> require 「に」  <br>(3) <b>SOMETIMES</b> require 「に」（依語氣、強調、個人習慣而定）","<b>NEVER に</b>：現在基準詞（今日/明日）、規律間隔詞（毎日）、疑問詞「いつ」","<b>SOMETIMES に</b>：一天中時段（朝/夜）、週末  <br>（視語氣、強調、個人習慣而定）"],"example":[]},{"num":62,"title":"Frequency Adverbs","vocab":[{"t":"日文頻度副詞的頻率程度對照表（從高到低）","m":"いつも（itsumo）— Always（最高，100%） たいてい（taitei）— Usually よく（yoku）— Often 時々／たまに（tokidoki／tamani）— Sometimes あまり（amari）— Not much（需搭配否定） 全然（zenzen）— Never, at all（最低，0%，需搭配否定） 規則： ・頻度副詞通常放在は之後 ・使用あまり／ぜんぜん時，句","say":"日文頻度副詞的頻率程度對照表（從高到低）"},{"t":"いつも","m":"讀音：いつも 羅馬字：itsumo 意思：總是、always 使用頻率程度：100%（最高）","say":"いつも"},{"t":"たいてい","m":"讀音：たいてい 羅馬字：taitei 意思：通常、usually 使用頻率程度：很高","say":"たいてい"},{"t":"よく","m":"讀音：よく 羅馬字：yoku 意思：經常、often 使用頻率程度：高","say":"よく"},{"t":"時々（ときどき）","m":"讀音：ときどき 羅馬字：tokidoki 意思：有時候、sometimes 使用頻率程度：中等","say":"時々（ときどき）"},{"t":"たまに","m":"讀音：たまに 羅馬字：tamani 意思：偶爾、sometimes（偶爾） 使用頻率程度：中等偏低","say":"たまに"},{"t":"<ruby>毎<rt>まい</rt></ruby>","m":"讀音：まい 羅馬字：mai 意思：這個漢字表示「every／每」","say":"<ruby>毎<rt>まい</rt></ruby>"},{"t":"<ruby>毎日<rt>まいにち</rt></ruby>","m":"讀音：まいにち 羅馬字：mainichi 意思：每天、everyday （毎＝every，日＝day）","say":"<ruby>毎日<rt>まいにち</rt></ruby>"},{"t":"<ruby>毎週<rt>まいしゅう</rt></ruby>","m":"讀音：まいしゅう 羅馬字：maishuu 意思：每週、every week （毎＝every，週＝week）","say":"<ruby>毎週<rt>まいしゅう</rt></ruby>"},{"t":"<ruby>毎月<rt>まいつき</rt></ruby>","m":"讀音：まいつき 羅馬字：maitsuki 意思：每月、every month （毎＝every，月＝month）","say":"<ruby>毎月<rt>まいつき</rt></ruby>"},{"t":"<ruby>毎年<rt>まいとし</rt></ruby>","m":"讀音：まいとし 羅馬字：maitoshi 意思：每年、every year （毎＝every，年＝year）","say":"<ruby>毎年<rt>まいとし</rt></ruby>"}],"grammar":["<b>頻度副詞（Frequency Adverbs）在句子中的位置規則？</b><br><br>可以在句子中加入<b>頻度副詞</b>，說明做某件事的頻率高低。<br><br>※ 頻度副詞通常緊接在<b>は</b>的後面。"],"example":[{"en":"（I do not watch TV at all.）","jp":"<ruby>私<rt>わたし</rt></ruby>はぜんぜんテレビを<ruby>見<rt>み</rt></ruby>ません。","rj":"Watashi wa zenzenterebi o mimasen.","say":"私はぜんぜんテレビを見ません。"},{"en":"（I do not watch TV at all.）","jp":"たけしさんはあまり<ruby>勉強<rt>べんきょう</rt></ruby>しません。","rj":"Takeshisan wa amari benkyoushimasen.","say":"たけしさんはあまり勉強しません。"}]},{"num":110,"title":"たくさん","vocab":[],"grammar":["<b>「たくさん」放在助詞「を」之後：我拍了很多照片。</b><br><br><ruby>写真<rt>しゃしん</rt></ruby>を<b>たくさん</b><ruby>撮<rt>と</rt></ruby>りました。  <br>(shashin o takusan torimashita.)  <br>“I took many pictures.”","<b>「たくさん」放在名詞前面：我拍了很多照片。</b><br><br><b>たくさん</b><ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>りました。  <br>(takusan shashin o torimashita.)  <br>“I took many pictures.”","<b>「たくさん」放在助詞「を」之後：我吃了很多蔬菜。</b><br><br><ruby>野菜<rt>やさい</rt></ruby>を<b>たくさん</b><ruby>食<rt>た</rt></ruby>べました。  <br>(yasai o takusan tabemashita.)  <br>“I ate a lot of vegetables.”","<b>「たくさん」放在名詞前面：我吃了很多蔬菜。</b><br><br><b>たくさん</b><ruby>野菜<rt>やさい</rt></ruby>を<ruby>食<rt>た</rt></ruby>べました。  <br>(takusan yasai o tabemashita.)  <br>“I ate a lot of vegetables.”","<b>「たくさん」放在名詞前面：我在公園看到很多人。</b><br><br><ruby>公園<rt>こうえん</rt></ruby>で<b>たくさん</b><ruby>人<rt>ひと</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。  <br>(kouen de takusan hito o mimashita.)  <br>“I saw a lot of people at the park.”","<b>「たくさん」放在助詞「を」之後：我在公園看到很多人。</b><br><br><ruby>公園<rt>こうえん</rt></ruby>で<ruby>人<rt>ひと</rt></ruby>を<b>たくさん</b><ruby>見<rt>み</rt></ruby>ました。  <br>(kouen de hito o takusan mimashita.)  <br>“I saw a lot of people at the park.”","<b>「たくさん」放在名詞前面：我星期日看了很多電影。</b><br><br><ruby>日曜日<rt>にちようび</rt></ruby><b>たくさん</b><ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。  <br>(nichiyoubi takusan eiga o mimashita.)  <br>“I watched a lot of movies on Sunday.”","<b>「たくさん」放在助詞「を」之後：我星期日看了很多電影。</b><br><br><ruby>日曜日<rt>にちようび</rt></ruby><ruby>映画<rt>えいが</rt></ruby>を<b>たくさん</b><ruby>見<rt>み</rt></ruby>ました。  <br>(nichiyoubi eiga o takusan mimashita.)  <br>“I watched a lot of movies on Sunday.”","<b>總結：「たくさん」的兩種放置方式，對照四個例句分別怎麼說？</b><br><br><b>名詞前</b> vs <b>を之後</b>：<br><br>1. 照片：たくさん<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>りました。／<ruby>写真<rt>しゃしん</rt></ruby>をたくさん<ruby>撮<rt>と</rt></ruby>りました。（我拍了很多照片。）<br>2. 蔬菜：たくさん<ruby>野菜<rt>やさい</rt></ruby>を<ruby>食<rt>た</rt></ruby>べました。／<ruby>野菜<rt>やさい</rt></ruby>をたくさん<ruby>食<rt>た</rt></ruby>べました。（我吃了很多蔬菜。）<br>3. 公園的人：<ruby>公園<rt>こうえん</rt></ruby>でたくさん<ruby>人<rt>ひと</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。／<ruby>公園<rt>こうえん</rt></ruby>で<ruby>人<rt>ひと</rt></ruby>をたくさん<ruby>見<rt>み</rt></ruby>ました。（我在公園看到很多人。）<br>4. 電影：<ruby>日曜日<rt>にちようび</rt></ruby>たくさん<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。／<ruby>日曜日<rt>にちようび</rt></ruby><ruby>映画<rt>えいが</rt></ruby>をたくさん<ruby>見<rt>み</rt></ruby>ました。（我星期日看了很多電影。）<br><br>規則：たくさん可放在名詞前，或放在助詞「を」之後，意思不變。"],"example":[{"en":"shashin o takusan torimashita.","jp":"<ruby>写真<rt>しゃしん</rt></ruby>をたくさん<ruby>撮<rt>と</rt></ruby>りました。","rj":"Shashin o takusan torimashita.","say":"写真をたくさん撮りました。"},{"en":"shashin o takusan torimashita.","jp":"たくさん<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>りました。","rj":"Takusan shashin o torimashita.","say":"たくさん写真を撮りました。"}]},{"num":112,"title":"1時間","vocab":[{"t":"Second（時間單位）","m":"秒 （びょう - byou）","say":"時間單位"},{"t":"Minute（時間單位）","m":"分 （ふん - fun）","say":"時間單位"},{"t":"Time, hour（時間單位）","m":"時間 （じかん - jikan）","say":"時間單位"},{"t":"Day（時間單位）","m":"日 （にち - nichi）","say":"時間單位"},{"t":"Week（時間單位）","m":"週 （しゅう - shuu）","say":"時間單位"},{"t":"Month（時間單位）","m":"月 （つき - tsuki）","say":"時間單位"},{"t":"Year（時間單位）","m":"年 （ねん - nen）","say":"時間單位"},{"t":"「---秒（鐘）」怎麼說？","m":"--- 秒間 （びょうかん - byoukan）","say":"秒間 （びょうかん"},{"t":"「---小時」怎麼說？","m":"--- 時間 （じかん - jikan）","say":"時間 （じかん"},{"t":"「---天」怎麼說？","m":"--- 日間 （にちかん - nichikan）","say":"日間 （にちかん"},{"t":"「---週」怎麼說？","m":"--- 週間 （しゅうかん - shuukan）","say":"週間 （しゅうかん"},{"t":"「---個月」怎麼說？","m":"--- ヶ月間 （かげつかん - kagetsukan）","say":"ヶ月間 （かげつかん"},{"t":"「---年」怎麼說？","m":"--- 年間 （ねんかん - nenkan）","say":"年間 （ねんかん"},{"t":"如何表示大約的時間長度？","m":"在～間（かん - kan）後面加上ぐらい（gurai），即可表示大約的時間長度。","say":"在～間（かん"}],"grammar":["**「---分（鐘）」怎麼說？  <br>（注意：讀法會依前面數字產生音變）**<br><br>--- 分間  <br>ふんかん funkan / ぷんかん punkan / っぷんかん ppunkan"],"example":[{"en":"Mary waited for Takeshi for an hour.","jp":"メアリーはたけしを1<ruby>時間<rt>いちじかん</rt></ruby><ruby>待<rt>ま</rt></ruby>ちました。","rj":"Mary wa Takeshi o ichijikan machimashita.","say":"メアリーはたけしを1時間待ちました。"},{"en":"Mary waited for Takeshi for about an hour.","jp":"メアリーはたけしを1<ruby>時間<rt>いちじかん</rt></ruby>ぐらい<ruby>待<rt>ま</rt></ruby>ちました。","rj":"Mary wa Takeshi o ichijikan gurai machimashita.","say":"メアリーはたけしを1時間ぐらい待ちました。"},{"en":"Takeshi ran for 30 minutes at the park.","jp":"たけしは<ruby>公園<rt>こうえん</rt></ruby>で30<ruby>分間<rt>さんじゅっぷんかん</rt></ruby><ruby>走<rt>はし</rt></ruby>りました。","rj":"Takeshi wa kouen de sanjuppun kan hashirimashita.","say":"たけしは公園で30分間走りました。"},{"en":"I slept for about 8 hours last night.","jp":"わたしは<ruby>昨晩<rt>さくばん</rt></ruby>8<ruby>時間<rt>はちじかん</rt></ruby><ruby>寝<rt>ね</rt></ruby>ました。","rj":"Watashi wa sakuban hachijikan nemashita.","say":"わたしは昨晩8時間寝ました。"},{"en":"I read the book for 4 hours on Saturday.","jp":"<ruby>土曜日<rt>どようび</rt></ruby><ruby>本<rt>ほん</rt></ruby>を4<ruby>時間<rt>よじかん</rt></ruby><ruby>読<rt>よ</rt></ruby>みました。","rj":"Doyoubi hon o 4 yojikan yomimashita.","say":"土曜日本を4時間読みました。"}]}],"basic":[{"num":26,"title":"XはYです","vocab":[{"t":"「我」和「我們」的日文怎麼說？","m":"私（わたし・watashi） - 我 私達（わたしたち・watashitachi） - 我們","say":"私 - 我 私達 - 我們"},{"t":"「你」和「你們」的日文怎麼說？","m":"あなた（anata） - 你 あなた達（あなたたち・anatatachi） - 你們","say":"あなた"},{"t":"「他」和「他們」的日文怎麼說？","m":"彼（かれ・kare） - 他 彼達（かれたち・karetachi）或 彼ら（かれら・karera） - 他們","say":"彼 - 他 彼達或 彼ら - 他們"}],"grammar":["<b>「她」和「她們」的日文怎麼說？</b><br><br>彼女（かのじょ・kanojo） - 她  <br>彼女達（かのじょたち・kanojotachi）或 彼女ら（かのじょら・kanojora） - 她們","<b>整理：「XはYです。」句型的重點規則有哪些？</b><br><br><b>XはYです。</b> means <b>X is Y.</b><br><br>1. 「は」作助詞時讀作 <b>WA</b>，不是 HA。<br>2. 「です。」用於<b>現在時態</b>。<br>3. 「でした。」用於<b>過去時態</b>，取代「です。」"],"example":[{"en":"I am Japanese.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>日本人<rt>にほんじん</rt></ruby>です。","rj":"watashi wa nihonjin desu.","say":"私は日本人です。"},{"en":"You are a student.","jp":"あなたは<ruby>学生<rt>がくせい</rt></ruby>です。","rj":"anata wa gakusei desu.","say":"あなたは学生です。"},{"en":"Today is Monday.","jp":"<ruby>今日<rt>きょう</rt></ruby>は<ruby>月曜日<rt>げつようび</rt></ruby>です。","rj":"kyou wa getsuyoubi desu.","say":"今日は月曜日です。"},{"en":"Yesterday was Sunday.","jp":"<ruby>昨日<rt>きのう</rt></ruby>は<ruby>日曜日<rt>にちようび</rt></ruby>でした。","rj":"kinou wa nichiyoubi deshita.","say":"昨日は日曜日でした。"},{"en":"Dinner was Sushi.","jp":"夜ご<ruby>飯<rt>よるごはん</rt></ruby>は<ruby>寿司<rt>すし</rt></ruby>でした。","rj":"yorugohan wa sushi deshita.","say":"夜ご飯は寿司でした。"},{"en":"My birthday was yesterday.","jp":"<ruby>私<rt>わたし</rt></ruby>の<ruby>誕生日<rt>たんじょうび</rt></ruby>は<ruby>昨日<rt>きのう</rt></ruby>でした。","rj":"watashi no tanjoubi wa kinou deshita.","say":"私の誕生日は昨日でした。"},{"en":"My mother was a doctor.","jp":"<ruby>私<rt>わたし</rt></ruby>のお<ruby>母<rt>かあ</rt></ruby>さんは<ruby>医者<rt>いしゃ</rt></ruby>でした。","rj":"watashi no okaasan wa isha deshita.","say":"私のお母さんは医者でした。"}]},{"num":27,"title":"Question","vocab":[{"t":"<ruby>學生<rt>がくせい</rt></ruby>的日文？","m":"学生（がくせい / gakusei） Student","say":"学生（がくせい"},{"t":"<ruby>今天<rt>きょう</rt></ruby>的日文？","m":"今日（きょう / kyou） Today","say":"今日（きょう"},{"t":"<ruby>昨天<rt>きのう</rt></ruby>的日文？","m":"昨日（きのう / kinou） Yesterday","say":"昨日（きのう"},{"t":"<ruby>老師<rt>せんせい</rt></ruby>的日文？","m":"先生（せんせい / sensei） Teacher","say":"先生（せんせい"},{"t":"<ruby>晚餐<rt>よるごはん</rt></ruby>的日文？","m":"夜ご飯（よるごはん / yorugohan） Dinner","say":"夜ご飯（よるごはん"},{"t":"<ruby>名字<rt>なまえ</rt></ruby>的日文？","m":"名前（なまえ / namae） Name","say":"名前（なまえ"},{"t":"<ruby>生日<rt>たんじょうび</rt></ruby>的日文？","m":"誕生日（たんじょうび / tanjoubi） Birthday","say":"誕生日（たんじょうび"},{"t":"<ruby>醫生<rt>いしゃ</rt></ruby>的日文？","m":"医者（いしゃ / isha） Doctor","say":"医者（いしゃ"},{"t":"例句：","m":"肯定句：今日（きょう）は月曜日（げつようび）です。 （Today is Monday.) 疑問句：今日は月曜日ですか？ （Is today Monday?） 再舉一例： 肯定句：あなたは日本人です。(You are Japanese.) 疑問句：あなたは日本人ですか？（Are you Japanese?）","say":"例句"},{"t":"例句：","m":"昨日（きのう）は日曜日（にちようび）でしたか？ （Was yesterday Sunday?） 夜ご飯（よるごはん）は寿司（すし）でしたか？ （Was dinner sushi?）","say":"例句"},{"t":"口語（Casual）","m":"うん (un) - Yes ううん (uun) - No","say":"口語"},{"t":"請把以下句子翻成日文疑問句：","m":"“Are you a student?” あなた　は　学生（がくせい）ですか？ anata wa gakusei desu ka? （肯定句：あなたは学生です。You are a student.　+　か？）","say":"請把以下句子翻成日文疑問句"},{"t":"請把以下句子翻成日文疑問句：","m":"“Was yesterday Sunday?” 昨日（きのう）　は　日曜日（にちようび）　でしたか？ kinou wa nichiyoubi deshita ka?","say":"請把以下句子翻成日文疑問句"},{"t":"請把以下句子翻成日文疑問句：","m":"“Was dinner sushi?” 夜ご飯（よるごはん）　は　寿司（すし）　でしたか？ yorugohan wa sushi deshita ka?","say":"請把以下句子翻成日文疑問句"},{"t":"請把以下句子翻成日文疑問句：","m":"“Is today Tuesday?” 今日（きょう）　は　火曜日（かようび）　ですか？ kyou wa kayoubi desu ka?","say":"請把以下句子翻成日文疑問句"},{"t":"請把以下句子翻成日文疑問句：","m":"“Is your name Miho?” あなた　の　名前（なまえ）　は　みほ　ですか？ anata no namae wa miho desu ka?","say":"請把以下句子翻成日文疑問句"},{"t":"請把以下句子翻成日文疑問句：","m":"“Was your birthday yesterday?” あなた　の　誕生日（たんじょうび）　は　昨日（きのう）　でしたか？ anata no tanjoubi wa kinou deshita ka?","say":"請把以下句子翻成日文疑問句"},{"t":"請把以下句子翻成日文疑問句：","m":"“Was your mother a doctor?” あなた　の　お母（かあ）さん　は　医者（いしゃ）　でしたか？ anata no okaasan wa isha deshita ka?","say":"請把以下句子翻成日文疑問句"}],"grammar":["<b>日文的疑問句（question sentence）怎麼構成？</b><br><br><b>三個步驟：</b>  <br>(Step 1) 先造出肯定句 (affirmative sentence)  <br>(Step 2) 把肯定句翻成日文  <br>(Step 3) 在句尾加上 <b>か</b>（question particle）","<b>日文疑問句的</b>過去式<b>怎麼構成？（です→でした）</b><br><br>現在肯定句用「です」，過去肯定句要改成「<b>でした</b>」，再加上「か」變成過去疑問句。","<b>在日文中，怎麼回答一個問題（Yes / No）？分「正式」和「口語」兩種說法。</b><br><br><b>正式（Formal）</b>  <br>はい (hai) - Yes  <br>いいえ (iie) - No"],"example":[]},{"num":28,"title":"Question 2","vocab":[{"t":"疑問詞：What","m":"何（なに / nani）","say":"疑問詞"},{"t":"疑問詞：Who","m":"誰（だれ / dare）","say":"疑問詞"},{"t":"疑問詞：Where","m":"どこ（doko）","say":"疑問詞"},{"t":"疑問詞：When","m":"いつ（itsu）","say":"疑問詞"}],"grammar":["<b>注意</b>: 句中包含 <ruby>何<rt>なに</rt></ruby>／<ruby>誰<rt>だれ</rt></ruby>／どこ／いつ 等疑問詞時，要特別注意語順 (word order)。"],"example":[{"en":"Where is your house?","jp":"あなたの<ruby>家<rt>いえ</rt></ruby>はどこですか？","rj":"anata no ie wa doko desuka?","say":"あなたの家はどこですか？"},{"en":"What is your name?","jp":"あなたの名前はなんですか？","rj":"anata no namae wa nan desuka?","say":"あなたの名前はなんですか？"},{"en":"When is your birthday?","jp":"あなたの<ruby>誕生日<rt>たんじょうび</rt></ruby>はいつですか？","rj":"anata no tanjoubi wa itsu desuka?","say":"あなたの誕生日はいつですか？"},{"en":"What is your favourite food?","jp":"あなたの好きな食べ物はなんですか？","rj":"anata no sukina tabemono wa nan desuka?","say":"あなたの好きな食べ物はなんですか？"},{"en":"Where is your school?","jp":"あなたの<ruby>学校<rt>がっこう</rt></ruby>はどこですか？","rj":"anata no gakkou wa doko desuka?","say":"あなたの学校はどこですか？"},{"en":"When is the party?","jp":"パーティーはいつですか？","rj":"pa-ti- wa itsu desuka?","say":"パーティーはいつですか？"},{"en":"Who is your favourite singer?","jp":"あなたの好きな<ruby>歌手<rt>かしゅ</rt></ruby>は<ruby>誰<rt>だれ</rt></ruby>ですか？","rj":"anata no sukina kashu wa dare desuka?","say":"あなたの好きな歌手は誰ですか？"}]},{"num":29,"title":"Noun1 の Noun2","vocab":[{"t":"お母さん","m":"おかあさん（okaasan） 媽媽 / Mother","say":"お母さん"},{"t":"お父さん","m":"おとうさん（otousan） 爸爸 / Father","say":"お父さん"},{"t":"姉 ／ お姉ちゃん","m":"あね（ane）／ おねえちゃん（oneechan） 姊姊 / Older sister","say":"姉 ／ お姉ちゃん"},{"t":"妹","m":"いもうと（imouto） 妹妹 / Little sister","say":"妹"},{"t":"兄 ／ お兄ちゃん","m":"あに（ani）／ おにいちゃん（oniichan） 哥哥 / Older brother","say":"兄 ／ お兄ちゃん"},{"t":"弟","m":"おとうと（otouto） 弟弟 / Little brother","say":"弟"}],"grammar":["<b>西班牙（Spain）的國名、國籍、語言日文怎麼說？</b><br><br>國名：スペイン（すぺいん-supein）  <br>國籍：スペイン人（すぺいんじん-supeinjin）  <br>語言：スペイン語（すぺいんご-supeingo）","<b>美國（America）的國名、國籍、語言日文怎麼說？（注意語言的例外）</b><br><br>國名：アメリカ（あめりか-amerika）  <br>國籍：アメリカ人（あめりかじん-amerikajin）  <br>語言：<b>英語（えいご-eigo）</b>　※不是「アメリカ語」","<b>為什麼「英文」的日文說法是「英語」而不是「〇〇語」？</b><br><br><b>英語（えいご-eigo）是特例</b>，不含國家名稱，通用於以英語為官方語言的國家，例如：  <br>アメリカ（美國）、イギリス（英國）、オーストラリア（澳洲）、カナダ（加拿大）、ニュージーランド（紐西蘭）、アイルランド（愛爾蘭）、南アフリカ（南非）等","<b>中國（China）的國名、國籍、語言日文怎麼說？</b><br><br>國名：中国（ちゅうごく-chuugoku）  <br>國籍：中国人（ちゅうごくじん-chuugokujin）  <br>語言：中国語（ちゅうごくご-chuugokugo）","<b>德國（Germany）的國名、國籍、語言日文怎麼說？</b><br><br>國名：ドイツ（どいつ-doitsu）  <br>國籍：ドイツ人（どいつじん-doitsujin）  <br>語言：ドイツ語（どいつご-doitsugo）","<b>澳洲（Australia）的國名、國籍、語言日文怎麼說？（注意語言的例外）</b><br><br>國名：オーストラリア（おーすとらりあ-oosutoraria）  <br>國籍：オーストラリア人（おーすとらりあじん-oosutorariajin）  <br>語言：<b>英語（えいご-eigo）</b>　※澳洲官方語言是英語，不是「オーストラリア語」","<b>「アメリカ人の学生」是什麼意思？</b><br><br>アメリカ人（あめりかじん-amerikajin）＝美國人  <br>の＝的  <br>学生（がくせい-gakusei）＝學生  <br>＝<b>美國學生 / American student</b>","<b>「たけしの弟」是什麼意思？</b><br><br>たけし（人名）＋の＋弟（おとうと-otouto）  <br>＝<b>Takeshi的弟弟 / Takeshi&#x27;s little brother</b>","<b>「あなたの電話番号」是什麼意思？</b><br><br>あなた（you）＋の＋電話番号（でんわばんごう-denwabangou）  <br>＝<b>你的電話號碼 / Your phone number</b>","<b>【總結】日文如何用國家名稱造出國籍和語言？</b><br><br><b>國家名稱 + 人（じん-jin） = 國籍（Nationality）</b>  <br><b>國家名稱 + 語（ご-go） = 語言（Language）</b><br><br>※例外：英語（えいご-eigo）不含國家名稱，用於英語系國家","<b>【總結】助詞「の」的用法是什麼？</b><br><br>「の（no）」是<b>日文所有格助詞</b>，可以把「の」前面的名詞變成修飾語（modifier），修飾後面的名詞。<br><br>句型：<b>Noun1 の Noun2</b>（Noun1 的 Noun2）  <br>可連續使用多個「の」串連名詞：Noun1 の Noun2 の Noun3 ..."],"example":[]},{"num":30,"title":"Nounも","vocab":[{"t":"<ruby>学生<rt>がくせい</rt></ruby>","m":"gakusei Student（學生）","say":"<ruby>学生<rt>がくせい</rt></ruby>"},{"t":"<ruby>小学生<rt>しょうがくせい</rt></ruby>","m":"shougakusei Elementary school student（小學生）","say":"<ruby>小学生<rt>しょうがくせい</rt></ruby>"},{"t":"<ruby>中学生<rt>ちゅうがくせい</rt></ruby>","m":"chuugakusei Middle school student（中學生）","say":"<ruby>中学生<rt>ちゅうがくせい</rt></ruby>"},{"t":"<ruby>高校生<rt>こうこうせい</rt></ruby>","m":"koukousei High school student（高中生）","say":"<ruby>高校生<rt>こうこうせい</rt></ruby>"},{"t":"<ruby>大学生<rt>だいがくせい</rt></ruby>","m":"daigakusei University student（大學生）","say":"<ruby>大学生<rt>だいがくせい</rt></ruby>"},{"t":"<ruby>留学生<rt>りゅうがくせい</rt></ruby>","m":"ryuugakusei International student（留學生）","say":"<ruby>留学生<rt>りゅうがくせい</rt></ruby>"}],"grammar":["<b>文法規則：助詞「も」在此的意思是什麼？</b><br><br>「も」表示 <b>「也/一樣」(too / as well)</b>。<br><br>比較：  <br><ruby>私<rt>わたし</rt></ruby>は<ruby>日本人<rt>にほんじん</rt></ruby>です。  <br>watashi wa nihonjin desu.  <br>→ 我是日本人。<br><br><ruby>私<rt>わたし</rt></ruby><b>も</b><ruby>日本人<rt>にほんじん</rt></ruby>です。  <br>watashi <b>mo</b> nihonjin desu.  <br>→ 我<b>也</b>是日本人。","<b>「Noun も」四種時態總表（以さとしも学生為例）：現在肯定／過去肯定／現在疑問／過去疑問，各怎麼說？</b><br><br>現在肯定：さとし<b>も</b><ruby>学生<rt>がくせい</rt></ruby>です。  <br>satoshi mo gakusei desu.<br><br>過去肯定：さとし<b>も</b><ruby>学生<rt>がくせい</rt></ruby>でした。  <br>satoshi mo gakusei deshita.<br><br>現在疑問：さとし<b>も</b><ruby>学生<rt>がくせい</rt></ruby>ですか？  <br>satoshi mo gakusei desuka?<br><br>過去疑問：さとし<b>も</b><ruby>学生<rt>がくせい</rt></ruby>でしたか？  <br>satoshi mo gakusei deshitaka?"],"example":[{"en":"My mother is 42 years old too.","jp":"<ruby>私<rt>わたし</rt></ruby>のお<ruby>母<rt>かあ</rt></ruby>さんも42<ruby>歳<rt>さい</rt></ruby>です。","rj":"watashi no okaasan **mo** yonjuunisai desu.","say":"私のお母さんも42歳です。"},{"en":"Miho's younger brother is a high school student too.","jp":"みほの<ruby>弟<rt>おとうと</rt></ruby>も<ruby>高校生<rt>こうこうせい</rt></ruby>です。","rj":"miho no otouto **mo** koukousei desu.","say":"みほの弟も高校生です。"},{"en":"I am an international student.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>留学生<rt>りゅうがくせい</rt></ruby>です。","rj":"watashi wa ryuugakusei desu.","say":"私は留学生です。"},{"en":"I am an international student too.","jp":"<ruby>私<rt>わたし</rt></ruby>も<ruby>留学生<rt>りゅうがくせい</rt></ruby>です。","rj":"watashi **mo** ryuugakusei desu.","say":"私も留学生です。"},{"en":"Satoshi is a student.","jp":"さとしは<ruby>学生<rt>がくせい</rt></ruby>です。","rj":"satoshi wa gakusei desu.","say":"さとしは学生です。"},{"en":"Satoshi is also a student.","jp":"も）：さとしも<ruby>学生<rt>がくせい</rt></ruby>です。","rj":"Mo）：satoshimo gakusei desu.","say":"も）：さとしも学生です。"},{"en":"Satoshi was a student.","jp":"さとしは<ruby>学生<rt>がくせい</rt></ruby>でした。","rj":"satoshi wa gakusei deshita.","say":"さとしは学生でした。"},{"en":"Satoshi was also a student.","jp":"も）：さとしも<ruby>学生<rt>がくせい</rt></ruby>でした。","rj":"Mo）：satoshimo gakusei deshita.","say":"も）：さとしも学生でした。"},{"en":"satoshi **mo** gakusei desuka?","jp":"さとしは<ruby>学生<rt>がくせい</rt></ruby>ですか？","rj":"satoshi wa gakusei desuka?","say":"さとしは学生ですか？"},{"en":"satoshi **mo** gakusei desuka?","jp":"も）：さとしも<ruby>学生<rt>がくせい</rt></ruby>ですか？","rj":"Mo）：satoshimo gakusei desu ka?","say":"も）：さとしも学生ですか？"},{"en":"satoshi **mo** gakusei deshitaka?","jp":"さとしは<ruby>学生<rt>がくせい</rt></ruby>でしたか？","rj":"satoshi wa gakusei deshitaka?","say":"さとしは学生でしたか？"},{"en":"satoshi **mo** gakusei deshitaka?","jp":"も）：さとしも<ruby>学生<rt>がくせい</rt></ruby>でしたか？","rj":"Mo）：satoshimo gakusei deshita ka?","say":"も）：さとしも学生でしたか？"}]},{"num":31,"title":"Negative sentences - Present","vocab":[{"t":"警察官 是什麼意思？怎麼念？","m":"けいさつかん (keisatsukan) 意思：Police officer（警察）","say":"けいさつかん"},{"t":"明日 是什麼意思？怎麼念？","m":"あした (ashita) 意思：Tomorrow（明天）","say":"あした"}],"grammar":["<b>日文現在否定句的基本句型是什麼？(X は Y \\_\\_\\_。)</b><br><br><b>X は Y じゃありません。</b> (wa ... jaarimasen)  <br><b>X は Y じゃないです。</b> (wa ... janaidesu)<br><br>兩種說法意思相同，都表示 <b>X is not Y（X 不是 Y）</b>。","<b>總結：日文「現在否定」的兩種句型？</b><br><br><b>X は Y じゃありません。</b>(wa ... jaarimasen)  <br><b>X は Y じゃないです。</b>(wa ... janaidesu)<br><br>兩者意思相同 = <b>X is not Y</b>。可依個人習慣任選一種使用。"],"example":[{"en":"I am Japanese.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>日本人<rt>にほんじん</rt></ruby>です。","rj":"Watashi wa nihonjin desu.","say":"私は日本人です。"},{"en":"請把「私は日本人です。」改成否定句：I am not Japanese.","jp":"私は日本人じゃありません。","rj":null,"say":"私は日本人じゃありません。"},{"en":"Takeshi is not 15 years old.","jp":"たけしは15<ruby>歳<rt>じゅうごさい</rt></ruby>じゃありません。","rj":"Takeshi wa juugosai jaarimasen.","say":"たけしは15歳じゃありません。"},{"en":"Tomorrow is not Saturday.","jp":"<ruby>明日<rt>あした</rt></ruby>は<ruby>土曜日<rt>どようび</rt></ruby>じゃありません。","rj":"Ashita wa doyoubi jaarimasen.","say":"明日は土曜日じゃありません。"},{"en":"I am not a student.","jp":"わたしは<ruby>学生<rt>がくせい</rt></ruby>じゃありません。","rj":"Watashi wa gakusei jaarimasen.","say":"わたしは学生じゃありません。"},{"en":"I am not a student.","jp":"也可說成：がくせいじゃないです。","rj":null,"say":"がくせいじゃないです。"},{"en":"請把「たけしは19歳です。」改成否定句：Takeshi is not 19 years old.","jp":"たけしは19<ruby>歳<rt>じゅうきゅうさい</rt></ruby>です。","rj":"Takeshi wa 19 juukyuusai desu.","say":"たけしは19歳です。"},{"en":"請把「たけしは19歳です。」改成否定句：Takeshi is not 19 years old.","jp":"たけしは19<ruby>歳<rt>じゅうきゅうさい</rt></ruby>じゃありません。","rj":"Takeshi wa 19 juukyuusaijaarimasen.","say":"たけしは19歳じゃありません。"},{"en":"請把「わたしのお父さんは警察官です。」改成否定句：My father is not a police officer.","jp":"わたしのお父さん（おとうさん）は<ruby>警察官<rt>けいさつかん</rt></ruby>です。","rj":null,"say":"わたしのお父さんは警察官です。"},{"en":"請把「わたしのお父さんは警察官です。」改成否定句：My father is not a police officer.","jp":"わたしのお父さんは警察官じゃありません。","rj":null,"say":"わたしのお父さんは警察官じゃありません。"}]},{"num":32,"title":"Negative sentences - Past","vocab":[{"t":"セール（せーる）是什麼意思？","m":"se-ru Sale（特賣）","say":null},{"t":"<ruby>夢<rt>ゆめ</rt></ruby>是什麼意思？","m":"yume Dream（夢想）","say":null},{"t":"<ruby>歌手<rt>かしゅ</rt></ruby>是什麼意思？","m":"kashu Singer（歌手）","say":null}],"grammar":["<b>如何把肯定句「<ruby>私<rt>わたし</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>でした」（我以前是學生）改成過去否定句「我以前不是學生」？</b><br><br><b>Step1</b> 先造肯定句：  <br>私は学生でした。  <br>(watashi wa gakusei deshita)<br><br><b>Step2</b> 把「でした」換成「じゃありませんでした」或「じゃなかったです」：  <br>私は学生じゃありませんでした。  <br>(watashi wa gakusei jaarimasendeshita)  <br>＝私は学生じゃなかったです。  <br>(watashi wa gakusei janakattadesu)"],"example":[{"en":"Yesterday was not a sale.","jp":"<ruby>昨日<rt>きのう</rt></ruby>はセールじゃありませんでした。","rj":"kinou wa se-ru jaarimasendeshita.","say":"昨日はセールじゃありませんでした。"},{"en":"My dream was not to be a singer.","jp":"<ruby>私<rt>わたし</rt></ruby>の<ruby>夢<rt>ゆめ</rt></ruby>は<ruby>歌手<rt>かしゅ</rt></ruby>じゃありませんでした。","rj":"watashi no yume wa kashu jaarimasendeshita.","say":"私の夢は歌手じゃありませんでした。"},{"en":"Takeshi was 19 years old.","jp":"たけしは19<ruby>歳<rt>じゅうきゅうさい</rt></ruby>でした。","rj":"takeshi wa juukyuusai deshita.","say":"たけしは19歳でした。"},{"en":"Takeshi was not 19 years old.","jp":"たけしは19歳じゃありませんでした。","rj":"takeshi wa juukyuusai jaarimasendeshita.","say":"たけしは19歳じゃありませんでした。"},{"en":"My father was a police officer.","jp":"わたしのお父さん（おとうさん）は<ruby>警察官<rt>けいさつかん</rt></ruby>でした。","rj":"watashi no otousan wa keisatsukan deshita.","say":"わたしのお父さんは警察官でした。"},{"en":"My father was not a police officer.","jp":"わたしのお父さんは警察官じゃありませんでした。","rj":"watashi no otousan wa keisatsukan jaarimasendeshita.","say":"わたしのお父さんは警察官じゃありませんでした。"}]},{"num":41,"title":"Writing Practice","vocab":[],"grammar":[],"example":[{"en":"This is my car.","jp":"これは<ruby>私<rt>わたし</rt></ruby>の<ruby>車<rt>くるま</rt></ruby>です。","rj":"kore wa watashi no kuruma desu.","say":"これは私の車です。"},{"en":"Is that your phone?","jp":"それはあなたの<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>ですか?","rj":"sore wa anata no keitaidenwa desuka?","say":"それはあなたの携帯電話ですか?"},{"en":"This phone is not mine.","jp":"この<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>のじゃないです。","rj":"kono keitaidenwa wa watashino janaidesu.","say":"この携帯電話は私のじゃないです。"},{"en":"This phone is not mine.","jp":"この<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>のじゃありません。","rj":"kono keitaidenwa wa watashino jaarimasen.","say":"この携帯電話は私のじゃありません。"},{"en":"Your phone is here!","jp":"あなたの<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>はここです!","rj":"anata no keitaidenwa wa koko desu!","say":"あなたの携帯電話はここです!"},{"en":"Whose T-shirts is this?","jp":"これは<ruby>誰<rt>だれ</rt></ruby>のTシャツですか?","rj":"kore wa dareno Tshatsu desuka?","say":"これは誰のTシャツですか?"},{"en":"Where is your house?","jp":"あなたの<ruby>家<rt>いえ</rt></ruby>はどこですか?","rj":"anata no ie wa doko desuka?","say":"あなたの家はどこですか?"},{"en":"That is my house.","jp":"あれは<ruby>私<rt>わたし</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>です。","rj":"are wa watashi no ie desu.","say":"あれは私の家です。"},{"en":"Is your school there?","jp":"あなたの<ruby>学校<rt>がっこう</rt></ruby>はあそこですか?","rj":"anata no gakkou wa asoko desuka?","say":"あなたの学校はあそこですか?"},{"en":"There is not my school.","jp":"あそこは<ruby>私<rt>わたし</rt></ruby>の<ruby>学校<rt>がっこう</rt></ruby>じゃないです。","rj":"asoko wa watashi no gakkou janaidesu.","say":"あそこは私の学校じゃないです。"},{"en":"There is not my school.","jp":"あそこは<ruby>私<rt>わたし</rt></ruby>の<ruby>学校<rt>がっこう</rt></ruby>じゃありません。","rj":"asoko wa watashi no gakkou jaarimasen.","say":"あそこは私の学校じゃありません。"},{"en":"Whose house is that house?","jp":"あの<ruby>家<rt>いえ</rt></ruby>は<ruby>誰<rt>だれ</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>ですか?","rj":"ano ie wa dareno ie desuka?","say":"あの家は誰の家ですか?"}]}],"demo-q":[{"num":37,"title":"これ-それ-あれ-どれ","vocab":[{"t":"家 的讀音和意思？","m":"いえ (ie) - House","say":"いえ"},{"t":"りんご 的意思？","m":"りんご (ringo) - Apple","say":"りんご"},{"t":"本 的讀音和意思？","m":"ほん (hon) - Book","say":"ほん"},{"t":"水筒 的讀音和意思？","m":"すいとう (suitou) - Water bottle","say":"すいとう"},{"t":"車 的讀音和意思？","m":"くるま (kuruma) - Car","say":"くるま"},{"t":"「這是一本書。」的日文怎麼說？","m":"これ　は　本（ほん）　です。 (kore wa hon desu.)","say":"これ　は　<ruby>本<rt>ほん</rt></ruby>　です。"},{"t":"「這是蘋果嗎？」的日文怎麼說？","m":"これ　は　りんご　です　か？ (kore wa ringo desu ka?)","say":null},{"t":"「那是你的弟弟嗎？」的日文怎麼說？","m":"あれ　は　あなたの　弟（おとうと）　です　か？ (are wa anata no otouto desu ka?)","say":null},{"t":"「哪一個是你的筆？」的日文怎麼說？","m":"あなたの　ペン（ぺん）　は　どれ　です　か？ (anata no pen wa dore desu ka?)","say":null},{"t":"「哪一個是你最喜歡的電影？」的日文怎麼說？","m":"好きな　映画（えいが）　は　どれ　です　か？ (sukina eiga wa dore desu ka?)","say":null},{"t":"「哪一個是你的車？」的日文怎麼說？","m":"あなたの　車（くるま）　は　どれ　です　か？ (anata no kuruma wa dore desu ka?)","say":null}],"grammar":["<b>これ、それ、あれ、どれ 的用法區別是什麼？</b><br><br><b>これ (kore)</b>：離<b>說話者</b>近的東西  <br><b>それ (sore)</b>：離<b>聽話者</b>近的東西  <br><b>あれ (are)</b>：離說話者和聽話者都<b>遠</b>的東西  <br><b>どれ (dore)</b>：用於詢問「哪一個」(which one)","<b>これ、それ、あれ、どれ 後面可以接名詞嗎？</b><br><br><b>絕對不可以！</b>  <br>これ、あれ、それ、どれ <b>NEVER</b> will be followed by a noun.（後面永遠不會直接接名詞）","<b>これ/それ/あれ/どれ 的基本句型是什麼？</b><br><br><b>肯定句：</b>これ/それ/あれ　は　X　です。→ This/That is X.  <br><b>疑問句：</b>これ/それ/あれ　は　X　ですか？→ Is this/that X?  <br><b>詢問哪一個：</b>X　は　どれ　ですか？→ Which one is X?","<b>「那是我的家。」的日文怎麼說？（あれ：離說話者和聽話者都遠）</b><br><br>あれ　は　<ruby>私<rt>わたし</rt></ruby>の　<ruby>家<rt>いえ</rt></ruby>　です。  <br>(are wa watashi no ie desu.)","<b>（指著眼前的東西）「這是我的水壺。」的日文怎麼說？</b><br><br>これ　は　わたしの　<ruby>水筒<rt>すいとう</rt></ruby>　です。  <br>(kore wa watashi no suitou desu.)","<b>（指著聽話者旁邊的東西）「那是你的手機嗎？」的日文怎麼說？</b><br><br>それ　は　あなたの　携帯電話　です　か？  <br>(sore wa anata no keitaidenwa desu ka?)","<b>（指著離說話者和聽話者都遠的東西）「那是什麼？」的日文怎麼說？</b><br><br>あれ　は　<ruby>何<rt>なん</rt></ruby>　です　か？  <br>(are wa nan desu ka?)"],"example":[]},{"num":38,"title":"この-その-あの-どの","vocab":[{"t":"<ruby>友達<rt>ともだち</rt></ruby>是什麼意思？","m":"Friend（朋友） 友達（ともだち - tomodachi）","say":"友達（ともだち"},{"t":"<ruby>女性<rt>じょせい</rt></ruby>是什麼意思？","m":"Lady（女性、女士） 女性（じょせい - josei）","say":"（女性、女士） 女性（じょせい"},{"t":"<ruby>人気<rt>にんき</rt></ruby>是什麼意思？","m":"Popular（受歡迎的） 人気（にんき - ninki）","say":"人気（にんき"}],"grammar":["<b>この／その／あの／どの　的用法區別是什麼？</b><br><br><b>この (kono)</b>：用於離<b>說話者</b>近的事物。  <br><b>その (sono)</b>：用於離<b>聽話者</b>近的事物。  <br><b>あの (ano)</b>：用於離說話者和聽話者<b>都遠</b>的事物。  <br><b>どの (dono)</b>：用於<b>詢問「哪一個」</b>時。<br><br>＊この／その／あの／どの 後面一定要接名詞。","<b>この／その／あの　X　は　Y　です（か）？ 和　どの　X　は　Y　ですか？ 的句型與意思？</b><br><br>この／その／あの　X　は　Y　です。  <br>(kono/sono/ano X wa Y desu.)  <br>→ This/That X is Y.（這／那個 X 是 Y。）<br><br>この／その／あの　X　は　Y　ですか？  <br>(kono/sono/ano X wa Y desuka?)  <br>→ Is this/that X Y?（這／那個 X 是 Y 嗎？）<br><br>どの　X　は　Y　ですか？  <br>(dono X wa Y desuka?)  <br>→ Which X is Y?（哪個 X 是 Y？）","<b>これ／あれ／それ／どれ 和 この／あの／その／どの 有什麼差別？</b><br><br>これ、あれ、それ、どれ　→　<b>不能</b>接名詞 (Not followed by a noun)<br><br>この、あの、その、どの　→　<b>一定要</b>接名詞 (Always followed by a noun)"],"example":[{"en":"（This book is mine.）**","jp":"この<ruby>本<rt>ほん</rt></ruby>は私の（わたしの）です。","rj":"Kono hon wa watashino desu.","say":"この本は私のです。"},{"en":"That house is mine.","jp":"あの<ruby>家<rt>いえ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>のです。","rj":"Ano ie wa watashino desu.","say":"あの家は私のです。"},{"en":"Is that person your friend?","jp":"あの<ruby>人<rt>ひと</rt></ruby>はあなたの<ruby>友達<rt>ともだち</rt></ruby>ですか？","rj":"Ano hito wa anatano tomodachi desuka?","say":"あの人はあなたの友達ですか？"},{"en":"Is this car yours?","jp":"この<ruby>車<rt>くるま</rt></ruby>はあなたのですか？","rj":"Kono kuruma wa anatano desuka?","say":"この車はあなたのですか？"},{"en":"（Which pen is yours?）**","jp":"どのペンはあなたのですか？","rj":"Dono pen wa anatano desuka?","say":"どのペンはあなたのですか？"},{"en":"（Which movie is popular?）**","jp":"どの<ruby>映画<rt>えいが</rt></ruby>は<ruby>人気<rt>にんき</rt></ruby>ですか？","rj":"Dono eiga wa ninki desuka?","say":"どの映画は人気ですか？"},{"en":"This water bottle is mine.","jp":"この<ruby>水筒<rt>すいとう</rt></ruby>はわたしのです。","rj":"Kono suitou wa watashi no desu.","say":"この水筒はわたしのです。"},{"en":"Which mobile phone is yours?","jp":"どの<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>はあなたのですか？","rj":"Dono keitaidenwa wa anatano desuka?","say":"どの携帯電話はあなたのですか？"},{"en":"That mobile phone is mine.","jp":"その<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>はわたしのです。","rj":"Sono keitaidenwa wa watashino desu.","say":"その携帯電話はわたしのです。"},{"en":"Is that lady Mikiko?","jp":"あの<ruby>女性<rt>じょせい</rt></ruby>はみきこですか？","rj":"Ano josei wa Mikiko desuka?","say":"あの女性はみきこですか？"},{"en":"That lady is not Mikiko.","jp":"あの<ruby>女性<rt>じょせい</rt></ruby>はみきこじゃないです。","rj":"Ano josei wa Mikiko janai desu.","say":"あの女性はみきこじゃないです。"}]},{"num":39,"title":"だれの noun","vocab":[{"t":"「包包」的日文怎麼說？","m":"カバン（かばん - kaban） = Bag","say":"カバン（かばん"},{"t":"「車子」的日文怎麼說？","m":"車（くるま - kuruma） = Car","say":"車（くるま"},{"t":"「錢包」的日文怎麼說？","m":"財布（さいふ - saifu） = Wallet","say":"財布（さいふ"},{"t":"如何用日文問「這是誰的包包？」","m":"（請說明句子結構） これは　だれの　かばん　ですか？ (Kore wa dareno kaban desuka?) これ＝這（this） は＝主題助詞 だれの＝誰的（whose） かばん＝包包（bag） です＝是（現在肯定） か＝疑問助詞","say":null},{"t":"「這是蘇的包包」的日文怎麼說？","m":"これは　スーの　かばんです。 (Kore wa Suu no kaban desu.)","say":"これは　スーの　かばんです。"},{"t":"「這是誰的車？」的日文怎麼說？","m":"これは　だれの　くるまですか？ (Kore wa dareno kuruma desuka?)","say":null},{"t":"「那是誰的家？」的日文怎麼說？","m":"あれは　だれの　家（いえ）ですか？ (Are wa dareno ie desuka?)","say":null},{"t":"「這是誰的錢包？」的日文怎麼說？","m":"これは　だれの　財布（さいふ）ですか？ (Kore wa dareno saifu desuka?)","say":null}],"grammar":["<b>日文的「誰」怎麼說？「誰的」呢？</b><br><br>誰（だれ - dare）= 誰  <br>誰の（だれの - dareno）= 誰的<br><br>規則：疑問詞「誰」加上助詞「の」就變成「誰的」，用來詢問所有者。","<b>「她是誰的媽媽？」的日文怎麼說？</b><br><br><ruby>彼女<rt>かのじょ</rt></ruby>は　だれの　お<ruby>母<rt>かあ</rt></ruby>さんですか？  <br>(Kanojo wa dareno okaasan desuka?)"],"example":[]},{"num":40,"title":"ここ-そこ-あそこ-どこ","vocab":[{"t":"Library","m":"図書館 （としょかん / toshokan）","say":"図書館 （としょかん"},{"t":"Tokyo Tower","m":"東京タワー （とうきょうたわー / tokyo tawaa）","say":"東京タワー （とうきょうたわー"},{"t":"Meeting point","m":"待ち合わせ場所 （まちあわせばしょ / machiawase basho）","say":"待ち合わせ場所 （まちあわせばしょ"},{"t":"Hometown","m":"故郷 （こきょう / kokyou）","say":"故郷 （こきょう"},{"t":"Office / working place","m":"職場 （しょくば / shokuba）","say":"職場 （しょくば"},{"t":"Hospital","m":"病院 （びょういん / byouin）","say":"病院 （びょういん"},{"t":"「這裡（這個地方）是圖書館。」用日文怎麼說？","m":"ここ　は　図書館（としょかん）です。 (koko wa toshokan desu.)","say":"ここ　は　<ruby>図書館<rt>としょかん</rt></ruby>です。"},{"t":"「那裡（那個地方）是我家。」用日文怎麼說？","m":"あそこ　は　私（わたし）の　家（いえ）です。 (asoko wa watashi no ie desu.)","say":"あそこ　は　<ruby>私<rt>わたし</rt></ruby>の　<ruby>家<rt>いえ</rt></ruby>です。"},{"t":"「東京鐵塔在這裡。」用日文怎麼說？","m":"東京タワー（とうきょうたわー）は　ここ　です。 (tokyo tawaa wa koko desu.)","say":"東京タワー（とうきょうたわー）は　ここ　です。"},{"t":"「你的手機在那裡。」用日文怎麼說？","m":"あなたの　携帯（けいたい）は　あそこ　です。 (anata no keitai wa asoko desu.)","say":"あなたの　<ruby>携帯<rt>けいたい</rt></ruby>は　あそこ　です。"},{"t":"「你的車在哪裡？」用日文怎麼說？","m":"あなたの　車（くるま）は　どこ　ですか？ (anata no kuruma wa doko desu ka?)","say":null},{"t":"「醫院在哪裡？」用日文怎麼說？","m":"病院（びょういん）は　どこ　ですか？ (byouin wa doko desu ka?)","say":null},{"t":"「這裡是哪裡？」用日文怎麼說？","m":"ここ　は　どこ　ですか？ (koko wa doko desu ka?)","say":null}],"grammar":["<b>日文中 </b>ここ・そこ・あそこ・どこ<b> 的用法區別是什麼？</b><br><br><b>ここ (koko)</b>：離<b>說話者</b>近的地方 → 這裡  <br><b>そこ (soko)</b>：離<b>聽話者</b>近的地方 → 那裡  <br><b>あそこ (asoko)</b>：離說話者和聽話者都<b>遠</b>的地方 → 那裡／那邊  <br><b>どこ (doko)</b>：用來<b>詢問地點</b> → 哪裡","<b>「ここ／そこ／あそこ／どこ」的三種基本句型是什麼？</b><br><br>① ここ／そこ／あそこ　は　Xです。  <br>→ Here/There is X.<br><br>② Xは　ここ／そこ／あそこ　です。  <br>→ X is here/there.<br><br>③ Xは　どこ　ですか？  <br>→ Where is X?","<b>「集合地點在哪裡？」用日文怎麼說？</b><br><br>待ち合わせ<ruby>場所<rt>まちあわせばしょ</rt></ruby>は　どこ　ですか？  <br>(machiawasebasho wa doko desu ka?)","<b>「這裡（這個地方）是我的故鄉。」用日文怎麼說？</b><br><br>ここ　は　<ruby>私<rt>わたし</rt></ruby>の　<ruby>故郷<rt>こきょう</rt></ruby>です。  <br>(koko wa watashi no kokyou desu.)","<b>「那裡（那個地方）是我的職場。」用日文怎麼說？</b><br><br>あそこ　は　<ruby>私<rt>わたし</rt></ruby>の　<ruby>職場<rt>しょくば</rt></ruby>です。  <br>(asoko wa watashi no shokuba desu.)"],"example":[]}],"particle":[{"num":53,"title":"Basic particles","vocab":[{"t":"請比較で、に、へ、を這四個助詞的用法。","m":"用法對照表： ・表示場所（事件發生地點）→ で ・表示方向（移動目標）→ に 或 へ ・表示時間（事件發生時間）→ に ・表示直接受詞（受動作影響的對象）→ を","say":null},{"t":"<ruby>本<rt>ほん</rt></ruby>的意思是什麼？","m":"Book（書）","say":null},{"t":"<ruby>学校<rt>がっこう</rt></ruby>的意思是什麼？","m":"School（學校）","say":null},{"t":"コーヒー的意思是什麼？","m":"Coffee（咖啡）","say":null},{"t":"飲む（のむ）的意思是什麼？","m":"To drink（喝）","say":null},{"t":"寝る（ねる）的意思是什麼？","m":"To sleep（睡覺）","say":null}],"grammar":["<b>日文句子中的名詞後面通常會接什麼？它的作用是什麼？</b><br><br>名詞後面通常會<b>接助詞</b>（particle）。  <br>助詞用來表示名詞與動詞之間的關係。  <br>本課將學習四個新助詞：<b>で、に、へ、を</b>。","<b>助詞「に」（ni）的兩個常見用法是什麼？</b><br><br>(1) <b>方向 Direction</b>：事物移動的目標。  <br>(2) <b>時間 Time reference</b>：事件發生的時間點。"],"example":[{"en":"I read books at the library.","jp":"<ruby>図書館<rt>としょかん</rt></ruby>で<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みます。","rj":"Toshokande hon o yomimasu.","say":"図書館で本を読みます。"},{"en":"I will not go to school.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きません。","rj":"Watashi wa gakkouni ikimasen.","say":"私は学校に行きません。"},{"en":"I go to bed at eleven o'clock.","jp":"<ruby>私<rt>わたし</rt></ruby>は11<ruby>時<rt>じ</rt></ruby>に<ruby>寝<rt>ね</rt></ruby>ます。","rj":"Watashi wa 11 jini nemasu.","say":"私は11時に寝ます。"},{"en":"I will not go to school.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きません。","rj":"Watashi wa gakkou e ikimasen.","say":"私は学校へ行きません。"},{"en":"I drink coffee.","jp":"<ruby>私<rt>わたし</rt></ruby>はコーヒーを<ruby>飲<rt>の</rt></ruby>みます。","rj":"Watashi wa ko-hi- o nomimasu.","say":"私はコーヒーを飲みます。"}]},{"num":54,"title":"Basic Particles Practice","vocab":[{"t":"音楽","m":"おんがく（ongaku） 意思：Music","say":"音楽"},{"t":"カフェ","m":"かふぇ（kafe） 意思：Cafe","say":"カフェ"},{"t":"何時","m":"なんじ（nanji） 意思：What time","say":"何時"},{"t":"請填入正確助詞：","m":"\"I watch TV at home.\" うち　＿＿　テレビ（てれび）　＿＿　見（み）ます。 （地點）　　　　　　　（對象） うちでテレビ（てれび）を見（み）ます。","say":"請填入正確助詞"},{"t":"請填入正確助詞：","m":"\"I go to Kyoto on Sunday.\" 日曜日（にちようび）　＿＿　京都（きょうと）　＿＿　行（い）きます。 （時間）　　　　　　　　（目的地） 日曜日（にちようび）に京都（きょうと）へ行（い）きます。","say":"請填入正確助詞"},{"t":"に：表示動作發生的時間（Time）","m":"へ：表示動作的方向／目的地（Destination）","say":null},{"t":"請填入正確助詞：","m":"\"I will listen to music.\" 私（わたし）　＿＿　音楽（おんがく）　＿＿　聞（き）きます。 （主語）　　　　　（對象） 私（わたし）は音楽（おんがく）を聞（き）きます。","say":"請填入正確助詞"},{"t":"は：表示句子的主語（Subject）","m":"を：表示動作的直接目的語（Direct object）","say":null},{"t":"請填入正確助詞：","m":"\"What time does Mary go to the cafe?\" メアリーさん　＿＿　なんじ　＿＿　かふぇ　＿＿　いきますか？ （主語）　　　　（時間）　　　（目的地） メアリーさんはなんじにかふぇにいきますか？","say":"請填入正確助詞"},{"t":"は：表示主語（Subject）","m":"に（第一個）：表示時間（Time） に（第二個）：表示目的地（Destination）","say":null}],"grammar":["<b>助詞 で、に／へ、に、を 各自表示什麼用法？</b><br><br><b>で</b>：表示事件發生的<b>地點</b>（location where the event happens）  <br><b>に or へ</b>：表示動作的<b>方向／目的地</b>（direction, the goal of movement）  <br><b>に</b>：表示事件發生的<b>時間</b>（time when the event takes place）  <br><b>を</b>：表示受動作影響的<b>直接目的語</b>（direct object, affected by the movement）","<b>で</b>：表示動作發生的地點（Location）  <br><b>を</b>：表示動作作用的直接對象（Object）"],"example":[]},{"num":56,"title":"The topic particle は","vocab":[{"t":"常用短句：","m":"あなたは？ What about you? 省略句，常用來把話題轉向對方，是「は」引導聽者注意力、邀請回應的典型例子。","say":"常用短句"},{"t":"總結：助詞「は」除了標記主語以外，還有哪兩種主要用法？","m":"1. 把非主語的詞語變成主題 （例：時間表達詞　週末は、今日は…）","say":null}],"grammar":["<b>文法規則：助詞「は」通常接在句子的什麼成分後面？除此之外還能怎麼用？</b><br><br>「は」通常直接接在<b>主語</b>之後。  <br>但也可以用「は」把<b>非主語的詞語</b>變成句子的主題（topic）。","<b>文法規則：「は」還有一種用法是什麼？（提示：與聽者互動有關）</b><br><br>「は」可以用來<b>引導聽者的注意力</b>，並藉此<b>邀請對方回應或完成句子</b>（常用於省略句尾的疑問句，如「〜は？」＝『〜怎麼樣？/你呢？』）。","<b>2. 引導聽者的注意力，邀請對方回應或完成句子</b>  <br>（例：省略疑問句　晩ごはんは？　あなたは？）"],"example":[{"en":"What do you do on the weekend?","jp":"<ruby>週末<rt>しゅうまつ</rt></ruby>は<ruby>何<rt>なに</rt></ruby>をしますか？","rj":"Shuumatsu wa nani o shimasuka?","say":"週末は何をしますか？"},{"en":"Mary, what do you do on the weekend?","jp":"メアリー、<ruby>週末<rt>しゅうまつ</rt></ruby>は<ruby>何<rt>なに</rt></ruby>をしますか？","rj":"Meari-, shuumatsu wa nani o shimasuka?","say":"メアリー、週末は何をしますか？"},{"en":"I am going to Kyoto today.","jp":"<ruby>今日<rt>きょう</rt></ruby>は<ruby>京都<rt>きょうと</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。","rj":"Kyou wa kyoutoni ikimasu.","say":"今日は京都に行きます。"},{"en":"How about dinner? / Do you (will you) eat dinner?","jp":"<ruby>晩<rt>ばん</rt></ruby>ごはんは？","rj":"Bango wa n wa?","say":"晩ごはんは？"},{"en":"What are we doing this weekend?","jp":"<ruby>今週末<rt>こんしゅうまつ</rt></ruby>は<ruby>何<rt>なに</rt></ruby>をしますか？","rj":"Konshuumatsu wa nani o shimasuka?","say":"今週末は何をしますか？"},{"en":"What are you going to do tomorrow?","jp":"<ruby>明日<rt>あした</rt></ruby>は<ruby>何<rt>なに</rt></ruby>をしますか？","rj":"Ashita wa nani o shimasuka?","say":"明日は何をしますか？"},{"en":"I will study Japanese. How about you?","jp":"<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>します。あなたは？","rj":"Nihongo o benkyoushimasu. anata wa?","say":"日本語を勉強します。あなたは？"},{"en":"On Friday, what are you going to do?","jp":"<ruby>金曜日<rt>きんようび</rt></ruby>は<ruby>何<rt>なに</rt></ruby>をしますか？","rj":"Kinyoubi wa nani o shimasuka?","say":"金曜日は何をしますか？"},{"en":"On Friday, I will watch a movie.","jp":"<ruby>金曜日<rt>きんようび</rt></ruby>は、<ruby>映画<rt>えいが</rt></ruby>をみます。","rj":"Kinyoubi wa, eiga o mimasu.","say":"金曜日は、映画をみます。"},{"en":"About movies, what is your favourite movie?","jp":"<ruby>映画<rt>えいが</rt></ruby>は、<ruby>好<rt>す</rt></ruby>きな<ruby>映画<rt>えいが</rt></ruby>は<ruby>何<rt>なん</rt></ruby>ですか？","rj":"Eiga wa, sukina eiga wa nan desu ka?","say":"映画は、好きな映画は何ですか？"}]},{"num":57,"title":"Particle が","vocab":[{"t":"整理：助詞「が」的用法總結","m":"が的功能： 1. 標示句子的主語(subject)。 2. 用該名詞回答／填補疑問詞（誰・何等）留下的空格，也就是提供新資訊。 對照： ・が → 標示新資訊／疑問詞的答案，語氣上有強調感。 ・は → 標示雙方已知的話題，單純敘述。 ・疑問詞作主語時，只能接が，絕不能接は。","say":"が的功能： 1. 標示句子的主語"}],"grammar":["<b>「ロバートさんが 沖縄に行きました。」與「ロバートさんは 沖縄に行きました。」意思有什麼不同？</b><br><br>雙方都知道有人去了沖繩，但只有說話者知道是Robert，聽者不知道──這時用<b>が</b>，並特別強調「Robert」這個新資訊（他的身分是句子的重點）。<br><br>若用<b>は</b>，代表Robert是雙方已知的話題，只是單純敘述他做的事，沒有特別強調身分。<br><br>ロバートさんが <ruby>沖縄<rt>おきなわ</rt></ruby>に <ruby>行<rt>い</rt></ruby>きました。  <br>(是<b>Robert</b>去了沖繩──這是新資訊。)","<b>用日文問「哪個班有趣？」並回答「是日文課有趣」。</b><br><br>問：どのクラス（くらす）<b>が</b> おもしろいですか？  <br>(Which class is interesting?)<br><br>答：<ruby>日本語<rt>にほんご</rt></ruby>のクラス（くらす）<b>が</b> おもしろいです。  <br>(Japanese class is interesting.)<br><br>※「日本語のクラス」是回答疑問詞「どのクラス」的新資訊，所以用が。","<b>用日文問「誰戴著眼鏡？」並回答「是山下先生」。</b><br><br>問：だれ<b>が</b> めがねを かけていますか？  <br>(Who wears glasses?)<br><br>答：やましたさん<b>が</b> めがねを かけています。  <br>(Mr. Yamashita does.)"],"example":[{"en":"Robert went to Okinawa.","jp":"ロバートさんが<ruby>沖縄<rt>おきなわ</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","rj":"Roba-tosanga okinawani ikimashita.","say":"ロバートさんが沖縄に行きました。"},{"en":"Who went to Okinawa?","jp":"だれが<ruby>沖縄<rt>おきなわ</rt></ruby>にいきましたか？","rj":"Darega okinawaniikimashitaka?","say":"だれが沖縄にいきましたか？"},{"en":"(Incorrect) Who went to Okinawa? - must use が, not は","jp":"❌ だれは<ruby>沖縄<rt>おきなわ</rt></ruby>にいきましたか？","rj":"❌ dare wa okinawaniikimashitaka?","say":"❌ だれは沖縄にいきましたか？"}]},{"num":58,"title":"Particle も","vocab":[{"t":"<ruby>靴<rt>くつ</rt></ruby>","m":"kutsu Shoes（鞋子）","say":"<ruby>靴<rt>くつ</rt></ruby>"},{"t":"カバン（かばん）","m":"kaban Bag（包包）","say":"カバン（かばん）"},{"t":"<ruby>先週<rt>せんしゅう</rt></ruby>","m":"senshuu Last week（上週）","say":"<ruby>先週<rt>せんしゅう</rt></ruby>"},{"t":"「も」如何取代助詞「は」？請舉例說明。","m":"「も」可以取代は，用來表示第二個做出相同動作的人。 A: 昨日（きのう）京都（きょうと）に 行（い）きました。 （Kinou kyoto ni ikimashita.） B: たかも 昨日（きのう）京都（きょうと）に 行（い）きました。 （Taka mo kinou kyoto ni ikimashita.） ＝Taka 昨天也去了京都。","say":null},{"t":"「も」如何取代助詞「を」？請舉例說明。","m":"「も」可以取代を，用來表示第二個共有屬性的事物（受詞）。 A: メアリーは くつを 買（か）いました。 （Mary wa kutsu o kaimashita.） B: メアリーは かばんも 買（か）いました。 （Mary wa kaban mo kaimashita.） ＝Mary 也買了包包。","say":null},{"t":"「にも」如何取代「に」表示地點？請舉例。","m":"去過第一個地點後，又去了另一個地點時，用「にも」取代「に」。 A: 先週（せんしゅう）京都（きょうと）に 行（い）きました。 （Senshuu kyoto ni ikimashita.） B: 大阪（おおさか）にも 行（い）きました。 （Osaka nimo ikimashita.） ＝上週也去了大阪。","say":null},{"t":"「にも」如何取代「に」表示時間？請舉例。","m":"在第一個時間點做了某事後，又在另一個時間點做相同的事時，用「にも」取代「に」。 A: みきは 土曜日（どようび）に パーティーに 行（い）きました。 （Miki wa doyoubi ni pati- ni ikimashita.） B: 日曜日（にちようび）にも パーティーに 行（い）きました。 （Nichiyoubi nimo pati- ni ikimashita.） ＝星期日也去了派對。","say":null}],"grammar":["<b>助詞「も」的兩種基本用法是什麼？</b><br><br>1. 用在<b>第二個事物</b>上，這個事物與第一個事物<b>共有某個屬性</b>。<br>2. 用在<b>兩個以上的人</b>做<b>相同的動作</b>時。","<b>「も」除了取代は、が、を之外，還可以用在什麼情境？</b><br><br>も 也可以用於：  <br>・去了<b>兩個地方</b>時  <br>・在<b>兩個不同場合</b>做同一件事時  <br>（在這些例句中，も 直接取代 は、が、或 を，標示出「共同擁有某屬性」的那一項。）","<b>「も」與「に」合併使用的規則，以及其他助詞遇到「も」時的一般規則是什麼？</b><br><br>「も」放在助詞「<b>に</b>」<b>之後</b>，變成「にも」。<br><br>更一般地說：<b>除了は、が、を以外的助詞</b>，遇到「も」時是<b>與も並用</b>（放在助詞後面），而不是被も取代。","<b>整理：各助詞遇到「も」時的變化規則？</b><br><br><div class=\"mdtable\"><table><tr><td>Particle は</td><td rowspan=\"3\">被取代為「も(mo)」</td></tr><tr><td>Particle が</td></tr><tr><td>Particle を</td></tr><tr><td>Particle に</td><td>にも (nimo)</td></tr><tr><td>Particle へ</td><td>へも (emo)</td></tr><tr><td>Particle で</td><td>でも (demo)</td></tr></table></div>"],"example":[{"en":"Naoko went to China. She went to Taiwan too.","jp":"なおこは<ruby>中国<rt>ちゅうごく</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","rj":"Naoko wa chuugoku ni ikimashita.","say":"なおこは中国に行きました。"},{"en":"Naoko went to China. She went to Taiwan too.","jp":"<ruby>台湾<rt>たいわん</rt></ruby>にも<ruby>行<rt>い</rt></ruby>きました。","rj":"Taiwannimo ikimashita.","say":"台湾にも行きました。"},{"en":"Naoko went to China. Takeshi went to China too.","jp":"たけしも<ruby>中国<rt>ちゅうごく</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","rj":"Takeshi mo chuugoku ni ikimashita.","say":"たけしも中国に行きました。"},{"en":"I study Chinese. I study Spanish too.","jp":"わたしは<ruby>中国語<rt>ちゅうごくご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>します。","rj":"Watashi wa chuugokugo o benkyoushimasu.","say":"わたしは中国語を勉強します。"},{"en":"I study Chinese. I study Spanish too.","jp":"スペイン<ruby>語<rt>すぺいんご</rt></ruby>も<ruby>勉強<rt>べんきょう</rt></ruby>します。","rj":"Supein supeingomo benkyoushimasu.","say":"スペイン語も勉強します。"},{"en":"I go to the cafe on Monday. I go there on Thursday too.","jp":"わたしは<ruby>月曜日<rt>げつようび</rt></ruby>にカフェに<ruby>行<rt>い</rt></ruby>きます。","rj":"Watashi wa getuyoubi ni kafe ni ikimasu.","say":"わたしは月曜日にカフェに行きます。"},{"en":"I go to the cafe on Monday. I go there on Thursday too.","jp":"<ruby>木曜日<rt>もくようび</rt></ruby>にもあそこに<ruby>行<rt>い</rt></ruby>きます。","rj":"Mokuyoubi nimo asoko ni ikimasu.","say":"木曜日にもあそこに行きます。"}]},{"num":59,"title":"Particle と","vocab":[{"t":"<ruby>東京<rt>とうきょう</rt></ruby>是什麼意思？","m":"Tokyo （とうきょう / tokyo）","say":"（とうきょう"},{"t":"りんご 是什麼意思？","m":"Apple （ringo）","say":null},{"t":"さくらんぼ 是什麼意思？","m":"Cherry （sakuranbo）","say":null},{"t":"<ruby>韓国<rt>かんこく</rt></ruby>是什麼意思？","m":"South Korea （かんこく / kankoku）","say":"（かんこく"}],"grammar":[],"example":[{"en":"I speak Japanese and English.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>と<ruby>英語<rt>えいご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>します。","rj":"nihongo to eigo wo hanashimasu.","say":"日本語と英語を話します。"},{"en":"I went to Korea with Mary.","jp":"メアリーと<ruby>韓国<rt>かんこく</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","rj":"Meari-to kankokuni ikimashita.","say":"メアリーと韓国に行きました。"},{"en":"I went to Tokyo and Osaka.","jp":"<ruby>東京<rt>とうきょう</rt></ruby>と<ruby>大阪<rt>おおさか</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","rj":"tokyo to osaka ni ikimashita.","say":"東京と大阪に行きました。"},{"en":"I ate apple and cherry.","jp":"<ruby>私<rt>わたし</rt></ruby>はりんごとさくらんぼを<ruby>食<rt>た</rt></ruby>べました。","rj":"watashi wa ringo to sakuranbo wo tabemashita.","say":"私はりんごとさくらんぼを食べました。"},{"en":"I went to South Korea with Mary.","jp":"<ruby>私<rt>わたし</rt></ruby>はメアリーと<ruby>韓国<rt>かんこく</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","rj":"watashi wa Mary to kankoku ni ikimashita.","say":"私はメアリーと韓国に行きました。"},{"en":"I study Japanese with Ken.","jp":"（わたし）はけんと<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>します。","rj":"watashi wa ken to nihongo wo benkyoushimasu.","say":"（わたし）はけんと日本語を勉強します。"}]},{"num":60,"title":"Particle や","vocab":[],"grammar":["<b>請用「や」完成句子：「我去了京都和奈良等地。」（暗示還去了別的地方）</b><br><br><ruby>京都<rt>きょうと</rt></ruby><b>や</b><ruby>奈良<rt>なら</rt></ruby>に行きました。  <br>Kyōto ya Nara ni ikimashita.<br><br>や 表示舉例：京都、奈良只是去過的地方之一，暗示還去了其他地方。","<b>請用「や」完成句子：「我喜歡章魚燒和飯團等（食物）。」</b><br><br>たこ<ruby>焼<rt>や</rt></ruby>き<b>や</b>おにぎりが好きです。  <br>Takoyaki ya onigiri ga sukidesu.<br><br>や 表示舉例：章魚燒、飯團只是喜歡的食物中的例子，不是全部。","<b>請用「や」完成句子：「我做了味噌湯和大阪燒等（料理）。」</b><br><br>みそしる<b>や</b>おこのみやきを<ruby>料理<rt>りょうり</rt></ruby>しました。  <br>Misoshiru ya okonomiyaki o ryōri shimashita.<br><br>單字：  <br>料理する（りょうりする）＝做料理  <br><ruby>味噌汁<rt>みそしる</rt></ruby>＝味噌湯  <br>お好み焼き（おこのみやき）＝大阪燒","<b>請用「や」完成句子：「Taku 說日文、法文等（語言）。」</b><br><br>たくは<ruby>日本語<rt>にほんご</rt></ruby><b>や</b>フランス<ruby>語<rt>ふらんすご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>します。  <br>Taku wa nihongo ya furansugo o hanashimasu.<br><br>單字：  <br>話す（はなす）＝說  <br><ruby>日本語<rt>にほんご</rt></ruby>＝日語  <br>フランス<ruby>語<rt>ふらんすご</rt></ruby>＝法語"],"example":[{"en":"I went to Kyoto, Nara and other places.","jp":"<ruby>京都<rt>きょうと</rt></ruby>や<ruby>奈良<rt>なら</rt></ruby>に行きました。","rj":"Kyōto ya Nara ni ikimashita.","say":"京都や奈良に行きました。"}]},{"num":61,"title":"Particle で","vocab":[{"t":"「Chopsticks」的日文是？","m":"お箸（おはし - ohashi）","say":"お箸（おはし"},{"t":"「Meals（飯）」的日文是？","m":"ご飯（ごはん - gohan）","say":"ご飯（ごはん"},{"t":"「Bus」的日文是？","m":"バス（ばす - basu）","say":"バス（ばす"},{"t":"「TV」的日文是？","m":"テレビ（てれび - terebi）","say":"テレビ（てれび"}],"grammar":["<b>總結：助詞「で」的用法整理（交通工具 vs 使用工具/手段）</b><br><br>&lt;table border=&#x27;1&#x27; cellpadding=&#x27;4&#x27;&gt;&lt;tr&gt;&lt;th&gt;用法&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;th&gt;例句&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交通工具&lt;/td&gt;&lt;td&gt;表示搭乘的交通方式&lt;/td&gt;&lt;td&gt;バスで学校に行きます。  <br>飛行機で大阪に行きますか？  <br>新幹線で大阪に行きます。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;使用工具/手段&lt;/td&gt;&lt;td&gt;表示做動作時使用的工具、語言等&lt;/td&gt;&lt;td&gt;お箸でご飯を食べます。  <br>日本語で話しましょう。  <br>テレビで映画を見ました。  <br>パソコンで映画を観ます。  <br>スペイン語で話しますか？&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;  <br>※ 與第53課表示「場所」的で不同，本課の「で」表示「手段/工具」。"],"example":[{"en":"I eat rice with chopsticks.","jp":"お<ruby>箸<rt>はし</rt></ruby>でご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。","rj":"ohashi de gohan o tabemasu.","say":"お箸でご飯を食べます。"},{"en":"I go to school by bus.","jp":"バスで<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。","rj":"basu de gakkou ni ikimasu.","say":"バスで学校に行きます。"},{"en":"Let's talk in Japanese.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>で<ruby>話<rt>はな</rt></ruby>しましょう。","rj":"nihongo de hanashimashou.","say":"日本語で話しましょう。"},{"en":"I watched a movie on TV.","jp":"テレビで<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。","rj":"terebi de eiga o mimashita.","say":"テレビで映画を見ました。"},{"en":"Will you go to Osaka by airplane?","jp":"<ruby>飛行機<rt>ひこうき</rt></ruby>で<ruby>大阪<rt>おおさか</rt></ruby>に<ruby>行<rt>い</rt></ruby>きますか？","rj":"hikouki de Osaka ni ikimasuka?","say":"飛行機で大阪に行きますか？"},{"en":"No, I will go to Osaka by the bullet-train.","jp":"いいえ、<ruby>新幹線<rt>しんかんせん</rt></ruby>で<ruby>大阪<rt>おおさか</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。","rj":"iie, shinkansen de Osaka ni ikimasu.","say":"いいえ、新幹線で大阪に行きます。"},{"en":"I will watch a movie on my laptop.","jp":"パソコンで<ruby>映画<rt>えいが</rt></ruby>を<ruby>観<rt>み</rt></ruby>ます。","rj":"pasokon de eiga o mimasu.","say":"パソコンで映画を観ます。"},{"en":"Do you talk with your family in Spanish?","jp":"<ruby>家族<rt>かぞく</rt></ruby>とスペイン<ruby>語<rt>すぺいんご</rt></ruby>で<ruby>話<rt>はな</rt></ruby>しますか？","rj":"kazoku to supeingo de hanashimasuka?","say":"家族とスペイン語で話しますか？"}]}],"verb-masu":[{"num":44,"title":"Ru-verb","vocab":[{"t":"U-verb：行く (iku) - to go","m":"語幹：いき 肯定：行きます (ikimasu)　否定：行きません (ikimasen)","say":"行く"},{"t":"食べる","m":"讀音：たべる（taberu） 意思：to eat 現在肯定形：食べます（tabemasu） 現在否定形：食べません（tabemasen）","say":"食べる"},{"t":"寝る","m":"讀音：ねる（neru） 意思：to sleep 現在肯定形：寝ます（nemasu） 現在否定形：寝ません（nemasen）","say":"寝る"},{"t":"起きる","m":"讀音：おきる（okiru） 意思：to wake up 現在肯定形：起きます（okimasu） 現在否定形：起きません（okimasen）","say":"起きる"},{"t":"見る","m":"讀音：みる（miru） 意思：to look/watch 現在肯定形：見ます（mimasu） 現在否定形：見ません（mimasen）","say":"見る"}],"grammar":["<b>日文動詞會變化成哪三種形態？</b><br><br>(1) 辭書形（dictionary form）  <br>(2) 現在肯定形（present affirmative form）  <br>(3) 現在否定形（present negative form）<br><br><b>規則變化的日文動詞分為哪兩種？</b><br><br>(1) Ru-verbs（る動詞）  <br>(2) U-verbs（う動詞）","<b>Ru-verb 與 U-verb 的現在肯定形／否定形範例比較？</b><br><br><b>Ru-verb</b>：食べる (taberu) - to eat  <br>語幹：たべ  <br>肯定：食べます (tabemasu)　否定：食べません (tabemasen)"],"example":[]},{"num":45,"title":"U-verb","vocab":[{"t":"什麼是 U-verb（U動詞）？","m":"在字典形（辭書形）中，動詞語幹加上母音「U」結尾的動詞。 例如：飲む、読む、話す、聞く、行く、帰る","say":null},{"t":"U-verbs","m":"現在肯定形：去掉「u」，加上「imasu」 現在否定形：去掉「u」，加上「imasen」","say":null},{"t":"飲む","m":"のむ（nomu） 意思：To drink（喝） 現在肯定形：飲みます（nomimasu） 現在否定形：飲みません（nomimasen）","say":"飲む"},{"t":"読む","m":"よむ（yomu） 意思：To read（讀） 現在肯定形：読みます（yomimasu） 現在否定形：読みません（yomimasen）","say":"読む"},{"t":"話す","m":"はなす（hanasu） 意思：To speak/talk（說話） 現在肯定形：話します（hanashimasu） 現在否定形：話しません（hanashimasen）","say":"話す"},{"t":"聞く","m":"きく（kiku） 意思：To listen/hear（聽） 現在肯定形：聞きます（kikimasu） 現在否定形：聞きません（kikimasen）","say":"聞く"},{"t":"行く","m":"いく（iku） 意思：To go（去） 現在肯定形：行きます（ikimasu） 現在否定形：行きません（ikimasen）","say":"行く"},{"t":"帰る","m":"かえる（kaeru） 意思：To go back/return（回去） 現在肯定形：帰ります（kaerimasu） 現在否定形：帰りません（kaerimasen）","say":"帰る"}],"grammar":["<b>Ru-verb 與 U-verb 的現在肯定形/否定形變化規則有什麼不同？</b><br><br><b>Ru-verbs</b>  <br>現在肯定形：去掉「ru」，加上「masu」  <br>現在否定形：去掉「ru」，加上「masen」"],"example":[]},{"num":46,"title":"Irregular verb","vocab":[{"t":"日文中有幾個不規則動詞？分別是什麼？","m":"共有兩個不規則動詞： (1) 来る（くる - kuru）- 來 (2) する（suru）- 做","say":null},{"t":"来る（くる）","m":"讀音：くる 羅馬字：kuru 意思：來 現在肯定形：来ます（kimasu） 現在否定形：来ません（kimasen）","say":"来る（くる）"},{"t":"する","m":"讀音：する 羅馬字：suru 意思：做 現在肯定形：します（shimasu） 現在否定形：しません（shimasen）","say":"する"},{"t":"勉強する（べんきょうする）","m":"讀音：べんきょうする 羅馬字：benkyousuru 意思：學習、唸書 現在肯定形：勉強します（benkyoushimasu） 現在否定形：勉強しません（benkyoushimasen）","say":"勉強する（べんきょうする）"},{"t":"料理する（りょうりする）","m":"讀音：りょうりする 羅馬字：ryourisuru 意思：做菜、烹飪 現在肯定形：料理します（ryourishimasu） 現在否定形：料理しません（ryourishimasen）","say":"料理する（りょうりする）"},{"t":"散歩する（さんぽする）","m":"讀音：さんぽする 羅馬字：sanposuru 意思：散步 現在肯定形：散歩します（sanposhimasu） 現在否定形：散歩しません（sanposhimasen）","say":"散歩する（さんぽする）"},{"t":"旅行する（りょこうする）","m":"讀音：りょこうする 羅馬字：ryokousuru 意思：旅行 現在肯定形：旅行します（ryokoushimasu） 現在否定形：旅行しません（ryokoushimasen）","say":"旅行する（りょこうする）"},{"t":"不規則動詞總表：現在肯定形／否定形","m":"来る（kuru）來 → 来ます／来ません する（suru）做 → します／しません 勉強する（benkyousuru）學習 → 勉強します／勉強しません 料理する（ryourisuru）做菜 → 料理します／料理しません 散歩する（sanposuru）散步 → 散歩します／散歩しません 旅行する（ryokousuru）旅行 → 旅行します／旅行しません","say":"来る"}],"grammar":["<b>来る和する這兩個不規則動詞，除了本身的意思外還有什麼用途？</b><br><br>這兩個動詞也可以用來構成<b>複合動詞</b>（compound verbs），例如：  <br>勉強する（學習）、料理する（做菜）、散歩する（散步）、旅行する（旅行）"],"example":[]},{"num":47,"title":"Verb types and the Present Tense","vocab":[{"t":"よく","m":"(yoku) Often（常常）","say":"よく"},{"t":"テレビ（てれび）","m":"(terebi) TV","say":"テレビ（てれび）"},{"t":"時々（ときどき）","m":"(tokidoki) Sometimes（有時候）","say":"時々（ときどき）"},{"t":"朝ごはん（あさごはん）","m":"(asagohan) Breakfast（早餐）","say":"朝ごはん（あさごはん）"},{"t":"<ruby>明日<rt>あした</rt></ruby>","m":"(ashita) Tomorrow（明天）","say":"<ruby>明日<rt>あした</rt></ruby>"},{"t":"<ruby>京都<rt>きょうと</rt></ruby>","m":"(kyouto) Kyoto（京都，日本城市）","say":"<ruby>京都<rt>きょうと</rt></ruby>"},{"t":"<ruby>今日<rt>きょう</rt></ruby>","m":"(kyou) Today（今天）","say":"<ruby>今日<rt>きょう</rt></ruby>"},{"t":"うち","m":"(uchi) Home / house（家）","say":"うち"},{"t":"日本の映画です。／日本の映画でした。","m":"這兩句分別是現在時和過去時，各是什麼意思？ 現在時：日本（にほん）の映画（えいが）です。 (nihon no eiga desu) = It is a Japanese movie.","say":"日本の映画です。／日本の映画でした。"}],"grammar":["<b>日文動詞的「現在時」(present tense) 表示什麼意思？</b><br><br>動詞「現在時」有兩種意思：  <br>(1) 習慣性、規律性做某事 (habitually or regularly engages in these activities)  <br>(2) 未來將要做、或打算做某事 (will, or is planning to perform these activities in the future)","<b>總結：日文的「現在時」可以用在哪兩種情況？</b><br><br>(1) 談論規律性活動 (regular activities)  <br>(2) 談論未來的活動 (future activities)","<b>過去時</b>：<ruby>日本<rt>にほん</rt></ruby>の<ruby>映画<rt>えいが</rt></ruby>でした。  <br>(nihon no eiga deshita)  <br>= It was a Japanese movie.","**日本の映画じゃないです。／日本の映画じゃなかったです。  <br>這兩句分別是現在否定和過去否定，各是什麼意思？**<br><br><b>現在否定</b>：<ruby>日本<rt>にほん</rt></ruby>の<ruby>映画<rt>えいが</rt></ruby>じゃないです。  <br>(nihon no eiga janaidesu)  <br>= It is not a Japanese movie.<br><br><b>過去否定</b>：<ruby>日本<rt>にほん</rt></ruby>の<ruby>映画<rt>えいが</rt></ruby>じゃなかったです。  <br>(nihon no eiga janakattadesu)  <br>= It was not a Japanese movie."],"example":[{"en":"I often watch TV.","jp":"<ruby>私<rt>わたし</rt></ruby>はよくテレビを見ます。","rj":"watashi wa yoku terebi wo mimasu.","say":"私はよくテレビを見ます。"},{"en":"Mary sometimes does not eat breakfast.","jp":"メアリーさんはときどき朝ごはんを食べません。","rj":"Mary san wa tokidoki asagohan wo tabemasen.","say":"メアリーさんはときどき朝ごはんを食べません。"},{"en":"I will go to Kyoto tomorrow.","jp":"<ruby>私<rt>わたし</rt></ruby>はあした<ruby>京都<rt>きょうと</rt></ruby>に行きます。","rj":"watashi wa ashita kyouto ni ikimasu.","say":"私はあした京都に行きます。"},{"en":"Sue will not return home today.","jp":"スーさんは<ruby>今日<rt>きょう</rt></ruby>うちに帰りません。","rj":"Sue san wa kyou uchi ni kaerimasen.","say":"スーさんは今日うちに帰りません。"}]},{"num":48,"title":"Past tense","vocab":[],"grammar":[],"example":[{"en":"I went home at nine o'clock.","jp":"私は9時に帰りました。","rj":null,"say":"私は9時に帰りました。"},{"en":"I ate sushi last night.","jp":"私は昨日の夜すしを食べました。","rj":null,"say":"私は昨日の夜すしを食べました。"},{"en":"I did not eat sushi last night.","jp":"私は昨日の夜すしを食べませんでした。","rj":null,"say":"私は昨日の夜すしを食べませんでした。"},{"en":"What did you do yesterday?","jp":"昨日何をしましたか？","rj":null,"say":"昨日何をしましたか？"}]},{"num":65,"title":"〜ませんか(Shall we)","vocab":[{"t":"昼ごはん（ひるごはん）","m":"hirugohan 意思：午飯、中午飯 (Lunch)","say":"昼ごはん（ひるごはん）"},{"t":"<ruby>映画<rt>えいが</rt></ruby>","m":"eiga 意思：電影/影片 (Movie/film)","say":"<ruby>映画<rt>えいが</rt></ruby>"},{"t":"<ruby>酒<rt>さけ</rt></ruby>","m":"sake 意思：日本酒 (Japanese sake)","say":"<ruby>酒<rt>さけ</rt></ruby>"},{"t":"「ませんか」邀約句的公式總結是什麼？","m":"公式：現在否定形＋か？ (Present negative + か？)","say":null}],"grammar":["<b>注意：</b>「現在肯定形＋か？」(Present affirmative + か？) <b>不是</b>邀約句，只是一般疑問句。"],"example":[{"en":"Shall we have lunch?","jp":"<ruby>昼<rt>ひる</rt></ruby>ごはんを<ruby>食<rt>た</rt></ruby>べませんか？","rj":"Hirugo wa n o tabemasenka?","say":"昼ごはんを食べませんか？"},{"en":"I will not watch a movie.","jp":"<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ません","rj":"Eiga o mimasen.","say":"映画を見ません"},{"en":"Shall we watch a movie?","jp":"<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ませんか？","rj":"Eiga o mimasenka?","say":"映画を見ませんか？"},{"en":"Shall we go to a cafe?","jp":"カフェに<ruby>行<rt>い</rt></ruby>きませんか？","rj":"Kafeni ikimasenka?","say":"カフェに行きませんか？"},{"en":"Shall we have a drink tomorrow?","jp":"<ruby>明日<rt>あした</rt></ruby><ruby>酒<rt>さけ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>みませんか？","rj":"Ashita sake o nomimasenka?","say":"明日酒を飲みませんか？"},{"en":"Shall we study Japanese?","jp":"<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しませんか？","rj":"Nihongo o benkyoushimasenka?","say":"日本語を勉強しませんか？"}]},{"num":66,"title":"〜ましょう(Let's...!)","vocab":[{"t":"辭書形：勉強する\\*\\*\\*\\*","m":"ます形：勉強します ましょう句：図書館(としょかん)で勉強(べんきょう)しましょう。 意味：一起在圖書館學習吧！（Let's study in the library.）","say":"辭書形：勉強する\\*\\*\\*\\*"},{"t":"辭書形：飲む\\*\\*\\*\\*","m":"ます形：飲(の)みます ましょうか句：カフェでコーヒーを飲(の)みましょうか？ 意味：要不要在咖啡廳喝咖啡呢？（Shall we drink coffee at a cafe?）","say":"辭書形：飲む\\*\\*\\*\\*"},{"t":"辭書形：見る\\*\\*\\*\\*","m":"ます形：見(み)ます 肯定文：(私たちは) 映画(えいが)を見(み)ます。 勧誘：映画(えいが)を見(み)ましょう！（Let's watch a movie!） 疑問：映画(えいが)を見(み)ましょうか？（Shall we watch a movie?）","say":"辭書形：見る\\*\\*\\*\\*"},{"t":"辭書形：する（サッカーをする）","m":"ます形：します 肯定文：(私たちは) あした、サッカーをします。 勧誘：あした、サッカーをしましょう！（Let's play football tomorrow!） 疑問：あした、サッカーをしましょうか？（Shall we play football tomorrow?）","say":"辭書形：する（サッカーをする）"},{"t":"辭書形：行く（キャンプに行く）","m":"ます形：行(い)きます 肯定文：(私たちは) 今週末(こんしゅうまつ)、キャンプに行(い)きます。 勧誘：今週末(こんしゅうまつ)キャンプに行(い)きましょう！（Let's go camping this weekend!） 疑問：今週末(こんしゅうまつ)キャンプに行(い)きましょうか？（Shall we go camping this weekend?）","say":"辭書形：行く（キャンプに行く）"}],"grammar":["<b>如何造出勸誘句（Let&#x27;s ...!）？</b><br><br>Step1：先造出<b>肯定句</b>（ます形）。  <br>Step2：把「ます」換成「<b>ましょう</b>」或「<b>ましょうか？</b>」。","<b>〜ましょう 與 〜ましょうか 的意思差異？</b><br><br><b>動詞ます形</b> + ましょう → 「Let&#x27;s ...!」（比較主動地提議、邀請對方一起做）  <br><b>動詞ます形</b> + ましょうか？ → 「Shall we ...?」（用疑問語氣詢問對方意願，較委婉客氣）"],"example":[]},{"num":68,"title":"Xがあります(There is 非生物)","vocab":[{"t":"みかん（mikan）","m":"Orange（橘子）","say":"みかん"},{"t":"あそこ（asoko）","m":"Over there（那裡）","say":"あそこ"},{"t":"クラス（くらす / kurasu）","m":"Class（課程/班級）","say":"クラス"},{"t":"テスト（てすと / tesuto）","m":"Test（考試/測驗）","say":"テスト"},{"t":"冷蔵庫（れいぞうこ / reizouko）","m":"Fridge（冰箱）","say":"冷蔵庫"},{"t":"パーティー（ぱーてぃー / pa-ti-）","m":"Party（派對）","say":"パーティー"},{"t":"時間（じかん / jikan）","m":"Time（時間）","say":"時間"}],"grammar":["<b>文法規則：</b>Xがあります<b> 是什麼意思？助詞「が」在此扮演什麼角色？</b><br><br>Xがあります 表示「有/存在 X（非生物、無生命的東西）」。  <br>助詞 <b>が</b>(ga) 用來提示/介紹該事物 X。","<b>「Xがあります」可以表達三種不同的意思，分別是什麼？</b><br><br>(1) 某位置有某物 (there is something at a certain location)  <br>(2) 你擁有某物 (you have/own something)  <br>(3) 某活動即將發生 (an event will take place)","<b>使用「(Location)に (Object)が あります」句型時，有哪3個重要規則要注意？</b><br><br>1. 地點要用助詞 <b>に</b>，不是で。<br>2. 地點描述通常放在句子最前面。<br>3. 物品後面通常接助詞 <b>が</b>，不是は。","<b>注意</b>：表達活動地點時要用助詞 <b>で</b>，不是に（跟用法(1)的地點用「に」不同，因為活動的助詞用法遵循一般規則）。","<b>マクドナルド（まくどなるど / makudonarudo）</b><br><br>McDonald&#x27;s（麥當勞）","<b>サーフボード（さーふぼーど / sa-fubo-do）</b><br><br>Surfboard（衝浪板）"],"example":[{"en":"There is a McDonald's over there.","jp":"あそこにマクドナルドがあります。","rj":"Asokonimakudonarudogaarimasu.","say":"あそこにマクドナルドがあります。"},{"en":"I have a fridge at home.","jp":"<ruby>家<rt>いえ</rt></ruby>に<ruby>冷蔵庫<rt>れいぞうこ</rt></ruby>があります。","rj":"Ieni reizoukogaarimasu.","say":"家に冷蔵庫があります。"},{"en":"I have a Japanese lesson. / There is a Japanese lesson.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>のクラスがあります。","rj":"Nihongo no kurasugaarimasu.","say":"日本語のクラスがあります。"},{"en":"I have a test on Tuesday.","jp":"<ruby>火曜日<rt>かようび</rt></ruby>にテストがあります。","rj":"Kayoubinitesutogaarimasu.","say":"火曜日にテストがあります。"},{"en":"I have a test at school.","jp":"<ruby>学校<rt>がっこう</rt></ruby>でテストがあります。","rj":"Gakkoudetesutogaarimasu.","say":"学校でテストがあります。"},{"en":"There is a surfboard over there.","jp":"あそこにサーフボードがあります。","rj":"asoko ni sa-fubo-do ga arimasu.","say":"あそこにサーフボードがあります。"},{"en":"Do you have time?","jp":"<ruby>時間<rt>じかん</rt></ruby>がありますか？","rj":"jikan ga arimasuka?","say":"時間がありますか？"},{"en":"I have a party on Friday.","jp":"<ruby>金曜日<rt>きんようび</rt></ruby>にパーティーがあります。","rj":"kinyoubi ni pa-ti- ga arimasu.","say":"金曜日にパーティーがあります。"}]},{"num":69,"title":"Xがいます(There is 有生命)","vocab":[{"t":"Dog","m":"犬（いぬ - inu）","say":"犬（いぬ"},{"t":"Cat","m":"猫（ねこ - neko）","say":"猫（ねこ"},{"t":"International student","m":"留学生（りゅうがくせい - ryuugakusei）","say":"留学生（りゅうがくせい"},{"t":"Living object（有生命）","m":"(Location) に (Object) が います。 使用動詞「います」","say":"有生命"}],"grammar":["<b>什麼時候要用「います」，而不是「あります」？</b><br><br>當你要表示<b>有生命的人或動物</b>的存在時（而不是無生命的物品），要用動詞 <b>います</b>。<br><br>句型：  <br>(Location) に (Person／生物) が います。  <br>→ 在(地點)有(人／生物)。","<b>使用「(Location)に(生物)がいます」時，有哪三個重要規則？</b><br><br>1. 地點要用助詞 <b>に</b>，而不是 で。<br>2. 地點描述通常放在句子<b>開頭</b>。<br>3. 有生命的對象（living object）後面通常接助詞 <b>が</b>，而不是 は。","<b>います 和 あります 的差異是什麼？（整理總表）</b><br><br><b>Non-living object（無生命）</b>  <br>(Location) に (Object) が あります。  <br>使用動詞「<b>あります</b>」"],"example":[{"en":"There is an international student over there.","jp":"あそこに<ruby>留学生<rt>りゅうがくせい</rt></ruby>がいます。","rj":"asoko ni ryuugakusei ga imasu.","say":"あそこに留学生がいます。"},{"en":"There is a cat over there.","jp":"あそこに<ruby>猫<rt>ねこ</rt></ruby>がいます。","rj":"asoko ni neko ga imasu.","say":"あそこに猫がいます。"}]},{"num":70,"title":"Describing where things are(前後左右上下)","vocab":[{"t":"<ruby>前<rt>まえ</rt></ruby>","m":"In front of","say":"<ruby>前<rt>まえ</rt></ruby>"},{"t":"後ろ（うしろ）","m":"Behind","say":"後ろ（うしろ）"},{"t":"<ruby>隣<rt>となり</rt></ruby>","m":"Next to / Beside","say":"<ruby>隣<rt>となり</rt></ruby>"},{"t":"<ruby>左<rt>ひだり</rt></ruby>","m":"Left","say":"<ruby>左<rt>ひだり</rt></ruby>"},{"t":"<ruby>右<rt>みぎ</rt></ruby>","m":"Right","say":"<ruby>右<rt>みぎ</rt></ruby>"},{"t":"<ruby>中<rt>なか</rt></ruby>","m":"Inside","say":"<ruby>中<rt>なか</rt></ruby>"},{"t":"<ruby>外<rt>そと</rt></ruby>","m":"Outside","say":"<ruby>外<rt>そと</rt></ruby>"},{"t":"<ruby>上<rt>うえ</rt></ruby>","m":"On / Above","say":"<ruby>上<rt>うえ</rt></ruby>"},{"t":"<ruby>下<rt>した</rt></ruby>","m":"Under / Below","say":"<ruby>下<rt>した</rt></ruby>"},{"t":"<ruby>間<rt>あいだ</rt></ruby>","m":"Between","say":"<ruby>間<rt>あいだ</rt></ruby>"},{"t":"「behind ～」的日文說法？","m":"〜の後ろ（うしろ） no ushiro","say":"〜の後ろ（うしろ）"},{"t":"「next to / beside ～」的日文說法？","m":"〜の隣（となり） no tonari","say":"〜の<ruby>隣<rt>となり</rt></ruby>"},{"t":"「inside ～」的日文說法？","m":"〜の中（なか） no naka","say":"〜の<ruby>中<rt>なか</rt></ruby>"},{"t":"「outside ～」的日文說法？","m":"〜の外（そと） no soto","say":"〜の<ruby>外<rt>そと</rt></ruby>"},{"t":"「on / above ～」的日文說法？","m":"〜の上（うえ） no ue","say":"〜の<ruby>上<rt>うえ</rt></ruby>"},{"t":"「under / below ～」的日文說法？","m":"〜の下（した） no shita","say":"〜の<ruby>下<rt>した</rt></ruby>"},{"t":"「傘は机の下です。」是什麼意思？","m":"The umbrella is under the table. 傘（かさ）は机（つくえ）の下（した）です。","say":"<ruby>傘<rt>かさ</rt></ruby>は<ruby>机<rt>つくえ</rt></ruby>の<ruby>下<rt>した</rt></ruby>です。"}],"grammar":["<b>「家の前に車があります。」是什麼意思？</b><br><br>There is a car in front of the house.  <br><ruby>家<rt>いえ</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>に<ruby>車<rt>くるま</rt></ruby>があります。","<b>如何給出更精確的位置說明（例如：在～前面）？</b><br><br>用「〜の＋位置詞」的句型。  <br>〜の<ruby>前<rt>まえ</rt></ruby>　= in front of ～  <br>〜の後ろ（うしろ）　= behind ～  <br>〜の<ruby>横<rt>よこ</rt></ruby>　= beside / next to ～  <br>etc.","<b>「銀行は図書館の隣です。」是什麼意思？</b><br><br>The bank is next to the library.  <br><ruby>銀行<rt>ぎんこう</rt></ruby>は<ruby>図書館<rt>としょかん</rt></ruby>の<ruby>隣<rt>となり</rt></ruby>です。","<b>「車は自転車と家の間です。」是什麼意思？</b><br><br>The car is between the bike and the house.  <br><ruby>車<rt>くるま</rt></ruby>は<ruby>自転車<rt>じてんしゃ</rt></ruby>と<ruby>家<rt>いえ</rt></ruby>の<ruby>間<rt>あいだ</rt></ruby>です。","<b>「我家在學校後面。」的日文怎麼說？</b><br><br><ruby>私<rt>わたし</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>の後ろ（うしろ）です。  <br>My house is behind the school.","<b>「我會在車站裡面等（你）。」的日文怎麼說？</b><br><br><ruby>駅<rt>えき</rt></ruby>の<ruby>中<rt>なか</rt></ruby>で<ruby>待<rt>ま</rt></ruby>ちます。  <br>I will wait (for you) inside the station."],"example":[{"en":"Where is the car?","jp":"<ruby>車<rt>くるま</rt></ruby>はどこですか？","rj":"Kuruma wa doko desu ka?","say":"車はどこですか？"},{"en":"I will wait in front of the cafe.","jp":"カフェの前で待ちます。","rj":null,"say":"カフェの前で待ちます。"}]}],"te-form":[{"num":83,"title":"Te-form rules (Ru-verbs)","vocab":[{"t":"<ruby>食<rt>た</rt></ruby>べる","m":"taberu Te-form：食（た）べて tabete 意思：吃 (to eat)","say":"<ruby>食<rt>た</rt></ruby>べる"},{"t":"<ruby>寝<rt>ね</rt></ruby>る","m":"neru Te-form：寝（ね）て nete 意思：睡覺 (to sleep)","say":"<ruby>寝<rt>ね</rt></ruby>る"},{"t":"<ruby>起<rt>お</rt></ruby>きる","m":"okiru Te-form：起（お）きて okite 意思：起床 (to get up)","say":"<ruby>起<rt>お</rt></ruby>きる"},{"t":"<ruby>見<rt>み</rt></ruby>る","m":"miru Te-form：見（み）て mite 意思：看 (to see/watch)","say":"<ruby>見<rt>み</rt></ruby>る"}],"grammar":["<b>て形(te-form)在日語文法中有哪4種用法？</b><br><br>(1) 請求　「…て。」  <br>(2) 給予/請求許可　「…てもいい？」  <br>(3) 表示禁止　「…てはいけない」  <br>(4) 連接兩個動作/事件　「…て、…」（做了這個又做了那個）","<b>動詞的Te-form變化規則，需要依動詞種類分成幾大類？</b><br><br>3大類：  <br>(1) る動詞 (Ru-verbs)  <br>(2) う動詞 (U-verbs，再分5個子規則)  <br>(3) 不規則動詞 (Irregular verbs)","<b>整理：る動詞(Ru-verbs) Te-form 總表</b><br><br>規則：去る，加て<br><br>辭書形 → Te-form（意思）  <br><ruby>食<rt>た</rt></ruby>べる → <ruby>食<rt>た</rt></ruby>べて（吃）  <br><ruby>寝<rt>ね</rt></ruby>る → <ruby>寝<rt>ね</rt></ruby>て（睡覺）  <br><ruby>起<rt>お</rt></ruby>きる → <ruby>起<rt>お</rt></ruby>きて（起床）  <br><ruby>見<rt>み</rt></ruby>る → <ruby>見<rt>み</rt></ruby>て（看）"],"example":[]},{"num":84,"title":"Te-form rules (U-verbs)","vocab":[{"t":"什麼是「Te-form」？","m":"動詞的一種新變化型態，是日文文法中非常重要的一環。 本課將學習 Te-form 的 4 種主要用法。","say":null},{"t":"会う（あう / au）","m":"Te-form：会って（あって / atte） 意思：見面、遇見 子規則：Group 1（う・つ・る → って）","say":"会う"},{"t":"待つ（まつ / matsu）","m":"Te-form：待って（まって / matte） 意思：等待 子規則：Group 1（う・つ・る → って）","say":"待つ"},{"t":"取る（とる / toru）","m":"Te-form：取って（とって / totte） 意思：拿、取 子規則：Group 1（う・つ・る → って）","say":"取る"},{"t":"読む（よむ / yomu）","m":"Te-form：読んで（よんで / yonde） 意思：讀、看（書） 子規則：Group 2（む・ぶ・ぬ → んで）","say":"読む"},{"t":"遊ぶ（あそぶ / asobu）","m":"Te-form：遊んで（あそんで / asonde） 意思：玩 子規則：Group 2（む・ぶ・ぬ → んで）","say":"遊ぶ"},{"t":"死ぬ（しぬ / shinu）","m":"Te-form：死んで（しんで / shinde） 意思：死 子規則：Group 2（む・ぶ・ぬ → んで）","say":"死ぬ"},{"t":"書く（かく / kaku）","m":"Te-form：書いて（かいて / kaite） 意思：寫 子規則：Group 3（く → いて）","say":"書く"},{"t":"泳ぐ（およぐ / oyogu）","m":"Te-form：泳いで（およいで / oyoide） 意思：游泳 子規則：Group 4（ぐ → いで）","say":"泳ぐ"},{"t":"話す（はなす / hanasu）","m":"Te-form：話して（はなして / hanashite） 意思：說話、談話 子規則：Group 5（す → して）","say":"話す"},{"t":"う動詞 Te-form 五種子規則總表","m":"Group 1（う・つ・る）→ って　例：会う→会って、待つ→待って、取る→取って Group 2（む・ぶ・ぬ）→ んで　例：読む→読んで、遊ぶ→遊んで、死ぬ→死んで Group 3（く）→ いて　例：書く→書いて Group 4（ぐ）→ いで　例：泳ぐ→泳いで Group 5（す）→ して　例：話す→話して","say":null}],"grammar":["<b>Te-form 的 4 種主要用法是什麼？</b><br><br>(1) 表示請求（「……可以嗎？」）  <br>(2) 給予／詢問許可（「你可以……」／「我可以……嗎？」）  <br>(3) 表示禁止（「不可以……」）  <br>(4) 連接兩件事或動作的句子（「做了這個又做了那個」）","<b>Te-form 的變化規則要依動詞種類分別學習，是哪三大類？う動詞的規則又再分成幾種子規則？</b><br><br>三大類：  <br>(1) る動詞（ru-verbs）  <br>(2) う動詞（u-verbs）  <br>(3) 不規則動詞（irregular verbs）<br><br>う動詞的規則再細分成 <b>5 種子規則</b>，依辭書形的最後一個字判斷。","<b>注意：</b>Te-form 與「ます形前的語幹」是完全不同的東西，不要把る動詞的規則（たべる→たべて、たべます）套用在う動詞上，例如「会う」的Te-form不是「会いて」，而是「会って」；「読む」的Te-form不是「読みて」，而是「読んで」。","<b>記憶技巧：</b>建議把每個動詞的辭書形、ます形、Te-form一起記成一組，例如：かく（辭書形）→ かきます（ます形）→ かいて（Te-form）。"],"example":[]},{"num":86,"title":"Te-form Usage 1","vocab":[{"t":"「名前」怎麼唸？意思是什麼？","m":"名前（なまえ - namae） - 名字 / 姓名","say":"名前（なまえ"},{"t":"日文怎麼說「在...前面」和「車站」？","m":"駅（えき - eki） - 車站 ～の前（まえ）で（~ no mae de） - 在～的前面","say":"駅（えき"},{"t":"日文怎麼說「每天」和「早餐」？","m":"毎日（まいにち - mainichi） - 每天 朝（あさ）ごはん（asagohan） - 早餐","say":"毎日（まいにち"}],"grammar":["<b>日文的 Te-form（て形）有哪 4 種主要用法？</b><br><br><b>(1)</b> 做請求「～てください」（請...）  <br><b>(2)</b> 給予/請求許可「～てもいい」（可以.../我可以...嗎？）  <br><b>(3)</b> 表示禁止「～てはいけない」（不可以...）  <br><b>(4)</b> 連接兩個動作/事件的句子（做了...然後做了...）","<b>日文動詞的 Te-form 變化規則怎麼分類？</b><br><br>Te-form 的變化規則依動詞類型分為三大類：  <br><b>(1)</b> る動詞（ru-verbs）  <br><b>(2)</b> う動詞（u-verbs）  <br><b>(3)</b> 不規則動詞（irregular verbs）<br><br>其中<b>う動詞（u-verbs）</b>又再細分為<b>5種子規則</b>。","<b>不規則動詞（する、くる）的 Te-form 怎麼變化？</b><br><br><b>する</b>（suru，辭書形）→ <b>して</b>（shite，Te-form） - 意思：做  <br><b>くる</b>（kuru，辭書形）→ <b>きて</b>（kite，Te-form） - 意思：來","<b>【總結】日文的請求句型公式是什麼？</b><br><br><b>Te-form + ください</b>（kudasai） = 「請幫我做...」<br><br>例句總覽：  <br>・名前を書いてください。（請寫下名字。）  <br>・すみません、助けてください。（請幫助我。）  <br>・駅の前で待ってください。（請在車站前等我。）  <br>・この本を読んでください。（請讀這本書。）  <br>・毎日朝ごはんを食べてください。（請每天吃早餐。）  <br>・10時に寝てください。（請10點睡覺。）"],"example":[{"en":"Please write down your name.","jp":"<ruby>名前<rt>なまえ</rt></ruby>を<ruby>書<rt>か</rt></ruby>いてください。","rj":"Namae o kaitekudasai.","say":"名前を書いてください。"},{"en":"Please wait (for me) in front of the station.","jp":"<ruby>駅<rt>えき</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>で<ruby>待<rt>ま</rt></ruby>ってください。","rj":"Eki no maede mattekudasai.","say":"駅の前で待ってください。"},{"en":"Please read this book.","jp":"この<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでください。","rj":"Kono hon o yondekudasai.","say":"この本を読んでください。"},{"en":"Please eat breakfast everyday.","jp":"<ruby>毎日<rt>まいにち</rt></ruby><ruby>朝<rt>あさ</rt></ruby>ごはんを<ruby>食<rt>た</rt></ruby>べてください。","rj":"Mainichi asago wa n o tabetekudasai.","say":"毎日朝ごはんを食べてください。"},{"en":"juuji ni nete kudasai.","jp":"10<ruby>時<rt>じ</rt></ruby>に<ruby>寝<rt>ね</rt></ruby>てください。","rj":"10 jini netekudasai.","say":"10時に寝てください。"}]},{"num":87,"title":"Te-form Usage 2","vocab":[{"t":"<ruby>水<rt>みず</rt></ruby>","m":"mizu Water（水）","say":"<ruby>水<rt>みず</rt></ruby>"},{"t":"<ruby>窓<rt>まど</rt></ruby>","m":"mado Window（窗）","say":"<ruby>窓<rt>まど</rt></ruby>"},{"t":"開ける（あける）","m":"akeru To open（打開）","say":"開ける（あける）"},{"t":"<ruby>写真<rt>しゃしん</rt></ruby>","m":"shasin Photo（照片）","say":"<ruby>写真<rt>しゃしん</rt></ruby>"},{"t":"飲む（のむ）","m":"To drink Te-form：飲んで（のんで / nonde） この水（みず）を飲（の）んでもいいですか？ （May I drink this water?） この水（みず）を飲（の）んでもいいです。 （You may drink this water.） この水（みず）を飲（の）んではいけません。 （You may not drink this water.）","say":"飲む（のむ）"},{"t":"見る（みる）","m":"To see Te-form：見て（みて / mite） 教科書（きょうかしょ）を見（み）てもいいですか？ （May I see the textbook?） はい、見（み）てもいいです。 （Yes, you may.） いいえ、見（み）てはいけません。 （No, you may not.）","say":"見る（みる）"},{"t":"とる","m":"To take (a photo) Te-form：とって（totte） あなたの写真（しゃしん）をとってもいいですか？ （May I take a photo of you?） 私（わたし）の写真（しゃしん）をとってもいいです。 （You may take a photo of me.） 私（わたし）の写真（しゃしん）をとってはいけません。 （You may not take a photo o","say":"とる"},{"t":"開ける（あける）","m":"To open Te-form：開けて（あけて / akete） 窓（まど）を開（あ）けてもいいですか？ （May I open the window?） 窓（まど）を開（あ）けてもいいです。 （You may open the window.） 窓（まど）を開（あ）けてはいけません。 （You may not open the window.）","say":"開ける（あける）"}],"grammar":["<b>【總結】Te-form 表達許可／禁止的三個句型分別是？</b><br><br><b>1. 描述被允許的行為</b>：Te-form + もいいです（moiidesu）  <br>→「You may do …」","<b>2. 詢問許可</b>：Te-form + もいいですか？（moiidesuka?）  <br>→「May I …?」","<b>3. 表達禁止</b>：Te-form + はいけません（waikemasen）  <br>→「You may not (must not) …」"],"example":[{"en":"You may drink this water.","jp":"この<ruby>水<rt>みず</rt></ruby>を<ruby>飲<rt>の</rt></ruby>んでもいいです。","rj":"Kono mizu o nondemoii desu.","say":"この水を飲んでもいいです。"},{"en":"May I open the window?","jp":"<ruby>窓<rt>まど</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けてもいいですか？","rj":"Mado o aketemoii desu ka?","say":"窓を開けてもいいですか？"},{"en":"You may not take a photo of me.","jp":"<ruby>私<rt>わたし</rt></ruby>の<ruby>写真<rt>しゃしん</rt></ruby>をとってはいけません。","rj":"Watashi no shashin o totte wa ikemasen.","say":"私の写真をとってはいけません。"}]},{"num":93,"title":"〜ている","vocab":[{"t":"料理する（りょうりする）","m":"ryourisuru To cook（做料理）","say":"料理する（りょうりする）"},{"t":"プール","m":"pu-ru Pool（游泳池）","say":"プール"},{"t":"<ruby>手紙<rt>てがみ</rt></ruby>","m":"tegami Letter（信）","say":"<ruby>手紙<rt>てがみ</rt></ruby>"},{"t":"パンケーキ（ぱんけーき）","m":"pankeeki Pancake（鬆餅）","say":"パンケーキ（ぱんけーき）"},{"t":"未來動作：","m":"スーは勉強（べんきょう）します。 Su- wa benkyoushimasu. \"Sue will study.\" ―――――― 動作進行中： たけしは本（ほん）を読（よ）んでいます。 Takeshi wa hon wo yonde imasu. \"Takeshi is reading a book.\"","say":"未來動作"},{"t":"未來動作：","m":"たけしは本（ほん）を読（よ）みます。 Takeshi wa hon wo yomimasu. \"Takeshi (will) reads a book.\"","say":"未來動作"},{"t":"読む（よむ - to read）","m":"たけしは本（ほん）を読（よ）んでいます。 Takeshi wa hon wo yonde imasu. \"Takeshi is reading a book.\"","say":"読む"},{"t":"料理する（りょうりする - to cook）","m":"私（わたし）のお母（かあ）さんは今（いま）料理（りょうり）しています。 Watashi no okaasan wa ima ryourishite imasu. \"My mother is cooking now.\"","say":"料理する"},{"t":"食べる（たべる - to eat）","m":"メアリー（めありー）はパンケーキ（ぱんけーき）を食（た）べています。 Mary wa pankeeki wo ta
