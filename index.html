apanese friend of mine.","jp":"<ruby>漢字<rt>かんじ</rt></ruby>がわからなかったので、<ruby>日本人<rt>にほんじん</rt></ruby>の<ruby>友達<rt>ともだち</rt></ruby>に<ruby>聞<rt>き</rt></ruby>いてみました。","rj":"Kanji ga wakaranakatta node, nihonjin no tomodachi ni kiite mimashita.","say":"漢字がわからなかったので、日本人の友達に聞いてみました。"},{"en":"Miki say that this cake is good, I will have a piece.","jp":"みきがこのケーキは<ruby>美味<rt>おい</rt></ruby>しいと<ruby>言<rt>い</rt></ruby>っていましたから、<ruby>食<rt>た</rt></ruby>べてみます。","rj":"Miki ga kono keeki wa oishii to itte imashita kara, tabete mimasu.","say":"みきがこのケーキは美味しいと言っていましたから、食べてみます。"},{"en":"(In response to \"That game was fun!\") (Then,) I will play the game.","jp":"じゃあ、そのゲームをしてみます。","rj":"Jaa, sono geemu o shite mimasu.","say":"じゃあ、そのゲームをしてみます。"},{"en":"(In response to \"That movie was good!\") I will watch the movie.","jp":"その<ruby>映画<rt>えいが</rt></ruby>を<ruby>観<rt>み</rt></ruby>てみます。","rj":"Sono eiga o mite mimasu.","say":"その映画を観てみます。"},{"en":"(In response to \"This book was good!\") I will read the book.","jp":"その<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでみます。","rj":"Sono hon o yonde mimasu.","say":"その本を読んでみます。"},{"en":"Taeko said the museum was good. I want to try going there.","jp":"たえこは<ruby>美術館<rt>びじゅつかん</rt></ruby>が<ruby>良<rt>よ</rt></ruby>かったと<ruby>言<rt>い</rt></ruby>っていました。あそこに<ruby>行<rt>い</rt></ruby>ってみたいです。","rj":"Taeko wa bijutsukan ga yokatta to itte imashita. Asoko ni itte mitai desu.","say":"たえこは美術館が良かったと言っていました。あそこに行ってみたいです。"},{"en":"I tried reading the book. But I did not have time.","jp":"その<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでみました。でも、<ruby>時間<rt>じかん</rt></ruby>がありませんでした。","rj":"Sono hon o yonde mimashita. Demo, jikan ga arimasen deshita.","say":"その本を読んでみました。でも、時間がありませんでした。"}]},{"num":193,"title":"The usage of なら","vocab":[{"t":"ブラジル（ぶらじる）","m":"burajiru 意思：巴西 (Brazil)","say":"ブラジル（ぶらじる）"},{"t":"メキシコ（めきしこ）","m":"mekishiko 意思：墨西哥 (Mexico)","say":"メキシコ（めきしこ）"},{"t":"肉（にく）","m":"niku 意思：肉 (meat)","say":"肉（にく）"},{"t":"魚（さかな）","m":"sakana 意思：魚 (fish)","say":"魚（さかな）"},{"t":"バイク（ばいく）","m":"baiku 意思：摩托車 (motorbike)","say":"バイク（ばいく）"},{"t":"自転車（じてんしゃ）","m":"jitensha 意思：腳踏車 (bicycle)","say":"自転車（じてんしゃ）"},{"t":"車（くるま）","m":"kuruma 意思：汽車 (car)","say":"車（くるま）"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"買う（かう）","m":"kau 意思：買 (to buy)","say":"買う（かう）"},{"t":"飼う（かう）","m":"kau 意思：飼養 (to keep/own a pet)","say":"飼う（かう）"},{"t":"猫（ねこ）","m":"neko 意思：貓 (cat)","say":"猫（ねこ）"},{"t":"犬（いぬ）","m":"inu 意思：狗 (dog)","say":"犬（いぬ）"}],"grammar":["<b>「なら」是什麼意思？主要用在什麼情境？</b><br><br>「名詞Ａ　なら　述語Ｘ」這個句型表示「述語Ｘ」只適用於Ａ，並不是普遍成立的事實，帶有「限定」與「對比」的語感。なら 常用來針對對方剛剛提到的幾個項目之一，特別挑出來做出一個「正面」的敘述，藉此與另一個被排除在外的項目形成對比（例如對方問「你去過巴西嗎？」，回答者用「メキシコなら…」單獨針對墨西哥做出肯定的敘述，暗示巴西並非如此）。","<b>「なら」怎麼接？常見的句型結構是什麼？</b><br><br>「なら」直接接在名詞之後（名詞＋なら），構成假設／對比句。實際使用時最常見的固定句型是：「Ａなら～ますが、Ｂは～ません（或～たくないです等否定形）」，先用「なら」對Ａ做出正面、肯定的敘述，再用「は」對Ｂ做出相反（通常是否定）的敘述，形成兩者之間鮮明的對比。"],"example":[{"en":"I've been to Mexico, but never been to Brazil.","jp":"メキシコなら<ruby>行<rt>い</rt></ruby>ったことがありますが、ブラジルは<ruby>行<rt>い</rt></ruby>ったことがありません。","rj":"Mekishiko nara itta koto ga arimasu ga, Burajiru wa itta koto ga arimasen.","say":"メキシコなら行ったことがありますが、ブラジルは行ったことがありません。"},{"en":"If it is in hiragana, I understand.","jp":"ひらがなならわかります。","rj":"Hiragana nara wakarimasu.","say":"ひらがなならわかります。"},{"en":"I will be free on Sunday, but I am not free on Saturday.","jp":"<ruby>日曜日<rt>にちようび</rt></ruby>なら<ruby>暇<rt>ひま</rt></ruby>ですが、<ruby>土曜日<rt>どようび</rt></ruby>は<ruby>暇<rt>ひま</rt></ruby>じゃありません。","rj":"Nichiyoubi nara hima desu ga, doyoubi wa hima ja arimasen.","say":"日曜日なら暇ですが、土曜日は暇じゃありません。"},{"en":"I eat fish, but I don't eat meat.","jp":"<ruby>魚<rt>さかな</rt></ruby>なら<ruby>食<rt>た</rt></ruby>べますが、<ruby>肉<rt>にく</rt></ruby>は<ruby>食<rt>た</rt></ruby>べません。","rj":"Sakana nara tabemasu ga, niku wa tabemasen.","say":"魚なら食べますが、肉は食べません。"},{"en":"I want to buy a car, but I don't want to buy a motorbike.","jp":"<ruby>車<rt>くるま</rt></ruby>なら<ruby>買<rt>か</rt></ruby>いたいですが、バイクは<ruby>買<rt>か</rt></ruby>いたくないです。","rj":"Kuruma nara kaitai desu ga, baiku wa kaitakunai desu.","say":"車なら買いたいですが、バイクは買いたくないです。"},{"en":"I've owned a dog, but I've never owned a cat.","jp":"<ruby>犬<rt>いぬ</rt></ruby>なら<ruby>飼<rt>か</rt></ruby>ったことがありますが、<ruby>猫<rt>ねこ</rt></ruby>は<ruby>飼<rt>か</rt></ruby>ったことがありません。","rj":"Inu nara katta koto ga arimasu ga, neko wa katta koto ga arimasen.","say":"犬なら飼ったことがありますが、猫は飼ったことがありません。"}]},{"num":195,"title":"I want (Thing)","vocab":[{"t":"おもちゃ","m":"omocha 意思：玩具 (toy)","say":"おもちゃ"},{"t":"お金（おかね）","m":"okane 意思：錢 (money)","say":"お金（おかね）"},{"t":"パソコン（ぱそこん）","m":"pasokon 意思：筆記型電腦 (laptop)","say":"パソコン（ぱそこん）"},{"t":"ドーナツ（どーなつ）","m":"doonatsu 意思：甜甜圈 (donut)","say":"ドーナツ（どーなつ）"},{"t":"ぬいぐるみ","m":"nuigurumi 意思：填充玩偶 (stuffed animal)","say":"ぬいぐるみ"},{"t":"卵（たまご）","m":"tamago 意思：蛋 (egg)","say":"卵（たまご）"},{"t":"休日（きゅうじつ）","m":"kyuujitsu 意思：假日 (holiday)","say":"休日（きゅうじつ）"},{"t":"辞書（じしょ）","m":"jisho 意思：字典 (dictionary)","say":"辞書（じしょ）"},{"t":"大きい（おおきい）","m":"ookii 意思：大的 (large)","say":"大きい（おおきい）"},{"t":"犬（いぬ）","m":"inu 意思：狗 (dog)","say":"犬（いぬ）"},{"t":"アイスクリーム（あいすくりーむ）","m":"aisukuriimu 意思：冰淇淋 (ice cream)","say":"アイスクリーム（あいすくりーむ）"},{"t":"友達（ともだち）","m":"tomodachi 意思：朋友 (friend)","say":"友達（ともだち）"}],"grammar":["<b>ほしい 是什麼意思？怎麼接？</b><br><br>「ほしい」是「（我）想要···」的意思，用來表達說話者自己想要某個東西。它是一個い形容詞，變化方式和一般い形容詞相同：現在肯定形是「[對象]が ほしいです」，現在否定形是「[對象]は/が ほしくないです」，過去肯定形是「[對象]が ほしかったです」，過去否定形則是「[對象]は/が ほしくありませんでした」。表示想要的對象後面通常接助詞「が」，否定句時「は」也很常用。","<b>為什麼ほしい主要只能用在第一人稱（說話者）身上？</b><br><br>「ほしい」和之前學過的「たい」（想做···）一樣，屬於「私秘述語」，也就是只有當事人自己才知道的內心感受。因此原則上只能用來直接描述說話者本人的感受；其他人到底想不想要某樣東西，說話者只能靠觀察或推測來判斷，所以日文文法上要求在對第二、三人稱使用私秘述語時，必須加上額外的表達方式，不能直接用「〜はほしいです」這種說法。","<b>要表達「某人推測、猜想不確定」的語氣時怎麼說？</b><br><br>可以在ほしい（或其變化形，如ほしくない）後面加上「でしょう」，表示這只是說話者的推測或猜測，而非確定的事實。例如：きょうこはドーナツがほしくないでしょう。（京子大概不想要甜甜圈吧。）","<b>要表達「某人說他自己想要···」時怎麼說？</b><br><br>可以用ほしい的現在肯定短形（辭書形）加上「と言っています」，表示「（某人）說他想要···」，也就是引用當事人自己說出來的話。例如：ロバートはパソコンがほしいと言っています。（羅伯特說他想要一台筆電。）","<b>要客觀描述看起來「某人想要」某物時，還有什麼說法？跟ほしい有什麼不同？</b><br><br>ほしい也有一個對應的動詞「ほしがる」，屬於う動詞，通常以「ほしがっている」的形式出現，用來表示說話者根據觀察，判斷某人目前想要某物。和ほしい不同的是，ほしがる／ほしがっている後面接的「想要的對象」要用助詞「を」，而不是「が」。例如：トムは友達をほしがっています。（據我了解，湯姆想要一個朋友。）"],"example":[{"en":"I want a good kanji dictionary.","jp":"いい<ruby>漢字<rt>かんじ</rt></ruby>の<ruby>辞書<rt>じしょ</rt></ruby>がほしいです。","rj":"Ii kanji no jisho ga hoshii desu.","say":"いい漢字の辞書がほしいです。"},{"en":"I wanted a toy Godzilla.","jp":"ゴジラのおもちゃがほしかったです。","rj":"Gojira no omocha ga hoshikatta desu.","say":"ゴジラのおもちゃがほしかったです。"},{"en":"I don't have much desire for money.","jp":"お<ruby>金<rt>かね</rt></ruby>はあまりほしくありません。","rj":"Okane wa amari hoshiku arimasen.","say":"お金はあまりほしくありません。"},{"en":"I want a stuffed animal.","jp":"ぬいぐるみがほしいです。","rj":"Nuigurumi ga hoshii desu.","say":"ぬいぐるみがほしいです。"},{"en":"I don't want eggs.","jp":"<ruby>卵<rt>たまご</rt></ruby>はほしくありません。","rj":"Tamago wa hoshiku arimasen.","say":"卵はほしくありません。"},{"en":"I wanted holidays.","jp":"<ruby>休日<rt>きゅうじつ</rt></ruby>がほしかったです。","rj":"Kyuujitsu ga hoshikatta desu.","say":"休日がほしかったです。"},{"en":"I did not want a large dog.","jp":"<ruby>大<rt>おお</rt></ruby>きい<ruby>犬<rt>いぬ</rt></ruby>はほしくありませんでした。","rj":"Ookii inu wa hoshiku arimasen deshita.","say":"大きい犬はほしくありませんでした。"},{"en":"Probably Kyoko does not want a donut.","jp":"きょうこはドーナツがほしくないでしょう。","rj":"Kyouko wa doonatsu ga hoshikunai deshou.","say":"きょうこはドーナツがほしくないでしょう。"},{"en":"Robert says he wants a laptop.","jp":"ロバートはパソコンがほしいと<ruby>言<rt>い</rt></ruby>っています。","rj":"Robaato wa pasokon ga hoshii to itte imasu.","say":"ロバートはパソコンがほしいと言っています。"},{"en":"(I understand that) Tom wants a friend.","jp":"トムは<ruby>友達<rt>ともだち</rt></ruby>をほしがっています。","rj":"Tomu wa tomodachi o hoshigatte imasu.","say":"トムは友達をほしがっています。"},{"en":"Mika wants icecream.","jp":"みかはアイスクリームをほしがっています。","rj":"Mika wa aisukuriimu o hoshigatte imasu.","say":"みかはアイスクリームをほしがっています。"}]},{"num":196,"title":"あげる・くれる","vocab":[{"t":"花（はな）","m":"hana 意思：花 (flower)","say":"花（はな）"},{"t":"時計（とけい）","m":"tokei 意思：手錶、時鐘 (watch)","say":"時計（とけい）"},{"t":"両親（りょうしん）","m":"ryoushin 意思：父母、雙親 (parents)","say":"両親（りょうしん）"},{"t":"大統領（だいとうりょう）","m":"daitouryou 意思：總統 (president)","say":"大統領（だいとうりょう）"},{"t":"靴（くつ）","m":"kutsu 意思：鞋子 (shoes)","say":"靴（くつ）"},{"t":"招待状（しょうたいじょう）","m":"shoutaijou 意思：邀請函 (invitation letter)","say":"招待状（しょうたいじょう）"}],"grammar":["<b>日文有兩個表示「給」的動詞：あげる 和 くれる，這兩個字要怎麼分辨、選用哪一個？</b><br><br>選用哪一個取決於「給予的方向」，方向軸是：「他人」←「你」←「我」。<br><br><b>あげる</b>（給出去，由內往外）用在：①「我」給某人；②「你」給「我」以外的人；③「他人」給「他人」。<br><br><b>くれる</b>（給進來，由外往內）用在：①「他人」給「我」；②「他人」給「你」；③「你」給「我」。","<b>あげる／くれる 的句型公式是什麼？助詞怎麼用？</b><br><br>(Giver)が／は　(Recipient)に　(物)を　あげる／くれる。<br><br>兩者皆以「給予者（Giver）」為主語，用助詞「は／が」；「接受者（Recipient）」則用助詞「に」。","<b>當「與自己非常親近的人」收到東西時，可以怎麼用 くれる？</b><br><br>當家人、摯友收到東西，而自己也覺得受惠時，即使自己不是接受者本人，也可以用 くれる。例如：大統領（だいとうりょう）が　妹（いもうと）に　手紙（てがみ）を　くれました。（大統領給我妹妹一封信。）因為妹妹是自己的家人，所以用 くれる 而非 もらう。"],"example":[{"en":"I will give Maki flowers.","jp":"<ruby>私<rt>わたし</rt></ruby>はまきに<ruby>花<rt>はな</rt></ruby>をあげます。","rj":"Watashi wa maki ni hana o agemasu.","say":"私はまきに花をあげます。"},{"en":"Tomo gave Saki a watch.","jp":"ともはさきに<ruby>時計<rt>とけい</rt></ruby>をあげました。","rj":"Tomo wa saki ni tokei o agemashita.","say":"ともはさきに時計をあげました。"},{"en":"My parents may give me a new car.","jp":"<ruby>両親<rt>りょうしん</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>に<ruby>車<rt>くるま</rt></ruby>をくれるかもしれません。","rj":"Ryoushin wa watashi ni kuruma o kureru kamoshiremasen.","say":"両親は私に車をくれるかもしれません。"},{"en":"The President gave my little sister a letter.","jp":"<ruby>大統領<rt>だいとうりょう</rt></ruby>が<ruby>妹<rt>いもうと</rt></ruby>に<ruby>手紙<rt>てがみ</rt></ruby>をくれました。","rj":"Daitouryou ga imouto ni tegami o kuremashita.","say":"大統領が妹に手紙をくれました。"},{"en":"I will give shoes to Kota.","jp":"<ruby>私<rt>わたし</rt></ruby>はこうたに<ruby>靴<rt>くつ</rt></ruby>をあげます。","rj":"Watashi wa Kouta ni kutsu o agemasu.","say":"私はこうたに靴をあげます。"},{"en":"What did you give to your mother?","jp":"あなたはお<ruby>母<rt>かあ</rt></ruby>さんに<ruby>何<rt>なに</rt></ruby>をあげましたか。","rj":"Anata wa okaasan ni nani o agemashita ka.","say":"あなたはお母さんに何をあげましたか。"},{"en":"My older sister gave me a book.","jp":"お<ruby>姉<rt>ねえ</rt></ruby>ちゃんは<ruby>本<rt>ほん</rt></ruby>をくれました。","rj":"Oneechan wa hon o kuremashita.","say":"お姉ちゃんは本をくれました。"},{"en":"Did Takako give you anything?","jp":"たかこはあなたに<ruby>何<rt>なに</rt></ruby>かくれましたか。","rj":"Takako wa anata ni nanika kuremashita ka.","say":"たかこはあなたに何かくれましたか。"},{"en":"Michiru did not give Takashi an invitation letter.","jp":"みちるはたかしに<ruby>招待状<rt>しょうたいじょう</rt></ruby>をあげませんでした。","rj":"Michiru wa Takashi ni shoutaijou o agemasen deshita.","say":"みちるはたかしに招待状をあげませんでした。"}]},{"num":197,"title":"もらう","vocab":[{"t":"辞書（じしょ）","m":"jisho 意思：字典 (dictionary)","say":"辞書（じしょ）"},{"t":"姉（あね）","m":"ane 意思：姊姊 (older sister)","say":"姉（あね）"},{"t":"手紙（てがみ）","m":"tegami 意思：信 (letter)","say":"手紙（てがみ）"},{"t":"妹（いもうと）","m":"imouto 意思：妹妹 (little sister)","say":"妹（いもうと）"},{"t":"チョコレート（ちょこれーと）","m":"chokore-to 意思：巧克力 (chocolate)","say":"チョコレート（ちょこれーと）"},{"t":"プレゼント（ぷれぜんと）","m":"purezento 意思：禮物 (present)","say":"プレゼント（ぷれぜんと）"},{"t":"友達（ともだち）","m":"tomodachi 意思：朋友 (friend)","say":"友達（ともだち）"},{"t":"酒（さけ）","m":"sake 意思：酒 (sake)","say":"酒（さけ）"},{"t":"何か（なにか）","m":"nanika 意思：什麼（疑問） (anything)","say":"何か（なにか）"}],"grammar":["<b>もらう 是什麼意思？跟 くれる 有什麼關係？</b><br><br>用 くれる 描述的授受行為，也可以改由「接受」的角度，用 もらう 來表達。もらう 與 くれる 一樣，代表說話者立場偏向接受者。","<b>もらう 的句型公式與助詞規則是什麼？</b><br><br>(Recipient)は／が　(Giver)に／から　(物)を　もらう。「接受者」為主語，用「は／が」；「給予者」用「に」或「から」，兩者皆可。もらう 是 u-verb（五段動詞）：もらう→もらいます／もらいました／もらいませんでした。","<b>為什麼「給予者是我」時不能用 もらう？</b><br><br>因為 もらう 代表說話者立場偏向接受者，若給予者是「我」，就違反了這個立場。例如不能說「あなたは私から手紙をもらいましたか」。","<b>站在第三者角度時，もらう 可以怎麼使用？</b><br><br>若能站在接受者的角度，第三者之間的授受也可以用 もらう。例如：妹（いもうと）は　大統領（だいとうりょう）から　手紙（てがみ）を　もらいました。"],"example":[{"en":"I received a dictionary from my older sister.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>姉<rt>あね</rt></ruby>に<ruby>辞書<rt>じしょ</rt></ruby>をもらいました。","rj":"Watashi wa ane ni jisho o moraimashita.","say":"私は姉に辞書をもらいました。"},{"en":"Did you receive a letter from Kei?","jp":"あなたはけいに<ruby>手紙<rt>てがみ</rt></ruby>をもらいましたか。","rj":"Anata wa Kei ni tegami o moraimashita ka.","say":"あなたはけいに手紙をもらいましたか。"},{"en":"I received a chocolate from Mary.","jp":"<ruby>私<rt>わたし</rt></ruby>はメアリーからチョコレートをもらいました。","rj":"Watashi wa Meari- kara chokore-to o moraimashita.","say":"私はメアリーからチョコレートをもらいました。"},{"en":"Tomoka received a present from her friends.","jp":"ともかは<ruby>友達<rt>ともだち</rt></ruby>からプレゼントをもらいました。","rj":"Tomoka wa tomodachi kara purezento o moraimashita.","say":"ともかは友達からプレゼントをもらいました。"},{"en":"Sato did not receive sake from Tadashi.","jp":"さとはただしから<ruby>酒<rt>さけ</rt></ruby>をもらいませんでした。","rj":"Sato wa Tadashi kara sake o moraimasen deshita.","say":"さとはただしから酒をもらいませんでした。"},{"en":"Did Miki receive anything from Kai?","jp":"みきはかいから<ruby>何<rt>なに</rt></ruby>かもらいましたか。","rj":"Miki wa Kai kara nanika moraimashita ka.","say":"みきはかいから何かもらいましたか。"}]},{"num":198,"title":"〜たらどうですか","vocab":[{"t":"薬（くすり）","m":"kusuri 意思：藥 (medicine)","say":"薬（くすり）"},{"t":"薬を飲む（くすりをのむ）","m":"kusuri o nomu 意思：吃藥 (to take medicine)","say":"薬を飲む（くすりをのむ）"},{"t":"貯金する（ちょきんする）","m":"chokin suru 意思：存錢 (to save money)","say":"貯金する（ちょきんする）"},{"t":"病院（びょういん）","m":"byouin 意思：醫院 (hospital)","say":"病院（びょういん）"},{"t":"寝る（ねる）","m":"neru 意思：睡覺 (to sleep)","say":"寝る（ねる）"},{"t":"買う（かう）","m":"kau 意思：買 (to buy)","say":"買う（かう）"},{"t":"新しい（あたらしい）","m":"atarashii 意思：新的 (new)","say":"新しい（あたらしい）"},{"t":"かばん（かばん）","m":"kaban 意思：包包 (bag)","say":"かばん（かばん）"}],"grammar":["<b>〜たらどうですか 是什麼意思？要怎麼接？</b><br><br>動詞後接「たらどうですか」，用來表示建議、勸告，相當於英文「Why don't you 〜?」。開頭的「た」就是動詞過去式常體肯定（短形）的語尾。句型：[動詞過去式常體肯定]＋らどうですか？","<b>口語會話中，〜たらどうですか 可以怎麼縮短？</b><br><br>口語中可縮短為「らどう？」或「ら？」。","<b>使用〜たらどうですか 時要注意什麼？</b><br><br>たらどうですか 有時帶有責備語氣（責怪對方為何還沒去做），所以除非對方主動來找你商量，否則最好不要使用。此外，這個句型不能用來邀約——想邀朋友來玩，應該用「〜ませんか」，而不是たらどうですか。"],"example":[{"en":"Why don't you study more (harder)?","jp":"もっと<ruby>勉強<rt>べんきょう</rt></ruby>したらどうですか？","rj":"Motto benkyou shitara dou desu ka?","say":"もっと勉強したらどうですか？"},{"en":"How about taking some medicine?","jp":"<ruby>薬<rt>くすり</rt></ruby>を<ruby>飲<rt>の</rt></ruby>んだらどうですか？","rj":"Kusuri o nondara dou desu ka?","say":"薬を飲んだらどうですか？"},{"en":"Why don't you go to the hospital?","jp":"<ruby>病院<rt>びょういん</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったらどうですか？","rj":"Byouin ni ittara dou desu ka?","say":"病院に行ったらどうですか？"},{"en":"Why don't you sleep more?","jp":"もっと<ruby>寝<rt>ね</rt></ruby>たらどうですか？","rj":"Motto netara dou desu ka?","say":"もっと寝たらどうですか？"},{"en":"Why don't you buy a new bag?","jp":"<ruby>新<rt>あたら</rt></ruby>しいかばんを<ruby>買<rt>か</rt></ruby>ったらどう？","rj":"Atarashii kaban o kattara dou?","say":"新しいかばんを買ったらどう？"},{"en":"Why don't you save money?","jp":"<ruby>貯金<rt>ちょきん</rt></ruby>したらどう？","rj":"Chokin shitara dou?","say":"貯金したらどう？"}]},{"num":199,"title":"Number + もしか","vocab":[{"t":"猫（ねこ）","m":"neko 意思：貓 (cat)","say":"猫（ねこ）"},{"t":"傘（かさ）","m":"kasa 意思：雨傘 (umbrella)","say":"傘（かさ）"},{"t":"犬（いぬ）","m":"inu 意思：狗 (dog)","say":"犬（いぬ）"},{"t":"おにぎり（おにぎり）","m":"onigiri 意思：飯糰 (onigiri)","say":"おにぎり（おにぎり）"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"車（くるま）","m":"kuruma 意思：車 (car)","say":"車（くるま）"},{"t":"匹（びき／ひき）（-）","m":"biki / hiki 意思：（動物）量詞 (counter for animals)","say":"匹（びき／ひき）（-）"},{"t":"本（ほん／ぼん）（-）","m":"hon / bon 意思：（細長物）量詞 (counter for long objects)","say":"本（ほん／ぼん）（-）"},{"t":"個（こ／ご）（-）","m":"ko / go 意思：（小物）量詞 (counter for small items)","say":"個（こ／ご）（-）"},{"t":"台（だい）（-）","m":"dai 意思：（車輛、機器）量詞 (counter for vehicles/machines)","say":"台（だい）（-）"}],"grammar":["<b>日文表達數量的基本結構是什麼？</b><br><br>名詞　が／を　＋　數量詞。例如：家（いえ）に　猫（ねこ）が　3匹（びき）います。（家裡有三隻貓）","<b>數量詞後面加「も」是什麼意思？</b><br><br>在數量詞後加「も」，表示「數量比預期多」的語感，相當於中文「多達…、竟有…」。例如：家（いえ）に　猫（ねこ）が　3匹（びき）も　います。（家裡竟然有三隻貓之多！）","<b>數量詞後面加「しか」是什麼意思？要注意什麼？</b><br><br>在數量詞後加「しか」，並將述語改為否定形，表示「數量比預期少、只有」的語感。例如：家（いえ）に　猫（ねこ）が　3匹（びき）しか　いません。（家裡只有三隻貓而已）——しか 後面一定要接否定形。"],"example":[{"en":"There are three cats in our house.","jp":"<ruby>家<rt>いえ</rt></ruby>に<ruby>猫<rt>ねこ</rt></ruby>が3<ruby>匹<rt>びき</rt></ruby>います。","rj":"Ie ni neko ga sanbiki imasu.","say":"家に猫が3匹います。"},{"en":"We bought three umbrellas.","jp":"<ruby>傘<rt>かさ</rt></ruby>を3<ruby>本<rt>ぼん</rt></ruby><ruby>買<rt>か</rt></ruby>いました。","rj":"Kasa o sanbon kaimashita.","say":"傘を3本買いました。"},{"en":"There are as many as three cats in our house!","jp":"<ruby>家<rt>いえ</rt></ruby>に<ruby>猫<rt>ねこ</rt></ruby>が3<ruby>匹<rt>びき</rt></ruby>もいます。","rj":"Ie ni neko ga sanbiki mo imasu.","say":"家に猫が3匹もいます。"},{"en":"We bought as many as three umbrellas.","jp":"<ruby>傘<rt>かさ</rt></ruby>を3<ruby>本<rt>ぼん</rt></ruby>も<ruby>買<rt>か</rt></ruby>いました。","rj":"Kasa o sanbon mo kaimashita.","say":"傘を3本も買いました。"},{"en":"There are only three cats in our house!","jp":"<ruby>家<rt>いえ</rt></ruby>に<ruby>猫<rt>ねこ</rt></ruby>が3<ruby>匹<rt>びき</rt></ruby>しかいません。","rj":"Ie ni neko ga sanbiki shika imasen.","say":"家に猫が3匹しかいません。"},{"en":"We bought only three umbrellas.","jp":"<ruby>傘<rt>かさ</rt></ruby>を3<ruby>本<rt>ぼん</rt></ruby>しか<ruby>買<rt>か</rt></ruby>いませんでした。","rj":"Kasa o sanbon shika kaimasen deshita.","say":"傘を3本しか買いませんでした。"},{"en":"I only have two dogs.","jp":"<ruby>犬<rt>いぬ</rt></ruby>が2<ruby>匹<rt>にひき</rt></ruby>しかいません。","rj":"Inu ga nihiki shika imasen.","say":"犬が2匹しかいません。"},{"en":"I ate as many as 5 onigiris.","jp":"おにぎりを5<ruby>個<rt>ごこ</rt></ruby>も<ruby>食<rt>た</rt></ruby>べました。","rj":"Onigiri o goko mo tabemashita.","say":"おにぎりを5個も食べました。"},{"en":"Do you only have 1 car?","jp":"<ruby>車<rt>くるま</rt></ruby>が1<ruby>台<rt>いちだい</rt></ruby>しかありませんか？","rj":"Kuruma ga ichidai shika arimasen ka?","say":"車が1台しかありませんか？"}]},{"num":202,"title":"Volitional form","vocab":[{"t":"結婚する（けっこんする）","m":"kekkon suru 意思：結婚 (to marry)","say":"結婚する（けっこんする）"},{"t":"手伝う（てつだう）","m":"tetsudau 意思：幫忙 (to help)","say":"手伝う（てつだう）"},{"t":"カレー（かれー）","m":"kare- 意思：咖哩 (curry)","say":"カレー（かれー）"},{"t":"予約する（よやくする）","m":"yoyaku suru 意思：預約 (to make a reservation)","say":"予約する（よやくする）"},{"t":"招待する（しょうたいする）","m":"shoutai suru 意思：邀請 (to invite)","say":"招待する（しょうたいする）"}],"grammar":["<b>意向形是什麼？跟「ましょう」有什麼關係？</b><br><br>意向形是「ましょう」的常體（更口語、較不正式）版本，用來向熟識的朋友提議計畫，相當於中文的「…吧！」。","<b>動詞要怎麼變成意向形？</b><br><br>Ru-verb（一段動詞）：去掉語尾「る」，加上「よう」（食べる→食べよう）。U-verb（五段動詞）：去掉語尾う段音，改為お段音＋う（行く→行こう）。不規則動詞：くる→こよう、する→しよう。","<b>「意向形＋か」是什麼意思？</b><br><br>用來表示提議或詢問對方意願（「要不要一起…？」）。例如：手伝（てつだ）おうか？（要不要我幫你？）","<b>「意向形＋と思っています」與「意向形＋と思います」有什麼差別？</b><br><br>と思っています 表示這個決定是之前就已經做好的（比較像「我打算…」）；と思います 表示這個決定是說話當下才臨時決定的（比較像「我想我會…」）。"],"example":[{"en":"Let's go eat somewhere tonight!","jp":"<ruby>今夜<rt>こんや</rt></ruby>どこかに<ruby>食<rt>た</rt></ruby>べに<ruby>行<rt>い</rt></ruby>こう。","rj":"Kon'ya dokoka ni tabe ni ikou.","say":"今夜どこかに食べに行こう。"},{"en":"Let's get married!","jp":"<ruby>結婚<rt>けっこん</rt></ruby>しよう。","rj":"Kekkon shiyou.","say":"結婚しよう。"},{"en":"May I help you?","jp":"<ruby>手伝<rt>てつだ</rt></ruby>おうか？","rj":"Tetsudaou ka?","say":"手伝おうか？"},{"en":"Shall we watch this film?","jp":"この<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ようか。","rj":"Kono eiga o miyou ka.","say":"この映画を見ようか。"},{"en":"When shall we meet again?","jp":"<ruby>今度<rt>こんど</rt></ruby>いつ<ruby>会<rt>あ</rt></ruby>おうか？","rj":"Kondo itsu aou ka?","say":"今度いつ会おうか？"},{"en":"I've decided to study Japanese everyday.","jp":"<ruby>毎日<rt>まいにち</rt></ruby><ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しようと<ruby>思<rt>おも</rt></ruby>っています。","rj":"Mainichi nihongo o benkyou shiyou to omotte imasu.","say":"毎日日本語を勉強しようと思っています。"},{"en":"I've decided to have curry for dinner.","jp":"<ruby>夜<rt>よる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>にカレーを<ruby>食<rt>た</rt></ruby>べようと<ruby>思<rt>おも</rt></ruby>っています。","rj":"Yorugohan ni kare- o tabeyou to omotte imasu.","say":"夜ご飯にカレーを食べようと思っています。"},{"en":"I will buy a kanji dictionary.","jp":"<ruby>漢字<rt>かんじ</rt></ruby>の<ruby>辞書<rt>じしょ</rt></ruby>を<ruby>買<rt>か</rt></ruby>おうと<ruby>思<rt>おも</rt></ruby>います。","rj":"Kanji no jisho o kaou to omoimasu.","say":"漢字の辞書を買おうと思います。"},{"en":"Let's eat at the restaurant tonight.","jp":"<ruby>今夜<rt>こんや</rt></ruby>レストランで<ruby>食<rt>た</rt></ruby>べよう。","rj":"Kon'ya resutoran de tabeyou.","say":"今夜レストランで食べよう。"},{"en":"Sounds good! Let's make a reservation, shall we?","jp":"いいね！<ruby>予約<rt>よやく</rt></ruby>しようか？","rj":"Ii ne! Yoyaku shiyou ka?","say":"いいね！予約しようか？"},{"en":"Yes, Let's invite Michiko, too.","jp":"はい。みちこも<ruby>招待<rt>しょうたい</rt></ruby>しよう。","rj":"Hai. Michiko mo shoutai shiyou.","say":"はい。みちこも招待しよう。"},{"en":"Sure, How shall we go (there)?","jp":"もちろん、どうやって<ruby>行<rt>い</rt></ruby>こうか？","rj":"Mochiron, dou yatte ikou ka?","say":"もちろん、どうやって行こうか？"},{"en":"I was thinking going there by taxi.","jp":"タクシーで<ruby>行<rt>い</rt></ruby>こうと<ruby>思<rt>おも</rt></ruby>います。","rj":"Takushii de ikou to omoimasu.","say":"タクシーで行こうと思います。"},{"en":"Okay, I think I will go by taxi too, then!","jp":"それなら、<ruby>私<rt>わたし</rt></ruby>もタクシーで<ruby>行<rt>い</rt></ruby>こうと<ruby>思<rt>おも</rt></ruby>います。","rj":"Sorenara, watashi mo takushi- de ikou to omoimasu.","say":"それなら、私もタクシーで行こうと思います。"}]},{"num":203,"title":"〜ておく","vocab":[{"t":"ストーブ（すとーぶ）","m":"suto-bu 意思：暖爐 (heater)","say":"ストーブ（すとーぶ）"},{"t":"つける（つける）","m":"tsukeru 意思：打開（開關） (to turn on)","say":"つける（つける）"},{"t":"ホテル（ほてる）","m":"hoteru 意思：飯店 (hotel)","say":"ホテル（ほてる）"},{"t":"北海道（ほっかいどう）","m":"hokkaidou 意思：北海道 (Hokkaido)","say":"北海道（ほっかいどう）"},{"t":"確認する（かくにんする）","m":"kakunin suru 意思：確認 (to check)","say":"確認する（かくにんする）"},{"t":"電車（でんしゃ）","m":"densha 意思：電車 (train)","say":"電車（でんしゃ）"},{"t":"デート（でーと）","m":"de-to 意思：約會 (date)","say":"デート（でーと）"},{"t":"見つける（みつける）","m":"mitsukeru 意思：找到 (to find, look for)","say":"見つける（みつける）"}],"grammar":["<b>動詞て形＋おく 是什麼意思？</b><br><br>表示「為了某個目的而事先做準備」的動作，相當於中文「事先做好…」。おく 依 u-verb（五段動詞）規則變化。","<b>〜ておく 的長體、常體時態變化是什麼？</b><br><br>長體：〜ておきます／〜ておきません／〜ておきました／〜ておきませんでした。常體：〜ておく／〜ておかない／〜ておいた／〜ておかなかった。"],"example":[{"en":"Since there will be an exam tomorrow, I will study (for it) tonight.","jp":"<ruby>明日<rt>あした</rt></ruby><ruby>試験<rt>しけん</rt></ruby>があるので、<ruby>今晩<rt>こんばん</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>しておきます。","rj":"Ashita shiken ga aru node, konban benkyou shite okimasu.","say":"明日試験があるので、今晩勉強しておきます。"},{"en":"I turned the heater on, because it was going to get colder.","jp":"<ruby>寒<rt>さむ</rt></ruby>くなるから、ストーブをつけておきました。","rj":"Samuku naru kara, suto-bu o tsukete okimashita.","say":"寒くなるから、ストーブをつけておきました。"},{"en":"I must make a hotel reservation in advance.","jp":"ホテルを<ruby>予約<rt>よやく</rt></ruby>しておかなくちゃいけません。","rj":"Hoteru o yoyaku shite okanakuchaikemasen.","say":"ホテルを予約しておかなくちゃいけません。"},{"en":"Because I will go to Hokkaido next week, I will book a hotel.","jp":"<ruby>来週<rt>らいしゅう</rt></ruby><ruby>北海道<rt>ほっかいどう</rt></ruby>に<ruby>行<rt>い</rt></ruby>くので、ホテルを<ruby>予約<rt>よやく</rt></ruby>しておきます。","rj":"Raishuu Hokkaidou ni iku node, hoteru o yoyaku shite okimasu.","say":"来週北海道に行くので、ホテルを予約しておきます。"},{"en":"Because I will go to Tokyo by train, I will check the time of the train.","jp":"<ruby>電車<rt>でんしゃ</rt></ruby>で<ruby>東京<rt>とうきょう</rt></ruby>に<ruby>行<rt>い</rt></ruby>くので、<ruby>電車<rt>でんしゃ</rt></ruby>の<ruby>時間<rt>じかん</rt></ruby>を<ruby>確認<rt>かくにん</rt></ruby>しておきます。","rj":"Densha de Toukyou ni iku node, densha no jikan o kakunin shite okimasu.","say":"電車で東京に行くので、電車の時間を確認しておきます。"},{"en":"Because I had a date, I looked for a nice restaurant.","jp":"デートがあったので、いいレストランを<ruby>見<rt>み</rt></ruby>つけておきました。","rj":"Deeto ga atta node, ii resutoran o mitsukete okimashita.","say":"デートがあったので、いいレストランを見つけておきました。"}]},{"num":204,"title":"Using Sentences to Qualify Nouns","vocab":[{"t":"彼氏（かれし）","m":"kareshi 意思：男朋友 (boyfriend)","say":"彼氏（かれし）"},{"t":"彼女（かのじょ）","m":"kanojo 意思：女朋友 (girlfriend)","say":"彼女（かのじょ）"},{"t":"感動する（かんどうする）","m":"kandou suru 意思：感動 (to be impressed, moved)","say":"感動する（かんどうする）"},{"t":"撮る（とる）","m":"toru 意思：拍（照） (to take (a photo))","say":"撮る（とる）"},{"t":"借りる（かりる）","m":"kariru 意思：借（入） (to borrow)","say":"借りる（かりる）"},{"t":"住む（すむ）","m":"sumu 意思：居住 (to live)","say":"住む（すむ）"},{"t":"観る（みる）","m":"miru 意思：觀看 (to watch)","say":"観る（みる）"},{"t":"テレビ番組（てれびばんぐみ）","m":"terebi bangumi 意思：電視節目 (TV show)","say":"テレビ番組（てれびばんぐみ）"}],"grammar":["<b>日文要怎麼用一整個句子來修飾名詞（像英文的關係子句）？</b><br><br>如同い形容詞可以修飾名詞，日文也可以用[句子（常體）]＋名詞 的形式，把一整句話當作形容詞修飾名詞，相當於中文的「…的」或英文的關係子句（that／which／who）。例如：昨日（きのう）買（か）った　本（ほん）（昨天買的書）。","<b>修飾句中的主語，為什麼用「が」而不用「は」？</b><br><br>[Subject が＋動詞（常體）]＋名詞。這是固定規則：修飾句中的主語一律用「が」，不用「は」。「修飾句＋名詞」整體視為一個大名詞片語，可以放在句子中任何名詞能出現的位置（當主語、受詞、補語等）。"],"example":[{"en":"This is a book that my girlfriend gave me on my birthday last year.","jp":"これは<ruby>去年<rt>きょねん</rt></ruby>の<ruby>誕生日<rt>たんじょうび</rt></ruby>に<ruby>彼女<rt>かのじょ</rt></ruby>がくれた<ruby>本<rt>ほん</rt></ruby>です。","rj":"Kore wa kyonen no tanjoubi ni kanojo ga kureta hon desu.","say":"これは去年の誕生日に彼女がくれた本です。"},{"en":"My father gave me a book that Haruki Murakami wrote.","jp":"<ruby>父<rt>ちち</rt></ruby>が<ruby>村上春樹<rt>むらかみはるき</rt></ruby>がかいた<ruby>本<rt>ほん</rt></ruby>をくれました。","rj":"Chichi ga Murakami Haruki ga kaita hon o kuremashita.","say":"父が村上春樹がかいた本をくれました。"},{"en":"The movie I was touched by the most is \"To Live.\"","jp":"<ruby>私<rt>わたし</rt></ruby>が<ruby>一番<rt>いちばん</rt></ruby><ruby>感動<rt>かんどう</rt></ruby>した<ruby>映画<rt>えいが</rt></ruby>は「<ruby>生<rt>い</rt></ruby>きる」です。","rj":"Watashi ga ichiban kandou shita eiga wa \"Ikiru\" desu.","say":"私が一番感動した映画は「生きる」です。"},{"en":"This is a photo I took in Nara.","jp":"これは<ruby>奈良<rt>なら</rt></ruby>で<ruby>撮<rt>と</rt></ruby>った<ruby>写真<rt>しゃしん</rt></ruby>です。","rj":"Kore wa Nara de totta shashin desu.","say":"これは奈良で撮った写真です。"},{"en":"This is the bus that goes to Tokyo.","jp":"これは<ruby>東京<rt>とうきょう</rt></ruby>に<ruby>行<rt>い</rt></ruby>くバスです。","rj":"Kore wa Toukyou ni iku basu desu.","say":"これは東京に行くバスです。"},{"en":"This is the hotel Ken stayed at last year.","jp":"これは<ruby>去年<rt>きょねん</rt></ruby>けんが<ruby>泊<rt>と</rt></ruby>まったホテルです。","rj":"Kore wa kyonen Ken ga tomatta hoteru desu.","say":"これは去年けんが泊まったホテルです。"},{"en":"This is a book I borrowed from a friend.","jp":"これは<ruby>友達<rt>ともだち</rt></ruby>から<ruby>借<rt>か</rt></ruby>りた<ruby>本<rt>ほん</rt></ruby>です。","rj":"Kore wa tomodachi kara karita hon desu.","say":"これは友達から借りた本です。"},{"en":"This is the TV show that I often watch.","jp":"これはよく<ruby>観<rt>み</rt></ruby>るテレビ<ruby>番組<rt>ばんぐみ</rt></ruby>です。","rj":"Kore wa yoku miru terebi bangumi desu.","say":"これはよく観るテレビ番組です。"},{"en":"This is a friend who lives in Osaka.","jp":"これは<ruby>大阪<rt>おおさか</rt></ruby>に<ruby>住<rt>す</rt></ruby>んでいる<ruby>友達<rt>ともだち</rt></ruby>です。","rj":"Kore wa Oosaka ni sunde iru tomodachi desu.","say":"これは大阪に住んでいる友達です。"}]},{"num":206,"title":"〜してあげる","vocab":[{"t":"貸す（かす）","m":"kasu 意思：借出 (to lend)","say":"貸す（かす）"},{"t":"連れて行く（つれていく）","m":"tsurete iku 意思：帶（某人）去 (to take (someone somewhere))","say":"連れて行く（つれていく）"},{"t":"手伝う（てつだう）","m":"tetsudau 意思：幫忙 (to help)","say":"手伝う（てつだう）"},{"t":"奢る（おごる）","m":"ogoru 意思：請客 (to treat (someone))","say":"奢る（おごる）"},{"t":"買い物（かいもの）","m":"kaimono 意思：購物 (shopping)","say":"買い物（かいもの）"},{"t":"宿題（しゅくだい）","m":"shukudai 意思：作業 (homework)","say":"宿題（しゅくだい）"},{"t":"病院（びょういん）","m":"byouin 意思：醫院 (hospital)","say":"病院（びょういん）"},{"t":"教える（おしえる）","m":"oshieru 意思：教 (to teach)","say":"教える（おしえる）"},{"t":"コーヒー（こーひー）","m":"ko-hi- 意思：咖啡 (coffee)","say":"コーヒー（こーひー）"}],"grammar":["<b>動詞て形＋あげる 是什麼意思？</b><br><br>表示「我」為「你／他人」做某事，或「他人」為「他人」做某事，方向是「我」→「你」／「我」→「他人」／「你」→「他人」／「他人」→「他人」。加上 あげる 並不會改變句子的基本意思，而是強調這個動作是應對方要求、或作為一種恩惠而做的。","<b>受益者要用什麼助詞？</b><br><br>受益者所搭配的助詞，依主要動詞原本要求的助詞而定，不會因為加了 あげる 而改變。例如「貸す」搭配「に」：妹（いもうと）に　お金（かね）を　かしてあげました。","<b>為什麼很多時候要避免直接用「てあげる」？</b><br><br>てあげる 帶有「施恩」的語感，若對象是尊長或不熟的人，直接說「〜てあげます」可能顯得自誇、不禮貌，因此許多情境下，單純用普通的動詞句（不加 あげる）反而更自然、更客氣。","<b>如果動詞本身沒有「受益者」的位置，該怎麼辦？</b><br><br>可以用「〜のために」加上「為了…」的語意：(人)のために＋[動詞て形]あげる。例如：ともこのために　買（か）い物（もの）に　行（い）きました。"],"example":[{"en":"I (kindly) lent my sister money (on demand).","jp":"<ruby>妹<rt>いもうと</rt></ruby>にお<ruby>金<rt>かね</rt></ruby>をかしてあげました。","rj":"Imouto ni okane o kashite agemashita.","say":"妹にお金をかしてあげました。"},{"en":"Kyoko (kindly) took Tom to the station (as a favour).","jp":"きょうこはトムを<ruby>駅<rt>えき</rt></ruby>に<ruby>連<rt>つ</rt></ruby>れて<ruby>行<rt>い</rt></ruby>ってあげました。","rj":"Kyouko wa Tomu o eki ni tsurete itte agemashita.","say":"きょうこはトムを駅に連れて行ってあげました。"},{"en":"I went shopping for Tomoko.","jp":"ともこのために<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","rj":"Tomoko no tame ni kaimono ni ikimashita.","say":"ともこのために買い物に行きました。"},{"en":"I (kindly) helped Ken with his homework.","jp":"けんのために<ruby>宿題<rt>しゅくだい</rt></ruby>を<ruby>手伝<rt>てつだ</rt></ruby>ってあげました。","rj":"Ken no tame ni shukudai o tetsudatte agemashita.","say":"けんのために宿題を手伝ってあげました。"},{"en":"I (kindly) took Tomo to the hospital.","jp":"ともを<ruby>病院<rt>びょういん</rt></ruby>に<ruby>連<rt>つ</rt></ruby>れて<ruby>行<rt>い</rt></ruby>ってあげました。","rj":"Tomo o byouin ni tsurete itte agemashita.","say":"ともを病院に連れて行ってあげました。"},{"en":"Takeshi (kindly) taught Japanese to Mary.","jp":"たけしはメアリーに<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてあげました。","rj":"Takeshi wa Meari- ni nihongo o oshiete agemashita.","say":"たけしはメアリーに日本語を教えてあげました。"},{"en":"Did you (kindly) treat Momo a coffee?","jp":"ももにコーヒーをおごってあげましたか？","rj":"Momo ni ko-hi- o ogotte agemashita ka?","say":"ももにコーヒーをおごってあげましたか？"}]},{"num":207,"title":"〜してくれる","vocab":[{"t":"送る（おくる）","m":"okuru 意思：寄送 (to send)","say":"送る（おくる）"},{"t":"クッキー（くっきー）","m":"kukki- 意思：餅乾 (cookies)","say":"クッキー（くっきー）"},{"t":"掃除する（そうじする）","m":"souji suru 意思：打掃 (to clean)","say":"掃除する（そうじする）"},{"t":"説明する（せつめいする）","m":"setsumei suru 意思：說明 (to explain)","say":"説明する（せつめいする）"},{"t":"文法（ぶんぽう）","m":"bunpou 意思：文法 (grammar)","say":"文法（ぶんぽう）"},{"t":"料理する（りょうりする）","m":"ryouri suru 意思：做菜 (to cook)","say":"料理する（りょうりする）"}],"grammar":["<b>動詞て形＋くれる 是什麼意思？</b><br><br>表示「他人（Others／You）為我（I）做某事」，方向為「他人」→「你」→「我」。","<b>為什麼 くれる 句常常省略受益者？</b><br><br>くれる 句中的受益者幾乎都預設是說話者本人，因此文法上通常不需要特別寫出來。","<b>如果需要明確指出受益者，該怎麼做？</b><br><br>作法與 あげる 相同：若主要動詞本身有「對象」的位置，保留該動詞原本要求的助詞（如「連れて行く」要求を：きょうこが私を駅に連れて行ってくれました）；若動詞本身沒有「對象」的位置（如「掃除する」），則用「〜のために」。"],"example":[{"en":"A friend helps me with my homework (for which, I am grateful).","jp":"<ruby>友達<rt>ともだち</rt></ruby>が<ruby>宿題<rt>しゅくだい</rt></ruby>を<ruby>手伝<rt>てつだ</rt></ruby>ってくれます。","rj":"Tomodachi ga shukudai o tetsudatte kuremasu.","say":"友達が宿題を手伝ってくれます。"},{"en":"A relative (kindly) sent me cookies (and I appreciate it).","jp":"<ruby>親戚<rt>しんせき</rt></ruby>がクッキーを<ruby>送<rt>おく</rt></ruby>ってくれました。","rj":"Shinseki ga kukki- o okutte kuremashita.","say":"親戚がクッキーを送ってくれました。"},{"en":"Kyoko (kindly) took me to the station.","jp":"きょうこが<ruby>私<rt>わたし</rt></ruby>を<ruby>駅<rt>えき</rt></ruby>に<ruby>連<rt>つ</rt></ruby>れて<ruby>行<rt>い</rt></ruby>ってくれました。","rj":"Kyouko ga watashi o eki ni tsurete itte kuremashita.","say":"きょうこが私を駅に連れて行ってくれました。"},{"en":"Takeshi (kindly) taught me that Kanji.","jp":"たけしが<ruby>私<rt>わたし</rt></ruby>に<ruby>漢字<rt>かんじ</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれました。","rj":"Takeshi ga watashi ni kanji o oshiete kuremashita.","say":"たけしが私に漢字を教えてくれました。"},{"en":"Ken (kindly) cleaned the room for me.","jp":"けんが<ruby>私<rt>わたし</rt></ruby>のために<ruby>掃除<rt>そうじ</rt></ruby>してくれました。","rj":"Ken ga watashi no tame ni souji shite kuremashita.","say":"けんが私のために掃除してくれました。"},{"en":"My older sister sometimes lends me her car.","jp":"<ruby>姉<rt>あね</rt></ruby>はたまに<ruby>車<rt>くるま</rt></ruby>をかしてくれます。","rj":"Ane wa tamani kuruma o kashite kuremasu.","say":"姉はたまに車をかしてくれます。"},{"en":"Taro kindly explained me the grammar.","jp":"たろうは<ruby>文法<rt>ぶんぽう</rt></ruby>を<ruby>説明<rt>せつめい</rt></ruby>してくれました。","rj":"Tarou wa bunpou o setsumei shite kuremashita.","say":"たろうは文法を説明してくれました。"},{"en":"Mary cooked dinner for us.","jp":"メアリーは<ruby>私<rt>わたし</rt></ruby>たちのために<ruby>夜<rt>よる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>料理<rt>りょうり</rt></ruby>してくれました。","rj":"Meari- wa watashitachi no tame ni yorugohan o ryouri shite kuremashita.","say":"メアリーは私たちのために夜ご飯を料理してくれました。"}]},{"num":208,"title":"〜してもらう","vocab":[{"t":"知らない人（しらないひと）","m":"shiranai hito 意思：陌生人 (stranger)","say":"知らない人（しらないひと）"},{"t":"歌（うた）","m":"uta 意思：歌 (song)","say":"歌（うた）"},{"t":"歌う（うたう）","m":"utau 意思：唱歌 (to sing)","say":"歌う（うたう）"},{"t":"読む（よむ）","m":"yomu 意思：讀、唸 (to read)","say":"読む（よむ）"},{"t":"郵便局（ゆうびんきょく）","m":"yuubinkyoku 意思：郵局 (post office)","say":"郵便局（ゆうびんきょく）"},{"t":"写真（しゃしん）","m":"shashin 意思：照片 (photo)","say":"写真（しゃしん）"}],"grammar":["<b>動詞て形＋もらう 是什麼意思？</b><br><br>表示「我得到／請託／說服某人為我做某事」，也就是「我接受別人的恩惠」。句型：X は　(Person)に　[動詞て形]＋もらう。動作實際執行者用助詞「に」標示。","<b>〜てもらう 跟 〜てくれる 的差別在哪裡？</b><br><br>兩者描述同一件事，但主語不同：もらう 的主語是受益者（我），くれる 的主語是施惠者。例如：私は友達に宿題を手伝ってもらいました。（もらう視角）／友達が宿題を手伝ってくれました。（くれる視角）。","<b>〜てもらう 還有什麼補充用法？</b><br><br>有時 もらう 句只是單純表達「很慶幸有人幫我做了這件事」，即使我方並未主動開口拜託，也可以使用，語感接近「幸虧有人幫我…」。"],"example":[{"en":"I got a friend of mine to help me with my homework.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>友達<rt>ともだち</rt></ruby>に<ruby>宿題<rt>しゅくだい</rt></ruby>を<ruby>手伝<rt>てつだ</rt></ruby>ってもらいました。","rj":"Watashi wa tomodachi ni shukudai o tetsudatte moraimashita.","say":"私は友達に宿題を手伝ってもらいました。"},{"en":"I am glad that a stranger read the kanji for me.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>知<rt>し</rt></ruby>らない<ruby>人<rt>ひと</rt></ruby>に<ruby>漢字<rt>かんじ</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでもらいました。","rj":"Watashi wa shiranai hito ni kanji o yonde moraimashita.","say":"私は知らない人に漢字を読んでもらいました。"},{"en":"I had Ken teach me Japanese.","jp":"<ruby>私<rt>わたし</rt></ruby>はけんに<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてもらいました。","rj":"Watashi wa Ken ni nihongo o oshiete moraimashita.","say":"私はけんに日本語を教えてもらいました。"},{"en":"I will have Mary sing a song.","jp":"<ruby>私<rt>わたし</rt></ruby>はメアリーに<ruby>歌<rt>うた</rt></ruby>を<ruby>歌<rt>うた</rt></ruby>ってもらいます。","rj":"Watashi wa Meari- ni uta o utatte moraimasu.","say":"私はメアリーに歌を歌ってもらいます。"},{"en":"I will have Tomo take me to the post office.","jp":"<ruby>私<rt>わたし</rt></ruby>はともに<ruby>郵便局<rt>ゆうびんきょく</rt></ruby>に<ruby>連<rt>つ</rt></ruby>れて<ruby>行<rt>い</rt></ruby>ってもらいます。","rj":"Watashi wa Tomo ni yuubinkyoku ni tsurete itte moraimasu.","say":"私はともに郵便局に連れて行ってもらいます。"},{"en":"I had Mako take a photo of me.","jp":"<ruby>私<rt>わたし</rt></ruby>はまこに<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>ってもらいました。","rj":"Watashi wa Mako ni shashin o totte moraimashita.","say":"私はまこに写真を撮ってもらいました。"}]},{"num":209,"title":"〜ていただけませんか","vocab":[{"t":"待つ（まつ）","m":"matsu 意思：等待 (to wait)","say":"待つ（まつ）"},{"t":"とる（とる）","m":"toru 意思：拿取 (to pick up)","say":"とる（とる）"},{"t":"起こす（おこす）","m":"okosu 意思：叫醒 (to wake (someone) up)","say":"起こす（おこす）"},{"t":"推薦状（すいせんじょう）","m":"suisenjou 意思：推薦信 (letter of recommendation)","say":"推薦状（すいせんじょう）"},{"t":"翻訳する（ほんやくする）","m":"honyaku suru 意思：翻譯 (to translate)","say":"翻訳する（ほんやくする）"}],"grammar":["<b>日文有哪些常見的請求句型，禮貌程度怎麼排列？</b><br><br>由禮貌到隨性依序是：〜ていただけませんか？（最禮貌）＞〜てくださいませんか？＞〜てもらえませんか？＞〜てくれませんか？（中等）＞〜てもらえない？＞〜てくれない？（最隨性，同輩朋友之間）。","<b>〜ていただけませんか 怎麼用？</b><br><br>[動詞て形]＋いただけませんか？用於向長輩、陌生人請求幫忙，比〜てください更客氣。例如：手伝（てつだ）っていただけませんか？（能否請您幫我一個忙？）","<b>〜てくれない？ 這種最隨性的說法什麼時候用？</b><br><br>[動詞て形]＋くれない？用於同輩朋友之間非常輕鬆隨意的請求。例如：それ　とってくれない？（幫我拿一下那個，好嗎？）"],"example":[{"en":"Would you lend me a hand?","jp":"<ruby>手伝<rt>てつだ</rt></ruby>っていただけませんか？","rj":"Tetsudatte itadakemasen ka?","say":"手伝っていただけませんか？"},{"en":"Will you wait for a second?","jp":"ちょっと<ruby>待<rt>ま</rt></ruby>ってくれませんか？","rj":"Chotto matte kuremasen ka?","say":"ちょっと待ってくれませんか？"},{"en":"Pick that thing up (and pass it to me), will you?","jp":"それとってくれない？","rj":"Sore totte kurenai?","say":"それとってくれない？"},{"en":"Will you lend me money?","jp":"お<ruby>金<rt>かね</rt></ruby>を<ruby>貸<rt>か</rt></ruby>してくれない？","rj":"Okane o kashite kurenai?","say":"お金を貸してくれない？"},{"en":"Would you wake me up at seven o'clock tomorrow?","jp":"<ruby>明日<rt>あした</rt></ruby>7<ruby>時<rt>しちじ</rt></ruby>に<ruby>起<rt>お</rt></ruby>こしてくれませんか？","rj":"Ashita shichiji ni okoshite kuremasen ka?","say":"明日7時に起こしてくれませんか？"},{"en":"Could you write a letter of recommendation?","jp":"<ruby>推薦状<rt>すいせんじょう</rt></ruby>を<ruby>書<rt>か</rt></ruby>いていただけませんか？","rj":"Suisenjou o kaite itadakemasen ka?","say":"推薦状を書いていただけませんか？"},{"en":"Will you teach me Japanese?","jp":"<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれない？","rj":"Nihongo o oshiete kurenai?","say":"日本語を教えてくれない？"},{"en":"Would you speak more slowly?","jp":"もっとゆっくり<ruby>話<rt>はな</rt></ruby>してくれませんか？","rj":"Motto yukkuri hanashite kuremasen ka?","say":"もっとゆっくり話してくれませんか？"},{"en":"Could you translate this into English?","jp":"これを<ruby>英語<rt>えいご</rt></ruby>に<ruby>翻訳<rt>ほんやく</rt></ruby>していただけませんか？","rj":"Kore o eigo ni honyaku shite itadakemasen ka?","say":"これを英語に翻訳していただけませんか？"}]},{"num":210,"title":"〜といい","vocab":[{"t":"アルバイト（あるばいと）","m":"arubaito 意思：打工 (part-time job)","say":"アルバイト（あるばいと）"},{"t":"奨学金（しょうがくきん）","m":"shougakukin 意思：獎學金 (scholarship)","say":"奨学金（しょうがくきん）"},{"t":"プロジェクト（ぷろじぇくと）","m":"purojekuto 意思：專案 (project)","say":"プロジェクト（ぷろじぇくと）"},{"t":"大学（だいがく）","m":"daigaku 意思：大學 (college / university)","say":"大学（だいがく）"},{"t":"乗る（のる）","m":"noru 意思：搭乘 (to ride, board)","say":"乗る（のる）"}],"grammar":["<b>〜といい 是什麼意思？</b><br><br>用「現在式常體＋といい」表達「希望發生某件好事」。","<b>為別人祈願跟為自己祈願，用法有什麼差異？</b><br><br>為別人祈願用「〜といいですね」（[現在式常體]＋といいですね），不是自己的事；為自己祈願用「〜といいんですが」（[現在式常體]＋といいんですが），語氣較委婉、謙虛。","<b>為什麼有時候動詞必須改成可能形才能用 といい？</b><br><br>といい 只能用在「自己無法掌控、只能期望」的事情上；如果是自己主動能做到的動作，必須把動詞改成可能形，才能用這個句型，否則語意會變成「希望自己親自去做這個動作」而顯得奇怪。例如不能說「大学に行くといいんですが」，要說「大学に行けるといいんですが」（希望自己能考上大學）。"],"example":[{"en":"I hope there is a good part-time job (for you).","jp":"いいアルバイトがあるといいですね。","rj":"Ii arubaito ga aru to ii desu ne.","say":"いいアルバイトがあるといいですね。"},{"en":"I hope it does not rain.","jp":"<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らないといいですね。","rj":"Ame ga furanai to ii desu ne.","say":"雨が降らないといいですね。"},{"en":"I am hoping that the exam is easy.","jp":"<ruby>試験<rt>しけん</rt></ruby>が<ruby>簡単<rt>かんたん</rt></ruby>だといいんですが。","rj":"Shiken ga kantan da to iin desu ga.","say":"試験が簡単だといいんですが。"},{"en":"I hope I can catch the eight o'clock train.","jp":"8<ruby>時<rt>じ</rt></ruby>の<ruby>電車<rt>でんしゃ</rt></ruby>に<ruby>乗<rt>の</rt></ruby>れるといいんですが。","rj":"Hachiji no densha ni noreru to iin desu ga.","say":"8時の電車に乗れるといいんですが。"},{"en":"I am hoping to go to college (= hoping I can go).","jp":"<ruby>大学<rt>だいがく</rt></ruby>に<ruby>行<rt>い</rt></ruby>けるといいんですが。","rj":"Daigaku ni ikeru to iin desu ga.","say":"大学に行けるといいんですが。"},{"en":"I hope you (Sue) will come.","jp":"すーが<ruby>来<rt>き</rt></ruby>てくれるといいんですが。","rj":"Suu ga kite kureru to iin desu ga.","say":"すーが来てくれるといいんですが。"},{"en":"I hope I can receive a scholarship.","jp":"<ruby>奨学金<rt>しょうがくきん</rt></ruby>がもらえるといいんですが。","rj":"Shougakukin ga moraeru to iin desu ga.","say":"奨学金がもらえるといいんですが。"},{"en":"I hope Sachi comes to your birthday party.","jp":"さちが<ruby>誕生日<rt>たんじょうび</rt></ruby>パーティーにくるといいですね。","rj":"Sachi ga tanjoubi paatii ni kuru to ii desu ne.","say":"さちが誕生日パーティーにくるといいですね。"},{"en":"I hope you can receive a good project.","jp":"いいプロジェクトがもらえるといいですね。","rj":"Ii purojekuto ga moraeru to ii desu ne.","say":"いいプロジェクトがもらえるといいですね。"},{"en":"I hope I can go to China next year.","jp":"<ruby>来年<rt>らいねん</rt></ruby><ruby>中国<rt>ちゅうごく</rt></ruby>に<ruby>行<rt>い</rt></ruby>けるといいんですが。","rj":"Rainen Chuugoku ni ikeru to iin desu ga.","say":"来年中国に行けるといいんですが。"}]},{"num":211,"title":"〜時（とき）1","vocab":[{"t":"チベット（ちべっと）","m":"chibetto 意思：西藏 (Tibet)","say":"チベット（ちべっと）"},{"t":"ビザ（びざ）","m":"biza 意思：簽證 (visa)","say":"ビザ（びざ）"},{"t":"とる（とる）","m":"toru 意思：取得 (to get, obtain)","say":"とる（とる）"},{"t":"出かける（でかける）","m":"dekakeru 意思：出門 (to go out)","say":"出かける（でかける）"},{"t":"鍵をかける（かぎをかける）","m":"kagi o kakeru 意思：上鎖 (to lock)","say":"鍵をかける（かぎをかける）"},{"t":"コンタクト（こんたくと）","m":"kontakuto 意思：隱形眼鏡 (contact lens)","say":"コンタクト（こんたくと）"},{"t":"さびしい（さびしい）","m":"sabishii 意思：寂寞的 (lonely)","say":"さびしい（さびしい）"},{"t":"電話がある（でんわがある）","m":"denwa ga aru 意思：有電話（來電） (a phone call comes)","say":"電話がある（でんわがある）"},{"t":"元気な（げんきな）","m":"genki na 意思：有活力的 (energetic)","say":"元気な（げんきな）"},{"t":"病気（びょうき）","m":"byouki 意思：生病 (sick)","say":"病気（びょうき）"},{"t":"頭が痛くなる（あたまがいたくなる）","m":"atama ga itaku naru 意思：頭痛起來 (to get a headache)","say":"頭が痛くなる（あたまがいたくなる）"},{"t":"走る（はしる）","m":"hashiru 意思：跑步 (to run)","say":"走る（はしる）"}],"grammar":["<b>「〜時（とき）」是什麼意思？</b><br><br>用「時（とき）」表示「當…的時候」，描述事情發生的時間點。句型：(句子A)とき、(句子B)。句子A是時間點的參考，句子B是主要事件。","<b>句子A要用現在式還是過去式，判斷原則是什麼？</b><br><br>句子A一律使用常體（短形），但選哪個時態，取決於「事件A與事件B的相對時間關係」，而不是整句話實際發生在過去還是未來。判斷方法是：站在「事件B發生的那個時間點」，想像自己會如何描述事件A。","<b>句子A用「現在式常體」的情況有哪些？</b><br><br>① A在B之後發生（尚未發生）；② A在B之後發生（即使整句都已過去，A相對B仍是「之後」）；③ A描述的狀態在B發生當下成立；④ A是進行中的動作、B發生在A進行過程中（此時動詞用「〜ている」形）。","<b>句子A用「過去式常體」的情況是什麼？</b><br><br>當A早於B發生（A已經完成，B才發生）時，句子A要用過去式常體。例如：出（で）かけるとき、ドアに鍵（かぎ）をかけました。（出門的時候，把門鎖上了——鎖門發生在出門這個動作準備完成之後）","<b>な形容詞、名詞接「とき」時要怎麼變化？</b><br><br>な形容詞語尾用「な」（辭書形，不用だ）：元気（げんき）なとき。名詞則加「の」：犬（いぬ）が病気（びょうき）のとき。"],"example":[{"en":"I will get the visa issued when I go to Tibet.","jp":"チベットに<ruby>行<rt>い</rt></ruby>くとき、ビザをとります。","rj":"Chibetto ni iku toki, biza o torimasu.","say":"チベットに行くとき、ビザをとります。"},{"en":"I had the visa issued when I was going to go to Tibet.","jp":"チベットに<ruby>行<rt>い</rt></ruby>くとき、ビザをとりました。","rj":"Chibetto ni iku toki, biza o torimashita.","say":"チベットに行くとき、ビザをとりました。"},{"en":"I take out the contact lenses when I go to sleep.","jp":"<ruby>寝<rt>ね</rt></ruby>るとき、コンタクトをとります。","rj":"Neru toki, kontakuto o torimasu.","say":"寝るとき、コンタクトをとります。"},{"en":"I locked the door when I went out.","jp":"<ruby>出<rt>で</rt></ruby>かけるとき、ドアに<ruby>鍵<rt>かぎ</rt></ruby>をかけました。","rj":"Dekakeru toki, doa ni kagi o kakemashita.","say":"出かけるとき、ドアに鍵をかけました。"},{"en":"I call up friends when I am lonely.","jp":"さびしいとき、<ruby>友達<rt>ともだち</rt></ruby>に<ruby>電話<rt>でんわ</rt></ruby>します。","rj":"Sabishii toki, tomodachi ni denwa shimasu.","say":"さびしいとき、友達に電話します。"},{"en":"A phone call came when I was watching TV.","jp":"テレビをみているとき、<ruby>電話<rt>でんわ</rt></ruby>がありました。","rj":"Terebi o mite iru toki, denwa ga arimashita.","say":"テレビをみているとき、電話がありました。"},{"en":"I get a headache when it is cold.","jp":"<ruby>寒<rt>さむ</rt></ruby>いとき、<ruby>頭<rt>あたま</rt></ruby>が<ruby>痛<rt>いた</rt></ruby>くなります。","rj":"Samui toki, atama ga itaku narimasu.","say":"寒いとき、頭が痛くなります。"},{"en":"I jog in the park when I feel energetic.","jp":"<ruby>元気<rt>げんき</rt></ruby>なとき、<ruby>公園<rt>こうえん</rt></ruby>を<ruby>走<rt>はし</rt></ruby>ります。","rj":"Genki na toki, kouen o hashirimasu.","say":"元気なとき、公園を走ります。"},{"en":"I took the dog to a vet when it was sick.","jp":"<ruby>犬<rt>いぬ</rt></ruby>が<ruby>病気<rt>びょうき</rt></ruby>のとき、<ruby>病院<rt>びょういん</rt></ruby>に<ruby>連<rt>つ</rt></ruby>れて<ruby>行<rt>い</rt></ruby>きました。","rj":"Inu ga byouki no toki, byouin ni tsurete ikimashita.","say":"犬が病気のとき、病院に連れて行きました。"}]},{"num":212,"title":"〜時（とき）2","vocab":[{"t":"ウーロン茶（うーろんちゃ）","m":"u-roncha 意思：烏龍茶 (oolong tea)","say":"ウーロン茶（うーろんちゃ）"},{"t":"疲れる（つかれる）","m":"tsukareru 意思：疲累 (to get tired)","say":"疲れる（つかれる）"},{"t":"お風呂に入る（おふろにはいる）","m":"ofuro ni hairu 意思：泡澡 (to take a bath)","say":"お風呂に入る（おふろにはいる）"}],"grammar":["<b>句子A用「過去式常體」的情況，關鍵判斷原則是什麼？</b><br><br>站在事件B發生的時間點，回頭看事件A——若A在當時已經「發生過」，句子A就用過去式常體。這裡的「過去」指的是A相對於B的先後順序，而不是這兩件事實際上是否已經對說話者而言成為過去。","<b>即使整句話是描述未來的計畫，為什麼句子A有時仍要用過去式？</b><br><br>因為判斷關鍵是A、B的先後順序，而非整句時態。只要A會先於B完成，A就要用過去式常體。例如：中国（ちゅうごく）に行（い）ったとき、ウーロン茶（ちゃ）を買（か）います。（雖然整句是未來式，但「去中國」會先於「買茶」完成，所以行く用過去式「行った」）"],"example":[{"en":"I will buy oolong tea when I go to China.","jp":"<ruby>中国<rt>ちゅうごく</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったとき、ウーロン<ruby>茶<rt>ちゃ</rt></ruby>を<ruby>買<rt>か</rt></ruby>います。","rj":"Chuugoku ni itta toki, u-roncha o kaimasu.","say":"中国に行ったとき、ウーロン茶を買います。"},{"en":"I bought oolong tea when I went to China.","jp":"<ruby>中国<rt>ちゅうごく</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったとき、ウーロン<ruby>茶<rt>ちゃ</rt></ruby>を<ruby>買<rt>か</rt></ruby>いました。","rj":"Chuugoku ni itta toki, u-roncha o kaimashita.","say":"中国に行ったとき、ウーロン茶を買いました。"},{"en":"I take a long bath when I get tired.","jp":"<ruby>疲<rt>つか</rt></ruby>れたとき、ゆっくりお<ruby>風呂<rt>ふろ</rt></ruby>に<ruby>入<rt>はい</rt></ruby>ります。","rj":"Tsukareta toki, yukkuri ofuro ni hairimasu.","say":"疲れたとき、ゆっくりお風呂に入ります。"}]},{"num":213,"title":"時Practice","vocab":[{"t":"案内する（あんないする）","m":"annai suru 意思：帶路、導覽 (to show around)","say":"案内する（あんないする）"},{"t":"寝坊する（ねぼうする）","m":"nebou suru 意思：睡過頭 (to oversleep)","say":"寝坊する（ねぼうする）"},{"t":"暇な（ひまな）","m":"hima na 意思：空閒的 (free, bored)","say":"暇な（ひまな）"},{"t":"学生（がくせい）","m":"gakusei 意思：學生 (student)","say":"学生（がくせい）"},{"t":"野球（やきゅう）","m":"yakyuu 意思：棒球 (baseball)","say":"野球（やきゅう）"},{"t":"好きな（すきな）","m":"suki na 意思：喜歡的 (to like)","say":"好きな（すきな）"},{"t":"歯を磨く（はをみがく）","m":"ha o migaku 意思：刷牙 (to brush teeth)","say":"歯を磨く（はをみがく）"},{"t":"箸（はし）","m":"hashi 意思：筷子 (chopsticks)","say":"箸（はし）"},{"t":"スパゲッティ（すぱげってぃ）","m":"supagetti 意思：義大利麵 (spaghetti)","say":"スパゲッティ（すぱげってぃ）"},{"t":"失くす（なくす）","m":"nakusu 意思：弄丟 (to lose)","say":"失くす（なくす）"},{"t":"警察署（けいさつしょ）","m":"keisatsusho 意思：警察局 (police station)","say":"警察署（けいさつしょ）"},{"t":"退屈な（たいくつな）","m":"taikutsu na 意思：無聊的 (bored)","say":"退屈な（たいくつな）"},{"t":"〜歳（〜さい）","m":"~sai 意思：…歲 (…years old)","say":"〜歳（〜さい）"},{"t":"なる（なる）","m":"naru 意思：變成 (to become)","say":"なる（なる）"}],"grammar":["<b>複習「〜とき」時態選擇的判斷口訣是什麼？</b><br><br>A晚於／同時於B → A用現在式；A早於B（A先完成，B才發生）→ A用過去式。這個原則同時適用於動詞、い形容詞、な形容詞（用「な」）與名詞（用「の」）。"],"example":[{"en":"When my friend comes to my town, I'll show them around.","jp":"<ruby>友達<rt>ともだち</rt></ruby>が<ruby>町<rt>まち</rt></ruby>に<ruby>来<rt>き</rt></ruby>たとき、<ruby>案内<rt>あんない</rt></ruby>します。","rj":"Tomodachi ga machi ni kita toki, annai shimasu.","say":"友達が町に来たとき、案内します。"},{"en":"When my friend comes to my house, I clean my room.","jp":"<ruby>友達<rt>ともだち</rt></ruby>がうちに<ruby>来<rt>き</rt></ruby>たとき、<ruby>部屋<rt>へや</rt></ruby>を<ruby>掃除<rt>そうじ</rt></ruby>します。","rj":"Tomodachi ga uchi ni kita toki, heya o souji shimasu.","say":"友達がうちに来たとき、部屋を掃除します。"},{"en":"When I oversleep, I take a taxi.","jp":"<ruby>寝坊<rt>ねぼう</rt></ruby>したとき、タクシーに<ruby>乗<rt>の</rt></ruby>ります。","rj":"Nebou shita toki, takushi- ni norimasu.","say":"寝坊したとき、タクシーに乗ります。"},{"en":"When I am bored, I watch TV.","jp":"<ruby>暇<rt>ひま</rt></ruby>なとき、テレビをみます。","rj":"Hima na toki, terebi o mimasu.","say":"暇なとき、テレビをみます。"},{"en":"When I was a student, I liked baseball.","jp":"<ruby>学生<rt>がくせい</rt></ruby>のとき、<ruby>野球<rt>やきゅう</rt></ruby>が<ruby>好<rt>す</rt></ruby>きでした。","rj":"Gakusei no toki, yakyuu ga suki deshita.","say":"学生のとき、野球が好きでした。"},{"en":"I brushed my teeth when I went to bed.","jp":"<ruby>寝<rt>ね</rt></ruby>るとき、<ruby>歯<rt>は</rt></ruby>を<ruby>磨<rt>みが</rt></ruby>きました。","rj":"Neru toki, ha o migakimashita.","say":"寝るとき、歯を磨きました。"},{"en":"I ride a bus when I go to school.","jp":"<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>くとき、バスにのります。","rj":"Gakkou ni iku toki, basu ni norimasu.","say":"学校に行くとき、バスにのります。"},{"en":"Takeshi used chopsticks when he ate spaghetti.","jp":"たけしはスパゲッティを<ruby>食<rt>た</rt></ruby>べるとき、<ruby>箸<rt>はし</rt></ruby>を<ruby>使<rt>つか</rt></ruby>いました。","rj":"Takeshi wa supagetti o taberu toki, hashi o tsukaimashita.","say":"たけしはスパゲッティを食べるとき、箸を使いました。"},{"en":"I went to the police station when I lost my bag.","jp":"かばんを<ruby>失<rt>な</rt></ruby>くしたとき、<ruby>警察署<rt>けいさつしょ</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","rj":"Kaban o nakushita toki, keisatsusho ni ikimashita.","say":"かばんを失くしたとき、警察署に行きました。"},{"en":"What do you do when you are bored?","jp":"<ruby>退屈<rt>たいくつ</rt></ruby>なとき、<ruby>何<rt>なに</rt></ruby>をしますか？","rj":"Taikutsu na toki, nani o shimasu ka?","say":"退屈なとき、何をしますか？"},{"en":"What do you want to do when you turn 20 years old?","jp":"20<ruby>歳<rt>はたち</rt></ruby>になったとき、<ruby>何<rt>なに</rt></ruby>をしたいですか？","rj":"Hatachi ni natta toki, nani o shitai desu ka?","say":"20歳になったとき、何をしたいですか？"}]},{"num":214,"title":"〜てすみませんでした","vocab":[{"t":"汚い言葉（きたないことば）","m":"kitanai kotoba 意思：髒話 (foul language)","say":"汚い言葉（きたないことば）"},{"t":"約束（やくそく）","m":"yakusoku 意思：約定 (promise)","say":"約束（やくそく）"},{"t":"忘れる（わすれる）","m":"wasureru 意思：忘記 (to forget)","say":"忘れる（わすれる）"},{"t":"電話する（でんわする）","m":"denwa suru 意思：打電話 (to call (someone))","say":"電話する（でんわする）"},{"t":"出席する（しゅっせきする）","m":"shusseki suru 意思：出席 (to attend)","say":"出席する（しゅっせきする）"},{"t":"聞く（きく）","m":"kiku 意思：聽 (to listen)","say":"聞く（きく）"},{"t":"夜遅く（よるおそく）","m":"yoru osoku 意思：深夜 (late at night)","say":"夜遅く（よるおそく）"},{"t":"ミーティング（みーてぃんぐ）","m":"mi-tingu 意思：會議 (meeting)","say":"ミーティング（みーてぃんぐ）"},{"t":"イベント（いべんと）","m":"ibento 意思：活動 (event)","say":"イベント（いべんと）"}],"grammar":["<b>要怎麼用動詞て形道歉，表示「做了…」很抱歉？</b><br><br>句型：[動詞て形]＋すみませんでした。相當於英文「I am sorry for [doing something]」。例如：汚（きたな）い言葉（ことば）を使（つか）って、すみませんでした。（很抱歉說了髒話。）","<b>要怎麼為「沒有做…」道歉？</b><br><br>用否定て形：先把動詞變成常體否定「〜ない」，再把最後的「い」改成「くて」。句型：[動詞否定て形]＋すみませんでした。例如：宿題（しゅくだい）をもってこなくて、すみませんでした。","<b>すみませんでした 可以怎麼換成比較輕鬆的說法？</b><br><br>可依對象換成較輕鬆的「ごめん」（對朋友）或「ごめんなさい」（普通禮貌，稍隨性於すみませんでした）。"],"example":[{"en":"I am sorry for using foul language.","jp":"<ruby>汚<rt>きたな</rt></ruby>い<ruby>言葉<rt>ことば</rt></ruby>を<ruby>使<rt>つか</rt></ruby>って、すみませんでした。","rj":"Kitanai kotoba o tsukatte, sumimasen deshita.","say":"汚い言葉を使って、すみませんでした。"},{"en":"I'm sorry for forgetting about the date.","jp":"デートの<ruby>約束<rt>やくそく</rt></ruby>を<ruby>忘<rt>わす</rt></ruby>れて、ごめん。","rj":"Deeto no yakusoku o wasurete, gomen.","say":"デートの約束を忘れて、ごめん。"},{"en":"I am sorry for not bringing in the homework.","jp":"<ruby>宿題<rt>しゅくだい</rt></ruby>をもってこなくて、すみませんでした。","rj":"Shukudai o motte konakute, sumimasen deshita.","say":"宿題をもってこなくて、すみませんでした。"},{"en":"Sorry that I did not tell you earlier.","jp":"もっと<ruby>早<rt>はや</rt></ruby>く<ruby>言<rt>い</rt></ruby>わなくて、ごめん。","rj":"Motto hayaku iwanakute, gomen.","say":"もっと早く言わなくて、ごめん。"},{"en":"I am sorry for not listening to the lecture.","jp":"<ruby>話<rt>はなし</rt></ruby>を<ruby>聞<rt>き</rt></ruby>かなくてごめんなさい。","rj":"Hanashi o kikanakute gomen nasai.","say":"話を聞かなくてごめんなさい。"},{"en":"I am sorry to call you late at night.","jp":"<ruby>夜遅<rt>よるおそ</rt></ruby>くに<ruby>電話<rt>でんわ</rt></ruby>してごめんなさい。","rj":"Yoruosoku ni denwa shite gomen nasai.","say":"夜遅くに電話してごめんなさい。"},{"en":"I am sorry for not attending the meeting.","jp":"ミーティングに<ruby>出席<rt>しゅっせき</rt></ruby>しなくてすみませんでした。","rj":"Mi-tingu ni shusseki shinakute sumimasen deshita.","say":"ミーティングに出席しなくてすみませんでした。"},{"en":"I am sorry for not being able to go to the event.","jp":"イベントに<ruby>行<rt>い</rt></ruby>けなくてごめんなさい。","rj":"Ibento ni ikenakute gomen nasai.","say":"イベントに行けなくてごめんなさい。"}]},{"num":217,"title":"〜そうです","vocab":[{"t":"新聞（しんぶん）","m":"shinbun 意思：報紙 (newspaper)","say":"新聞（しんぶん）"},{"t":"天気予報（てんきよほう）","m":"tenkiyohou 意思：天氣預報 (weather forecast)","say":"天気予報（てんきよほう）"},{"t":"離婚する（りこんする）","m":"rikon suru 意思：離婚 (to get divorced)","say":"離婚する（りこんする）"},{"t":"混む（こむ）","m":"komu 意思：擁擠 (to be crowded)","say":"混む（こむ）"},{"t":"映画館（えいがかん）","m":"eigakan 意思：電影院 (movie theater)","say":"映画館（えいがかん）"}],"grammar":["<b>傳聞そうです 是什麼意思？跟樣態そうです有什麼不同？</b><br><br>そうです 有兩種意思：樣態（先前學過）表示「看起來…」，接在形容詞語幹之後；傳聞（本單元）表示「聽說…（轉述訊息）」，接在句子常體（短形）之後。","<b>各詞性要怎麼接傳聞そうです？</b><br><br>動詞、い形容詞：直接接常體句尾。な形容詞、名詞＋です：現在肯定要把「だ」保留（元気だそうです、学生だそうです），其餘時態、否定則正常接常體。そうです 本身不隨時態變化，沒有そうじゃありません、そうでした這種變化。","<b>〜によると 是什麼意思？</b><br><br>用來指明消息來源，句型：(消息來源)によると、(常體句子)そうです。例如：天気予報（てんきよほう）によると、明日（あした）雨（あめ)が降（ふ）るそうです。（根據天氣預報，明天會下雨。）"],"example":[{"en":"I have heard that their Japanese class is fun.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>授業<rt>じゅぎょう</rt></ruby>は<ruby>楽<rt>たの</rt></ruby>しいそうです。","rj":"Nihongo no jugyou wa tanoshii sou desu.","say":"日本語の授業は楽しいそうです。"},{"en":"I have heard that their teacher is very kind.","jp":"<ruby>先生<rt>せんせい</rt></ruby>はとても<ruby>親切<rt>しんせつ</rt></ruby>だそうです。","rj":"Sensei wa totemo shinsetsu da sou desu.","say":"先生はとても親切だそうです。"},{"en":"I have heard that they did not have a class today.","jp":"<ruby>今日<rt>きょう</rt></ruby>は<ruby>授業<rt>じゅぎょう</rt></ruby>がなかったそうです。","rj":"Kyou wa jugyou ga nakatta sou desu.","say":"今日は授業がなかったそうです。"},{"en":"I heard that Ken speaks Japanese.","jp":"けんは<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>すそうです。","rj":"Ken wa nihongo o hanasu sou desu.","say":"けんは日本語を話すそうです。"},{"en":"I heard that Ken is a student.","jp":"けんは<ruby>学生<rt>がくせい</rt></ruby>だそうです。","rj":"Ken wa gakusei da sou desu.","say":"けんは学生だそうです。"},{"en":"According to the weather forecast, it will rain tomorrow.","jp":"<ruby>天気予報<rt>てんきよほう</rt></ruby>によると、<ruby>明日<rt>あした</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>るそうです。","rj":"Tenkiyohou ni yoru to, ashita ame ga furu sou desu.","say":"天気予報によると、明日雨が降るそうです。"},{"en":"I heard that Miki will get a divorce.","jp":"みきは<ruby>離婚<rt>りこん</rt></ruby>するそうです。","rj":"Miki wa rikon suru sou desu.","say":"みきは離婚するそうです。"},{"en":"I heard that Miki got a divorce.","jp":"みきは<ruby>離婚<rt>りこん</rt></ruby>したそうです。","rj":"Miki wa rikon shita sou desu.","say":"みきは離婚したそうです。"},{"en":"I heard that it won't rain tomorrow.","jp":"<ruby>明日<rt>あした</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らないそうです。","rj":"Ashita ame ga furanai sou desu.","say":"明日雨が降らないそうです。"},{"en":"I heard that it did not rain yesterday.","jp":"<ruby>昨日<rt>きのう</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らなかったそうです。","rj":"Kinou ame ga furanakatta sou desu.","say":"昨日雨が降らなかったそうです。"},{"en":"I heard that the movie theater was not crowded.","jp":"<ruby>映画館<rt>えいがかん</rt></ruby>は<ruby>混<rt>こ</rt></ruby>んでいなかったそうです。","rj":"Eigakan wa konde inakatta sou desu.","say":"映画館は混んでいなかったそうです。"}]},{"num":218,"title":"〜って","vocab":[{"t":"忙しい（いそがしい）","m":"isogashii 意思：忙碌的 (busy)","say":"忙しい（いそがしい）"},{"t":"試験（しけん）","m":"shiken 意思：考試 (exam)","say":"試験（しけん）"},{"t":"昨晩（さくばん）","m":"sakuban 意思：昨晚 (last night)","say":"昨晩（さくばん）"},{"t":"すし（すし）","m":"sushi 意思：壽司 (sushi)","say":"すし（すし）"},{"t":"何と言う（なんという）","m":"nan to iu 意思：說什麼 (to say what)","say":"何と言う（なんという）"},{"t":"会議（かいぎ）","m":"kaigi 意思：會議 (meeting)","say":"会議（かいぎ）"}],"grammar":["<b>〜って 是什麼？</b><br><br>って 是引用助詞「と」的口語（隨性）版本，常用來取代そうです，表示「聽說…、他說…」，接續方式與と言っていました／そうです相同——都接在常體（短形）之後。","<b>〜って 有什麼特殊音變規則？</b><br><br>當って前一個字是「ん」時，って會變成「て」（尾音同化）。例如：何（なん）＋って→何（なん）て。"],"example":[{"en":"(Mary said/says) she is busy today.","jp":"メアリーは<ruby>今日<rt>きょう</rt></ruby>は<ruby>忙<rt>いそが</rt></ruby>しいって。","rj":"Meari- wa kyou wa isogashii tte.","say":"メアリーは今日は忙しいって。"},{"en":"(Mary said/says) she has an exam tomorrow.","jp":"メアリーは<ruby>明日<rt>あした</rt></ruby><ruby>試験<rt>しけん</rt></ruby>があるって。","rj":"Meari- wa ashita shiken ga aru tte.","say":"メアリーは明日試験があるって。"},{"en":"Tomo said he ate sushi last night.","jp":"ともは<ruby>昨晩<rt>さくばん</rt></ruby>すしを<ruby>食<rt>た</rt></ruby>べたって<ruby>言<rt>い</rt></ruby>ってた。","rj":"Tomo wa sakuban sushi o tabeta tte itteta.","say":"ともは昨晩すしを食べたって言ってた。"},{"en":"What did Akira say?","jp":"あきらは<ruby>何<rt>なん</rt></ruby>て<ruby>言<rt>い</rt></ruby>ってた？","rj":"Akira wa nante itteta?","say":"あきらは何て言ってた？"},{"en":"Tom said he needs to study tonight.","jp":"トムは<ruby>今晩<rt>こんばん</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>しなくちゃいけないって。","rj":"Tomu wa konban benkyou shinakuchaikenai tte.","say":"トムは今晩勉強しなくちゃいけないって。"},{"en":"Mary said her birthday is tomorrow.","jp":"メアリーの<ruby>誕生日<rt>たんじょうび</rt></ruby>は<ruby>明日<rt>あした</rt></ruby>だって。","rj":"Meari- no tanjoubi wa ashita da tte.","say":"メアリーの誕生日は明日だって。"},{"en":"Kai said he won't attend the meeting.","jp":"かいは<ruby>会議<rt>かいぎ</rt></ruby>に<ruby>出席<rt>しゅっせき</rt></ruby>しないって。","rj":"Kai wa kaigi ni shusseki shinai tte.","say":"かいは会議に出席しないって。"},{"en":"Machi said she won't come to Japan.","jp":"まちは<ruby>日本<rt>にほん</rt></ruby>にこないって。","rj":"Machi wa nihon ni konai tte.","say":"まちは日本にこないって。"}]},{"num":219,"title":"〜たら 1 - If A, then B","vocab":[{"t":"散歩（さんぽ）","m":"sanpo 意思：散步 (walk)","say":"散歩（さんぽ）"},{"t":"言葉（ことば）","m":"kotoba 意思：語詞 (word)","say":"言葉（ことば）"},{"t":"弁護士（べんごし）","m":"bengoshi 意思：律師 (lawyer)","say":"弁護士（べんごし）"},{"t":"寝坊する（ねぼうする）","m":"nebou suru 意思：睡過頭 (to oversleep)","say":"寝坊する（ねぼうする）"},{"t":"成績（せいせき）","m":"seiseki 意思：成績 (grades)","say":"成績（せいせき）"},{"t":"出かける（でかける）","m":"dekakeru 意思：出門 (to go out)","say":"出かける（でかける）"},{"t":"バーベキュー（ばーべきゅー）","m":"ba-bekyu- 意思：烤肉 (barbecue)","say":"バーベキュー（ばーべきゅー）"},{"t":"起こす（おこす）","m":"okosu 意思：叫醒 (to wake (someone) up)","say":"起こす（おこす）"},{"t":"悲しい（かなしい）","m":"kanashii 意思：悲傷的 (sad)","say":"悲しい（かなしい）"}],"grammar":["<b>「〜たら」是什麼意思？怎麼接？</b><br><br>たら 是表示條件的假定語氣之一，たら 開頭的「た」來自各詞性過去式常體肯定的字尾。句型：[A：過去式常體]＋ら[B]，相當於英文「If A, then B.」。","<b>〜たら 有哪幾種用法？</b><br><br>三種主要用法：①基本用法「如果A，就B」；②用來安排未來事件的先後順序；③表達純粹假設（未必真的會發生）的條件與其可能結果。"],"example":[{"en":"I will buy Kimono if and when I go to Japan.","jp":"<ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったら、<ruby>着物<rt>きもの</rt></ruby>を<ruby>買<rt>か</rt></ruby>います。","rj":"Nihon ni ittara, kimono o kaimasu.","say":"日本に行ったら、着物を買います。"},{"en":"We will go for a walk, if the weather is fine.","jp":"<ruby>天気<rt>てんき</rt></ruby>がよかったら、<ruby>散歩<rt>さんぽ</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。","rj":"Tenki ga yokattara, sanpo ni ikimasu.","say":"天気がよかったら、散歩に行きます。"},{"en":"I will ask about it, if I see Tom.","jp":"トムに<ruby>会<rt>あ</rt></ruby>ったら、そのことを<ruby>聞<rt>き</rt></ruby>きます。","rj":"Tomu ni attara, sono koto o kikimasu.","say":"トムに会ったら、そのことを聞きます。"},{"en":"If they are a Japanese person, then they will probably know this word.","jp":"<ruby>日本人<rt>にほんじん</rt></ruby>だったら、この<ruby>言葉<rt>ことば</rt></ruby>を<ruby>知<rt>し</rt></ruby>っているでしょう。","rj":"Nihonjin dattara, kono kotoba o shitte iru deshou.","say":"日本人だったら、この言葉を知っているでしょう。"},{"en":"If I was not a teacher, I want to be a lawyer.","jp":"<ruby>先生<rt>せんせい</rt></ruby>じゃなかったら、<ruby>弁護士<rt>べんごし</rt></ruby>になりたいです。","rj":"Sensei ja nakattara, bengoshi ni naritai desu.","say":"先生じゃなかったら、弁護士になりたいです。"},{"en":"Let's have a barbecue, if it does not rain this weekend.","jp":"<ruby>今週末<rt>こんしゅうまつ</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らなかったら、バーベキューをしましょう。","rj":"Konshuumatsu ame ga furanakattara, baabekyuu o shimashou.","say":"今週末雨が降らなかったら、バーベキューをしましょう。"},{"en":"If I oversleep, please wake me up.","jp":"<ruby>寝坊<rt>ねぼう</rt></ruby>したら、<ruby>起<rt>お</rt></ruby>こしてください。","rj":"Nebou shitara, okoshite kudasai.","say":"寝坊したら、起こしてください。"},{"en":"If my grade is not good, I become sad.","jp":"<ruby>成績<rt>せいせき</rt></ruby>がよくなかったら、<ruby>悲<rt>かな</rt></ruby>しくなります。","rj":"Seiseki ga yokunakattara, kanashiku narimasu.","say":"成績がよくなかったら、悲しくなります。"},{"en":"If I am not fine, I will not go out.","jp":"<ruby>元気<rt>げんき</rt></ruby>じゃなかったら、<ruby>出<rt>で</rt></ruby>かけません。","rj":"Genki ja nakattara, dekakemasen.","say":"元気じゃなかったら、出かけません。"}]},{"num":220,"title":"〜たら 2 - Events and Activities in a Temporal Sequence","vocab":[{"t":"掃除（そうじ）","m":"souji 意思：打掃 (cleaning)","say":"掃除（そうじ）"},{"t":"嬉しい（うれしい）","m":"ureshii 意思：高興的 (happy, glad)","say":"嬉しい（うれしい）"},{"t":"両親（りょうしん）","m":"ryoushin 意思：雙親 (parents)","say":"両親（りょうしん）"},{"t":"キャンプする（きゃんぷする）","m":"kyanpu suru 意思：露營 (to camp)","say":"キャンプする（きゃんぷする）"},{"t":"テント（てんと）","m":"tento 意思：帳篷 (tent)","say":"テント（てんと）"},{"t":"終わる（おわる）","m":"owaru 意思：結束 (to finish)","say":"終わる（おわる）"}],"grammar":["<b>用法②「安排未來事件的先後順序」是什麼意思？</b><br><br>當たら子句描述的是幾乎必然會發生的條件時，たら的功能其實只是單純串連兩件未來會依序發生的事——先做Action 1，然後做Action 2，語感接近英文的「when」而非「if」。","<b>為什麼同一個 たら 句子形式，可能同時對應「if」與「when」兩種解讀？</b><br><br>たら子句本身沒有固定屬於「假設」或「時間順序」哪一種——差別不在句子的文法結構，而在於現實世界中，該條件到底有多大機率會發生。若幾乎確定會發生，自然理解為「when」；若不確定是否會發生，則理解為「if」。"],"example":[{"en":"I will call you when I get home tonight.","jp":"<ruby>今晩<rt>こんばん</rt></ruby>、うちに<ruby>帰<rt>かえ</rt></ruby>ったら、<ruby>電話<rt>でんわ</rt></ruby>します。","rj":"Konban, uchi ni kaettara, denwa shimasu.","say":"今晩、うちに帰ったら、電話します。"},{"en":"Let's go out and have some fun once we are done with the homework.","jp":"<ruby>宿題<rt>しゅくだい</rt></ruby>が<ruby>終<rt>お</rt></ruby>わったら、<ruby>遊<rt>あそ</rt></ruby>びに<ruby>行<rt>い</rt></ruby>きましょう。","rj":"Shukudai ga owattara, asobi ni ikimashou.","say":"宿題が終わったら、遊びに行きましょう。"},{"en":"I will read a book (if and) when I finish cleaning the house.","jp":"<ruby>家<rt>いえ</rt></ruby>の<ruby>掃除<rt>そうじ</rt></ruby>が<ruby>終<rt>お</rt></ruby>わったら、<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みます。","rj":"Ie no souji ga owattara, hon o yomimasu.","say":"家の掃除が終わったら、本を読みます。"},{"en":"I will study (if and) after I eat dinner.","jp":"<ruby>夜<rt>よる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べたら、<ruby>勉強<rt>べんきょう</rt></ruby>します。","rj":"Yorugohan o tabetara, benkyou shimasu.","say":"夜ご飯を食べたら、勉強します。"},{"en":"Miyu will be happy (if and) when she sees her parents.","jp":"<ruby>両親<rt>りょうしん</rt></ruby>に<ruby>会<rt>あ</rt></ruby>ったら、みゆは<ruby>嬉<rt>うれ</rt></ruby>しいでしょう。","rj":"Ryoushin ni attara, Miyu wa ureshii deshou.","say":"両親に会ったら、みゆは嬉しいでしょう。"},{"en":"Let's go camping (if and) when I buy a tent!","jp":"テントを<ruby>買<rt>か</rt></ruby>ったら、キャンプしに<ruby>行<rt>い</rt></ruby>きましょう。","rj":"Tento o kattara, kyanpu shi ni ikimashou.","say":"テントを買ったら、キャンプしに行きましょう。"}]},{"num":221,"title":"〜たら 3 - Hypothetical Condition and its Probable Result","vocab":[{"t":"猫（ねこ）","m":"neko 意思：貓 (cat)","say":"猫（ねこ）"},{"t":"寝る（ねる）","m":"neru 意思：睡覺 (to sleep)","say":"寝る（ねる）"},{"t":"一日中（いちにちじゅう）","m":"ichinichijuu 意思：一整天 (all day long)","say":"一日中（いちにちじゅう）"},{"t":"お金（かね）","m":"okane 意思：錢 (money)","say":"お金（かね）"},{"t":"車（くるま）","m":"kuruma 意思：車子 (car)","say":"車（くるま）"},{"t":"買う（かう）","m":"kau 意思：買 (to buy)","say":"買う（かう）"},{"t":"来週（らいしゅう）","m":"raishuu 意思：下週 (next week)","say":"来週（らいしゅう）"},{"t":"試験（しけん）","m":"shiken 意思：考試 (exam)","say":"試験（しけん）"},{"t":"今週末（こんしゅうまつ）","m":"konshuumatsu 意思：這個週末 (this weekend)","say":"今週末（こんしゅうまつ）"},{"t":"勉強する（べんきょうする）","m":"benkyou suru 意思：讀書、學習 (to study)","say":"勉強する（べんきょうする）"},{"t":"結婚する（けっこんする）","m":"kekkon suru 意思：結婚 (to get married)","say":"結婚する（けっこんする）"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"毎日（まいにち）","m":"mainichi 意思：每天 (every day)","say":"毎日（まいにち）"},{"t":"日本人（にほんじん）","m":"nihonjin 意思：日本人 (Japanese person)","say":"日本人（にほんじん）"},{"t":"寿司（すし）","m":"sushi 意思：壽司 (sushi)","say":"寿司（すし）"},{"t":"若い（わかい）","m":"wakai 意思：年輕的 (young)","say":"若い（わかい）"},{"t":"始める（はじめる）","m":"hajimeru 意思：開始 (to start)","say":"始める（はじめる）"},{"t":"サーフィン","m":"saafin 意思：衝浪 (surfing)","say":"サーフィン"},{"t":"なる","m":"naru 意思：變成 (to become)","say":"なる"},{"t":"何（なに）","m":"nani 意思：什麼 (what)","say":"何（なに）"}],"grammar":["<b>〜たら 除了基本假設與先後順序，還有第三種用法是什麼？</b><br><br>這裡要學的是「純粹假設的條件與其可能結果」，句型為「もし A たら、可能會 B」（若真的發生A，大概就會B），接續方式為「[A的過去式常體]＋ら，[B]」。","<b>這種用法有什麼限制？</b><br><br>有兩個限制：一是B所描述的事情不能發生在A之前；二是たら只能描述A與B之間自然成立的條件關係，不能用來表達「即使A，B仍然成立」這種讓步語氣。"],"example":[{"en":"If I were a cat, I would probably sleep all day.","jp":"<ruby>私<rt>わたし</rt></ruby>が<ruby>猫<rt>ねこ</rt></ruby>だったら、<ruby>一日中<rt>いちにちじゅう</rt></ruby><ruby>寝<rt>ね</rt></ruby>ているでしょう。","rj":"Watashi ga neko dattara, ichinichijuu nete iru deshou.","say":"私が猫だったら、一日中寝ているでしょう。"},{"en":"If I had money, I would buy a car.","jp":"お<ruby>金<rt>かね</rt></ruby>があったら、<ruby>車<rt>くるま</rt></ruby>を<ruby>買<rt>か</rt></ruby>うんですけど。","rj":"Okane ga attara, kuruma o kaun desu kedo.","say":"お金があったら、車を買うんですけど。"},{"en":"If you have an exam next week, you should study this weekend.","jp":"<ruby>来週<rt>らいしゅう</rt></ruby><ruby>試験<rt>しけん</rt></ruby>があったら、<ruby>今週末<rt>こんしゅうまつ</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>したほうがいいです。","rj":"Raishuu shiken ga attara, konshuumatsu benkyou shita hou ga ii desu.","say":"来週試験があったら、今週末勉強したほうがいいです。"},{"en":"Even if you want to get married, I will not marry you.","jp":"あなたが<ruby>結婚<rt>けっこん</rt></ruby>したかったら、<ruby>私<rt>わたし</rt></ruby>は<ruby>結婚<rt>けっこん</rt></ruby>しません。","rj":"Anata ga kekkon shitakattara, watashi wa kekkon shimasen.","say":"あなたが結婚したかったら、私は結婚しません。"},{"en":"If I were Japanese, I would eat sushi every day.","jp":"<ruby>日本人<rt>にほんじん</rt></ruby>だったら、<ruby>毎日<rt>まいにち</rt></ruby><ruby>寿司<rt>すし</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。","rj":"Nihonjin dattara, mainichi sushi o tabemasu.","say":"日本人だったら、毎日寿司を食べます。"},{"en":"If I were young, I would start surfing.","jp":"<ruby>若<rt>わか</rt></ruby>かったら、サーフィンを<ruby>始<rt>はじ</rt></ruby>めます。","rj":"Wakakattara, saafin o hajimemasu.","say":"若かったら、サーフィンを始めます。"},{"en":"If you could become anything, what would you want to become?","jp":"<ruby>何<rt>なに</rt></ruby>にでもなれたら、<ruby>何<rt>なに</rt></ruby>になりたいですか？","rj":"Nani ni demo naretara, nani ni naritai desu ka?","say":"何にでもなれたら、何になりたいですか？"}]},{"num":222,"title":"〜なくてもいいです (Don't need to do....)","vocab":[{"t":"靴（くつ）","m":"kutsu 意思：鞋子 (shoes)","say":"靴（くつ）"},{"t":"脱ぐ（ぬぐ）","m":"nugu 意思：脫掉 (to take off)","say":"脱ぐ（ぬぐ）"},{"t":"予約する（よやくする）","m":"yoyaku suru 意思：預約 (to reserve)","say":"予約する（よやくする）"},{"t":"持ってくる（もってくる）","m":"motte kuru 意思：帶來 (to bring)","say":"持ってくる（もってくる）"},{"t":"食べ物（たべもの）","m":"tabemono 意思：食物 (food)","say":"食べ物（たべもの）"},{"t":"パーティー","m":"paatii 意思：派對、聚會 (party)","say":"パーティー"},{"t":"勉強する（べんきょうする）","m":"benkyou suru 意思：讀書、學習 (to study)","say":"勉強する（べんきょうする）"},{"t":"今晩（こんばん）","m":"konban 意思：今晚 (tonight)","say":"今晩（こんばん）"},{"t":"掃除する（そうじする）","m":"souji suru 意思：打掃 (to clean)","say":"掃除する（そうじする）"},{"t":"2階（にかい）","m":"nikai 意思：二樓 (second floor)","say":"2階（にかい）"}],"grammar":["<b>〜なくてもいいです 是什麼意思？怎麼接？</b><br><br>表示「不需要做某件事」，是「必須做」句型的相反。做法是先把句子改成動詞（或形容詞）的「ない形」，去掉最後的い，再加上「くてもいいです」。若是い形容詞，則把語尾的い去掉後加「くなくてもいいです」。整體結構可記為：[ない形去い]＋くてもいいです。"],"example":[{"en":"You don't need to take off your shoes.","jp":"<ruby>靴<rt>くつ</rt></ruby>をぬがなくてもいいです。","rj":"Kutsu o nuganakute mo ii desu.","say":"靴をぬがなくてもいいです。"},{"en":"The present doesn't need to be expensive.","jp":"プレゼントは<ruby>高<rt>たか</rt></ruby>くなくてもいいです。","rj":"Purezento wa takakunakute mo ii desu.","say":"プレゼントは高くなくてもいいです。"},{"en":"You don't need to make a reservation.","jp":"<ruby>予約<rt>よやく</rt></ruby>しなくてもいいです。","rj":"Yoyaku shinakute mo ii desu.","say":"予約しなくてもいいです。"},{"en":"You don't need to bring food to the party.","jp":"パーティーに<ruby>食<rt>た</rt></ruby>べ<ruby>物<rt>もの</rt></ruby>を<ruby>持<rt>も</rt></ruby>ってこなくてもいいです。","rj":"Paatii ni tabemono o motte konakute mo ii desu.","say":"パーティーに食べ物を持ってこなくてもいいです。"},{"en":"I don't need to study tonight.","jp":"<ruby>今晩<rt>こんばん</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>しなくてもいいです。","rj":"Konban benkyou shinakute mo ii desu.","say":"今晩勉強しなくてもいいです。"},{"en":"You don't need to clean the second floor.","jp":"2<ruby>階<rt>にかい</rt></ruby>を<ruby>掃除<rt>そうじ</rt></ruby>しなくてもいいです。","rj":"Nikai o souji shinakute mo ii desu.","say":"2階を掃除しなくてもいいです。"}]},{"num":223,"title":"〜みたいです (A resembles B)","vocab":[{"t":"ゴリラ","m":"gorira 意思：大猩猩 (gorilla)","say":"ゴリラ"},{"t":"卒業する（そつぎょうする）","m":"sotsugyou suru 意思：畢業 (to graduate)","say":"卒業する（そつぎょうする）"},{"t":"大学（だいがく）","m":"daigaku 意思：大學 (university)","say":"大学（だいがく）"},{"t":"お母さん（おかあさん）","m":"okaasan 意思：媽媽 (mother)","say":"お母さん（おかあさん）"},{"t":"来年（らいねん）","m":"rainen 意思：明年 (next year)","say":"来年（らいねん）"}],"grammar":["<b>〜みたいです 有哪兩種用法？</b><br><br>第一種接在名詞後面，表示「某人/某物看起來很像名詞所描述的人事物」，句型為「A は [人/物] みたいです」。第二種接在動詞普通形之後，表示「某件事情看起來是如此／似乎發生了某事」，句型為「[動詞普通形] みたいです」。","<b>みたいです 怎麼變成否定？</b><br><br>否定時「みたい」變化為「みたいじゃないです」。"],"example":[{"en":"My older brother is like my father.","jp":"<ruby>私<rt>わたし</rt></ruby>の<ruby>兄<rt>あに</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>のお<ruby>父<rt>とう</rt></ruby>さんみたいです。","rj":"Watashi no ani wa watashi no otousan mitai desu.","say":"私の兄は私のお父さんみたいです。"},{"en":"That person is like a gorilla.","jp":"あの<ruby>人<rt>ひと</rt></ruby>はゴリラみたいです。","rj":"Ano hito wa gorira mitai desu.","say":"あの人はゴリラみたいです。"},{"en":"It seems like it rained.","jp":"<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>ったみたいです。","rj":"Ame ga futta mitai desu.","say":"雨が降ったみたいです。"},{"en":"It seems like Maki isn't coming to school tomorrow.","jp":"まきは<ruby>明日<rt>あした</rt></ruby><ruby>学校<rt>がっこう</rt></ruby>に<ruby>来<rt>こ</rt></ruby>ないみたいです。","rj":"Maki wa ashita gakkou ni konai mitai desu.","say":"まきは明日学校に来ないみたいです。"},{"en":"Kotomi is like my mother.","jp":"ことみは<ruby>私<rt>わたし</rt></ruby>のお<ruby>母<rt>かあ</rt></ruby>さんみたいです。","rj":"Kotomi wa watashi no okaasan mitai desu.","say":"ことみは私のお母さんみたいです。"},{"en":"Do I seem like Mary?","jp":"<ruby>私<rt>わたし</rt></ruby>はメアリーみたいですか？","rj":"Watashi wa Mearii mitai desu ka?","say":"私はメアリーみたいですか？"},{"en":"Takeshi isn't like Ken.","jp":"たけしはけんみたいじゃないです。","rj":"Takeshi wa Ken mitai ja nai desu.","say":"たけしはけんみたいじゃないです。"},{"en":"It seems like Taka will graduate from university next year.","jp":"たかは<ruby>来年<rt>らいねん</rt></ruby><ruby>大学<rt>だいがく</rt></ruby>を<ruby>卒業<rt>そつぎょう</rt></ruby>するみたいです。","rj":"Taka wa rainen daigaku o sotsugyou suru mitai desu.","say":"たかは来年大学を卒業するみたいです。"}]},{"num":224,"title":"〜前に (Before doing ...)","vocab":[{"t":"もう一度（もういちど）","m":"mou ichido 意思：再一次 (once more)","say":"もう一度（もういちど）"},{"t":"学期（がっき）","m":"gakki 意思：學期 (semester)","say":"学期（がっき）"},{"t":"磨く（みがく）","m":"migaku 意思：刷、磨 (to brush/polish)","say":"磨く（みがく）"},{"t":"歯（は）","m":"ha 意思：牙齒 (tooth)","say":"歯（は）"},{"t":"観る（みる）","m":"miru 意思：看 (to watch)","say":"観る（みる）"},{"t":"テレビ","m":"terebi 意思：電視 (television)","say":"テレビ"},{"t":"する","m":"suru 意思：做 (to do)","say":"する"},{"t":"宿題（しゅくだい）","m":"shukudai 意思：功課、作業 (homework)","say":"宿題（しゅくだい）"},{"t":"行く（いく）","m":"iku 意思：去 (to go)","say":"行く（いく）"},{"t":"中国（ちゅうごく）","m":"Chuugoku 意思：中國 (China)","say":"中国（ちゅうごく）"},{"t":"来る（くる）","m":"kuru 意思：來 (to come)","say":"来る（くる）"},{"t":"カフェ","m":"kafe 意思：咖啡廳 (café)","say":"カフェ"},{"t":"飲む（のむ）","m":"nomu 意思：喝 (to drink)","say":"飲む（のむ）"},{"t":"コーヒー","m":"koohii 意思：咖啡 (coffee)","say":"コーヒー"},{"t":"寝る（ねる）","m":"neru 意思：睡覺 (to sleep)","say":"寝る（ねる）"}],"grammar":["<b>〜前に 是什麼意思？怎麼接？</b><br><br>用來表示「在做A這個動作/事件之前，先做B」，句型結構為「動詞A（辭書形）＋前に＋動詞B」，意思是「B在A之前」。","<b>前に 前面的動詞要用什麼時態？</b><br><br>無論整句話最終使用的是現在式還是過去式，前面接在「前に」之前的動詞A永遠都要用現在式（辭書形），這是這個文法最需要注意的重點。"],"example":[{"en":"Before I go back to America, I will go to Tokyo one more time.","jp":"アメリカに<ruby>帰<rt>かえ</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>に、もう<ruby>一度<rt>いちど</rt></ruby><ruby>東京<rt>とうきょう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。","rj":"Amerika ni kaeru mae ni, mou ichido Toukyou ni ikimasu.","say":"アメリカに帰る前に、もう一度東京に行きます。"},{"en":"Before coming to Japan, I studied Japanese for one semester.","jp":"<ruby>日本<rt>にほん</rt></ruby>に<ruby>来<rt>く</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>に、<ruby>一学期<rt>いちがっき</rt></ruby><ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しました。","rj":"Nihon ni kuru mae ni, ichi gakki nihongo o benkyou shimashita.","say":"日本に来る前に、一学期日本語を勉強しました。"},{"en":"Before watching TV, I do my homework.","jp":"テレビを<ruby>観<rt>み</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>に、<ruby>宿題<rt>しゅくだい</rt></ruby>をします。","rj":"Terebi o miru mae ni, shukudai o shimasu.","say":"テレビを観る前に、宿題をします。"},{"en":"Before coming to Japan, I went to China.","jp":"<ruby>日本<rt>にほん</rt></ruby>に<ruby>来<rt>く</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>に、<ruby>中国<rt>ちゅうごく</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","rj":"Nihon ni kuru mae ni, Chuugoku ni ikimashita.","say":"日本に来る前に、中国に行きました。"},{"en":"Mary didn't drink coffee before going to the café.","jp":"メアリーはカフェに<ruby>行<rt>い</rt></ruby>く<ruby>前<rt>まえ</rt></ruby>にコーヒーを<ruby>飲<rt>の</rt></ruby>みませんでした。","rj":"Mearii wa kafe ni iku mae ni koohii o nomimasen deshita.","say":"メアリーはカフェに行く前にコーヒーを飲みませんでした。"},{"en":"Did you brush your teeth before going to bed?","jp":"<ruby>寝<rt>ね</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>に<ruby>歯<rt>は</rt></ruby>を<ruby>磨<rt>みが</rt></ruby>きましたか？","rj":"Neru mae ni ha o migakimashita ka?","say":"寝る前に歯を磨きましたか？"}]},{"num":225,"title":"〜てから (After doing ...)","vocab":[{"t":"会う（あう）","m":"au 意思：見面 (to meet)","say":"会う（あう）"},{"t":"来る（くる）","m":"kuru 意思：來 (to come)","say":"来る（くる）"},{"t":"死ぬ（しぬ）","m":"shinu 意思：死亡 (to die)","say":"死ぬ（しぬ）"},{"t":"寂しい（さびしい）","m":"sabishii 意思：寂寞的 (lonely)","say":"寂しい（さびしい）"},{"t":"行く（いく）","m":"iku 意思：去 (to go)","say":"行く（いく）"},{"t":"ジム","m":"jimu 意思：健身房 (gym)","say":"ジム"},{"t":"家（いえ）","m":"ie 意思：家 (house)","say":"家（いえ）"},{"t":"お店（おみせ）","m":"omise 意思：店 (store)","say":"お店（おみせ）"},{"t":"学校（がっこう）","m":"gakkou 意思：學校 (school)","say":"学校（がっこう）"},{"t":"祈る（いのる）","m":"inoru 意思：祈禱 (to pray)","say":"祈る（いのる）"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"テニス","m":"tenisu 意思：網球 (tennis)","say":"テニス"},{"t":"日本語（にほんご）","m":"nihongo 意思：日文 (Japanese language)","say":"日本語（にほんご）"}],"grammar":["<b>〜てから 是什麼意思？</b><br><br>用於描述「做完A之後才做B」，意思是「A之後，B」，結構為：A的動詞て形＋から＋B。","<b>〜てから 還有什麼延伸用法？</b><br><br>「AてからB」也可以用來描述「自從A發生後，B這個狀態就一直持續到現在」，強調狀態的延續性（例如自從貓過世後就一直很寂寞）。"],"example":[{"en":"After studying, I met Kai.","jp":"<ruby>勉強<rt>べんきょう</rt></ruby>してから、かいに<ruby>会<rt>あ</rt></ruby>いました。","rj":"Benkyou shite kara, Kai ni aimashita.","say":"勉強してから、かいに会いました。"},{"en":"Let's eat after Ken comes.","jp":"けんがきてから、<ruby>食<rt>た</rt></ruby>べましょう。","rj":"Ken ga kite kara, tabemashou.","say":"けんがきてから、食べましょう。"},{"en":"I've been very lonely since my cat died.","jp":"<ruby>猫<rt>ねこ</rt></ruby>が<ruby>死<rt>し</rt></ruby>んでから、とても<ruby>寂<rt>さび</rt></ruby>しいです。","rj":"Neko ga shinde kara, totemo sabishii desu.","say":"猫が死んでから、とても寂しいです。"},{"en":"After cleaning the house, I will go to the gym.","jp":"<ruby>家<rt>いえ</rt></ruby>を<ruby>掃除<rt>そうじ</rt></ruby>してから、ジムに<ruby>行<rt>い</rt></ruby>きます。","rj":"Ie o souji shite kara, jimu ni ikimasu.","say":"家を掃除してから、ジムに行きます。"},{"en":"Mika came to school after going to the store.","jp":"みかはお<ruby>店<rt>みせ</rt></ruby>に<ruby>行<rt>い</rt></ruby>ってから、<ruby>学校<rt>がっこう</rt></ruby>にきました。","rj":"Mika wa mise ni itte kara, gakkou ni kimashita.","say":"みかはお店に行ってから、学校にきました。"},{"en":"Do you eat after praying?","jp":"<ruby>祈<rt>いの</rt></ruby>ってから、ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べますか？","rj":"Inotte kara, gohan o tabemasu ka?","say":"祈ってから、ご飯を食べますか？"},{"en":"After playing tennis, I studied Japanese.","jp":"テニスをしてから、<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しました。","rj":"Tenisu o shite kara, nihongo o benkyou shimashita.","say":"テニスをしてから、日本語を勉強しました。"}]},{"num":227,"title":"Transitivity Pairs","vocab":[{"t":"電気（でんき）","m":"denki 意思：電、電燈 (electricity/light)","say":"電気（でんき）"},{"t":"窓（まど）","m":"mado 意思：窗戶 (window)","say":"窓（まど）"},{"t":"かご","m":"kago 意思：籃子 (basket)","say":"かご"},{"t":"ろうそく","m":"rousoku 意思：蠟燭 (candle)","say":"ろうそく"},{"t":"洋服（ようふく）","m":"youfuku 意思：衣服 (clothes)","say":"洋服（ようふく）"},{"t":"靴（くつ）","m":"kutsu 意思：鞋子 (shoes)","say":"靴（くつ）"},{"t":"開ける（あける）","m":"akeru 意思：打開某物（他動詞） (to open (something))","say":"開ける（あける）"},{"t":"開く（ひらく）","m":"hiraku 意思：某物打開（自動詞） (to open (by itself))","say":"開く（ひらく）"},{"t":"閉める（しめる）","m":"shimeru 意思：關上某物（他動詞） (to close (something))","say":"閉める（しめる）"},{"t":"閉まる（しまる）","m":"shimaru 意思：某物關上（自動詞） (to be closed)","say":"閉まる（しまる）"},{"t":"入れる（いれる）","m":"ireru 意思：把某物放入（他動詞） (to put in)","say":"入れる（いれる）"},{"t":"入る（はいる）","m":"hairu 意思：某物進入（自動詞） (to enter)","say":"入る（はいる）"},{"t":"出す（だす）","m":"dasu 意思：把某物拿出（他動詞） (to take out)","say":"出す（だす）"},{"t":"出る（でる）","m":"deru 意思：某物出去（自動詞） (to go out)","say":"出る（でる）"},{"t":"つける","m":"tsukeru 意思：打開（開關，他動詞） (to turn on)","say":"つける"},{"t":"つく","m":"tsuku 意思：自動打開（自動詞） (to turn on (by itself))","say":"つく"},{"t":"消す（けす）","m":"kesu 意思：關掉某物（他動詞） (to turn off)","say":"消す（けす）"},{"t":"消える（きえる）","m":"kieru 意思：某物熄滅（自動詞） (to go off)","say":"消える（きえる）"},{"t":"壊す（こわす）","m":"kowasu 意思：弄壞某物（他動詞） (to break (something))","say":"壊す（こわす）"},{"t":"壊れる（こわれる）","m":"kowareru 意思：某物壞掉（自動詞） (to break (by itself))","say":"壊れる（こわれる）"},{"t":"汚す（よごす）","m":"yogosu 意思：把某物弄髒（他動詞） (to make dirty)","say":"汚す（よごす）"},{"t":"汚れる（よごれる）","m":"yogoreru 意思：某物變髒（自動詞） (to get dirty)","say":"汚れる（よごれる）"},{"t":"落とす（おとす）","m":"otosu 意思：把某物弄掉（他動詞） (to drop)","say":"落とす（おとす）"},{"t":"落ちる（おちる）","m":"ochiru 意思：某物掉落（自動詞） (to fall)","say":"落ちる（おちる）"},{"t":"沸かす（わかす）","m":"wakasu 意思：把水煮沸（他動詞） (to boil (something))","say":"沸かす（わかす）"},{"t":"沸く（わく）","m":"waku 意思：水煮沸了（自動詞） (to come to a boil)","say":"沸く（わく）"}],"grammar":["<b>他動詞和自動詞有什麼不同？</b><br><br>他動詞（transitive verb）描述人對某事物做出的動作，句中會同時出現主詞與受詞（用「を」標示受詞），例如「開ける」（打開某物）；自動詞（intransitive verb）描述事物本身發生的變化，句中只會出現主詞（用「が」標示），例如「開く」（某物自己打開了）。許多常用動詞會成對出現。","<b>他動詞和自動詞接上「ている」時，意思有什麼不同？</b><br><br>他動詞＋ている表示動作正在進行中；自動詞＋ている則表示變化發生後所形成、持續存在的狀態。"],"example":[{"en":"Takeshi turned on the light.","jp":"たけしが<ruby>電気<rt>でんき</rt></ruby>をつけました。","rj":"Takeshi ga denki o tsukemashita.","say":"たけしが電気をつけました。"},{"en":"The light turned on.","jp":"<ruby>電気<rt>でんき</rt></ruby>がつきました。","rj":"Denki ga tsukimashita.","say":"電気がつきました。"},{"en":"I put the apple in the basket.","jp":"りんごをかごに<ruby>入<rt>い</rt></ruby>れました。","rj":"Ringo o kago ni iremashita.","say":"りんごをかごに入れました。"},{"en":"The apple went into the basket.","jp":"りんごがかごに<ruby>入<rt>はい</rt></ruby>りました。","rj":"Ringo ga kago ni hairimashita.","say":"りんごがかごに入りました。"},{"en":"Sue is talking with her mother.","jp":"すーはお<ruby>母<rt>かあ</rt></ruby>さんと<ruby>話<rt>はな</rt></ruby>しています。","rj":"Suu wa okaasan to hanashite imasu.","say":"すーはお母さんと話しています。"},{"en":"Tom is married.","jp":"トムは<ruby>結婚<rt>けっこん</rt></ruby>しています。","rj":"Tomu wa kekkon shite imasu.","say":"トムは結婚しています。"},{"en":"Ken is opening the window.","jp":"けんは<ruby>窓<rt>まど</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けています。","rj":"Ken wa mado o akete imasu.","say":"けんは窓を開けています。"},{"en":"The window is open.","jp":"<ruby>窓<rt>まど</rt></ruby>が<ruby>開<rt>あ</rt></ruby>いています。","rj":"Mado ga aite imasu.","say":"窓が開いています。"},{"en":"Tomo is turning off the light.","jp":"ともは<ruby>電気<rt>でんき</rt></ruby>を<ruby>消<rt>け</rt></ruby>しています。","rj":"Tomo wa denki o keshite imasu.","say":"ともは電気を消しています。"},{"en":"The light is off.","jp":"<ruby>電気<rt>でんき</rt></ruby>が<ruby>消<rt>き</rt></ruby>えています。","rj":"Denki ga kiete imasu.","say":"電気が消えています。"},{"en":"I will close the door.","jp":"ドアを<ruby>閉<rt>し</rt></ruby>めます。","rj":"Doa o shimemasu.","say":"ドアを閉めます。"},{"en":"The door is closed.","jp":"ドアが<ruby>閉<rt>し</rt></ruby>まっています。","rj":"Doa ga shimatte imasu.","say":"ドアが閉まっています。"},{"en":"Please blow out the candle.","jp":"ろうそくを<ruby>消<rt>け</rt></ruby>してください。","rj":"Rousoku o keshite kudasai.","say":"ろうそくを消してください。"},{"en":"I got my clothes dirty.","jp":"<ruby>洋服<rt>ようふく</rt></ruby>を<ruby>汚<rt>よご</rt></ruby>しました。","rj":"Youfuku o yogoshimashita.","say":"洋服を汚しました。"},{"en":"My shoes didn't get dirty.","jp":"<ruby>靴<rt>くつ</rt></ruby>が<ruby>汚<rt>よご</rt></ruby>れませんでした。","rj":"Kutsu ga yogoremasen deshita.","say":"靴が汚れませんでした。"}]},{"num":228,"title":"〜てしまう (To complete doing something, and to regret doing something)","vocab":[{"t":"怒る（おこる）","m":"okoru 意思：生氣、發怒 (to get angry)","say":"怒る（おこる）"},{"t":"エッセイ（えっせい）","m":"essei 意思：隨筆、散文 (essay)","say":"エッセイ（えっせい）"},{"t":"失くす（なくす）","m":"nakusu 意思：遺失、弄丟 (to lose)","say":"失くす（なくす）"},{"t":"読む（よむ）","m":"yomu 意思：閱讀 (to read)","say":"読む（よむ）"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"忘れる（わすれる）","m":"wasureru 意思：忘記 (to forget)","say":"忘れる（わすれる）"},{"t":"教科書（きょうかしょ）","m":"kyoukasho 意思：教科書 (textbook)","say":"教科書（きょうかしょ）"},{"t":"書く（かく）","m":"kaku 意思：寫 (to write)","say":"書く（かく）"},{"t":"家（いえ）","m":"ie 意思：家 (house)","say":"家（いえ）"},{"t":"鍵（かぎ）","m":"kagi 意思：鑰匙 (key)","say":"鍵（かぎ）"},{"t":"死ぬ（しぬ）","m":"shinu 意思：死亡 (to die)","say":"死ぬ（しぬ）"},{"t":"犬（いぬ）","m":"inu 意思：狗 (dog)","say":"犬（いぬ）"},{"t":"昨日（きのう）","m":"kinou 意思：昨天 (yesterday)","say":"昨日（きのう）"},{"t":"遊ぶ（あそぶ）","m":"asobu 意思：玩 (to play)","say":"遊ぶ（あそぶ）"}],"grammar":["<b>〜てしまう 有哪兩種語感？</b><br><br>第一種是表示「刻意地、堅決地把事情做完」，強調把某件事徹底完成、做到底；第二種是表示「非出於本意、無法控制事態發展」，通常帶有「後悔」的語氣，表示發生了令人遺憾的事。","<b>〜てしまう 在口語中怎麼縮約？</b><br><br>口語中「〜てしまう／〜でしまう」常縮約為「〜ちゃう／〜じゃう」，過去式則為「〜ちゃった／〜じゃった」。由於しまう只能接在て形（肯定形）之後，因此無法用しまう表達「沒有發生」這種否定的懊悔語意。"],"example":[{"en":"I finished reading the book.","jp":"<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでしまいました。","rj":"Hon o yonde shimaimashita.","say":"本を読んでしまいました。"},{"en":"I ate the whole cake.","jp":"ケーキを<ruby>食<rt>た</rt></ruby>べてしまいました。","rj":"Keeki o tabete shimaimashita.","say":"ケーキを食べてしまいました。"},{"en":"I accidentally forgot my textbook.","jp":"<ruby>教科書<rt>きょうかしょ</rt></ruby>を<ruby>忘<rt>わす</rt></ruby>れてしまいました。","rj":"Kyoukasho o wasurete shimaimashita.","say":"教科書を忘れてしまいました。"},{"en":"Miki couldn't help getting angry.","jp":"みきは<ruby>怒<rt>おこ</rt></ruby>ってしまいました。","rj":"Miki wa okotte shimaimashita.","say":"みきは怒ってしまいました。"},{"en":"I forgot my textbook.","jp":"<ruby>教科書<rt>きょうかしょ</rt></ruby>を<ruby>忘<rt>わす</rt></ruby>れちゃった。","rj":"Kyoukasho o wasurechatta.","say":"教科書を忘れちゃった。"},{"en":"I finished writing the essay.","jp":"エッセイを<ruby>書<rt>か</rt></ruby>いてしまいました。","rj":"Essei o kaite shimaimashita.","say":"エッセイを書いてしまいました。"},{"en":"I finished writing the essay.","jp":"エッセイを<ruby>書<rt>か</rt></ruby>いちゃった。","rj":"Essei o kaichatta.","say":"エッセイを書いちゃった。"},{"en":"I unfortunately lost my house key.","jp":"<ruby>家<rt>いえ</rt></ruby>の<ruby>鍵<rt>かぎ</rt></ruby>を<ruby>失<rt>な</rt></ruby>くしてしまいました。","rj":"Ie no kagi o nakushite shimaimashita.","say":"家の鍵を失くしてしまいました。"},{"en":"I lost my house key.","jp":"<ruby>家<rt>いえ</rt></ruby>の<ruby>鍵<rt>かぎ</rt></ruby>を<ruby>失<rt>な</rt></ruby>くしちゃった。","rj":"Ie no kagi o nakushichatta.","say":"家の鍵を失くしちゃった。"},{"en":"Yesterday, my dog sadly passed away.","jp":"<ruby>昨日<rt>きのう</rt></ruby>、<ruby>犬<rt>いぬ</rt></ruby>が<ruby>死<rt>し</rt></ruby>んでしまいました。","rj":"Kinou, inu ga shinde shimaimashita.","say":"昨日、犬が死んでしまいました。"},{"en":"Yesterday, my dog passed away.","jp":"<ruby>昨日<rt>きのう</rt></ruby>、<ruby>犬<rt>いぬ</rt></ruby>が<ruby>死<rt>し</rt></ruby>んじゃった。","rj":"Kinou, inu ga shinjatta.","say":"昨日、犬が死んじゃった。"}]},{"num":229,"title":"〜と (Whenever A, B)","vocab":[{"t":"混む（こむ）","m":"komu 意思：擁擠、壅塞 (to be crowded)","say":"混む（こむ）"},{"t":"風邪をひく（かぜをひく）","m":"kaze o hiku 意思：感冒 (to catch a cold)","say":"風邪をひく（かぜをひく）"},{"t":"木（き）","m":"ki 意思：樹 (tree)","say":"木（き）"},{"t":"花（はな）","m":"hana 意思：花 (flower)","say":"花（はな）"},{"t":"咲く（さく）","m":"saku 意思：開花 (to bloom)","say":"咲く（さく）"},{"t":"話す（はなす）","m":"ha
