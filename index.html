 clean and spacious","jp":"あなたの<ruby>家<rt>いえ</rt></ruby>は<ruby>綺麗<rt>きれい</rt></ruby>で<ruby>広<rt>ひろ</rt></ruby>いです。","rj":"Anata no ie wa kireide hiroidesu.","say":"あなたの家は綺麗で広いです。"},{"en":"Takeshi is smart and tall.","jp":"たけしは<ruby>頭<rt>あたま</rt></ruby>がよくて<ruby>背<rt>せ</rt></ruby>が<ruby>高<rt>たか</rt></ruby>いです。","rj":"Takeshi wa atama ga yokute se ga takaidesu.","say":"たけしは頭がよくて背が高いです。"},{"en":"Kento's dog is a male and energetic.","jp":"けんとの<ruby>犬<rt>いぬ</rt></ruby>はオスで<ruby>元気<rt>げんき</rt></ruby>です。","rj":"Kento no inu wa osude genkidesu.","say":"けんとの犬はオスで元気です。"},{"en":"Mika likes animals and very kind.","jp":"みかは<ruby>動物<rt>どうぶつ</rt></ruby>が<ruby>好<rt>す</rt></ruby>きで<ruby>親切<rt>しんせつ</rt></ruby>です。","rj":"Mika wa doubutsu ga sukide shinsetsudesu.","say":"みかは動物が好きで親切です。"}]},{"num":107,"title":"Writing Practice","vocab":[],"grammar":["本單元是寫作練習題，每一題都先給一句英文句子和幾個提示單字（HINT），要求練習寫出對應的日文句子。7 題全部都在練習同一個句型：「動詞ます形（去掉ます）＋に＋行く／来る／帰る」，用來表達「為了做某事而去／來（某地）」，並依句意變化行く・来る的時態（現在/過去）與肯定/否定/疑問形。"],"example":[{"en":"Mary came to Japan to study Japanese.","jp":"メアリーは<ruby>日本<rt>にほん</rt></ruby>に<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しにきました。","rj":"Mearii wa nihon ni nihongo o benkyoushi ni kimashita.","say":"メアリーは日本に日本語を勉強しにきました。"},{"en":"I will go to Kai's house to borrow a book.","jp":"<ruby>私<rt>わたし</rt></ruby>はかいの<ruby>家<rt>いえ</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>を<ruby>借<rt>か</rt></ruby>りに<ruby>行<rt>い</rt></ruby>きます。","rj":"Watashi wa kai no ie ni hon o kari ni ikimasu.","say":"私はかいの家に本を借りに行きます。"},{"en":"I went to Tokyo to meet my father.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>東京<rt>とうきょう</rt></ruby>にお<ruby>父<rt>とう</rt></ruby>さんに<ruby>会<rt>あ</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きました。","rj":"Watashi wa Toukyou ni otousan ni ai ni ikimashita.","say":"私は東京にお父さんに会いに行きました。"},{"en":"I will not go to school to play basketball.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>にバスケットボールをしに<ruby>行<rt>い</rt></ruby>きません。","rj":"Watashi wa gakkou ni basukettobo-ru o shi ni ikimasen.","say":"私は学校にバスケットボールをしに行きません。"},{"en":"Did you come to the library to study?","jp":"<ruby>図書館<rt>としょかん</rt></ruby>に<ruby>勉強<rt>べんきょう</rt></ruby>しにきましたか？","rj":"Toshokan ni benkyoushi ni kimashitaka?","say":"図書館に勉強しにきましたか？"},{"en":"Kiko did not come to return the book.","jp":"きこは<ruby>本<rt>ほん</rt></ruby>を<ruby>返<rt>かえ</rt></ruby>しにきませんでした。","rj":"Kiko wa hon o kaeshi ni kimasendeshita.","say":"きこは本を返しにきませんでした。"},{"en":"Toma will come to my house to cook dinner.","jp":"とうまは<ruby>家<rt>いえ</rt></ruby>に<ruby>夜<rt>よる</rt></ruby>ごはんを<ruby>料理<rt>りょうり</rt></ruby>しにきます。","rj":"Touma wa ie ni yorugohan o ryourishi ni kimasu.","say":"とうまは家に夜ごはんを料理しにきます。"}]},{"num":108,"title":"Listening Practice","vocab":[],"grammar":[],"example":[{"en":"\"(1) Will Tae go eat food?\"","jp":"たえはご<ruby>飯<rt>ごはん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べに<ruby>行<rt>い</rt></ruby>きましたか？","rj":"Tae wa go gohan o tabeni ikimashitaka?","say":"たえはご飯を食べに行きましたか？"},{"en":"\"(1) Rino will go watch a movie.\"","jp":"りのは<ruby>映画<rt>えいが</rt></ruby>を<ruby>観<rt>み</rt></ruby>に<ruby>行<rt>い</rt></ruby>きません。","rj":"Ri no wa eiga o mini ikimasen.","say":"りのは映画を観に行きません。"},{"en":"\"(1) Kiho went to the cafe to see Tomo.\"","jp":"きほはカフェにともに<ruby>会<rt>あ</rt></ruby>いにきました。","rj":"Kiho wa kafenitomoni ainikimashita.","say":"きほはカフェにともに会いにきました。"},{"en":"\"(1) I will go to the library to study.\"","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>図書館<rt>としょかん</rt></ruby>に<ruby>勉強<rt>べんきょう</rt></ruby>しにきました。","rj":"Watashi wa toshokanni benkyoushinikimashita.","say":"私は図書館に勉強しにきました。"},{"en":"\"(2) Tomo went to USA to meet friends.\"","jp":"ともかはアメリカに<ruby>友達<rt>ともだち</rt></ruby>に<ruby>会<rt>あ</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きます。","rj":"Tomoka wa amerikani tomodachini aini ikimasu.","say":"ともかはアメリカに友達に会いに行きます。"},{"en":"\"(1) Yuri came to the park to take pictures.\"","jp":"ゆりは<ruby>公園<rt>こうえん</rt></ruby>に<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>りに<ruby>行<rt>い</rt></ruby>きませんでした。","rj":"Yuri wa kouenni shashin o torini ikimasen deshita.","say":"ゆりは公園に写真を撮りに行きませんでした。"},{"en":"\"(2) Toshi went to drink coffee.\"","jp":"としはコーヒーを<ruby>飲<rt>の</rt></ruby>みにきます。","rj":"Toshi wa ko-hi- o nominikimasu.","say":"としはコーヒーを飲みにきます。"}]}]};
const TABS=[{"key": "sen", "label": "例句"}, {"key": "num-time", "label": "數字・時間"}, {"key": "basic", "label": "基礎句型"}, {"key": "demo-q", "label": "指示詞・疑問詞"}, {"key": "particle", "label": "助詞"}, {"key": "verb-masu", "label": "動詞ます形・存在文"}, {"key": "te-form", "label": "て形"}, {"key": "adj", "label": "形容詞"}, {"key": "short-form", "label": "常體短形（普通形）"}, {"key": "advanced", "label": "比較・原因・進階句型"}, {"key": "practice", "label": "綜合練習"}];

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function plain(s){return (s||'').replace(/<rt>[^<]*<\/rt>/g,'').replace(/<[^>]+>/g,'')}

let jpVoiceCache = null;
function jpVoice(){
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return null;
  jpVoiceCache = vs.find(v=>v.lang==='ja-JP') || vs.find(v=>v.lang && v.lang.startsWith('ja')) || null;
  return jpVoiceCache;
}
let _utter = null; // keep a live reference - Chrome silently drops utterances that get garbage-collected
let playQueue = [];
let playIndex = 0;
let playBtnEl = null;

function speakOne(text, onDone){
  const u = new SpeechSynthesisUtterance(plain(text));
  _utter = u;
  u.lang = 'ja-JP';
  u.rate = parseFloat(document.getElementById('rate').value) || 0.85;
  const v = jpVoice(); if(v) u.voice = v;
  u.onerror = function(e){ console.error('TTS error:', e.error); if(onDone) onDone(); };
  u.onend = function(){ if(onDone) onDone(); };
  speechSynthesis.speak(u);
  setTimeout(()=>{ if(speechSynthesis.paused) speechSynthesis.resume(); }, 150);
}

function doSpeak(text){
  stopPlayback();
  const wasBusy = speechSynthesis.speaking || speechSynthesis.pending;
  speechSynthesis.cancel();
  if (wasBusy) {
    setTimeout(()=>speakOne(text, null), 120); // Chrome drops speak() called right after cancel() while busy
  } else {
    speakOne(text, null);
  }
}

function speak(text){
  if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀');return;}
  if(speechSynthesis.getVoices().length === 0){
    speechSynthesis.onvoiceschanged = function(){ doSpeak(text); };
    speechSynthesis.getVoices();
  } else {
    doSpeak(text);
  }
}

function playNext(){
  if(playIndex >= playQueue.length){
    if(playBtnEl){ playBtnEl.textContent = '▶ 播放全部例句'; playBtnEl = null; }
    return;
  }
  const text = playQueue[playIndex];
  speakOne(text, function(){
    playIndex++;
    if(playIndex >= playQueue.length){ playNext(); return; }
    setTimeout(playNext, 500); // 句間間隔 0.5 秒
  });
}

function stopPlayback(){
  playQueue = [];
  playIndex = 0;
  if(playBtnEl){ playBtnEl.textContent = '▶ 播放全部例句'; playBtnEl = null; }
}

function playAllExamples(num, btn){
  if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀');return;}
  if(playBtnEl === btn){ // toggle: clicking again stops
    speechSynthesis.cancel();
    stopPlayback();
    return;
  }
  const chapterEl = document.querySelector('.chapter[data-num="'+num+'"]');
  if(!chapterEl) return;
  const jps = [...chapterEl.querySelectorAll('.ecard [data-act="ex"]')]
               .map(b=>b.dataset.say).filter(Boolean);
  if(!jps.length){ alert('本課沒有例句可播放'); return; }
  speechSynthesis.cancel();
  playQueue = jps;
  playIndex = 0;
  playBtnEl = btn;
  btn.textContent = '■ 停止播放';
  const go = function(){ playNext(); };
  if(speechSynthesis.getVoices().length === 0){
    speechSynthesis.onvoiceschanged = go;
    speechSynthesis.getVoices();
  } else {
    go();
  }
}

if('speechSynthesis' in window){
  speechSynthesis.getVoices();
}

function renderChapter(c){
  let html = '<div class="chapter" data-num="'+c.num+'">';
  html += '<h2 data-act="toggle"><span><span class="num">'+c.num+'.</span>'+esc(c.title)+'</span><span class="car">▾</span></h2>';
  html += '<div class="body">';

  html += '<div class="section-label vocab">① 單字</div>';
  if(c.vocab.length){
    html += '<div class="vocab-grid">';
    for(const v of c.vocab){
      html += '<div class="vcard"><span class="term">'+v.t+'</span>'
            + (v.say ? '<button class="sp" data-act="voc" data-say="'+esc(plain(v.say))+'" title="朗讀">🔊</button>' : '')
            + (v.m ? '<div class="meaning">'+esc(v.m)+'</div>' : '')
            + '</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="empty-note">本課沒有獨立單字表</div>';
  }

  html += '<div class="section-label grammar">② 文法</div>';
  if(c.grammar.length){
    for(const g of c.grammar){
      html += '<div class="gcard">'+g+'</div>';
    }
  } else {
    html += '<div class="empty-note">本課沒有額外文法規則說明</div>';
  }

  html += '<div class="section-label example">③ 例句</div>';
  if(c.example.length){
    html += '<button class="sp playall" style="margin-left:8px;background:#c8892f;color:#fff;border:none;border-radius:999px;padding:4px 12px;font-size:.78rem;cursor:pointer" data-act="all" data-num="'+c.num+'">▶ 播放全部例句</button>';
  }
  if(c.example.length){
    for(const e of c.example){
      if(!e.jp) continue;
      html += '<div class="ecard">'
            + (e.en ? '<div class="en">"'+esc(e.en)+'"</div>' : '')
            + '<div class="jp">'+e.jp+'</div>'
            + (e.rj ? '<div class="rj">'+esc(e.rj)+'</div>' : '')
            + (e.say ? '<button class="sp" data-act="ex" data-say="'+esc(e.say)+'">🔊 朗讀例句</button>' : '')
            + '</div>';
    }
  } else {
    html += '<div class="empty-note">本課沒有獨立例句（內容併入文法說明中）</div>';
  }

  html += '</div></div>';
  return html;
}

// "sen" aggregates every chapter that has examples - built by reference so the
// page carries no duplicate data.
DATA['sen'] = Object.keys(DATA).filter(k=>k!=='sen')
  .reduce((acc,k)=>acc.concat(DATA[k]), [])
  .filter(c=>c.example.some(e=>e.jp))
  .sort((a,b)=>a.num-b.num);

function renderSentenceChapter(c){
  let html = '<div class="chapter" data-num="'+c.num+'">';
  html += '<h2 data-act="toggle"><span><span class="num">'+c.num+'.</span>'+esc(c.title)+'</span><span class="car">▾</span></h2>';
  html += '<div class="body">';
  for(const e of c.example){
    if(!e.jp) continue;
    html += '<div class="ecard">'
          + (e.en ? '<div class="en">"'+esc(e.en)+'"</div>' : '')
          + '<div class="jp">'+e.jp+'</div>'
          + (e.rj ? '<div class="rj">'+esc(e.rj)+'</div>' : '')
          + '</div>';
  }
  html += '</div></div>';
  return html;
}

let currentTab = TABS[0].key;

function renderTab(key){
  currentTab = key;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.key===key));
  const list = DATA[key] || [];
  const fn = (key === 'sen') ? renderSentenceChapter : renderChapter;
  document.getElementById('content').innerHTML = list.map(fn).join('');
  applySearch();
}

document.getElementById('tabbar').innerHTML = TABS.map(t=>
  '<button class="tab" data-key="'+t.key+'" onclick="renderTab(\''+t.key+'\')">'+esc(t.label)+'</button>'
).join('');

function applySearch(){
  const kw = document.getElementById('q').value.trim();
  document.querySelectorAll('.chapter').forEach(ch=>{
    if(!kw){ ch.classList.remove('hide'); ch.querySelectorAll('.vcard,.gcard,.ecard').forEach(x=>x.classList.remove('hide')); return; }
    let anyMatch = false;
    ch.querySelectorAll('.vcard,.gcard,.ecard').forEach(card=>{
      const match = card.textContent.includes(kw);
      card.classList.toggle('hide', !match);
      if(match) anyMatch = true;
    });
    ch.classList.toggle('hide', !anyMatch);
  });
}
document.getElementById('q').addEventListener('input', applySearch);

// Event delegation: never embed sentence text inside an onclick="" attribute -
// quotes in the text break the attribute and the handler silently dies.
document.getElementById('content').addEventListener('click', function(ev){
  const btn = ev.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  if(act === 'toggle'){
    btn.parentElement.classList.toggle('closed');
  } else if(act === 'voc'){
    if(btn.dataset.say) speak(btn.dataset.say);
  } else if(act === 'ex'){
    if(btn.dataset.say) speak(btn.dataset.say);
  } else if(act === 'all'){
    playAllExamples(btn.dataset.num, btn);
  }
});

renderTab(TABS[0].key);
</script>
