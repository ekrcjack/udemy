ay）"},{t:"<ruby>毎週<rt>まいしゅう</rt></ruby>",m:"讀音：まいしゅう 羅馬字：maishuu 意思：每週、every week （毎＝every，週＝week）"},{t:"<ruby>毎月<rt>まいつき</rt></ruby>",m:"讀音：まいつき 羅馬字：maitsuki 意思：每月、every month （毎＝every，月＝month）"},{t:"<ruby>毎年<rt>まいとし</rt></ruby>",m:"讀音：まいとし 羅馬字：maitoshi 意思：每年、every year （毎＝every，年＝year）"}],grammar:["<b>頻度副詞（Frequency Adverbs）在句子中的位置規則？</b><br><br>可以在句子中加入<b>頻度副詞</b>，說明做某件事的頻率高低。<br><br>※ 頻度副詞通常緊接在<b>は</b>的後面。","<b>いつも</b>（itsumo）— Always（最高，100%）  <br><b>たいてい</b>（taitei）— Usually  <br><b>よく</b>（yoku）— Often  <br><b>時々／たまに</b>（tokidoki／tamani）— Sometimes  <br><b>あまり</b>（amari）— Not much（需搭配否定）  <br><b>全然</b>（zenzen）— Never, at all（最低，0%，需搭配否定）<br><br>規則：  <br>・頻度副詞通常放在は之後  <br>・使用あまり／ぜんぜん時，句尾一定要以否定形結束"],example:[{en:null,jp:"<ruby>私<rt>わたし</rt></ruby>はぜんぜんテレビを<ruby>見<rt>み</rt></ruby>ません。",zh:null},{en:"twice a week",jp:"週に2回（しゅうににかい／shuu ni ni kai）＝ twice a week",zh:"例："},{en:null,jp:"たけしさんはあまり<ruby>勉強<rt>べんきょう</rt></ruby>しません。",zh:null},{en:null,jp:"<ruby>私<rt>わたし</rt></ruby>はぜんぜんテレビを<ruby>見<rt>み</rt></ruby>ません。",zh:null}]},{num:110,title:"たくさん",vocab:[],grammar:["<b>「たくさん」放在助詞「を」之後：我拍了很多照片。</b><br><br><ruby>写真<rt>しゃしん</rt></ruby>を<b>たくさん</b><ruby>撮<rt>と</rt></ruby>りました。  <br>(shashin o takusan torimashita.)  <br>“I took many pictures.”","<b>「たくさん」放在名詞前面：我拍了很多照片。</b>","<b>たくさん</b><ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>りました。  <br>(takusan shashin o torimashita.)  <br>“I took many pictures.”","<b>「たくさん」放在助詞「を」之後：我吃了很多蔬菜。</b><br><br><ruby>野菜<rt>やさい</rt></ruby>を<b>たくさん</b><ruby>食<rt>た</rt></ruby>べました。  <br>(yasai o takusan tabemashita.)  <br>“I ate a lot of vegetables.”","<b>「たくさん」放在名詞前面：我吃了很多蔬菜。</b>","<b>たくさん</b><ruby>野菜<rt>やさい</rt></ruby>を<ruby>食<rt>た</rt></ruby>べました。  <br>(takusan yasai o tabemashita.)  <br>“I ate a lot of vegetables.”","<b>「たくさん」放在名詞前面：我在公園看到很多人。</b><br><br><ruby>公園<rt>こうえん</rt></ruby>で<b>たくさん</b><ruby>人<rt>ひと</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。  <br>(kouen de takusan hito o mimashita.)  <br>“I saw a lot of people at the park.”","<b>「たくさん」放在助詞「を」之後：我在公園看到很多人。</b><br><br><ruby>公園<rt>こうえん</rt></ruby>で<ruby>人<rt>ひと</rt></ruby>を<b>たくさん</b><ruby>見<rt>み</rt></ruby>ました。  <br>(kouen de hito o takusan mimashita.)  <br>“I saw a lot of people at the park.”","<b>「たくさん」放在名詞前面：我星期日看了很多電影。</b><br><br><ruby>日曜日<rt>にちようび</rt></ruby><b>たくさん</b><ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。  <br>(nichiyoubi takusan eiga o mimashita.)  <br>“I watched a lot of movies on Sunday.”","<b>「たくさん」放在助詞「を」之後：我星期日看了很多電影。</b><br><br><ruby>日曜日<rt>にちようび</rt></ruby><ruby>映画<rt>えいが</rt></ruby>を<b>たくさん</b><ruby>見<rt>み</rt></ruby>ました。  <br>(nichiyoubi eiga o takusan mimashita.)  <br>“I watched a lot of movies on Sunday.”","<b>總結：「たくさん」的兩種放置方式，對照四個例句分別怎麼說？</b><br><br><b>名詞前</b> vs <b>を之後</b>：<br><br>1. 照片：たくさん<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>りました。／<ruby>写真<rt>しゃしん</rt></ruby>をたくさん<ruby>撮<rt>と</rt></ruby>りました。（我拍了很多照片。）<br>2. 蔬菜：たくさん<ruby>野菜<rt>やさい</rt></ruby>を<ruby>食<rt>た</rt></ruby>べました。／<ruby>野菜<rt>やさい</rt></ruby>をたくさん<ruby>食<rt>た</rt></ruby>べました。（我吃了很多蔬菜。）<br>3. 公園的人：<ruby>公園<rt>こうえん</rt></ruby>でたくさん<ruby>人<rt>ひと</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。／<ruby>公園<rt>こうえん</rt></ruby>で<ruby>人<rt>ひと</rt></ruby>をたくさん<ruby>見<rt>み</rt></ruby>ました。（我在公園看到很多人。）<br>4. 電影：<ruby>日曜日<rt>にちようび</rt></ruby>たくさん<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。／<ruby>日曜日<rt>にちようび</rt></ruby><ruby>映画<rt>えいが</rt></ruby>をたくさん<ruby>見<rt>み</rt></ruby>ました。（我星期日看了很多電影。）<br><br>規則：たくさん可放在名詞前，或放在助詞「を」之後，意思不變。"],example:[{en:null,jp:"<ruby>写真<rt>しゃしん</rt></ruby>をたくさん<ruby>撮<rt>と</rt></ruby>りました。＝たくさん<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>りました。",zh:"「我拍了很多照片。」"}]},{num:112,title:"1時間",vocab:[{t:"Second（時間單位）",m:"秒 （びょう - byou）"},{t:"Minute（時間單位）",m:"分 （ふん - fun）"},{t:"Time, hour（時間單位）",m:"時間 （じかん - jikan）"},{t:"Day（時間單位）",m:"日 （にち - nichi）"},{t:"Week（時間單位）",m:"週 （しゅう - shuu）"},{t:"Month（時間單位）",m:"月 （つき - tsuki）"},{t:"Year（時間單位）",m:"年 （ねん - nen）"},{t:"「---秒（鐘）」怎麼說？",m:"--- 秒間 （びょうかん - byoukan）"},{t:"「---小時」怎麼說？",m:"--- 時間 （じかん - jikan）"},{t:"「---天」怎麼說？",m:"--- 日間 （にちかん - nichikan）"},{t:"「---週」怎麼說？",m:"--- 週間 （しゅうかん - shuukan）"},{t:"「---個月」怎麼說？",m:"--- ヶ月間 （かげつかん - kagetsukan）"},{t:"「---年」怎麼說？",m:"--- 年間 （ねんかん - nenkan）"},{t:"如何表示大約的時間長度？",m:"在～間（かん - kan）後面加上ぐらい（gurai），即可表示大約的時間長度。"}],grammar:["**「---分（鐘）」怎麼說？  <br>（注意：讀法會依前面數字產生音變）**<br><br>--- 分間  <br>ふんかん funkan / ぷんかん punkan / っぷんかん ppunkan","**Mary waited for Takeshi for an hour.  <br>（瑪莉等了武志一小時。）**<br><br>メアリーは たけしを 1<ruby>時間<rt>いちじかん</rt></ruby> <ruby>待<rt>ま</rt></ruby>ちました。  <br>Mary wa Takeshi o ichijikan machimashita.<br><br>※ 時間長度不加助詞，且緊接在動詞前。","**Mary waited for Takeshi for about an hour.  <br>（瑪莉等了武志大約一小時。）**<br><br>メアリーは たけしを 1<ruby>時間<rt>いちじかん</rt></ruby>ぐらい <ruby>待<rt>ま</rt></ruby>ちました。  <br>Mary wa Takeshi o ichijikan gurai machimashita.","**Takeshi ran for 30 minutes at the park.  <br>提示：走る（はしる - hashiru）= to run；公園（こうえん - kouen）= park**<br><br>たけしは <ruby>公園<rt>こうえん</rt></ruby>で 30<ruby>分間<rt>さんじゅっぷんかん</rt></ruby> <ruby>走<rt>はし</rt></ruby>りました。  <br>Takeshi wa kouen de sanjuppun kan hashirimashita.","**I slept for about 8 hours last night.  <br>提示：寝る（ねる - neru）= to sleep；昨晩（さくばん - sakuban）= last night**<br><br>わたしは <ruby>昨晩<rt>さくばん</rt></ruby> 8<ruby>時間<rt>はちじかん</rt></ruby> <ruby>寝<rt>ね</rt></ruby>ました。  <br>Watashi wa sakuban hachijikan nemashita.","**I read the book for 4 hours on Saturday.  <br>提示：読む（よむ - yomu）= to read；本（ほん - hon）= book；土曜日（どようび - doyoubi）= Saturday**<br><br><ruby>土曜日<rt>どようび</rt></ruby> <ruby>本<rt>ほん</rt></ruby>を 4<ruby>時間<rt>よじかん</rt></ruby> <ruby>読<rt>よ</rt></ruby>みました。  <br>Doyoubi hon o yojikan yomimashita."],example:[{en:null,jp:"1時間）**",zh:null}]}],"basic":[{num:26,title:"XはYです",vocab:[{t:"「我」和「我們」的日文怎麼說？",m:"私（わたし・watashi） - 我 私達（わたしたち・watashitachi） - 我們"},{t:"「你」和「你們」的日文怎麼說？",m:"あなた（anata） - 你 あなた達（あなたたち・anatatachi） - 你們"},{t:"「他」和「他們」的日文怎麼說？",m:"彼（かれ・kare） - 他 彼達（かれたち・karetachi）或 彼ら（かれら・karera） - 他們"}],grammar:["<b>「她」和「她們」的日文怎麼說？</b><br><br>彼女（かのじょ・kanojo） - 她  <br>彼女達（かのじょたち・kanojotachi）或 彼女ら（かのじょら・kanojora） - 她們","<b>整理：「XはYです。」句型的重點規則有哪些？</b><br><br><b>XはYです。</b> means <b>X is Y.</b><br><br>1. 「は」作助詞時讀作 <b>WA</b>，不是 HA。<br>2. 「です。」用於<b>現在時態</b>。<br>3. 「でした。」用於<b>過去時態</b>，取代「です。」"],example:[{en:null,jp:"<ruby>私<rt>わたし</rt></ruby>は <ruby>日本人<rt>にほんじん</rt></ruby>です。",zh:null},{en:null,jp:"あなた**は**（wa）<ruby>学生<rt>がくせい</rt></ruby>です。→ 你是學生。",zh:null},{en:null,jp:"<ruby>今日<rt>きょう</rt></ruby>は <ruby>月曜日<rt>げつようび</rt></ruby>です。→ 今天是星期一。",zh:null},{en:null,jp:"<ruby>昨日<rt>きのう</rt></ruby>は <ruby>日曜日<rt>にちようび</rt></ruby>でした。→ 昨天是星期日。",zh:null},{en:null,jp:"**請用日文翻譯：「我是日本人。」（I am Japanese.）**",zh:null},{en:null,jp:"**請用日文翻譯：「你是學生。」（You are a student.）**",zh:null},{en:null,jp:"**請用日文翻譯：「昨天是星期日。」（Yesterday was Sunday.）**",zh:null},{en:null,jp:"**請用日文翻譯：「晚餐是壽司。」（Dinner was Sushi.）**",zh:null},{en:null,jp:"**請用日文翻譯：「我的生日是昨天。」（My birthday was yesterday.）**",zh:null},{en:null,jp:"**請用日文翻譯：「我媽媽是醫生。」（My mother was a doctor.）**",zh:null},{en:null,jp:"**請用日文翻譯：「今天是星期一。」（Today is Monday.）**",zh:null}]},{num:27,title:"Question",vocab:[{t:"<ruby>學生<rt>がくせい</rt></ruby>的日文？",m:"学生（がくせい / gakusei） Student"},{t:"<ruby>今天<rt>きょう</rt></ruby>的日文？",m:"今日（きょう / kyou） Today"},{t:"<ruby>昨天<rt>きのう</rt></ruby>的日文？",m:"昨日（きのう / kinou） Yesterday"},{t:"<ruby>老師<rt>せんせい</rt></ruby>的日文？",m:"先生（せんせい / sensei） Teacher"},{t:"<ruby>晚餐<rt>よるごはん</rt></ruby>的日文？",m:"夜ご飯（よるごはん / yorugohan） Dinner"},{t:"<ruby>名字<rt>なまえ</rt></ruby>的日文？",m:"名前（なまえ / namae） Name"},{t:"<ruby>生日<rt>たんじょうび</rt></ruby>的日文？",m:"誕生日（たんじょうび / tanjoubi） Birthday"},{t:"<ruby>醫生<rt>いしゃ</rt></ruby>的日文？",m:"医者（いしゃ / isha） Doctor"},{t:"例句：",m:"肯定句：今日（きょう）は月曜日（げつようび）です。 （Today is Monday.) 疑問句：今日は月曜日ですか？ （Is today Monday?） 再舉一例： 肯定句：あなたは日本人です。(You are Japanese.) 疑問句：あなたは日本人ですか？（Are you Japanese?）"},{t:"例句：",m:"昨日（きのう）は日曜日（にちようび）でしたか？ （Was yesterday Sunday?） 夜ご飯（よるごはん）は寿司（すし）でしたか？ （Was dinner sushi?）"},{t:"正式（Formal）",m:"はい (hai) - Yes いいえ (iie) - No"},{t:"口語（Casual）",m:"うん (un) - Yes ううん (uun) - No"},{t:"請把以下句子翻成日文疑問句：",m:"“Are you a student?” あなた　は　学生（がくせい）ですか？ anata wa gakusei desu ka? （肯定句：あなたは学生です。You are a student.　+　か？）"},{t:"請把以下句子翻成日文疑問句：",m:"“Was yesterday Sunday?” 昨日（きのう）　は　日曜日（にちようび）　でしたか？ kinou wa nichiyoubi deshita ka?"},{t:"請把以下句子翻成日文疑問句：",m:"“Was dinner sushi?” 夜ご飯（よるごはん）　は　寿司（すし）　でしたか？ yorugohan wa sushi deshita ka?"},{t:"請把以下句子翻成日文疑問句：",m:"“Is today Tuesday?” 今日（きょう）　は　火曜日（かようび）　ですか？ kyou wa kayoubi desu ka?"},{t:"請把以下句子翻成日文疑問句：",m:"“Is your name Miho?” あなた　の　名前（なまえ）　は　みほ　ですか？ anata no namae wa miho desu ka?"},{t:"請把以下句子翻成日文疑問句：",m:"“Was your birthday yesterday?” あなた　の　誕生日（たんじょうび）　は　昨日（きのう）　でしたか？ anata no tanjoubi wa kinou deshita ka?"},{t:"請把以下句子翻成日文疑問句：",m:"“Was your mother a doctor?” あなた　の　お母（かあ）さん　は　医者（いしゃ）　でしたか？ anata no okaasan wa isha deshita ka?"}],grammar:["<b>日文的疑問句（question sentence）怎麼構成？</b><br><br><b>三個步驟：</b>  <br>(Step 1) 先造出肯定句 (affirmative sentence)  <br>(Step 2) 把肯定句翻成日文  <br>(Step 3) 在句尾加上 <b>か</b>（question particle）","<b>日文疑問句的</b>過去式<b>怎麼構成？（です→でした）</b><br><br>現在肯定句用「です」，過去肯定句要改成「<b>でした</b>」，再加上「か」變成過去疑問句。","<b>在日文中，怎麼回答一個問題（Yes / No）？分「正式」和「口語」兩種說法。</b>"],example:[]},{num:28,title:"Question 2",vocab:[{t:"疑問詞：What",m:"何（なに / nani）"},{t:"疑問詞：Who",m:"誰（だれ / dare）"},{t:"疑問詞：Where",m:"どこ（doko）"},{t:"疑問詞：When",m:"いつ（itsu）"},{t:"\"When is the party?\"",m:"パーティー（ぱーてぃー）はいつですか？ pa-ti- wa itsu desuka?"}],grammar:["<b>注意</b>: 句中包含 <ruby>何<rt>なに</rt></ruby>／<ruby>誰<rt>だれ</rt></ruby>／どこ／いつ 等疑問詞時，要特別注意語順 (word order)。"],example:[{en:null,jp:"\"What is your name?\" → \"Your name is what?\" → あなたの名前はなんですか？",zh:null},{en:null,jp:"あなたの家はどこです**か**？(Where is your house?)",zh:null},{en:"What is your name?",jp:"あなたの名前はなんですか？",zh:null},{en:"Where is your house?",jp:"あなたの<ruby>家<rt>いえ</rt></ruby>はどこですか？",zh:null},{en:"Who is your teacher?",jp:"あなたの<ruby>先生<rt>せんせい</rt></ruby>は<ruby>誰<rt>だれ</rt></ruby>ですか？",zh:null},{en:"When is your birthday?",jp:"あなたの<ruby>誕生日<rt>たんじょうび</rt></ruby>はいつですか？",zh:null},{en:"What is your favourite food?",jp:"あなたの好きな食べ物はなんですか？",zh:null},{en:"Where is your school?",jp:"あなたの<ruby>学校<rt>がっこう</rt></ruby>はどこですか？",zh:null},{en:"Who is your favourite singer?",jp:"あなたの好きな<ruby>歌手<rt>かしゅ</rt></ruby>は<ruby>誰<rt>だれ</rt></ruby>ですか？",zh:null}]},{num:29,title:"Noun1 の Noun2",vocab:[{t:"お母さん",m:"おかあさん（okaasan） 媽媽 / Mother"},{t:"お父さん",m:"おとうさん（otousan） 爸爸 / Father"},{t:"姉 ／ お姉ちゃん",m:"あね（ane）／ おねえちゃん（oneechan） 姊姊 / Older sister"},{t:"妹",m:"いもうと（imouto） 妹妹 / Little sister"},{t:"兄 ／ お兄ちゃん",m:"あに（ani）／ おにいちゃん（oniichan） 哥哥 / Older brother"},{t:"弟",m:"おとうと（otouto） 弟弟 / Little brother"}],grammar:["<b>西班牙（Spain）的國名、國籍、語言日文怎麼說？</b><br><br>國名：スペイン（すぺいん-supein）  <br>國籍：スペイン人（すぺいんじん-supeinjin）  <br>語言：スペイン語（すぺいんご-supeingo）","<b>美國（America）的國名、國籍、語言日文怎麼說？（注意語言的例外）</b><br><br>國名：アメリカ（あめりか-amerika）  <br>國籍：アメリカ人（あめりかじん-amerikajin）  <br>語言：<b>英語（えいご-eigo）</b>　※不是「アメリカ語」","<b>為什麼「英文」的日文說法是「英語」而不是「〇〇語」？</b><br><br><b>英語（えいご-eigo）是特例</b>，不含國家名稱，通用於以英語為官方語言的國家，例如：  <br>アメリカ（美國）、イギリス（英國）、オーストラリア（澳洲）、カナダ（加拿大）、ニュージーランド（紐西蘭）、アイルランド（愛爾蘭）、南アフリカ（南非）等","<b>中國（China）的國名、國籍、語言日文怎麼說？</b><br><br>國名：中国（ちゅうごく-chuugoku）  <br>國籍：中国人（ちゅうごくじん-chuugokujin）  <br>語言：中国語（ちゅうごくご-chuugokugo）","<b>德國（Germany）的國名、國籍、語言日文怎麼說？</b><br><br>國名：ドイツ（どいつ-doitsu）  <br>國籍：ドイツ人（どいつじん-doitsujin）  <br>語言：ドイツ語（どいつご-doitsugo）","<b>澳洲（Australia）的國名、國籍、語言日文怎麼說？（注意語言的例外）</b><br><br>國名：オーストラリア（おーすとらりあ-oosutoraria）  <br>國籍：オーストラリア人（おーすとらりあじん-oosutorariajin）  <br>語言：<b>英語（えいご-eigo）</b>　※澳洲官方語言是英語，不是「オーストラリア語」","<b>「アメリカ人の学生」是什麼意思？</b><br><br>アメリカ人（あめりかじん-amerikajin）＝美國人  <br>の＝的  <br>学生（がくせい-gakusei）＝學生  <br>＝<b>美國學生 / American student</b>","<b>「たけしの弟」是什麼意思？</b><br><br>たけし（人名）＋の＋弟（おとうと-otouto）  <br>＝<b>Takeshi的弟弟 / Takeshi&#x27;s little brother</b>","<b>「あなたの電話番号」是什麼意思？</b><br><br>あなた（you）＋の＋電話番号（でんわばんごう-denwabangou）  <br>＝<b>你的電話號碼 / Your phone number</b>","<b>如何用「の」表達「西班牙語老師（Spanish-language teacher）」？</b><br><br>Noun1：スペイン語（すぺいんご-supeingo）＝西班牙語  <br>Noun2：先生（せんせい-sensei）＝老師<br><br>＝<b>スペイン語の先生</b>（Spanish-language teacher）","<b>如何用「の」串連三個名詞表達「我的暑假計畫（My summer vacation plan）」？</b><br><br>Noun1：私（わたし-watashi）→ 私の＝我的  <br>Noun2：夏休み（なつやすみ-natsuyasumi）＝暑假  <br>Noun3：予定（よてい-yotei）＝計畫<br><br>＝<b><ruby>私<rt>わたし</rt></ruby>の 夏休み（なつやすみ）の <ruby>予定<rt>よてい</rt></ruby></b>  <br>（「の」可以連續使用，將多個名詞串連起來）","<b>【總結】日文如何用國家名稱造出國籍和語言？</b><br><br><b>國家名稱 + 人（じん-jin） = 國籍（Nationality）</b>  <br><b>國家名稱 + 語（ご-go） = 語言（Language）</b><br><br>※例外：英語（えいご-eigo）不含國家名稱，用於英語系國家","<b>【總結】助詞「の」的用法是什麼？</b><br><br>「の（no）」是<b>日文所有格助詞</b>，可以把「の」前面的名詞變成修飾語（modifier），修飾後面的名詞。<br><br>句型：<b>Noun1 の Noun2</b>（Noun1 的 Noun2）  <br>可連續使用多個「の」串連名詞：Noun1 の Noun2 の Noun3 ..."],example:[{en:null,jp:"日本（にほん-nihon）",zh:null},{en:null,jp:"<ruby>私<rt>わたし</rt></ruby>の お<ruby>母<rt>かあ</rt></ruby>さん",zh:null}]},{num:30,title:"Nounも",vocab:[{t:"<ruby>学生<rt>がくせい</rt></ruby>",m:"gakusei Student（學生）"},{t:"<ruby>小学生<rt>しょうがくせい</rt></ruby>",m:"shougakusei Elementary school student（小學生）"},{t:"<ruby>中学生<rt>ちゅうがくせい</rt></ruby>",m:"chuugakusei Middle school student（中學生）"},{t:"<ruby>高校生<rt>こうこうせい</rt></ruby>",m:"koukousei High school student（高中生）"},{t:"<ruby>大学生<rt>だいがくせい</rt></ruby>",m:"daigakusei University student（大學生）"},{t:"<ruby>留学生<rt>りゅうがくせい</rt></ruby>",m:"ryuugakusei International student（留學生）"}],grammar:["<b>文法規則：助詞「も」在此的意思是什麼？</b><br><br>「も」表示 <b>「也/一樣」(too / as well)</b>。<br><br>比較：  <br><ruby>私<rt>わたし</rt></ruby>は<ruby>日本人<rt>にほんじん</rt></ruby>です。  <br>watashi wa nihonjin desu.  <br>→ 我是日本人。<br><br><ruby>私<rt>わたし</rt></ruby><b>も</b><ruby>日本人<rt>にほんじん</rt></ruby>です。  <br>watashi <b>mo</b> nihonjin desu.  <br>→ 我<b>也</b>是日本人。","<b>如何用「は→も」的替換法，表達「我也是留學生。」（I am an international student too.）</b><br><br>Step 1：先用「は」造句  <br><ruby>私<rt>わたし</rt></ruby>は<ruby>留学生<rt>りゅうがくせい</rt></ruby>です。  <br>watashi wa ryuugakusei desu.<br><br>Step 2：把「は」換成「も」  <br><ruby>私<rt>わたし</rt></ruby><b>も</b><ruby>留学生<rt>りゅうがくせい</rt></ruby>です。  <br>watashi <b>mo</b> ryuugakusei desu.","<b>[現在肯定] 如何用「は→も」的替換法，表達「Satoshi也是學生。」（Satoshi is also a student.）</b><br><br>Step 1：さとしは<ruby>学生<rt>がくせい</rt></ruby>です。  <br>satoshi wa gakusei desu.<br><br>Step 2（は→も）：さとし<b>も</b><ruby>学生<rt>がくせい</rt></ruby>です。  <br>satoshi <b>mo</b> gakusei desu.","<b>[過去肯定] 如何用「は→も」的替換法，表達「Satoshi以前也是學生。」（Satoshi was also a student.）</b><br><br>Step 1：さとしは<ruby>学生<rt>がくせい</rt></ruby>でした。  <br>satoshi wa gakusei deshita.<br><br>Step 2（は→も）：さとし<b>も</b><ruby>学生<rt>がくせい</rt></ruby>でした。  <br>satoshi <b>mo</b> gakusei deshita.","<b>[現在疑問] 如何用「は→も」的替換法，表達「Satoshi也是學生嗎？」（Is Satoshi also a student?）</b><br><br>Step 1：さとしは<ruby>学生<rt>がくせい</rt></ruby>ですか？  <br>satoshi wa gakusei desuka?<br><br>Step 2（は→も）：さとし<b>も</b><ruby>学生<rt>がくせい</rt></ruby>ですか？  <br>satoshi <b>mo</b> gakusei desuka?","<b>[過去疑問] 如何用「は→も」的替換法，表達「Satoshi以前也是學生嗎？」（Was Satoshi also a student?）</b><br><br>Step 1：さとしは<ruby>学生<rt>がくせい</rt></ruby>でしたか？  <br>satoshi wa gakusei deshitaka?<br><br>Step 2（は→も）：さとし<b>も</b><ruby>学生<rt>がくせい</rt></ruby>でしたか？  <br>satoshi <b>mo</b> gakusei deshitaka?","<b>「Noun も」四種時態總表（以さとしも学生為例）：現在肯定／過去肯定／現在疑問／過去疑問，各怎麼說？</b><br><br>現在肯定：さとし<b>も</b><ruby>学生<rt>がくせい</rt></ruby>です。  <br>satoshi mo gakusei desu.<br><br>過去肯定：さとし<b>も</b><ruby>学生<rt>がくせい</rt></ruby>でした。  <br>satoshi mo gakusei deshita.<br><br>現在疑問：さとし<b>も</b><ruby>学生<rt>がくせい</rt></ruby>ですか？  <br>satoshi mo gakusei desuka?<br><br>過去疑問：さとし<b>も</b><ruby>学生<rt>がくせい</rt></ruby>でしたか？  <br>satoshi mo gakusei deshitaka?"],example:[{en:null,jp:"**請用日文表達：「我媽媽也是42歲。」（My mother is 42 years old too.）**",zh:null},{en:null,jp:"**請用日文表達：「美穗的弟弟也是高中生。」（Miho's younger brother is a high school student too.）**",zh:null},{en:null,jp:"**請用日文表達：「小月也是日語老師。」（Satsuki is a Japanese-language teacher too.）**",zh:null}]},{num:31,title:"Negative sentences - Present",vocab:[{t:"警察官 是什麼意思？怎麼念？",m:"けいさつかん (keisatsukan) 意思：Police officer（警察）"},{t:"明日 是什麼意思？怎麼念？",m:"あした (ashita) 意思：Tomorrow（明天）"},{t:"わたしは<ruby>学生<rt>がくせい</rt></ruby>じゃありません。",m:"Watashi wa gakusei jaarimasen. X＝わたし(I)　は＝主題助詞　Y＝学生(Student) 也可說成：がくせいじゃないです。"}],grammar:["<b>日文現在否定句的基本句型是什麼？(X は Y \\_\\_\\_。)</b>","<b>X は Y じゃありません。</b> (wa ... jaarimasen)  <br><b>X は Y じゃないです。</b> (wa ... janaidesu)<br><br>兩種說法意思相同，都表示 <b>X is not Y（X 不是 Y）</b>。","<b>請把「私は日本人です。」改成否定句：I am not Japanese.</b><br><br>Step 1 肯定句：<ruby>私<rt>わたし</rt></ruby>は<ruby>日本人<rt>にほんじん</rt></ruby>です。  <br>Step 2 把「です」換成「じゃありません」：  <br><b>私は日本人じゃありません。</b>(watashi wa nihonjin jaarimasen)","<b>たけしは15<ruby>歳<rt>じゅうごさい</rt></ruby>じゃありません。</b>  <br>Takeshi wa juugosai jaarimasen.<br><br>X＝たけし(Takeshi)　は＝主題助詞　Y＝15歳（15歲）  <br>也可說成：じゅうごさい<b>じゃないです</b>。","<b><ruby>明日<rt>あした</rt></ruby>は<ruby>土曜日<rt>どようび</rt></ruby>じゃありません。</b>  <br>Ashita wa doyoubi jaarimasen.<br><br>X＝明日(Tomorrow)　は＝主題助詞　Y＝土曜日(Saturday)  <br>也可說成：どようび<b>じゃないです</b>。","<b>請把「たけしは19歳です。」改成否定句：Takeshi is not 19 years old.</b><br><br>Step 1 肯定句：たけしは19<ruby>歳<rt>じゅうきゅうさい</rt></ruby>です。  <br>Step 2 把「です」換成「じゃありません」：  <br><b>たけしは19<ruby>歳<rt>じゅうきゅうさい</rt></ruby>じゃありません。</b>(takeshi wa juukyuusai jaarimasen)","<b>請把「わたしのお父さんは警察官です。」改成否定句：My father is not a police officer.</b><br><br>Step 1 肯定句：わたしのお父さん（おとうさん）は<ruby>警察官<rt>けいさつかん</rt></ruby>です。  <br>Step 2 把「です」換成「じゃありません」：  <br><b>わたしのお父さんは警察官じゃありません。</b>(watashi no otousan wa keisatsukan jaarimasen)","<b>總結：日文「現在否定」的兩種句型？</b><br><br><b>X は Y じゃありません。</b>(wa ... jaarimasen)  <br><b>X は Y じゃないです。</b>(wa ... janaidesu)<br><br>兩者意思相同 = <b>X is not Y</b>。可依個人習慣任選一種使用。"],example:[{en:null,jp:"<ruby>私<rt>わたし</rt></ruby>は<ruby>日本人<rt>にほんじん</rt></ruby>です。→ 否定？**",zh:null},{en:null,jp:"**請用日文說：「Takeshi is not 15 years old.」**",zh:null},{en:null,jp:"**請用日文說：「Tomorrow is not Saturday.」**",zh:null},{en:null,jp:"**請用日文說：「I am not a student.」**",zh:null}]},{num:32,title:"Negative sentences - Past",vocab:[{t:"セール（せーる）是什麼意思？",m:"se-ru Sale（特賣）"},{t:"<ruby>夢<rt>ゆめ</rt></ruby>是什麼意思？",m:"yume Dream（夢想）"},{t:"<ruby>歌手<rt>かしゅ</rt></ruby>是什麼意思？",m:"kashu Singer（歌手）"}],grammar:["<b>日文如何表達「X（過去）不是Y」（X was not Y）？</b><br><br>X は Y <b>じゃありませんでした</b>。  <br>(wa ... jaarimasendeshita)<br><br>X は Y <b>じゃなかったです</b>。  <br>(wa ... janakattadesu)<br><br>兩種說法意思相同，都表示「X 過去不是 Y」。","<b>如何把肯定句「<ruby>私<rt>わたし</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>でした」（我以前是學生）改成過去否定句「我以前不是學生」？</b><br><br><b>Step1</b> 先造肯定句：  <br>私は学生でした。  <br>(watashi wa gakusei deshita)<br><br><b>Step2</b> 把「でした」換成「じゃありませんでした」或「じゃなかったです」：  <br>私は学生じゃありませんでした。  <br>(watashi wa gakusei jaarimasendeshita)  <br>＝私は学生じゃなかったです。  <br>(watashi wa gakusei janakattadesu)","<b>如何用日文表達「たけし以前不是19歳」（Takeshi was not 19 years old.）？</b><br><br><b>Step1</b> 肯定句：たけしは19<ruby>歳<rt>じゅうきゅうさい</rt></ruby>でした。  <br>(takeshi wa juukyuusai deshita)<br><br><b>Step2</b> 否定句：たけしは19歳じゃありませんでした。  <br>(takeshi wa juukyuusai jaarimasendeshita)","<b>如何用日文表達「我父親以前不是警察」（My father was not a police officer.）？</b><br><br><b>Step1</b> 肯定句：わたしのお父さん（おとうさん）は<ruby>警察官<rt>けいさつかん</rt></ruby>でした。  <br>(watashi no otousan wa keisatsukan deshita)<br><br><b>Step2</b> 否定句：わたしのお父さんは警察官じゃありませんでした。  <br>(watashi no otousan wa keisatsukan jaarimasendeshita)"],example:[{en:null,jp:"**請用日文表達：「昨天不是特賣」（Yesterday was not sale.）**",zh:null},{en:null,jp:"**請用日文表達：「我的夢想以前不是當歌手」（My dream was not (to be) a singer.）**",zh:null},{en:null,jp:"**請用日文表達：「鈴木先生以前不是老師」（Mr. Suzuki was not a teacher.）**",zh:null}]},{num:41,title:"Writing Practice",vocab:[],grammar:["**(Pointing at a car in front of you.)  <br>\"This is my car.\"**<br><br>これは<b><ruby>私<rt>わたし</rt></ruby></b>の<ruby>車<rt>くるま</rt></ruby>です。  <br>kore wa watashi no kuruma desu.","**(Pointing at a thing near the listener.)  <br>\"Is that your phone?\"**<br><br>それはあなたの<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>ですか?  <br>sore wa anata no keitaidenwa desuka?","**(Pointing at a thing in front of you.)  <br>\"This phone is not mine.\" (casual)**<br><br>この<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>は<b><ruby>私<rt>わたし</rt></ruby>の</b>じゃないです。  <br>kono keitaidenwa wa watashino janaidesu.","**(Pointing at a thing in front of you.)  <br>\"This phone is not mine.\" (polite)**<br><br>この<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>は<b><ruby>私<rt>わたし</rt></ruby>の</b>じゃありません。  <br>kono keitaidenwa wa watashino jaarimasen."],example:[{en:"Your phone is here!",jp:"あなたの<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>は**ここ**です!",zh:null},{en:"Whose T-shirts is this?",jp:"これは**<ruby>誰<rt>だれ</rt></ruby>の**Tシャツ(しゃつ)ですか?",zh:null},{en:"Where is your house?",jp:"あなたの<ruby>家<rt>いえ</rt></ruby>は**どこ**ですか?",zh:null},{en:"That is my house.",jp:"あれは<ruby>私<rt>わたし</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>です。",zh:null},{en:"Is your school there?",jp:"あなたの<ruby>学校<rt>がっこう</rt></ruby>は**あそこ**ですか?",zh:null},{en:"There is not my school.",jp:"あそこは<ruby>私<rt>わたし</rt></ruby>の<ruby>学校<rt>がっこう</rt></ruby>じゃないです。",zh:null},{en:"There is not my school.",jp:"あそこは<ruby>私<rt>わたし</rt></ruby>の<ruby>学校<rt>がっこう</rt></ruby>じゃありません。",zh:null},{en:"Whose house is that house?",jp:"あの<ruby>家<rt>いえ</rt></ruby>は**<ruby>誰<rt>だれ</rt></ruby>の**<ruby>家<rt>いえ</rt></ruby>ですか?",zh:null}]}],"demo-q":[{num:37,title:"これ-それ-あれ-どれ",vocab:[{t:"家 的讀音和意思？",m:"いえ (ie) - House"},{t:"りんご 的意思？",m:"りんご (ringo) - Apple"},{t:"本 的讀音和意思？",m:"ほん (hon) - Book"},{t:"水筒 的讀音和意思？",m:"すいとう (suitou) - Water bottle"},{t:"車 的讀音和意思？",m:"くるま (kuruma) - Car"},{t:"「這是一本書。」的日文怎麼說？",m:"これ　は　本（ほん）　です。 (kore wa hon desu.)"},{t:"「這是蘋果嗎？」的日文怎麼說？",m:"これ　は　りんご　です　か？ (kore wa ringo desu ka?)"},{t:"「那是你的弟弟嗎？」的日文怎麼說？",m:"あれ　は　あなたの　弟（おとうと）　です　か？ (are wa anata no otouto desu ka?)"},{t:"「哪一個是你的筆？」的日文怎麼說？",m:"あなたの　ペン（ぺん）　は　どれ　です　か？ (anata no pen wa dore desu ka?)"},{t:"「哪一個是你最喜歡的電影？」的日文怎麼說？",m:"好きな　映画（えいが）　は　どれ　です　か？ (sukina eiga wa dore desu ka?)"},{t:"「哪一個是你的車？」的日文怎麼說？",m:"あなたの　車（くるま）　は　どれ　です　か？ (anata no kuruma wa dore desu ka?)"}],grammar:["<b>これ、それ、あれ、どれ 的用法區別是什麼？</b><br><br><b>これ (kore)</b>：離<b>說話者</b>近的東西  <br><b>それ (sore)</b>：離<b>聽話者</b>近的東西  <br><b>あれ (are)</b>：離說話者和聽話者都<b>遠</b>的東西  <br><b>どれ (dore)</b>：用於詢問「哪一個」(which one)","<b>これ、それ、あれ、どれ 後面可以接名詞嗎？</b><br><br><b>絕對不可以！</b>  <br>これ、あれ、それ、どれ <b>NEVER</b> will be followed by a noun.（後面永遠不會直接接名詞）","<b>これ/それ/あれ/どれ 的基本句型是什麼？</b><br><br><b>肯定句：</b>これ/それ/あれ　は　X　です。→ This/That is X.  <br><b>疑問句：</b>これ/それ/あれ　は　X　ですか？→ Is this/that X?  <br><b>詢問哪一個：</b>X　は　どれ　ですか？→ Which one is X?","<b>「那是我的家。」的日文怎麼說？（あれ：離說話者和聽話者都遠）</b><br><br>あれ　は　<ruby>私<rt>わたし</rt></ruby>の　<ruby>家<rt>いえ</rt></ruby>　です。  <br>(are wa watashi no ie desu.)","<b>（指著眼前的東西）「這是我的水壺。」的日文怎麼說？</b><br><br>これ　は　わたしの　<ruby>水筒<rt>すいとう</rt></ruby>　です。  <br>(kore wa watashi no suitou desu.)","<b>（指著聽話者旁邊的東西）「那是你的手機嗎？」的日文怎麼說？</b><br><br>それ　は　あなたの　携帯電話　です　か？  <br>(sore wa anata no keitaidenwa desu ka?)","<b>（指著離說話者和聽話者都遠的東西）「那是什麼？」的日文怎麼說？</b><br><br>あれ　は　<ruby>何<rt>なん</rt></ruby>　です　か？  <br>(are wa nan desu ka?)"],example:[]},{num:38,title:"この-その-あの-どの",vocab:[{t:"<ruby>友達<rt>ともだち</rt></ruby>是什麼意思？",m:"Friend（朋友） 友達（ともだち - tomodachi）"},{t:"<ruby>女性<rt>じょせい</rt></ruby>是什麼意思？",m:"Lady（女性、女士） 女性（じょせい - josei）"},{t:"<ruby>人気<rt>にんき</rt></ruby>是什麼意思？",m:"Popular（受歡迎的） 人気（にんき - ninki）"}],grammar:["<b>この／その／あの／どの　的用法區別是什麼？</b><br><br><b>この (kono)</b>：用於離<b>說話者</b>近的事物。  <br><b>その (sono)</b>：用於離<b>聽話者</b>近的事物。  <br><b>あの (ano)</b>：用於離說話者和聽話者<b>都遠</b>的事物。  <br><b>どの (dono)</b>：用於<b>詢問「哪一個」</b>時。<br><br>＊この／その／あの／どの 後面一定要接名詞。","<b>この／その／あの　X　は　Y　です（か）？ 和　どの　X　は　Y　ですか？ 的句型與意思？</b><br><br>この／その／あの　X　は　Y　です。  <br>(kono/sono/ano X wa Y desu.)  <br>→ This/That X is Y.（這／那個 X 是 Y。）<br><br>この／その／あの　X　は　Y　ですか？  <br>(kono/sono/ano X wa Y desuka?)  <br>→ Is this/that X Y?（這／那個 X 是 Y 嗎？）<br><br>どの　X　は　Y　ですか？  <br>(dono X wa Y desuka?)  <br>→ Which X is Y?（哪個 X 是 Y？）","<b>これ／あれ／それ／どれ 和 この／あの／その／どの 有什麼差別？</b><br><br>これ、あれ、それ、どれ　→　<b>不能</b>接名詞 (Not followed by a noun)<br><br>この、あの、その、どの　→　<b>一定要</b>接名詞 (Always followed by a noun)"],example:[{en:null,jp:"**請用日文表達：「這本書是我的。」",zh:null},{en:null,jp:"**請用日文表達：「那間房子是我的。」",zh:null},{en:null,jp:"**請用日文表達：「那個人是你的朋友嗎？」",zh:null},{en:null,jp:"**請用日文表達：「這台車是你的嗎？」",zh:null},{en:null,jp:"**請用日文表達：「哪支筆是你的？」",zh:null},{en:null,jp:"**請用日文表達：「哪部電影很受歡迎？」",zh:null},{en:null,jp:"**請用日文表達（指著你面前的東西）：「這個水壺是我的。」**",zh:null},{en:null,jp:"**請用日文表達：「哪支手機是你的？」**",zh:null},{en:null,jp:"**請用日文表達（指著離說話者近的東西）：「那支手機是我的。」**",zh:null},{en:null,jp:"**請用日文表達（指著離說話者和聽話者都遠的人）：「那位女士是美紀子嗎？」**",zh:null},{en:null,jp:"**請用日文表達：「那位女士不是美紀子。」（列出兩種常見的否定說法）**",zh:null}]},{num:39,title:"だれの noun",vocab:[{t:"「包包」的日文怎麼說？",m:"カバン（かばん - kaban） = Bag"},{t:"「車子」的日文怎麼說？",m:"車（くるま - kuruma） = Car"},{t:"「錢包」的日文怎麼說？",m:"財布（さいふ - saifu） = Wallet"},{t:"如何用日文問「這是誰的包包？」",m:"（請說明句子結構） これは　だれの　かばん　ですか？ (Kore wa dareno kaban desuka?) これ＝這（this） は＝主題助詞 だれの＝誰的（whose） かばん＝包包（bag） です＝是（現在肯定） か＝疑問助詞"},{t:"「這是蘇的包包」的日文怎麼說？",m:"これは　スーの　かばんです。 (Kore wa Suu no kaban desu.)"},{t:"「這是誰的車？」的日文怎麼說？",m:"これは　だれの　くるまですか？ (Kore wa dareno kuruma desuka?)"},{t:"「那是誰的家？」的日文怎麼說？",m:"あれは　だれの　家（いえ）ですか？ (Are wa dareno ie desuka?)"},{t:"「這是誰的錢包？」的日文怎麼說？",m:"これは　だれの　財布（さいふ）ですか？ (Kore wa dareno saifu desuka?)"}],grammar:["<b>日文的「誰」怎麼說？「誰的」呢？</b><br><br>誰（だれ - dare）= 誰  <br>誰の（だれの - dareno）= 誰的<br><br>規則：疑問詞「誰」加上助詞「の」就變成「誰的」，用來詢問所有者。","<b>「她是誰的媽媽？」的日文怎麼說？</b><br><br><ruby>彼女<rt>かのじょ</rt></ruby>は　だれの　お<ruby>母<rt>かあ</rt></ruby>さんですか？  <br>(Kanojo wa dareno okaasan desuka?)"],example:[{en:null,jp:"「瑪莉的電話號碼」「小健的媽媽」**",zh:null}]},{num:40,title:"ここ-そこ-あそこ-どこ",vocab:[{t:"Library",m:"図書館 （としょかん / toshokan）"},{t:"Tokyo Tower",m:"東京タワー （とうきょうたわー / tokyo tawaa）"},{t:"Meeting point",m:"待ち合わせ場所 （まちあわせばしょ / machiawase basho）"},{t:"Hometown",m:"故郷 （こきょう / kokyou）"},{t:"Office / working place",m:"職場 （しょくば / shokuba）"},{t:"Hospital",m:"病院 （びょういん / byouin）"},{t:"「這裡（這個地方）是圖書館。」用日文怎麼說？",m:"ここ　は　図書館（としょかん）です。 (koko wa toshokan desu.)"},{t:"「那裡（那個地方）是我家。」用日文怎麼說？",m:"あそこ　は　私（わたし）の　家（いえ）です。 (asoko wa watashi no ie desu.)"},{t:"「東京鐵塔在這裡。」用日文怎麼說？",m:"東京タワー（とうきょうたわー）は　ここ　です。 (tokyo tawaa wa koko desu.)"},{t:"「你的手機在那裡。」用日文怎麼說？",m:"あなたの　携帯（けいたい）は　あそこ　です。 (anata no keitai wa asoko desu.)"},{t:"「你的車在哪裡？」用日文怎麼說？",m:"あなたの　車（くるま）は　どこ　ですか？ (anata no kuruma wa doko desu ka?)"},{t:"「醫院在哪裡？」用日文怎麼說？",m:"病院（びょういん）は　どこ　ですか？ (byouin wa doko desu ka?)"},{t:"「這裡是哪裡？」用日文怎麼說？",m:"ここ　は　どこ　ですか？ (koko wa doko desu ka?)"}],grammar:["<b>日文中 </b>ここ・そこ・あそこ・どこ<b> 的用法區別是什麼？</b><br><br><b>ここ (koko)</b>：離<b>說話者</b>近的地方 → 這裡  <br><b>そこ (soko)</b>：離<b>聽話者</b>近的地方 → 那裡  <br><b>あそこ (asoko)</b>：離說話者和聽話者都<b>遠</b>的地方 → 那裡／那邊  <br><b>どこ (doko)</b>：用來<b>詢問地點</b> → 哪裡","<b>「ここ／そこ／あそこ／どこ」的三種基本句型是什麼？</b><br><br>① ここ／そこ／あそこ　は　Xです。  <br>→ Here/There is X.<br><br>② Xは　ここ／そこ／あそこ　です。  <br>→ X is here/there.<br><br>③ Xは　どこ　ですか？  <br>→ Where is X?","<b>「集合地點在哪裡？」用日文怎麼說？</b><br><br>待ち合わせ<ruby>場所<rt>まちあわせばしょ</rt></ruby>は　どこ　ですか？  <br>(machiawasebasho wa doko desu ka?)","<b>「這裡（這個地方）是我的故鄉。」用日文怎麼說？</b><br><br>ここ　は　<ruby>私<rt>わたし</rt></ruby>の　<ruby>故郷<rt>こきょう</rt></ruby>です。  <br>(koko wa watashi no kokyou desu.)","<b>「那裡（那個地方）是我的職場。」用日文怎麼說？</b><br><br>あそこ　は　<ruby>私<rt>わたし</rt></ruby>の　<ruby>職場<rt>しょくば</rt></ruby>です。  <br>(asoko wa watashi no shokuba desu.)"],example:[]}],"particle":[{num:53,title:"Basic particles",vocab:[{t:"「に」表示時間點時如何使用？請舉例。",m:"表示事件發生的時間。 例句： 私（わたし）は　11時（じ）に　寝（ね）ます。 （我十一點睡覺。） 「11時」是時間，用「に」標示時間點。"},{t:"請比較で、に、へ、を這四個助詞的用法。",m:""},{t:"用法對照表：",m:"・表示場所（事件發生地點）→ で ・表示方向（移動目標）→ に 或 へ ・表示時間（事件發生時間）→ に ・表示直接受詞（受動作影響的對象）→ を"},{t:"<ruby>本<rt>ほん</rt></ruby>的意思是什麼？",m:"Book（書）"},{t:"<ruby>学校<rt>がっこう</rt></ruby>的意思是什麼？",m:"School（學校）"},{t:"コーヒー的意思是什麼？",m:"Coffee（咖啡）"},{t:"飲む（のむ）的意思是什麼？",m:"To drink（喝）"},{t:"寝る（ねる）的意思是什麼？",m:"To sleep（睡覺）"}],grammar:["<b>日文句子中的名詞後面通常會接什麼？它的作用是什麼？</b><br><br>名詞後面通常會<b>接助詞</b>（particle）。  <br>助詞用來表示名詞與動詞之間的關係。  <br>本課將學習四個新助詞：<b>で、に、へ、を</b>。","<b>助詞「で」（de）用來表示什麼？</b><br><br>表示<b>場所（Location）</b>：動詞所描述的事件發生的地點。<br><br>例句：  <br><ruby>図書館<rt>としょかん</rt></ruby>で　<ruby>本<rt>ほん</rt></ruby>を　<ruby>読<rt>よ</rt></ruby>みます。  <br>（我在圖書館看書。）","<b>助詞「に」（ni）的兩個常見用法是什麼？</b><br><br>(1) <b>方向 Direction</b>：事物移動的目標。  <br>(2) <b>時間 Time reference</b>：事件發生的時間點。","<b>「に」表示方向（目的地）時如何使用？請舉例。</b><br><br>表示動作移動的<b>目標／目的地</b>。<br><br>例句：  <br><ruby>私<rt>わたし</rt></ruby>は　<ruby>学校<rt>がっこう</rt></ruby>に　<ruby>行<rt>い</rt></ruby>きません。  <br>（我不會去學校。）  <br>「学校」是目的地，用「に」標示方向。","<b>助詞「へ」（發音為\"e\"）用來表示什麼？和「に」有何關係？</b><br><br>「へ」也表示<b>方向（移動的目標）Direction</b>，可與表示方向的「に」互換使用。  <br>注意：這個助詞唸作「<b>e</b>」，不是「he」。<br><br>例句：  <br><ruby>私<rt>わたし</rt></ruby>は　<ruby>学校<rt>がっこう</rt></ruby>へ　<ruby>行<rt>い</rt></ruby>きません。  <br>（我不會去學校。）","<b>助詞「を」（發音為\"o\"）用來表示什麼？</b><br><br>表示<b>直接受詞（Direct Object）</b>：動作直接涉及或影響的對象。  <br>注意：這個助詞唸作「<b>o</b>」。<br><br>例句：  <br><ruby>私<rt>わたし</rt></ruby>は　コーヒーを　<ruby>飲<rt>の</rt></ruby>みます。  <br>（我喝咖啡。）"],example:[]},{num:54,title:"Basic Particles Practice",vocab:[{t:"音楽",m:"おんがく（ongaku） 意思：Music"},{t:"カフェ",m:"かふぇ（kafe） 意思：Cafe"},{t:"何時",m:"なんじ（nanji） 意思：What time"},{t:"請填入正確助詞：",m:"\"I watch TV at home.\" うち　＿＿　テレビ（てれび）　＿＿　見（み）ます。 （地點）　　　　　　　（對象） うちでテレビ（てれび）を見（み）ます。"},{t:"請填入正確助詞：",m:"\"I go to Kyoto on Sunday.\" 日曜日（にちようび）　＿＿　京都（きょうと）　＿＿　行（い）きます。 （時間）　　　　　　　　（目的地） 日曜日（にちようび）に京都（きょうと）へ行（い）きます。"},{t:"に：表示動作發生的時間（Time）",m:"へ：表示動作的方向／目的地（Destination）"},{t:"請填入正確助詞：",m:"\"I will listen to music.\" 私（わたし）　＿＿　音楽（おんがく）　＿＿　聞（き）きます。 （主語）　　　　　（對象） 私（わたし）は音楽（おんがく）を聞（き）きます。"},{t:"は：表示句子的主語（Subject）",m:"を：表示動作的直接目的語（Direct object）"},{t:"請填入正確助詞：",m:"\"What time does Mary go to the cafe?\" メアリーさん　＿＿　なんじ　＿＿　かふぇ　＿＿　いきますか？ （主語）　　　　（時間）　　　（目的地） メアリーさんはなんじにかふぇにいきますか？"},{t:"は：表示主語（Subject）",m:"に（第一個）：表示時間（Time） に（第二個）：表示目的地（Destination）"}],grammar:["<b>助詞 で、に／へ、に、を 各自表示什麼用法？</b><br><br><b>で</b>：表示事件發生的<b>地點</b>（location where the event happens）  <br><b>に or へ</b>：表示動作的<b>方向／目的地</b>（direction, the goal of movement）  <br><b>に</b>：表示事件發生的<b>時間</b>（time when the event takes place）  <br><b>を</b>：表示受動作影響的<b>直接目的語</b>（direct object, affected by the movement）","<b>で</b>：表示動作發生的地點（Location）  <br><b>を</b>：表示動作作用的直接對象（Object）"],example:[]},{num:56,title:"The topic particle は",vocab:[{t:"常用短句：",m:"あなたは？ What about you? 省略句，常用來把話題轉向對方，是「は」引導聽者注意力、邀請回應的典型例子。"},{t:"總結：助詞「は」除了標記主語以外，還有哪兩種主要用法？",m:"1. 把非主語的詞語變成主題 （例：時間表達詞　週末は、今日は…）"}],grammar:["<b>文法規則：助詞「は」通常接在句子的什麼成分後面？除此之外還能怎麼用？</b><br><br>「は」通常直接接在<b>主語</b>之後。  <br>但也可以用「は」把<b>非主語的詞語</b>變成句子的主題（topic）。","<b>文法規則：「は」還有一種用法是什麼？（提示：與聽者互動有關）</b><br><br>「は」可以用來<b>引導聽者的注意力</b>，並藉此<b>邀請對方回應或完成句子</b>（常用於省略句尾的疑問句，如「〜は？」＝『〜怎麼樣？/你呢？』）。","<b>2. 引導聽者的注意力，邀請對方回應或完成句子</b>  <br>（例：省略疑問句　晩ごはんは？　あなたは？）"],example:[{en:null,jp:"<ruby>週末<rt>しゅうまつ</rt></ruby>は<ruby>何<rt>なに</rt></ruby>をしますか？",zh:"例："},{en:null,jp:"**請將下列日文翻成英文：",zh:null},{en:null,jp:"**請將下列日文翻成英文：",zh:null},{en:null,jp:"**請翻譯並說明用法：",zh:null},{en:null,jp:"<ruby>晩<rt>ばん</rt></ruby>ごはんは？",zh:null},{en:null,jp:"**請翻譯：",zh:null},{en:null,jp:"**請翻譯：",zh:null},{en:null,jp:"**請翻譯：",zh:null},{en:null,jp:"**請翻譯：",zh:null},{en:null,jp:"**請翻譯：",zh:null},{en:null,jp:"**請翻譯：",zh:null},{en:null,jp:"**請翻譯並說明句中兩個「は」的用法：",zh:null}]},{num:57,title:"Particle が",vocab:[{t:"整理：助詞「が」的用法總結",m:""},{t:"が的功能：",m:"1. 標示句子的主語(subject)。 2. 用該名詞回答／填補疑問詞（誰・何等）留下的空格，也就是提供新資訊。 對照： ・が → 標示新資訊／疑問詞的答案，語氣上有強調感。 ・は → 標示雙方已知的話題，單純敘述。 ・疑問詞作主語時，只能接が，絕不能接は。"}],grammar:["<b>「ロバートさんが 沖縄に行きました。」與「ロバートさんは 沖縄に行きました。」意思有什麼不同？</b><br><br>雙方都知道有人去了沖繩，但只有說話者知道是Robert，聽者不知道──這時用<b>が</b>，並特別強調「Robert」這個新資訊（他的身分是句子的重點）。<br><br>若用<b>は</b>，代表Robert是雙方已知的話題，只是單純敘述他做的事，沒有特別強調身分。<br><br>ロバートさんが <ruby>沖縄<rt>おきなわ</rt></ruby>に <ruby>行<rt>い</rt></ruby>きました。  <br>(是<b>Robert</b>去了沖繩──這是新資訊。)","<b>用日文問「哪個班有趣？」並回答「是日文課有趣」。</b><br><br>問：どのクラス（くらす）<b>が</b> おもしろいですか？  <br>(Which class is interesting?)<br><br>答：<ruby>日本語<rt>にほんご</rt></ruby>のクラス（くらす）<b>が</b> おもしろいです。  <br>(Japanese class is interesting.)<br><br>※「日本語のクラス」是回答疑問詞「どのクラス」的新資訊，所以用が。","<b>用日文問「誰戴著眼鏡？」並回答「是山下先生」。</b><br><br>問：だれ<b>が</b> めがねを かけていますか？  <br>(Who wears glasses?)<br><br>答：やましたさん<b>が</b> めがねを かけています。  <br>(Mr. Yamashita does.)"],example:[{en:null,jp:"ロバートさんが <ruby>沖縄<rt>おきなわ</rt></ruby>に <ruby>行<rt>い</rt></ruby>きました。",zh:null},{en:null,jp:"だれ**が** <ruby>沖縄<rt>おきなわ</rt></ruby>に いきましたか？",zh:null}]},{num:58,title:"Particle も",vocab:[{t:"<ruby>靴<rt>くつ</rt></ruby>",m:"kutsu Shoes（鞋子）"},{t:"カバン（かばん）",m:"kaban Bag（包包）"},{t:"<ruby>先週<rt>せんしゅう</rt></ruby>",m:"senshuu Last week（上週）"},{t:"「も」如何取代助詞「は」？請舉例說明。",m:"「も」可以取代は，用來表示第二個做出相同動作的人。 A: 昨日（きのう）京都（きょうと）に 行（い）きました。 （Kinou kyoto ni ikimashita.） B: たかも 昨日（きのう）京都（きょうと）に 行（い）きました。 （Taka mo kinou kyoto ni ikimashita.） ＝Taka 昨天也去了京都。"},{t:"「も」如何取代助詞「を」？請舉例說明。",m:"「も」可以取代を，用來表示第二個共有屬性的事物（受詞）。 A: メアリーは くつを 買（か）いました。 （Mary wa kutsu o kaimashita.） B: メアリーは かばんも 買（か）いました。 （Mary wa kaban mo kaimashita.） ＝Mary 也買了包包。"},{t:"「にも」如何取代「に」表示地點？請舉例。",m:"去過第一個地點後，又去了另一個地點時，用「にも」取代「に」。 A: 先週（せんしゅう）京都（きょうと）に 行（い）きました。 （Senshuu kyoto ni ikimashita.） B: 大阪（おおさか）にも 行（い）きました。 （Osaka nimo ikimashita.） ＝上週也去了大阪。"},{t:"「にも」如何取代「に」表示時間？請舉例。",m:"在第一個時間點做了某事後，又在另一個時間點做相同的事時，用「にも」取代「に」。 A: みきは 土曜日（どようび）に パーティーに 行（い）きました。 （Miki wa doyoubi ni pati- ni ikimashita.） B: 日曜日（にちようび）にも パーティーに 行（い）きました。 （Nichiyoubi nimo pati- ni ikimashita.） ＝星期日也去了派對。"}],grammar:["<b>助詞「も」的兩種基本用法是什麼？</b><br><br>1. 用在<b>第二個事物</b>上，這個事物與第一個事物<b>共有某個屬性</b>。<br>2. 用在<b>兩個以上的人</b>做<b>相同的動作</b>時。","<b>「も」除了取代は、が、を之外，還可以用在什麼情境？</b><br><br>も 也可以用於：  <br>・去了<b>兩個地方</b>時  <br>・在<b>兩個不同場合</b>做同一件事時  <br>（在這些例句中，も 直接取代 は、が、或 を，標示出「共同擁有某屬性」的那一項。）","<b>「も」與「に」合併使用的規則，以及其他助詞遇到「も」時的一般規則是什麼？</b><br><br>「も」放在助詞「<b>に</b>」<b>之後</b>，變成「にも」。<br><br>更一般地說：<b>除了は、が、を以外的助詞</b>，遇到「も」時是<b>與も並用</b>（放在助詞後面），而不是被も取代。","<b>整理：各助詞遇到「も」時的變化規則？</b><br><br>&lt;table&gt;&lt;tr&gt;&lt;td&gt;Particle は&lt;/td&gt;&lt;td rowspan=\"3\"&gt;被取代為「も(mo)」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Particle が&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Particle を&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Particle に&lt;/td&gt;&lt;td&gt;にも (nimo)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Particle へ&lt;/td&gt;&lt;td&gt;へも (emo)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Particle で&lt;/td&gt;&lt;td&gt;でも (demo)&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;","<b>請用「も」翻譯：「Naoko went to China. She went to Taiwan too.」（なおこ去了中國，也去了台灣。）</b><br><br>なおこは <ruby>中国<rt>ちゅうごく</rt></ruby>に <ruby>行<rt>い</rt></ruby>きました。  <br>（Naoko wa chuugoku ni ikimashita.）<br><br><ruby>台湾<rt>たいわん</rt></ruby><b>にも</b> <ruby>行<rt>い</rt></ruby>きました。  <br>（Taiwan nimo ikimashita.）","<b>請用「も」翻譯：「Naoko went to China. Takeshi went to China too.」（なおこ去了中國，たけし也去了中國。）</b><br><br>なおこは <ruby>中国<rt>ちゅうごく</rt></ruby>に <ruby>行<rt>い</rt></ruby>きました。  <br>（Naoko wa chuugoku ni ikimashita.）<br><br>たけし<b>も</b> <ruby>中国<rt>ちゅうごく</rt></ruby>に <ruby>行<rt>い</rt></ruby>きました。  <br>（Takeshi mo chuugoku ni ikimashita.）","<b>請用「も」翻譯：「I study Chinese. I study Spanish too.」（我學中文，也學西班牙文。）</b><br><br>わたしは <ruby>中国語<rt>ちゅうごくご</rt></ruby>を <ruby>勉強<rt>べんきょう</rt></ruby>します。  <br>（Watashi wa chuugokugo o benkyoushimasu.）<br><br>スペイン<ruby>語<rt>すぺいんご</rt></ruby><b>も</b> <ruby>勉強<rt>べんきょう</rt></ruby>します。  <br>（Supeingo mo benkyoushimasu.）","<b>請用「も」翻譯：「I go to the cafe on Monday. I go there on Thursday too.」（我星期一去咖啡廳，星期四也去那裡。）</b><br><br>わたしは <ruby>月曜日<rt>げつようび</rt></ruby>に カフェに <ruby>行<rt>い</rt></ruby>きます。  <br>（Watashi wa getuyoubi ni kafe ni ikimasu.）<br><br><ruby>木曜日<rt>もくようび</rt></ruby><b>にも</b> あそこに <ruby>行<rt>い</rt></ruby>きます。  <br>（Mokuyoubi nimo asoko ni ikimasu.）"],example:[]},{num:59,title:"Particle と",vocab:[{t:"<ruby>東京<rt>とうきょう</rt></ruby>是什麼意思？",m:"Tokyo （とうきょう / tokyo）"},{t:"りんご 是什麼意思？",m:"Apple （ringo）"},{t:"さくらんぼ 是什麼意思？",m:"Cherry （sakuranbo）"},{t:"<ruby>韓国<rt>かんこく</rt></ruby>是什麼意思？",m:"South Korea （かんこく / kankoku）"}],grammar:["<b>請用「と」翻譯：「I speak Japanese and English.」（我說日文和英文。）</b><br><br><ruby>日本語<rt>にほんご</rt></ruby><b>と</b> <ruby>英語<rt>えいご</rt></ruby>を <ruby>話<rt>はな</rt></ruby>します。  <br>(nihongo to eigo wo hanashimasu.)","<b>請用「と」翻譯：「I went to Tokyo and Osaka.」（我去了東京和大阪。）</b><br><br><ruby>東京<rt>とうきょう</rt></ruby><b>と</b> <ruby>大阪<rt>おおさか</rt></ruby>に <ruby>行<rt>い</rt></ruby>きました。  <br>(tokyo to osaka ni ikimashita.)","<b>請用「と」翻譯：「I ate apple and cherry.」（我吃了蘋果和櫻桃。）</b><br><br><ruby>私<rt>わたし</rt></ruby>は りんご<b>と</b>さくらんぼを <ruby>食<rt>た</rt></ruby>べました。  <br>(watashi wa ringo to sakuranbo wo tabemashita.)<br><br>\\*動詞「食べる」需改為過去式「食べました」","<b>請用「と」翻譯：「I went to South Korea with Mary.」（我和瑪麗去了韓國。）</b><br><br><ruby>私<rt>わたし</rt></ruby>は メアリー<b>と</b><ruby>韓国<rt>かんこく</rt></ruby>に <ruby>行<rt>い</rt></ruby>きました。  <br>(watashi wa Mary to kankoku ni ikimashita.)","<b>請用「と」翻譯：「I study Japanese with Ken.」（我和けん一起學習日文。）</b><br><br>（わたし）は けん<b>と</b><ruby>日本語<rt>にほんご</rt></ruby>を <ruby>勉強<rt>べんきょう</rt></ruby>します。  <br>(watashi wa ken to nihongo wo benkyoushimasu.)<br><br>\\*動詞「勉強する」用現在式「勉強します」"],example:[{en:null,jp:"<ruby>日本語<rt>にほんご</rt></ruby>と <ruby>英語<rt>えいご</rt></ruby>を <ruby>話<rt>はな</rt></ruby>します。",zh:"「我說日文和英文。」"},{en:null,jp:"メアリーと <ruby>韓国<rt>かんこく</rt></ruby>に <ruby>行<rt>い</rt></ruby>きました。",zh:"「我和瑪麗一起去了韓國。」"},{en:null,jp:"日本語と英語を話します。",zh:null},{en:null,jp:"メアリーと韓国に行きました。",zh:null}]},{num:60,title:"Particle や",vocab:[],grammar:["<b>請用「や」完成句子：「我去了京都和奈良等地。」（暗示還去了別的地方）</b><br><br><ruby>京都<rt>きょうと</rt></ruby><b>や</b><ruby>奈良<rt>なら</rt></ruby>に行きました。  <br>Kyōto ya Nara ni ikimashita.<br><br>や 表示舉例：京都、奈良只是去過的地方之一，暗示還去了其他地方。","<b>請用「や」完成句子：「我喜歡章魚燒和飯團等（食物）。」</b><br><br>たこ<ruby>焼<rt>や</rt></ruby>き<b>や</b>おにぎりが好きです。  <br>Takoyaki ya onigiri ga sukidesu.<br><br>や 表示舉例：章魚燒、飯團只是喜歡的食物中的例子，不是全部。","<b>請用「や」完成句子：「我做了味噌湯和大阪燒等（料理）。」</b><br><br>みそしる<b>や</b>おこのみやきを<ruby>料理<rt>りょうり</rt></ruby>しました。  <br>Misoshiru ya okonomiyaki o ryōri shimashita.<br><br>單字：  <br>料理する（りょうりする）＝做料理  <br><ruby>味噌汁<rt>みそしる</rt></ruby>＝味噌湯  <br>お好み焼き（おこのみやき）＝大阪燒","<b>請用「や」完成句子：「Taku 說日文、法文等（語言）。」</b><br><br>たくは<ruby>日本語<rt>にほんご</rt></ruby><b>や</b>フランス<ruby>語<rt>ふらんすご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>します。  <br>Taku wa nihongo ya furansugo o hanashimasu.<br><br>單字：  <br>話す（はなす）＝說  <br><ruby>日本語<rt>にほんご</rt></ruby>＝日語  <br>フランス<ruby>語<rt>ふらんすご</rt></ruby>＝法語"],example:[{en:null,jp:"<ruby>京都<rt>きょうと</rt></ruby>**や**<ruby>奈良<rt>なら</rt></ruby>に行きました。",zh:null}]},{num:61,title:"Particle で",vocab:[{t:"「Chopsticks」的日文是？",m:"お箸（おはし - ohashi）"},{t:"「Meals（飯）」的日文是？",m:"ご飯（ごはん - gohan）"},{t:"「Bus」的日文是？",m:"バス（ばす - basu）"},{t:"「TV」的日文是？",m:"テレビ（てれび - terebi）"}],grammar:["<b>總結：助詞「で」的用法整理（交通工具 vs 使用工具/手段）</b><br><br>&lt;table border=&#x27;1&#x27; cellpadding=&#x27;4&#x27;&gt;&lt;tr&gt;&lt;th&gt;用法&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;th&gt;例句&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交通工具&lt;/td&gt;&lt;td&gt;表示搭乘的交通方式&lt;/td&gt;&lt;td&gt;バスで学校に行きます。  <br>飛行機で大阪に行きますか？  <br>新幹線で大阪に行きます。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;使用工具/手段&lt;/td&gt;&lt;td&gt;表示做動作時使用的工具、語言等&lt;/td&gt;&lt;td&gt;お箸でご飯を食べます。  <br>日本語で話しましょう。  <br>テレビで映画を見ました。  <br>パソコンで映画を観ます。  <br>スペイン語で話しますか？&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;  <br>※ 與第53課表示「場所」的で不同，本課の「で」表示「手段/工具」。"],example:[{en:null,jp:"お<ruby>箸<rt>はし</rt></ruby>で ご<ruby>飯<rt>はん</rt></ruby>を <ruby>食<rt>た</rt></ruby>べます。（用筷子吃飯）",zh:null},{en:"We eat our meals with chopsticks.",jp:"お<ruby>箸<rt>はし</rt></ruby>で ご<ruby>飯<rt>はん</rt></ruby>を <ruby>食<rt>た</rt></ruby>べます。",zh:null},{en:"Let's talk in Japanese.",jp:"<ruby>日本語<rt>にほんご</rt></ruby>で <ruby>話<rt>はな</rt></ruby>しましょう。",zh:null},{en:"I go to school by bus.",jp:"バスで <ruby>学校<rt>がっこう</rt></ruby>に <ruby>行<rt>い</rt></ruby>きます。",zh:null},{en:"I watched a movie on TV.",jp:"テレビで <ruby>映画<rt>えいが</rt></ruby>を <ruby>見<rt>み</rt></ruby>ました。",zh:null},{en:"Will you go to Osaka by airplane?",jp:"<ruby>飛行機<rt>ひこうき</rt></ruby>で <ruby>大阪<rt>おおさか</rt></ruby>に <ruby>行<rt>い</rt></ruby>きますか？",zh:null},{en:"No, I will go to Osaka by the bullet-train.",jp:"いいえ、<ruby>新幹線<rt>しんかんせん</rt></ruby>で <ruby>大阪<rt>おおさか</rt></ruby>に <ruby>行<rt>い</rt></ruby>きます。",zh:null},{en:"I will watch a movie on my laptop.",jp:"パソコンで <ruby>映画<rt>えいが</rt></ruby>を <ruby>観<rt>み</rt></ruby>ます。",zh:null},{en:"Do you talk with your family in Spanish?",jp:"<ruby>家族<rt>かぞく</rt></ruby>と スペイン<ruby>語<rt>すぺいんご</rt></ruby>で <ruby>話<rt>はな</rt></ruby>しますか？",zh:null}]}],"verb-masu":[{num:44,title:"Ru-verb",vocab:[{t:"U-verb：行く (iku) - to go",m:"語幹：いき 肯定：行きます (ikimasu)　否定：行きません (ikimasen)"},{t:"食べる",m:"讀音：たべる（taberu） 意思：to eat 現在肯定形：食べます（tabemasu） 現在否定形：食べません（tabemasen）"},{t:"寝る",m:"讀音：ねる（neru） 意思：to sleep 現在肯定形：寝ます（nemasu） 現在否定形：寝ません（nemasen）"},{t:"起きる",m:"讀音：おきる（okiru） 意思：to wake up 現在肯定形：起きます（okimasu） 現在否定形：起きません（okimasen）"},{t:"見る",m:"讀音：みる（miru） 意思：to look/watch 現在肯定形：見ます（mimasu） 現在否定形：見ません（mimasen）"}],grammar:["<b>日文動詞會變化成哪三種形態？</b><br><br>(1) 辭書形（dictionary form）  <br>(2) 現在肯定形（present affirmative form）  <br>(3) 現在否定形（present negative form）<br><br><b>規則變化的日文動詞分為哪兩種？</b><br><br>(1) Ru-verbs（る動詞）  <br>(2) U-verbs（う動詞）","<b>Ru-verb 與 U-verb 的現在肯定形／否定形範例比較？</b><br><br><b>Ru-verb</b>：食べる (taberu) - to eat  <br>語幹：たべ  <br>肯定：食べます (tabemasu)　否定：食べません (tabemasen)"],example:[{en:null,jp:"食べる (taberu) → 食べます (tabemasu) / 食べません (tabemasen)",zh:null}]},{num:45,title:"U-verb",vocab:[{t:"什麼是 U-verb（U動詞）？",m:"在字典形（辭書形）中，動詞語幹加上母音「U」結尾的動詞。 例如：飲む、読む、話す、聞く、行く、帰る"},{t:"U-verbs",m:"現在肯定形：去掉「u」，加上「imasu」 現在否定形：去掉「u」，加上「imasen」"},{t:"飲む",m:"のむ（nomu） 意思：To drink（喝） 現在肯定形：飲みます（nomimasu） 現在否定形：飲みません（nomimasen）"},{t:"読む",m:"よむ（yomu） 意思：To read（讀） 現在肯定形：読みます（yomimasu） 現在否定形：読みません（yomimasen）"},{t:"話す",m:"はなす（hanasu） 意思：To speak/talk（說話） 現在肯定形：話します（hanashimasu） 現在否定形：話しません（hanashimasen）"},{t:"聞く",m:"きく（kiku） 意思：To listen/hear（聽） 現在肯定形：聞きます（kikimasu） 現在否定形：聞きません（kikimasen）"},{t:"行く",m:"いく（iku） 意思：To go（去） 現在肯定形：行きます（ikimasu） 現在否定形：行きません（ikimasen）"},{t:"帰る",m:"かえる（kaeru） 意思：To go back/return（回去） 現在肯定形：帰ります（kaerimasu） 現在否定形：帰りません（kaerimasen）"}],grammar:["<b>Ru-verb 與 U-verb 的現在肯定形/否定形變化規則有什麼不同？</b><br><br><b>Ru-verbs</b>  <br>現在肯定形：去掉「ru」，加上「masu」  <br>現在否定形：去掉「ru」，加上「masen」"],example:[{en:null,jp:"飲む（nomu）→ 飲みます（nomimasu）",zh:null}]},{num:46,title:"Irregular verb",vocab:[{t:"日文中有幾個不規則動詞？分別是什麼？",m:"共有兩個不規則動詞： (1) 来る（くる - kuru）- 來 (2) する（suru）- 做"},{t:"来る（くる）",m:"讀音：くる 羅馬字：kuru 意思：來 現在肯定形：来ます（kimasu） 現在否定形：来ません（kimasen）"},{t:"する",m:"讀音：する 羅馬字：suru 意思：做 現在肯定形：します（shimasu） 現在否定形：しません（shimasen）"},{t:"勉強する（べんきょうする）",m:"讀音：べんきょうする 羅馬字：benkyousuru 意思：學習、唸書 現在肯定形：勉強します（benkyoushimasu） 現在否定形：勉強しません（benkyoushimasen）"},{t:"料理する（りょうりする）",m:"讀音：りょうりする 羅馬字：ryourisuru 意思：做菜、烹飪 現在肯定形：料理します（ryourishimasu） 現在否定形：料理しません（ryourishimasen）"},{t:"散歩する（さんぽする）",m:"讀音：さんぽする 羅馬字：sanposuru 意思：散步 現在肯定形：散歩します（sanposhimasu） 現在否定形：散歩しません（sanposhimasen）"},{t:"旅行する（りょこうする）",m:"讀音：りょこうする 羅馬字：ryokousuru 意思：旅行 現在肯定形：旅行します（ryokoushimasu） 現在否定形：旅行しません（ryokoushimasen）"},{t:"不規則動詞總表：現在肯定形／否定形",m:""},{t:"来る（kuru）來 → 来ます／来ません",m:"する（suru）做 → します／しません 勉強する（benkyousuru）學習 → 勉強します／勉強しません 料理する（ryourisuru）做菜 → 料理します／料理しません 散歩する（sanposuru）散步 → 散歩します／散歩しません 旅行する（ryokousuru）旅行 → 旅行します／旅行しません"}],grammar:["<b>来る和する這兩個不規則動詞，除了本身的意思外還有什麼用途？</b><br><br>這兩個動詞也可以用來構成<b>複合動詞</b>（compound verbs），例如：  <br>勉強する（學習）、料理する（做菜）、散歩する（散步）、旅行する（旅行）"],example:[]},{num:47,title:"Verb types and the Present Tense",vocab:[{t:"よく",m:"(yoku) Often（常常）"},{t:"テレビ（てれび）",m:"(terebi) TV"},{t:"時々（ときどき）",m:"(tokidoki) Sometimes（有時候）"},{t:"朝ごはん（あさごはん）",m:"(asagohan) Breakfast（早餐）"},{t:"<ruby>明日<rt>あした</rt></ruby>",m:"(ashita) Tomorrow（明天）"},{t:"<ruby>京都<rt>きょうと</rt></ruby>",m:"(kyouto) Kyoto（京都，日本城市）"},{t:"<ruby>今日<rt>きょう</rt></ruby>",m:"(kyou) Today（今天）"},{t:"うち",m:"(uchi) Home / house（家）"},{t:"日本の映画です。／日本の映画でした。",m:"這兩句分別是現在時和過去時，各是什麼意思？ 現在時：日本（にほん）の映画（えいが）です。 (nihon no eiga desu) = It is a Japanese movie."}],grammar:["<b>日文動詞的「現在時」(present tense) 表示什麼意思？</b><br><br>動詞「現在時」有兩種意思：  <br>(1) 習慣性、規律性做某事 (habitually or regularly engages in these activities)  <br>(2) 未來將要做、或打算做某事 (will, or is planning to perform these activities in the future)","<b>總結：日文的「現在時」可以用在哪兩種情況？</b><br><br>(1) 談論規律性活動 (regular activities)  <br>(2) 談論未來的活動 (future activities)","<b>過去時</b>：<ruby>日本<rt>にほん</rt></ruby>の<ruby>映画<rt>えいが</rt></ruby>でした。  <br>(nihon no eiga deshita)  <br>= It was a Japanese movie.","**日本の映画じゃないです。／日本の映画じゃなかったです。  <br>這兩句分別是現在否定和過去否定，各是什麼意思？**<br><br><b>現在否定</b>：<ruby>日本<rt>にほん</rt></ruby>の<ruby>映画<rt>えいが</rt></ruby>じゃないです。  <br>(nihon no eiga janaidesu)  <br>= It is not a Japanese movie.<br><br><b>過去否定</b>：<ruby>日本<rt>にほん</rt></ruby>の<ruby>映画<rt>えいが</rt></ruby>じゃなかったです。  <br>(nihon no eiga janakattadesu)  <br>= It was not a Japanese movie.","<b>「My father was a teacher.」用日文怎麼說？（私の父／先生 + でした）</b><br><br><ruby>私<rt>わたし</rt></ruby>のお<ruby>父<rt>とう</rt></ruby>さんは<ruby>先生<rt>せんせい</rt></ruby><b>でした</b>。  <br>(watashi no otousan wa sensei deshita)  <br>= My father was a teacher.","<b>「My father was not a teacher.」用日文怎麼說？（私の父／先生 + じゃなかったです）</b><br><br><ruby>私<rt>わたし</rt></ruby>のお<ruby>父<rt>とう</rt></ruby>さんは<ruby>先生<rt>せんせい</rt></ruby><b>じゃなかったです</b>。  <br>(watashi no otousan wa sensei janakattadesu)  <br>= My father was not a teacher."],example:[{en:"I often watch TV.",jp:"**私はよくテレビを見ます。",zh:null},{en:"Mary sometimes does not eat breakfast.",jp:"**メアリーさんはときどき朝ごはんを食べません。",zh:null},{en:"I will go to Kyoto tomorrow.",jp:"**私はあした京都に行きます。",zh:null},{en:"Sue will not return home today.",jp:"**スーさんは今日うちに帰りません。",zh:null},{en:null,jp:"<ruby>学生<rt>がくせい</rt></ruby>じゃないです。",zh:null}]},{num:48,title:"Past tense",vocab:[],grammar:["<b>名詞的過去時怎麼變？（present vs past 總表）</b>","<b>動詞的過去時怎麼變？（present vs past 總表）</b>"],example:[{en:null,jp:"食べます → **食べました**。",zh:null},{en:null,jp:"私は9時に帰りました。（我9點回家了。）",zh:"意思：回去、回家"},{en:null,jp:"私は昨日の夜すしを食べました。（我昨晚吃了壽司。）",zh:"意思：吃"},{en:null,jp:"昨日何をしましたか？（你昨天做了什麼？）",zh:"意思：做"},{en:null,jp:"学生です。→ 学生でした。",zh:null},{en:null,jp:"学生じゃないです。→ 学生じゃなかったです。",zh:null},{en:null,jp:"食べます → 食べました。",zh:null},{en:null,jp:"食べません → 食べませんでした。",zh:null}]},{num:65,title:"〜ませんか(Shall we)",vocab:[{t:"昼ごはん（ひるごはん）",m:"hirugohan 意思：午飯、中午飯 (Lunch)"},{t:"<ruby>映画<rt>えいが</rt></ruby>",m:"eiga 意思：電影/影片 (Movie/film)"},{t:"<ruby>酒<rt>さけ</rt></ruby>",m:"sake 意思：日本酒 (Japanese sake)"},{t:"「ませんか」邀約句的公式總結是什麼？",m:"公式：現在否定形＋か？ (Present negative + か？)"},{t:"食べる（たべる）- to eat",m:"ます形：食べます (tabemasu) ませんか邀約句：食べませんか？(tabemasenka?) 例句：昼（ひる）ごはんを食（た）べませんか？ 意思：要不要一起吃午飯？(Shall we have lunch together?)"},{t:"行く（いく）- to go",m:"ます形：行きます (ikimasu) ませんか邀約句：行きませんか？(ikimasenka?) 例句：カフェ（かふぇ）に行（い）きませんか？ 意思：要不要一起去咖啡廳？(Will you go to the cafe with me?)"},{t:"見る（みる）- to watch/see",m:"ます形：見ます (mimasu) ませんか邀約句：見ませんか？(mimasenka?) 例句：映画（えいが）を見（み）ませんか？ 意思：要不要一起看電影？(Shall we watch a movie?)"},{t:"飲む（のむ）- to drink",m:"ます形：飲みます (nomimasu) ませんか邀約句：飲みませんか？(nomimasenka?) 例句：明日（あした）酒（さけ）を飲（の）みませんか？ 意思：明天要不要一起喝酒？(Shall we drink sake tomorrow?)"}],grammar:["<b>注意：</b>「現在肯定形＋か？」(Present affirmative + か？) <b>不是</b>邀約句，只是一般疑問句。","<b>勉強する（べんきょうする）- to study</b><br><br>ます形：勉強します (benkyoushimasu)  <br>ませんか邀約句：勉強しませんか？(benkyoushimasenka?)  <br>例句：<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しませんか？  <br>意思：要不要一起學日文？(Will you study Japanese with me?)"],example:[{en:null,jp:"<ruby>昼<rt>ひる</rt></ruby>ごはんを<ruby>食<rt>た</rt></ruby>べませんか？",zh:null},{en:null,jp:"昼ごはんを食べますか　只是在問「你要吃午飯嗎？」，不是邀約。",zh:null},{en:null,jp:"<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ません　→　映画を見ませんか？",zh:null}]},{num:66,title:"〜ましょう(Let's...!)",vocab:[{t:"辭書形：勉強する\\*\\*\\*\\*",m:"ます形：勉強します ましょう句：図書館(としょかん)で勉強(べんきょう)しましょう。 意味：一起在圖書館學習吧！（Let's study in the library.）"},{t:"辭書形：飲む\\*\\*\\*\\*",m:"ます形：飲(の)みます ましょうか句：カフェでコーヒーを飲(の)みましょうか？ 意味：要不要在咖啡廳喝咖啡呢？（Shall we drink coffee at a cafe?）"},{t:"辭書形：見る\\*\\*\\*\\*",m:"ます形：見(み)ます 肯定文：(私たちは) 映画(えいが)を見(み)ます。 勧誘：映画(えいが)を見(み)ましょう！（Let's watch a movie!） 疑問：映画(えいが)を見(み)ましょうか？（Shall we watch a movie?）"},{t:"辭書形：する（サッカーをする）",m:"ます形：します 肯定文：(私たちは) あした、サッカーをします。 勧誘：あした、サッカーをしましょう！（Let's play football tomorrow!） 疑問：あした、サッカーをしましょうか？（Shall we play football tomorrow?）"},{t:"辭書形：行く（キャンプに行く）",m:"ます形：行(い)きます 肯定文：(私たちは) 今週末(こんしゅうまつ)、キャンプに行(い)きます。 勧誘：今週末(こんしゅうまつ)キャンプに行(い)きましょう！（Let's go camping this weekend!） 疑問：今週末(こんしゅうまつ)キャンプに行(い)きましょうか？（Shall we go camping this weekend?）"}],grammar:["<b>如何造出勸誘句（Let&#x27;s ...!）？</b><br><br>Step1：先造出<b>肯定句</b>（ます形）。  <br>Step2：把「ます」換成「<b>ましょう</b>」或「<b>ましょうか？</b>」。","<b>〜ましょう 與 〜ましょうか 的意思差異？</b><br><br><b>動詞ます形</b> + ましょう → 「Let&#x27;s ...!」（比較主動地提議、邀請對方一起做）  <br><b>動詞ます形</b> + ましょうか？ → 「Shall we ...?」（用疑問語氣詢問對方意願，較委婉客氣）"],example:[{en:null,jp:"勉強します → 勉強しましょう／勉強しましょうか？",zh:null}]},{num:68,title:"Xがあります(There is 非生物)",vocab:[{t:"みかん（mikan）",m:"Orange（橘子）"},{t:"あそこ（asoko）",m:"Over there（那裡）"},{t:"クラス（くらす / kurasu）",m:"Class（課程/班級）"},{t:"テスト（てすと / tesuto）",m:"Test（考試/測驗）"},{t:"冷蔵庫（れいぞうこ / reizouko）",m:"Fridge（冰箱）"},{t:"パーティー（ぱーてぃー / pa-ti-）",m:"Party（派對）"},{t:"時間（じかん / jikan）",m:"Time（時間）"}],grammar:["<b>文法規則：</b>Xがあります<b> 是什麼意思？助詞「が」在此扮演什麼角色？</b><br><br>Xがあります 表示「有/存在 X（非生物、無生命的東西）」。  <br>助詞 <b>が</b>(ga) 用來提示/介紹該事物 X。","<b>「Xがあります」可以表達三種不同的意思，分別是什麼？</b><br><br>(1) 某位置有某物 (there is something at a certain location)  <br>(2) 你擁有某物 (you have/own something)  <br>(3) 某活動即將發生 (an event will take place)","<b>使用「(Location)に (Object)が あります」句型時，有哪3個重要規則要注意？</b><br><br>1. 地點要用助詞 <b>に</b>，不是で。<br>2. 地點描述通常放在句子最前面。<br>3. 物品後面通常接助詞 <b>が</b>，不是は。","<b>注意</b>：表達活動地點時要用助詞 <b>で</b>，不是に（跟用法(1)的地點用「に」不同，因為活動的助詞用法遵循一般規則）。","<b>マクドナルド（まくどなるど / makudonarudo）</b><br><br>McDonald&#x27;s（麥當勞）","<b>サーフボード（さーふぼーど / sa-fubo-do）</b><br><br>Surfboard（衝浪板）","<b>請用「あそこ」和「サーフボード」造句，表達「那裡有一個衝浪板。」(There is a surfboard over there.)</b><br><br>あそこに サーフボード が あります。  <br>(asoko ni sa-fubo-do ga arimasu.)  <br>＝ There is a surfboard over there.","<b>如何用日文問「你有時間嗎？」(Do you have time?)</b><br><br><ruby>時間<rt>じかん</rt></ruby>が ありますか？  <br>(jikan ga arimasuka?)  <br>＝ Do you have time?","<b>如何用日文說「星期五有派對。」(I have a party on Friday.)</b><br><br><ruby>金曜日<rt>きんようび</rt></ruby>に パーティー（ぱーてぃー）が あります。  <br>(kinyoubi ni pa-ti- ga arimasu.)  <br>＝ I have a party on Friday.","<b>總結：「Xがあります」三大用法與例句，請列出完整對照表。</b>"],example:[{en:"There is a McDonald's over there.",jp:"あそこに マクドナルド（まくどなるど）が あります。",zh:null},{en:"I have a fridge at home.",jp:"<ruby>家<rt>いえ</rt></ruby>に <ruby>冷蔵庫<rt>れいぞうこ</rt></ruby>が あります。",zh:null},{en:"I have a Japanese lesson. / There is a Japanese lesson.",jp:"<ruby>日本語<rt>にほんご</rt></ruby>の クラス（くらす）が あります。",zh:null},{en:"I have a test on Tuesday.",jp:"<ruby>火曜日<rt>かようび</rt></ruby>に テスト（てすと）が あります。",zh:null},{en:"I have a test at school.",jp:"<ruby>学校<rt>がっこう</rt></ruby>で テスト（てすと）が あります。",zh:null},{en:null,jp:"あそこに マクドナルドが あります。",zh:null},{en:null,jp:"家に 冷蔵庫が あります。",zh:null},{en:null,jp:"日本語のクラスが あります。",zh:null}]},{num:69,title:"Xがいます(There is 有生命)",vocab:[{t:"Dog",m:"犬（いぬ - inu）"},{t:"Cat",m:"猫（ねこ - neko）"},{t:"International student",m:"留学生（りゅうがくせい - ryuugakusei）"},{t:"Living object（有生命）",m:"(Location) に (Object) が います。 使用動詞「います」"}],grammar:["<b>什麼時候要用「います」，而不是「あります」？</b><br><br>當你要表示<b>有生命的人或動物</b>的存在時（而不是無生命的物品），要用動詞 <b>います</b>。<br><br>句型：  <br>(Location) に (Person／生物) が います。  <br>→ 在(地點)有(人／生物)。","<b>使用「(Location)に(生物)がいます」時，有哪三個重要規則？</b><br><br>1. 地點要用助詞 <b>に</b>，而不是 で。<br>2. 地點描述通常放在句子<b>開頭</b>。<br>3. 有生命的對象（living object）後面通常接助詞 <b>が</b>，而不是 は。","<b>There is an international student over there.</b><br><br>あそこに<ruby>留学生<rt>りゅうがくせい</rt></ruby>がいます。  <br>(asoko ni ryuugakusei ga imasu.)","<b>There is a cat over there.</b><br><br>あそこに<ruby>猫<rt>ねこ</rt></ruby>がいます。  <br>(asoko ni neko ga imasu.)","<b>There is my Spanish teacher over there.</b><br><br>あそこに<ruby>私<rt>わたし</rt></ruby>のスペイン<ruby>語<rt>すぺいんご</rt></ruby>の<ruby>先生<rt>せんせい</rt></ruby>がいます。  <br>(asoko ni watashi no supeingo no sensei ga imasu.)","<b>います 和 あります 的差異是什麼？（整理總表）</b>","<b>Non-living object（無生命）</b>  <br>(Location) に (Object) が あります。  <br>使用動詞「<b>あります</b>」"],example:[]},{num:70,title:"Describing where things are(前後左右上下)",vocab:[{t:"<ruby>前<rt>まえ</rt></ruby>",m:"In front of"},{t:"後ろ（うしろ）",m:"Behind"},{t:"<ruby>隣<rt>となり</rt></ruby>",m:"Next to / Beside"},{t:"<ruby>左<rt>ひだり</rt></ruby>",m:"Left"},{t:"<ruby>右<rt>みぎ</rt></ruby>",m:"Right"},{t:"<ruby>中<rt>なか</rt></ruby>",m:"Inside"},{t:"<ruby>外<rt>そと</rt></ruby>",m:"Outside"},{t:"<ruby>上<rt>うえ</rt></ruby>",m:"On / Above"},{t:"<ruby>下<rt>した</rt></ruby>",m:"Under / Below"},{t:"<ruby>間<rt>あいだ</rt></ruby>",m:"Between"},{t:"「in front of ～」的日文說法？",m:"〜の前（まえ） no mae"},{t:"「behind ～」的日文說法？",m:"〜の後ろ（うしろ） no ushiro"},{t:"「next to / beside ～」的日文說法？",m:"〜の隣（となり） no tonari"},{t:"「to the left of ～」的日文說法？",m:"〜の左（ひだり） no hidari"},{t:"「to the right of ～」的日文說法？",m:"〜の右（みぎ） no migi"},{t:"「inside ～」的日文說法？",m:"〜の中（なか） no naka"},{t:"「outside ～」的日文說法？",m:"〜の外（そと） no soto"},{t:"「on / above ～」的日文說法？",m:"〜の上（うえ） no ue"},{t:"「under / below ～」的日文說法？",m:"〜の下（した） no shita"},{t:"「between A and B」的日文說法？",m:"A と B の間（あいだ） A to B no aida"},{t:"「傘は机の下です。」是什麼意思？",m:"The umbrella is under the table. 傘（かさ）は机（つくえ）の下（した）です。"}],grammar:["<b>「家の前に車があります。」是什麼意思？</b><br><br>There is a car in front of the house.  <br><ruby>家<rt>いえ</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>に<ruby>車<rt>くるま</rt></ruby>があります。","<b>如何給出更精確的位置說明（例如：在～前面）？</b><br><br>用「〜の＋位置詞」的句型。  <br>〜の<ruby>前<rt>まえ</rt></ruby>　= in front of ～  <br>〜の後ろ（うしろ）　= behind ～  <br>〜の<ruby>横<rt>よこ</rt></ruby>　= beside / next to ～  <br>etc.","<b>「銀行は図書館の隣です。」是什麼意思？</b><br><br>The bank is next to the library.  <br><ruby>銀行<rt>ぎんこう</rt></ruby>は<ruby>図書館<rt>としょかん</rt></ruby>の<ruby>隣<rt>となり</rt></ruby>です。","<b>「車は自転車と家の間です。」是什麼意思？</b><br><br>The car is between the bike and the house.  <br><ruby>車<rt>くるま</rt></ruby>は<ruby>自転車<rt>じてんしゃ</rt></ruby>と<ruby>家<rt>いえ</rt></ruby>の<ruby>間<rt>あいだ</rt></ruby>です。","<b>「我家在學校後面。」的日文怎麼說？</b><br><br><ruby>私<rt>わたし</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>の後ろ（うしろ）です。  <br>My house is behind the school.","<b>「我會在車站裡面等（你）。」的日文怎麼說？</b><br><br><ruby>駅<rt>えき</rt></ruby>の<ruby>中<rt>なか</rt></ruby>で<ruby>待<rt>ま</rt></ruby>ちます。  <br>I will wait (for you) inside the station."],example:[{en:null,jp:"<ruby>車<rt>くるま</rt></ruby>はどこですか？　= Where is the car?",zh:null},{en:null,jp:"<ruby>車<rt>くるま</rt></ruby>は**そこ**です。　= The car is right there.",zh:null},{en:null,jp:"カフェ（kafe）の<ruby>前<rt>まえ</rt></ruby>で<ruby>待<rt>ま</rt></ruby>ちます。　= I will wait in front of the cafe.",zh:null},{en:null,jp:"カフェの前で待ちます。",zh:null}]}],"te-form":[{num:83,title:"Te-form rules (Ru-verbs)",vocab:[{t:"<ruby>食<rt>た</rt></ruby>べる",m:"taberu Te-form：食（た）べて tabete 意思：吃 (to eat)"},{t:"<ruby>寝<rt>ね</rt></ruby>る",m:"neru Te-form：寝（ね）て nete 意思：睡覺 (to sleep)"},{t:"<ruby>起<rt>お</rt></ruby>きる",m:"okiru Te-form：起（お）きて okite 意思：起床 (to get up)"},{t:"<ruby>見<rt>み</rt></ruby>る",m:"miru Te-form：見（み）て mite 意思：看 (to see/watch)"}],grammar:["<b>て形(te-form)在日語文法中有哪4種用法？</b><br><br>(1) 請求　「…て。」  <br>(2) 給予/請求許可　「…てもいい？」  <br>(3) 表示禁止　「…てはいけない」  <br>(4) 連接兩個動作/事件　「…て、…」（做了這個又做了那個）","<b>動詞的Te-form變化規則，需要依動詞種類分成幾大類？</b><br><br>3大類：  <br>(1) る動詞 (Ru-verbs)  <br>(2) う動詞 (U-verbs，再分5個子規則)  <br>(3) 不規則動詞 (Irregular verbs)","<b>整理：る動詞(Ru-verbs) Te-form 總表</b><br><br>規則：去る，加て<br><br>辭書形 → Te-form（意思）  <br><ruby>食<rt>た</rt></ruby>べる → <ruby>食<rt>た</rt></ruby>べて（吃）  <br><ruby>寝<rt>ね</rt></ruby>る → <ruby>寝<rt>ね</rt></ruby>て（睡覺）  <br><ruby>起<rt>お</rt></ruby>きる → <ruby>起<rt>お</rt></ruby>きて（起床）  <br><ruby>見<rt>み</rt></ruby>る → <ruby>見<rt>み</rt></ruby>て（看）"],example:[{en:null,jp:"<ruby>食<rt>た</rt></ruby>べる taberu →",zh:"例："}]},{num:84,title:"Te-form rules (U-verbs)",vocab:[{t:"什麼是「Te-form」？",m:"動詞的一種新變化型態，是日文文法中非常重要的一環。 本課將學習 Te-form 的 4 種主要用法。"},{t:"会う（あう / au）",m:"Te-form：会って（あって / atte） 意思：見面、遇見 子規則：Group 1（う・つ・る → って）"},{t:"待つ（まつ / matsu）",m:"Te-form：待って（まって / matte） 意思：等待 子規則：Group 1（う・つ・る → って）"},{t:"取る（とる / toru）",m:"Te-form：取って（とって / totte） 意思：拿、取 子規則：Group 1（う・つ・る → って）"},{t:"読む（よむ / yomu）",m:"Te-form：読んで（よんで / yonde） 意思：讀、看（書） 子規則：Group 2（む・ぶ・ぬ → んで）"},{t:"遊ぶ（あそぶ / asobu）",m:"Te-form：遊んで（あそんで / asonde） 意思：玩 子規則：Group 2（む・ぶ・ぬ → んで）"},{t:"死ぬ（しぬ / shinu）",m:"Te-form：死んで（しんで / shinde） 意思：死 子規則：Group 2（む・ぶ・ぬ → んで）"},{t:"書く（かく / kaku）",m:"Te-form：書いて（かいて / kaite） 意思：寫 子規則：Group 3（く → いて）"},{t:"泳ぐ（およぐ / oyogu）",m:"Te-form：泳いで（およいで / oyoide） 意思：游泳 子規則：Group 4（ぐ → いで）"},{t:"話す（はなす / hanasu）",m:"Te-form：話して（はなして / hanashite） 意思：說話、談話 子規則：Group 5（す → して）"},{t:"う動詞 Te-form 五種子規則總表",m:""}],grammar:["<b>Te-form 的 4 種主要用法是什麼？</b><br><br>(1) 表示請求（「……可以嗎？」）  <br>(2) 給予／詢問許可（「你可以……」／「我可以……嗎？」）  <br>(3) 表示禁止（「不可以……」）  <br>(4) 連接兩件事或動作的句子（「做了這個又做了那個」）","<b>Te-form 的變化規則要依動詞種類分別學習，是哪三大類？う動詞的規則又再分成幾種子規則？</b><br><br>三大類：  <br>(1) る動詞（ru-verbs）  <br>(2) う動詞（u-verbs）  <br>(3) 不規則動詞（irregular verbs）<br><br>う動詞的規則再細分成 <b>5 種子規則</b>，依辭書形的最後一個字判斷。","<b>Group 1</b>（う・つ・る）→ って　例：会う→会って、待つ→待って、取る→取って  <br><b>Group 2</b>（む・ぶ・ぬ）→ んで　例：読む→読んで、遊ぶ→遊んで、死ぬ→死んで  <br><b>Group 3</b>（く）→ いて　例：書く→書いて  <br><b>Group 4</b>（ぐ）→ いで　例：泳ぐ→泳いで  <br><b>Group 5</b>（す）→ して　例：話す→話して","<b>注意：</b>Te-form 與「ます形前的語幹」是完全不同的東西，不要把る動詞的規則（たべる→たべて、たべます）套用在う動詞上，例如「会う」的Te-form不是「会いて」，而是「会って」；「読む」的Te-form不是「読みて」，而是「読んで」。","<b>記憶技巧：</b>建議把每個動詞的辭書形、ます形、Te-form一起記成一組，例如：かく（辭書形）→ かきます（ます形）→ かいて（Te-form）。"],example:[{en:null,jp:"会う（あう）→ 会って（あって）- 見面/相遇",zh:"例："},{en:null,jp:"読む（よむ）→ 読んで（よんで）- 讀/看",zh:"例："},{en:null,jp:"書く（かく）→ 書いて（かいて）- 寫",zh:"例："},{en:null,jp:"泳ぐ（およぐ）→ 泳いで（およいで）- 游泳",zh:"例："},{en:null,jp:"話す（はなす）→ 話して（はなして）- 說話、談話",zh:"例："}]},{num:86,title:"Te-form Usage 1",vocab:[{t:"「名前」怎麼唸？意思是什麼？",m:"名前（なまえ - namae） - 名字 / 姓名"},{t:"日文怎麼說「在...前面」和「車站」？",m:"駅（えき - eki） - 車站 ～の前（まえ）で（~ no mae de） - 在～的前面"},{t:"日文怎麼說「每天」和「早餐」？",m:"毎日（まいにち - mainichi） - 每天 朝（あさ）ごはん（asagohan） - 早餐"}],grammar:["<b>日文的 Te-form（て形）有哪 4 種主要用法？</b><br><br><b>(1)</b> 做請求「～てください」（請...）  <br><b>(2)</b> 給予/請求許可「～てもいい」（可以.../我可以...嗎？）  <br><b>(3)</b> 表示禁止「～てはいけない」（不可以...）  <br><b>(4)</b> 連接兩個動作/事件的句子（做了...然後做了...）","<b>日文動詞的 Te-form 變化規則怎麼分類？</b><br><br>Te-form 的變化規則依動詞類型分為三大類：  <br><b>(1)</b> る動詞（ru-verbs）  <br><b>(2)</b> う動詞（u-verbs）  <br><b>(3)</b> 不規則動詞（irregular verbs）<br><br>其中<b>う動詞（u-verbs）</b>又再細分為<b>5種子規則</b>。","<b>不規則動詞（する、くる）的 Te-form 怎麼變化？</b><br><br><b>する</b>（suru，辭書形）→ <b>して</b>（shite，Te-form） - 意思：做  <br><b>くる</b>（kuru，辭書形）→ <b>きて</b>（kite，Te-form） - 意思：來","<b>「書く」的辭書形、Te-form、意思是什麼？並用它造一個請求句。</b><br><br>辭書形：<ruby>書<rt>か</rt></ruby>く（kaku） - 意思：寫  <br>Te-form：<ruby>書<rt>か</rt></ruby>いて（kaite）<br><br>例句：<b><ruby>名前<rt>なまえ</rt></ruby>を <ruby>書<rt>か</rt></ruby>いて ください。</b>  <br>（namae o kaite kudasai.）  <br>「請寫下你的名字。」","<b>「助ける」的辭書形、Te-form、意思是什麼？並用它造一個請求句。</b><br><br>辭書形：<ruby>助<rt>たす</rt></ruby>ける（tasukeru） - 意思：幫助  <br>Te-form：<ruby>助<rt>たす</rt></ruby>けて（tasukete）<br><br>例句：<b>すみません、<ruby>助<rt>たす</rt></ruby>けて ください。</b>  <br>（sumimasen, tasukete kudasai.）  <br>「不好意思，請幫助我。」<br><br>（すみません - sumimasen：不好意思/抱歉）","<b>「待つ」的辭書形、Te-form、意思是什麼？並用它造一個請求句。</b><br><br>辭書形：<ruby>待<rt>ま</rt></ruby>つ（matsu） - 意思：等待  <br>Te-form：<ruby>待<rt>ま</rt></ruby>って（matte）<br><br>例句：<b><ruby>駅<rt>えき</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>で <ruby>待<rt>ま</rt></ruby>って ください。</b>  <br>（eki no mae de matte kudasai.）  <br>「請在車站前面等我。」","<b>「読む」的辭書形、Te-form、意思是什麼？並用它造一個請求句。</b><br><br>辭書形：<ruby>読<rt>よ</rt></ruby>む（yomu） - 意思：讀/閱讀  <br>Te-form：<ruby>読<rt>よ</rt></ruby>んで（yonde）<br><br>例句：<b>この <ruby>本<rt>ほん</rt></ruby>を <ruby>読<rt>よ</rt></ruby>んで ください。</b>  <br>（kono hon o yonde kudasai.）  <br>「請讀這本書。」","<b>「食べる」的辭書形、Te-form、意思是什麼？並用它造一個請求句。</b><br><br>辭書形：<ruby>食<rt>た</rt></ruby>べる（taberu） - 意思：吃  <br>Te-form：<ruby>食<rt>た</rt></ruby>べて（tabete）<br><br>例句：<b><ruby>毎日<rt>まいにち</rt></ruby><ruby>朝<rt>あさ</rt></ruby>ごはんを <ruby>食<rt>た</rt></ruby>べて ください。</b>  <br>（mainichi asagohan o tabete kudasai.）  <br>「請每天吃早餐。」","<b>「寝る」的辭書形、Te-form、意思是什麼？並用它造一個請求句。</b><br><br>辭書形：<ruby>寝<rt>ね</rt></ruby>る（neru） - 意思：睡覺  <br>Te-form：<ruby>寝<rt>ね</rt></ruby>て（nete）<br><br>例句：<b>10<ruby>時<rt>じ</rt></ruby>に <ruby>寝<rt>ね</rt></ruby>て ください。</b>（juuji ni nete kudasai.）  <br>「請10點睡覺。」","<b>【總結】日文的請求句型公式是什麼？</b><br><br><b>Te-form + ください</b>（kudasai） = 「請幫我做...」<br><br>例句總覽：  <br>・名前を書いてください。（請寫下名字。）  <br>・すみません、助けてください。（請幫助我。）  <br>・駅の前で待ってください。（請在車站前等我。）  <br>・この本を読んでください。（請讀這本書。）  <br>・毎日朝ごはんを食べてください。（請每天吃早餐。）  <br>・10時に寝てください。（請10點睡覺。）"],example:[{en:null,jp:"<ruby>名前<rt>なまえ</rt></ruby>を <ruby>書<rt>か</rt></ruby>いて ください。（請寫下你的名字。）",zh:null}]},{num:87,title:"Te-form Usage 2",vocab:[{t:"<ruby>水<rt>みず</rt></ruby>",m:"mizu Water（水）"},{t:"<ruby>窓<rt>まど</rt></ruby>",m:"mado Window（窗）"},{t:"開ける（あける）",m:"akeru To open（打開）"},{t:"<ruby>写真<rt>しゃしん</rt></ruby>",m:"shasin Photo（照片）"},{t:"飲む（のむ）",m:"To drink Te-form：飲んで（のんで / nonde） この水（みず）を飲（の）んでもいいですか？ （May I drink this water?） この水（みず）を飲（の）んでもいいです。 （You may drink this water.） この水（みず）を飲（の）んではいけません。 （You may not drink this water.）"},{t:"見る（みる）",m:"To see Te-form：見て（みて / mite） 教科書（きょうかしょ）を見（み）てもいいですか？ （May I see the textbook?） はい、見（み）てもいいです。 （Yes, you may.） いいえ、見（み）てはいけません。 （No, you may not.）"},{t:"とる",m:"To take (a photo) Te-form：とって（totte） あなたの写真（しゃしん）をとってもいいですか？ （May I take a photo of you?） 私（わたし）の写真（しゃしん）をとってもいいです。 （You may take a photo of me.） 私（わたし）の写真（しゃしん）をとってはいけません。 （You may not take a photo o"},{t:"開ける（あける）",m:"To open Te-form：開けて（あけて / akete） 窓（まど）を開（あ）けてもいいですか？ （May I open the window?） 窓（まど）を開（あ）けてもいいです。 （You may open the window.） 窓（まど）を開（あ）けてはいけません。 （You may not open the window.）"}],grammar:["<b>如何用「Te-form」表達</b>「可以做…」（許可）<b>的句型？</b><br><br><b>Te-form + もいいです</b>（moiidesu）  <br>用法：描述被允許做的行為，「You may do …」<br><br>例句：  <br>この<ruby>水<rt>みず</rt></ruby>を<ruby>飲<rt>の</rt></ruby>んでもいいです。  <br>（你可以喝這水。／You may drink this water.）","<b>如何用「Te-form」詢問</b>「可以…嗎？」（請求許可）<b>的句型？</b><br><br><b>Te-form + もいいですか？</b>（moiidesuka?）  <br>用法：向對方詢問許可，「May I …?」<br><br>例句：  <br><ruby>窓<rt>まど</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けてもいいですか？  <br>（我可以開窗嗎？／May I open the window?）","<b>如何用「Te-form」表達</b>「不可以…」（禁止）<b>的句型？</b><br><br><b>Te-form + はいけません</b>（waikemasen）  <br>用法：拒絕對方做某事的許可，「You may not (must not) …」<br><br>例句：  <br><ruby>私<rt>わたし</rt></ruby>の<ruby>写真<rt>しゃしん</rt></ruby>をとってはいけません。  <br>（不可以拍我的照片。／You may not take a photo of me.）","<b>【總結】Te-form 表達許可／禁止的三個句型分別是？</b><br><br><b>1. 描述被允許的行為</b>：Te-form + もいいです（moiidesu）  <br>→「You may do …」","<b>2. 詢問許可</b>：Te-form + もいいですか？（moiidesuka?）  <br>→「May I …?」","<b>3. 表達禁止</b>：Te-form + はいけません（waikemasen）  <br>→「You may not (must not) …」"],example:[]},{num:93,title:"〜ている",vocab:[{t:"料理する（りょうりする）",m:"ryourisuru To cook（做料理）"},{t:"プール",m:"pu-ru Pool（游泳池）"},{t:"<ruby>手紙<rt>てがみ</rt></ruby>",m:"tegami Letter（信）"},{t:"パンケーキ（ぱんけーき）",m:"pankeeki Pancake（鬆餅）"},{t:"動作進行中：",m:"スーは今（いま）勉強（べんきょう）しています。 Su- wa ima benkyoushite imasu. \"Sue is studying right now.\""},{t:"未來動作：",m:"スーは勉強（べんきょう）します。 Su- wa benkyoushimasu. \"Sue will study.\" ―――――― 動作進行中： たけしは本（ほん）を読（よ）んでいます。 Takeshi wa hon wo yonde imasu. \"Takeshi is reading a book.\""},{t:"未來動作：",m:"たけしは本（ほん）を読（よ）みます。 Takeshi wa hon wo yomimasu. \"Takeshi (will) reads a book.\""},{t:"読む（よむ - to read）",m:"たけしは本（ほん）を読（よ）んでいます。 Takeshi wa hon wo yonde imasu. \"Takeshi is reading a book.\""},{t:"料理する（りょうりする - to cook）",m:"私（わたし）のお母（かあ）さんは今（いま）料理（りょうり）しています。 Watashi no okaasan wa ima ryourishite imasu. \"My mother is cooking now.\""},{t:"食べる（たべる - to eat）",m:"メアリー（めありー）はパンケーキ（ぱんけーき）を食（た）べています。 Mary wa pankeeki wo tabete imasu. \"Mary is eating pancakes.\""},{t:"泳ぐ（およぐ - to swim）",m:"かなではプール（ぷーる）で泳（およ）いでいます。 Kanade wa pu-ru de oyoide imasu. \"Kanade is swimming in the pool.\""},{t:"遊ぶ（あそぶ - to play）",m:"私（わたし）はメアリー（めありー）と遊（あそ）んでいます。 Watashi wa Mary to asonde imasu. \"I am playing with Mary.\" （と＝和／與）"},{t:"書く（かく - to write）",m:"けんは手紙（てがみ）を書（か）いています。 Ken wa tegami wo kaite imasu. \"Ken is writing a letter.\""},{t:"Te-form＋いる 的兩種意思：",m:"① 動作進行中 ② 與現在有關的過去事件"},{t:"助動詞「いる」變化表：",m:"現在肯定：います（imasu）　現在否定：いません（imasen） 過去肯定：いました（imashita）　過去否定：いませんでした（imasendeshita）"}],grammar:["<b>「Te-form＋いる」代表什麼意思？（2種）</b><br><br>① <b>動作進行中</b>（An action in progress）  <br>② <b>與現在有關的過去事件</b>（A past event that is connected with the present）","<b>助動詞「いる」的時態變化（現在／過去 × 肯定／否定）？</b><br><br><b>現在肯定</b>：います（imasu）  <br><b>現在否定</b>：いません（imasen）  <br><b>過去肯定</b>：いました（imashita）  <br><b>過去否定</b>：いませんでした（imasendeshita）","<b>依語意，動詞大致可分為幾類？分別是什麼？</b><br><br>共 <b>3類</b>：  <br>(1) 表示<b>持續狀態</b>的動詞  <br>(2) 表示<b>持續一段時間的活動</b>的動詞  <br>(3) 表示<b>幾乎瞬間發生的變化</b>的動詞","<b>第①類「表示持續狀態」的動詞有哪些？其 Te-form＋いる 的用法？</b><br><br>目前學過的第①類動詞只有 <b>ある</b> 和 <b>いる</b>。  <br>這兩個動詞的 Te-form <b>從不與</b>助動詞「いる」連用，所以本節沒有相關內容可討論。","<b>第②類「表示持續一段時間活動」的動詞，其 Te-form＋いる 代表什麼意思？</b><br><br>表示<b>動作正在進行中</b>（action in progress）。  <br>許多動詞屬於此類，例如：  <br>食べる（たべる - to eat）  <br>読む（よむ - to read）  <br>待つ（まつ - to wait）","<b>「Te-form＋います」（動作進行中）與「辭書形＋ます」（未來動作）意義有何不同？請舉例說明。</b>","<b>勉強する（べんきょうする - to study）</b><br><br>スーは<ruby>今<rt>いま</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>しています。  <br>Su- wa ima benkyoushite imasu.  <br>\"Sue is studying right now.\"","<b>【總結】「Te-form＋いる」的用法與助動詞「いる」變化總表</b>"],example:[]},{num:94,title:"〜ている 2",vocab:[{t:"94課新單字整理（〜ている 2）",m:"結婚する（けっこんする）- 結婚 Tシャツ（Tしゃつ）- T恤 住む（すむ）- 居住 起きる（おきる）- 起床、醒著 勤める（つとめる）- 上班、任職 太る（ふとる）- 變胖 痩せる（やせる）- 變瘦 向かう（むかう）- 前往、朝向"},{t:"「中国に向かっています」是什麼意思？",m:"中国（ちゅうごく）に向（む）かっています。 ＝某人正在前往中國（還在路上，尚未抵達）"},{t:"「私の家に向かっています」是什麼意思？",m:"私（わたし）の家（いえ）に向（む）かっています。 ＝某人正在來我家的路上（還沒到）"}],grammar:["<b>〜ている的「いる」在現在／過去、肯定／否定時怎麼變化？</b><br><br><b>現在肯定</b>：います（imasu）  <br><b>現在否定</b>：いません（imasen）  <br><b>過去肯定</b>：いました（imashita）  <br><b>過去否定</b>：いませんでした（imasendeshita）","<b>て形+いる 可以表示哪三種意思？（本課跟93課的差異是什麼？）</b><br><br>(1) 表示<b>持續進行的動作／狀態</b>（continuous states）  <br>(2) 表示<b>持續一段時間的活動</b>（activities that last for some time）  <br>(3) 表示<b>瞬間發生的變化，變化後的結果殘留至今</b>（changes that are more or less instantaneous）<br><br>93課主要講(1)(2)類的用法；<b>94課專門講(3)類「瞬間變化動詞」</b>的〜ている用法。","<b>第三類（瞬間變化）動詞的〜ている是什麼意思？</b><br><br>這類動詞描述<b>從一個狀態瞬間變化到另一個狀態</b>（例如：結婚＝從單身變已婚）。<br><br>用〜ている時，表示<b>過去發生的變化，其結果一直持續到現在</b>，也就是「<b>結果殘留狀態</b>」，而不是「動作正在進行中」。","<b>第三類（瞬間變化）動詞有哪些常見例子？</b><br><br>持つ（もつ - motsu）- 有／拿著  <br>知る（しる - shiru）- 知道  <br>着る（きる - kiru）- 穿  <br>住む（すむ - sumu）- 住  <br>起きる（おきる - okiru）- 起床／醒著  <br>勤める（つとめる - tsutomeru）- 上班  <br>太る（ふとる - futoru）- 變胖  <br>痩せる（やせる - yaseru）- 變瘦","<b>「みのりは結婚しています」和「みのりは結婚します」意思差別？</b><br><br>みのりは<ruby>結婚<rt>けっこん</rt></ruby>しています。  <br>＝Minori 現在是<b>已婚狀態</b>（結婚＋ている＝現況・結果殘留）<br><br>みのりは<ruby>結婚<rt>けっこん</rt></ruby>します。  <br>＝Minori<b>將要結婚</b>（未來動作，用一般現在形）","<b>「みちこはTシャツを着ています」和「みちこはTシャツを着ます」意思差別？</b><br><br>みちこはTシャツ（しゃつ）を<ruby>着<rt>き</rt></ruby>ています。  <br>＝Michiko <b>現在穿著</b>T恤（現況・結果殘留）<br><br>みちこはTシャツ（しゃつ）を<ruby>着<rt>き</rt></ruby>ます。  <br>＝Michiko<b>將要穿</b>T恤（未來動作）","<b>「私は起きています」是什麼意思？</b><br><br><ruby>私<rt>わたし</rt></ruby>は起きています。  <br>＝我是<b>醒著的狀態</b>（起きる＝瞬間動作「醒來」，ている表示醒來後一直維持清醒的狀態）","<b>「さちこはユニクロで勤めています」是什麼意思？</b><br><br>さちこはユニクロで<ruby>勤<rt>つと</rt></ruby>めています。  <br>＝Sachiko<b>在UNIQLO工作</b>（現在任職於該公司，狀態的持續）","<b>行く、来る屬於第三類動詞，「行っている」「来ている」表示什麼？</b><br><br>行く（いく - to go）和来る（くる - to come）屬於第三類（瞬間變化）動詞。<br><br>「行っている」「来ている」表示<b>因先前的移動而產生的現在狀態</b>（已經去了／已經來了，現在人在那裡），<b>不是</b>「正在移動中」的意思。","<b>「中国に行っています」是什麼意思？（是不是「正在去中國」？）</b><br><br><ruby>中国<rt>ちゅうごく</rt></ruby>に<ruby>行<rt>い</rt></ruby>っています。  <br>＝某人<b>已經去了中國，現在人在中國</b>（結果殘留）  <br>❌ 不是「某人正在去中國的路上」","<b>「私の家にきています」是什麼意思？</b><br><br><ruby>私<rt>わたし</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>にきています。  <br>＝某人<b>已經來了我家，現在人在我家</b>  <br>❌ 不是「某人正在來我家的路上」","<b>如果要表達「某人正在前往／正在來你家的路上」（尚未抵達），該用哪個動詞？</b><br><br>用動詞<b><ruby>向<rt>む</rt></ruby>かう</b>（mukau，意思是「朝向、前往」）＋ています，來表示<b>正在移動、還沒到達</b>的狀態。<br><br>這跟「行っている／来ている」表示<b>已到達後的殘留狀態</b>不同。"],example:[]},{num:98,title:"Te form for joining sentences",vocab:[{t:"安い（やすい - yasui）",m:"Cheap（便宜的）"},{t:"美味しい（おいしい - oishii）",m:"Delicious（好吃的）"},{t:"広い（ひろい - hiroi）",m:"Spacious（寬敞的）"},{t:"パン（ぱん - pan）",m:"Bread（麵包）"},{t:"面白い（おもしろい - omoshiroi）",m:"Funny, Fun, Interesting（有趣的、好玩的）"}],grammar:["<b>親切な（しんせつな - shinsetsuna）</b><br><br>Kind（親切的）","<b>い形容詞、な形容詞、和「名詞＋です」的て形分別怎麼變化？て形除了原本的用法之外，還可以用來做什麼？</b><br><br>い形容詞、な形容詞和「名詞＋です」都各自有自己的て形，可以用來<b>把兩個要素連接起來，組成更長的句子</b>（例如中文的「又…又…」、「…而且…」）。<br><br>三種變化規則，並附上具體例字：<br><br>- い形容詞：把辭書形字尾的「い」換成「くて」。例：<ruby>安<rt>やす</rt></ruby>い（yasui，便宜）→<ruby>安<rt>やす</rt></ruby>くて（yasukute）<br>- 特殊形容詞いい（ii，好）：屬於不規則變化，て形是「よくて」（yokute），不是「いくて」。<br>- な形容詞：把辭書形字尾的「な」換成「で」。例：<ruby>元気<rt>げんき</rt></ruby>な（genkina，有精神）→<ruby>元気<rt>げんき</rt></ruby>で（genkide）<br>- 名詞＋です：把「です」換成「で」。例：<ruby>日本人<rt>にほんじん</rt></ruby>です（nihonjindesu）→<ruby>日本人<rt>にほんじん</rt></ruby>で（nihonjinde）<br><br>要注意的是，一個句子裡只有<b>排在前面、非句尾</b>的形容詞／名詞要改成て形；排在<b>句尾</b>的最後一個形容詞或名詞，仍然維持原本「現在肯定形」（い形容詞＋です／な形容詞＋です／名詞＋です），不需要變成て形。"],example:[{en:"Cheap and delicious.",jp:"**用て形連接兩個い形容詞，「便宜又好吃」的日文怎麼說？**",zh:"便宜又好吃。"},{en:"Clean and spacious",jp:"**用て形連接一個な形容詞和一個い形容詞，「乾淨又寬敞」的日文怎麼說？**",zh:"又乾淨又寬敞。"},{en:"Ken is Japanese and a student",jp:"**用て形連接兩個名詞＋です，「健是日本人，也是學生」的日文怎麼說？**",zh:"健是日本人，也是學生。"},{en:"Eri is energetic and fun.",jp:"**用て形連接一個な形容詞和一個い形容詞，「惠理很有精神又有趣」的日文怎麼說？**",zh:"惠理很有精神又有趣。"},{en:"Anna is Korean and 22 years old.",jp:"**用て形連接兩個名詞＋です，「安娜是韓國人，今年22歲」的日文怎麼說？**",zh:null},{en:"This bread is cheap and delicious.",jp:"**用て形連接兩個い形容詞，「這個麵包又便宜又好吃」的日文怎麼說？**",zh:"這個麵包又便宜又好吃。"},{en:"Taro is tall and quiet.",jp:"**「身體部位が形容詞」加上另一個形容詞的て形連接，「太郎個子高，個性又安靜」的日文怎麼說？**",zh:"太郎個子高，個性又安靜。"},{en:"Naomi is kind, funny and smart.",jp:"**て形可以連續連接兩個以上的形容詞或名詞，「直美很親切、有趣又聰明」的日文怎麼說？**",zh:"直美很親切、有趣又聰明。"},{en:"You can connect more than 2 adjectives and nouns by using the te-form.",jp:"**總結：て形除了連接兩個要素之外，最多可以連接幾個形容詞或名詞？**",zh:null}]},{num:106,title:"Verb stem + にいく",vocab:[{t:"デパート（でぱーと / depa-to）",m:"Department store（百貨公司）"},{t:"バッグ（ばっぐ / baggu）",m:"Bag（包包）"},{t:"街（まち / machi）",m:"Town（城鎮、街上）"},{t:"ビーチ（びーち / bi-chi）",m:"Beach（海灘）"},{t:"おばさん（obasan）",m:"Aunt（阿姨）"}],grammar:["<b>サーフィンする（さーふぃんする / sa-finsuru）</b><br><br>To surf（衝浪）","<b>文法：動詞ます形語幹＋に行く（来る／帰る）是什麼意思？</b><br><br>當一個人為了做某件事而移動到別的地方時，可以用下面這個句型描述他的移動與移動的目的：<br><br>[目的地] に／へ　[目的] に　<ruby>行<rt>い</rt></ruby>く／<ruby>来<rt>く</rt></ruby>る／<ruby>帰<rt>かえ</rt></ruby>る","<b>文法：句型中的[目的]可以是哪兩種形式？</b><br><br>[目的]可以是：<br>(1) 一個名詞，例如「<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>（かいもの - shopping，買東西）」<br>(2) 一個「動詞＋受詞」組成的短語<br><br>如果[目的]裡面含有動詞，這個動詞一定要用「語幹形」——也就是把動詞現在式長體（ます形）的「ます」拿掉之後剩下的部分。","<b>總結：動詞ます形語幹＋に行く／来る／帰る的完整公式是什麼？</b><br><br>[目的地] に／へ　[目的] に　<ruby>行<rt>い</rt></ruby>く／<ruby>来<rt>く</rt></ruby>る／<ruby>帰<rt>かえ</rt></ruby>る<br><br>如果[目的]裡面包含動詞，這個動詞一定要用「語幹」形式，也就是把動詞長體（ます形）去掉「ます」後剩下的部分，例如：「<ruby>買<rt>か</rt></ruby>います→<ruby>買<rt>か</rt></ruby>い」、「<ruby>勉強<rt>べんきょう</rt></ruby>します→<ruby>勉強<rt>べんきょう</rt></ruby>し」、「<ruby>借<rt>か</rt></ruby>ります→<ruby>借<rt>か</rt></ruby>り」、「<ruby>会<rt>あ</rt></ruby>います→<ruby>会<rt>あ</rt></ruby>い」、「サーフィンします→サーフィンし」。"],example:[{en:"I went to a department store to buy a bag.",jp:"**請翻譯並說明句型：「デパート（でぱーと）にバッグ（ばっぐ）を<ruby>買<rt>か</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きました。」**",zh:"我去百貨公司買包包了。"},{en:"Mary has come to Japan to study Japanese.",jp:"**請翻譯並說明句型：「メアリー（めありー）は<ruby>日本<rt>にほん</rt></ruby>に<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しに<ruby>来<rt>き</rt></ruby>ました。」**",zh:"瑪莉為了學日文而來了日本。"},{en:"I went to Kai's house to borrow a book.",jp:"**請翻譯並說明句型：「<ruby>私<rt>わたし</rt></ruby>はかいの<ruby>家<rt>いえ</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>を<ruby>借<rt>か</rt></ruby>りに<ruby>行<rt>い</rt></ruby>きました。」**",zh:"我去了凱的家借書。"},{en:"Akari went to the town to meet her aunt.",jp:"**請翻譯並說明句型：「あかりは<ruby>街<rt>まち</rt></ruby>におばさんに<ruby>会<rt>あ</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きました。」**",zh:"明里為了見阿姨而去了街上。"},{en:"Nana went to the beach to surf.",jp:"**請翻譯並說明句型：「ななはビーチ（びーち）にサーフィン（さーふぃん）しに<ruby>行<rt>い</rt></ruby>きました。」**",zh:"娜娜為了衝浪而去了海邊。"}]}],"adj":[{num:74,title:"い Adjectives",vocab:[{t:"小さい（ちいさい - chiisai）是什麼意思？",m:"意思：小的（Small）"},{t:"美味しい（おいしい - oishii）是什麼意思？",m:"意思：好吃的（Delicious）"},{t:"寒い（さむい - samui）是什麼意思？",m:"意思：冷的（Cold）"},{t:"暑い（あつい - atsui）是什麼意思？",m:"意思：熱的（Hot）"},{t:"い形容詞變化總表（字尾 ーい）：",m:"現在肯定：ーいです。例：面白いです。(omoshiroidesu.) 現在否定：ーくないです。例：面白くないです。(omoshirokunaidesu.) 過去肯定：ーかったです。例：面白かったです。(omoshirokattadesu.) 過去否定：ーくなかったです。例：面白くなかったです。(omoshirokunakattadesu.)"}],grammar:["<b>日文形容詞分為哪兩種？名稱從何而來？</b><br><br>日文中的形容詞分為兩種：  <br>(1) い形容詞（い-adjectives）  <br>(2) な形容詞（な-adjectives）  <br>兩者名稱皆來自其字尾：修飾名詞時，字尾分別是「い」或「な」。","<b>い形容詞（字尾為「い」）的現在肯定、現在否定、過去肯定、過去否定怎麼變化？</b><br><br>規則（字尾 ーい，即 ーi）：  <br><b>現在肯定</b>：ーいです。(-idesu.)  <br><b>現在否定</b>：ーくないです。(-kunaidesu.)  <br><b>過去肯定</b>：ーかったです。(-kattadesu.)  <br><b>過去否定</b>：ーくなかったです。(-kunakattadesu.)","<b>面白い（おもしろい - omoshiroi）是什麼意思？它的四種變化形是？</b><br><br>意思：有趣的、好笑的（Interesting, Funny）  <br><b>現在肯定</b>：面白いです。(omoshiroidesu.)  <br><b>現在否定</b>：面白くないです。(omoshirokunaidesu.)  <br><b>過去肯定</b>：面白かったです。(omoshirokattadesu.)  <br><b>過去否定</b>：面白くなかったです。(omoshirokunakattadesu.)","<b>怖い（こわい - kowai）是什麼意思？它的四種變化形是？</b><br><br>意思：可怕的（Scary）  <br><b>現在肯定</b>：怖いです。(kowaidesu.)  <br><b>現在否定</b>：怖くないです。(kowakunaidesu.)  <br><b>過去肯定</b>：怖かったです。(kowakattadesu.)  <br><b>過去否定</b>：怖くなかったです。(kowakunakattadesu.)","<b>大きい（おおきい - ookii）是什麼意思？它的四種變化形是？</b><br><br>意思：大的（Big, Large）  <br><b>現在肯定</b>：大きいです。(ookiidesu.)  <br><b>現在否定</b>：大きくないです。(ookikunaidesu.)  <br><b>過去肯定</b>：大きかったです。(ookikattadesu.)  <br><b>過去否定</b>：大きくなかったです。(ookikunakattadesu.)","<b>請整理い形容詞的四種變化形（現在肯定、現在否定、過去肯定、過去否定），並以「面白い」為例。</b>"],example:[{en:null,jp:"美味しい（おいしい - oishii）－ 好吃的",zh:null},{en:null,jp:"寒い（さむい - samui）－ 冷的",zh:null},{en:null,jp:"小さい（ちいさい - chiisai）－ 小的",zh:null},{en:null,jp:"暑い（あつい - atsui）－ 熱的",zh:null}]},{num:75,title:"な Adjectives",vocab:[{t:"な形容詞的現在/過去・肯定/否定要怎麼變化？",m:"（跟い形容詞有什麼不同？）"},{t:"ーな (ー na)",m:"肯定・現在：ーです。 (ー desu.) 否定・現在：ーじゃないです。 (ー janaidesu.) 肯定・過去：ーでした。 (ー deshita.) 否定・過去：ーじゃなかったです。 (ー janakattadesu.)"},{t:"な-Adjectives 變化總表",m:"（現在/過去 × 肯定/否定）"},{t:"元気な",m:"げんきな - genkina Cheerful, Energetic 現在肯定：元気（げんき）です。 (genki desu.) 現在否定：元気（げんき）じゃないです。 (genki janaidesu.) 過去肯定：元気（げんき）でした。 (genki deshita.) 過去否定：元気（げんき）じゃなかったです。 (genki janakattadesu.)"},{t:"有名な",m:"ゆうめいな - yuumeina Famous 現在肯定：有名（ゆうめい）です。 (yuumei desu.) 現在否定：有名（ゆうめい）じゃないです。 (yuumei janaidesu.) 過去肯定：有名（ゆうめい）でした。 (yuumei deshita.) 過去否定：有名（ゆうめい）じゃなかったです。 (yuumei janakattadesu.)"},{t:"綺麗な",m:"きれいな - kireina Beautiful 現在肯定：綺麗（きれい）です。 (kirei desu.) 現在否定：綺麗（きれい）じゃないです。 (kirei janaidesu.) 過去肯定：綺麗（きれい）でした。 (kirei deshita.) 過去否定：綺麗（きれい）じゃなかったです。 (kirei janakattadesu.)"},{t:"静かな",m:"しずかな - shizukana Quiet 現在肯定：静か（しずか）です。 (shizuka desu.) 現在否定：静か（しずか）じゃないです。 (shizuka janaidesu.) 過去肯定：静か（しずか）でした。 (shizuka deshita.) 過去否定：静か（しずか）じゃなかったです。 (shizuka janakattadesu.) 例句：図書館（としょかん）は静（しず）かで"},{t:"人気な",m:"にんきな - ninkina Popular 現在肯定：人気（にんき）です。 (ninki desu.) 現在否定：人気（にんき）じゃないです。 (ninki janaidesu.) 過去肯定：人気（にんき）でした。 (ninki deshita.) 過去否定：人気（にんき）じゃなかったです。 (ninki janakattadesu.) 例句：このレストランは人気（にんき）じゃないです。 (ko"},{t:"危険な",m:"きけんな - kikenna Dangerous 現在肯定：危険（きけん）です。 (kiken desu.) 現在否定：危険（きけん）じゃないです。 (kiken janaidesu.) 過去肯定：危険（きけん）でした。 (kiken deshita.) 過去否定：危険（きけん）じゃなかったです。 (kiken janakattadesu.) 例句：この家（いえ）は危険（きけん）でした。 (kon"},{t:"便利な",m:"べんりな - benrina Convenient 現在肯定：便利（べんり）です。 (benri desu.) 現在否定：便利（べんり）じゃないです。 (benri janaidesu.) 過去肯定：便利（べんり）でした。 (benri deshita.) 過去否定：便利（べんり）じゃなかったです。 (benri janakattadesu.) 例句：道具（どうぐ）は便利（べんり）じゃなかったです"}],grammar:["<b>な形容詞的變化，跟「名詞＋です」完全一樣</b>（不是像い形容詞那樣字尾自己變化）。  <br>但要注意：接です／でした時，字尾的「な」要<b>去掉</b>（例：元気な→元気です，不是元気なです）。","<b>Tense / Affirmative / Negative</b><br><br>現在肯定：ーです。 (ー desu.)  <br>現在否定：ーじゃないです。 (ー janaidesu.)<br><br>過去肯定：ーでした。 (ー deshita.)  <br>過去否定：ーじゃなかったです。 (ー janakattadesu.)<br><br>範例（元気な）：  <br>元気です／元気じゃないです  <br>元気でした／元気じゃなかったです"],example:[]},{num:76,title:"Irregular Adjectives",vocab:[{t:"不規則形容詞的規則",m:"い形容詞的活用基本上是規則的，但有一個例外形容詞，它的變化規則是什麼？ 例外是 いい（良い）- Good。 いい 的第一個音節「い」，除了辭書形和現在肯定（禮貌）形以外，其餘所有活用形都會變成「よ」。"}],grammar:["**下列不規則形容詞（いい系，表示「好的」）的發音和意思是什麼？  <br>良い／かっこいい／心地いい**<br><br>・良い（いい, ii）- Good  <br>・かっこいい（kakkoii）- Handsome  <br>・心地いい（ここちいい, kokochiii）- Comfortable","<b>「</b>良い（いい）<b> - Good」的現在式・過去式（肯定・否定）是？</b><br><br><b>現在肯定:</b> いいです。(iidesu.)  <br><b>現在否定:</b> よくないです。(yokunaidesu.)  <br><b>過去肯定:</b> よかったです。(yokattadesu.)  <br><b>過去否定:</b> よくなかったです。(yokunakattadesu.)","<b>「</b>かっこいい<b> - Handsome」的現在式・過去式（肯定・否定）是？</b><br><br><b>現在肯定:</b> かっこいいです。(kakkoiidesu.)  <br><b>現在否定:</b> かっこよくないです。(kakkoyokunai.)  <br><b>過去肯定:</b> かっこよかったです。(kakkoyokattadesu.)  <br><b>過去否定:</b> かっこよくなかったです。(kakkoyokunakattadesu.)","<b>「</b>心地いい（ここちいい）<b> - Comfortable」的現在式・過去式（肯定・否定）是？</b><br><br><b>現在肯定:</b> <ruby>心地<rt>ここち</rt></ruby>いいです。(kokochiiidesu.)  <br><b>現在否定:</b> <ruby>心地<rt>ここち</rt></ruby>よくないです。(kokochiyokunai.)  <br><b>過去肯定:</b> <ruby>心地<rt>ここち</rt></ruby>よかったです。(kokochiyokattadesu.)  <br><b>過去否定:</b> <ruby>心地<rt>ここち</rt></ruby>よくなかったです。(kokochiyokunakattadesu.)","<b>不規則形容詞（いい系）的三種活用模式歸納起來是？</b><br><br><b>規則:</b> 第一個「い」除了辭書形和現在肯定形以外，其餘全部變成「よ」。<br><br><b>良い(いい):</b> いいです／よくないです／よかったです／よくなかったです  <br><b>かっこいい:</b> かっこいいです／かっこよくないです／かっこよかったです／かっこよくなかったです  <br><b>心地いい:</b> 心地いいです／心地よくないです／心地よかったです／心地よくなかったです","<b>中文補充筆記：為什麼「いい」特別？</b><br><br>- い形容詞的變化通常很規則(例：高い→高くない→高かった),但「いい(良い)- 好的」是唯一例外。<br>- 「いい」其實是「よい」的口語變體,兩者現代日文都存在(「よい」較文語/書面)。<br>- 肯定形習慣用口語的「いい」,但否定形、過去形則「回歸」書面語「よい」的語幹「よ」再變化。<br>- 記憶口訣：只有句尾直接肯定時保持「いい」原樣,其他時候前面的「い」全部變成「よ」,再套用一般い形容詞公式(よ+くない／よ+かった／よ+くなかった)。<br><br>|                | 辭書形     | 現在肯定       | 現在否定           | 過去肯定           | 過去否定               |<br>| -------------- | ---------- | -------------- | ------------------ | ------------------ | ---------------------- |<br>| 良い(好)       | いい       | いいです       | よくないです       | よかったです       | よくなかったです       |<br>| かっこいい(帥) | かっこいい | かっこいいです | かっこよくないです | かっこよかったです | かっこよくなかったです |<br>| 心地いい(舒服) | 心地いい   | 心地いいです   | 心地よくないです   | 心地よかったです   | 心地よくなかったです   |"],example:[]},{num:77,title:"すきな、きらいな",vocab:[{t:"春",m:"はる (haru) 春天 (Spring)"},{t:"夏",m:"なつ (natsu) 夏天 (Summer)"},{t:"秋",m:"あき (aki) 秋天 (Autumn)"},{t:"冬",m:"ふゆ (fuyu) 冬天 (Winter)"},{t:"季節",m:"きせつ (kisetsu) 季節 (Seasons)"},{t:"好き",m:"すき (suki) 喜歡 (to like) - な形容詞"},{t:"嫌い",m:"きらい (kirai) 不喜歡、討厭 (to dislike) - な形容詞"},{t:"「X喜歡Y」的句型是？",m:"X は Y が 好（す）きです。 (X wa Y ga sukidesu.) ＝ X likes Y"},{t:"「X不喜歡Y」的句型是？",m:"X は Y が 嫌（きら）いです。 (X wa Y ga kiraidesu.) ＝ X dislikes Y"},{t:"總表：「すき／きらい」句型比較",m:""},{t:"總表：關於すき／きらい的3個補充重點",m:"(1) 強調「非常喜歡/討厭」可用だいすき或だいきらい。 (2) 表達「不喜歡也不討厭」：好きでも嫌いでもありません。 (3) すきな和きらいな可作為名詞修飾語（放在名詞前）。 (4) 用「好(だい)きです」表達對某個人的非常喜歡"}],grammar:["<b>「すき」和「きらい」是什麼詞類？各自的意思是？</b><br><br>都是<b>な形容詞</b>（な-adjective）  <br>好き（すき）な → 喜歡的 (to be fond of; to like)  <br>嫌い（きらい）な → 討厭的 (to be disgusted with; to dislike)","<b>用「すき／きらい」表達喜好時，句子需要哪兩個要素？分別搭配什麼助詞？</b><br><br>需要兩個對象：  <br>(1) 喜歡/不喜歡某事物的<b>人</b> → 搭配助詞「は」  <br>(2) 被喜歡/不喜歡的<b>人或事物</b> → 搭配助詞「が」<br><br>規則：  <br>「は」接在喜歡/不喜歡某事物的<b>人</b>後面。  <br>「が」接在被喜歡/不喜歡的<b>事物或人</b>後面。","<b>用「好きです」表達對某個人的喜歡時要注意什麼？</b><br><br>被喜歡/不喜歡的對象也可以是<b>人</b>。  <br>但要小心：對特定的人說「<ruby>好<rt>す</rt></ruby>きです」通常會被理解為<b>告白／有戀愛意味</b>（romantic interest），使用時要謹慎。","<b>如何表達「非常喜歡／非常不喜歡」某事物？</b><br><br>使用強調形：  <br><b>だいすきです</b>（daisukidesu）＝ X likes Y very much  <br><b>だいきらいです</b>（daikiraidesu）＝ X dislikes Y very much<br><br>這種形式比「すき（な）／きらい（な）＋とても」的組合更常用。","<b>如何表達「不喜歡也不討厭（沒有特別感覺）」？</b><br><br><b><ruby>好<rt>す</rt></ruby>きでも<ruby>嫌<rt>きら</rt></ruby>いでもありません。</b>  <br>(suki demo kirai demo arimasen.)  <br>＝ I neither like nor dislike (it).","<b>X喜歡Y：</b> X は Y が <ruby>好<rt>す</rt></ruby>きです。（sukidesu）  <br><b>X不喜歡Y：</b> X は Y が <ruby>嫌<rt>きら</rt></ruby>いです。（kiraidesu）<br><br>助詞規則：  <br>「は」→ 接喜歡/不喜歡的<b>人</b>  <br>「が」→ 接被喜歡/不喜歡的<b>人或事物</b>"],example:[{en:null,jp:"這是我喜歡的電視節目。",zh:"這是我喜歡的電視節目。"},{en:null,jp:"**請翻譯：「Robert likes his Japanese classes.」**",zh:null},{en:null,jp:"**請翻譯：「I dislike fish.」**",zh:null},{en:null,jp:"**請翻譯：「My younger sister likes summer.」**",zh:null},{en:null,jp:"**請翻譯：「Do you like winter?」**",zh:null},{en:null,jp:"**請翻譯（強調形）：「I like Spring very much.」**",zh:null},{en:null,jp:"**請翻譯：「I also like autumn very much.」（提示：用「も」取代助詞）**",zh:null}]},{num:78,title:"Degree Expressions",vocab:[{t:"程度副詞一律放在形容詞之前",m:"とても (totemo) = 很／非常（高程度） ちょっと (chotto) = 一點點／稍微（低程度）"}],grammar:["<b>な形容詞 すき（喜歡）和 きらい（討厭）要表示「非常喜歡／非常討厭」時，用法上有什麼特別之處？</b><br><br>すき(な)、きらい(な) <b>不加とても</b>，而是有自己專屬的加強形式：<br><br>大好き（だいすき）(な) = 非常喜歡  <br>大嫌い（だいきらい）(な) = 非常討厭","<b>「たけしさんはコーヒーが<ruby>大好<rt>だいす</rt></ruby>きです。」是什麼意思？還有其他說法嗎？</b><br><br>たけしさんはコーヒー（こーひー）が<ruby>大好<rt>だいす</rt></ruby>きです。  <br>= 武志先生非常喜歡咖啡。<br><br>也可以說：  <br>たけしさんはコーヒーがとても<ruby>好<rt>す</rt></ruby>きです。  <br>（用「とても＋好き」表達相同意思）","<b>整理：日文</b>程度副詞<b>對照表（とても vs ちょっと）</b>"],example:[{en:null,jp:"とても<ruby>暑<rt>あつ</rt></ruby>い（很熱）／ちょっと<ruby>暑<rt>あつ</rt></ruby>い（有點熱）",zh:"（沖繩的海非常美麗。）"}]},{num:102,title:"(Body part)が(adjective)です",vocab:[{t:"日文如何表達「某人有某種身體特徵」？",m:"例如：Tom has long hair."},{t:"Eyes",m:"目（め - me）"},{t:"Legs",m:"足（あし - ashi）"},{t:"Hair",m:"髪（かみ - kami）"},{t:"Head",m:"頭（あたま - atama）"},{t:"Height (for a person)",m:"背（せ - se）"},{t:"Face",m:"顔（かお - kao）"},{t:"Mouth",m:"口（くち - kuchi）"},{t:"Nose",m:"鼻（はな - hana）"},{t:"Tom has long hair.",m:"とむは髪（かみ）が長（なが）いです。 Tom wa kami ga nagaidesu."},{t:"Kenta has long legs.",m:"けんたは足（あし）が長（なが）いです。 kenta wa ashi ga nagaidesu."},{t:"Akiko has a small nose.",m:"あきこは鼻（はな）が小（ちい）さいです。 akiko wa hana ga chiisaidesu."},{t:"Yoko is tall.",m:"ようこは背（せ）が高（たか）いです。 youko wa se ga takaidesu."},{t:"My mother is short.",m:"私（わたし）のお母（かあ）さんは背（せ）が低（ひく）いです。 watashi no okaasan wa se ga hikuidesu."},{t:"Mary has small eyes.",m:"メアリーは目（め）が小（ちい）さいです。 meari- wa me ga chiisaidesu."},{t:"Taro is smart.",m:"たろうは頭（あたま）が良（い）いです。 tarou wa atama ga iidesu."},{t:"Is Kiyoshi tall?",
