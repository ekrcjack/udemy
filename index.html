Taka wa watashi ni eigo o hanasasete kuremasen deshita.","say":"たかは私に英語を話させてくれませんでした。"},{"en":"I think I will let Kai go to Spain.","jp":"<ruby>私<rt>わたし</rt></ruby>はかいをスペインに<ruby>行<rt>い</rt></ruby>かせてあげるつもりです。","rj":"Watashi wa Kai o Supein ni ikasete ageru tsumori desu.","say":"私はかいをスペインに行かせてあげるつもりです。"},{"en":"Please let me do this job.","jp":"<ruby>私<rt>わたし</rt></ruby>にこの<ruby>仕事<rt>しごと</rt></ruby>をさせてください。","rj":"Watashi ni kono shigoto o sasete kudasai.","say":"私にこの仕事をさせてください。"},{"en":"My parent did not let me keep (own) a dog.","jp":"<ruby>両親<rt>りょうしん</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>に<ruby>犬<rt>いぬ</rt></ruby>を<ruby>飼<rt>か</rt></ruby>わせてくれませんでした。","rj":"Ryoushin wa watashi ni inu o kawasete kuremasen deshita.","say":"両親は私に犬を飼わせてくれませんでした。"},{"en":"My father will not let me live alone.","jp":"お<ruby>父<rt>とう</rt></ruby>さんは<ruby>私<rt>わたし</rt></ruby>に<ruby>一人暮<rt>ひとりぐ</rt></ruby>らしさせてくれません。","rj":"Otousan wa watashi ni hitorigurashi sasete kuremasen.","say":"お父さんは私に一人暮らしさせてくれません。"},{"en":"Ken let me play his guitar yesterday.","jp":"<ruby>昨日<rt>きのう</rt></ruby>けんにギターを<ruby>弾<rt>ひ</rt></ruby>かせてもらいました。","rj":"Kinou Ken ni gita- o hikasete moraimashita.","say":"昨日けんにギターを弾かせてもらいました。"},{"en":"I will let Mia use my laptop.","jp":"みあにパソコンを<ruby>使<rt>つか</rt></ruby>わせてあげます。","rj":"Mia ni pasokon o tsukawasete agemasu.","say":"みあにパソコンを使わせてあげます。"},{"en":"Please let me eat this pasta.","jp":"このパスタを<ruby>食<rt>た</rt></ruby>べさせてください。","rj":"Kono pasuta o tabesasete kudasai.","say":"このパスタを食べさせてください。"},{"en":"Please let me take a break.","jp":"<ruby>休憩<rt>きゅうけい</rt></ruby>させてください。","rj":"Kyuukei sasete kudasai.","say":"休憩させてください。"}]},{"num":258,"title":"Verb Stem + なさい (Command)","vocab":[{"t":"起きる（おきる）","m":"okiru 意思：起床 (to wake up)","say":"起きる（おきる）"},{"t":"にんじん（にんじん）","m":"ninjin 意思：紅蘿蔔 (carrot)","say":"にんじん（にんじん）"},{"t":"シャツ（しゃつ）","m":"shatsu 意思：襯衫 (shirt)","say":"シャツ（しゃつ）"},{"t":"空欄（くうらん）","m":"kuuran 意思：空格 (blank)","say":"空欄（くうらん）"},{"t":"単語（たんご）","m":"tango 意思：單字 (word)","say":"単語（たんご）"},{"t":"入れる（いれる）","m":"ireru 意思：放入 (to put in, fill in)","say":"入れる（いれる）"}],"grammar":["<b>動詞ます形語幹＋なさい 是什麼意思？</b><br><br>表示強烈的命令語氣，相當於英文「Do…（命令）」。句型：[動詞ます形語幹]＋なさい。","<b>使用〜なさい 有什麼限制？</b><br><br>なさい帶有明顯「居高臨下」的語感——說話者自認地位較高、較成熟、對方應該服從。因此只適合父母對子女、老師對學生使用（也常見於考卷答題指示中），不可對長輩、平輩、陌生人使用，否則非常失禮。なさい只有肯定形，沒有對應的否定命令形式；若要表達禁止，需改用「て形＋はいけません」。"],"example":[{"en":"Call home everyday.","jp":"<ruby>毎日<rt>まいにち</rt></ruby>うちに<ruby>電話<rt>でんわ</rt></ruby>しなさい。","rj":"Mainichi uchi ni denwa shinasai.","say":"毎日うちに電話しなさい。"},{"en":"Listen to what the teacher has to say.","jp":"<ruby>先生<rt>せんせい</rt></ruby>の<ruby>言<rt>い</rt></ruby>うことを<ruby>聞<rt>き</rt></ruby>きなさい。","rj":"Sensei no iu koto o kikinasai.","say":"先生の言うことを聞きなさい。"},{"en":"Fill in the blanks with a word.","jp":"<ruby>空欄<rt>くうらん</rt></ruby>に<ruby>単語<rt>たんご</rt></ruby>を<ruby>入<rt>い</rt></ruby>れなさい。","rj":"Kuuran ni tango o irenasai.","say":"空欄に単語を入れなさい。"},{"en":"Wake up.","jp":"<ruby>起<rt>お</rt></ruby>きなさい。","rj":"Okinasai.","say":"起きなさい。"},{"en":"Go to school.","jp":"<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きなさい。","rj":"Gakkou ni ikinasai.","say":"学校に行きなさい。"},{"en":"Eat carrots.","jp":"にんじんを<ruby>食<rt>た</rt></ruby>べなさい。","rj":"Ninjin o tabenasai.","say":"にんじんを食べなさい。"},{"en":"Wear this shirt.","jp":"このシャツを<ruby>着<rt>き</rt></ruby>なさい。","rj":"Kono shatsu o kinasai.","say":"このシャツを着なさい。"},{"en":"Speak in Japanese.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>しなさい。","rj":"Nihongo o hanashinasai.","say":"日本語を話しなさい。"}]},{"num":259,"title":"〜ば (Conditional Statement)","vocab":[{"t":"鍵をかける（かぎをかける）","m":"kagi o kakeru 意思：上鎖 (to lock)","say":"鍵をかける（かぎをかける）"},{"t":"泥棒（どろぼう）","m":"dorobou 意思：小偷 (thief)","say":"泥棒（どろぼう）"},{"t":"入られる（はいられる）","m":"hairareru 意思：被闖入（受身形） (to have (a place) broken into)","say":"入られる（はいられる）"},{"t":"大家さん（おおやさん）","m":"ooyasan 意思：房東 (landlord)","say":"大家さん（おおやさん）"},{"t":"眠たい（ねむたい）","m":"nemutai 意思：想睡的 (sleepy)","say":"眠たい（ねむたい）"},{"t":"タクシー（たくしー）","m":"takushi- 意思：計程車 (taxi)","say":"タクシー（たくしー）"},{"t":"間に合う（まにあう）","m":"maniau 意思：趕得上 (to be on time)","say":"間に合う（まにあう）"},{"t":"前もって（まえもって）","m":"maemotte 意思：事先 (in advance)","say":"前もって（まえもって）"},{"t":"予約する（よやくする）","m":"yoyaku suru 意思：預約 (to make a reservation)","say":"予約する（よやくする）"},{"t":"プロジェクト（ぷろじぇくと）","m":"purojekuto 意思：專案 (project)","say":"プロジェクト（ぷろじぇくと）"},{"t":"完成する（かんせいする）","m":"kansei suru 意思：完成 (to be completed)","say":"完成する（かんせいする）"}],"grammar":["<b>ば形是什麼？各詞性要怎麼變化？</b><br><br>ば是表示假定的句型之一，「A ば B」是「如果A，就會B」。動詞：現在式常體肯定去掉語尾u，改為eba（読む→読めば）。い形容詞：語幹（去い）＋ければ（面白い→面白ければ）。否定形（所有詞性）：現在式常體否定去掉い，改為ければ。","<b>な形容詞、名詞的「肯定」假定，為什麼不用ば形？</b><br><br>な形容詞、名詞的肯定假定不用ば形，改用「なら」或「ならば」：学生なら／ならば、元気なら／ならば。ばAB通常用於「A這個條件能保證B會有好結果」的情境，因此常帶有建議A該怎麼做的語氣。"],"example":[{"en":"If you have a car, you can go to various places.","jp":"<ruby>車<rt>くるま</rt></ruby>があれば、色々(いろいろ)なところに<ruby>行<rt>い</rt></ruby>けます。","rj":"Kuruma ga areba, iroiro na tokoro ni ikemasu.","say":"車があれば、色々なところに行けます。"},{"en":"If you lock the door, you won't have your apartment broken into.","jp":"<ruby>鍵<rt>かぎ</rt></ruby>をかけておけば、<ruby>泥棒<rt>どろぼう</rt></ruby>に<ruby>入<rt>はい</rt></ruby>られません。","rj":"Kagi o kakete okeba, dorobou ni hairaremasen.","say":"鍵をかけておけば、泥棒に入られません。"},{"en":"If you do not tell the landlord, he will never find that out.","jp":"<ruby>大家<rt>おおや</rt></ruby>さんに<ruby>言<rt>い</rt></ruby>わなければ、<ruby>分<rt>わ</rt></ruby>かりませんよ。","rj":"Ooyasan ni iwanakereba, wakarimasen yo.","say":"大家さんに言わなければ、分かりませんよ。"},{"en":"You will be okay if you take this medicine.","jp":"この<ruby>薬<rt>くすり</rt></ruby>を<ruby>飲<rt>の</rt></ruby>めば、<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>です。","rj":"Kono kusuri o nomeba, daijoubu desu.","say":"この薬を飲めば、大丈夫です。"},{"en":"All you have to do is ask the teacher.","jp":"<ruby>先生<rt>せんせい</rt></ruby>に<ruby>聞<rt>き</rt></ruby>けば、いいんです。","rj":"Sensei ni kikeba, iin desu.","say":"先生に聞けば、いいんです。"},{"en":"If you sleep early, you won't be sleepy tomorrow.","jp":"<ruby>早<rt>はや</rt></ruby>く<ruby>寝<rt>ね</rt></ruby>れば、<ruby>明日<rt>あした</rt></ruby><ruby>眠<rt>ねむ</rt></ruby>たくなりません。","rj":"Hayaku nereba, ashita nemutaku narimasen.","say":"早く寝れば、明日眠たくなりません。"},{"en":"If you take a taxi, you will be on time.","jp":"タクシーに<ruby>乗<rt>の</rt></ruby>れば、<ruby>間<rt>ま</rt></ruby>に<ruby>合<rt>あ</rt></ruby>います。","rj":"Takushii ni noreba, maniaimasu.","say":"タクシーに乗れば、間に合います。"},{"en":"If we make a reservation in advance, we will be all right.","jp":"<ruby>前<rt>まえ</rt></ruby>もって<ruby>予約<rt>よやく</rt></ruby>すれば、<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>です。","rj":"Maemotte yoyaku sureba, daijoubu desu.","say":"前もって予約すれば、大丈夫です。"},{"en":"If you work overtime, the project will be completed.","jp":"<ruby>残業<rt>ざんぎょう</rt></ruby>すれば、プロジェクトは<ruby>完成<rt>かんせい</rt></ruby>します。","rj":"Zangyou sureba, purojekuto wa kansei shimasu.","say":"残業すれば、プロジェクトは完成します。"}]},{"num":260,"title":"〜のに (Even though...)","vocab":[{"t":"会社（かいしゃ）","m":"kaisha 意思：公司 (company)","say":"会社（かいしゃ）"},{"t":"給料（きゅうりょう）","m":"kyuuryou 意思：薪水 (salary)","say":"給料（きゅうりょう）"},{"t":"低い（ひくい）","m":"hikui 意思：低的 (low)","say":"低い（ひくい）"},{"t":"電話に出る（でんわにでる）","m":"denwa ni deru 意思：接電話 (to answer the phone)","say":"電話に出る（でんわにでる）"},{"t":"嫌いな（きらいな）","m":"kirai na 意思：討厭的 (to dislike)","say":"嫌いな（きらいな）"},{"t":"相談する（そうだんする）","m":"soudan suru 意思：商量 (to consult)","say":"相談する（そうだんする）"},{"t":"期末試験（きまつしけん）","m":"kimatsu shiken 意思：期末考 (final exam)","say":"期末試験（きまつしけん）"},{"t":"練習する（れんしゅうする）","m":"renshuu suru 意思：練習 (to practice)","say":"練習する（れんしゅうする）"},{"t":"負ける（まける）","m":"makeru 意思：輸 (to lose)","say":"負ける（まける）"},{"t":"勝つ（かつ）","m":"katsu 意思：贏 (to win)","say":"勝つ（かつ）"}],"grammar":["<b>〜のに 是什麼意思？</b><br><br>のに用來連接兩個「在預期之外同時成立」的事實A、B，相當於中文「明明…卻…、儘管…」。句型：[事實A（常體）]＋のに、[出乎意料的事實B]。","<b>な形容詞、名詞接續 のに 時要注意什麼？</b><br><br>若Fact A是な形容詞或名詞＋です，且為現在式肯定，語尾的「だ」要改成「な」（僅限現在肯定，過去式、否定式不變）：親切だ→親切なのに、問題だ→問題なのに。","<b>為什麼 B 子句不能是請求句或提議句？</b><br><br>因為のに連接的是兩個「事實」，所以B子句不能是非事實性質的句子，例如請求（てください）或提議（ましょう）都不可以接在のに後面，這種情境應該改用「けど」（雖然…但是…，語氣較中性、不強調「事實對比」）。"],"example":[{"en":"This company is rich, but its workers' salary is low.","jp":"この<ruby>会社<rt>かいしゃ</rt></ruby>はお<ruby>金<rt>かね</rt></ruby>があるのに、<ruby>給料<rt>きゅうりょう</rt></ruby>は<ruby>低<rt>ひく</rt></ruby>いです。","rj":"Kono kaisha wa okane ga aru noni, kyuuryou wa hikui desu.","say":"この会社はお金があるのに、給料は低いです。"},{"en":"She is home but does not answer the phone.","jp":"<ruby>家<rt>いえ</rt></ruby>にいるのに、<ruby>電話<rt>でんわ</rt></ruby>にでない。","rj":"Ie ni iru noni, denwa ni denai.","say":"家にいるのに、電話にでない。"},{"en":"Ken is nice, but Miki does not like him.","jp":"けんは<ruby>親切<rt>しんせつ</rt></ruby>なのに、みきはけんが<ruby>嫌<rt>きら</rt></ruby>いです。","rj":"Ken wa shinsetsu na noni, Miki wa Ken ga kirai desu.","say":"けんは親切なのに、みきはけんが嫌いです。"},{"en":"It is a big issue, but he does not consult with anybody.","jp":"<ruby>大<rt>おお</rt></ruby>きい<ruby>問題<rt>もんだい</rt></ruby>なのに、あの<ruby>人<rt>ひと</rt></ruby>はだれにも<ruby>相談<rt>そうだん</rt></ruby>しません。","rj":"Ookii mondai na noni, ano hito wa dare ni mo soudan shimasen.","say":"大きい問題なのに、あの人はだれにも相談しません。"},{"en":"This Japanese is a bit difficult, but please read it.","jp":"<ruby>少<rt>すこ</rt></ruby>し<ruby>難<rt>むずか</rt></ruby>しいけど、これを<ruby>読<rt>よ</rt></ruby>んでください。","rj":"Sukoshi muzukashii kedo, kore o yonde kudasai.","say":"少し難しいけど、これを読んでください。"},{"en":"The food does not look very promising, but let's eat here.","jp":"あまり<ruby>美味<rt>おい</rt></ruby>しそうじゃないけど、ここで<ruby>食<rt>た</rt></ruby>べましょう。","rj":"Amari oishisou ja nai kedo, koko de tabemashou.","say":"あまり美味しそうじゃないけど、ここで食べましょう。"},{"en":"Although I have a final exam today, I did not study.","jp":"<ruby>今日<rt>きょう</rt></ruby><ruby>期末試験<rt>きまつしけん</rt></ruby>があるのに、<ruby>勉強<rt>べんきょう</rt></ruby>しませんでした。","rj":"Kyou kimatsushiken ga aru noni, benkyou shimasen deshita.","say":"今日期末試験があるのに、勉強しませんでした。"},{"en":"Although I practiced everyday, we lost.","jp":"<ruby>毎日<rt>まいにち</rt></ruby><ruby>練習<rt>れんしゅう</rt></ruby>したのに、<ruby>負<rt>ま</rt></ruby>けました。","rj":"Mainichi renshuu shita noni, makemashita.","say":"毎日練習したのに、負けました。"},{"en":"Although I did not practice everyday, I won.","jp":"<ruby>毎日<rt>まいにち</rt></ruby><ruby>練習<rt>れんしゅう</rt></ruby>しなかったのに、<ruby>勝<rt>か</rt></ruby>ちました。","rj":"Mainichi renshuu shinakatta noni, kachimashita.","say":"毎日練習しなかったのに、勝ちました。"},{"en":"Although I gave Ken a present, he did not say thank you.","jp":"けんにプレゼントをあげたのに、けんはありがとうと<ruby>言<rt>い</rt></ruby>いませんでした。","rj":"Ken ni purezento o ageta noni, Ken wa arigatou to iimasen deshita.","say":"けんにプレゼントをあげたのに、けんはありがとうと言いませんでした。"}]},{"num":261,"title":"〜のような・〜のように (Like...)","vocab":[{"t":"鎌倉（かまくら）","m":"kamakura 意思：鎌倉（地名） (Kamakura)","say":"鎌倉（かまくら）"},{"t":"魚（さかな）","m":"sakana 意思：魚 (fish)","say":"魚（さかな）"},{"t":"上手な（じょうずな）","m":"jouzu na 意思：擅長的 (good at)","say":"上手な（じょうずな）"},{"t":"泳ぐ（およぐ）","m":"oyogu 意思：游泳 (to swim)","say":"泳ぐ（およぐ）"},{"t":"壊れた（こわれた）","m":"kowareta 意思：壞掉的 (broken)","say":"壊れた（こわれた）"},{"t":"レコード（れこーど）","m":"reko-do 意思：唱片 (vinyl record)","say":"レコード（れこーど）"},{"t":"同じこと（おなじこと）","m":"onaji koto 意思：同樣的事 (the same thing)","say":"同じこと（おなじこと）"},{"t":"墓場（はかば）","m":"hakaba 意思：墓地 (graveyard)","say":"墓場（はかば）"},{"t":"静かな（しずかな）","m":"shizuka na 意思：安靜的 (quiet)","say":"静かな（しずかな）"},{"t":"鳥（とり）","m":"tori 意思：鳥 (bird)","say":"鳥（とり）"},{"t":"有名な（ゆうめいな）","m":"yuumei na 意思：有名的 (famous)","say":"有名な（ゆうめいな）"}],"grammar":["<b>〜のような 跟 〜のように 有什麼差別？</b><br><br>のような修飾後面的名詞：[Noun A]＋のような＋[Noun B]，表示Noun A與Noun B具有相似的外觀或性質，或Noun A是Noun B的一個實例，例如：鎌倉のようなまち（像鎌倉這樣的城鎮）。のように修飾後面的動詞或形容詞：[Noun A]＋のように＋[動詞／形容詞]，用來描述「以與A相同的方式進行某動作」，或「性質與A相當」，例如：魚のように上手に泳げます。"],"example":[{"en":"I like towns like Kamakura.","jp":"<ruby>鎌倉<rt>かまくら</rt></ruby>のようなまちが<ruby>好<rt>す</rt></ruby>きです。","rj":"Kamakura no you na machi ga suki desu.","say":"鎌倉のようなまちが好きです。"},{"en":"I want to be a person like Mary.","jp":"メアリーのような<ruby>人<rt>ひと</rt></ruby>になりたいです。","rj":"Meari- no you na hito ni naritai desu.","say":"メアリーのような人になりたいです。"},{"en":"Mary can swim very well, just like a fish.","jp":"メアリーは<ruby>魚<rt>さかな</rt></ruby>のように<ruby>上手<rt>じょうず</rt></ruby>に<ruby>泳<rt>およ</rt></ruby>げます。","rj":"Meari- wa sakana no you ni jouzu ni oyogemasu.","say":"メアリーは魚のように上手に泳げます。"},{"en":"Ken is strong like Takeshi.","jp":"けんはたけしのように<ruby>強<rt>つよ</rt></ruby>いです。","rj":"Ken wa Takeshi no you ni tsuyoi desu.","say":"けんはたけしのように強いです。"},{"en":"Ken says the same thing over and over again, just like a broken vinyl record.","jp":"けんは<ruby>壊<rt>こわ</rt></ruby>れたレコードのように<ruby>同<rt>おな</rt></ruby>じことを<ruby>言<rt>い</rt></ruby>います。","rj":"Ken wa kowareta reko-do no you ni onaji koto o iimasu.","say":"けんは壊れたレコードのように同じことを言います。"},{"en":"This town is as quiet as a graveyard at night.","jp":"この<ruby>街<rt>まち</rt></ruby>は<ruby>夜<rt>よる</rt></ruby>の<ruby>墓場<rt>はかば</rt></ruby>のように<ruby>静<rt>しず</rt></ruby>かです。","rj":"Kono machi wa yoru no hakaba no you ni shizuka desu.","say":"この街は夜の墓場のように静かです。"},{"en":"I like movies like Titanic.","jp":"タイタニックのような<ruby>映画<rt>えいが</rt></ruby>が<ruby>好<rt>す</rt></ruby>きです。","rj":"Taitanikku no you na eiga ga suki desu.","say":"タイタニックのような映画が好きです。"},{"en":"Maya can sing well like a bird.","jp":"まやは<ruby>鳥<rt>とり</rt></ruby>のように<ruby>上手<rt>じょうず</rt></ruby>に<ruby>歌<rt>うた</rt></ruby>えます。","rj":"Maya wa tori no you ni jouzu ni utaemasu.","say":"まやは鳥のように上手に歌えます。"},{"en":"I don't want to live in a city like Tokyo.","jp":"<ruby>東京<rt>とうきょう</rt></ruby>のような<ruby>街<rt>まち</rt></ruby>に<ruby>住<rt>す</rt></ruby>みたくないです。","rj":"Toukyou no you na machi ni sumitakunai desu.","say":"東京のような街に住みたくないです。"},{"en":"I want to be famous like Taylor Swift.","jp":"テイラー・スイフトのように<ruby>有名<rt>ゆうめい</rt></ruby>になりたいです。","rj":"Teira- Suifuto no you ni yuumei ni naritai desu.","say":"テイラー・スイフトのように有名になりたいです。"}]},{"num":262,"title":"Causative-Passive Sentences","vocab":[{"t":"兄（あに）","m":"ani 意思：哥哥 (older brother)","say":"兄（あに）"},{"t":"肉（にく）","m":"niku 意思：肉 (meat)","say":"肉（にく）"},{"t":"宿題（しゅくだい）","m":"shukudai 意思：作業 (homework)","say":"宿題（しゅくだい）"},{"t":"手伝う（てつだう）","m":"tetsudau 意思：幫忙 (to help)","say":"手伝う（てつだう）"},{"t":"お皿（おさら）","m":"osara 意思：盤子 (dishes/plate)","say":"お皿（おさら）"},{"t":"洗う（あらう）","m":"arau 意思：洗 (to wash)","say":"洗う（あらう）"},{"t":"書く（かく）","m":"kaku 意思：寫 (to write)","say":"書く（かく）"},{"t":"来る（くる）","m":"kuru 意思：來 (to come)","say":"来る（くる）"},{"t":"駅（えき）","m":"eki 意思：車站 (station)","say":"駅（えき）"},{"t":"前（まえ）","m":"mae 意思：前面 (in front of)","say":"前（まえ）"},{"t":"〜間（〜かん）","m":"~kan 意思：…期間 (for (a period))","say":"〜間（〜かん）"},{"t":"パン（ぱん）","m":"pan 意思：麵包 (bread)","say":"パン（ぱん）"}],"grammar":["<b>使役受身形是什麼意思？動詞要怎麼變成使役受身形？</b><br><br>使役受身形是使役形的被動版本，用來表達「被迫、被騷擾、被說服去做原本不想做的事」。Ru-verb：去掉語尾「る」，加上「させられる」。U-verb語尾為す：去掉す，加上させられる。其餘U-verb：語尾u音改為asareru（行く iku→行かされる ikasareru）。不規則動詞：する→させられる、くる→こさせられる。","<b>使役受身句的句型結構，跟使役句有什麼不同？</b><br><br>[Cast]は／が　[Director]に　[Action（使役受身形）]。跟使役形（[Director]は [Cast]に…）相比，Cast與Director的角色（助詞）互換：使役受身的Cast（被強迫的人）現在變成主語，Director（下令者）變成用に標示的對象。"],"example":[{"en":"I was forced to sing by my older brother.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>兄<rt>あに</rt></ruby>に<ruby>歌<rt>うた</rt></ruby>を<ruby>歌<rt>うた</rt></ruby>わされました。","rj":"Watashi wa ani ni uta o utawasaremashita.","say":"私は兄に歌を歌わされました。"},{"en":"I am always made to eat meat by Miki.","jp":"<ruby>私<rt>わたし</rt></ruby>はみきにいつも<ruby>肉<rt>にく</rt></ruby>を<ruby>食<rt>た</rt></ruby>べさせられます。","rj":"Watashi wa Miki ni itsumo niku o tabesaseraremasu.","say":"私はみきにいつも肉を食べさせられます。"},{"en":"Yumi was made to study by her mother.","jp":"ゆみはお<ruby>母<rt>かあ</rt></ruby>さんに<ruby>勉強<rt>べんきょう</rt></ruby>させられました。","rj":"Yumi wa okaasan ni benkyou saseraremashita.","say":"ゆみはお母さんに勉強させられました。"},{"en":"My mother made me wash dishes.","jp":"<ruby>私<rt>わたし</rt></ruby>はお<ruby>母<rt>かあ</rt></ruby>さんにお<ruby>皿<rt>さら</rt></ruby>を<ruby>洗<rt>あら</rt></ruby>わされました。","rj":"Watashi wa okaasan ni osara o arawasaremashita.","say":"私はお母さんにお皿を洗わされました。"},{"en":"Who made you write this?","jp":"あなたは<ruby>誰<rt>だれ</rt></ruby>にこれを<ruby>書<rt>か</rt></ruby>かされましたか？","rj":"Anata wa dare ni kore o kakasaremashita ka?","say":"あなたは誰にこれを書かされましたか？"},{"en":"Tsukasa always makes me come to his house.","jp":"わたしはいつもつかさに<ruby>家<rt>いえ</rt></ruby>に<ruby>来<rt>こ</rt></ruby>させられます。","rj":"Watashi wa itsumo Tsukasa ni ie ni kosaseraremasu.","say":"わたしはいつもつかさに家に来させられます。"},{"en":"Mako made me wait in front of the station for 1 hour.","jp":"わたしはまこに<ruby>駅<rt>えき</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>で1<ruby>時間<rt>いちじかん</rt></ruby><ruby>待<rt>ま</rt></ruby>たされました。","rj":"Watashi wa Mako ni eki no mae de ichijikan matasaremashita.","say":"わたしはまこに駅の前で1時間待たされました。"},{"en":"Satoshi did not make me eat the bread.","jp":"わたしはさとしにパンを<ruby>食<rt>た</rt></ruby>べさせられませんでした。","rj":"Watashi wa Satoshi ni pan o tabesaseraremasen deshita.","say":"わたしはさとしにパンを食べさせられませんでした。"}]},{"num":263,"title":"〜ても","vocab":[{"t":"雨が降る（あめがふる）","m":"ame ga furu 意思：下雨 (to rain)","say":"雨が降る（あめがふる）"},{"t":"暑い（あつい）","m":"atsui 意思：熱的 (hot)","say":"暑い（あつい）"},{"t":"エアコン（えあこん）","m":"eakon 意思：冷氣 (air conditioner)","say":"エアコン（えあこん）"},{"t":"つける（つける）","m":"tsukeru 意思：打開（開關） (to turn on)","say":"つける（つける）"},{"t":"おなかがへる（おなかがへる）","m":"onaka ga heru 意思：肚子餓 (to be hungry)","say":"おなかがへる（おなかがへる）"},{"t":"雨が止む（あめがやむ）","m":"ame ga yamu 意思：雨停 (to stop raining)","say":"雨が止む（あめがやむ）"},{"t":"出かける（でかける）","m":"dekakeru 意思：出門 (to go out)","say":"出かける（でかける）"},{"t":"続ける（つづける）","m":"tsuzukeru 意思：繼續 (to continue)","say":"続ける（つづける）"},{"t":"成績（せいせき）","m":"seiseki 意思：成績 (grade)","say":"成績（せいせき）"},{"t":"悪い（わるい）","m":"warui 意思：差的、壞的 (bad)","say":"悪い（わるい）"},{"t":"約束を守る（やくそくをまもる）","m":"yakusoku o mamoru 意思：遵守約定 (to keep a promise)","say":"約束を守る（やくそくをまもる）"},{"t":"文句を言う（もんくをいう）","m":"monku o iu 意思：抱怨 (to complain)","say":"文句を言う（もんくをいう）"},{"t":"退屈な（たいくつな）","m":"taikutsu na 意思：無聊的 (boring)","say":"退屈な（たいくつな）"}],"grammar":["<b>〜ても 是什麼意思？怎麼接？</b><br><br>ても表示「即使…也…」，由動詞／形容詞的て形加上「も」構成；な形容詞、名詞則是「でも」。句型：[Sentence A（て形＋も）]＋[Sentence B]，相當於英文「[Sentence B] even though [Sentence A]」。ても子句本身沒有固定時態，Sentence B的時態則依句意自由決定。","<b>〜ても 跟 〜たら 有什麼差別？</b><br><br>て形＋も＝「即使…（假設）也會…」（even if）——強調即使A發生，B的結果也不會改變。過去式常體＋ら＝「如果…就…」（if...then）——單純描述條件成立時的結果，並未強調「不受影響」的語氣。例如：雨が降っても、ピクニックに行きます。（就算下雨我還是會去野餐）vs 雨が降ったら、ピクニックに行きません。（如果下雨我就不去野餐了）"],"example":[{"en":"I went to class everyday, even if it rained.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>っていても、<ruby>毎日<rt>まいにち</rt></ruby><ruby>授業<rt>じゅぎょう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","rj":"Watashi wa ame ga futte itemo, mainichi jugyou ni ikimashita.","say":"私は雨が降っていても、毎日授業に行きました。"},{"en":"I will not turn on the air conditioner, even if it is hot.","jp":"<ruby>暑<rt>あつ</rt></ruby>くても、エアコンをつけません。","rj":"Atsukutemo, eakon o tsukemasen.","say":"暑くても、エアコンをつけません。"},{"en":"I can eat the cake, even if I am not hungry.","jp":"おなかがへってなくても、ケーキは<ruby>食<rt>た</rt></ruby>べられます。","rj":"Onaka ga hettenakutemo, keeki wa taberaremasu.","say":"おなかがへってなくても、ケーキは食べられます。"},{"en":"You will be able to understand it, even if you are a child.","jp":"<ruby>子供<rt>こども</rt></ruby>でも、わかります。","rj":"Kodomo demo, wakarimasu.","say":"子供でも、わかります。"},{"en":"I will not go out, even if it stops raining.","jp":"<ruby>雨<rt>あめ</rt></ruby>が<ruby>止<rt>や</rt></ruby>んでも、<ruby>出<rt>で</rt></ruby>かけません。","rj":"Ame ga yandemo, dekakemasen.","say":"雨が止んでも、出かけません。"},{"en":"I will continue the study of Japanese, even if the grade is bad.","jp":"<ruby>成績<rt>せいせき</rt></ruby>が<ruby>悪<rt>わる</rt></ruby>くても、<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>勉強<rt>べんきょう</rt></ruby>を<ruby>続<rt>つづ</rt></ruby>けます。","rj":"Seiseki ga warukutemo, nihongo no benkyou o tsuzukemasu.","say":"成績が悪くても、日本語の勉強を続けます。"},{"en":"My friend says nothing, even if I don't keep a promise.","jp":"<ruby>約束<rt>やくそく</rt></ruby>を<ruby>守<rt>まも</rt></ruby>らなくても、<ruby>友達<rt>ともだち</rt></ruby>は<ruby>何<rt>なに</rt></ruby>も<ruby>言<rt>い</rt></ruby>いません。","rj":"Yakusoku o mamoranakutemo, tomodachi wa nanimo iimasen.","say":"約束を守らなくても、友達は何も言いません。"},{"en":"I don't complain, even if the class is boring.","jp":"<ruby>授業<rt>じゅぎょう</rt></ruby>が<ruby>退屈<rt>たいくつ</rt></ruby>でも、<ruby>文句<rt>もんく</rt></ruby>を<ruby>言<rt>い</rt></ruby>いません。","rj":"Jugyou ga taikutsu demo, monku o iimasen.","say":"授業が退屈でも、文句を言いません。"}]},{"num":264,"title":"〜ことにする","vocab":[{"t":"車（くるま）","m":"kuruma 意思：車 (car)","say":"車（くるま）"},{"t":"文句（もんく）","m":"monku 意思：抱怨 (complaint)","say":"文句（もんく）"},{"t":"夏（なつ）","m":"natsu 意思：夏天 (summer)","say":"夏（なつ）"},{"t":"ベトナム（べとなむ）","m":"betonamu 意思：越南 (Vietnam)","say":"ベトナム（べとなむ）"},{"t":"お酒（おさけ）","m":"osake 意思：酒 (alcohol)","say":"お酒（おさけ）"},{"t":"試験を受ける（しけんをうける）","m":"shiken o ukeru 意思：應考 (to take an examination)","say":"試験を受ける（しけんをうける）"},{"t":"一晩中（ひとばんじゅう）","m":"hitobanjuu 意思：一整晚 (all night)","say":"一晩中（ひとばんじゅう）"},{"t":"起きている（おきている）","m":"okite iru 意思：醒著 (to stay up, to be awake)","say":"起きている（おきている）"},{"t":"〜までに（〜までに）","m":"~made ni 意思：在…之前 (by (a certain time))","say":"〜までに（〜までに）"},{"t":"悪口を言う（わるぐちをいう）","m":"waruguchi o iu 意思：說壞話 (to talk behind someone's back)","say":"悪口を言う（わるぐちをいう）"}],"grammar":["<b>〜ことにする 的基本用法是什麼？</b><br><br>表示「做出了…的決定」，句型：[Activity（現在式常體，肯定或否定）]＋ことにする，常用過去式（ことにしました）表達「已經決定了」。","<b>〜ことにしよう 是什麼意思？</b><br><br>意向形＋ことにしよう，表示「（那就）決定…吧！」，相較於單純的意向形，ことにしよう多了「經過一番猶豫、考慮後才做出這個決定」的語感，常見於「乾脆就這麼決定吧」的情境。","<b>〜ことにしている 是什麼意思？</b><br><br>表示「已經下定決心要做某事，並且持續、規律地執行這個決定」（比單純的習慣更強調「有意識地堅持」），相當於「習慣性地做…」。"],"example":[{"en":"I have decided to buy a car.","jp":"<ruby>車<rt>くるま</rt></ruby>を<ruby>買<rt>か</rt></ruby>うことにしました。","rj":"Kuruma o kau koto ni shimashita.","say":"車を買うことにしました。"},{"en":"I have decided not to make too many complaints.","jp":"あまり<ruby>文句<rt>もんく</rt></ruby>を<ruby>言<rt>い</rt></ruby>わないことにします。","rj":"Amari monku o iwanai koto ni shimasu.","say":"あまり文句を言わないことにします。"},{"en":"Let's go to Vietnam this summer.","jp":"<ruby>夏<rt>なつ</rt></ruby>はベトナムに<ruby>行<rt>い</rt></ruby>くことにしよう。","rj":"Natsu wa Betonamu ni iku koto ni shiyou.","say":"夏はベトナムに行くことにしよう。"},{"en":"Let's not go to Vietnam this summer.","jp":"<ruby>夏<rt>なつ</rt></ruby>はベトナムに<ruby>行<rt>い</rt></ruby>かないことにしよう。","rj":"Natsu wa Betonamu ni ikanai koto ni shiyou.","say":"夏はベトナムに行かないことにしよう。"},{"en":"I make it a rule to go to bed at ten every night.","jp":"<ruby>毎日<rt>まいにち</rt></ruby>10<ruby>時<rt>じ</rt></ruby>に<ruby>寝<rt>ね</rt></ruby>ることにしています。","rj":"Mainichi juuji ni neru koto ni shite imasu.","say":"毎日10時に寝ることにしています。"},{"en":"I have made a decision not to drink (and have followed it).","jp":"お<ruby>酒<rt>さけ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>まないことにしています。","rj":"Osake o nomanai koto ni shite imasu.","say":"お酒を飲まないことにしています。"},{"en":"Maki has decided to take the examination next year.","jp":"まきは<ruby>来年<rt>らいねん</rt></ruby><ruby>試験<rt>しけん</rt></ruby>を<ruby>受<rt>う</rt></ruby>けることにしました。","rj":"Maki wa rainen shiken o ukeru koto ni shimashita.","say":"まきは来年試験を受けることにしました。"},{"en":"John has decided to stay up all night.","jp":"ジョンは<ruby>一晩中<rt>ひとばんじゅう</rt></ruby><ruby>起<rt>お</rt></ruby>きていることにしました。","rj":"Jon wa hitobanjuu okite iru koto ni shimashita.","say":"ジョンは一晩中起きていることにしました。"},{"en":"Maki goes to bed by twelve every night.","jp":"まきは<ruby>毎晩<rt>まいばん</rt></ruby>12<ruby>時<rt>じ</rt></ruby>までに<ruby>寝<rt>ね</rt></ruby>ることにしています。","rj":"Maki wa maiban juuniji made ni neru koto ni shite imasu.","say":"まきは毎晩12時までに寝ることにしています。"},{"en":"Takeshi does not talk behind someone's back.","jp":"たけしは<ruby>悪口<rt>わるぐち</rt></ruby>を<ruby>言<rt>い</rt></ruby>わないことにしています。","rj":"Takeshi wa waruguchi o iwanai koto ni shite imasu.","say":"たけしは悪口を言わないことにしています。"}]},{"num":265,"title":"〜まで","vocab":[{"t":"晴れる（はれる）","m":"hareru 意思：放晴 (to become sunny)","say":"晴れる（はれる）"},{"t":"カフェ（かふぇ）","m":"kafe 意思：咖啡廳 (café)","say":"カフェ（かふぇ）"},{"t":"フランス（ふらんす）","m":"furansu 意思：法國 (France)","say":"フランス（ふらんす）"},{"t":"帰る（かえる）","m":"kaeru 意思：回去 (to go back)","say":"帰る（かえる）"},{"t":"赤ちゃん（あかちゃん）","m":"akachan 意思：嬰兒 (baby)","say":"赤ちゃん（あかちゃん）"},{"t":"貯める（ためる）","m":"tameru 意思：存（錢） (to save (money))","say":"貯める（ためる）"},{"t":"旅行する（りょこうする）","m":"ryokou suru 意思：旅行 (to travel)","say":"旅行する（りょこうする）"},{"t":"終わる（おわる）","m":"owaru 意思：結束 (to finish (intransitive))","say":"終わる（おわる）"},{"t":"ビール（びーる）","m":"bi-ru 意思：啤酒 (beer)","say":"ビール（びーる）"},{"t":"止む（やむ）","m":"yamu 意思：（雨、雪）停止 (to stop (rain/snow))","say":"止む（やむ）"}],"grammar":["<b>「B まで A」是什麼意思？</b><br><br>表示「A這件事會持續發生，直到B發生為止」。句型：[Event B]＋まで、[Event A]，相當於英文「[Event A] continues until [Event B].」。Event B（截止點）以現在式常體肯定結尾（即使整句在描述過去發生的事，B仍固定用現在式），通常是表示「變化」的動詞（如晴れる、なる）。","<b>Event B 的主語跟 Event A 不同時，要注意什麼？</b><br><br>若Event B的主語與Event A的主語不同，Event B的主語要用「が」標示（而不是は）。例如：赤ちゃんが寝るまで、私は歌を歌ってあげます。"],"example":[{"en":"I will wait in the coffee shop until it becomes sunny.","jp":"<ruby>晴<rt>は</rt></ruby>れるまで、カフェで<ruby>待<rt>ま</rt></ruby>ちます。","rj":"Hareru made, kafe de machimasu.","say":"晴れるまで、カフェで待ちます。"},{"en":"I will not go back to France, until I become fluent in Japanese.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>上手<rt>じょうず</rt></ruby>になるまで、フランスに<ruby>帰<rt>かえ</rt></ruby>りません。","rj":"Nihongo ga jouzu ni naru made, Furansu ni kaerimasen.","say":"日本語が上手になるまで、フランスに帰りません。"},{"en":"I will sing a lullaby till the baby falls asleep.","jp":"<ruby>赤<rt>あか</rt></ruby>ちゃんが<ruby>寝<rt>ね</rt></ruby>るまで、<ruby>私<rt>わたし</rt></ruby>は<ruby>歌<rt>うた</rt></ruby>を<ruby>歌<rt>うた</rt></ruby>ってあげます。","rj":"Akachan ga neru made, watashi wa uta o utatte agemasu.","say":"赤ちゃんが寝るまで、私は歌を歌ってあげます。"},{"en":"I will not travel until I save money.","jp":"お<ruby>金<rt>かね</rt></ruby>を<ruby>貯<rt>た</rt></ruby>めるまで、<ruby>旅行<rt>りょこう</rt></ruby>しません。","rj":"Okane o tameru made, ryokou shimasen.","say":"お金を貯めるまで、旅行しません。"},{"en":"Could you wait for me until my homework is finished?","jp":"<ruby>宿題<rt>しゅくだい</rt></ruby>が<ruby>終<rt>お</rt></ruby>わるまで、<ruby>待<rt>ま</rt></ruby>ってくれませんか？","rj":"Shukudai ga owaru made, matte kuremasen ka?","say":"宿題が終わるまで、待ってくれませんか？"},{"en":"You must not drink beer until you become 20 years old.","jp":"20<ruby>歳<rt>はたち</rt></ruby>になるまで、ビールを<ruby>飲<rt>の</rt></ruby>んではいけません。","rj":"Hatachi ni naru made, bi-ru o nonde wa ikemasen.","say":"20歳になるまで、ビールを飲んではいけません。"},{"en":"I had to wait until the rain stopped.","jp":"<ruby>雨<rt>あめ</rt></ruby>が<ruby>止<rt>や</rt></ruby>むまで、<ruby>待<rt>ま</rt></ruby>たなくちゃいけませんでした。","rj":"Ame ga yamu made, matanakuchaikemasen deshita.","say":"雨が止むまで、待たなくちゃいけませんでした。"}]},{"num":266,"title":"〜方（かた）","vocab":[{"t":"漢字（かんじ）","m":"kanji 意思：漢字 (kanji)","say":"漢字（かんじ）"},{"t":"読む（よむ）","m":"yomu 意思：讀 (to read)","say":"読む（よむ）"},{"t":"はし（はし）","m":"hashi 意思：筷子 (chopsticks)","say":"はし（はし）"},{"t":"使う（つかう）","m":"tsukau 意思：使用 (to use)","say":"使う（つかう）"},{"t":"お風呂に入る（おふろにはいる）","m":"ofuro ni hairu 意思：泡澡 (to take a bath)","say":"お風呂に入る（おふろにはいる）"},{"t":"パスタ（ぱすた）","m":"pasuta 意思：義大利麵 (pasta)","say":"パスタ（ぱすた）"},{"t":"メール（めーる）","m":"me-ru 意思：電子郵件 (email)","say":"メール（めーる）"},{"t":"送る（おくる）","m":"okuru 意思：寄送 (to send)","say":"送る（おくる）"},{"t":"予約する（よやくする）","m":"yoyaku suru 意思：預約 (to make a reservation)","say":"予約する（よやくする）"},{"t":"フライト（ふらいと）","m":"furaito 意思：班機 (flight)","say":"フライト（ふらいと）"},{"t":"焼く（やく）","m":"yaku 意思：烘烤 (to bake)","say":"焼く（やく）"},{"t":"泳ぐ（およぐ）","m":"oyogu 意思：游泳 (to swim)","say":"泳ぐ（およぐ）"}],"grammar":["<b>名詞化接尾詞「方（かた）」是什麼意思？動詞要怎麼變化？</b><br><br>方（かた）接在動詞ます形語幹之後，表示「做某事的方法」或「（某人）做某事的樣子」。變化規則：食べる→食べ方、行く→行き方、する→し方、くる→き方。","<b>接上「方」之後，原本搭配動詞的助詞要怎麼變？</b><br><br>重要規則：原本搭配動詞的助詞，接上「方」之後統一改為「の」。例如：漢字を読む→漢字の読み方；家に行く→家の行き方。","<b>複合する動詞（名詞＋する）接「方」時有什麼特別規則？</b><br><br>する之前的名詞，一律用「の」接續「しかた」（而非直接變化該複合詞本身）。例如：勉強する→勉強のしかた、予約する→予約のしかた。"],"example":[{"en":"The way Takeshi eats pasta is interesting.","jp":"たけしのパスタの<ruby>食<rt>た</rt></ruby>べ<ruby>方<rt>かた</rt></ruby>は<ruby>面白<rt>おもしろ</rt></ruby>いです。","rj":"Takeshi no pasuta no tabekata wa omoshiroi desu.","say":"たけしのパスタの食べ方は面白いです。"},{"en":"Can you tell me how to write kanji?","jp":"<ruby>漢字<rt>かんじ</rt></ruby>の<ruby>書<rt>か</rt></ruby>き<ruby>方<rt>かた</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えていただけませんか？","rj":"Kanji no kakikata o oshiete itadakemasen ka?","say":"漢字の書き方を教えていただけませんか？"},{"en":"I don't know how to send emails.","jp":"メールの<ruby>送<rt>おく</rt></ruby>り<ruby>方<rt>かた</rt></ruby>を<ruby>知<rt>し</rt></ruby>りません。","rj":"Meeru no okurikata o shirimasen.","say":"メールの送り方を知りません。"},{"en":"Do you know how to make a flight reservation?","jp":"<ruby>飛行機<rt>ひこうき</rt></ruby>の<ruby>予約<rt>よやく</rt></ruby>のしかたを<ruby>知<rt>し</rt></ruby>っていますか？","rj":"Hikouki no yoyaku no shikata o shitte imasu ka?","say":"飛行機の予約のしかたを知っていますか？"},{"en":"Can you teach me how to bake a delicious cake?","jp":"<ruby>美味<rt>おい</rt></ruby>しいケーキの<ruby>焼<rt>や</rt></ruby>き<ruby>方<rt>かた</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれませんか？","rj":"Oishii keeki no yakikata o oshiete kuremasen ka?","say":"美味しいケーキの焼き方を教えてくれませんか？"},{"en":"Taka did not teach me how to swim.","jp":"たかは<ruby>泳<rt>およ</rt></ruby>ぎ<ruby>方<rt>かた</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれませんでした。","rj":"Taka wa oyogikata o oshiete kuremasen deshita.","say":"たかは泳ぎ方を教えてくれませんでした。"}]}],"practice":[{"num":99,"title":"Writing Practice","vocab":[],"grammar":["<b>「健是日本人，而且是學生。」這一題會用到哪些單字？</b><br><br>- Japanese（日本人）－ 日本人（にほんじん / nihonjin）<br>- Student（學生）－ 学生（がくせい / gakusei）<br>- ＊這是一個肯定句","<b>「這間餐廳便宜又好吃。」這一題會用到哪些單字？</b><br><br>- Restaurant（餐廳）－ レストラン（れすとらん / resutoran）<br>- Cheap（便宜的）－ <ruby>安<rt>やす</rt></ruby>い（やすい / yasui）<br>- Delicious（好吃的）－ <ruby>美味<rt>おい</rt></ruby>しい（おいしい / oishii）<br>- ＊這是一個肯定句","<b>「你的家又乾淨又寬敞。」這一題會用到哪些單字？</b><br><br>- House（家）－ 家（いえ / ie）<br>- Clean（乾淨的）－ <ruby>綺麗<rt>きれい</rt></ruby>な（きれいな / kireina）<br>- Spacious（寬敞的）－ <ruby>広<rt>ひろ</rt></ruby>い（ひろい / hiroi）<br>- ＊這是一個肯定句","<b>「竹志頭腦好，個子又高。」這一題會用到哪些單字？要用什麼句型？</b><br><br>- 「聰明」和「（個子）高」都要套用「（身體部位）が（形容詞）です」這個句型來表達<br>- Head（頭）－ 頭（あたま / atama）<br>- Good（好的）－ <ruby>良<rt>い</rt></ruby>い（いい / ii）<br>- Height／for a person（身高）－ 背（せ / se）<br>- Tall／for height（高的）－ <ruby>高<rt>たか</rt></ruby>い（たかい / takai）","<b>「健人的狗是公的，而且很有活力。」這一題會用到哪些單字？</b><br><br>- Dog（狗）－ 犬（いぬ / inu）<br>- Male（公的）－ オス（おす / osu）<br>- Energetic（有活力的）－ <ruby>元気<rt>げんき</rt></ruby>な（げんきな / genkina）","<b>「美佳喜歡動物，而且很親切。」這一題會用到哪些單字？</b><br><br>- To like（喜歡）－ <ruby>好<rt>す</rt></ruby>きな（すきな / sukina，な形容詞）<br>- Animals（動物）－ 動物（どうぶつ / doubutsu）<br>- Kind（親切的）－ <ruby>親切<rt>しんせつ</rt></ruby>な（しんせつな / shinsetsuna）","<b>總結：本課的て形（Te-form）肯定形變化規則整理</b><br><br>- い形容詞：去掉字尾「い」，加「くて」。例：<ruby>可愛<rt>かわい</rt></ruby>い → <ruby>可愛<rt>かわい</rt></ruby>くて、<ruby>安<rt>やす</rt></ruby>い → <ruby>安<rt>やす</rt></ruby>くて、<ruby>広<rt>ひろ</rt></ruby>い → <ruby>広<rt>ひろ</rt></ruby>くて、<ruby>高<rt>たか</rt></ruby>い → <ruby>高<rt>たか</rt></ruby>くて<br>- な形容詞：去掉字尾「な」，加「で」。例：<ruby>綺麗<rt>きれい</rt></ruby>な → <ruby>綺麗<rt>きれい</rt></ruby>で、<ruby>元気<rt>げんき</rt></ruby>な → <ruby>元気<rt>げんき</rt></ruby>で、<ruby>好<rt>す</rt></ruby>きな → <ruby>好<rt>す</rt></ruby>きで<br>- 名詞句（名詞＋です）：把「です」改成「で」。例：<ruby>学生<rt>がくせい</rt></ruby>です → <ruby>学生<rt>がくせい</rt></ruby>で、オスです → オスで<br>- 特例：「いい」不能直接去い加くて，要先還原成古語「よい」，再變化成「よくて」<br><br>這些て形肯定形都用來連接兩個子句，形成「Aで／くて、Bです」的並列句型，表示同一主語同時具備兩種性質，或不同主語各自具備某種性質（例如「頭がよくて、背が高いです」）。"],"example":[{"en":"Ken is Japanese and a student","jp":"けんは<ruby>日本人<rt>にほんじん</rt></ruby>で<ruby>学生<rt>がくせい</rt></ruby>です。","rj":"Ken wa nihonjin de gakusei desu.","say":"けんは日本人で学生です。"},{"en":"This restaurant is cheap and delicious.","jp":"このレストランは<ruby>安<rt>やす</rt></ruby>くて<ruby>美味<rt>おい</rt></ruby>しいです。","rj":"Kono resutoran wa yasukute oishiidesu.","say":"このレストランは安くて美味しいです。"},{"en":"Your house is clean and spacious","jp":"あなたの<ruby>家<rt>いえ</rt></ruby>は<ruby>綺麗<rt>きれい</rt></ruby>で<ruby>広<rt>ひろ</rt></ruby>いです。","rj":"Anata no ie wa kireide hiroidesu.","say":"あなたの家は綺麗で広いです。"},{"en":"Takeshi is smart and tall.","jp":"たけしは<ruby>頭<rt>あたま</rt></ruby>がよくて<ruby>背<rt>せ</rt></ruby>が<ruby>高<rt>たか</rt></ruby>いです。","rj":"Takeshi wa atama ga yokute se ga takaidesu.","say":"たけしは頭がよくて背が高いです。"},{"en":"Kento's dog is a male and energetic.","jp":"けんとの<ruby>犬<rt>いぬ</rt></ruby>はオスで<ruby>元気<rt>げんき</rt></ruby>です。","rj":"Kento no inu wa osude genkidesu.","say":"けんとの犬はオスで元気です。"},{"en":"Mika likes animals and very kind.","jp":"みかは<ruby>動物<rt>どうぶつ</rt></ruby>が<ruby>好<rt>す</rt></ruby>きで<ruby>親切<rt>しんせつ</rt></ruby>です。","rj":"Mika wa doubutsu ga sukide shinsetsudesu.","say":"みかは動物が好きで親切です。"}]},{"num":107,"title":"Writing Practice","vocab":[],"grammar":["<b>這一課在練習什麼文法？</b><br><br>本單元是寫作練習題，每一題都先給一句英文句子和幾個提示單字（HINT），要求練習寫出對應的日文句子。7 題全部都在練習同一個句型：「動詞ます形（去掉ます）＋に＋行く／来る／帰る」，用來表達「為了做某事而去／來（某地）」，並依句意變化行く・来る的時態（現在/過去）與肯定/否定/疑問形。"],"example":[{"en":"Mary came to Japan to study Japanese.","jp":"メアリーは<ruby>日本<rt>にほん</rt></ruby>に<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しにきました。","rj":"Mearii wa nihon ni nihongo o benkyoushi ni kimashita.","say":"メアリーは日本に日本語を勉強しにきました。"},{"en":"I will go to Kai's house to borrow a book.","jp":"<ruby>私<rt>わたし</rt></ruby>はかいの<ruby>家<rt>いえ</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>を<ruby>借<rt>か</rt></ruby>りに<ruby>行<rt>い</rt></ruby>きます。","rj":"Watashi wa kai no ie ni hon o kari ni ikimasu.","say":"私はかいの家に本を借りに行きます。"},{"en":"I went to Tokyo to meet my father.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>東京<rt>とうきょう</rt></ruby>にお<ruby>父<rt>とう</rt></ruby>さんに<ruby>会<rt>あ</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きました。","rj":"Watashi wa Toukyou ni otousan ni ai ni ikimashita.","say":"私は東京にお父さんに会いに行きました。"},{"en":"I will not go to school to play basketball.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>にバスケットボールをしに<ruby>行<rt>い</rt></ruby>きません。","rj":"Watashi wa gakkou ni basukettobo-ru o shi ni ikimasen.","say":"私は学校にバスケットボールをしに行きません。"},{"en":"Did you come to the library to study?","jp":"<ruby>図書館<rt>としょかん</rt></ruby>に<ruby>勉強<rt>べんきょう</rt></ruby>しにきましたか？","rj":"Toshokan ni benkyoushi ni kimashitaka?","say":"図書館に勉強しにきましたか？"},{"en":"Kiko did not come to return the book.","jp":"きこは<ruby>本<rt>ほん</rt></ruby>を<ruby>返<rt>かえ</rt></ruby>しにきませんでした。","rj":"Kiko wa hon o kaeshi ni kimasendeshita.","say":"きこは本を返しにきませんでした。"},{"en":"Toma will come to my house to cook dinner.","jp":"とうまは<ruby>家<rt>いえ</rt></ruby>に<ruby>夜<rt>よる</rt></ruby>ごはんを<ruby>料理<rt>りょうり</rt></ruby>しにきます。","rj":"Touma wa ie ni yorugohan o ryourishi ni kimasu.","say":"とうまは家に夜ごはんを料理しにきます。"}]},{"num":108,"title":"Listening Practice","vocab":[],"grammar":["<b>這一課在練習什麼？</b><br><br>這是一堂聽力／閱讀理解練習：先給一句日文句子，再從三個英文選項中選出意思相符的答案，用來複習「動詞ます形語幹＋に＋行きます／来ます」（為了做某事而去／來）的句型，並結合現在肯定、現在否定、過去式等時態一起練習聽解與判讀。"],"example":[{"en":"\"(1) Will Tae go eat food?\"","jp":"たえはご<ruby>飯<rt>ごはん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べに<ruby>行<rt>い</rt></ruby>きましたか？","rj":"Tae wa go gohan o tabeni ikimashitaka?","say":"たえはご飯を食べに行きましたか？"},{"en":"\"(1) Rino will go watch a movie.\"","jp":"りのは<ruby>映画<rt>えいが</rt></ruby>を<ruby>観<rt>み</rt></ruby>に<ruby>行<rt>い</rt></ruby>きません。","rj":"Ri no wa eiga o mini ikimasen.","say":"りのは映画を観に行きません。"},{"en":"\"(1) Kiho went to the cafe to see Tomo.\"","jp":"きほはカフェにともに<ruby>会<rt>あ</rt></ruby>いにきました。","rj":"Kiho wa kafenitomoni ainikimashita.","say":"きほはカフェにともに会いにきました。"},{"en":"\"(1) I will go to the library to study.\"","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>図書館<rt>としょかん</rt></ruby>に<ruby>勉強<rt>べんきょう</rt></ruby>しにきました。","rj":"Watashi wa toshokanni benkyoushinikimashita.","say":"私は図書館に勉強しにきました。"},{"en":"\"(2) Tomo went to USA to meet friends.\"","jp":"ともかはアメリカに<ruby>友達<rt>ともだち</rt></ruby>に<ruby>会<rt>あ</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きます。","rj":"Tomoka wa amerikani tomodachini aini ikimasu.","say":"ともかはアメリカに友達に会いに行きます。"},{"en":"\"(1) Yuri came to the park to take pictures.\"","jp":"ゆりは<ruby>公園<rt>こうえん</rt></ruby>に<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>りに<ruby>行<rt>い</rt></ruby>きませんでした。","rj":"Yuri wa kouenni shashin o torini ikimasen deshita.","say":"ゆりは公園に写真を撮りに行きませんでした。"},{"en":"\"(2) Toshi went to drink coffee.\"","jp":"としはコーヒーを<ruby>飲<rt>の</rt></ruby>みにきます。","rj":"Toshi wa ko-hi- o nominikimasu.","say":"としはコーヒーを飲みにきます。"}]}]};

const TABS=[{"key": "sen", "label": "例句"}, {"key": "num-time", "label": "數字・時間"}, {"key": "basic", "label": "基礎句型"}, {"key": "demo-q", "label": "指示詞・疑問詞"}, {"key": "particle", "label": "助詞"}, {"key": "verb-masu", "label": "動詞ます形・存在文"}, {"key": "te-form", "label": "て形"}, {"key": "adj", "label": "形容詞"}, {"key": "short-form", "label": "常體短形（普通形）"}, {"key": "advanced", "label": "比較・原因・進階句型"}, {"key": "practice", "label": "綜合練習"}];

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function plain(s){return (s||'').replace(/<rt>[^<]*<\/rt>/g,'').replace(/<[^>]+>/g,'')}

let jpVoiceCache = null;
function jpVoice(){
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return null;
  jpVoiceCache = vs.find(v=>v.lang==='ja-JP') || vs.find(v=>v.lang && v.lang.startsWith('ja')) || null;
  return jpVoiceCache;
}
let _utter = null; // keep a live reference - Chrome silently drops utterances that get garbage-collected
let playQueue = [];
let playIndex = 0;
let playBtnEl = null;

function speakOne(text, onDone){
  const u = new SpeechSynthesisUtterance(plain(text));
  _utter = u;
  u.lang = 'ja-JP';
  u.rate = parseFloat(document.getElementById('rate').value) || 0.85;
  const v = jpVoice(); if(v) u.voice = v;
  u.onerror = function(e){ console.error('TTS error:', e.error); if(onDone) onDone(); };
  u.onend = function(){ if(onDone) onDone(); };
  speechSynthesis.speak(u);
  setTimeout(()=>{ if(speechSynthesis.paused) speechSynthesis.resume(); }, 150);
}

function doSpeak(text){
  stopPlayback();
  const wasBusy = speechSynthesis.speaking || speechSynthesis.pending;
  speechSynthesis.cancel();
  if (wasBusy) {
    setTimeout(()=>speakOne(text, null), 120); // Chrome drops speak() called right after cancel() while busy
  } else {
    speakOne(text, null);
  }
}

function speak(text){
  if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀');return;}
  if(speechSynthesis.getVoices().length === 0){
    speechSynthesis.onvoiceschanged = function(){ doSpeak(text); };
    speechSynthesis.getVoices();
  } else {
    doSpeak(text);
  }
}

function playNext(){
  if(playIndex >= playQueue.length){
    if(playBtnEl){ playBtnEl.textContent = '▶ 播放全部例句'; playBtnEl = null; }
    return;
  }
  const text = playQueue[playIndex];
  speakOne(text, function(){
    playIndex++;
    if(playIndex >= playQueue.length){ playNext(); return; }
    setTimeout(playNext, 500); // 句間間隔 0.5 秒
  });
}

function stopPlayback(){
  playQueue = [];
  playIndex = 0;
  if(playBtnEl){ playBtnEl.textContent = '▶ 播放全部例句'; playBtnEl = null; }
}

function playAllExamples(num, btn){
  if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀');return;}
  if(playBtnEl === btn){ // toggle: clicking again stops
    speechSynthesis.cancel();
    stopPlayback();
    return;
  }
  const chapterEl = document.querySelector('.chapter[data-num="'+num+'"]');
  if(!chapterEl) return;
  const jps = [...chapterEl.querySelectorAll('.ecard [data-act="ex"]')]
               .map(b=>b.dataset.say).filter(Boolean);
  if(!jps.length){ alert('本課沒有例句可播放'); return; }
  speechSynthesis.cancel();
  playQueue = jps;
  playIndex = 0;
  playBtnEl = btn;
  btn.textContent = '■ 停止播放';
  const go = function(){ playNext(); };
  if(speechSynthesis.getVoices().length === 0){
    speechSynthesis.onvoiceschanged = go;
    speechSynthesis.getVoices();
  } else {
    go();
  }
}

if('speechSynthesis' in window){
  speechSynthesis.getVoices();
}

var fabTop = document.getElementById('fab-top');
window.addEventListener('scroll', function () {
  fabTop.classList.toggle('show', window.scrollY > 400);
});
fabTop.addEventListener('click', function () {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

function renderChapter(c){
  let html = '<div class="chapter" data-num="'+c.num+'">';
  html += '<h2 data-act="toggle"><span><span class="num">'+c.num+'.</span>'+esc(c.title)+'</span><span class="car">▾</span></h2>';
  html += '<div class="body">';

  html += '<div class="section-label vocab">① 單字</div>';
  if(c.vocab.length){
    html += '<div class="vocab-grid">';
    for(const v of c.vocab){
      html += '<div class="vcard"><span class="term">'+v.t+'</span>'
            + (v.say ? '<button class="sp" data-act="voc" data-say="'+esc(plain(v.say))+'" title="朗讀">🔊</button>' : '')
            + (v.m ? '<div class="meaning">'+esc(v.m)+'</div>' : '')
            + '</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="empty-note">本課沒有獨立單字表</div>';
  }

  html += '<div class="section-label grammar">② 文法</div>';
  if(c.grammar.length){
    for(const g of c.grammar){
      html += '<div class="gcard">'+g+'</div>';
    }
  } else {
    html += '<div class="empty-note">本課沒有額外文法規則說明</div>';
  }

  html += '<div class="section-label example">③ 例句</div>';
  if(c.example.length){
    html += '<button class="sp playall" style="margin-left:8px;background:#c8892f;color:#fff;border:none;border-radius:999px;padding:4px 12px;font-size:.78rem;cursor:pointer" data-act="all" data-num="'+c.num+'">▶ 播放全部例句</button>';
  }
  if(c.example.length){
    for(const e of c.example){
      if(!e.jp) continue;
      html += '<div class="ecard">'
            + (e.en ? '<div class="en">"'+esc(e.en)+'"</div>' : '')
            + '<div class="jp">'+e.jp+'</div>'
            + (e.rj ? '<div class="rj">'+esc(e.rj)+'</div>' : '')
            + (e.say ? '<button class="sp" data-act="ex" data-say="'+esc(e.say)+'">🔊 朗讀例句</button>' : '')
            + '</div>';
    }
  } else {
    html += '<div class="empty-note">本課沒有獨立例句（內容併入文法說明中）</div>';
  }

  html += '</div></div>';
  return html;
}

// "sen" aggregates every chapter that has examples - built by reference so the
// page carries no duplicate data.
DATA['sen'] = Object.keys(DATA).filter(k=>k!=='sen')
  .reduce((acc,k)=>acc.concat(DATA[k]), [])
  .filter(c=>c.example.some(e=>e.jp))
  .sort((a,b)=>a.num-b.num);

function renderSentenceChapter(c){
  let html = '<div class="chapter" data-num="'+c.num+'">';
  html += '<h2 data-act="toggle"><span><span class="num">'+c.num+'.</span>'+esc(c.title)+'</span><span class="car">▾</span></h2>';
  html += '<div class="body">';

  html += '<div class="section-label grammar">文法</div>';
  if(c.grammar.length){
    for(const g of c.grammar){
      html += '<div class="gcard">'+g+'</div>';
    }
  } else {
    html += '<div class="empty-note">本課沒有額外文法規則說明</div>';
  }

  html += '<div class="section-label example">例句</div>';
  html += '<button class="sp playall" style="margin-left:8px;background:#c8892f;color:#fff;border:none;border-radius:999px;padding:4px 12px;font-size:.78rem;cursor:pointer" data-act="all" data-num="'+c.num+'">▶ 播放全部例句</button>';
  for(const e of c.example){
    if(!e.jp) continue;
    html += '<div class="ecard">'
          + (e.en ? '<div class="en">"'+esc(e.en)+'"</div>' : '')
          + '<div class="jp">'+e.jp+'</div>'
          + (e.rj ? '<div class="rj">'+esc(e.rj)+'</div>' : '')
          + (e.say ? '<button class="sp" data-act="ex" data-say="'+esc(e.say)+'">🔊 朗讀例句</button>' : '')
          + '</div>';
  }
  html += '</div></div>';
  return html;
}

let currentTab = TABS[0].key;

function renderTab(key){
  currentTab = key;
  document.getElementById('tabselect').value = key;
  const list = DATA[key] || [];
  const fn = (key === 'sen') ? renderSentenceChapter : renderChapter;
  document.getElementById('content').innerHTML = list.map(fn).join('');
  document.getElementById('chapterselect').innerHTML = list.map(c=>
    '<option value="'+c.num+'">'+esc(c.num+'. '+c.title+(ZH_TITLES[c.num] ? '（'+ZH_TITLES[c.num]+'）' : ''))+'</option>'
  ).join('');
  applySearch();
}

function goToChapter(num){
  const el = document.querySelector('.chapter[data-num="'+num+'"]');
  if(!el) return;
  el.classList.remove('closed');
  el.scrollIntoView({behavior:'smooth', block:'start'});
}

const tabSelect = document.getElementById('tabselect');
tabSelect.innerHTML = TABS.map(t=>
  '<option value="'+t.key+'">'+esc(t.label)+'</option>'
).join('');
tabSelect.addEventListener('change', function(){ renderTab(this.value); });

document.getElementById('chapterselect').addEventListener('change', function(){
  goToChapter(this.value);
});

function applySearch(){
  const kw = document.getElementById('q').value.trim();
  document.querySelectorAll('.chapter').forEach(ch=>{
    if(!kw){ ch.classList.remove('hide'); ch.querySelectorAll('.vcard,.gcard,.ecard').forEach(x=>x.classList.remove('hide')); return; }
    let anyMatch = false;
    ch.querySelectorAll('.vcard,.gcard,.ecard').forEach(card=>{
      const match = card.textContent.includes(kw);
      card.classList.toggle('hide', !match);
      if(match) anyMatch = true;
    });
    ch.classList.toggle('hide', !anyMatch);
  });
}
document.getElementById('q').addEventListener('input', applySearch);

// Event delegation: never embed sentence text inside an onclick="" attribute -
// quotes in the text break the attribute and the handler silently dies.
document.getElementById('content').addEventListener('click', function(ev){
  const btn = ev.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  if(act === 'toggle'){
    btn.parentElement.classList.toggle('closed');
  } else if(act === 'voc'){
    if(btn.dataset.say) speak(btn.dataset.say);
  } else if(act === 'ex'){
    if(btn.dataset.say) speak(btn.dataset.say);
  } else if(act === 'all'){
    playAllExamples(btn.dataset.num, btn);
  }
});

renderTab(TABS[0].key);
