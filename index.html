bete imasu. \"Mary is eating pancakes.\"","say":"食べる"},{"t":"泳ぐ（およぐ - to swim）","m":"かなではプール（ぷーる）で泳（およ）いでいます。 Kanade wa pu-ru de oyoide imasu. \"Kanade is swimming in the pool.\"","say":"泳ぐ"},{"t":"遊ぶ（あそぶ - to play）","m":"私（わたし）はメアリー（めありー）と遊（あそ）んでいます。 Watashi wa Mary to asonde imasu. \"I am playing with Mary.\" （と＝和／與）","say":"遊ぶ"},{"t":"書く（かく - to write）","m":"けんは手紙（てがみ）を書（か）いています。 Ken wa tegami wo kaite imasu. \"Ken is writing a letter.\"","say":"書く"},{"t":"助動詞「いる」變化表：","m":"現在肯定：います（imasu）　現在否定：いません（imasen） 過去肯定：いました（imashita）　過去否定：いませんでした（imasendeshita）","say":"助動詞「いる」變化表"}],"grammar":["<b>「Te-form＋いる」代表什麼意思？（2種）</b><br><br>① <b>動作進行中</b>（An action in progress）  <br>② <b>與現在有關的過去事件</b>（A past event that is connected with the present）","<b>助動詞「いる」的時態變化（現在／過去 × 肯定／否定）？</b><br><br><b>現在肯定</b>：います（imasu）  <br><b>現在否定</b>：いません（imasen）  <br><b>過去肯定</b>：いました（imashita）  <br><b>過去否定</b>：いませんでした（imasendeshita）","<b>依語意，動詞大致可分為幾類？分別是什麼？</b><br><br>共 <b>3類</b>：  <br>(1) 表示<b>持續狀態</b>的動詞  <br>(2) 表示<b>持續一段時間的活動</b>的動詞  <br>(3) 表示<b>幾乎瞬間發生的變化</b>的動詞","<b>第①類「表示持續狀態」的動詞有哪些？其 Te-form＋いる 的用法？</b><br><br>目前學過的第①類動詞只有 <b>ある</b> 和 <b>いる</b>。  <br>這兩個動詞的 Te-form <b>從不與</b>助動詞「いる」連用，所以本節沒有相關內容可討論。","<b>第②類「表示持續一段時間活動」的動詞，其 Te-form＋いる 代表什麼意思？</b><br><br>表示<b>動作正在進行中</b>（action in progress）。  <br>許多動詞屬於此類，例如：  <br>食べる（たべる - to eat）  <br>読む（よむ - to read）  <br>待つ（まつ - to wait）","<b>「Te-form＋います」（動作進行中）與「辭書形＋ます」（未來動作）意義有何不同？請舉例說明。</b><br><br><b>動作進行中：</b>  <br>スーは<ruby>今<rt>いま</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>しています。  <br>Su- wa ima benkyoushite imasu.  <br>\"Sue is studying right now.\"","<b>勉強する（べんきょうする - to study）</b><br><br>スーは<ruby>今<rt>いま</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>しています。  <br>Su- wa ima benkyoushite imasu.  <br>\"Sue is studying right now.\"","<b>【總結】「Te-form＋いる」的用法與助動詞「いる」變化總表</b><br><br><b>Te-form＋いる 的兩種意思：</b>  <br>① 動作進行中  <br>② 與現在有關的過去事件"],"example":[]},{"num":94,"title":"〜ている 2","vocab":[{"t":"94課新單字整理（〜ている 2）","m":"結婚する（けっこんする）- 結婚 Tシャツ（Tしゃつ）- T恤 住む（すむ）- 居住 起きる（おきる）- 起床、醒著 勤める（つとめる）- 上班、任職 太る（ふとる）- 變胖 痩せる（やせる）- 變瘦 向かう（むかう）- 前往、朝向","say":"結婚する（けっこんする）- 結婚 シャツ"},{"t":"「中国に向かっています」是什麼意思？","m":"中国（ちゅうごく）に向（む）かっています。 ＝某人正在前往中國（還在路上，尚未抵達）","say":"<ruby>中国<rt>ちゅうごく</rt></ruby>に<ruby>向<rt>む</rt></ruby>かっています。"},{"t":"「私の家に向かっています」是什麼意思？","m":"私（わたし）の家（いえ）に向（む）かっています。 ＝某人正在來我家的路上（還沒到）","say":"<ruby>私<rt>わたし</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>に<ruby>向<rt>む</rt></ruby>かっています。"}],"grammar":["<b>〜ている的「いる」在現在／過去、肯定／否定時怎麼變化？</b><br><br><b>現在肯定</b>：います（imasu）  <br><b>現在否定</b>：いません（imasen）  <br><b>過去肯定</b>：いました（imashita）  <br><b>過去否定</b>：いませんでした（imasendeshita）","<b>て形+いる 可以表示哪三種意思？（本課跟93課的差異是什麼？）</b><br><br>(1) 表示<b>持續進行的動作／狀態</b>（continuous states）  <br>(2) 表示<b>持續一段時間的活動</b>（activities that last for some time）  <br>(3) 表示<b>瞬間發生的變化，變化後的結果殘留至今</b>（changes that are more or less instantaneous）<br><br>93課主要講(1)(2)類的用法；<b>94課專門講(3)類「瞬間變化動詞」</b>的〜ている用法。","<b>第三類（瞬間變化）動詞的〜ている是什麼意思？</b><br><br>這類動詞描述<b>從一個狀態瞬間變化到另一個狀態</b>（例如：結婚＝從單身變已婚）。<br><br>用〜ている時，表示<b>過去發生的變化，其結果一直持續到現在</b>，也就是「<b>結果殘留狀態</b>」，而不是「動作正在進行中」。","<b>第三類（瞬間變化）動詞有哪些常見例子？</b><br><br>持つ（もつ - motsu）- 有／拿著  <br>知る（しる - shiru）- 知道  <br>着る（きる - kiru）- 穿  <br>住む（すむ - sumu）- 住  <br>起きる（おきる - okiru）- 起床／醒著  <br>勤める（つとめる - tsutomeru）- 上班  <br>太る（ふとる - futoru）- 變胖  <br>痩せる（やせる - yaseru）- 變瘦","<b>「みのりは結婚しています」和「みのりは結婚します」意思差別？</b><br><br>みのりは<ruby>結婚<rt>けっこん</rt></ruby>しています。  <br>＝Minori 現在是<b>已婚狀態</b>（結婚＋ている＝現況・結果殘留）<br><br>みのりは<ruby>結婚<rt>けっこん</rt></ruby>します。  <br>＝Minori<b>將要結婚</b>（未來動作，用一般現在形）","<b>「みちこはTシャツを着ています」和「みちこはTシャツを着ます」意思差別？</b><br><br>みちこはTシャツ（しゃつ）を<ruby>着<rt>き</rt></ruby>ています。  <br>＝Michiko <b>現在穿著</b>T恤（現況・結果殘留）<br><br>みちこはTシャツ（しゃつ）を<ruby>着<rt>き</rt></ruby>ます。  <br>＝Michiko<b>將要穿</b>T恤（未來動作）","<b>「私は起きています」是什麼意思？</b><br><br><ruby>私<rt>わたし</rt></ruby>は起きています。  <br>＝我是<b>醒著的狀態</b>（起きる＝瞬間動作「醒來」，ている表示醒來後一直維持清醒的狀態）","<b>「さちこはユニクロで勤めています」是什麼意思？</b><br><br>さちこはユニクロで<ruby>勤<rt>つと</rt></ruby>めています。  <br>＝Sachiko<b>在UNIQLO工作</b>（現在任職於該公司，狀態的持續）","<b>行く、来る屬於第三類動詞，「行っている」「来ている」表示什麼？</b><br><br>行く（いく - to go）和来る（くる - to come）屬於第三類（瞬間變化）動詞。<br><br>「行っている」「来ている」表示<b>因先前的移動而產生的現在狀態</b>（已經去了／已經來了，現在人在那裡），<b>不是</b>「正在移動中」的意思。","<b>「中国に行っています」是什麼意思？（是不是「正在去中國」？）</b><br><br><ruby>中国<rt>ちゅうごく</rt></ruby>に<ruby>行<rt>い</rt></ruby>っています。  <br>＝某人<b>已經去了中國，現在人在中國</b>（結果殘留）  <br>❌ 不是「某人正在去中國的路上」","<b>「私の家にきています」是什麼意思？</b><br><br><ruby>私<rt>わたし</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>にきています。  <br>＝某人<b>已經來了我家，現在人在我家</b>  <br>❌ 不是「某人正在來我家的路上」","<b>如果要表達「某人正在前往／正在來你家的路上」（尚未抵達），該用哪個動詞？</b><br><br>用動詞<b><ruby>向<rt>む</rt></ruby>かう</b>（mukau，意思是「朝向、前往」）＋ています，來表示<b>正在移動、還沒到達</b>的狀態。<br><br>這跟「行っている／来ている」表示<b>已到達後的殘留狀態</b>不同。"],"example":[]},{"num":98,"title":"Te form for joining sentences","vocab":[{"t":"安い（やすい - yasui）","m":"Cheap（便宜的）","say":"安い"},{"t":"美味しい（おいしい - oishii）","m":"Delicious（好吃的）","say":"美味しい"},{"t":"広い（ひろい - hiroi）","m":"Spacious（寬敞的）","say":"広い"},{"t":"パン（ぱん - pan）","m":"Bread（麵包）","say":"パン"},{"t":"面白い（おもしろい - omoshiroi）","m":"Funny, Fun, Interesting（有趣的、好玩的）","say":"面白い"}],"grammar":["<b>親切な（しんせつな - shinsetsuna）</b><br><br>Kind（親切的）","<b>い形容詞、な形容詞、和「名詞＋です」的て形分別怎麼變化？て形除了原本的用法之外，還可以用來做什麼？</b><br><br>い形容詞、な形容詞和「名詞＋です」都各自有自己的て形，可以用來<b>把兩個要素連接起來，組成更長的句子</b>（例如中文的「又…又…」、「…而且…」）。<br><br>三種變化規則，並附上具體例字：<br><br>- い形容詞：把辭書形字尾的「い」換成「くて」。例：<ruby>安<rt>やす</rt></ruby>い（yasui，便宜）→<ruby>安<rt>やす</rt></ruby>くて（yasukute）<br>- 特殊形容詞いい（ii，好）：屬於不規則變化，て形是「よくて」（yokute），不是「いくて」。<br>- な形容詞：把辭書形字尾的「な」換成「で」。例：<ruby>元気<rt>げんき</rt></ruby>な（genkina，有精神）→<ruby>元気<rt>げんき</rt></ruby>で（genkide）<br>- 名詞＋です：把「です」換成「で」。例：<ruby>日本人<rt>にほんじん</rt></ruby>です（nihonjindesu）→<ruby>日本人<rt>にほんじん</rt></ruby>で（nihonjinde）<br><br>要注意的是，一個句子裡只有<b>排在前面、非句尾</b>的形容詞／名詞要改成て形；排在<b>句尾</b>的最後一個形容詞或名詞，仍然維持原本「現在肯定形」（い形容詞＋です／な形容詞＋です／名詞＋です），不需要變成て形。"],"example":[{"en":"Clean and spacious","jp":"<ruby>綺麗<rt>きれい</rt></ruby>で<ruby>広<rt>ひろ</rt></ruby>いです。","rj":"Kireide hiroi desu.","say":"綺麗で広いです。"},{"en":"Ken is Japanese and a student","jp":"けんは<ruby>日本人<rt>にほんじん</rt></ruby>で<ruby>学生<rt>がくせい</rt></ruby>です。","rj":"Ken wa nihonjinde gakuseidesu.","say":"けんは日本人で学生です。"},{"en":"Eri is energetic and fun.","jp":"えりは<ruby>元気<rt>げんき</rt></ruby>で<ruby>面白<rt>おもしろ</rt></ruby>いです。","rj":"Eri wa genkide omoshiroidesu.","say":"えりは元気で面白いです。"},{"en":"Anna is Korean and 22 years old.","jp":"あんなは<ruby>韓国人<rt>かんこくじん</rt></ruby>で22<ruby>歳<rt>さい</rt></ruby>です。","rj":"Anna wa kankokujinde nijuunisaidesu.","say":"あんなは韓国人で22歳です。"},{"en":"This bread is cheap and delicious.","jp":"このパンは<ruby>安<rt>やす</rt></ruby>くて<ruby>美味<rt>おい</rt></ruby>しいです。","rj":"Kono pan wa yasukute oishiidesu.","say":"このパンは安くて美味しいです。"},{"en":"Taro is tall and quiet.","jp":"たろうは<ruby>背<rt>せ</rt></ruby>が<ruby>高<rt>たか</rt></ruby>くて<ruby>静<rt>しず</rt></ruby>かです。","rj":"Taro wa segatakakute shizukadesu.","say":"たろうは背が高くて静かです。"},{"en":"Naomi is kind, funny and smart.","jp":"なおみは<ruby>親切<rt>しんせつ</rt></ruby>で<ruby>面白<rt>おもしろ</rt></ruby>くて<ruby>頭<rt>あたま</rt></ruby>が<ruby>良<rt>い</rt></ruby>いです。","rj":"Naomi wa shinsetsude omoshirokute atamagaiidesu.","say":"なおみは親切で面白くて頭が良いです。"}]},{"num":106,"title":"Verb stem + にいく","vocab":[{"t":"デパート（でぱーと / depa-to）","m":"Department store（百貨公司）","say":"デパート"},{"t":"バッグ（ばっぐ / baggu）","m":"Bag（包包）","say":"バッグ"},{"t":"街（まち / machi）","m":"Town（城鎮、街上）","say":"街"},{"t":"ビーチ（びーち / bi-chi）","m":"Beach（海灘）","say":"ビーチ"},{"t":"おばさん（obasan）","m":"Aunt（阿姨）","say":"おばさん"}],"grammar":["<b>サーフィンする（さーふぃんする / sa-finsuru）</b><br><br>To surf（衝浪）","<b>文法：動詞ます形語幹＋に行く（来る／帰る）是什麼意思？</b><br><br>當一個人為了做某件事而移動到別的地方時，可以用下面這個句型描述他的移動與移動的目的：<br><br>[目的地] に／へ　[目的] に　<ruby>行<rt>い</rt></ruby>く／<ruby>来<rt>く</rt></ruby>る／<ruby>帰<rt>かえ</rt></ruby>る","<b>文法：句型中的[目的]可以是哪兩種形式？</b><br><br>[目的]可以是：<br>(1) 一個名詞，例如「<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>（かいもの - shopping，買東西）」<br>(2) 一個「動詞＋受詞」組成的短語<br><br>如果[目的]裡面含有動詞，這個動詞一定要用「語幹形」——也就是把動詞現在式長體（ます形）的「ます」拿掉之後剩下的部分。","<b>總結：動詞ます形語幹＋に行く／来る／帰る的完整公式是什麼？</b><br><br>[目的地] に／へ　[目的] に　<ruby>行<rt>い</rt></ruby>く／<ruby>来<rt>く</rt></ruby>る／<ruby>帰<rt>かえ</rt></ruby>る<br><br>如果[目的]裡面包含動詞，這個動詞一定要用「語幹」形式，也就是把動詞長體（ます形）去掉「ます」後剩下的部分，例如：「<ruby>買<rt>か</rt></ruby>います→<ruby>買<rt>か</rt></ruby>い」、「<ruby>勉強<rt>べんきょう</rt></ruby>します→<ruby>勉強<rt>べんきょう</rt></ruby>し」、「<ruby>借<rt>か</rt></ruby>ります→<ruby>借<rt>か</rt></ruby>り」、「<ruby>会<rt>あ</rt></ruby>います→<ruby>会<rt>あ</rt></ruby>い」、「サーフィンします→サーフィンし」。"],"example":[{"en":"I went to a department store to buy a bag.","jp":"デパートにバッグを<ruby>買<rt>か</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きました。","rj":"Depa-to ni baggu o kai ni ikimashita.","say":"デパートにバッグを買いに行きました。"},{"en":"Mary has come to Japan to study Japanese.","jp":"メアリーは<ruby>日本<rt>にほん</rt></ruby>に<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しに<ruby>来<rt>き</rt></ruby>ました。","rj":"Meari- wa nihon ni nihongo o benkyoushi ni kimashita.","say":"メアリーは日本に日本語を勉強しに来ました。"},{"en":"I went to Kai's house to borrow a book.","jp":"<ruby>私<rt>わたし</rt></ruby>はかいの<ruby>家<rt>いえ</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>を<ruby>借<rt>か</rt></ruby>りに<ruby>行<rt>い</rt></ruby>きました。","rj":"Watashi wa kai no ie ni hon o kari ni ikimashita.","say":"私はかいの家に本を借りに行きました。"},{"en":"Akari went to the town to meet her aunt.","jp":"あかりは<ruby>街<rt>まち</rt></ruby>におばさんに<ruby>会<rt>あ</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きました。","rj":"Akari wa machi ni obasan ni ai ni ikimashita.","say":"あかりは街におばさんに会いに行きました。"},{"en":"Nana went to the beach to surf.","jp":"ななはビーチにサーフィンしに<ruby>行<rt>い</rt></ruby>きました。","rj":"Nana wa bi-chi ni sa-finshi ni ikimashita.","say":"ななはビーチにサーフィンしに行きました。"}]}],"adj":[{"num":74,"title":"い Adjectives","vocab":[{"t":"小さい（ちいさい - chiisai）是什麼意思？","m":"意思：小的（Small）","say":null},{"t":"美味しい（おいしい - oishii）是什麼意思？","m":"意思：好吃的（Delicious）","say":null},{"t":"寒い（さむい - samui）是什麼意思？","m":"意思：冷的（Cold）","say":null},{"t":"暑い（あつい - atsui）是什麼意思？","m":"意思：熱的（Hot）","say":null}],"grammar":["<b>日文形容詞分為哪兩種？名稱從何而來？</b><br><br>日文中的形容詞分為兩種：  <br>(1) い形容詞（い-adjectives）  <br>(2) な形容詞（な-adjectives）  <br>兩者名稱皆來自其字尾：修飾名詞時，字尾分別是「い」或「な」。","<b>い形容詞（字尾為「い」）的現在肯定、現在否定、過去肯定、過去否定怎麼變化？</b><br><br>規則（字尾 ーい，即 ーi）：  <br><b>現在肯定</b>：ーいです。(-idesu.)  <br><b>現在否定</b>：ーくないです。(-kunaidesu.)  <br><b>過去肯定</b>：ーかったです。(-kattadesu.)  <br><b>過去否定</b>：ーくなかったです。(-kunakattadesu.)","<b>面白い（おもしろい - omoshiroi）是什麼意思？它的四種變化形是？</b><br><br>意思：有趣的、好笑的（Interesting, Funny）  <br><b>現在肯定</b>：面白いです。(omoshiroidesu.)  <br><b>現在否定</b>：面白くないです。(omoshirokunaidesu.)  <br><b>過去肯定</b>：面白かったです。(omoshirokattadesu.)  <br><b>過去否定</b>：面白くなかったです。(omoshirokunakattadesu.)","<b>怖い（こわい - kowai）是什麼意思？它的四種變化形是？</b><br><br>意思：可怕的（Scary）  <br><b>現在肯定</b>：怖いです。(kowaidesu.)  <br><b>現在否定</b>：怖くないです。(kowakunaidesu.)  <br><b>過去肯定</b>：怖かったです。(kowakattadesu.)  <br><b>過去否定</b>：怖くなかったです。(kowakunakattadesu.)","<b>大きい（おおきい - ookii）是什麼意思？它的四種變化形是？</b><br><br>意思：大的（Big, Large）  <br><b>現在肯定</b>：大きいです。(ookiidesu.)  <br><b>現在否定</b>：大きくないです。(ookikunaidesu.)  <br><b>過去肯定</b>：大きかったです。(ookikattadesu.)  <br><b>過去否定</b>：大きくなかったです。(ookikunakattadesu.)","<b>請整理い形容詞的四種變化形（現在肯定、現在否定、過去肯定、過去否定），並以「面白い」為例。</b><br><br><b>い形容詞變化總表</b>（字尾 ーい）：  <br><b>現在肯定</b>：ーいです。例：面白いです。(omoshiroidesu.)  <br><b>現在否定</b>：ーくないです。例：面白くないです。(omoshirokunaidesu.)  <br><b>過去肯定</b>：ーかったです。例：面白かったです。(omoshirokattadesu.)  <br><b>過去否定</b>：ーくなかったです。例：面白くなかったです。(omoshirokunakattadesu.)"],"example":[{"en":"This cake is delicious.","jp":"このケーキは<ruby>美味<rt>おい</rt></ruby>しいです。","rj":"Kono ke-ki wa oishiidesu.","say":"このケーキは美味しいです。"},{"en":"It is not cold today.","jp":"<ruby>今日<rt>きょう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>くないです。","rj":"Kyou wa samukunaidesu.","say":"今日は寒くないです。"},{"en":"This T-shirt was small.","jp":"このTシャツは<ruby>小<rt>ちい</rt></ruby>さかったです。","rj":"Kono ti-shatsu wa chiisakattadesu.","say":"このTシャツは小さかったです。"},{"en":"It was not hot yesterday.","jp":"<ruby>昨日<rt>きのう</rt></ruby>は<ruby>暑<rt>あつ</rt></ruby>くなかったです。","rj":"Kinou wa atsukunakattadesu.","say":"昨日は暑くなかったです。"}]},{"num":75,"title":"な Adjectives","vocab":[{"t":"ーな (ー na)","m":"肯定・現在：ーです。 (ー desu.) 否定・現在：ーじゃないです。 (ー janaidesu.) 肯定・過去：ーでした。 (ー deshita.) 否定・過去：ーじゃなかったです。 (ー janakattadesu.)","say":"ーな"},{"t":"な-Adjectives 變化總表","m":"（現在/過去 × 肯定/否定） Tense / Affirmative / Negative 現在肯定：ーです。 (ー desu.) 現在否定：ーじゃないです。 (ー janaidesu.) 過去肯定：ーでした。 (ー deshita.) 過去否定：ーじゃなかったです。 (ー janakattadesu.) 範例（元気な）： 元気です／元気じゃないです 元気でした／元気じゃなかったです","say":null},{"t":"元気な","m":"げんきな - genkina Cheerful, Energetic 現在肯定：元気（げんき）です。 (genki desu.) 現在否定：元気（げんき）じゃないです。 (genki janaidesu.) 過去肯定：元気（げんき）でした。 (genki deshita.) 過去否定：元気（げんき）じゃなかったです。 (genki janakattadesu.)","say":"元気な"},{"t":"有名な","m":"ゆうめいな - yuumeina Famous 現在肯定：有名（ゆうめい）です。 (yuumei desu.) 現在否定：有名（ゆうめい）じゃないです。 (yuumei janaidesu.) 過去肯定：有名（ゆうめい）でした。 (yuumei deshita.) 過去否定：有名（ゆうめい）じゃなかったです。 (yuumei janakattadesu.)","say":"有名な"},{"t":"綺麗な","m":"きれいな - kireina Beautiful 現在肯定：綺麗（きれい）です。 (kirei desu.) 現在否定：綺麗（きれい）じゃないです。 (kirei janaidesu.) 過去肯定：綺麗（きれい）でした。 (kirei deshita.) 過去否定：綺麗（きれい）じゃなかったです。 (kirei janakattadesu.)","say":"綺麗な"}],"grammar":["**な形容詞的現在/過去・肯定/否定要怎麼變化？  <br>（跟い形容詞有什麼不同？）**<br><br><b>な形容詞的變化，跟「名詞＋です」完全一樣</b>（不是像い形容詞那樣字尾自己變化）。  <br>但要注意：接です／でした時，字尾的「な」要<b>去掉</b>（例：元気な→元気です，不是元気なです）。"],"example":[{"en":"The library is quiet.","jp":"<ruby>図書館<rt>としょかん</rt></ruby>は<ruby>静<rt>しず</rt></ruby>かです。","rj":"Toshokan wa shizuka desu.","say":"図書館は静かです。"},{"en":"This restaurant is not popular.","jp":"このレストランは<ruby>人気<rt>にんき</rt></ruby>じゃないです。","rj":"Konoresutoran wa ninkijanai desu.","say":"このレストランは人気じゃないです。"},{"en":"This house was dangerous.","jp":"この<ruby>家<rt>いえ</rt></ruby>は<ruby>危険<rt>きけん</rt></ruby>でした。","rj":"Kono ie wa kiken deshita.","say":"この家は危険でした。"},{"en":"The tool was not convenient.","jp":"<ruby>道具<rt>どうぐ</rt></ruby>は<ruby>便利<rt>べんり</rt></ruby>じゃなかったです。","rj":"Dougu wa benrijanakatta desu.","say":"道具は便利じゃなかったです。"}]},{"num":76,"title":"Irregular Adjectives","vocab":[{"t":"不規則形容詞的規則","m":"い形容詞的活用基本上是規則的，但有一個例外形容詞，它的變化規則是什麼？ 例外是 いい（良い）- Good。 いい 的第一個音節「い」，除了辭書形和現在肯定（禮貌）形以外，其餘所有活用形都會變成「よ」。","say":null}],"grammar":["**下列不規則形容詞（いい系，表示「好的」）的發音和意思是什麼？  <br>良い／かっこいい／心地いい**<br><br>・良い（いい, ii）- Good  <br>・かっこいい（kakkoii）- Handsome  <br>・心地いい（ここちいい, kokochiii）- Comfortable","<b>「</b>良い（いい）<b> - Good」的現在式・過去式（肯定・否定）是？</b><br><br><b>現在肯定:</b> いいです。(iidesu.)  <br><b>現在否定:</b> よくないです。(yokunaidesu.)  <br><b>過去肯定:</b> よかったです。(yokattadesu.)  <br><b>過去否定:</b> よくなかったです。(yokunakattadesu.)","<b>「</b>かっこいい<b> - Handsome」的現在式・過去式（肯定・否定）是？</b><br><br><b>現在肯定:</b> かっこいいです。(kakkoiidesu.)  <br><b>現在否定:</b> かっこよくないです。(kakkoyokunai.)  <br><b>過去肯定:</b> かっこよかったです。(kakkoyokattadesu.)  <br><b>過去否定:</b> かっこよくなかったです。(kakkoyokunakattadesu.)","<b>「</b>心地いい（ここちいい）<b> - Comfortable」的現在式・過去式（肯定・否定）是？</b><br><br><b>現在肯定:</b> <ruby>心地<rt>ここち</rt></ruby>いいです。(kokochiiidesu.)  <br><b>現在否定:</b> <ruby>心地<rt>ここち</rt></ruby>よくないです。(kokochiyokunai.)  <br><b>過去肯定:</b> <ruby>心地<rt>ここち</rt></ruby>よかったです。(kokochiyokattadesu.)  <br><b>過去否定:</b> <ruby>心地<rt>ここち</rt></ruby>よくなかったです。(kokochiyokunakattadesu.)","<b>不規則形容詞（いい系）的三種活用模式歸納起來是？</b><br><br><b>規則:</b> 第一個「い」除了辭書形和現在肯定形以外，其餘全部變成「よ」。<br><br><b>良い(いい):</b> いいです／よくないです／よかったです／よくなかったです  <br><b>かっこいい:</b> かっこいいです／かっこよくないです／かっこよかったです／かっこよくなかったです  <br><b>心地いい:</b> 心地いいです／心地よくないです／心地よかったです／心地よくなかったです","<b>中文補充筆記：為什麼「いい」特別？</b><br><br>- い形容詞的變化通常很規則(例：高い→高くない→高かった),但「いい(良い)- 好的」是唯一例外。<br>- 「いい」其實是「よい」的口語變體,兩者現代日文都存在(「よい」較文語/書面)。<br>- 肯定形習慣用口語的「いい」,但否定形、過去形則「回歸」書面語「よい」的語幹「よ」再變化。<br>- 記憶口訣：只有句尾直接肯定時保持「いい」原樣,其他時候前面的「い」全部變成「よ」,再套用一般い形容詞公式(よ+くない／よ+かった／よ+くなかった)。<br><br>|                | 辭書形     | 現在肯定       | 現在否定           | 過去肯定           | 過去否定               |<br>| -------------- | ---------- | -------------- | ------------------ | ------------------ | ---------------------- |<br>| 良い(好)       | いい       | いいです       | よくないです       | よかったです       | よくなかったです       |<br>| かっこいい(帥) | かっこいい | かっこいいです | かっこよくないです | かっこよかったです | かっこよくなかったです |<br>| 心地いい(舒服) | 心地いい   | 心地いいです   | 心地よくないです   | 心地よかったです   | 心地よくなかったです   |"],"example":[]},{"num":77,"title":"すきな、きらいな","vocab":[{"t":"春","m":"はる (haru) 春天 (Spring)","say":"春"},{"t":"夏","m":"なつ (natsu) 夏天 (Summer)","say":"夏"},{"t":"秋","m":"あき (aki) 秋天 (Autumn)","say":"秋"},{"t":"冬","m":"ふゆ (fuyu) 冬天 (Winter)","say":"冬"},{"t":"季節","m":"きせつ (kisetsu) 季節 (Seasons)","say":"季節"},{"t":"好き","m":"すき (suki) 喜歡 (to like) - な形容詞","say":"好き"},{"t":"嫌い","m":"きらい (kirai) 不喜歡、討厭 (to dislike) - な形容詞","say":"嫌い"},{"t":"「X喜歡Y」的句型是？","m":"X は Y が 好（す）きです。 (X wa Y ga sukidesu.) ＝ X likes Y","say":null},{"t":"「X不喜歡Y」的句型是？","m":"X は Y が 嫌（きら）いです。 (X wa Y ga kiraidesu.) ＝ X dislikes Y","say":null},{"t":"總表：「すき／きらい」句型比較","m":"X喜歡Y： X は Y が 好（す）きです。（sukidesu） X不喜歡Y： X は Y が 嫌（きら）いです。（kiraidesu） 助詞規則： 「は」→ 接喜歡/不喜歡的人 「が」→ 接被喜歡/不喜歡的人或事物","say":null},{"t":"總表：關於すき／きらい的3個補充重點","m":"(1) 強調「非常喜歡/討厭」可用だいすき或だいきらい。 (2) 表達「不喜歡也不討厭」：好きでも嫌いでもありません。 (3) すきな和きらいな可作為名詞修飾語（放在名詞前）。 (4) 用「好(だい)きです」表達對某個人的非常喜歡","say":null}],"grammar":["<b>「すき」和「きらい」是什麼詞類？各自的意思是？</b><br><br>都是<b>な形容詞</b>（な-adjective）  <br>好き（すき）な → 喜歡的 (to be fond of; to like)  <br>嫌い（きらい）な → 討厭的 (to be disgusted with; to dislike)","<b>用「すき／きらい」表達喜好時，句子需要哪兩個要素？分別搭配什麼助詞？</b><br><br>需要兩個對象：  <br>(1) 喜歡/不喜歡某事物的<b>人</b> → 搭配助詞「は」  <br>(2) 被喜歡/不喜歡的<b>人或事物</b> → 搭配助詞「が」<br><br>規則：  <br>「は」接在喜歡/不喜歡某事物的<b>人</b>後面。  <br>「が」接在被喜歡/不喜歡的<b>事物或人</b>後面。","<b>用「好きです」表達對某個人的喜歡時要注意什麼？</b><br><br>被喜歡/不喜歡的對象也可以是<b>人</b>。  <br>但要小心：對特定的人說「<ruby>好<rt>す</rt></ruby>きです」通常會被理解為<b>告白／有戀愛意味</b>（romantic interest），使用時要謹慎。","<b>如何表達「非常喜歡／非常不喜歡」某事物？</b><br><br>使用強調形：  <br><b>だいすきです</b>（daisukidesu）＝ X likes Y very much  <br><b>だいきらいです</b>（daikiraidesu）＝ X dislikes Y very much<br><br>這種形式比「すき（な）／きらい（な）＋とても」的組合更常用。","<b>如何表達「不喜歡也不討厭（沒有特別感覺）」？</b><br><br><b><ruby>好<rt>す</rt></ruby>きでも<ruby>嫌<rt>きら</rt></ruby>いでもありません。</b>  <br>(suki demo kirai demo arimasen.)  <br>＝ I neither like nor dislike (it)."],"example":[{"en":"This is my favourite TV show.","jp":"これはわたしのすきなテレビです。","rj":"kore wa watashino sukina terebi desu.","say":"これはわたしのすきなテレビです。"},{"en":"Robert likes his Japanese classes.","jp":"ロバートは日本語のクラスが好きです。","rj":"Robert wa nihongo no kurasu ga sukidesu.","say":"ロバートは日本語のクラスが好きです。"},{"en":"I dislike fish.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>魚<rt>さかな</rt></ruby>が<ruby>嫌<rt>きら</rt></ruby>いです。","rj":"watashi wa sakana ga kiraidesu.","say":"私は魚が嫌いです。"},{"en":"My younger sister likes summer.","jp":"<ruby>私<rt>わたし</rt></ruby>の<ruby>妹<rt>いもうと</rt></ruby>は<ruby>夏<rt>なつ</rt></ruby>が<ruby>好<rt>す</rt></ruby>きです。","rj":"watashi no imouto wa natsu ga sukidesu.","say":"私の妹は夏が好きです。"},{"en":"Do you like winter?","jp":"あなたは<ruby>冬<rt>ふゆ</rt></ruby>が<ruby>好<rt>す</rt></ruby>きですか？","rj":"anata wa fuyu ga sukidesuka?","say":"あなたは冬が好きですか？"},{"en":"I like Spring very much.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>春<rt>はる</rt></ruby>が<ruby>大好<rt>だいす</rt></ruby>きです。","rj":"watashi wa haru ga daisukidesu.","say":"私は春が大好きです。"},{"en":"I also like autumn very much.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>秋<rt>あき</rt></ruby>も<ruby>大好<rt>だいす</rt></ruby>きです。","rj":"watashi wa aki mo daisukidesu.","say":"私は秋も大好きです。"}]},{"num":78,"title":"Degree Expressions","vocab":[],"grammar":["<b>な形容詞 すき（喜歡）和 きらい（討厭）要表示「非常喜歡／非常討厭」時，用法上有什麼特別之處？</b><br><br>すき(な)、きらい(な) <b>不加とても</b>，而是有自己專屬的加強形式：<br><br>大好き（だいすき）(な) = 非常喜歡  <br>大嫌い（だいきらい）(な) = 非常討厭","<b>「たけしさんはコーヒーが<ruby>大好<rt>だいす</rt></ruby>きです。」是什麼意思？還有其他說法嗎？</b><br><br>たけしさんはコーヒー（こーひー）が<ruby>大好<rt>だいす</rt></ruby>きです。  <br>= 武志先生非常喜歡咖啡。<br><br>也可以說：  <br>たけしさんはコーヒーがとても<ruby>好<rt>す</rt></ruby>きです。  <br>（用「とても＋好き」表達相同意思）","<b>整理：日文</b>程度副詞<b>對照表（とても vs ちょっと）</b><br><br><b>程度副詞一律放在形容詞之前</b><br><br>とても (totemo) = 很／非常（高程度）  <br>ちょっと (chotto) = 一點點／稍微（低程度）"],"example":[{"en":"The sea in Okinawa was very beautiful.","jp":"<ruby>沖縄<rt>おきなわ</rt></ruby>の<ruby>海<rt>うみ</rt></ruby>はとても<ruby>綺麗<rt>きれい</rt></ruby>でした。","rj":"Okinawa no umi wa totemo kirei deshita.","say":"沖縄の海はとても綺麗でした。"},{"en":"This room is a little hot.","jp":"この<ruby>部屋<rt>へや</rt></ruby>はちょっと<ruby>暑<rt>あつ</rt></ruby>いです。","rj":"Kono heya wa chotto atsui desu.","say":"この部屋はちょっと暑いです。"}]},{"num":102,"title":"(Body part)が(adjective)です","vocab":[{"t":"Eyes","m":"目（め - me）","say":"目（め"},{"t":"Legs","m":"足（あし - ashi）","say":"足（あし"},{"t":"Hair","m":"髪（かみ - kami）","say":"髪（かみ"},{"t":"Head","m":"頭（あたま - atama）","say":"頭（あたま"},{"t":"Face","m":"顔（かお - kao）","say":"顔（かお"},{"t":"Mouth","m":"口（くち - kuchi）","say":"口（くち"},{"t":"Nose","m":"鼻（はな - hana）","say":"鼻（はな"}],"grammar":["<b>注意：</b>若只說「とむの髪は長いです」（Tom&#x27;s hair is long）較不自然，正確説法是把身體部位當作主語用「が」表示。此用法不只限於頭髮長度，也適用於描述人的各種身體特徵。","**在「(Body part)が(Adjective)です」句型中，以下慣用搭配是什麼意思？  <br>背が高い／背が低い／頭が良い**<br><br><ruby>背<rt>せ</rt></ruby>が<ruby>高<rt>たか</rt></ruby>い - （身高）高  <br><ruby>背<rt>せ</rt></ruby>が<ruby>低<rt>ひく</rt></ruby>い - （身高）矮  <br><ruby>頭<rt>あたま</rt></ruby>が<ruby>良<rt>い</rt></ruby>い - 聰明、腦筋好<br><br>這些是慣用搭配（idiomatic collocations），字面上是「身高是高的／矮的」「頭腦是好的」，整體用來形容一個人。","<b>使用「(Person)は(Body part)が(Adjective)です」句型時，要注意什麼？</b><br><br>要依句子情況調整形容詞的形態，例如：  <br>・否定：〜くないです（例：小さくないです）  <br>・疑問：〜ですか？  <br>・過去等其他時態也要相應變化。"],"example":[{"en":"Tom has long hair.","jp":"とむは<ruby>髪<rt>かみ</rt></ruby>が<ruby>長<rt>なが</rt></ruby>いです。","rj":"Tom wa kami ga nagaidesu.","say":"とむは髪が長いです。"},{"en":"Kenta has long legs.","jp":"けんたは<ruby>足<rt>あし</rt></ruby>が<ruby>長<rt>なが</rt></ruby>いです。","rj":"kenta wa ashi ga nagaidesu.","say":"けんたは足が長いです。"},{"en":"Akiko has a small nose.","jp":"あきこは<ruby>鼻<rt>はな</rt></ruby>が<ruby>小<rt>ちい</rt></ruby>さいです。","rj":"akiko wa hana ga chiisaidesu.","say":"あきこは鼻が小さいです。"},{"en":"Mickey Mouse has huge hands.","jp":"ミッキーマウスは<ruby>手<rt>て</rt></ruby>が<ruby>大<rt>おお</rt></ruby>きいです。","rj":"mikkiimausu wa te ga ookiidesu.","say":"ミッキーマウスは手が大きいです。"},{"en":"Yoko is tall.","jp":"ようこは<ruby>背<rt>せ</rt></ruby>が<ruby>高<rt>たか</rt></ruby>いです。","rj":"youko wa se ga takaidesu.","say":"ようこは背が高いです。"},{"en":"My mother is short.","jp":"<ruby>私<rt>わたし</rt></ruby>のお<ruby>母<rt>かあ</rt></ruby>さんは<ruby>背<rt>せ</rt></ruby>が<ruby>低<rt>ひく</rt></ruby>いです。","rj":"watashi no okaasan wa se ga hikuidesu.","say":"私のお母さんは背が低いです。"},{"en":"Mary has small eyes.","jp":"メアリーは<ruby>目<rt>め</rt></ruby>が<ruby>小<rt>ちい</rt></ruby>さいです。","rj":"meari- wa me ga chiisaidesu.","say":"メアリーは目が小さいです。"},{"en":"Taro is smart.","jp":"たろうは<ruby>頭<rt>あたま</rt></ruby>が<ruby>良<rt>い</rt></ruby>いです。","rj":"tarou wa atama ga iidesu.","say":"たろうは頭が良いです。"},{"en":"Is Kiyoshi tall?","jp":"きよしは<ruby>背<rt>せ</rt></ruby>が<ruby>高<rt>たか</rt></ruby>いですか？","rj":"kiyoshi wa se ga takaidesuka?","say":"きよしは背が高いですか？"},{"en":"Akane does not have small eyes.","jp":"あかねは<ruby>目<rt>め</rt></ruby>が<ruby>小<rt>ちい</rt></ruby>さくないです。","rj":"akane wa me ga chiisakunaidesu.","say":"あかねは目が小さくないです。"}]},{"num":135,"title":"Qualifying Nouns with Verbs and Adjectives","vocab":[{"t":"四種類型對照表：","m":"1. 單純形容詞修飾 → おもしろい人（有趣的人） 2. 屬性描述句 → 髪が長い人（長頭髮的人） 3. 動詞短型修飾 → めがねをかけている人（戴眼鏡的人） 4. 關係性な形容詞修飾 → バスケットボールをするのが好きな友達（喜歡打籃球的朋友）","say":"四種類型對照表"}],"grammar":["<b>日文中，名詞修飾（noun qualification）常見的四種類型是什麼？</b><br><br>1. 單純形容詞修飾 (a straightforward adjectival example)<br>2. 描述人物屬性的句子 (a phrase describing a person&#x27;s attribute)<br>3. 動詞短型修飾 (a verb in the short form)<br>4. 關係性な形容詞修飾 (a な-adjective which is relational)","<b>「</b>おもしろい　<ruby>人<rt>ひと</rt></ruby><b>」(omoshiroi hito) 是什麼意思？屬於名詞修飾的哪一種類型？</b><br><br>意思：<b>有趣的人</b> / \"An interesting person\" (直譯：a person who is interesting)<br><br>類型：<b>單純形容詞修飾</b> (a straightforward adjectival example)  <br>おもしろい = Qualifying adjective　　人 = Qualified noun","<b>「あそこ で <ruby>写真<rt>しゃしん</rt></ruby>を とっている ひと は だれですか？」中文意思是什麼？句子結構如何拆解？</b><br><br>中文：<b>那邊在拍照的人是誰？</b> / \"Who is the person who is taking pictures over there?\"<br><br>結構拆解：  <br>[あそこで写真をとっている]（修飾句：正在那邊拍照）+ [ひと]（被修飾名詞：人）+ [はだれですか？]（是誰呢？）","<b>「<ruby>毎日<rt>まいにち</rt></ruby><ruby>運動<rt>うんどう</rt></ruby>する　<ruby>人<rt>ひと</rt></ruby>は げんきです。」中文意思是什麼？句子結構如何拆解？</b><br><br>中文：<b>每天做運動的人很健康。</b> / \"People who do physical exercises everyday are healthy.\"<br><br>結構拆解：  <br>[毎日運動する]（修飾句，動詞辭書形：每天做運動）+ [人]（被修飾名詞）+ [はげんきです]（很健康）","<b>「たばこ を <ruby>吸<rt>す</rt></ruby>わない　ひと が すきです。」中文意思是什麼？句子結構如何拆解？</b><br><br>中文：<b>我喜歡不吸菸的人。</b> / \"I like people who do not smoke.\"<br><br>結構拆解：  <br>[たばこを吸わない]（修飾句，動詞ない形：不吸菸）+ [ひと]（被修飾名詞）+ [がすきです]（喜歡）","<b>「<ruby>去年<rt>きょねん</rt></ruby><ruby>結婚<rt>けっこん</rt></ruby>した　ともだち から てがみ が きました。」中文意思是什麼？句子結構如何拆解？</b><br><br>中文：<b>去年結婚的朋友寄來了信。</b> / \"A letter came from a friend who got married last year.\"<br><br>結構拆解：  <br>[去年結婚した]（修飾句，動詞た形/過去式：去年結婚了）+ [ともだち]（被修飾名詞：朋友）+ [からてがみがきました]（寄來了信）","<b>「バスケットボール を するのが <ruby>好<rt>す</rt></ruby>きな　<ruby>私<rt>わたし</rt></ruby>の <ruby>友達<rt>ともだち</rt></ruby>」是什麼意思？屬於名詞修飾的哪一種類型？</b><br><br>意思：<b>喜歡打籃球的我的朋友</b> / \"A friend of mine who likes to play basketball.\"<br><br>類型：<b>關係性な形容詞修飾</b> (has a な-adjective which is relational)  <br>バスケットボールをするのが好きな = Qualifying phrase（な形容詞：好きな）　　私の友達 = Qualified noun","<b>【總結】日文名詞修飾的核心規則是什麼？四種類型各舉一例，整理成對照表。</b><br><br><b>核心規則</b>：動詞的短型（辭書形／ない形／た形／ている形）可以像形容詞一樣修飾名詞。"],"example":[{"en":"「The student who is reading a book over there is Michiko.」","jp":"あそこで<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでいる<ruby>学生<rt>がくせい</rt></ruby>はみちこです。","rj":"Asokode hon o yondeiru gakusei wa michiko desu.","say":"あそこで本を読んでいる学生はみちこです。"}]}],"short-form":[{"num":115,"title":"Present tense Short form - Affirmative Conjugation","vocab":[],"grammar":["<b>總結：現在式短形肯定變化，Group A 和 Group B 的規則各是什麼？</b><br><br>Group A（動詞、い形容詞）：短形＝辭書形，不需要做任何變化。例如「読む」、「かわいい」。  <br>Group B（な形容詞、名詞+です）：把長形句尾的「です」換成「だ」。例如「静かだ」、「学生だ」。"],"example":[{"en":"I eat steaks.","jp":"ステーキを<ruby>食<rt>た</rt></ruby>べる。","rj":"Sute-ki o taberu.","say":"ステーキを食べる。"},{"en":"This house is big","jp":"この<ruby>家<rt>いえ</rt></ruby>は<ruby>大<rt>おお</rt></ruby>きい。","rj":"Kono ie wa ookii.","say":"この家は大きい。"},{"en":"The library is quiet","jp":"<ruby>図書館<rt>としょかん</rt></ruby>は<ruby>静<rt>しず</rt></ruby>かだ。","rj":"Toshokan wa shizukada.","say":"図書館は静かだ。"},{"en":"I am a student.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>だ。","rj":"Watashi wa gakuseida.","say":"私は学生だ。"}]},{"num":116,"title":"Present tense Short form - Short form Negative Conjugation","vocab":[],"grammar":["<b>な形容詞、い形容詞、以及「名詞＋です」的現在式短形否定，共同規則是什麼？（Group C）</b><br><br>規則很簡單：把長形否定句尾的「です」拿掉，就是短形否定，其他部分完全不變。<br><br>い形容詞：かわいい（可愛的）→ 長形：かわいくないです（kawaikunaidesu）→ 短形：かわいくない（kawaikunai，不可愛）  <br>な形容詞：静か（しずか / shizuka，安靜的）→ 長形：静か（しずか）じゃないです（shizukajanaidesu）→ 短形：静か（しずか）じゃない（shizukajanai，不安靜）  <br>名詞＋です：学生（がくせい / gakusei，學生）→ 長形：<ruby>学生<rt>がくせい</rt></ruby>じゃないです（gakuseijanaidesu）→ 短形：<ruby>学生<rt>がくせい</rt></ruby>じゃない（gakuseijanai，不是學生）<br><br>文法說明：無論是い形容詞、な形容詞，還是「名詞＋です」，現在式否定的長形一定以「です」結尾，短形否定只要把這個「です」去掉即可，不需要再做其他變化。","<b>Ru動詞（る動詞）現在式短形否定怎麼變化？以「食べる」為例</b><br><br><ruby>食<rt>た</rt></ruby>べる（taberu，辭書形，吃）→ <ruby>食<rt>た</rt></ruby>べない（tabenai，短形否定，不吃）<br><br>文法說明：「食べる」是Ru動詞，語幹是「食べ」，辭書形在語幹後面加「る」。短形否定的規則是把辭書形字尾的「る」去掉，直接加上「ない」，語幹「食べ」本身不需要再變化。","<b>U動詞（う動詞）現在式短形否定怎麼變化？以「書く」為例</b><br><br><ruby>書<rt>か</rt></ruby>く（kaku，辭書形，寫）→ <ruby>書<rt>か</rt></ruby>かない（kakanai，短形否定，不寫）<br><br>文法說明：「書く」是U動詞，辭書形字尾是「く」（子音k+母音u）。短形否定的規則是把字尾的母音「u」去掉，改成「a」，再加上「ない」，也就是「く（ku）→か（ka）+ない」。","<b>U動詞「待つ」的現在式短形否定怎麼變化？</b><br><br><ruby>待<rt>ま</rt></ruby>つ（matsu，辭書形，等待）→ <ruby>待<rt>ま</rt></ruby>たない（matanai，短形否定，不等）<br><br>文法說明：「待つ」字尾是「つ（tsu）」，同樣是U動詞，把字尾母音「u」去掉改成「a」再加「ない」，即「つ（tsu）→た（ta）+ない」，變成「待たない（matanai）」。","<b>不規則動詞「する」的現在式短形否定是什麼？</b><br><br>する（suru，辭書形，做）→ しない（shinai，短形否定，不做）<br><br>文法說明：「する」是日文兩個不規則動詞之一，不套用Ru動詞或U動詞的規則，短形否定直接死記為「しない」。","<b>不規則動詞「来る」的現在式短形否定是什麼？為什麼要特別注意？</b><br><br><ruby>来<rt>く</rt></ruby>る（kuru，辭書形，來）→ <ruby>来<rt>こ</rt></ruby>ない（konai，短形否定，不來）<br><br>文法說明：「来る」是另一個不規則動詞，短形否定時「来」的讀音會從「く（ku）」變成「こ（ko）」，也就是母音跟著改變（く→こ），這點跟規則變化的Ru動詞、U動詞都不同，需要特別記住。","<b>動詞現在式短形否定還有什麼特殊例外？字尾是「う」的動詞為什麼是「わない」而不是「あない」？</b><br><br><ruby>買<rt>か</rt></ruby>う（kau，辭書形，買）→ <ruby>買<rt>か</rt></ruby>わない（kawanai，短形否定，不買）<br><br>文法說明：依照一般U動詞規則，字尾「う（u）」去掉母音u該加上「あ（a）+ない」，但字尾本身就是假名「う」的動詞例外，是加上「わ（wa）+ない」而不是「あ（a）+ない」，所以是「買わない（kawanai）」，不是「買あない」。","<b>「ある」（表示無生命物存在）的現在式短形否定為什麼特別？</b><br><br>ある（aru，辭書形，有／存在）→ ない（nai，短形否定，沒有）<br><br>文法說明：「ある」字尾是「る」，若照一般U動詞規則變化，短形否定應該是「あらない（aranai）」，但實際上「ある」的否定是不規則的「ない（nai）」，這是需要單獨記住的例外用法。","<b>例外規則</b>：字尾是「う」的動詞，短形否定加「わない」而不是「あない」（例：<ruby>買<rt>か</rt></ruby>う→<ruby>買<rt>か</rt></ruby>わない）；「ある」的短形否定不規則地變成「ない」（不是「あらない」）。"],"example":[{"en":"This house is not small","jp":"この<ruby>家<rt>いえ</rt></ruby>は<ruby>小<rt>ちい</rt></ruby>さくない。","rj":"Kono ie wa chiisakunai.","say":"この家は小さくない。"},{"en":"The library is not quiet.","jp":"<ruby>図書館<rt>としょかん</rt></ruby>は静か（しずか）じゃない。","rj":"Toshokan wa shizukajanai.","say":"図書館は静かじゃない。"},{"en":"I am not a student.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>じゃない。","rj":"Watashi wa gakuseijanai.","say":"私は学生じゃない。"},{"en":"I don't eat steaks.","jp":"ステーキを<ruby>食<rt>た</rt></ruby>べない。","rj":"Sute-ki o tabenai.","say":"ステーキを食べない。"},{"en":"I don't drink beer.","jp":"ビールを<ruby>飲<rt>の</rt></ruby>まない。","rj":"Bi-ru o nomanai.","say":"ビールを飲まない。"}]},{"num":117,"title":"Usage of short forms 1 - Quotation","vocab":[],"grammar":["常體短形除了本身可以當作句子的結尾之外，還有另外四種特別的用法：(1) 引用「某人説…」、「我覺得…」；(2) 用在朋友間輕鬆的對話中，表示親密感；(3) 用於委婉的否定請求（「請不要…」）；(4) 用於表達喜好或擅長（「我喜歡做…」、「我擅長做…」）。本章只介紹第一種用法：引用。","<b>常體短形要怎麼用來「引用」某人說的話或自己的想法？</b><br><br>引用別人説的話或自己的想法時，要用「以常體短形結尾的子句」加上「と<ruby>言<rt>い</rt></ruby>っていました。」（他/她説過…）或「と<ruby>思<rt>おも</rt></ruby>います。」（我覺得…）。<br><br>～常體短形＋と<ruby>言<rt>い</rt></ruby>っていました。(to itteimashita) → 某人説了…<br>～常體短形＋と<ruby>思<rt>おも</rt></ruby>います。(to omoimasu) → 我覺得…<br><br>文法說明：「と」是引用助詞，相當於英文間接引語中的 that，也相當於直接引語中的引號「\"\"」。無論是引用別人説的話，還是表達自己的想法，前面接的子句一定要用常體短形結尾，不能用敬體（ます/です）結尾。","<b>用「思う」表達否定的想法時，為什麼日文比較常説「～ないと思います」而不是「～と思いません」？</b><br><br>日文中要表達「我覺得不是這樣」時，比起把「思います」本身變成否定形「思いません」，更常見的説法是把前面的常體子句變成否定形，再接肯定的「と思います」，也就是「常體否定形＋と思います」（～ないと思います）比「常體肯定形＋と思いません」（～とおもいません）更自然、更常用。","<b>總結：引用文法的兩個核心句型是什麼？</b><br><br>(1) 引用別人説的話：常體短形＋と<ruby>言<rt>い</rt></ruby>っていました。(Someone said that...)<br>(2) 表達自己的想法：常體短形＋と<ruby>思<rt>おも</rt></ruby>います。(I think that...)<br><br>兩者前面接的子句都必須以常體短形結尾，不能用敬體（です/ます）結尾；要表達否定的想法時，通常把否定放在前面的子句中（～ないと思います），而不是把「思う」本身變成否定形（～と思いません），這樣聽起來比較自然。"],"example":[{"en":"Mary said that there would be an exam tomorrow.","jp":"メアリーは<ruby>明日<rt>あした</rt></ruby><ruby>試験<rt>しけん</rt></ruby>があると<ruby>言<rt>い</rt></ruby>っていました。","rj":"Meari wa ashita shiken ga aru to itteimashita.","say":"メアリーは明日試験があると言っていました。"},{"en":"Takeshi said that he will watch a movie tonight.","jp":"たけしは<ruby>今晩<rt>こんばん</rt></ruby><ruby>映画<rt>えいが</rt></ruby>をみると<ruby>言<rt>い</rt></ruby>っていました。","rj":"Takeshi wa konban eiga o miru to itteimashita.","say":"たけしは今晩映画をみると言っていました。"},{"en":"I think Takeshi likes Mary.","jp":"たけしはメアリーが<ruby>好<rt>す</rt></ruby>きだと<ruby>思<rt>おも</rt></ruby>います。","rj":"Takeshi wa Meari ga sukida to omoimasu.","say":"たけしはメアリーが好きだと思います。"},{"en":"I think Takeshi does not like Mary.","jp":"たけしはメアリーが<ruby>好<rt>す</rt></ruby>きじゃないと<ruby>思<rt>おも</rt></ruby>います。","rj":"Takeshi wa Meari ga sukijanai to omoimasu.","say":"たけしはメアリーが好きじゃないと思います。"},{"en":"I think Mary often cooks.","jp":"めありーはよく<ruby>料理<rt>りょうり</rt></ruby>すると<ruby>思<rt>おも</rt></ruby>います。","rj":"Meari wa yoku ryouri suru to omoimasu.","say":"めありーはよく料理すると思います。"},{"en":"I think Satoshi is not a student.","jp":"さとしは<ruby>学生<rt>がくせい</rt></ruby>じゃないと<ruby>思<rt>おも</rt></ruby>います。","rj":"Satoshi wa gakuseijanai to omoimasu.","say":"さとしは学生じゃないと思います。"},{"en":"Nana said she will go to Japan.","jp":"ななは<ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>くと<ruby>言<rt>い</rt></ruby>っていました。","rj":"Nana wa nihon ni iku to itteimashita.","say":"ななは日本に行くと言っていました。"}]},{"num":118,"title":"Usage of short forms 2 - Casual conversation","vocab":[{"t":"今日（きょう / kyou）","m":"Today（今天）","say":"今日"},{"t":"ケーキ（けーき / ke-ki）","m":"Cake（蛋糕）","say":"ケーキ"},{"t":"美味しい（おいしい / oishii）","m":"Delicious（好吃、美味）","say":"美味しい"}],"grammar":["<b>文法：常體短形（short forms）總共有哪4種用法？這一課要學哪一種？</b><br><br>常體短形總共有以下四種用法：<br>(1) 用在轉述、引用別人説的話中（例如「我覺得...」「她説...」）<br>(2) 用在朋友間的輕鬆對話中，作為親密感的表現<br>(3) 用在否定的請求中（例如「請不要...」）<br>(4) 用在表達想法時（例如「我喜歡做...」或「我擅長做...」）<br><br>這一課要學的是第 (2) 種用法：朋友之間輕鬆對話時，常體短形的使用方式。","<b>文法：在朋友間輕鬆對話時，為什麼要用常體短形？用敬體（長形）又會給人什麼感覺？</b><br><br>關係親近的兩個人說話時，句尾會使用常體短形，作為表示親密感的方式；相反地，如果使用敬體（長形），則暗示說話者想要「保持一定的距離」。","<b>文法：日常輕鬆對話中使用常體短形時，有哪三個具體規則？</b><br><br>日常對話中使用常體短形時，有以下三個規則：<br>・疑問句不會用疑問助詞「か」結尾，而是單純靠上升語調來表達疑問。<br>・な形容詞、以及「名詞＋です」句型中的「だ」結尾，通常會被省略。<br>・回答用語也不同：用「うん」表示「對/是」，用「ううん」表示「不對/不是」。","<b>勉強する（べんきょうする / benkyousuru）</b><br><br>To study（唸書、學習）","<b>警察官（けいさつかん / keisatsukan）</b><br><br>Police officer（警察）","<b>總結：這一課學到常體短形在朋友間輕鬆對話中的哪些重點？</b><br><br>・疑問句省略「か」，只靠上升語調表示疑問（例如：<ruby>食<rt>た</rt></ruby>べる?／<ruby>勉強<rt>べんきょう</rt></ruby>する?）<br>・な形容詞、以及「名詞＋です」句型中的「だ」結尾通常省略（例如：<ruby>警察官<rt>けいさつかん</rt></ruby>じゃない。）<br>・肯定回答用「うん」，否定回答用「ううん」，取代敬體的「はい」「いいえ」。<br><br>---"],"example":[{"en":"Do you often eat fish?","jp":"敬體（丁寧形）：<ruby>魚<rt>さかな</rt></ruby>をよく<ruby>食<rt>た</rt></ruby>べますか?","rj":"Sakana o yoku tabemasu ka?","say":"魚をよく食べますか?"},{"en":"Do you often eat fish?","jp":"常體（短形，朋友間輕鬆對話用）：<ruby>魚<rt>さかな</rt></ruby>をよく<ruby>食<rt>た</rt></ruby>べる?","rj":null,"say":"魚をよく食べる?"},{"en":"Yes, I do.","jp":"敬體：はい。よく<ruby>食<rt>た</rt></ruby>べます。","rj":null,"say":"はい。よく食べます。"},{"en":"Is your father a police officer?","jp":"あなたのお<ruby>父<rt>とう</rt></ruby>さんは<ruby>警察官<rt>けいさつかん</rt></ruby>?","rj":"Anata no otousan wa keisatsukan?","say":"あなたのお父さんは警察官?"}]},{"num":119,"title":"Usage of short forms 3 - Please don't do","vocab":[],"grammar":["常體短形（short form）常見有4種用法：(1) 用在引述、轉述他人說的話或想法（quoted speech，例如「我覺得…」「她說…」）；(2) 用在輕鬆、隨意的對話中，作為關係親近的象徵；(3) 用來表達「請不要做…」的否定請求；(4) 用來表達想法，例如「我喜歡做…」或「我擅長做…」。本課要學的是第(3)種用法。","<b>文法：想請對方「不要做某件事」時，日文要怎麼表達？</b><br><br>當你想要求對方「不要做某件事」時，可以用動詞常體否定短形（ない形）加上「でください」來表達，句型是「Negative short form（ない形）＋でください」。でください原本是「請…」的禮貌用語，前面接動詞的ない形（否定短形）時，整體就變成「請不要做…」的否定請求。","<b>總結：本課學到的「請不要做…」句型是什麼？</b><br><br>不管動詞是る動詞、う動詞、する動詞還是不規則動詞，只要先把該動詞變成常體否定短形（ない形），再加上「でください」，就能表達「請不要做…」的否定請求：<br><br>Negative short form（ない形）＋でください ＝ 請不要做…"],"example":[{"en":"Please do not take pictures here.","jp":"ここで<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>らないでください。","rj":"Koko de shashin o toranaide kudasai.","say":"ここで写真を撮らないでください。"},{"en":"Please do not eat.","jp":"<ruby>食<rt>た</rt></ruby>べないでください。","rj":"Tabenaide kudasai.","say":"食べないでください。"},{"en":"Please do not watch.","jp":"<ruby>見<rt>み</rt></ruby>ないでください。","rj":"Minaide kudasai.","say":"見ないでください。"},{"en":"Please do not run","jp":"<ruby>走<rt>はし</rt></ruby>らないでください。","rj":"Hashiranaide kudasai.","say":"走らないでください。"},{"en":"Please do not drive","jp":"<ruby>運転<rt>うんてん</rt></ruby>しないでください。","rj":"Untenshinaide kudasai.","say":"運転しないでください。"},{"en":"Please do not come","jp":"<ruby>来<rt>こ</rt></ruby>ないでください。","rj":"Konaide kudasai.","say":"来ないでください。"},{"en":"Please do not run in the house.","jp":"<ruby>家<rt>いえ</rt></ruby>の<ruby>中<rt>なか</rt></ruby>で<ruby>走<rt>はし</rt></ruby>らないでください。","rj":"Ie no naka de hashiranaide kudasai.","say":"家の中で走らないでください。"},{"en":"Please do not eat in the library.","jp":"<ruby>図書館<rt>としょかん</rt></ruby>の<ruby>中<rt>なか</rt></ruby>で<ruby>食<rt>た</rt></ruby>べないでください。","rj":"Toshokan no naka de tabenaide kudasai.","say":"図書館の中で食べないでください。"},{"en":"Please do not drive my car.","jp":"<ruby>私<rt>わたし</rt></ruby>の<ruby>車<rt>くるま</rt></ruby>を<ruby>運転<rt>うんてん</rt></ruby>しないでください。","rj":"Watashi no kuruma o untenshinaide kudasai.","say":"私の車を運転しないでください。"},{"en":"Please do not come to the party.","jp":"パーティーに<ruby>来<rt>こ</rt></ruby>ないでください。","rj":"Pa-ti- ni konaide kudasai.","say":"パーティーに来ないでください。"}]},{"num":120,"title":"Usage of short forms 4 - I like doing","vocab":[],"grammar":["常体短形（普通形）一共有 4 種常見用法：(1) 表示轉述、引用別人說的話或自己的想法（「我覺得…」「她說…」）；(2) 用在關係親密的朋友之間的輕鬆對話；(3) 用來表達否定的請求（「請不要…」）；(4) 用來表達「我喜歡做…」「我擅長做…」這一類把動作當作名詞來談論的句子。本課只講第 (4) 種用法。","<b>動詞的常体（辞書形）要怎麼變成名詞，放進「〜が好きです」這種句型裡？</b><br><br>短形（常体）常用在「把動詞、形容詞當作名詞使用」的句子構造裡。例如わたしは〜が<ruby>好<rt>す</rt></ruby>きです／<ruby>嫌<rt>きら</rt></ruby>いです，除了可以像「わたしは<ruby>猫<rt>ねこ</rt></ruby>が好きです」一樣直接接名詞，也可以把游泳、喝咖啡、讀日文這一類「動作」放進同一個句型裡，只是動作必須先用動詞辞書形（常体・短形）＋の把它名詞化。完整句型為：<br><br>（人）は［動作：動詞辞書形］のが　<ruby>好<rt>す</rt></ruby>きです。／<ruby>嫌<rt>きら</rt></ruby>いです。／<ruby>上手<rt>じょうず</rt></ruby>です。／<ruby>下手<rt>へた</rt></ruby>です。<br>（(hito) wa [doushi jishokei] noga sukidesu / kiraidesu / jouzudesu / hetadesu.）<br><br>文法說明：のが的の是形式名詞，功能是把前面的動詞辞書形子句（例如「<ruby>泳<rt>およ</rt></ruby>ぐ」「コーヒーを<ruby>飲<rt>の</rt></ruby>む」）整個變成一個名詞子句，のが之後再接好き、嫌い、上手、下手等表示喜好或拿手程度的形容動詞。","<b>為什麼「たけしはえいごをはなしてがへたです」是錯的？のが前面應該接動詞的什麼形？</b><br><br>日文學習者很容易被英文的 -ing 形式和日文〜ている的關聯性誤導，錯把て形放進のが的前面。但のが前面一定要接動詞辞書形（原形／短形），不能用て形。<br><br>✕ たけしはえいごをはなしてがへたです。<br>○ たけしはえいごをはなすのがへたです。<br>（takeshi wa eigo o hanasu noga hetadesu.）<br><br>中譯：武志不擅長說英文。<br><br>文法說明：はなして是て形，只能用在「ている」（正在做）或「て請求」等句型；要把「說英文」這個動作名詞化放進のが前面，必須用辞書形はなす，寫成はなすのが，不能寫成はなしてが。","<b>要形容「自己」拿不拿手，跟形容「別人」拿不拿手，日文用字有什麼不同？</b><br><br>除了好き／嫌い之外，日文形容拿手程度時，還有另一組常用說法，而且依談論對象（自己 vs 別人）用字不同：<br><br>［談論自己時］<br>〜が<ruby>得意<rt>とくい</rt></ruby>です。（對…有自信、擅長…）<br>〜が<ruby>苦手<rt>にがて</rt></ruby>です。（對…沒把握、不擅長…）<br><br>［談論別人時］<br>〜が<ruby>上手<rt>じょうず</rt></ruby>です。（…很會…、擅長…）<br>〜が<ruby>下手<rt>へた</rt></ruby>です。（…不擅長…、…做得不好）<br><br>文法說明：得意／苦手主要用在描述「自己」的拿手與不拿手，語感偏向主觀的自信程度；上手／下手則常用來客觀評價「別人」的技能表現好壞（雖然上手／下手偶爾也可用於自己，但本課的分類原則以此為主）。","<b>總結：常体短形第 4 種用法「〜のが好き／嫌い／上手／下手／得意／苦手です」的整理</b><br><br>（人）は［動作：動詞辞書形］のが　<ruby>好<rt>す</rt></ruby>きです。／<ruby>嫌<rt>きら</rt></ruby>いです。／<ruby>上手<rt>じょうず</rt></ruby>です。／<ruby>下手<rt>へた</rt></ruby>です。<br>（(hito) wa [doushi jishokei] noga sukidesu / kiraidesu / jouzudesu / hetadesu.）<br><br>［談論自己時］〜が<ruby>得意<rt>とくい</rt></ruby>です（擅長、有自信）／〜が<ruby>苦手<rt>にがて</rt></ruby>です（不擅長、沒把握）<br>［談論別人時］〜が<ruby>上手<rt>じょうず</rt></ruby>です（擅長、做得好）／〜が<ruby>下手<rt>へた</rt></ruby>です（不擅長、做得不好）<br><br>文法說明：不管接的是好き／嫌いです還是得意／苦手／上手／下手です，のが前面一律只能用動詞辞書形（常体・短形），絕對不能用て形；談論自己的拿手程度慣用得意／苦手，談論別人則慣用上手／下手，這是這一課最容易混淆、也最需要記住的兩個重點。"],"example":[{"en":"I like studying Japanese.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>するのが<ruby>好<rt>す</rt></ruby>きです。","rj":"Nihongo o benkyousuru no ga suki desu.","say":"日本語を勉強するのが好きです。"},{"en":"I do not like cleaning my room.","jp":"<ruby>部屋<rt>へや</rt></ruby>を<ruby>掃除<rt>そうじ</rt></ruby>するのが<ruby>嫌<rt>きら</rt></ruby>いです。","rj":"Heya o soujisuru no ga kirai desu.","say":"部屋を掃除するのが嫌いです。"},{"en":"Robert is good at cooking.","jp":"ロバートは<ruby>料理<rt>りょうり</rt></ruby>するのが<ruby>上手<rt>じょうず</rt></ruby>です。","rj":"robaato wa ryourisuru noga jouzudesu.","say":"ロバートは料理するのが上手です。"},{"en":"Takeshi is not good at speaking English.","jp":"たけしは<ruby>英語<rt>えいご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>すのが<ruby>下手<rt>へた</rt></ruby>です。","rj":"takeshi wa eigo o hanasu noga hetadesu.","say":"たけしは英語を話すのが下手です。"},{"en":"I am good at speaking English.","jp":"わたしは英語を話すのが得意です。跟上一句用「たけし」的句子，為什麼一個用得意、一個用下手？","rj":null,"say":"わたしは英語を話すのが得意です。跟上一句用「たけし」的句子，為什麼一個用得意、一個用下手？"},{"en":"I am good at speaking English.","jp":"わたしは<ruby>英語<rt>えいご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>すのが<ruby>得意<rt>とくい</rt></ruby>です。","rj":"watashi wa eigo o hanasu noga tokuidesu.","say":"わたしは英語を話すのが得意です。"},{"en":"Marie is good at cooking Spanish food","jp":"マリーはスペイン<ruby>料理<rt>りょうり</rt></ruby>を<ruby>作<rt>つく</rt></ruby>るのが<ruby>上手<rt>じょうず</rt></ruby>です。","rj":"marii wa supein ryouri o tsukuru noga jouzudesu.","say":"マリーはスペイン料理を作るのが上手です。"},{"en":"I like playing basketball","jp":"バスケットボールをするのが<ruby>好<rt>す</rt></ruby>きです。","rj":"Basukettobo-ru o suru no ga suki desu.","say":"バスケットボールをするのが好きです。"},{"en":"I am good at(comfortable with) painting pictures.","jp":"<ruby>絵<rt>え</rt></ruby>を<ruby>描<rt>か</rt></ruby>くのが<ruby>得意<rt>とくい</rt></ruby>です。","rj":"E o kaku no ga tokui desu.","say":"絵を描くのが得意です。"},{"en":"My younger sister is bad at dancing.","jp":"<ruby>私<rt>わたし</rt></ruby>の<ruby>妹<rt>いもうと</rt></ruby>は<ruby>踊<rt>おど</rt></ruby>るのが<ruby>下手<rt>へた</rt></ruby>です。","rj":"watashi no imouto wa odoru noga hetadesu.","say":"私の妹は踊るのが下手です。"},{"en":"Misa dislikes studying math.","jp":"みさは<ruby>数学<rt>すうがく</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>するのが<ruby>嫌<rt>きら</rt></ruby>いです。","rj":"misa wa suugaku o benkyousuru noga kiraidesu.","say":"みさは数学を勉強するのが嫌いです。"},{"en":"I am uncomfortable with taking photos","jp":"<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>るのが<ruby>苦手<rt>にがて</rt></ruby>です。","rj":"Shashin o toru no ga nigate desu.","say":"写真を撮るのが苦手です。"}]},{"num":124,"title":"Past tense short forms - Affirmative Conjugation","vocab":[{"t":"總結：本課三大類過去式肯定短形規則整理","m":"- Group A（動詞）：把て形中的て/で換成た/だ。例：読んで(yonde) → 読んだ(yonda) - Group B（い形容詞）：把字尾い換成かった。例：かわいい(kawaii) → かわいかった(kawaikatta) - Group C（な形容詞、名詞+です）：把だ換成だった。例：静かだ(shizukada) → 静かだった(shizukadatta) 以上三種規則都只適用於「過去式","say":null}],"grammar":["<b>日文的過去式肯定短形（普通形）依詞性可以分成哪三大類？</b><br><br>依照詞性不同，過去式肯定短形（常體）的變化規則可以分成三大類：<br><br>- (A) 動詞：把て形（て/で）換成た/だ。例：<ruby>読<rt>よ</rt></ruby>んで(yonde) → <ruby>読<rt>よ</rt></ruby>んだ(yonda)<br>- (B) い形容詞：把字尾的い換成かった。例：かわい(kawai)い → かわいかった(kawaikatta)<br>- (C) な形容詞、以及「名詞＋です」：把だ換成だった。例：しずかだ(shizukada) → しずかだった(shizukadatta)、<ruby>学生<rt>がくせい</rt></ruby>だ(gakusei da) → <ruby>学生<rt>がくせい</rt></ruby>だった(gakusei datta)","<b>動詞（Group A）的過去式肯定短形怎麼變化？る型動詞、う型動詞、不規則動詞都適用同一個規則嗎？</b><br><br>規則是：把動詞的て形中的て/で，換成た/だ（只有過去式肯定會這樣變化，先把動詞變成て形，再把て/で換成た/だ）。無論是る型動詞（如食べる）、う型動詞（如書く、会う），或是不規則動詞（如来る），只要先變成て形，都適用同一個「て/で→た/だ」規則，不需要另外分開記憶：<br><br>- <ruby>読<rt>よ</rt></ruby>む(yomu，唸/讀) → て形：<ruby>読<rt>よ</rt></ruby>んで(yonde) → 過去式短形：<ruby>読<rt>よ</rt></ruby>んだ(yonda)<br>- <ruby>食<rt>た</rt></ruby>べる(taberu，吃，る型動詞) → て形：<ruby>食<rt>た</rt></ruby>べて(tabete) → 過去式短形：<ruby>食<rt>た</rt></ruby>べた(tabeta)<br>- <ruby>書<rt>か</rt></ruby>く(kaku，寫，う型動詞) → て形：<ruby>書<rt>か</rt></ruby>いて(kaite) → 過去式短形：<ruby>書<rt>か</rt></ruby>いた(kaita)<br>- <ruby>会<rt>あ</rt></ruby>う(au，見面，う型動詞) → て形：<ruby>会<rt>あ</rt></ruby>って(atte) → 過去式短形：<ruby>会<rt>あ</rt></ruby>った(atta)<br>- <ruby>来<rt>く</rt></ruby>る(kuru，來，不規則動詞) → て形：<ruby>来<rt>き</rt></ruby>て(kite) → 過去式短形：<ruby>来<rt>き</rt></ruby>た(kita)","<b>い形容詞（Group B）的過去式肯定短形怎麼變化？</b><br><br>規則是：把い形容詞字尾的い去掉，換成かった。<br><br>- <ruby>可愛<rt>かわい</rt></ruby>い(kawaii，可愛的) → <ruby>可愛<rt>かわい</rt></ruby>かった(kawaikatta)<br>- <ruby>面白<rt>おもしろ</rt></ruby>い(omoshiroi，有趣的) → <ruby>面白<rt>おもしろ</rt></ruby>かった(omoshirokatta)<br>- <ruby>美味<rt>おい</rt></ruby>しい(oishii，好吃的) → <ruby>美味<rt>おい</rt></ruby>しかった(oishikatta)<br>- <ruby>怖<rt>こわ</rt></ruby>い(kowai，可怕的) → <ruby>怖<rt>こわ</rt></ruby>かった(kowakatta)","<b>な形容詞、以及「名詞＋です」（Group C）的過去式肯定短形怎麼變化？</b><br><br>規則是：把現在式短形字尾的だ，換成だった。<br><br>- <ruby>静<rt>しず</rt></ruby>かな(shizukana，安靜的) → 現在式短形：<ruby>静<rt>しず</rt></ruby>かだ(shizukada) → 過去式短形：<ruby>静<rt>しず</rt></ruby>かだった(shizukadatta)<br>- <ruby>綺麗<rt>きれい</rt></ruby>な(kireina，漂亮的/乾淨的) → 現在式短形：<ruby>綺麗<rt>きれい</rt></ruby>だ(kireida) → 過去式短形：<ruby>綺麗<rt>きれい</rt></ruby>だった(kireidatta)<br>- <ruby>学生<rt>がくせい</rt></ruby>です(gakuseidesu，是學生) → 現在式短形：<ruby>学生<rt>がくせい</rt></ruby>だ(gakuseida) → 過去式短形：<ruby>学生<rt>がくせい</rt></ruby>だった(gakuseidatta)<br>- <ruby>日本人<rt>にほんじん</rt></ruby>です(nihonjindesu，是日本人) → 現在式短形：<ruby>日本人<rt>にほんじん</rt></ruby>だ(nihonjinda) → 過去式短形：<ruby>日本人<rt>にほんじん</rt></ruby>だった(nihonjindatta)","<b>過去式肯定短形有哪些不規則（例外）變化，不能套用上面的規則？</b><br><br>有兩個常見的例外，要單獨背下來：<br><br>- <ruby>行<rt>い</rt></ruby>く(iku，去)：雖然是Group A的う型動詞，但過去式短形不是規則變化的「<ruby>行<rt>い</rt></ruby>いた」，<ruby>而是不規則的行<rt>い</rt></ruby>った(itta)。<br>- いい(ii，好的)：雖然是い形容詞，但過去式短形不是規則變化的「いかった」，而是不規則的よかった(yokatta)。"],"example":[{"en":"Was the movie fun?","jp":"<ruby>映画<rt>えいが</rt></ruby>は<ruby>楽<rt>たの</rt></ruby>しかった？","rj":"Eiga wa tanoshikatta?","say":"映画は楽しかった？"},{"en":"Yeah, the movie was fun.","jp":"うん、(<ruby>映画<rt>えいが</rt></ruby>は)<ruby>楽<rt>たの</rt></ruby>しかった。","rj":"Un, (eiga wa) tanoshikatta.","say":"うん、(映画は)楽しかった。"},{"en":"No, the movie was boring.","jp":"ううん、(<ruby>映画<rt>えいが</rt></ruby>は)<ruby>退屈<rt>たいくつ</rt></ruby>だった。","rj":"Uun, (eiga wa) taikutsudatta.","say":"ううん、(映画は)退屈だった。"},{"en":"What did you do yesterday?","jp":"<ruby>昨日<rt>きのう</rt></ruby><ruby>何<rt>なに</rt></ruby>をした？","rj":"Kinou nani o shita?","say":"昨日何をした？"},{"en":"I went to the library.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>図書館<rt>としょかん</rt></ruby>に<ruby>行<rt>い</rt></ruby>った。","rj":"Watashi wa toshokan ni itta.","say":"私は図書館に行った。"}]},{"num":125,"title":"Past tense short forms - Negative Conjugation","vocab":[],"grammar":["<b>過去式否定短形（普通体）的變化規則是什麼？動詞、い形容詞、な形容詞、名詞＋です分別怎麼變？</b><br><br>這一課要學「過去式否定短形（常體）」，也就是不加です、更口語、非正式場合使用的過去否定說法。四種詞性的現在否定短形與過去否定短形對照如下：<br><br>| 詞性 | 現在否定短形 | 過去否定短形 |<br>|---|---|---|<br>| 動詞 | 読まない (yomanai) | 読まなかった (yomanakatta) |<br>| い形容詞 | 可愛くない (kawaikunai) | 可愛くなかった (kawaikunakatta) |<br>| な形容詞 | 静かじゃない (shizukajanai) | 静かじゃなかった (shizukajanakatta) |<br>| 名詞＋です | 学生じゃない (gakuseijanai) | 学生じゃなかった (gakuseijanakatta) |<br><br>說明：這四種詞性全部被歸類為「Group B」，共同規則是把現在否定短形字尾的「い」換成「かった」，例如「〜ない → 〜なかった」、「〜くない → 〜くなかった」、「〜じゃない → 〜じゃなかった」。","<b>動詞「食べる（たべる - taberu，吃）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：食べない（たべない / tabenai）  <br>過去否定短形：食べなかった（たべなかった / tabenakatta）－（過去）沒吃、不吃  <br>說明：「食べる」是Ru-verb，現在否定短形「食べない」字尾是い，屬於Group B規則，把「い」換成「かった」即得過去否定短形「食べなかった」。","<b>動詞「書く（かく - kaku，寫）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：書かない（かかない / kakanai）  <br>過去否定短形：書かなかった（かかなかった / kakanakatta）－（過去）沒寫、不寫  <br>說明：「書く」是U-verb，現在否定短形「書かない」字尾同樣是い，依Group B規則把「い」換成「かった」，得到過去否定短形「書かなかった」。","<b>動詞「会う（あう - au，見面）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：会わない（あわない / awanai）  <br>過去否定短形：会わなかった（あわなかった / awanakatta）－（過去）沒見面、沒有遇到  <br>說明：同樣依Group B規則，把現在否定短形「会わない」字尾的「い」換成「かった」，變成「会わなかった」。","<b>動詞「来る（くる - kuru，來）」是不規則動詞，過去式否定短形怎麼變化？</b><br><br>現在否定短形：来ない（こない / konai）  <br>過去否定短形：来なかった（こなかった / konakatta）－（過去）沒有來  <br>說明：「来る」雖然是不規則動詞（Irregular verb），現在否定短形變成「来ない」之後，過去否定短形的變化規則仍然一樣：把字尾「い」換成「かった」，即「来なかった」。","<b>い形容詞「可愛い（かわいい - kawaii，可愛的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：可愛くない（かわいくない / kawaikunai）  <br>過去否定短形：可愛くなかった（かわいくなかった / kawaikunakatta）－（過去）不可愛  <br>說明：い形容詞的現在否定短形字尾同樣是「い」（〜くない），依Group B規則把「い」換成「かった」，變成「〜くなかった」。","<b>い形容詞「面白い（おもしろい - omoshiroi，有趣的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：面白くない（おもしろくない / omoshirokunai）  <br>過去否定短形：面白くなかった（おもしろくなかった / omoshirokunakatta）－（過去）不有趣、不好笑  <br>說明：規則相同，把「面白くない」字尾的「い」換成「かった」，得到「面白くなかった」。","<b>い形容詞「美味しい（おいしい - oishii，好吃的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：美味しくない（おいしくない / oishikunai）  <br>過去否定短形：美味しくなかった（おいしくなかった / oishikunakatta）－（過去）不好吃  <br>說明：同樣把「美味しくない」字尾的「い」換成「かった」，得到「美味しくなかった」。","<b>い形容詞「怖い（こわい - kowai，可怕的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：怖くない（こわくない / kowakunai）  <br>過去否定短形：怖くなかった（こわくなかった / kowakunakatta）－（過去）不可怕  <br>說明：把「怖くない」字尾的「い」換成「かった」，變成「怖くなかった」。","<b>な形容詞「静かな（しずかな - shizukana，安靜的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：静かじゃない（しずかじゃない / shizukajanai）  <br>過去否定短形：静かじゃなかった（しずかじゃなかった / shizukajanakatta）－（過去）不安靜  <br>說明：な形容詞的現在否定短形字尾也是「い」（〜じゃない），依Group B規則把「い」換成「かった」，變成「〜じゃなかった」。","<b>な形容詞「綺麗な（きれいな - kireina，漂亮的、乾淨的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：綺麗じゃない（きれいじゃない / kireijanai）  <br>過去否定短形：綺麗じゃなかった（きれいじゃなかった / kireijanakatta）－（過去）不漂亮、不乾淨  <br>說明：把「綺麗じゃない」字尾的「い」換成「かった」，得到「綺麗じゃなかった」。","<b>な形容詞「元気な（げんきな - genkina，有精神的、健康的）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：元気じゃない（げんきじゃない / genkijanai）  <br>過去否定短形：元気じゃなかった（げんきじゃなかった / genkijanakatta）－（過去）沒精神、不健康  <br>說明：把「元気じゃない」字尾的「い」換成「かった」，得到「元気じゃなかった」。","<b>名詞「学生です（がくせいです - gakuseidesu，是學生）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：学生じゃない（がくせいじゃない / gakuseijanai）  <br>過去否定短形：学生じゃなかった（がくせいじゃなかった / gakuseijanakatta）－（過去）不是學生  <br>說明：名詞＋です的現在否定短形字尾同樣是「い」（〜じゃない），依Group B規則把「い」換成「かった」，變成「〜じゃなかった」。","<b>名詞「日本人です（にほんじんです - nihonjindesu，是日本人）」的過去式否定短形怎麼變化？</b><br><br>現在否定短形：日本人じゃない（にほんじんじゃない / nihonjinjanai）  <br>過去否定短形：日本人じゃなかった（にほんじんじゃなかった / nihonjinjanakatta）－（過去）不是日本人  <br>說明：把「日本人じゃない」字尾的「い」換成「かった」，得到「日本人じゃなかった」。","<b>總結：這一課「過去否定短形（Group B）」的核心規則怎麼整理？</b><br><br>規則：把現在否定短形字尾的「い」換成「かった」（Group B - All Negative: Replace the final い with かった）。這個規則統一適用於動詞（〜ない→〜なかった）、い形容詞（〜くない→〜くなかった）、な形容詞（〜じゃない→〜じゃなかった）、名詞＋です（〜じゃない→〜じゃなかった），是本課的核心重點。"],"example":[{"en":"Yeah, the movie was not fun.","jp":"ううん、（<ruby>映画<rt>えいが</rt></ruby>は）<ruby>楽<rt>たの</rt></ruby>しくなかった。","rj":"Uun, (eiga wa) tanoshikunakatta.","say":"ううん、（映画は）楽しくなかった。"},{"en":"I did not go to the library.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>図書館<rt>としょかん</rt></ruby>に<ruby>行<rt>い</rt></ruby>かなかった。","rj":"Watashi wa toshokan ni ikanakatta.","say":"私は図書館に行かなかった。"}]},{"num":126,"title":"Past tense short forms - Usage","vocab":[],"grammar":["本課接續常體（短形）的討論，說明過去式常體的三種變化規則（Group A/B/C），以及這些過去式常體實際上會在什麼場合被使用（轉述句、日常會話）。","<b>動詞的過去式肯定常體（Group A）怎麼變化？</b><br><br>規則：把て形／で形中的「て／で」換成「た／だ」。<br>＊這個規則只適用於「肯定」動詞──把動詞的「て形」轉換成「過去式肯定常體」。<br>例如「食べて」（て形）→「食べた」（過去式肯定常體），下面的例句會用到這個變化。","<b>い形容詞的過去式肯定、以及所有詞類的過去式否定（Group B）怎麼變化？</b><br><br>規則：把現在式常體字尾的「い」換成「かった」。<br>這一組規則同時涵蓋兩種情況：(1) い形容詞的過去式肯定、(2) 動詞・い形容詞・な形容詞・名詞所有詞類的過去式否定，因為這些常體的現在式字尾都是「〜ない」，只要把最後的「い」換成「かった」（變成「〜なかった」）即可。","<b>な形容詞的過去式肯定、以及「名詞+です」的過去式肯定（Group C）怎麼變化？</b><br><br>規則：把現在式常體中的「だ」換成「だった」。<br>也就是說，な形容詞或名詞句的現在式常體本來是「〜だ」，過去式常體就變成「〜だった」。","<b>總結：三組過去式常體變化規則，以及過去式常體的兩種用法</b><br><br>- Group A（動詞肯定）：て形／で形的「て／で」→「た／だ」（例：食べて→食べた、して→した）<br>- Group B（い形容詞肯定、所有詞類否定）：現在式常體字尾「い」→「かった」（例：〜ない→〜なかった）<br>- Group C（な形容詞肯定、名詞+です肯定）：現在式常體的「だ」→「だった」<br><br>過去式常體的用法和現在式常體一樣，主要出現在：(1) 轉述句／引用句中；(2) 朋友、家人之間的日常口語對話中。此外，轉述句要特別注意「時態保留原則」──引用部分的時態要跟對方原本說話時的時態一致，不會因為外層動詞（如「言っていました」）是過去式，就把引用內容也全部改成過去式。"],"example":[{"en":"Sue said that she had lunch.","jp":"すーは、お<ruby>昼<rt>ひる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べたと<ruby>言<rt>い</rt></ruby>っていました。","rj":"su- wa ohirugohan o tabeta to itteimashita.","say":"すーは、お昼ご飯を食べたと言っていました。"},{"en":"I think Tom did it.","jp":"（わたしは）とむさんがしたと<ruby>思<rt>おも</rt></ruby>います。","rj":"watashi wa) tomu-san ga shita to omoimasu.","say":"（わたしは）とむさんがしたと思います。"},{"en":"Have you eaten dinner?","jp":"<ruby>夜<rt>よる</rt></ruby>ごはん、<ruby>食<rt>た</rt></ruby>べた？","rj":"Yorugo wa n, tabeta?","say":"夜ごはん、食べた？"},{"en":"Sue said that she was studying Japanese.","jp":"すーは<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しているといっていました。","rj":"su- wa nihongo o benkyoushiteiru to itteimashita.","say":"すーは日本語を勉強しているといっていました。"}]}],"advanced":[{"num":130,"title":"Something and Anything","vocab":[{"t":"猫","m":"（ねこ - neko） Cat","say":"猫"},{"t":"持ってくる","m":"（もってくる - mottekuru） To bring","say":"持ってくる"}],"grammar":["<b>日文的「Something」和「Anything」怎麼說？</b><br><br>Something = <b>何か</b>（なにか - nanika）  <br>Anything = <b>何も</b>（なにも - nanimo）","<b>何か／何も 這類字在句子中要如何使用？（跟は、が、を的關係）</b><br><br>這些字用在原本<b>預期會出現は、が、を等助詞</b>的位置。  <br>在這種情況下，它們<b>單獨使用，不需要助詞</b>。","<b>「some」和「any」在肯定句、疑問句、否定句中，日文各是怎麼說？</b><br><br><b>Positive statement</b>（肯定句）: Something → 何か（なにか - nanika）  <br><b>Question</b>（疑問句）: Anything? → 何か（なにか - nanika）  <br><b>Negative statement</b>（否定句）: Not...anything → 何も（なにも - nanimo）＋ Negative","<b>總結：「some」和「any」在肯定句／疑問句／否定句中的日文對照，以及它們的助詞規則？</b><br><br><b>Positive statement</b>: 何か（なにか - nanika） = Something  <br><b>Question</b>: 何か（なにか - nanika） = Anything?  <br><b>Negative statement</b>: 何も（なにも - nanimo）＋ Negative = Not...anything<br><br>規則：<b>何か 和 何も 通常不接助詞</b>（usually not followed by a particle）。"],"example":[{"en":"The cat has brought something.","jp":"<ruby>猫<rt>ねこ</rt></ruby>が<ruby>何<rt>なに</rt></ruby>か<ruby>持<rt>も</rt></ruby>ってきました。","rj":"neko ga nanika mottekimashita.","say":"猫が何か持ってきました。"},{"en":"Did the cat eat anything?","jp":"<ruby>猫<rt>ねこ</rt></ruby>は<ruby>何<rt>なに</rt></ruby>か<ruby>食<rt>た</rt></ruby>べましたか？","rj":"neko wa nanika tabemashitaka?","say":"猫は何か食べましたか？"},{"en":"The cat did not eat anything.","jp":"<ruby>猫<rt>ねこ</rt></ruby>は<ruby>何<rt>なに</rt></ruby>も<ruby>食<rt>た</rt></ruby>べませんでした。","rj":"neko wa nanimo tabemasendeshita.","say":"猫は何も食べませんでした。"},{"en":"Did you eat anything at the party?","jp":"パーティーで何か食べましたか？","rj":"pa-ti- de nanika tabemashitaka?","say":"パーティーで何か食べましたか？"},{"en":"I did not eat anything at the party.","jp":"パーティーで何も食べませんでした。","rj":"pa-ti- de nanimo tabemasendeshita.","say":"パーティーで何も食べませんでした。"},{"en":"I will eat something at home.","jp":"<ruby>家<rt>いえ</rt></ruby>で何か食べます。","rj":"ie de nanika tabemasu.","say":"家で何か食べます。"}]},{"num":131,"title":"Some and Any for places, person and things","vocab":[{"t":"Places（地方）","m":"肯定/疑問：どこか（dokoka） 否定：どこも（dokomo）","say":"地方"},{"t":"Person（人）","m":"肯定/疑問：誰か（だれか, dareka） 否定：誰も（だれも, daremo）","say":"人"},{"t":"總表：","m":"Things：何か（肯定/疑問）／何も（否定） Places：どこか（肯定/疑問）／どこも（否定） Person：誰か（肯定/疑問）／誰も（否定） （\\_\\_ 代表 に・へ・で 插入的位置）","say":"何か（肯定"}],"grammar":["<b>日文中要表達「某事/某物」(something) 和「什麼事都不」(not...anything) 時，是怎麼構成的？</b><br><br>由疑問詞「何」（なに, nani）+ 助詞「か」(ka) 或「も」(mo) 組成：  <br>・「某事/某物」→ 何か（なにか, nanika）  <br>・「什麼都不」→ 何も（なにも, nanimo）<br><br>同樣的規則也適用於地方「どこ」和人「誰」。","<b><ruby>表示地方<rt>どこ</rt></ruby>、人(誰)、事物(何) 的 some/any 用法，在肯定句、疑問句、否定句中分別怎麼說？(不含其他助詞時)</b><br><br><b>Things（事物）</b>  <br>肯定/疑問：何か（なにか, nanika）  <br>否定：何も（なにも, nanimo）","<b>「何か・どこか・誰か・何も・どこも・誰も」這些詞在句中出現時，原本該加的助詞「は、が、を」要怎麼處理？</b><br><br><b>不需要加</b>。這些詞本身就取代了「は、が、を」出現的位置，直接當作主語/受詞使用。","<b>如果句子需要用到「に、へ、で」這些助詞（例如地點、對象），要放在「どこか/誰か/何か」等詞的哪個位置？肯定句/疑問句和否定句的位置一樣嗎？</b><br><br>需要加「に、へ、で」，且肯定句/疑問句與否定句<b>位置不同</b>：  <br>・肯定句、疑問句：放在「か」<b>之後</b>（例：どこ<b>か</b>+<b>へ</b> → どこかへ）  <br>・否定句：放在「も」<b>之前</b>（例：どこ+<b>に</b>+<b>も</b> → どこにも）"],"example":[{"en":"Did you go somewhere?","jp":"どこかへ行きましたか？","rj":"dokoka e ikimashita ka?","say":"どこかへ行きましたか？"},{"en":"No, I did not go anywhere.","jp":"いいえ、どこにも行きませんでした。","rj":"iie, doko ni mo ikimasendeshita.","say":"いいえ、どこにも行きませんでした。"},{"en":"Did you meet anyone?","jp":"<ruby>誰<rt>だれ</rt></ruby>かに<ruby>会<rt>あ</rt></ruby>いましたか？","rj":"dareka ni aimashitaka?","say":"誰かに会いましたか？"},{"en":"No, I did not meet anyone.","jp":"いいえ、<ruby>誰<rt>だれ</rt></ruby>にも<ruby>会<rt>あ</rt></ruby>いませんでした。","rj":"iie, dare ni mo aimasendeshita.","say":"いいえ、誰にも会いませんでした。"},{"en":"（iie, nanimo shimasendeshita.）","jp":"いいえ、<ruby>何<rt>なに</rt></ruby>もしませんでした。","rj":"Iie, nanimoshimasen deshita.","say":"いいえ、何もしませんでした。"},{"en":"（iie, nanimo kaimasendeshita.）","jp":"いいえ、<ruby>何<rt>なに</rt></ruby>も<ruby>買<rt>か</rt></ruby>いませんでした。","rj":"Iie, nanimo kaimasen deshita.","say":"いいえ、何も買いませんでした。"},{"en":"Who did you meet at the event?","jp":"イベントで<ruby>誰<rt>だれ</rt></ruby>かに<ruby>会<rt>あ</rt></ruby>いましたか？","rj":"ibento de dareka ni aimashitaka?","say":"イベントで誰かに会いましたか？"},{"en":"I did not meet anybody.","jp":"<ruby>誰<rt>だれ</rt></ruby>にも<ruby>会<rt>あ</rt></ruby>いませんでした。","rj":"dare ni mo aimasendeshita.","say":"誰にも会いませんでした。"},{"en":"（dokoni mo ikimasendeshita.）","jp":"どこにも<ruby>行<rt>い</rt></ruby>きませんでした。","rj":"Dokonimo ikimasen deshita.","say":"どこにも行きませんでした。"}]},{"num":143,"title":"Because 1 〜から","vocab":[{"t":"今晩（こんばん / konban）","m":"This evening, Tonight（今晚）","say":"今晩"},{"t":"タクシー（たくしー / takushi-）","m":"Taxi（計程車）","say":"タクシー"},{"t":"高い（たかい / takai）","m":"Expensive（貴的）","say":"高い"},{"t":"遠い（とおい / tooi）","m":"Far away（遙遠）","say":"遠い"},{"t":"病気（びょうき / byouki）","m":"Sick（生病）","say":"病気"}],"grammar":["<b>文法：「〜から」是什麼意思？什麼時候使用？</b><br><br>「から」(kara) 是接在句尾的助詞，意思是「因為」(because)。一個句子以「から」結尾時，用來說明某個情況、提議等背後的原因或理由。","<b>文法：用「から」造句時，有哪兩種語序可以選擇？</b><br><br>兩種語序都可以，意思相同：<br><br>(situation)。(explanation)から。  <br>或  <br>(explanation)から、(situation)。<br><br>也就是說，可以先講「情況/提議」，再另外用一句「原因＋から」補充說明；也可以反過來，先講「原因＋から」，再接「情況/提議」。","<b>造句的具體步驟有哪三步？</b><br><br>Step 1：找出句子裡的「情況/提議」與「原因」分別是什麼。  <br>Step 2：把「情況/提議」與「原因」分別造成完整的句子。  <br>Step 3：依照下面其中一種句子結構組合起來：<br><br>(situation)。(explanation)から。  <br>或  <br>(explanation)から、(situation)。","<b>總結：兩種語序在「句子數量」上有什麼不同？</b><br><br>雖然兩種語序表達的意思相同，但在句子結構上有差別：<br><br>(situation)。(explanation)から。→ 這是<b>兩個句子</b>（情況與原因分別獨立成句，中間用句點隔開）。<br><br>(explanation)から、(situation)。→ 這是<b>一個句子</b>（原因與情況用逗號連接在同一句話裡）。<br><br>造句時只要先找出「情況/提議」與「原因」，分別造出完整句子，再依照上面其中一種結構組合即可。"],"example":[{"en":"I will study this evening, (Because) we will have an exam tomorrow.","jp":"<ruby>今晩<rt>こんばん</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>します。<ruby>明日<rt>あした</rt></ruby>テストがありますから。","rj":"Konban benkyoushimasu. Ashita tesuto ga arimasu kara.","say":"今晩勉強します。明日テストがありますから。"},{"en":"I will study this evening, (Because) we will have an exam tomorrow.","jp":"<ruby>明日<rt>あした</rt></ruby>テストがありますから、<ruby>今晩<rt>こんばん</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>します。","rj":"Ashita tesuto ga arimasu kara, konban benkyoushimasu.","say":"明日テストがありますから、今晩勉強します。"},{"en":"Let's go by bus. (Because) taxis are expensive.","jp":"バスに<ruby>乗<rt>の</rt></ruby>りましょう。タクシーは<ruby>高<rt>たか</rt></ruby>いですから。","rj":"Basu ni norimashou. Takushi- wa takaidesu kara.","say":"バスに乗りましょう。タクシーは高いですから。"},{"en":"Let's go by bus. (Because) taxis are expensive.","jp":"タクシーは<ruby>高<rt>たか</rt></ruby>いですから、バスに<ruby>乗<rt>の</rt></ruby>りましょう。","rj":"Takushi- wa takaidesu kara, basu ni norimashou.","say":"タクシーは高いですから、バスに乗りましょう。"},{"en":"May I come to your house? Because my house is far away.","jp":"あなたの<ruby>家<rt>いえ</rt></ruby>に<ruby>来<rt>き</rt></ruby>てもいいですか? <ruby>私<rt>わたし</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>は<ruby>遠<rt>とお</rt></ruby>いですから。","rj":"Anata no ie ni kite mo ii desu ka? Watashi no ie wa tooi desu kara.","say":"あなたの家に来てもいいですか? 私の家は遠いですから。"},{"en":"May I come to your house? Because my house is far away.","jp":"<ruby>私<rt>わたし</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>は<ruby>遠<rt>とお</rt></ruby>いですから、あなたの<ruby>家<rt>いえ</rt></ruby>に<ruby>来<rt>き</rt></ruby>てもいいですか?","rj":"Watashi no ie wa tooi desu kara, anata no ie ni kite mo ii desu ka?","say":"私の家は遠いですから、あなたの家に来てもいいですか?"},{"en":"Takeshi did not come to school today because he was sick.","jp":"たけしは<ruby>学校<rt>がっこう</rt></ruby>に<ruby>来<rt>き</rt></ruby>ませんでした。たけしは<ruby>病気<rt>びょうき</rt></ruby>でしたから。","rj":"Takeshi wa gakkou ni kimasendeshita. Takeshi wa byouki deshita kara.","say":"たけしは学校に来ませんでした。たけしは病気でしたから。"},{"en":"Takeshi did not come to school today because he was sick.","jp":"たけしは<ruby>病気<rt>びょうき</rt></ruby>でしたから、たけしは<ruby>学校<rt>がっこう</rt></ruby>に<ruby>来<rt>き</rt></ruby>ませんでした。","rj":"Takeshi wa byouki deshita kara, takeshi wa gakkou ni kimasendeshita.","say":"たけしは病気でしたから、たけしは学校に来ませんでした。"}]},{"num":144,"title":"Because 2 〜ので","vocab":[{"t":"「〜ので」的基本句型公式是什麼？","m":"(理由)ので、(狀況)。 理由的部分要用短形（普通形）來接續。","say":"ので、(狀況)。 理由的部分要用短形（普通形）來接續。"},{"t":"買う（かう / kau）","m":"To buy（買）","say":"買う"},{"t":"カバン（かばん / kaban）","m":"Bag（包包）","say":"カバン"},{"t":"安い（やすい / yasui）","m":"Cheap（便宜）","say":"安い"},{"t":"人気な（にんきな / ninkina）","m":"Popular（受歡迎）","say":"人気な"},{"t":"来る（くる / kuru）","m":"To come（來）","say":"来る"},{"t":"行く（いく / iku）","m":"To go（去）","say":"行く"},{"t":"学校（がっこう / gakkou）","m":"School（學校）","say":"学校"},{"t":"病気な（びょうきな / byoukina）","m":"Sick（生病）","say":"病気な"},{"t":"「一起做…吧」（邀約他人一起做某事）的句型怎麼接？","m":"動詞ます形的語幹＋ましょう，表示「一起做…吧」。","say":null},{"t":"「去做…」（為了某個目的而前往）的句型怎麼接？","m":"動詞ます形的語幹＋に行く，表示「去做…」。","say":null},{"t":"ケーキ（けーき / ke-ki）","m":"Cake（蛋糕）","say":"ケーキ"},{"t":"明日（あした / ashita）","m":"Tomorrow（明天）","say":"明日"},{"t":"誕生日（たんじょうび / tanjoubi）","m":"Birthday（生日）","say":"誕生日"}],"grammar":["<b>「〜ので」是什麼意思？跟「〜から」相比，語意和語氣上有什麼不同？</b><br><br>「〜ので」用來表示「因為（原因），所以（結果／狀況）」，也就是為句子後半部描述的狀況說明理由。  <br>在語意上，「ので」跟「から」完全相同；但在語氣上，「ので」聽起來比「から」稍微更正式、更委婉客氣。","<b>理由部分的句尾要用什麼形式？如果句尾是な形容詞或名詞的現在肯定形，需要特別注意什麼？</b><br><br>理由部分的句尾要用短形（普通形）。  <br>但如果ので前面接的是な形容詞或名詞的現在肯定形，就要在な形容詞（語幹）或名詞和ので之間加上一個「な」。","<b>當理由句尾是な形容詞或名詞的現在肯定形時，「〜ので」的句型公式該怎麼寫？</b><br><br>(理由：な形容詞語幹／名詞) な ので、(狀況)。","<b>親切な（しんせつな / shinsetsuna）</b><br><br>Kind（親切）","<b>「〜たい」（想要做…）要怎麼接續？它本身要當作哪一種詞類來活用？</b><br><br>「〜たい」接在動詞ます形的語幹後面，表示「想要做…」。  <br>「たい」本身要當作い形容詞來活用（例如過去肯定短形是「〜たかった」）。","<b>勉強する（べんきょうする / benkyousuru）</b><br><br>To study（讀書、學習）","<b>總結：「〜ので」一般版（動詞、い形容詞）的句型公式是什麼？</b><br><br>(理由)ので、(狀況)。<br><br>理由部分直接用動詞或い形容詞的短形（普通形），接ので即可，不需要加任何多餘的字。","<b>總結：當理由句尾是な形容詞或名詞的現在肯定形時，句型公式該怎麼調整？整體來說ので跟から的語氣差異是什麼？</b><br><br>當理由句尾是な形容詞（語幹）或名詞的現在肯定形時，要在中間加上「な」：  <br>(理由：な形容詞語幹／名詞) な ので、(狀況)。<br><br>整體來說，「ので」在語意上跟「から」完全相同，都表示「因為…」；但語氣上，「ので」聽起來比「から」更正式、更委婉客氣。"],"example":[{"en":"My Japanese has improved, because I always speak Japanese.","jp":"いつも<ruby>日本語<rt>にほんご</rt></ruby>で<ruby>話<rt>はな</rt></ruby>すので、<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>上手<rt>じょうず</rt></ruby>になりました。","rj":"Itsumo nihongo de hanasu node, nihongo ga jouzu ni narimashita.","say":"いつも日本語で話すので、日本語が上手になりました。"},{"en":"I did not sleep last night, because I had a lot of homework.","jp":"<ruby>宿題<rt>しゅくだい</rt></ruby>がたくさんあったので、きのうの<ruby>夜<rt>よる</rt></ruby><ruby>寝<rt>ね</rt></ruby>ませんでした。","rj":"Shukudai ga takusan atta node, kinou no yoru nemasendeshita.","say":"宿題がたくさんあったので、きのうの夜寝ませんでした。"},{"en":"I do not like that person, because he is mean.","jp":"<ruby>彼<rt>かれ</rt></ruby>はいじわるなので、きらいです。","rj":"Kare wa ijiwaru na node, kiraidesu.","say":"彼はいじわるなので、きらいです。"},{"en":"Banks are closed, because today is a Sunday.","jp":"<ruby>今日<rt>きょう</rt></ruby>は<ruby>日曜日<rt>にちようび</rt></ruby>なので、<ruby>銀行<rt>ぎんこう</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みです。","rj":"Kyou wa nichiyoubi na node, ginkou wa yasumidesu.","say":"今日は日曜日なので、銀行は休みです。"},{"en":"I will buy this bag because this is cheap.","jp":"このカバンは<ruby>安<rt>やす</rt></ruby>いので、<ruby>買<rt>か</rt></ruby>います。","rj":"Kono kaban wa yasui node, kaimasu.","say":"このカバンは安いので、買います。"},{"en":"She is very popular because she is very kind.","jp":"<ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>親切<rt>しんせつ</rt></ruby>なので、とても<ruby>人気<rt>にんき</rt></ruby>です。","rj":"Kanojo wa shinsetsu na node, totemo ninkidesu.","say":"彼女は親切なので、とても人気です。"},{"en":"I came to Japan because I wanted to study Japanese.","jp":"<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>したかったので、<ruby>日本<rt>にほん</rt></ruby>に<ruby>来<rt>き</rt></ruby>ました。","rj":"Nihongo o benkyoushitakatta node, nihon ni kimashita.","say":"日本語を勉強したかったので、日本に来ました。"},{"en":"I did not go to school because I was sick.","jp":"<ruby>病気<rt>びょうき</rt></ruby>だったので、<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きませんでした。","rj":"Byoukidatta node, gakkou ni ikimasendeshita.","say":"病気だったので、学校に行きませんでした。"},{"en":"Let's go buy a cake because tomorrow is Ken's birthday.","jp":"<ruby>明日<rt>あした</rt></ruby>はけんの<ruby>誕生日<rt>たんじょうび</rt></ruby>なので、ケーキを<ruby>買<rt>か</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きましょう。","rj":"Ashita wa Ken no tanjoubi na node, ke-ki o kai ni ikimashou.","say":"明日はけんの誕生日なので、ケーキを買いに行きましょう。"}]},{"num":146,"title":"Comparison 1 - A is more (property) than B","vocab":[],"grammar":["<b>「の」作為代名詞的用法是什麼？什麼時候可以使用？</b><br><br>當名詞出現在形容詞（或另一個名詞）後面，而且雙方都清楚在指同一個東西時，可以用代名詞「の」(no，意思接近「…的、…的東西」)取代該名詞，藉此避免重複。","<b>如果有人問：「これはスーのバッグですか？」（這是Sue的包包嗎？），要回答「不是，那是Mary的。」日文該怎麼說？</b><br><br>いいえ、それ　は　メアリー　の　です。  <br>(Iie, sore wa Mary no desu.)<br><br>「メアリーの」＝名詞「メアリー」＋の，代替「メアリーのバッグ」（Mary的包包），省略了重複的名詞「バッグ」。","<b>「我喜歡綠色的洋裝，但我也喜歡黃色的。」這一題會用到哪些單字？</b><br><br>- Green（綠色） - 緑（みどり / midori）<br>- Dress（洋裝） - ドレス（どれす / doresu）<br>- To like（喜歡） - <ruby>好<rt>す</rt></ruby>きな（すきな / sukina，な形容詞）<br>- Yellow（黄色） - 黄色（きいろ / kiiro）<br>- Too（也／都） - 用助詞「も」表示","<b>「紐約的房租比日本的（房租）貴。」這一題會用到哪些單字？</b><br><br>- Rent（房租） - 家賃（やちん / yachin）<br>- New York（紐約） - ニューヨーク（にゅーよーく / nyu-yo-ku）<br>- Expensive（貴的／高的） - <ruby>高<rt>たか</rt></ruby>い（たかい / takai）<br>- ＊這是一個比較句","<b>「因為這本字典舊了，我要買新的。」這一題會用到哪些單字？</b><br><br>- Because（因為） - 〜から（kara）<br>- Dictionary（字典） - 辞書（じしょ / jisho）<br>- Old（舊的） - <ruby>古<rt>ふる</rt></ruby>い（ふるい / furui）<br>- To buy（買） - <ruby>買<rt>か</rt></ruby>う（かう / kau）<br>- New（新的） - <ruby>新<rt>あたら</rt></ruby>しい（あたらしい / atarashii）","<b>「我的筆電比你的（筆電）慢。」這一題會用到哪些單字？</b><br><br>- My（我的） - <ruby>私<rt>わたし</rt></ruby>の（わたしの / watashi no）<br>- Laptop（筆電） - パソコン（ぱそこん / pasokon）<br>- Slow（慢的） - <ruby>遅<rt>おそ</rt></ruby>い（おそい / osoi）<br>- Your（你的） - あなたの（anatano）<br>- ＊這是一個比較句"],"example":[{"en":"I have a black sweater.","jp":"<ruby>黒<rt>くろ</rt></ruby>いセーターを<ruby>持<rt>も</rt></ruby>っています。","rj":"Kuroise-ta- o motteimasu.","say":"黒いセーターを持っています。"},{"en":"I have a red one, too.","jp":"<ruby>赤<rt>あか</rt></ruby>いのも<ruby>持<rt>も</rt></ruby>っています。","rj":"Akai no mo motteimasu.","say":"赤いのも持っています。"},{"en":"I went to buy a dictionary.","jp":"<ruby>安<rt>やす</rt></ruby>い<ruby>辞書<rt>じしょ</rt></ruby>を<ruby>買<rt>か</rt></ruby>いに<ruby>行<rt>い</rt></ruby>きました。","rj":"Yasui jisho o kai ni ikimashita.","say":"安い辞書を買いに行きました。"},{"en":"But there were no good ones.","jp":"でもいいのがありませんでした。","rj":"Demo ii no ga arimasendeshita.","say":"でもいいのがありませんでした。"},{"en":"American ice cream is more delicious than Japanese one.","jp":"アメリカのアイスクリームのほうが日本のよりおいしいです。","rj":"Amerika no aisukuri-mu no houga nihon no yori oishiidesu.","say":"アメリカのアイスクリームのほうが日本のよりおいしいです。"},{"en":"I like the green dress.","jp":"<ruby>緑<rt>みどり</rt></ruby>のドレスが<ruby>好<rt>す</rt></ruby>きです。","rj":"Midori no doresu ga sukidesu.","say":"緑のドレスが好きです。"},{"en":"But I also like the yellow one too.","jp":"でも、<ruby>黄色<rt>きいろ</rt></ruby>のも<ruby>好<rt>す</rt></ruby>きです。","rj":"Demo, kiiro no mo sukidesu.","say":"でも、黄色のも好きです。"},{"en":"The rent in New York is more expensive than the rent in Japan.","jp":"ニューヨークの<ruby>家賃<rt>やちん</rt></ruby>のほうが、　<ruby>日本<rt>にほん</rt></ruby>のより<ruby>高<rt>たか</rt></ruby>いです。","rj":"Nyu-yo-ku no yachin no houga, nihon no yori takaidesu.","say":"ニューヨークの家賃のほうが、　日本のより高いです。"},{"en":"Because this dictionary is old, I will buy a new one.","jp":"この<ruby>辞書<rt>じしょ</rt></ruby>は<ruby>古<rt>ふる</rt></ruby>いから、　<ruby>新<rt>あたら</rt></ruby>しいのを<ruby>買<rt>か</rt></ruby>います。","rj":"Kono jisho wa furui kara, atarashii no o kaimasu.","say":"この辞書は古いから、　新しいのを買います。"},{"en":"My laptop is slower than yours.","jp":"<ruby>私<rt>わたし</rt></ruby>のパソコンのほうがあなたのより<ruby>遅<rt>おそ</rt></ruby>いです。","rj":"Watashi no pasokon no houga anata no yori osoidesu.","say":"私のパソコンのほうがあなたのより遅いです。"}]},{"num":184,"title":"〜なくちゃいけません","vocab":[{"t":"辞める（やめる / yameru）","m":"To quit（辭去、辭掉）","say":"辞める"},{"t":"バイト（ばいと / baito）","m":"Part time job（兼職、打工）","say":"バイト"}],"grammar":["<b>練習する（れんしゅうする / renshuusuru）</b><br><br>To practice（練習）","<b>掃除する（そうじする / soujisuru）</b><br><br>To clean up（打掃、清掃）","<b>「なくちゃいけません」是什麼意思？可以拆解成哪兩部分？</b><br><br>「なくちゃいけません」表示「不得不做某事」、「必須做某事」(it is necessary to do something / \"must\")。  <br>可以拆解成兩部分：  <br>・なくちゃ：大略意思是「如果不做…的話」(if you don&#x27;t do...)  <br>・いけません：大略意思是「不能去」(you cannot go)","<b>為什麼「なくちゃいけません」字面上是雙重否定，卻能表達「必須」的意思？</b><br><br>「なくちゃいけません」字面上接近「不…就不行」、「不能不做…」(you cannot go not doing...)。這種雙重否定的說法，在邏輯上反而變成了肯定的「必須」語氣。","<b>要把一個句子改成「なくちゃいけません」（必須…）的說法，具體步驟是什麼？</b><br><br><b>步驟一</b>：先把句子改成該動詞的現在否定短形（ない形）。  <br><b>步驟二</b>：把句尾的「ない」替換成「なくちゃいけません」。","<b>「なくちゃいけません」依動詞種類會怎麼變化？請以食べる、言う、する、くる為例。</b><br><br>食べる（たべる - to eat）→ 食べない (tabenai) → 食べなくちゃいけません (tabenakuchaikemasen)  <br>言う（いう - to say）→ 言わない (iwanai) → 言わなくちゃいけません (iwanakuchaikemasen)  <br>する（to do）→ しない (shinai) → しなくちゃいけません (shinakuchaikemasen)  <br>くる（to come）→ こない (konai) → こなくちゃいけません (konakuchaikemasen)<br><br>注意：くる 是不規則動詞，其ない形要變成「こない」（並非「くない」），所以なくちゃいけません形也要對應改成「こなくちゃいけません」。","<b>「いけません」在文法上屬於什麼形式？這代表它可以怎麼繼續變化？</b><br><br>「いけません」在文法上其實是動詞的「現在否定禮貌長型」（相當於一般動詞的ません形）。因此，「なくちゃいけません」可以比照一般ません形繼續變化：  <br>・改成過去式，表示「（那時）不得不…」：<b>なくちゃいけませんでした</b>  <br>・改成短縮形（常體），用於較隨性的口語，或後面要接んです等文法時：<b>なくちゃいけない</b>","<b>總結：「なくちゃいけません」還可以怎麼變化時態與語氣？</b><br><br>「いけません」文法上其實是動詞的「現在否定禮貌長型」，所以可以比照一般ません形繼續變化：  <br>・過去式（表示「以前不得不」）：なくちゃいけません → <b>なくちゃいけませんでした</b>  <br>・口語短縮形（用於較隨性的對話，或後面要接んです等文法時）：なくちゃいけません → <b>なくちゃいけない</b>"],"example":[{"en":"Because I have a test next week, I must study a lot.","jp":"<ruby>来週<rt>らいしゅう</rt></ruby>テストがあるから、たくさん<ruby>勉強<rt>べんきょう</rt></ruby>しなくちゃいけません。","rj":"Raishuu tesuto ga aru kara, takusan benkyoushi nakuchaikemasen.","say":"来週テストがあるから、たくさん勉強しなくちゃいけません。"},{"en":"I had to get up at six this morning.","jp":"<ruby>今朝<rt>けさ</rt></ruby>6<ruby>時<rt>じ</rt></ruby>に<ruby>起<rt>お</rt></ruby>きなくちゃいけませんでした。","rj":"Kesa rokuji ni oki nakuchaikemasendeshita.","say":"今朝6時に起きなくちゃいけませんでした。"},{"en":"I have to quit my part-time job.","jp":"バイトを<ruby>辞<rt>や</rt></ruby>めなくちゃいけません。","rj":"Gakkou ga isogashiku natta kara, baito o yame nakuchaikemasen.","say":"バイトを辞めなくちゃいけません。"},{"en":"I had to clean the house yesterday.","jp":"<ruby>昨日<rt>きのう</rt></ruby><ruby>家<rt>いえ</rt></ruby>を<ruby>掃除<rt>そうじ</rt></ruby>しなくちゃいけませんでした。","rj":"Kinou ie o soujishinakuchaikemasen deshita.","say":"昨日家を掃除しなくちゃいけませんでした。"},{"en":"I had to cook dinner last night.","jp":"<ruby>昨晩<rt>さくばん</rt></ruby><ruby>夜<rt>よる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>料理<rt>りょうり</rt></ruby>しなくちゃいけませんでした。","rj":"Sakuban yorugo han o ryourishinakuchaikemasen deshita.","say":"昨晩夜ご飯を料理しなくちゃいけませんでした。"}]},{"num":186,"title":"〜でしょう","vocab":[{"t":"雨が降る（あめがふる）","m":"ame ga furu 意思：下雨 (To rain / It rains)","say":"雨が降る（あめがふる）"},{"t":"興味がある（きょうみがある）","m":"kyoumi ga aru 意思：對…感興趣 (To be interested in something)","say":"興味がある（きょうみがある）"},{"t":"分かる（わかる）","m":"wakaru 意思：懂、理解 (To understand)","say":"分かる（わかる）"}],"grammar":["<b>文法：句尾表現「〜でしょう」是什麼意思？什麼時候使用？</b><br><br>「でしょう」是接在句尾的表現，意思是「大概…吧／可能…吧」，用在<b>做出推測或預測</b>的時候。","<b>文法：「でしょう」要接在什麼詞形後面？</b><br><br>でしょう 直接接在<b>動詞</b>與<b>い形容詞的普通形（短形）</b>後面，肯定、否定皆可。  <br>でしょう 也可以接在<b>な形容詞的語幹</b>與<b>名詞</b>後面。","<b>注意：</b>でしょう 是直接接在這些詞的後面，<b>不可以</b>多加「な」「の」「だ」，也就是沒有 〜なでしょう、〜のでしょう、〜だでしょう 這種說法。","<b>文法規則：「〜でしょう」現在式的肯定與否定怎麼接？</b><br><br>| 詞性     | 肯定                   | 否定                                 |<br>| -------- | ---------------------- | ------------------------------------ |<br>| 動詞     | 現在肯定短形＋でしょう | 現在否定短形＋でしょう               |<br>| い形容詞 | 現在肯定短形＋でしょう | 現在否定短形＋でしょう               |<br>| な形容詞 | 語幹＋でしょう         | 現在否定短形（〜じゃない）＋でしょう |<br>| 名詞     | 名詞＋でしょう         | 現在否定短形（〜じゃない）＋でしょう |","<b>文法規則：「〜でしょう」過去式的肯定與否定怎麼接？</b><br><br>不管是動詞、い形容詞、な形容詞還是名詞，過去式一律用：<b>過去式短形＋でしょう</b>（肯定、否定都一樣，直接把對應詞類的過去短形接在でしょう前面即可）。","<b>文法：「〜でしょう」句子可以怎麼變成問句？作用是什麼？</b><br><br>把でしょう句改成「〜でしょうか」，就變成疑問句，用來<b>邀請對方說出自己的意見或猜測</b>（相當於「你覺得…呢？」）。","<b>文法：「でしょう」的普通形（短形）是什麼？用在什麼情境？</b><br><br>でしょう 的短形是「<b>だろう</b>」，可以用來比較委婉、謹慎地表達自己的推測或分析（常搭配「〜と思います」）。","<b>文法：口語中「でしょ」是什麼？什麼時候使用？</b><br><br>在<b>輕鬆、口語的對話</b>中，可以用でしょう（帶疑問語氣，常常唸得比較短，變成「でしょ」）來<b>跟對方確認自己剛才說的理解是否正確</b>，類似中文的「…對吧？」。","<b>總結：「〜でしょう」現在式與過去式的完整接續規則整理？</b><br><br>| 詞性     | 現在肯定               | 現在否定               | 過去（肯定／否定） |<br>| -------- | ---------------------- | ---------------------- | ------------------ |<br>| 動詞     | 現在肯定短形＋でしょう | 現在否定短形＋でしょう | 過去短形＋でしょう |<br>| い形容詞 | 現在肯定短形＋でしょう | 現在否定短形＋でしょう | 過去短形＋でしょう |<br>| な形容詞 | 語幹＋でしょう         | 現在否定短形＋でしょう | 過去短形＋でしょう |<br>| 名詞     | 名詞＋でしょう         | 現在否定短形＋でしょう | 過去短形＋でしょう |<br><br>重點回顧：<br><br>- でしょう＝「大概…吧」，用於推測、預測。<br>- 動詞／い形容詞：直接用短形（普通形）接でしょう，肯定否定皆同規則。<br>- な形容詞：肯定用語幹接でしょう，否定則用現在否定短形接でしょう。<br>- 名詞：肯定直接用名詞接でしょう，否定則用現在否定短形（〜じゃない）接でしょう。<br>- 過去式：一律用過去短形接でしょう，各詞性規則相同。<br>- でしょうか：把でしょう變問句，邀請對方表達意見或猜測。<br>- だろう：でしょう的普通形（短形），用於較委婉的推測分析，常搭配と思います。<br>- でしょ：口語中でしょう的縮短唸法，帶疑問語氣，用來跟對方確認理解是否正確。"],"example":[{"en":"It will probably rain tomorrow.","jp":"<ruby>明日<rt>あした</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>るでしょう。","rj":"Ashita ame ga furu deshou.","say":"明日雨が降るでしょう。"},{"en":"It probably will not rain tomorrow.","jp":"<ruby>明日<rt>あした</rt></ruby><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らないでしょう。","rj":"Ashita ame ga furanai deshou.","say":"明日雨が降らないでしょう。"},{"en":"Hokkaido is probably cold.","jp":"<ruby>北海道<rt>ほっかいどう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>いでしょう。","rj":"Hokkaido wa samui deshou.","say":"北海道は寒いでしょう。"},{"en":"Hokkaido is probably not cold.","jp":"<ruby>北海道<rt>ほっかいどう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>くないでしょう。","rj":"Hokkaido wa samukunai deshou.","say":"北海道は寒くないでしょう。"},{"en":"Ken probably likes fish.","jp":"けんは<ruby>魚<rt>さかな</rt></ruby>が<ruby>好<rt>す</rt></ruby>きでしょう。","rj":"Ken wa sakana ga suki deshou.","say":"けんは魚が好きでしょう。"},{"en":"Ken probably does not like fish.","jp":"けんは<ruby>魚<rt>さかな</rt></ruby>が<ruby>好<rt>す</rt></ruby>きじゃないでしょう。","rj":"Ken wa sakana ga sukijanai deshou.","say":"けんは魚が好きじゃないでしょう。"},{"en":"Mako is probably a student.","jp":"まこは<ruby>学生<rt>がくせい</rt></ruby>でしょう。","rj":"Mako wa gakusei deshou.","say":"まこは学生でしょう。"},{"en":"Mako is probably not a student.","jp":"まこは<ruby>学生<rt>がくせい</rt></ruby>じゃないでしょう。","rj":"Mako wa gakusei janai deshou.","say":"まこは学生じゃないでしょう。"},{"en":"Which do you think is harder, Japanese or Korean?","jp":"<ruby>日本語<rt>にほんご</rt></ruby>と<ruby>韓国語<rt>かんこくご</rt></ruby>と、 どっちのほうが<ruby>難<rt>むずか</rt></ruby>しいでしょうか？","rj":"Nihongo to kankokugo to, docchi no hou ga muzukashii deshouka?","say":"日本語と韓国語と、 どっちのほうが難しいでしょうか？"},{"en":"I think Takeshi is probably interested.","jp":"たけしは<ruby>興味<rt>きょうみ</rt></ruby>があるだろうと思います。","rj":"Takeshi wa kyoumi ga aru darou to omoimasu.","say":"たけしは興味があるだろうと思います。"},{"en":"John, you understand Chinese, right?","jp":"ジョン、 <ruby>中国語<rt>ちゅうごくご</rt></ruby>が<ruby>分<rt>わ</rt></ruby>かるでしょ？","rj":"Jon, chuugokugo ga wakaru desho?","say":"ジョン、 中国語が分かるでしょ？"},{"en":"練習：請將「Mia will probably not eat lunch.","jp":"みあはお<ruby>昼<rt>ひる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べないでしょう。","rj":"Mia wa ohirugohan o tabenai deshou.","say":"みあはお昼ご飯を食べないでしょう。"},{"en":"練習：請將「This cake is probably very expensive.","jp":"このケーキはとても<ruby>高<rt>たか</rt></ruby>いでしょう。","rj":"Kono ke-ki wa totemo takai deshou.","say":"このケーキはとても高いでしょう。"},{"en":"練習：請將「That person is probably famous.","jp":"あの<ruby>人<rt>ひと</rt></ruby>は<ruby>有名<rt>ゆうめい</rt></ruby>でしょう。","rj":"Ano hito wa yuumei deshou.","say":"あの人は有名でしょう。"},{"en":"練習：請將「Taka is probably 25 years old.","jp":"たかは25<ruby>歳<rt>にじゅうごさい</rt></ruby>でしょう。","rj":"Taka wa nijuugo sai deshou.","say":"たかは25歳でしょう。"}]},{"num":196,"title":"あげる・くれる","vocab":[{"t":"花（はな）","m":"hana 意思：花 (flower)","say":"花（はな）"},{"t":"時計（とけい）","m":"tokei 意思：手錶、時鐘 (watch)","say":"時計（とけい）"},{"t":"両親（りょうしん）","m":"ryoushin 意思：父母、雙親 (parents)","say":"両親（りょうしん）"},{"t":"大統領（だいとうりょう）","m":"daitouryou 意思：總統 (president)","say":"大統領（だいとうりょう）"},{"t":"靴（くつ）","m":"kutsu 意思：鞋子 (shoes)","say":"靴（くつ）"},{"t":"招待状（しょうたいじょう）","m":"shoutaijou 意思：邀請函 (invitation letter)","say":"招待状（しょうたいじょう）"}],"grammar":["<b>日文有兩個表示「給」的動詞：あげる 和 くれる，這兩個字要怎麼分辨、選用哪一個？</b><br><br>選用哪一個取決於「給予的方向」，方向軸是：「他人」←「你」←「我」。<br><br><b>あげる</b>（給出去，由內往外）用在：①「我」給某人；②「你」給「我」以外的人；③「他人」給「他人」。<br><br><b>くれる</b>（給進來，由外往內）用在：①「他人」給「我」；②「他人」給「你」；③「你」給「我」。","<b>あげる／くれる 的句型公式是什麼？助詞怎麼用？</b><br><br>(Giver)が／は　(Recipient)に　(物)を　あげる／くれる。<br><br>兩者皆以「給予者（Giver）」為主語，用助詞「は／が」；「接受者（Recipient）」則用助詞「に」。","<b>當「與自己非常親近的人」收到東西時，可以怎麼用 くれる？</b><br><br>當家人、摯友收到東西，而自己也覺得受惠時，即使自己不是接受者本人，也可以用 くれる。例如：大統領（だいとうりょう）が　妹（いもうと）に　手紙（てがみ）を　くれました。（大統領給我妹妹一封信。）因為妹妹是自己的家人，所以用 くれる 而非 もらう。"],"example":[{"en":"I will give Maki flowers.","jp":"<ruby>私<rt>わたし</rt></ruby>はまきに<ruby>花<rt>はな</rt></ruby>をあげます。","rj":"Watashi wa maki ni hana o agemasu.","say":"私はまきに花をあげます。"},{"en":"Tomo gave Saki a watch.","jp":"ともはさきに<ruby>時計<rt>とけい</rt></ruby>をあげました。","rj":"Tomo wa saki ni tokei o agemashita.","say":"ともはさきに時計をあげました。"},{"en":"My parents may give me a new car.","jp":"<ruby>両親<rt>りょうしん</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>に<ruby>車<rt>くるま</rt></ruby>をくれるかもしれません。","rj":"Ryoushin wa watashi ni kuruma o kureru kamoshiremasen.","say":"両親は私に車をくれるかもしれません。"},{"en":"The President gave my little sister a letter.","jp":"<ruby>大統領<rt>だいとうりょう</rt></ruby>が<ruby>妹<rt>いもうと</rt></ruby>に<ruby>手紙<rt>てがみ</rt></ruby>をくれました。","rj":"Daitouryou ga imouto ni tegami o kuremashita.","say":"大統領が妹に手紙をくれました。"},{"en":"I will give shoes to Kota.","jp":"<ruby>私<rt>わたし</rt></ruby>はこうたに<ruby>靴<rt>くつ</rt></ruby>をあげます。","rj":"Watashi wa Kouta ni kutsu o agemasu.","say":"私はこうたに靴をあげます。"},{"en":"What did you give to your mother?","jp":"あなたはお<ruby>母<rt>かあ</rt></ruby>さんに<ruby>何<rt>なに</rt></ruby>をあげましたか。","rj":"Anata wa okaasan ni nani o agemashita ka.","say":"あなたはお母さんに何をあげましたか。"},{"en":"My older sister gave me a book.","jp":"お<ruby>姉<rt>ねえ</rt></ruby>ちゃんは<ruby>本<rt>ほん</rt></ruby>をくれました。","rj":"Oneechan wa hon o kuremashita.","say":"お姉ちゃんは本をくれました。"},{"en":"Did Takako give you anything?","jp":"たかこはあなたに<ruby>何<rt>なに</rt></ruby>かくれましたか。","rj":"Takako wa anata ni nanika kuremashita ka.","say":"たかこはあなたに何かくれましたか。"},{"en":"Michiru did not give Takashi an invitation letter.","jp":"みちるはたかしに<ruby>招待状<rt>しょうたいじょう</rt></ruby>をあげませんでした。","rj":"Michiru wa Takashi ni shoutaijou o agemasen deshita.","say":"みちるはたかしに招待状をあげませんでした。"}]},{"num":197,"title":"もらう","vocab":[{"t":"辞書（じしょ）","m":"jisho 意思：字典 (dictionary)","say":"辞書（じしょ）"},{"t":"姉（あね）","m":"ane 意思：姊姊 (older sister)","say":"姉（あね）"},{"t":"手紙（てがみ）","m":"tegami 意思：信 (letter)","say":"手紙（てがみ）"},{"t":"妹（いもうと）","m":"imouto 意思：妹妹 (little sister)","say":"妹（いもうと）"},{"t":"チョコレート（ちょこれーと）","m":"chokore-to 意思：巧克力 (chocolate)","say":"チョコレート（ちょこれーと）"},{"t":"プレゼント（ぷれぜんと）","m":"purezento 意思：禮物 (present)","say":"プレゼント（ぷれぜんと）"},{"t":"友達（ともだち）","m":"tomodachi 意思：朋友 (friend)","say":"友達（ともだち）"},{"t":"酒（さけ）","m":"sake 意思：酒 (sake)","say":"酒（さけ）"},{"t":"何か（なにか）","m":"nanika 意思：什麼（疑問） (anything)","say":"何か（なにか）"}],"grammar":["<b>もらう 是什麼意思？跟 くれる 有什麼關係？</b><br><br>用 くれる 描述的授受行為，也可以改由「接受」的角度，用 もらう 來表達。もらう 與 くれる 一樣，代表說話者立場偏向接受者。","<b>もらう 的句型公式與助詞規則是什麼？</b><br><br>(Recipient)は／が　(Giver)に／から　(物)を　もらう。「接受者」為主語，用「は／が」；「給予者」用「に」或「から」，兩者皆可。もらう 是 u-verb（五段動詞）：もらう→もらいます／もらいました／もらいませんでした。","<b>為什麼「給予者是我」時不能用 もらう？</b><br><br>因為 もらう 代表說話者立場偏向接受者，若給予者是「我」，就違反了這個立場。例如不能說「あなたは私から手紙をもらいましたか」。","<b>站在第三者角度時，もらう 可以怎麼使用？</b><br><br>若能站在接受者的角度，第三者之間的授受也可以用 もらう。例如：妹（いもうと）は　大統領（だいとうりょう）から　手紙（てがみ）を　もらいました。"],"example":[{"en":"I received a dictionary from my older sister.","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>姉<rt>あね</rt></ruby>に<ruby>辞書<rt>じしょ</rt></ruby>をもらいました。","rj":"Watashi wa ane ni jisho o moraimashita.","say":"私は姉に辞書をもらいました。"},{"en":"Did you receive a letter from Kei?","jp":"あなたはけいに<ruby>手紙<rt>てがみ</rt></ruby>をもらいましたか。","rj":"Anata wa Kei ni tegami o moraimashita ka.","say":"あなたはけいに手紙をもらいましたか。"},{"en":"I received a chocolate from Mary.","jp":"<ruby>私<rt>わたし</rt></ruby>はメアリーからチョコレートをもらいました。","rj":"Watashi wa Meari- kara chokore-to o moraimashita.","say":"私はメアリーからチョコレートをもらいました。"},{"en":"Tomoka received a present from her friends.","jp":"ともかは<ruby>友達<rt>ともだち</rt></ruby>からプレゼントをもらいました。","rj":"Tomoka wa tomodachi kara purezento o moraimashita.","say":"ともかは友達からプレゼントをもらいました。"},{"en":"Sato did not receive sake from Tadashi.","jp":"さとはただしから<ruby>酒<rt>さけ</rt></ruby>をもらいませんでした。","rj":"Sato wa Tadashi kara sake o moraimasen deshita.","say":"さとはただしから酒をもらいませんでした。"},{"en":"Did Miki receive anything from Kai?","jp":"みきはかいから<ruby>何<rt>なに</rt></ruby>かもらいましたか。","rj":"Miki wa Kai kara nanika moraimashita ka.","say":"みきはかいから何かもらいましたか。"}]},{"num":198,"title":"〜たらどうですか","vocab":[{"t":"薬（くすり）","m":"kusuri 意思：藥 (medicine)","say":"薬（くすり）"},{"t":"薬を飲む（くすりをのむ）","m":"kusuri o nomu 意思：吃藥 (to take medicine)","say":"薬を飲む（くすりをのむ）"},{"t":"貯金する（ちょきんする）","m":"chokin suru 意思：存錢 (to save money)","say":"貯金する（ちょきんする）"},{"t":"病院（びょういん）","m":"byouin 意思：醫院 (hospital)","say":"病院（びょういん）"},{"t":"寝る（ねる）","m":"neru 意思：睡覺 (to sleep)","say":"寝る（ねる）"},{"t":"買う（かう）","m":"kau 意思：買 (to buy)","say":"買う（かう）"},{"t":"新しい（あたらしい）","m":"atarashii 意思：新的 (new)","say":"新しい（あたらしい）"},{"t":"かばん（かばん）","m":"kaban 意思：包包 (bag)","say":"かばん（かばん）"}],"grammar":["<b>〜たらどうですか 是什麼意思？要怎麼接？</b><br><br>動詞後接「たらどうですか」，用來表示建議、勸告，相當於英文「Why don't you 〜?」。開頭的「た」就是動詞過去式常體肯定（短形）的語尾。句型：[動詞過去式常體肯定]＋らどうですか？","<b>口語會話中，〜たらどうですか 可以怎麼縮短？</b><br><br>口語中可縮短為「らどう？」或「ら？」。","<b>使用〜たらどうですか 時要注意什麼？</b><br><br>たらどうですか 有時帶有責備語氣（責怪對方為何還沒去做），所以除非對方主動來找你商量，否則最好不要使用。此外，這個句型不能用來邀約——想邀朋友來玩，應該用「〜ませんか」，而不是たらどうですか。"],"example":[{"en":"Why don't you study more (harder)?","jp":"もっと<ruby>勉強<rt>べんきょう</rt></ruby>したらどうですか？","rj":"Motto benkyou shitara dou desu ka?","say":"もっと勉強したらどうですか？"},{"en":"How about taking some medicine?","jp":"<ruby>薬<rt>くすり</rt></ruby>を<ruby>飲<rt>の</rt></ruby>んだらどうですか？","rj":"Kusuri o nondara dou desu ka?","say":"薬を飲んだらどうですか？"},{"en":"Why don't you go to the hospital?","jp":"<ruby>病院<rt>びょういん</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったらどうですか？","rj":"Byouin ni ittara dou desu ka?","say":"病院に行ったらどうですか？"},{"en":"Why don't you sleep more?","jp":"もっと<ruby>寝<rt>ね</rt></ruby>たらどうですか？","rj":"Motto netara dou desu ka?","say":"もっと寝たらどうですか？"},{"en":"Why don't you buy a new bag?","jp":"<ruby>新<rt>あたら</rt></ruby>しいかばんを<ruby>買<rt>か</rt></ruby>ったらどう？","rj":"Atarashii kaban o kattara dou?","say":"新しいかばんを買ったらどう？"},{"en":"Why don't you save money?","jp":"<ruby>貯金<rt>ちょきん</rt></ruby>したらどう？","rj":"Chokin shitara dou?","say":"貯金したらどう？"}]},{"num":199,"title":"Number + もしか","vocab":[{"t":"猫（ねこ）","m":"neko 意思：貓 (cat)","say":"猫（ねこ）"},{"t":"傘（かさ）","m":"kasa 意思：雨傘 (umbrella)","say":"傘（かさ）"},{"t":"犬（いぬ）","m":"inu 意思：狗 (dog)","say":"犬（いぬ）"},{"t":"おにぎり（おにぎり）","m":"onigiri 意思：飯糰 (onigiri)","say":"おにぎり（おにぎり）"},{"t":"食べる（たべる）","m":"taberu 意思：吃 (to eat)","say":"食べる（たべる）"},{"t":"車（くるま）","m":"kuruma 意思：車 (car)","say":"車（くるま）"},{"t":"匹（びき／ひき）（-）","m":"biki / hiki 意思：（動物）量詞 (counter for animals)","say":"匹（びき／ひき）（-）"},{"t":"本（ほん／ぼん）（-）","m":"hon / bon 意思：（細長物）量詞 (counter for long objects)","say":"本（ほん／ぼん）（-）"},{"t":"個（こ／ご）（-）","m":"ko / go 意思：（小物）量詞 (counter for small items)","say":"個（こ／ご）（-）"},{"t":"台（だい）（-）","m":"dai 意思：（車輛、機器）量詞 (counter for vehicles/machines)","say":"台（だい）（-）"}],"grammar":["<b>日文表達數量的基本結構是什麼？</b><br><br>名詞　が／を　＋　數量詞。例如：家（いえ）に　猫（ねこ）が　3匹（びき）います。（家裡有三隻貓）","<b>數量詞後面加「も」是什麼意思？</b><br><br>在數量詞後加「も」，表示「數量比預期多」的語感，相當於中文「多達…、竟有…」。例如：家（いえ）に　猫（ねこ）が　3匹（びき）も　います。（家裡竟然有三隻貓之多！）","<b>數量詞後面加「しか」是什麼意思？要注意什麼？</b><br><br>在數量詞後加「しか」，並將述語改為否定形，表示「數量比預期少、只有」的語感。例如：家（いえ）に　猫（ねこ）が　3匹（びき）しか　いません。（家裡只有三隻貓而已）——しか 後面一定要接否定形。"],"example":[{"en":"There are three cats in our house.","jp":"<ruby>家<rt>いえ</rt></ruby>に<ruby>猫<rt>ねこ</rt></ruby>が3<ruby>匹<rt>びき</rt
